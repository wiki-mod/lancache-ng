
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: release manifest -- first-party/external images, tag channels,
# and the image retention policy.
# Why: consumed by the release/promotion CI workflow and
# scripts/untracked/validate-stack-images.sh as the single source of release state.
# From: PR #432
#
# What: master publishes `latest` continuously; current_dev publishes
# `nightly` once daily plus on-demand, gated on a green build+scan.
# Why: see docs/release-versioning.md's "Branch/channel model" section
# and nightly-refresh.yml for the full current mechanism.
# From: PR #1142 | PR #1251
schema: stack-images/v1
generated_from: origin/master
registry: ghcr.io
image_prefix: wiki-mod/lancache-ng
retention:
  minimum_stable_releases: 3
  # What: raises accepted_ordinary_roots_per_package from 10 to 30.
  # Why: a burst of concurrently open, YAML/governance-only PRs still
  # produces one new sha-<commit> image per push; a ten-slot window could
  # evict still-relevant recent history during a busy review period.
  # From: Issue #1095 | PR #1501.
  accepted_ordinary_roots_per_package: 30
  # What: per-package safety-buffer count for a version whose tags are
  # neither a recognized sha-<commit> root nor a protected channel/release.
  # Why: v1.2's inverted protection model stops treating an
  # unrecognized tag shape as a permanent protect; this buffer still keeps
  # the newest few such versions regardless of age, in case they are a
  # recent/in-flight or historical-format publish rather than truly stale.
  # From: Issue #1585.
  channel_buffer_versions: 5
  keep_mutable_channels:
    - latest
    - nightly
  keep_sha_tags_for_supported_releases: true
  protect_release_and_rollback_digests: true
  # What: maintainer-curated list of exact sha256:<64-hex> digests explicitly
  # designated as protected rollback targets, empty until a maintainer adds
  # one after a real regression is found.
  # Why: closes the "DECISION NEEDED" rollback-anchor gap -- a rollback
  # target is an explicit maintainer judgment call, not something Git
  # history or GHCR tag state can derive on its own, so it needs its own
  # declared list (see docs/release-versioning.md's Retention section).
  # From: Issue #1095 | PR #1501.
  rollback_anchors:
  deletion_policy: manual-or-approved-automation-only
channels:
  sha:
    tag: sha-<commit>
    mutable: false
    description: Immutable build identity tag for every first-party image.
  nightly:
    tag: nightly
    mutable: true
    description: Tested pre-stable integration channel, built from current_dev's tip once daily plus on-demand (not continuously on every push).
  release_candidate:
    tag: vX.Y.Z-rc.N
    mutable: false
    description: Release candidate tag. GitHub releases must be prereleases.
  stable_release:
    tag: vX.Y.Z
    mutable: false
    description: Stable release tag.
  latest:
    tag: latest
    mutable: true
    description: Latest stable release, published continuously from master. Only the gated promote job may move this tag; nightly builds must not.
runtime:
  - name: proxy
    image: ghcr.io/wiki-mod/lancache-ng/proxy
    source: services/proxy/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
  - name: dns
    image: ghcr.io/wiki-mod/lancache-ng/dns
    source: services/dns/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
      - deploy/secondary/docker-compose.yml
  - name: watchdog
    image: ghcr.io/wiki-mod/lancache-ng/watchdog
    source: services/watchdog/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
  - name: dhcp
    image: ghcr.io/wiki-mod/lancache-ng/dhcp
    source: services/dhcp/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      # What: deploy/quickstart/docker-compose.yml defines a `dhcp` too.
      # Why: never updated when quickstart grew its own Kea/dnsmasq-proxy
      # DHCP path, so scripts/untracked/validate-stack-images.sh had nothing to check.
      # From: Issue #849
      - deploy/quickstart/docker-compose.yml
  - name: dhcp-proxy
    image: ghcr.io/wiki-mod/lancache-ng/dhcp-proxy
    source: services/dhcp-proxy/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      # What: same gap as dhcp above.
      # From: Issue #849
      - deploy/quickstart/docker-compose.yml
  - name: ntp
    image: ghcr.io/wiki-mod/lancache-ng/ntp
    source: services/ntp/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      # What: same gap as dhcp/dhcp-proxy above (AG-WF-011 failure class).
      # From: Issue #849
      - deploy/quickstart/docker-compose.yml
  - name: ui
    image: ghcr.io/wiki-mod/lancache-ng/ui
    source: services/ui/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
  - name: syslog
    image: ghcr.io/wiki-mod/lancache-ng/syslog
    source: services/syslog/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
tooling:
  - name: build-tools
    image: ghcr.io/wiki-mod/lancache-ng/build-tools
    source: tools/build-tools/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    consumers:
      - .github/workflows/build-push.yml
      - docs/self-hosted-actions-runner.md
      - docs/ui-rust-dev-checks.md
  - name: utilities
    image: ghcr.io/wiki-mod/lancache-ng/utilities
    source: services/utilities/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    description: >-
      Shared non-compiler CLI-tools image (curl, nano, lsof, ripgrep,
      findutils, coreutils, gettext-envsubst, jq, ca-certificates, zstd),
      consumed via COPY --from= by six first-party images (issue #1556)
      instead of each one independently installing/building its own copy.
    consumers:
      - services/proxy/Dockerfile
      - services/dns/Dockerfile
      - services/ui/Dockerfile
      - services/dhcp/Dockerfile
      - services/dhcp-proxy/Dockerfile
      - services/ntp/Dockerfile
metadata:
  - name: stack
    image: ghcr.io/wiki-mod/lancache-ng/stack
    source: .github/workflows/build-push.yml
    platforms:
      - linux/amd64
      - linux/arm64
    description: Single channel pointer that resolves mutable stack channels to an immutable sha-* image set.
legacy:
  - name: proxy-standard
    status: retired
    replacement: proxy
    note: The unified proxy image replaced the old split proxy-standard package.
  - name: fluent-bit
    status: retired
    replacement: syslog
    note: >-
      The previously separate, third-party-pinned fluent-bit image
      (cr.fluentbit.io/fluent/fluent-bit:3.2.10) is now bundled into this
      project's own first-party syslog image (services/syslog/Dockerfile),
      which copies this exact same pinned binary plus its full glibc shared
      library closure into a stable Alpine base rather than depending on
      Alpine's unpinnable edge/testing package. No external pull of this
      image happens anymore.
  - name: syslog-ng
    status: retired
    replacement: syslog
    note: >-
      The previously separate, third-party-pinned syslog-ng image
      (balabit/syslog-ng:latest) is replaced by Alpine's own stable-repo
      syslog-ng package (4.7.1-r1 on Alpine 3.20 at the original migration,
      now 4.11.0-r0 on Alpine 3.24 following issue #1554's base-image pin
      sync), bundled into this project's own first-party syslog image
      (services/syslog/Dockerfile) alongside fluent-bit. No external pull of
      this image happens anymore.
external:
  - name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    policy: digest-pinned
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
  - name: nats
    image: nats:2-alpine@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
    policy: digest-pinned
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
  - name: netdata
    image: netdata/netdata@sha256:a130dbbf3d6e6a5472efdebaa123797190a5822627e908106d34edae02bc8a74
    policy: digest-pinned
    compose:
      - deploy/prod/docker-compose.yml
      - deploy/quickstart/docker-compose.yml
  - name: busybox
    image: busybox:stable-musl@sha256:3c6ae8008e2c2eedd141725c30b20d9c36b026eb796688f88205845ef17aa213
    policy: digest-pinned
    compose: []
