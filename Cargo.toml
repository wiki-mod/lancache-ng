
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: root Cargo workspace for 5 first-party crates.
# Why: unifies lockfiles; ends cross-service version drift.
# From: Issue #1095

[workspace]
resolver = "3"
members = [
    "services/dns/nats-subscriber",
    "services/ui",
    "services/warmer",
    "services/watchdog",
    "tools/pxe-client-probe",
]

# What: no [workspace.dependencies] table added here.
# Why: scope is lockfile unification, not a dep refactor.
# From: Issue #1095

# What: workspace-wide release profile: fat LTO, 2 CGUs.
# Why: cargo ignores a member's own [profile.release].
# From: Issue #1095
[profile.release]
lto = "fat"
codegen-units = 2
