
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: root Cargo workspace for 5 first-party crates.
# Why: one workspace; cargo resolves one lock per build.
# From: Issue #1095

[workspace]
resolver = "3"
members = [
    "services/dns/nats-subscriber",
    "services/ui",
    "services/cachehamster",
    "services/watchdog",
    "tools/pxe-client-probe",
]

# What: no [workspace.dependencies] table added here.
# Why: members keep their own dependency entries.
# From: Issue #1095

# What: no lto/codegen-units keys in [profile.release] here.
# Why: sourced from CARGO_PROFILE_RELEASE_LTO/_CODEGEN_UNITS env vars.
# From: Issue #1095
[profile.release]
