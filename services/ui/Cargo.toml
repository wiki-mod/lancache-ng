
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-ui Admin UI binary.
# Why: single binary crate; src/main.rs is the only source.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-ui"
edition.workspace = true
license.workspace = true

# What: explicit bin target, same as cargo's default
# Why: ci.sh tells a bin crate from a library by it
# From: Issue #1683 | PR #1905
[[bin]]
name = "lancache-ui"
path = "src/main.rs"

# What: crates the ui binary links.
# Why: versions come from the workspace manifest.
# From: Issue #1683 | PR #1858
[dependencies]
LanCache-NG = { path = "../common" }
argon2 = { workspace = true }
axum = { workspace = true, features = ["form"] }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tera = { workspace = true }
tokio = { workspace = true }
