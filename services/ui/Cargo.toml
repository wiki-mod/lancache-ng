
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-ui Admin UI.
# Why: server, Docker/NATS/Kea/syslog clients and templates.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# What: lib target exposing the pure parsers to fuzzing.
# Why: removed when the ui source becomes one main.rs.
# From: Issue #1252
[lib]
name = "lancache_ui"
path = "src/lib.rs"

[[bin]]
name = "lancache-ui"
path = "src/main.rs"

# What: runtime crates are optional (feature runtime).
# Why: the fuzz build links the lib without tokio.
# From: Issue #1252
[dependencies]
lancache-common = { path = "../common" }
axum = { workspace = true, features = ["form"] }
tokio = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
bollard = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
async-nats = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
nkeys = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
dhcproto = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[features]
default = ["runtime"]
runtime = [
    "dep:tokio",
    "dep:tera",
    "dep:bollard",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:regex",
    "dep:base64",
    "dep:futures-util",
    "dep:async-nats",
    "dep:rusqlite",
    "dep:rand",
    "dep:hex",
    "dep:form_urlencoded",
    "dep:subtle",
    "dep:sha2",
    "dep:argon2",
    "dep:nkeys",
    "dep:data-encoding",
    "dep:zstd",
    "dep:flate2",
    "dep:dhcproto",
    "dep:time",
]

# What: tower util feature, tests only.
# Why: oneshot drives the router in basic_auth tests.
# From: Issue #680
[dev-dependencies]
tower = { workspace = true }
