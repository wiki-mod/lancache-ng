# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-ui Admin UI, one main.rs.
# Why: server, Docker/NATS/Kea/syslog clients and templates.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lancache-ui"
path = "src/main.rs"

[dependencies]
lancache-common = { path = "../common" }
anyhow = { workspace = true }
argon2 = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true, features = ["form"] }
base64 = { workspace = true }
data-encoding = { workspace = true }
dhcproto = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
nkeys = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tera = { workspace = true }
time = { workspace = true, features = ["macros", "parsing"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = { workspace = true }
