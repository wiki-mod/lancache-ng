# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# cargo-fuzz harness crate for lancache-ui (issue #1252): fuzzes the Kea
# config-get reservation-entry parsing path and the Netdata proxy's
# allowlisted-path/query-parameter URL builder, both against the real
# lancache_ui library (see ../src/lib.rs), not a reimplementation of them.

[package]
name = "lancache-ui-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Derives structured (path, query-params) fuzz input from raw bytes for the
# netdata_url_parse target -- build_netdata_url takes 3 typed arguments, not
# a single byte slice, so raw libFuzzer bytes need an Arbitrary-derived
# intermediate type rather than being parsed as JSON like the other target.
arbitrary = { version = "1", features = ["derive"] }

[dependencies.lancache-ui]
path = ".."
# Opts out of the "runtime" feature (tokio/bollard/async-nats/rusqlite/etc. --
# see the parent Cargo.toml's [dependencies]/[features] comments): these fuzz
# targets only exercise the pure kea_response_parse/netdata_url modules in
# src/lib.rs, and compiling tokio's "full" feature set under cargo-fuzz's
# sanitizer instrumentation hit a real rustc ICE (confirmed empirically,
# same issue as services/dns/nats-subscriber/fuzz/Cargo.toml).
default-features = false

# Prevents `cargo fmt`/`cargo test`/`cargo clippy --workspace`-style tooling
# run from the parent crate from also trying to treat this directory as one
# of its own workspace members; this fuzz crate is only ever invoked directly
# via `cargo fuzz run --fuzz-dir services/ui/fuzz ...`.
[workspace]

[[bin]]
name = "kea_reservation_parse"
path = "fuzz_targets/kea_reservation_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netdata_url_parse"
path = "fuzz_targets/netdata_url_parse.rs"
test = false
doc = false
bench = false
