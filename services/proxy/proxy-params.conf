
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: body of location / in http.conf and https.conf
# Why: one access and cache policy for both listeners

# What: refuse clients outside the client allow map.
# Why: only LAN clients may use the cache.
if ($lancache_client_allowed = 0) {
    return 403;
}

# What: refuse hosts outside the CDN allow map.
# Why: the proxy must not relay arbitrary sites.
if ($cdn_host_allowed = 0) {
    return 403;
}

# What: fetch from the real origin over HTTPS.
# Why: Host names the CDN the client asked for.
proxy_pass https://$host$request_uri;

# What: cache in slices of the SOT size, keyed by range
# Why: large files cache in parts; no query string in key
slice                  ${CACHE_SLICE_SIZE};
proxy_cache            lancache;
proxy_cache_key        "$host$uri$slice_range";
proxy_set_header       Range $slice_range;

# What: one origin fetch per object; SOT lock timeout
# Why: concurrent requests share one fetch of large files
proxy_cache_lock       on;
proxy_cache_lock_timeout ${NGINX_CACHE_LOCK_TIMEOUT};

# What: SOT validity times; stale copy on origin failure
# Why: clients keep downloading while the origin fails
proxy_cache_valid      200 206 301 302 ${CACHE_VALID_HIT};
proxy_cache_valid      any ${CACHE_VALID_ANY};
proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;

# What: four origin headers ignored for caching and hidden
# Why: game files stay cached; clients get no shorter expiry
# From: PR #1472
proxy_ignore_headers   Cache-Control Expires Vary Set-Cookie;
proxy_hide_header      Set-Cookie;
proxy_hide_header      Vary;
proxy_hide_header      Cache-Control;
proxy_hide_header      Expires;

# What: HTTPS to origin, SNI from host, cert chain verified
# Why: origin names avoid LanCache DNS, which could loop
proxy_ssl_server_name          on;
proxy_ssl_name                 $host;
proxy_ssl_verify               on;
proxy_ssl_verify_depth         ${NGINX_SSL_VERIFY_DEPTH};
proxy_ssl_trusted_certificate  /etc/ssl/certs/ca-certificates.crt;

# What: SOT connect, send and read timeouts to origin
# Why: large game downloads can exceed default timeouts
proxy_connect_timeout     ${NGINX_UPSTREAM_CONNECT_TIMEOUT}s;
proxy_send_timeout        ${NGINX_UPSTREAM_IDLE_TIMEOUT}s;
proxy_read_timeout        ${NGINX_UPSTREAM_IDLE_TIMEOUT}s;

# What: SOT cap and write size of origin temp files
# Why: large downloads are buffered while written to cache
proxy_max_temp_file_size  ${NGINX_MAX_TEMP_FILE_SIZE};
proxy_temp_file_write_size ${NGINX_TEMP_FILE_WRITE_SIZE};

# What: HTTP/1.1 to origin with host, client IP, no gzip
# Why: one uncompressed cache object serves every client
proxy_http_version     1.1;
proxy_set_header       Connection "";
proxy_set_header       Host $host;
proxy_set_header       X-Real-IP $remote_addr;
proxy_set_header       Accept-Encoding "";

# What: cache status and proxy name on every response
# Why: clients and checks see hit or miss per request
add_header             X-Cache-Status $upstream_cache_status;
add_header             X-Served-By    lancache-ng;
