
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: included in the HTTP and HTTPS location blocks
# Why: one cache and upstream policy for both listeners

slice                  ${CACHE_SLICE_SIZE};

proxy_cache            lancache;
proxy_cache_key        "$host$uri$slice_range";
proxy_set_header       Range $slice_range;
proxy_cache_lock       on;
# What: cache-fill waiters pass to origin uncached after 2 h
# Why: concurrent requests share one fetch of large files
proxy_cache_lock_timeout 2h;
proxy_cache_valid      200 206 301 302 ${CACHE_VALID_HIT};
proxy_cache_valid      any ${CACHE_VALID_ANY};
proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;

# What: four origin headers ignored for caching and hidden
# Why: game files stay cached; clients get no shorter expiry
# From: PR #1472
proxy_ignore_headers   Cache-Control Expires Vary Set-Cookie;
proxy_hide_header      Set-Cookie;
proxy_hide_header      Vary;
proxy_hide_header      Cache-Control;
proxy_hide_header      Expires;

# What: HTTPS to origin, SNI from host, cert chain verified
# Why: origin names avoid LanCache DNS, which could loop
proxy_ssl_server_name          on;
proxy_ssl_name                 $host;
proxy_ssl_verify               on;
proxy_ssl_verify_depth         2;
proxy_ssl_trusted_certificate  /etc/ssl/certs/ca-certificates.crt;

proxy_connect_timeout     ${NGINX_UPSTREAM_CONNECT_TIMEOUT}s;
# What: send and read timeouts to origin: the idle timeout
# Why: large game downloads can exceed default timeouts
proxy_send_timeout        ${NGINX_UPSTREAM_IDLE_TIMEOUT}s;
proxy_read_timeout        ${NGINX_UPSTREAM_IDLE_TIMEOUT}s;

# What: temp files for origin responses capped at 50 GiB
# Why: large downloads are buffered while written to cache
proxy_max_temp_file_size  51200m;
proxy_temp_file_write_size 8m;

proxy_http_version     1.1;
proxy_set_header       Connection "";
proxy_set_header       Host $host;
proxy_set_header       X-Real-IP $remote_addr;

# Strip headers that interfere with caching
proxy_set_header       Accept-Encoding "";

add_header             X-Cache-Status $upstream_cache_status;
add_header             X-Served-By    lancache-ng;
