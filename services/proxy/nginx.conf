
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: main nginx config: cache, tuning, http and stream.
# Why: one file owns the global proxy behavior.

# What: worker user of the nginx.org Alpine package.
# Why: the supervisor reads it to own TLS keys by group.
# From: Issue #815
user nginx;
# What: one worker per CPU, file limit from SOT, pid file.
# Why: many parallel downloads need many open descriptors.
worker_processes auto;
worker_rlimit_nofile ${NGINX_WORKER_RLIMIT_NOFILE};
pid /run/nginx.pid;
# What: every log goes to stdout or stderr.
# Why: Docker hands both to the one syslog-ng (xz rotation).
error_log stderr warn;

# What: thread pool for aio threads=default below.
# Why: disk reads of large files run off the event loop.
thread_pool default threads=${NGINX_THREAD_POOL_THREADS} max_queue=${NGINX_THREAD_POOL_MAX_QUEUE};

# What: connections per worker from SOT, epoll, batch accept.
# Why: many LAN clients download at the same time.
events {
    worker_connections ${NGINX_WORKER_CONNECTIONS};
    use epoll;
    multi_accept on;
}

http {
    # What: MIME types by extension, else octet-stream.
    # Why: unknown CDN files go to clients as binary.
    include ${NGINX_DIR}/mime.types;
    default_type application/octet-stream;

    # What: map buckets fit a 253-byte host plus "*.".
    # Why: smaller buckets fail nginx -t on long CDN keys.
    map_hash_bucket_size ${NGINX_MAP_HASH_BUCKET_SIZE};
    map_hash_max_size ${NGINX_MAP_HASH_MAX_SIZE};

    # What: access log with the cache status and host.
    # Why: the Admin UI counts hits and bytes per host.
    log_format cache '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent '
                     '"$upstream_cache_status" "$host"';

    access_log /dev/stdout cache;

    # What: no request body size limit for every server.
    # Why: game clients can upload large patch bodies.
    client_max_body_size 0;

    # What: sendfile, thread-pool aio and directio, SOT sizes.
    # Why: large game files must not block nginx workers.
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  ${NGINX_KEEPALIVE_TIMEOUT};
    aio                threads=default;
    directio           ${NGINX_DIRECTIO};

    # What: evict at max_size or min_free, whichever first.
    # Why: the cache can share a disk with the host OS.
    # From: Issue #849
    proxy_cache_path ${NGINX_CACHE_DIR}
        levels=1:2
        keys_zone=lancache:${CACHE_MEM_MB}m
        max_size=${CACHE_MAX_SIZE}
        min_free=${CACHE_MIN_FREE}
        inactive=${CACHE_INACTIVE}
        use_temp_path=off;

    # What: real upstream resolver, never LanCache DNS.
    # Why: LanCache DNS answers CDN names with this proxy.
    resolver ${NGINX_UPSTREAM_RESOLVER} valid=${NGINX_RESOLVER_VALID} ipv6=on;
    resolver_timeout ${NGINX_RESOLVER_TIMEOUT};

    # What: conf.d in name order; 00-https-map.conf first.
    # Why: $https_cert_name must exist before server blocks.
    include ${NGINX_DIR}/conf.d/*.conf;
}

# What: SNI passthrough; IP_HTTP:443 maps to its backend.
# Why: TLS on the HTTP IP is relayed, never decrypted.
stream {
    # What: same map bucket size as the http block.
    # Why: $stream_backend has the same long CDN keys.
    map_hash_bucket_size ${NGINX_MAP_HASH_BUCKET_SIZE};
    map_hash_max_size ${NGINX_MAP_HASH_MAX_SIZE};

    # What: real upstream resolver with IPv6, as in http.
    # Why: LanCache DNS would resolve CDN names back here.
    resolver ${NGINX_UPSTREAM_RESOLVER} valid=${NGINX_RESOLVER_VALID} ipv6=on;
    resolver_timeout ${NGINX_RESOLVER_TIMEOUT};

    # What: supervisor-rendered stream maps and relays.
    # Why: stream and http share one CDN domain list.
    include ${NGINX_DIR}/stream.d/*.conf;

    # What: stream access log with the SNI name to stdout.
    # Why: relayed TLS hosts show up in the one syslog-ng.
    log_format stream '$remote_addr [$time_local] $protocol '
                      '$status $bytes_sent $bytes_received '
                      '"$ssl_preread_server_name"';

    access_log /dev/stdout stream;
}
