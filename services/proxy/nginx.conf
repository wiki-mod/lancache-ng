# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# Main nginx configuration — cache settings, performance tuning, HTTP + stream blocks for SNI

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

thread_pool default threads=32 max_queue=65536;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $ssl_cert_name (00-ssl-map.conf, entrypoint-generated) has one key per
    # cdn-domains.txt entry, some now well past nginx's default hash bucket
    # size once a real-world domain list is deep enough (leading-dot
    # wildcard-base/exact-host entries) -- confirmed live: nginx -t failed
    # with "could not build map_hash, you should increase
    # map_hash_bucket_size: 64" against this project's own real
    # services/dns/cdn-domains.txt. 128 covered that real file, but
    # _is_valid_domain accepts hostnames up to 253 bytes, and a key that
    # long (confirmed live: a 243-byte leading-dot entry) still overflows a
    # 128-byte bucket ("could not build map_hash, you should increase
    # map_hash_bucket_size: 128"). Sized to the validator's own worst case
    # (253-byte hostname plus the "*." wildcard prefix and hash-element
    # metadata), not merely today's file, so a future long CDN entry cannot
    # silently reintroduce this failure again.
    map_hash_bucket_size 512;
    map_hash_max_size 2048;

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    log_format cache '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent '
                     '"$upstream_cache_status" "$host"';

    access_log /var/log/nginx/access.log cache;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------
    # Performance
    # -------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    aio                threads=default;
    directio           4m;

    # -------------------------------------------------------
    # Proxy cache — shared by all modes (HTTP, HTTPS SSL)
    # -------------------------------------------------------
    # min_free is a defense-in-depth backstop, not a replacement for
    # max_size (bug-hunt #849 item 11): this project's cache volume CAN share
    # a filesystem with the container's OS layer on a single-disk host (the
    # Compose files don't require a dedicated cache partition), so a
    # misconfigured CACHE_MAX_SIZE relative to real free disk otherwise has
    # no nginx-native floor -- previously this relied entirely on the
    # separate watchdog process noticing after the fact (see
    # docs/architecture-ng.md's own "max_size is not a hard limit" note).
    # max_size and min_free are not mutually exclusive -- confirmed against
    # the real nginx 1.31.3 binary this project ships (nginx -t accepted
    # both set together) -- so the cache manager now evicts on whichever
    # threshold triggers first.
    proxy_cache_path /var/cache/nginx/lancache
        levels=1:2
        keys_zone=lancache:${CACHE_MEM_MB}m
        max_size=${CACHE_MAX_SIZE}
        min_free=${CACHE_MIN_FREE}
        inactive=${CACHE_INACTIVE}
        use_temp_path=off;

    # -------------------------------------------------------
    # DNS resolver (real upstream DNS, NOT our LAN cache DNS).
    # Configure NGINX_UPSTREAM_RESOLVER to use a different public or upstream
    # resolver; do not set it to the LanCache DNS IP or nginx will loop back
    # into the cache DNS while resolving upstream CDN hostnames.
    # -------------------------------------------------------
    resolver ${NGINX_UPSTREAM_RESOLVER} valid=300s ipv6=on;
    resolver_timeout 5s;

    # -------------------------------------------------------
    # conf.d is loaded alphabetically; 00-ssl-map.conf (generated
    # by entrypoint) must sort first so the map variable is defined
    # before the server blocks that reference $ssl_cert_name.
    # -------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}

# ─────────────────────────────────────────────────────────────────────────────
# SNI passthrough for standard mode on IP_STANDARD:443 (external)
# Maps to internal port 8443 via Docker port mapping
# ─────────────────────────────────────────────────────────────────────────────
stream {
    # $stream_backend below has the same real-world hash-bucket-size need as
    # the http block's $ssl_cert_name map -- see that block's comment for the
    # confirmed live failure this fixes. Corrected 2026-08-06 (bug-hunt #849,
    # finding N1): this comment previously also named $lancache_client_allowed
    # as sharing this need, which was never actually true -- that geo
    # variable is compiled only into 00-ssl-map.conf, included exclusively by
    # the http {} block above, and is structurally unusable from this
    # context. The stream-level client allowlist is instead the plain
    # allow/deny directives in entrypoint.sh's generated
    # 00-stream-client-acl.conf, `include`d directly inside each externally
    # -facing server {} block below (not at this top level, so the internal
    # relay hops in entrypoint.sh's own "2a." SSL-dispatch generation are not
    # also gated by it -- see that generation step's own comment).
    map_hash_bucket_size 512;
    map_hash_max_size 2048;

    # Use the same real upstream DNS resolver for SNI passthrough. Never point
    # this at the LanCache DNS IP; that would resolve CDN names back here.
    # ipv6=on matches the http {} block's own resolver directive above
    # (AG-OP-002) -- without it, this directive silently falls back to
    # nginx's own version-dependent IPv6-resolution default instead of this
    # project's explicit dual-stack support (bug-hunt #849, finding #13).
    resolver ${NGINX_UPSTREAM_RESOLVER} valid=300s ipv6=on;
    resolver_timeout 5s;

    # stream.d is generated by the entrypoint so strict/lazy host handling can
    # share the same domain list as the HTTP allowlist.
    include /etc/nginx/stream.d/*.conf;

    log_format stream '$remote_addr [$time_local] $protocol '
                      '$status $bytes_sent $bytes_received '
                      '"$ssl_preread_server_name"';

    access_log /var/log/nginx/stream.log stream;

    server {
        listen 8443;
        listen [::]:8443;
        # Client-IP allowlist (bug-hunt #849, finding N1) -- generated into
        # its own subdirectory specifically so the blanket
        # "include /etc/nginx/stream.d/*.conf;" above never also applies it
        # at this block's outer stream {} scope; see entrypoint.sh's "2b."
        # generation step for the full reasoning.
        include /etc/nginx/stream.d/access.d/00-stream-client-acl.conf;
        ssl_preread on;
        proxy_pass $stream_backend;
        proxy_connect_timeout 30s;
        proxy_timeout        3600s;
    }
}
