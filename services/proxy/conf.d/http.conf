# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# nginx HTTP caching server (port 80) — DNS-spoofed clients cache downloads here

# HTTP caching server (port 80)
# DNS-spoofed clients connect here thinking they're talking to the CDN.
# We read the Host header and proxy to the real origin over HTTPS.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Allow large request bodies (game patches can be uploaded, though rare)
    client_max_body_size 0;

    # /healthz has no authentication of any kind -- restricting it to the
    # container's own loopback (the Compose healthcheck's `curl
    # http://127.0.0.1/healthz`, see deploy/*/docker-compose.yml) plus the
    # Docker bridge range (other containers, e.g. netdata/watchdog probes)
    # keeps it usable for its real callers while closing an unauthenticated
    # fingerprint/probe surface reachable by any internet client that can
    # reach this publicly-listened port.
    # Mirrors /nginx_status's already-established ACL below, deliberately
    # kept IPv4-only for the same reason that one is -- both should move
    # together if IPv6 support is ever added for either.
    #
    # Served via `alias` to a real file (entrypoint.sh's own "3a."
    # generates /etc/nginx/lancache-healthz-body.txt at startup), NOT a
    # bare `return`, on purpose: `return` runs in nginx's rewrite phase,
    # which executes BEFORE the access phase that evaluates `allow`/`deny`
    # -- confirmed live that a `return` in this same location made the ACL
    # below a complete no-op (any source got 200), while `alias`'s
    # content-phase static-file handler correctly enforces it. See
    # entrypoint.sh's own comment on this and
    # docs/release-validation-plan.md's Standing checks row for the full
    # reproduction.
    location = /healthz {
        access_log off;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny  all;
        default_type text/plain;
        alias /etc/nginx/lancache-healthz-body.txt;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;
        deny  all;
    }

    location / {
        if ($lancache_client_allowed = 0) {
            return 403;
        }

        if ($cdn_host_allowed = 0) {
            return 403;
        }

        proxy_pass https://$host$request_uri;
        include    /etc/nginx/proxy-params.conf;
    }
}
