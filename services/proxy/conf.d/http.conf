
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: HTTP caching server on the SOT HTTP port.
# Why: DNS-spoofed clients send CDN requests here.

server {
    # What: default server on the HTTP port, IPv4 and IPv6.
    # Why: spoofed CDN names of any host land here.
    listen      ${PROXY_HTTP_PORT} default_server;
    listen      [::]:${PROXY_HTTP_PORT} default_server;
    server_name _;

    # What: nginx stub status for the Docker bridge.
    # Why: the Admin UI reads proxy counters from it.
    location = ${PROXY_STATUS_PATH} {
        stub_status;
        access_log off;
        allow ${DOCKER_BRIDGE_NET};
        deny  all;
    }

    # What: cache and /healthz from proxy-params.conf.
    # Why: http.conf and https.conf use one access policy.
    location / {
        include ${NGINX_DIR}/proxy-params.conf;
    }
}
