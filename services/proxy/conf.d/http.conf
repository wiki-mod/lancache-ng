
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: HTTP caching server on port 80.
# Why: DNS-spoofed clients send CDN requests here.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # What: no request body size limit.
    # Why: game clients can upload large patch bodies.
    client_max_body_size 0;

    # What: /healthz for loopback and the Docker bridge.
    # Why: the compose healthcheck curls it; no one else.
    location = /healthz {
        access_log off;
        allow ${LOOPBACK_BIND_IP}/32;
        allow 172.16.0.0/12;
        deny  all;
        default_type text/plain;
        # What: a static file the supervisor writes.
        # Why: return runs before allow/deny and skips them.
        alias ${NGINX_DIR}/lancache-healthz-body.txt;
    }

    # What: nginx stub status for the Docker bridge.
    # Why: the Admin UI reads proxy counters from it.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;
        deny  all;
    }

    location / {
        # What: refuse clients outside the client allow map.
        # Why: only LAN clients may use the cache.
        if ($lancache_client_allowed = 0) {
            return 403;
        }

        # What: refuse hosts outside the CDN allow map.
        # Why: the proxy must not relay arbitrary sites.
        if ($cdn_host_allowed = 0) {
            return 403;
        }

        # What: fetch from the real origin over HTTPS.
        # Why: Host names the CDN the client asked for.
        proxy_pass https://$host$request_uri;
        include    ${NGINX_DIR}/proxy-params.conf;
    }
}
