# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# nginx HTTPS/TLS interception server (ssl mode, port 443) — caches HTTPS downloads via CA MITM

# HTTPS caching server (ssl mode, INTERNAL port -- see entrypoint.sh's "2a.")
# Only loaded when SSL_ENABLED=1 (entrypoint removes this file otherwise).
#
# Since #1276/#1322: no longer listens on the public 443 directly. IP_SSL:443
# now reaches entrypoint.sh's generated stream-level SNI dispatch listener
# first (stream.d/01-ssl-dispatch.conf), which routes depth-covered SNI
# through an internal MITM relay to THIS server's internal-only port instead
# -- see that file's own "2a." comment for the full reasoning (regex-anchored
# depth dispatch, and why a symmetric two-relay design is needed to keep
# $remote_addr correct here). This server no longer accepts direct external
# connections at all; `set_real_ip_from`/`real_ip_header` below trust the
# PROXY protocol header the internal MITM relay attaches, so $remote_addr
# (used by $lancache_client_allowed below and by access logging) still
# reflects the real client, not the relay's own loopback address.
server {
    listen      127.0.0.1:8444 ssl proxy_protocol default_server;
    # Second, plain (non-PROXY-protocol) listener on its own port, loopback
    # only, for the Compose healthcheck (deploy/prod/docker-compose.yml)
    # alone. `listen ... proxy_protocol` above makes 8444 require a valid
    # PROXY protocol preamble on every connection (confirmed live: a plain
    # curl/TLS ClientHello without one is rejected) -- curl has no way to
    # send that preamble, so the healthcheck cannot use 8444 directly. This
    # location doesn't check $lancache_client_allowed/$cdn_host_allowed (see
    # "location = /healthz" below) and returns before either would matter,
    # so real client-IP correctness is not needed for it -- only proving
    # this same nginx worker/cert-selection config is actually alive is.
    listen      127.0.0.1:8445 ssl;
    server_name _;
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # Dynamic cert selection based on SNI — see ssl-map.conf (generated at startup)
    ssl_certificate     /etc/nginx/ssl/certs/$ssl_cert_name.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/$ssl_cert_name.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large request bodies (game patches can be uploaded, though rare)
    client_max_body_size 0;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        if ($lancache_client_allowed = 0) {
            return 403;
        }

        if ($cdn_host_allowed = 0) {
            return 403;
        }

        proxy_pass https://$host$request_uri;
        include    /etc/nginx/proxy-params.conf;
    }
}
