
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: internal HTTPS MITM caching server, SSL mode only.
# Why: the SNI dispatcher relays covered TLS hosts here.
# From: Issue #1276

server {
    # What: loopback MITM port behind the stream relay.
    # Why: the relay sends the client IP as PROXY header.
    listen      127.0.0.1:8444 ssl proxy_protocol default_server;
    # What: loopback port without PROXY protocol.
    # Why: the compose healthcheck curl sends no preamble.
    listen      127.0.0.1:8445 ssl;
    server_name _;
    # What: client address from the relay's PROXY header.
    # Why: client ACL and access log need the real client.
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # What: certificate chosen by SNI via 00-ssl-map.conf.
    # Why: each covered CDN host needs its own signed leaf.
    ssl_certificate     /etc/nginx/ssl/certs/$ssl_cert_name.crt;
    ssl_certificate_key /etc/nginx/ssl/certs/$ssl_cert_name.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # What: no request body size limit.
    # Why: game clients can upload large patch bodies.
    client_max_body_size 0;

    # What: /healthz for loopback and the Docker bridge.
    # Why: realip runs first; relayed clients stay denied.
    location = /healthz {
        access_log off;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny  all;
        default_type text/plain;
        # What: a static file the supervisor writes.
        # Why: return runs before allow/deny and skips them.
        alias /etc/nginx/lancache-healthz-body.txt;
    }

    location / {
        # What: refuse clients outside the client allow map.
        # Why: only LAN clients may use the cache.
        if ($lancache_client_allowed = 0) {
            return 403;
        }

        # What: refuse hosts outside the CDN allow map.
        # Why: the proxy must not relay arbitrary sites.
        if ($cdn_host_allowed = 0) {
            return 403;
        }

        # What: fetch from the real origin over HTTPS.
        # Why: Host names the CDN the client asked for.
        proxy_pass https://$host$request_uri;
        include    /etc/nginx/proxy-params.conf;
    }
}
