
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: internal HTTPS MITM caching server, HTTPS mode only.
# Why: the SNI dispatcher relays covered TLS hosts here.
# From: Issue #1276

server {
    # What: loopback MITM and health listens, generated.
    # Why: the watchdog renders ports from the SOT.
    # From: Issue #1683 | PR #1912
    include     ${NGINX_DIR}/${NGINX_HTTPS_LISTEN_FILE};
    server_name _;
    # What: client address from the relay's PROXY header.
    # Why: client ACL and access log need the real client.
    set_real_ip_from ${LOOPBACK_BIND_IP};
    real_ip_header   proxy_protocol;

    # What: certificate chosen by SNI via 00-https-map.conf.
    # Why: each covered CDN host needs its own signed leaf.
    ssl_certificate     ${NGINX_DIR}/${NGINX_SUBDIR_CERTS}/$https_cert_name.crt;
    ssl_certificate_key ${NGINX_DIR}/${NGINX_SUBDIR_CERTS}/$https_cert_name.key;

    # What: TLS 1.2 and 1.3, strong ciphers, shared sessions.
    # Why: clients resume TLS without a full handshake.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # What: /healthz for loopback and the Docker bridge.
    # Why: realip runs first; relayed clients stay denied.
    location = /healthz {
        access_log off;
        allow ${LOOPBACK_BIND_IP}/32;
        allow 172.16.0.0/12;
        deny  all;
        default_type text/plain;
        # What: a static file the supervisor writes.
        # Why: return runs before allow/deny and skips them.
        alias ${NGINX_DIR}/lancache-healthz-body.txt;
    }

    # What: cache location from the shared proxy-params.conf.
    # Why: http.conf and https.conf use one access policy.
    location / {
        include ${NGINX_DIR}/proxy-params.conf;
    }
}
