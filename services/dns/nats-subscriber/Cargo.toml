# What: manifest of the nats-subscriber binary.
# Why: single binary crate; src/main.rs is the only source.
# From: Issue #1683 | PR #1858
[package]
name = "nats-subscriber"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nats-subscriber"
path = "src/main.rs"

[dependencies]
lancache-common = { path = "../../common" }
async-nats = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# What: release profile now lives at the workspace root.
# Why: cargo ignores a member profile in a workspace.
# From: Issue #1095
