
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-dns helper.
# Why: single binary crate; src/main.rs is the only source.
# From: Issue #1683
[package]
name = "lancache-dns"
edition.workspace = true
license.workspace = true

# What: explicit bin target, same as cargo's default
# Why: ci.sh tells a bin crate from a library by it
# From: Issue #1683
[[bin]]
name = "lancache-dns"
path = "src/main.rs"

[dependencies]
LanCache-NG = { path = "../common" }
tokio = { workspace = true }
