
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-watchdog health daemon.
# Why: single binary crate; src/main.rs is the only source.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-watchdog"
edition.workspace = true
license.workspace = true

# What: explicit bin target, same as cargo's default
# Why: ci.sh tells a bin crate from a library by it
# From: Issue #1683 | PR #1905
[[bin]]
name = "lancache-watchdog"
path = "src/main.rs"

[dependencies]
LanCache-NG = { path = "../common" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
