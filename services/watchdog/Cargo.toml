
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-watchdog health daemon.
# Why: single binary crate; src/main.rs is the only source.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-watchdog"
version.workspace = true
edition.workspace = true
license.workspace = true

# What: explicit bin target, same as cargo's default
# Why: manifest-only build stages stub declared targets
# From: Issue #1683 | PR #1905
[[bin]]
name = "lancache-watchdog"
path = "src/main.rs"

[dependencies]
LanCache-NG = { path = "../common" }
serde_json = { workspace = true }
tokio = { workspace = true }
zstd = { workspace = true }
# What: time with the macros feature.
# Why: status.json timestamps use format_description!.
# From: Issue #1683 | PR #1858
time = { workspace = true, features = ["macros"] }
