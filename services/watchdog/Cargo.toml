
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the lancache-watchdog health daemon.
# Why: health state machine, status.json and disk probe.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-watchdog"
version.workspace = true
edition.workspace = true
license.workspace = true

# What: lib target exposing the pure modules to unit tests.
# Why: removed when the watchdog source becomes one main.rs.
# From: Issue #1683 | PR #1858
[lib]
name = "lancache_watchdog"
path = "src/lib.rs"

[[bin]]
name = "lancache-watchdog"
path = "src/main.rs"

[dependencies]
lancache-common = { path = "../common" }
serde = { workspace = true }
serde_json = { workspace = true }
# What: reqwest client for docker-socket-proxy, on rustls.
# Why: AG-REL-003 forbids openssl-sys.
# From: Issue #1683 | PR #1858
reqwest = { workspace = true }
tokio = { workspace = true }
# What: time with the macros feature.
# Why: status.json timestamps use format_description!.
# From: Issue #1683 | PR #1858
time = { workspace = true, features = ["macros"] }
