
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Manifest for the lancache-watchdog health-monitor/auto-restart daemon,
# a Rust rewrite of services/watchdog/watchdog.sh (still the active
# container entrypoint -- see below).
#
# Scope note (2026-07-31/08-01): this crate currently ports only
# watchdog.sh's health-check/restart state machine (proxy/dns-standard/
# dns-ssl/nats), the status.json writer, disk-usage probe, and the
# docker-socket-proxy alert-only probe -- NOT watchdog.sh's former three
# filesystem-retention passes (maybe_purge/maybe_prune_syslog/
# maybe_rotate_fluent_bit_selflog), which never need porting into this
# crate at all: they now run independently as their own retention.sh /
# dedicated `retention` Compose service (see src/lib.rs's module doc
# comment). services/watchdog/Dockerfile's ENTRYPOINT still points at the
# bash watchdog.sh; this crate is not wired in as a replacement yet, for
# reasons unrelated to file retention.

[package]
name = "lancache-watchdog"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
# Exposes every pure, no-I/O module (config parsing/validation, the
# failure-counter state machine, health-string parsing, status.json
# shape/serialization, disk-percentage classification) so unit tests can
# exercise them directly without a live Docker socket proxy or a real
# filesystem -- mirrors services/dns/nats-subscriber's and services/ui's
# own lib.rs/fuzz-surface split, though this crate has no fuzz/ harness of
# its own (no untrusted external wire format to fuzz -- Docker's own health
# JSON is a trusted local API response, not attacker-controlled input).
name = "lancache_watchdog"
path = "src/lib.rs"

[[bin]]
name = "lancache-watchdog"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls, never openssl-sys (Rule-Ref: AG-REL-003) -- rust:slim/the eventual runtime
# base has no OpenSSL headers. Matches services/dns/nats-subscriber's
# reqwest version/feature shape (a small binary with a narrow HTTP surface,
# same category as this crate) rather than services/ui's heavier axum-server
# dependency profile, which this crate has no use for (watchdog has no HTTP
# server of its own, only an HTTP *client* to docker-socket-proxy).
#
# "rustls-tls-native-roots", not plain "rustls-tls": the latter trusts only
# rustls' own bundled webpki-roots (public CAs), never the container's own
# installed trust store. The existing bash implementation's `curl` calls
# trust whatever CA store the container image has installed -- an operator
# who points DOCKER_PROXY_URL at an HTTPS socket proxy secured by a private
# CA they installed into the image would have that curl call succeed today,
# and this crate's reqwest client reject it, if left on plain webpki roots.
# "-native-roots" is still 100% rustls (no openssl-sys, Rule-Ref: AG-REL-003 intact),
# it only changes which root store rustls consults.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
# Only pulled in for one purpose: rendering the same UTC RFC3339-ish
# timestamp shape watchdog.sh's `date -u +%Y-%m-%dT%H:%M:%SZ` produces for
# status.json's "updated" field (services/ui/src/watchdog_status.rs's
# STALE_AFTER staleness check reads this file's mtime, not this field, but
# the field is still operator-visible in the dashboard). No other crate in
# this repository formats dates yet, so this is a new, deliberate addition,
# not a reuse -- chosen over `chrono` for a smaller dependency footprint
# (no pulled-in timezone database; the "macros" feature below does still
# pull in the small time-macros proc-macro crate for the compile-time
# `format_description!` used by both timestamp call sites) since only UTC,
# fixed-format rendering is needed here, never timezone conversion or
# parsing.
time = { version = "0.3", features = ["formatting", "macros"] }

# What: release profile now lives at the workspace root.
# Why: cargo ignores a member profile in a workspace.
# From: Issue #1095
