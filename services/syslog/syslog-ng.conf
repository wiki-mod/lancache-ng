
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# syslog-ng config for the combined syslog+fluent-bit container. Same
# source/destination/log shape as deploy/prod/docker-compose.yml's previous
# separate `syslog-ng` service, with two changes:
#   1. listens on 6601, not 601 -- 601 is a *privileged* port (verified
#      live: /proc/sys/net/ipv4/ip_unprivileged_port_start defaults to 1024
#      on a real runner) and this process runs as a fixed non-root uid
#      (10001, see entrypoint.sh) with no CAP_NET_BIND_SERVICE grant. Never
#      published to the host or documented externally (grepped
#      deploy/*/docker-compose.yml's `ports:` blocks -- absent for
#      syslog-ng in every profile), so this is a zero-external-impact
#      internal renumbering.
#   2. no `dir-group(10001)`/`group(10001)` workaround: that workaround only
#      existed because production's syslog-ng ran as root (no user() drop
#      configured there), so files it created defaulted to root:root and had
#      to be explicitly chgrp'd to the Admin UI's fixed gid (10001) for the
#      UI to read them at all. This container's syslog-ng runs natively as
#      uid 10001 (Dockerfile USER, matching the Admin UI's own fixed
#      uid/gid, see services/ui/Dockerfile) via Docker's own container
#      identity -- not a runtime setuid drop -- so every file it creates is
#      already owned 10001:10001 by construction. Verified live
#      (2026-08-06): the Admin UI's syslog_client reads the resulting
#      owner-owned tree with no group workaround needed.
#
# This file is 100% static (baked into the image at build time, chowned to
# the same fixed uid/gid as the runtime USER) -- unlike the fixed-threshold
# rotation loop's tunables (SYSLOG_MAX_FILE_MB etc., which entrypoint.sh's
# rotation loop reads from the environment), nothing in this file varies per
# deployment, so there is no reason to generate it at runtime the way the
# previous inline-heredoc version did.
@version: 4.7

options {
    time-reap(30);
    mark-freq(10);
    keep-hostname(yes);
    create-dirs(yes);
    dir-perm(0750);
    perm(0640);
};

source s_forwarders {
    network(transport(tcp) port(6601) flags(syslog-protocol));
};

destination d_lancache {
    file(
        "/var/log/lancache-syslog-ng/$HOST/$YEAR$MONTH$DAY.log"
        template("$ISODATE $HOST $PROGRAM: $MSGONLY\n")
        create-dirs(yes)
    );
};

log { source(s_forwarders); destination(d_lancache); };

