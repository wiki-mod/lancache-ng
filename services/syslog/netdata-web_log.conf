
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Netdata web log parser — monitors nginx-proxy logs for live analytics

# `log_type: nginx` (an earlier value here) is not a valid go.d web_log
# parser type -- confirmed empirically 2026-07-31 while validating the
# services/netdata Alpine migration (see issue #1304/#815): this job failed
# with "check failed: failed to create parser" on BOTH the currently
# pinned production image (netdata/netdata@sha256:a130... ,
# v2.10.0-607-nightly) and the new first-party Alpine build (v2.10.4) --
# a pre-existing bug, not something either image introduced.
#
# Removing that field alone (bare `name`/`path`, relying on auto-detection)
# is NOT sufficient either -- confirmed empirically 2026-08-12 while
# diagnosing PR #1489's syslog-forwarding-simulation CI failure. This
# project's proxy (services/proxy/nginx.conf) does not use nginx's standard
# combined/common log format; it defines a custom `cache` log_format
# ('$remote_addr - [$time_local] "$request" $status $body_bytes_sent
# "$upstream_cache_status" "$host"') that differs from every one of go.d's
# built-in auto-detected CSV patterns (see
# https://github.com/netdata/netdata/blob/master/src/go/plugin/go.d/collector/weblog/integrations/web_server_log_files.md#log_type
# for the full auto-detect list): ours has one dash after $remote_addr where
# every built-in pattern expects two (`- -`, i.e. an unused $remote_user
# slot), and it carries two custom trailing quoted fields (cache status,
# host) auto-detection's fixed patterns don't have a slot for. Auto-detect
# therefore silently never matches this log's real shape, and the job
# produces zero collected requests without failing loudly.
#
# `log_type: regexp` with named capture groups for the known fields
# (`remote_addr`, `time_local`, `request`, `status`, `body_bytes_sent`,
# `host`) fixes this: the unnamed group around the cache-status field is
# matched structurally but not extracted, exactly as
# regexp_config.pattern's own docs describe ("subexpression names should be
# known fields" -- an unnamed/unrecognized-name group is simply not read).
# Verified live: a real pinned-image netdata container, this exact config,
# and fixture log lines in the proxy's real format -- appending new lines
# after the collector started produced correctly classified 2xx/4xx charts
# via the collector's own API, proving the pattern actually parses this
# log's real shape rather than just failing to error at job start.
jobs:
  - name: nginx_proxy
    path: /var/log/lancache/nginx-proxy.log
    log_type: regexp
    regexp_config:
      pattern: '^(?P<remote_addr>\S+) - \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]*)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "[^"]*" "(?P<host>[^"]*)"'
