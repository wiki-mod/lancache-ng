# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# Netdata web log parser — monitors nginx-proxy logs for live analytics

# `log_type: nginx` (the previous value here) is not a valid go.d web_log
# parser type -- confirmed empirically 2026-07-31 while validating the
# services/netdata Alpine migration (see issue #1304/#815): this job failed
# with "check failed: failed to create parser" on BOTH the currently
# pinned production image (netdata/netdata@sha256:a130... ,
# v2.10.0-607-nightly) and the new first-party Alpine build (v2.10.4) --
# a pre-existing bug, not something either image introduced. go.d's own
# stock web_log.conf (/opt/netdata/usr/lib/netdata/conf.d/go.d/web_log.conf
# in the image) configures its built-in nginx example the same way: just
# `name`/`path`, no `log_type` field, relying on auto-detection of the
# standard combined log format. Removing the field here restores that
# working behavior -- verified against both images for real.
jobs:
  - name: nginx_proxy
    path: /var/log/lancache/nginx-proxy.log
