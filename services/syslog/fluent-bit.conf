
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# fluent-bit pipeline for the combined syslog+fluent-bit container. Ported
# 1:1 from deploy/prod/docker-compose.yml's previous `syslog` service (a
# ~600-line CLI-flag argv), with exactly two behavioral changes:
#   1. every syslog output's `host` is now `127.0.0.1` (fluent-bit and
#      syslog-ng share one container's network namespace) instead of the
#      Compose service name `syslog-ng`, which no longer exists.
#   2. `port` is `6601`, not `601` -- port 601 is a *privileged* port
#      (verified live: Linux's ip_unprivileged_port_start defaults to 1024,
#      confirmed via /proc/sys/net/ipv4/ip_unprivileged_port_start on a real
#      runner), and this container runs syslog-ng as a non-root uid (see
#      entrypoint.sh) with no CAP_NET_BIND_SERVICE grant. 601 was never
#      published to the host or documented as an external contract (grepped
#      deploy/*/docker-compose.yml's `ports:` blocks -- absent), so
#      renumbering it is a zero-external-impact internal implementation
#      detail, not a compatibility break.
# A classic-format file (not CLI flags) because a 600-line argv is not a
# reviewable unit -- this project already generates/ships config files for
# every other multi-option service (nginx, PowerDNS, Kea, nats.conf).
#
# One tail input has been ADDED beyond the previous production pipeline:
# fluent-bit's own tail of the data-loss detector's alert log (see
# entrypoint.sh's detector loop and data-loss-detector.sh) so an operator
# sees a silent-data-loss alert through the same Admin UI /logs view as
# every other forwarded source, not only in `docker logs`.

[SERVICE]
    Flush        1
    Log_Level    info
    Log_File     /data/fluent-bit.log
    storage.path /data/flb-storage
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# ── proxy/nginx: dual pipeline (local file copy for Netdata's web_log job,
# plus a syslog forward), one input pair per log file ──────────────────────
[INPUT]
    Name             tail
    Path             /var/log/nginx/access.log
    Tag              nginx.file
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-proxy-file.db

[INPUT]
    Name             tail
    Path             /var/log/nginx/access.log
    Tag              nginx.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-proxy-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/nginx/error.log
    Tag              nginx-error.file
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-proxy-error-file.db

[INPUT]
    Name             tail
    Path             /var/log/nginx/error.log
    Tag              nginx-error.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-proxy-error-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/nginx/stream.log
    Tag              nginx-stream.file
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-proxy-stream-file.db

[INPUT]
    Name             tail
    Path             /var/log/nginx/stream.log
    Tag              nginx-stream.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-proxy-stream-syslog.db

# ── remaining logging-matrix services: syslog-only (no local plain-text
# copy -- Netdata's web_log module only understands nginx's own format) ────
[INPUT]
    Name             tail
    Path             /var/log/lancache-dns-standard/*.log
    Tag              dns-standard.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-dns-standard-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/lancache-dns-ssl/*.log
    Tag              dns-ssl.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-dns-ssl-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/kea/*.log
    Tag              dhcp.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-dhcp-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/lancache-dhcp-proxy/*.log
    Tag              dhcp-proxy.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-dhcp-proxy-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/lancache-ui/*.log
    Tag              ui.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-ui-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/lancache-watchdog/*.log
    Tag              watchdog.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-watchdog-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/lancache-nats/*.log
    Tag              nats.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-nats-syslog.db

[INPUT]
    Name             tail
    Path             /var/log/lancache-netdata/*.log
    Tag              netdata.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-netdata-syslog.db

# fluent-bit's own self-log (issue #864): this is the SAME file
# [SERVICE]'s Log_File above writes -- re-ingesting it surfaces a fluent-bit
# crash-loop or misconfiguration through the same forwarded pipeline instead
# of only `docker logs`.
[INPUT]
    Name             tail
    Path             /data/fluent-bit.log
    Tag              fluent-bit.selflog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-selflog-syslog.db

# The silent-data-loss detector's own alert log (new in this PR -- see
# entrypoint.sh). Same "surface it through the pipeline, not only
# `docker logs`" reasoning as fluent-bit's own self-log above; an alert here
# means syslog-ng accepted a message it could not actually write to disk, so
# routing it through syslog-ng itself would be circular -- this file is
# fluent-bit's only way to make the alert operator-visible.
[INPUT]
    Name             tail
    Path             /var/lib/lancache-syslog-data/data-loss-detector.log
    Tag              data-loss-detector.syslog
    Read_from_Head   true
    Skip_Long_Lines  On
    DB               /data/flb-data-loss-detector-syslog.db

# ── record_modifier filters: stamp host/ident per source before the syslog
# output, identical values to the previous production pipeline ────────────
[FILTER]
    Name    record_modifier
    Match   nginx.syslog
    Record  host lancache-proxy
    Record  ident nginx-access

[FILTER]
    Name    record_modifier
    Match   nginx-error.syslog
    Record  host lancache-proxy
    Record  ident nginx-error

[FILTER]
    Name    record_modifier
    Match   nginx-stream.syslog
    Record  host lancache-proxy
    Record  ident nginx-stream

[FILTER]
    Name    record_modifier
    Match   dns-standard.syslog
    Record  host lancache-dns-standard
    Record  ident pdns

[FILTER]
    Name    record_modifier
    Match   dns-ssl.syslog
    Record  host lancache-dns-ssl
    Record  ident pdns

[FILTER]
    Name    record_modifier
    Match   dhcp.syslog
    Record  host lancache-dhcp
    Record  ident kea-dhcp4

[FILTER]
    Name    record_modifier
    Match   dhcp-proxy.syslog
    Record  host lancache-dhcp-proxy
    Record  ident dnsmasq

[FILTER]
    Name    record_modifier
    Match   ui.syslog
    Record  host lancache-ui
    Record  ident lancache-ui

[FILTER]
    Name    record_modifier
    Match   watchdog.syslog
    Record  host lancache-watchdog
    Record  ident watchdog

[FILTER]
    Name    record_modifier
    Match   nats.syslog
    Record  host lancache-nats
    Record  ident nats-server

[FILTER]
    Name    record_modifier
    Match   netdata.syslog
    Record  host lancache-netdata
    Record  ident netdata

[FILTER]
    Name    record_modifier
    Match   fluent-bit.selflog
    Record  host lancache-syslog
    Record  ident fluent-bit

[FILTER]
    Name    record_modifier
    Match   data-loss-detector.syslog
    Record  host lancache-syslog
    Record  ident data-loss-detector

# ── file outputs: local plain-text copies (proxy only, for Netdata) ───────
[OUTPUT]
    Name      file
    Match     nginx.file
    Path      /var/log/lancache
    File      nginx-proxy.log
    Format    template
    Template  {log}

[OUTPUT]
    Name      file
    Match     nginx-error.file
    Path      /var/log/lancache
    File      nginx-proxy-error.log
    Format    template
    Template  {log}

[OUTPUT]
    Name      file
    Match     nginx-stream.file
    Path      /var/log/lancache
    File      nginx-proxy-stream.log
    Format    template
    Template  {log}

# ── syslog outputs: one per *.syslog tag, all to the local syslog-ng
# receiver sharing this container's network namespace ─────────────────────
[OUTPUT]
    Name                 syslog
    Match                nginx.syslog
    host                 127.0.0.1
    port                 6601
    mode                 tcp
    syslog_format        rfc5424
    syslog_hostname_key  host
    syslog_appname_key   ident
    syslog_message_key   log

[OUTPUT]
    Name                 syslog
    Match                nginx-error.syslog
    host                 127.0.0.1
    port                 6601
    mode                 tcp
    syslog_format        rfc5424
