
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: shared crate; sources shared.rs and config.rs.
# Why: one owner for behavior several services share.
# From: Issue #1683 | PR #1858
[package]
name = "lancache-common"
version.workspace = true
edition.workspace = true
license.workspace = true

# What: crate root is shared.rs, which declares config.
# Why: the decision allows exactly these two shared sources.
# From: Issue #1683 | PR #1858
[lib]
name = "lancache_common"
path = "shared.rs"

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
