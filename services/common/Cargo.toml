
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: shared crate; sources shared.rs and config.rs.
# Why: one owner for behavior several services share.
# From: Issue #1683 | PR #1858
[package]
name = "LanCache-NG"
version.workspace = true
edition.workspace = true
license.workspace = true

# What: crate root is shared.rs, which declares config.
# Why: the decision allows exactly these two shared sources.
# From: Issue #1683 | PR #1858
[lib]
name = "lancache_ng"
path = "shared.rs"

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
# What: reqwest client of the Docker API (rustls).
# Why: AG-REL-003 forbids openssl-sys.
# From: Issue #1683 | PR #1858
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

# What: tokio for the async tests of the HTTP clients.
# Why: tests use a local server; no service code uses it.
# From: Issue #1683 | PR #1858
[dev-dependencies]
tokio = { workspace = true }
