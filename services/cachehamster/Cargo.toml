
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: manifest of the cachehamster prefill daemon.
# Why: single binary crate; src/main.rs is the only source.
# From: Issue #871 | PR #1858
[package]
name = "lancache-cachehamster"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lancache-common = { path = "../common" }
tokio = { workspace = true }
# What: reqwest with the stream feature on rustls.
# Why: bytes_stream needs it; no openssl-sys (AG-REL-003).
# From: Issue #871
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
