# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# Dependabot configuration for automated dependency updates (GitHub Actions, Rust, Docker)
#
# `current_dev` is the only target-branch below. Dependabot's own
# target-branch key accepts exactly one branch per update entry -- there is
# no way to list multiple branches for a single block -- and defaults to the
# repo's default branch (master) when omitted, so an explicit entry is still
# required (found and fixed per #709's audit of hardcoded v0.2.0 branch-name
# references: `v0.2.0` was the active branch when this file was first
# written, but it is now frozen and `current_dev` took over that role --
# relying on the implicit master default would silently leave the actual
# active branch with zero automated dependency scanning).
#
# `master` deliberately has NO entries here anymore (removed 2026-07-31).
# It used to keep its own parallel entries "rather than losing coverage
# there", but that created two independent PR chains (one per branch) for
# every dependency bump, each mergeable on its own -- and in practice they
# drifted: PR #1232 (the v0.3.0 release promotion) hit 51 real merge
# conflicts against master, the large majority of which turned out to be
# master-only Dependabot PRs merged without ever porting the equivalent
# current_dev-side PR. `master` only receives new content via the release
# promotion from `current_dev` (see docs/release-versioning.md) -- scanning
# it separately worked against that model instead of with it. Dependency
# updates now flow the same way every other change does: land on
# `current_dev`, then ship to `master` at the next release.
#
# `v0.2.0` deliberately has NO entries here either: its branch protection sets
# `lock_branch: true` -- nothing can ever be merged into it regardless of
# update type, so scanning it only produced PRs that had to be closed
# unmerged. Re-adding a `target-branch: v0.2.0` block would not restore
# coverage for Dependabot's *security* updates either way: GitHub applies
# `target-branch` only to regular version-update PRs, not to
# security-update PRs, which always target the repository's default branch
# regardless of this file's contents. SECURITY.md also only supports the
# latest stable release, not archived point releases -- if `v0.2.0` needs a
# fix, that goes through a new release or a manual backport, not this file.
#
# BURST-FAN-OUT CONTROL (see issue #1065): each ecosystem is deliberately kept
# to ONE grouped update per target-branch so a weekly run opens ~3 PRs per
# branch, not one-per-directory. The Cargo and Docker blocks below use the
# multi-`directories` form with a single `groups:` entry so every crate's
# lockfile bump (Cargo) and every service Dockerfile's base-image bump (Docker)
# collapse into a SINGLE cross-directory PR per branch instead of one PR per
# directory. This matters because each merged PR is a push to a channel branch,
# and every such push runs the full per-service build/scan matrix on the scarce
# 5-runner `lancache-heavy` pool. The un-grouped, per-directory Docker layout
# previously fanned a single weekly `library/debian` digest bump out into six
# separate per-service PRs per branch; merging that backlog produced the
# near-simultaneous merge burst that saturated the heavy pool for over an hour
# (#1065). Grouping does not change WHAT gets updated -- only how many separate
# PRs/merges/pushes it takes to land the same set of updates.
#
# `schedule.day` is deliberately staggered across the three blocks below
# (Monday/Wednesday/Friday) rather than left at the shared implicit default
# (Monday for all three). Without this, a routine weekly run would still open
# all ~3 grouped PRs on the same day, and merging them still lands 3 pushes to
# `current_dev` in quick succession, each triggering the same scarce-runner-pool
# build/scan matrix this note already flags as the actual bottleneck (#1065,
# AG-CI-016/AG-CI-017's shared-runner-contention concerns) -- grouping bounds
# the PR *count*, staggering bounds how many of those pushes can land the same
# day.
#
# `groups.<name>.group-by: dependency-name` was evaluated and deliberately
# NOT added, despite real, confirmed cross-directory dependency overlap in
# both the `rust-deps` group (tokio/reqwest/serde/serde_json shared across
# all three crates; async-nats and axum shared by two of them) and the
# `docker-base-images` group (all six Dockerfiles pin the identical
# `alpine:3.24` base image). GitHub's own tutorial example for this option
# (see the `groups` reference page's "Grouping updates across directories in
# a monorepo" section) names the resulting PR after a single dependency
# ("Bump lodash in monorepo-dependencies group"), not after the group as a
# whole the way an ordinary multi-dependency grouped PR is titled ("Bump the
# X group with N updates") -- a real, structural signal that `group-by` may
# key PR creation per dependency name rather than per named group, which
# would fan a single already-grouped PR back out into one PR per updated
# dependency the moment more than one dependency in the same group needs
# updating in the same week. That is the exact opposite of this file's
# BURST-FAN-OUT CONTROL goal above, and the documentation available does not
# resolve the ambiguity for a `patterns: ["*"]` catch-all group with more
# than one dependency changing at once. Given the downside (silently
# reintroducing the #1065 fan-out this file exists to prevent) outweighs the
# upside (deduplicating a same-dependency line item across directories
# within an already-single PR), this was left out rather than shipped on an
# unconfirmed reading -- revisit only with a real, observed multi-dependency
# grouped run confirming the actual PR count `group-by` produces.
#
# Systematic pass against GitHub's full Dependabot options reference (F-18,
# issue #1095, prompted by real `@dependabot rebase` friction on PR #1399):
# the one real change applied is the `schedule.day` staggering above; the
# rest of the options considered (including `group-by` above) are recorded
# here specifically because the reasoning is not obvious from the option's
# mere absence, and because F-18 asked for the "why not" to be captured, not
# just the "what changed":
#
# * `rebase-strategy`: NOT set (kept at default). PR #1399's "Looks like this
#   PR has been edited by someone other than Dependabot" refusal is
#   Dependabot's unconditional default behavior the moment a non-Dependabot
#   commit lands on its branch -- it is independent of `rebase-strategy`,
#   which only controls Dependabot's own *automatic* rebase triggers (a
#   schedule run, a PR reopen, a `target-branch` change, or a conflict
#   discovered after a push to the target branch). Setting
#   `rebase-strategy: disabled` would not have prevented PR #1399's refusal,
#   and would cost this project the useful "auto-rebase on target-branch
#   conflict" behavior for every future PR. The real, better fix for next
#   time: a manual commit pushed onto a Dependabot branch that includes
#   `[dependabot skip]` (or `[skip dependabot]`/`[dependabot-skip]`/
#   `[skip-dependabot]`) in its own commit message lets Dependabot force-push
#   over it and keep rebasing normally -- a narrower, non-destructive
#   alternative to `@dependabot recreate` (which discards the PR's history).
# * `commit-message`: NOT set. This looked like a plausible fix for AG-GH-018
#   (Conventional-Commit PR titles) compliance, since Dependabot's own
#   PR-title heuristic has no way to match this project's `type(scope):
#   subject` taxonomy or its documented scope list. Checked
#   `scripts/check-pr-title-convention.sh` directly: it already
#   unconditionally exempts `PR_AUTHOR == "dependabot[bot]"` from the title
#   check (`pr-title-convention-check` job in build-push.yml), specifically
#   because Dependabot cannot conform to this taxonomy on its own. There is
#   no real compliance gap here to close with `commit-message.prefix`.
# * `open-pull-requests-limit`: NOT set (kept at the documented default of 5
#   per block). Each block already opens at most one grouped PR per branch
#   per week and that PR's branch is reused (rebased in place) by the next
#   scheduled run rather than opening a second one, so hitting the default
#   ceiling of 5 concurrent version-update PRs for a single block would
#   require several weeks of a PR sitting unmerged -- not a real constraint
#   this repo's actual review cadence has hit.
# * `ignore`: NOT set. No dependency in any of the three ecosystems currently
#   has a documented reason to be excluded from updates; adding a speculative
#   `ignore` entry with no real justification would violate this file's own
#   "don't add options blindly" mandate as much as leaving a real gap would.
# * `registries`: NOT applicable. This project uses only public package
#   registries (crates.io, Docker Hub / GHCR mirrors, the GitHub Actions
#   marketplace) -- there is no private registry for Dependabot to need
#   access-configuration for.
version: 2
updates:
  # GitHub Actions -- one grouped PR per target branch (single directory: /).
  - package-ecosystem: github-actions
    directory: /
    target-branch: current_dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Rust (Cargo) -- all three crates (Admin UI + DNS NATS subscriber +
  # watchdog, added 2026-08 alongside services/watchdog/Cargo.toml, #1355)
  # collapse into ONE grouped PR per target branch via the multi-`directories`
  # form, instead of a separate PR per crate directory.
  - package-ecosystem: cargo
    directories:
      - /services/ui
      - /services/dns/nats-subscriber
      - /services/watchdog
    target-branch: current_dev
    schedule:
      interval: weekly
      day: wednesday
    groups:
      rust-deps:
        patterns: ["*"]

  # Docker base images -- all service Dockerfiles collapse into ONE grouped PR
  # per target branch. Every listed service pins the identical Alpine base
  # image (`alpine:3.24`, per issue #815's Debian-to-Alpine migration), so a
  # single upstream digest bump previously opened six near-identical
  # per-service PRs per branch; the multi-`directories` group makes it one
  # cross-service PR.
  - package-ecosystem: docker
    directories:
      - /services/proxy
      - /services/dns
      - /services/watchdog
      - /services/dhcp
      - /services/dhcp-proxy
      - /services/ui
    target-branch: current_dev
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-base-images:
        patterns: ["*"]
