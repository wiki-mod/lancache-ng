
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: Dependabot updates for GitHub Actions only.
# Why: crates and base images resolve the latest per run.
version: 2
updates:
  # What: one grouped actions PR per branch, root only.
  # Why: the root directory covers every workflow.
  - package-ecosystem: github-actions
    directory: /
    target-branch: current_dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
