
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: Single source of truth for CI 2.0 build inputs.
# Why: One list ends the copied-in-many-places drift.
# From: Issue #1683
schema: build-manifest/v1

# What: runtime apk packages and smoke every image gets
# Why: CI tools belong to build-tools, not product images
# From: Issue #1683 | PR #1858
image_base:
  # What: apk packages each Dockerfile adds before ci.sh.
  # Why: ci.sh is bash; alpine has none (AG-REL-001).
  # From: Issue #1683 | PR #1912
  bootstrap:
    - bash
  packages:
    - ca-certificates
    - coreutils
    - curl
    - findutils
    - gettext-envsubst
    - grep
    - jq
    - sed
    - util-linux
    - zstd
  smoke:
    - bash --version
    - curl --version
    - envsubst --version
    - find --version
    - grep --version
    - jq --version
    - sed --version
    - zstd --version

# What: The product services this repository builds.
# Why: One list; matrices/scans/release derive from it.
# From: Issue #1683
services:
  # What: one image for watchdog, syslog, NTP and netdata.
  # Why: the watchdog owns the services image.
  # From: Issue #1683
  services:
    context: services/watchdog
    labels: [services, watchdog, syslog, ntp, netdata]
    # What: the image.description label ci.sh sets.
    # Why: the Dockerfile holds no label text (AG-CI-023).
    # From: Issue #1683 | PR #1912
    description: "LanCache-NG services: supervisor for watchdog, retention, syslog-ng, chrony and Netdata."
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: supervisor and cachehamster run in one container.
    # From: Issue #1683
    crates: [lancache-watchdog, lancache-cachehamster]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [watch, retention, syslog-ng, chronyd, netdata]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - group=@LOG_READER_GROUP@:@GID@
      - member=netdata:@LOG_READER_GROUP@
    final_base: alpine
    # What: final-image apk packages; the SOT owns the list.
    # Why: consumers derive; no hardcoding (AG-CI-006)
    # From: Issue #1683
    packages:
      - syslog-ng
      - chrony-nts
      - netdata
      - netdata-go-plugins
      - tzdata
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - syslog-ng --version
      - chronyd -v
      - netdata -v
  proxy:
    context: services/proxy
    labels: [proxy, nginx]
    description: "LanCache-NG proxy: nginx cache for HTTP and TLS-interception traffic."
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: the supervisor renders, certifies and runs nginx.
    # From: Issue #1683
    crates: [lancache-watchdog]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [nginx]
    # What: runtime defaults the Dockerfile takes as args.
    # Why: the image builds with the value; it names none.
    # From: Issue #1683 | PR #1912
    default_args: [NGINX_DIR]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - dir=@NGINX_DIR@/@NGINX_SUBDIR_CA@
      - dir=@NGINX_DIR@/@NGINX_SUBDIR_CERTS@
      - dir=@NGINX_CACHE_DIR@
    final_base: alpine
    # What: final-image apk packages; nginx from nginx.org.
    # Why: AG-KD-007: stream module only in nginx.org build.
    # From: Issue #1683 | PR #1858
    packages:
      - openssl
      - nginx@nginx
    # What: nginx.org mainline repo for the base's branch.
    # Why: ci.sh fills @ALPINE_BRANCH@ from the alpine pin.
    # From: Issue #1683 | PR #1858
    apk_repositories:
      - nginx=http://nginx.org/packages/mainline/alpine/@ALPINE_BRANCH@/main
    # What: the repo signing key and its sha256 pin.
    # Why: the tagged repo is trusted only with this key.
    # From: Issue #1683 | PR #1858
    apk_keys:
      - https://nginx.org/keys/nginx_signing.rsa.pub=ff7cf138acc09f2a5029300ab713fe6a1440605fca72e2bab76a4da9206fec87
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - 'v="$(nginx -V 2>&1)" && grep -q -- --with-stream_ssl_preread_module <<< "${v}"'
  dns:
    context: services/dns
    labels: [dns, pdns, nats]
    description: "LanCache-NG dns: PowerDNS auth, dns-http and dns-https recursors, NATS server and subscriber."
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: subscriber and supervisor run in one container.
    # From: Issue #1683
    crates: [nats-subscriber, lancache-watchdog]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [pdns, dns-http, dns-https, nats-server, nats-subscriber, soa]
    # What: runtime defaults the Dockerfile takes as args.
    # Why: the image builds with the value; it names none.
    # From: Issue #1683 | PR #1912
    default_args: [CDN_DOMAINS_FILE, PDNS_LUA_DNS_SCRIPT, PDNS_SCHEMA_FILE]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - dir=@PDNS_CONF_DIR@/auth
      - dir=@PDNS_DATA_DIR@:pdns
      - dir=@PDNS_RUN_DIR@:pdns
    final_base: alpine
    # What: final-image apk packages; the SOT owns the list.
    # Why: consumers derive; no hardcoding (AG-CI-006)
    # From: Issue #1683
    packages:
      - pdns
      - pdns-backend-sqlite3
      - pdns-recursor-luajit
      - nats-server
      - bind-tools
      - sqlite
      - iproute2
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - nats-server --version
  dhcp:
    context: services/dhcp
    labels: [dhcp, kea, dnsmasq]
    description: "LanCache-NG dhcp: Kea DHCP with control agent and DDNS, or dnsmasq proxy/relay, plus the DHCP probe."
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: the supervisor switches Kea and dnsmasq modes.
    # From: Issue #1683
    crates: [lancache-watchdog]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [kea-dhcp4, kea-ctrl-agent, kea-dhcp-ddns, dnsmasq, dhcp-probe]
    final_base: alpine
    # What: final-image apk packages; the SOT owns the list.
    # Why: consumers derive; no hardcoding (AG-CI-006)
    # From: Issue #1683
    packages:
      - kea-dhcp4
      - kea-ctrl-agent
      - kea-dhcp-ddns
      - kea-admin
      - kea-hook-lease-cmds
      - dnsmasq
      - openssl
      - iptables
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - kea-dhcp4 -v
      - lancache-watchdog probe
      - dnsmasq --version
  ui:
    context: services/ui
    labels: [admin-ui]
    description: "lancache-ng Admin UI and control-plane service for cache, DNS, DHCP, and secondary management."
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: rust checks target crates, not the build context
    # From: Issue #1683 | PR #1858
    crates: [lancache-ui]
    # What: runtime defaults the Dockerfile takes as args.
    # Why: the image builds with the value; it names none.
    # From: Issue #1683 | PR #1912
    default_args: [TEMPLATE_DIR, UI_LISTEN_PORT]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - group=@LOG_READER_GROUP@:@GID@
      - user=@LOG_READER_GROUP@:@GID@:@LOG_READER_GROUP@
    final_base: alpine

# What: The toolchain image that builds the product stack.
# Why: built by generic pipeline; not in stack
# From: Issue #1683
build_toolchain:
  build-tools:
    context: .github/build-tools
    labels: [build-tools]
    description: "Prebuilt lancache-ng CI and developer validation toolchain image (Alpine)."
    build_type: toolchain
    final_base: alpine
    # What: apk packages installed into the toolchain image.
    # Why: one list; gawk, parallel serve bats --jobs.
    # From: Issue #1683 | PR #1912
    packages:
      - actionlint
      - bats
      - bc
      - bind-tools
      - build-base
      - cargo
      - cargo-audit
      - ccache
      - clang22
      - cmake
      - distcc
      - distcc-pump
      - docker-cli
      - docker-cli-buildx
      - docker-cli-compose
      - expect
      - gawk
      - gcompat
      - gettext
      - git
      - github-cli
      - gnupg
      - iproute2
      - lld22
      - lsof
      - make
      - musl-dev
      - nano
      - nodejs
      - npm
      - openjdk21-jre-headless
      - openssl
      - openssl-dev
      - openssl-libs-static
      - parallel
      - perl
      - pkgconf
      - procps-ng
      - python3
      - ripgrep
      - rsync
      - run-parts
      - rust
      - rust-clippy
      - rustfmt
      - sccache
      - shellcheck
      - shfmt
      - sqlite
      - tcpdump
      - trivy@testing=0.74.0-r0
      - tzdata
      - xz
      - yq-go
      - zlib-dev
      - zlib-static
    # What: apk repos (tag=url) added by build and resolver
    # Why: trivy is only in edge/testing; @testing scopes it
    # From: Issue #1683 | PR #1858
    apk_repositories:
      - testing=http://dl-cdn.alpinelinux.org/alpine/edge/testing
    # What: tools only checked on PATH, with no run.
    # Why: a tool has one smoke entry, here or in runs.
    # From: Issue #1683
    smoke_tools:
      - ar
      - awk
      - basename
      - cargo-audit
      - cat
      - chgrp
      - chmod
      - chown
      - clang
      - clippy-driver
      - cmake
      - cp
      - dig
      - dirname
      - distcc
      - flock
      - getent
      - gzip
      - install
      - ip
      - ld.lld
      - make
      - mkdir
      - mktemp
      - mv
      - node
      - npm
      - openssl
      - pkg-config
      - ps
      - pump
      - rm
      - rsync
      - rustc
      - rustfmt
      - sha256sum
      - sort
      - tar
      - tcpdump
      - tee
      - timeout
      - xargs
    # What: Commands the toolchain smoke must run clean.
    # Why: present is not runnable; one owner of the runs.
    # From: Issue #1683 | PR #1858
    smoke_runs:
      - cargo --version
      - cargo fmt --version
      - cargo clippy --version
      - cargo audit --version
      - 'c="$(rustc --print cfg)" && grep -qx target_env=.musl. <<< "${c}"'
      - sccache --version
      - ccache --version
      - bc --version
      - docker --version
      - expect -v
      - gettext --version
      - gh --version
      - git --version
      - gpg --version
      - lsof -v
      - parallel --version
      - rg --version
      - xz --version
      - actionlint --version
      - bats --version
      - shellcheck --version
      - shfmt --version
      - yq --version
      - docker compose version
      - docker buildx version
      - dhclient --version
      - 'm="$(gcc -dumpmachine)" && [[ "${m}" == *-musl ]]'
      - trivy --version
      - java -version

# What: Pinned external base images by full digest.
# Why: Single owner of the alpine pin, no per-file copies.
# From: Issue #1683
base_images:
  alpine: "mirror.gcr.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"

# What: pinned external actions: uses, commit SHA, tag.
# Why: uses: reads no SOT; ci.sh checks each workflow pin.
# From: Issue #1683 | PR #1912
github_actions:
  attest:
    uses: actions/attest
    sha: "f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6"
    tag: v4.2.0
  checkout:
    uses: actions/checkout
    sha: "3d3c42e5aac5ba805825da76410c181273ba90b1"
    tag: v7.0.1
  claude-code:
    uses: anthropics/claude-code-action
    sha: "ed670b4cf9de2a5a570d130d2f6197b9e543cd64"
    tag: v1
  docker-login:
    uses: docker/login-action
    sha: "dbcb813823bdd20940b903addbd779551569679f"
    tag: v4.6.0

# What: the runtime group id the containers share.
# Why: ci.sh bakes it into each image; one owner.
# From: Issue #1683 | PR #1912
