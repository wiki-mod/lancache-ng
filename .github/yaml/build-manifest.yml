    - LOGGING_PROXY_ENABLED=1
    - LOGGING_DNS_ENABLED=1
    - LOGGING_DHCP_ENABLED=1
    - LOGGING_UI_ENABLED=1
    - NGINX_UPSTREAM_RESOLVER=8.8.8.8 8.8.4.4 [2001:4860:4860::8888] [2001:4860:4860::8844]
