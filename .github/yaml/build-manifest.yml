    - SETUP_SCRIPT_URL=@RAW_CONTENT_URL@/wiki-mod/lancache-ng/@SETUP_GIT_REF@/setup.sh
    - SETUP_SCRIPT_URL_NIGHTLY=@RAW_CONTENT_URL@/wiki-mod/lancache-ng/@SETUP_GIT_REF_NIGHTLY@/setup.sh
    - SNMP_AGENTX=0
    - SNMP_AGENTX_SOCKET=/var/agentx/master
    - SNMP_ALLOW_FROM=default
    - SNMP_COMMUNITY=
    - SNMP_DISK_MIN_FREE_PERCENT=10
    - SNMP_LISTEN=udp:@ANY_BIND_IP@:161
