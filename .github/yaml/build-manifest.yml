    - PDNS_SOA_RESYNC_INTERVAL=3600
    - CHECK_INTERVAL=30
    - RESTART_AFTER=3
    - DISK_WARN_PCT=85
    - DISK_ALARM_PCT=95
    - DOCKER_API_TIMEOUT=5
    - DOCKER_RESTART_TIMEOUT=30
    - SYSLOG_PRUNE_RETRY_COOLDOWN=3600
    - CACHEHAMSTER_CONCURRENCY=4
    - DHCP_LEASE_TIME=86400
    - CACHE_SLICE_SIZE=8m
    - CACHE_VALID_HIT=@CACHE_VALID_DAYS@d
    - CACHE_VALID_ANY=1m
    - CACHE_INACTIVE=@CACHE_VALID_DAYS@d
    - CACHE_MIN_FREE=1g
    - CACHE_VALID_DAYS=365
    - SYSLOG_MAX_GB=10
    - SYSLOG_RETENTION_DAYS=30
    - LOG_QUERIES=0
    - ROOT_ZONE_MIRROR=1
    - DHCP_DOMAIN=lan
