    # What: NS removal after 8 h and 3 failed checks.
    # Why: one short outage must not remove an NS.
    # From: Issue #1683
    - DNS_SECONDARY_NS_REMOVE_AFTER_SECONDS=28800
    - DNS_SECONDARY_NS_REMOVE_FAILS=3
    - DNS_SERVE_RFC1918=1
    # What: compose service name of the dns container.
    # Why: names differ per compose project; services stay.
    # From: Issue #1683 | PR #1980
    - DNS_SERVICE=dns
    - DNS_SNAPSHOT_DIR=@UI_DATA_DIR@/dns-snapshots
    - DNS_SNAPSHOT_KEEP=20
    - DOCKER_ENDPOINT=unix://@DOCKER_SOCKET@
    - DOCKER_TIMEOUT=30
    # What: Kea agent listens on all interfaces.
    # Why: the ui reaches it from its own network.
    # From: Issue #1683 | PR #1980
    - KEA_CTRL_ADDRESS=@ANY_BIND_IP@
    - KEA_DDNS_ADDRESS=@LOOPBACK_BIND_IP@
    - KEA_DDNS_PORT=53001
    - KEA_DHCP4_CONF_FILE=@KEA_DATA_DIR@/kea-dhcp4.conf
    - KEA_DHCP4_SOCKET=/run/kea/kea4-ctrl-socket
    - KEA_SNAPSHOT_KEEP=20
    - NGINX_CLIENT_ACL_FILE=@NGINX_CONF_DIR@/conf.d/client-acl.inc
    - NGINX_DEFAULT_CERT=default
    - NGINX_TEMPLATES=nginx.conf conf.d/http.conf conf.d/https.conf proxy-params.conf
    - NGINX_TEMPLATE_DIR=/usr/share/lancache/nginx
    - NTP_ALLOWED_CLIENT_CIDRS=@PRIVATE_NETS@
    - NTP_PROBE_WAIT_MS=2000
    - PDNS_API_ALLOW_FROM=@LOOPBACK_BIND_IP@ @PRIVATE_NETS@
    - PDNS_API_KEY=
    - PDNS_API_LISTEN=0.0.0.0
    - PDNS_AUTH_ADDRESS=@LOOPBACK_BIND_IP@
    - PDNS_AXFR_FROM=
    - PDNS_DATABASE=@PDNS_DATA_DIR@/pdns.sqlite3
    # What: PowerDNS backend module.
    # Why: sqlite file in PDNS_DATABASE.
    # From: Issue #1683 | PR #1858
    - PDNS_LAUNCH=gsqlite3
    - PDNS_DEFAULT_SOA=ns1.@DHCP_DOMAIN@ hostmaster.@DHCP_DOMAIN@ 0 30 10 604800 300
    # What: name of the HTTPS IP, A and PTR, never NS.
    # Why: HTTPS is optional; ns1 is the name server.
    # From: Issue #1683
    - DNS_NS_HTTPS_NAME=ns2.@DHCP_DOMAIN@
    - PDNS_DNSUPDATE_FROM=@PRIVATE_NETS@
    - PDNS_LISTEN=0.0.0.0
    - PDNS_PRIMARY_API_URL=http://@DNS_SERVICE@:@PDNS_AUTH_API_PORT@/api/v1/servers/localhost
    - PDNS_SECONDARY_API_URL=
    # What: SOA serial rule for API and DDNS writes.
    # Why: a change raises the serial; NOTIFY follows.
    # From: Issue #1683 | PR #1980
    - PDNS_SOA_EDIT=INCREASE
    - PDNS_XFR_CYCLE=60
    - PROXY_ALLOWED_CLIENT_CIDRS=@PRIVATE_NETS@ fc00::/7
    # What: syslog folder holding proxy access lines.
    # Why: syslog-ng files them under the container.
    # From: Issue #1683 | PR #1985
    - PROXY_LOG_PROGRAM=@CONTAINER_NAME_PROXY@
    - RECURSOR_AAAA_LUA_FILE=@CONFIG_DIR@/dns/filter-aaaa.lua
    - RECURSOR_RUN_DIR=/var/run/pdns-recursor
    - CHRONY_CONF_FILE=@CONFIG_DIR@/services/chrony.conf
    - CONFIG_DIR=/etc/lancache
    - UI_CONTENT_TYPE_OPTIONS=nosniff
    - "UI_CSP=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:"
    - UI_FRAME_OPTIONS=DENY
    - UI_HSTS=max-age=31536000; includeSubDomains
    - UI_REFERRER_POLICY=no-referrer
    - DHCP_MODE_FILE=@CONFIG_DIR@/dhcp/mode
    # What: OpenRC run state; dns and dhcp clear it.
    # Why: /run outlives a restart without tmpfs.
    # From: Issue #1683 | PR #1980
    - RUN_DIR=/run
    - OPENRC_STATE_DIR=/run/openrc
    # What: OpenRC setup ci.sh openrc-setup writes.
    # Why: dns, dhcp, services read one list.
    # From: Issue #1683
    - OPENRC_RC_CONF=/etc/rc.conf
    - OPENRC_RC_SETTINGS=rc_sys=docker rc_env_allow=* rc_controller_cgroups=NO rc_cgroup_mode=legacy
    - OPENRC_INIT_DIR=/etc/init.d
    - OPENRC_RUNLEVEL_DIR=/etc/runlevels
    - OPENRC_DROP_RUNLEVELS=sysinit boot
    - OPENRC_DEFAULT_RUNLEVEL=default
    - OPENRC_SUPERVISOR=supervise-daemon
    - OPENRC_RESPAWN_DELAY=2
    - OPENRC_OUTPUT_LOG=/proc/1/fd/1
    - OPENRC_ERROR_LOG=/proc/1/fd/2
    - LANCACHE_INIT_FILE=/usr/local/bin/lancache-init
    # What: reload commands per owner without HUP.
    # Why: DoMe 06.11.: a dns toggle restarted dns.
    # From: Issue #1683
    - RELOAD_EXEC=dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=http+reload-lua-config dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=http+reload-acls dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=http+reload-zones dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=http+reload-lua-script dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=http+wipe-cache+.$ dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=https+reload-lua-config dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=https+reload-acls dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=https+reload-zones dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=https+reload-lua-script dns:rec_control+--socket-dir=@RECURSOR_RUN_DIR@+--config-name=https+wipe-cache+.$ proxy:rc-service+nginx+reload ui:rc-service+lancache-ui+reload
    # What: snmpd reload per container on a new snmpd.conf.
    # Why: one file, several snmpd; HUP rereads it.
    # From: Issue #1683
    - SNMPD_RELOAD_EXEC=dns:rc-service+snmpd+reload proxy:rc-service+snmpd+reload ui:rc-service+snmpd+reload
    # What: pdns restart on a new pdns.conf.
    # Why: pdns reads its config only at start.
    # From: Issue #1683
    - PDNS_RESTART_EXEC=dns:rc-service+pdns+restart
    # What: dnsdist restart on a new dnsdist.conf.
    # Why: dnsdist reads its config only at start.
    # From: Issue #1683
    - DNSDIST_RESTART_EXEC=dns:rc-service+dnsdist+restart
    # What: dnsmasq restart on a proxy/relay switch.
    # Why: both sub-modes run the same dnsmasq daemon.
    # From: Issue #1683
    - DNSMASQ_RESTART_EXEC=dhcp:rc-service+dnsmasq+restart
    - NGINX_CONF_DIR=@CONFIG_DIR@/proxy
    - DNSMASQ_CONF_FILE=@CONFIG_DIR@/dhcp/dnsmasq.conf
    - KEA_CTRL_CONF_FILE=@CONFIG_DIR@/dhcp/kea-ctrl-agent.conf
    - KEA_DDNS_CONF_FILE=@CONFIG_DIR@/dhcp/kea-dhcp-ddns.conf
    - PDNS_CONF_FILE=@CONFIG_DIR@/dns/pdns.conf
    - DNSDIST_CONF_FILE=@CONFIG_DIR@/dns/dnsdist.conf
    - RECURSOR_HTTP_CONF_FILE=@CONFIG_DIR@/dns/recursor-http.yml
    - RECURSOR_HTTP_LUA_FILE=@CONFIG_DIR@/dns/http.lua
    - RECURSOR_HTTP_RPZ_FILE=@CONFIG_DIR@/dns/http.rpz
    - RECURSOR_HTTPS_CONF_FILE=@CONFIG_DIR@/dns/recursor-https.yml
    - RECURSOR_HTTPS_LUA_FILE=@CONFIG_DIR@/dns/https.lua
    - RECURSOR_HTTPS_RPZ_FILE=@CONFIG_DIR@/dns/https.rpz
    # What: dnsdist listens on DNS_PORT and DNS_HTTPS_PORT.
    # Why: compose maps IP_HTTP and IP_HTTPS to these ports.
    # From: Issue #1683
    - DNSDIST_LISTEN=0.0.0.0
    # What: dnsdist sender; 127/8, not LOOPBACK_BIND_IP.
    # Why: pdns and recursors trust its proxy header.
    # From: Issue #1683
    - DNSDIST_SOURCE_ADDRESS=127.126.125.124
    # What: soft open-files limit of dnsdist.
    # Why: its TCP queue needs over 10000 descriptors.
    # From: Issue #1683
    - DNSDIST_OPEN_FILES=65536
    # What: recursors listen behind dnsdist only.
    # Why: dnsdist owns DNS_PORT and DNS_HTTPS_PORT.
    # From: Issue #1683
    - RECURSOR_HTTP_LISTEN=@LOOPBACK_BIND_IP@
    - RECURSOR_HTTP_PORT=5301
    - RECURSOR_HTTP_API_PORT=@PDNS_HTTP_API_PORT@
    - RECURSOR_HTTPS_LISTEN=@LOOPBACK_BIND_IP@
    - RECURSOR_HTTPS_PORT=5302
    - RECURSOR_HTTPS_API_PORT=@PDNS_HTTPS_API_PORT@
    - SNMPD_CONF_FILE=@CONFIG_DIR@/services/snmpd.conf
    - SYSLOG_CONF_FILE=@CONFIG_DIR@/services/syslog-ng.conf
    - RECURSOR_API_URLS=http://@DNS_SERVICE@:@PDNS_HTTP_API_PORT@/api/v1/servers/localhost http://@DNS_SERVICE@:@PDNS_HTTPS_API_PORT@/api/v1/servers/localhost
    - REPO_URL=https://github.com/wiki-mod/lancache-ng
    - SECRETS_DIR=@LANCACHE_SHARED_SECRET_DIR@
