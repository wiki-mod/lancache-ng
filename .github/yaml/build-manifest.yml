  # Why: setup.sh and ci.sh filter one list.
  # From: Issue #1683 | PR #1912
  managed_secrets:
    - KEA_CTRL_TOKEN hex32 stack
    - PDNS_API_KEY hex32 stack
    - SNMP_COMMUNITY hex32 stack
    - SECONDARY_REGISTRATION_TOKEN hex32 stack
    - DDNS_TSIG_KEY base64_32 stack
    - UI_AUTH_PASSWORD alnum20 ui
    - UI_AUTH_PASSWORD_HASH argon2id ui
  # What: "kind command" that makes one secret kind.
  # Why: setup.sh and ci.sh run it; no generator copy.
  # From: Issue #1683 | PR #1858
  secret_generators:
    - hex32 openssl rand -hex 32
    - base64_32 openssl rand -base64 32
  # What: .env keys of a current_dev quickstart install.
  # Why: update turns their relative paths absolute.
  # From: Issue #1683 | PR #1912
  quickstart_path_keys:
    - CACHE_DIR
    - KEA_DATA_DIR
    - NTP_DATA_DIR
    - CACHEHAMSTER_DATA_DIR
  # What: helper files a quickstart install copied in.
  # Why: the migration removes them last.
  # From: Issue #1683 | PR #1912
  quickstart_bundle_copies:
    - scripts/shared-secret-bootstrap.sh
    - scripts/untracked/docker-socket-proxy.sh
  # What: quickstart volume and its prod state-dir key.
  # Why: prod binds these as dirs, not as named volumes.
  # From: Issue #1683 | PR #1912
  quickstart_volume_keys:
    - pdns-data-standard PDNS_DIR
    - pdns-filter-state PDNS_FILTER_STATE_DIR
    - logs-syslog-ng SYSLOG_NG_LOG_DIR
  # What: v0.3.2 quickstart volumes left as they are.
  # Why: logs, snapshots, DNS db, NATS, Netdata; no home.
  # From: Issue #1683 | PR #1858
  quickstart_volumes_kept:
    - logs
    - dns-logs-standard
    - dns-logs-ssl
    - proxy-logs
    - syslog-data
    - ui-logs
    - watchdog-logs
    - pdns-config-snapshots-standard
    - pdns-config-snapshots-ssl
    - pdns-data-ssl
    - nats-conf
    - nats-data
    - nats-logs
    - netdatacache
    - netdataconfig
    - netdatalib
    - netdata-logs
  # What: prod state dir keys as "KEY STATE_SUBDIR_NAME".
  # Why: shell reads this list, not the compose text.
  # From: Issue #1683 | PR #1912
  state_dir_keys:
    - SYSLOG_NG_LOG_DIR STATE_SUBDIR_SYSLOG_NG
    - NTP_DATA_DIR STATE_SUBDIR_NTP
    - CACHEHAMSTER_DATA_DIR STATE_SUBDIR_CACHEHAMSTER
    - CA_DIR STATE_SUBDIR_CA
    - PDNS_DIR STATE_SUBDIR_PDNS
    - PDNS_FILTER_STATE_DIR STATE_SUBDIR_PDNS_FILTER
    - KEA_DATA_DIR STATE_SUBDIR_KEA
    - CACHE_DIR STATE_SUBDIR_CACHE
  # What: archive compressors, best first: ext command args.
  # Why: logbundle takes the first present; tar writes it.
  # From: Issue #1683 | PR #1912
  archive_compressors:
    - zst zstd -T0 -q -c
    - bz2 bzip2 -c
    - gz gzip -c

# What: external tools: repository, asset; latest release.
# Why: no third-party pin; ci.sh resolves tag and sha256.
# From: Issue #1683
external_versions:
  # What: CodeQL CLI bundle the codeql job downloads.
  # Why: the only owner; codeql.yml names no version.
  # From: Issue #1683 | PR #1858
  codeql:
    repository: github/codeql-action
    asset: codeql-bundle-linux64.tar.gz
  # What: Actions runner a new self-hosted host installs.
  # Why: runner-fetch takes the latest release, verified.
  # From: Issue #1622 | PR #1624
  runner:
    repository: actions/runner
    asset: actions-runner-linux-x64-@VERSION@.tar.gz

# What: The one authoritative platform list for all targets.
# Why: Platform is a parameter, not a twin/list.
# From: Issue #1683
build_matrix:
  platforms: [linux/amd64, linux/arm64]

# What: per-arch apk arch, rust target, both runner labels.
# Why: one SOT owner; no platform case dup in ci.sh.
# From: Issue #1683 | PR #1912
platform_arch:
  # What: runner = GitHub-hosted; runner_self_hosted = fleet
  # Why: the fleet builds on lancache-heavy; no arm64 host.
  # From: Issue #1683 | PR #1912
  amd64:
    apk: x86_64
    # What: true = host job, build-tools by docker run.
    # Why: JS actions run in Alpine on x64 only.
    # From: Issue #1683 | PR #1984
    native: false
    runner: ubuntu-latest
    runner_self_hosted: lancache-heavy
    rust_target: x86_64-alpine-linux-musl
  arm64:
    apk: aarch64
    native: true
    runner: ubuntu-24.04-arm
    runner_self_hosted: ubuntu-24.04-arm
    rust_target: aarch64-alpine-linux-musl

# What: timeout minutes per workflow job id; one owner
# Why: a job before job-settings repeats it as literal
# From: Issue #1683 | PR #1858
ci_job_timeouts:
  aggregate: 30
  analyze: 120
  assemble: 30
  build: 90
  cargo-audit: 30
  channel-check: 60
  checks: 30
  cut-release-tag: 15
  gc: 60
  nightly: 30
  orphaned-branches: 15
  plan: 30
  promote: 30
  promote-build-tools: 15
  publish-draft: 15
  release: 30
  release-draft: 15
  release-provenance: 30
  release-sbom: 60
  scan: 60
  test: 45
  validate: 60

# What: CI phases that must run and succeed on every run.
# Why: §62: plan always runs; others green or skipped.
# From: Issue #1683 | PR #1858
ci_result_gate:
  required: [plan]

# What: input globs per check; @shell = shell sources.
# Why: §98: plan runs a check only if an input changed.
# From: Issue #1683 | PR #1858
ci_check_inputs:
  action-node-versions: ["@{ci_variables.CI_WORKFLOW_DIR}/**"]
  actionlint: ["@{ci_variables.CI_WORKFLOW_DIR}/**"]
  bats-and-chain: [".github/scripts/*.bats"]
  changelog-direct-edit: ["@{ci_variables.CI_CHANGELOG}"]
  ci-bats:
    - ".github/scripts/*.bats"
    - "deploy/**"
    - "@{ci_variables.CI_README}"
    - "@{ci_variables.CI_INSTALLER}"
    - "@{services.ui.context}/src/main.rs"
  codeql-coverage: ["**/*.rs", "**/Cargo.toml"]
  comments: ["**"]
  deny-short-sha:
    - "@shell"
    - "**/Dockerfile"
    - "@{ci_variables.CI_WORKFLOW_DIR}/*.yml"
    - "**/*.rs"
  executable-bits: []
  exit-evidence: []
  governance-guards: ["**"]
  language-policy: ["**"]
  line-endings: ["**"]
  mutable-refs:
    - "@{ci_variables.CI_WORKFLOW_DIR}/*.yml"
    - "**/Dockerfile"
  shell-guards: ["@shell", "**/Dockerfile"]
  shellcheck: ["@shell"]
  sot-identity-inputs: []
  workflow-ci-variables: ["@{ci_variables.CI_WORKFLOW_DIR}/**"]
  workflow-job-settings: ["@{ci_variables.CI_WORKFLOW_DIR}/**"]
  workflow-line-limit: ["@{ci_variables.CI_WORKFLOW_DIR}/**"]

# What: standing tracking issues the CI files and closes.
# Why: one owner for label, scope and the jobs a kind reads.
# From: Issue #1683 | PR #1912
status_reports:
  # What: the trivy kinds get -<service>-<arch> appended.
  # Why: one issue per service, architecture and cause.
  # From: Issue #1683 | PR #1912
  trivy-finding:
    label: trivy-finding
    scope: "Trivy @SEVERITY@ finding in @SERVICE@ (@ARCH@) not covered by @IGNORE@"
  trivy-db-unavailable:
    label: trivy-db-unavailable
    scope: "Trivy vulnerability DB missing or stale for @SERVICE@ (@ARCH@) after every retry"
  trivy-scan-error:
    label: trivy-scan-error
    scope: "Trivy scan of @SERVICE@ (@ARCH@) gave no report while its DB was present (pull, auth, config or scanner error)"
  # What: one repository issue, no service or arch suffix.
  # Why: every image shares the one ignore file.
  # From: Issue #1683 | PR #1858
  trivy-ignore-stale:
    label: trivy-ignore-stale
    scope: "@IGNORE@ holds ids no full scan matched; remove them"
  # What: the nightly kinds name the jobs they judge.
  # Why: the report job reads the needs; no job id in code.
  # From: Issue #1683 | PR #1912
  nightly-cargo-audit:
    label: nightly-cargo-audit
    scope: "nightly cargo-audit of @{ci_variables.CI_CARGO_LOCK}"
    jobs: [cargo-audit]
  nightly-promote:
    label: nightly-promote
    scope: "nightly validate and promote of the accepted stack"
    jobs: [platform, plan, validate, nightly]
  # What: one issue per channel; -<channel> is appended.
  # Why: nightly (current_dev) and latest (master) differ.
  # From: Issue #1683 | PR #1858
  channel-check:
    label: channel-check
    scope: "daily pull by tag and start of one mutable channel"
  # What: a platform left out of a service index.
  # Why: platforms ship alone; a gap opens an issue.
  # From: Issue #1683 | PR #1858
  platform-mismatch:
    label: platform-mismatch
    scope: "@SERVICE@ (@ARCH@) not accepted in this run; its channels keep the earlier @ARCH@ image"

# What: Build-identity inputs per build type (§7).
# Why: Impact is content-identity, never path-touched alone.
# From: Issue #1683
build_identity:
  rust:
    inputs: [source_sha, toolchain_packages, base_digest, build_variables, package_refresh]
    # What: build-tools apk packages a rust build runs.
    # Why: only they and their deps key the id (§39).
    # From: Issue #1683 | PR #1858
    toolchain_packages: [rust, cargo, build-base]
  toolchain:
    inputs: [toolchain_source_sha, base_digest, package_refresh]
  # What: apk-only images: no Rust, no toolchain.
  # Why: source, base and package refresh key the id.
  # From: Issue #1683 | PR #1858
  apk:
    inputs: [source_sha, base_digest, package_refresh]

# What: the events §17 names as a controlled refresh.
# Why: such a run has no base; missing then proves BUILD.
# From: Issue #1683 | PR #1912
build_admission:
  refresh_events: [workflow_dispatch, schedule]

# What: apk packages every image of a build type needs.
# Why: musl rust binaries link libgcc_s.so.1 dynamically.
# From: Issue #1683 | PR #1858
build_runtime:
  rust:
    packages: [libgcc]
    # What: ldd the crate binary; the binary never runs.
    # Why: a missing .so must fail verify, not validate.
    # From: Issue #1683 | PR #1858
    smoke:
      - ldd /usr/local/bin/@CRATE@

# What: build-only secret mounts and their bake guard.
# Why: set-runtime, mounts and the guard share one list.
# From: Issue #1683 | PR #1858
build_secrets:
  mount_ids: [project_selfhosted_proxy_ca, sccache_policy, sccache_redis_url, ccache_redis_url, sccache_gha, sccache_dist_config, distcc_potential_hosts]
  bake_env_prefixes: [HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy, GOPROXY, SCCACHE_, CCACHE_, DISTCC_, ACTIONS_]
  runtime_dir_name: ci-runtime-secrets

# What: git identity of CI's own commits and tags.
# Why: runners set no git user; one value owner.
# From: Issue #1683 | PR #1858
git_bot:
  name: "github-actions[bot]"
  email: "41898282+github-actions[bot]@users.noreply.github.com"

# What: CodeQL query suites and ignored paths.
# Why: One SOT owner; codeql.yml/ci.sh derive, no dup.
# From: Issue #1683
codeql:
  queries: [security-extended, security-and-quality]
  paths_ignore: ["**/target/**"]

# What: Analyzed paths per CodeQL language (entry=language).
# Why: read like services; generic block reader, no dup.
# From: Issue #1683
codeql_languages:
  actions:
    paths: ["@{ci_variables.CI_WORKFLOW_DIR}"]
  rust:
    files: ["*.rs"]
    # What: @rust_workspace = the Cargo.toml member dirs.
    # Why: the member list has one owner, Cargo.toml.
    # From: Issue #1683 | PR #1912
    paths: ["@rust_workspace"]

# What: release channels, validation and GC inputs
# Why: AG-REL-010; the version is PROJECT_RELEASE_VERSION
# From: Issue #1683 | PR #1858
release:
  registry: ghcr.io
  # What: release tag grammar, final and prerelease.
  # Why: setup.sh and ci.sh read it; no regex copies.
  # From: Issue #1683 | PR #1912
  tag_final: ^v[0-9]+\.[0-9]+\.[0-9]+$
  tag_prerelease: ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$
  # What: grammar of a commit image tag: sha-<40 hex>.
  # Why: AG-REL-015 full SHA; setup.sh pins only these.
  # From: Issue #1683 | PR #1912
  tag_commit: ^sha-[0-9a-f]{40}$
  # What: prefix of the per-identity, per-arch image tag.
  # Why: sha- names a commit only (AG-REL-015).
  # From: Issue #1683 | PR #1912
  tag_identity_prefix: identity-
  # What: SPDX license of the whole project.
  # Why: crates and image labels read it; no literal copies.
  # From: Issue #1683 | PR #1858
  license: AGPL-3.0-or-later
  # What: path of the §59 provenance predicate type URI.
  # Why: ci.sh prefixes the repo URL; no YAML literal.
  # From: Issue #1683 | PR #1858
  provenance_predicate: ci-2.0/provenance/v1
  # What: Rust edition of every first-party crate.
  # Why: Cargo.toml is synced from it; no literal copy.
  # From: Issue #1683 | PR #1858
  rust_edition: 2024
  channels:
    nightly:
      mutable: true
      # What: the ref a nightly run checks out and builds
      # Why: AG-REL-009: nightly comes from current_dev only
      # From: Issue #1683 | PR #1858
      source_ref: refs/heads/current_dev
    latest:
      mutable: true
      # What: pushes to this ref move the channel.
      # Why: one ref->channel owner; ci.sh has no literal.
      # From: Issue #1683
      ref: refs/heads/master
      # What: the tree the channel check starts latest from.
      # Why: its compose must match the images latest holds.
      # From: Issue #1683 | PR #1858
      source_ref: refs/heads/master
      # What: final vX.Y.Z tags also move this channel.
      # Why: AG-REL-009 release channel; read by ci.sh.
      # From: Issue #1683
      release_tags: true
      # What: old names of this channel in an install .env.
      # Why: setup.sh update rewrites them; never offered.
      # From: Issue #1683 | PR #1858
      former_names: [stable]
  # What: the install mode that pins one fixed tag.
  # Why: release doc: pinned stays a channel value.
  # From: Issue #1683 | PR #1858
  pinned_channel: pinned
  # What: refused channel names and why they went.
  # Why: release doc: a clear error, no fallback.
  # From: Issue #1683 | PR #1858
  retired_channels:
    edge: "renamed to nightly in v0.3.0"
    dev: "retired in v0.3.0"
  # What: channel a ref without its own channel uses.
  # Why: AG-REL-009 pre-release default; no ci.sh literal.
  # From: Issue #1683
  default_channel: nightly
  # What: channel setup.sh install offers as its default.
  # Why: latest is the default; nightly only with warning.
  # From: Issue #1683 | PR #1858
  install_channel: latest
  # What: ref prefix of the per-channel promote lock.
  # Why: setup.sh waits while promote moves channel tags.
  # From: Issue #1683 | PR #1858
  promote_lock_ref: refs/ci/promote-lock
  # What: prefix of the branch a stable release keeps.
  # Why: release doc 2.3; AG-REL-014 protects release/*.
  # From: Issue #1683
  release_branch_prefix: release/
  # What: setup.sh lock checks and seconds between them.
  # Why: an install must not mix tags of a running promote.
  # From: Issue #1683 | PR #1858
  install_lock_tries: 30
  install_lock_poll_seconds: 10
  # What: GC grace window and the delete policy gate
  # Why: §76: unreachable versions go only after the grace
  # From: Issue #1683 | PR #1858
  retention:
    deletion_policy: manual-or-approved-automation-only
    unaggregated_grace_minutes: 1440
    # What: newest vX.Y release lines whose tags GC keeps.
    # Why: newest release line and the one below stay.
    # From: Issue #1683 | PR #1858
    keep_release_lines: 2
    # What: release tags GC never deletes (migration steps).
    # Why: an upgrade path from an old line must stay.
    # From: Issue #1683 | PR #1858
    migration_releases: []

# What: path classes for PR labels and validation layers
# Why: service/toolchain labels apply under their context.
# From: Issue #1683 | PR #1858
pr_labels:
  setup: [setup.sh, "deploy/**"]
  docker: ["deploy/**", "**/Dockerfile"]
  rust: ["**/*.rs"]
  ci: ["@{ci_variables.CI_WORKFLOW_DIR}/**", ".github/scripts/**", ".github/yaml/**"]
  github_actions: ["@{ci_variables.CI_WORKFLOW_DIR}/**"]
  documentation: ["docs/**", "**/*.md"]

# What: release notes in the release-drafter v7 layout.
# Why: the maintainer keeps the known draft and its format.
# From: Issue #1683 | PR #2004
release_notes:
  header: "## Changes"
  category_template: "## $TITLE"
  change_template: "- #$NUMBER | $TITLE"
  title_escapes: '\<*_&'
  no_changes: "* No changes"
  name_template: "v$RESOLVED_VERSION"
  skip_label: skip-changelog
  fallback_increment: patch
  # What: PRs read per commit; recent merged PRs rechecked.
  # Why: release-drafter limits 5 and 5; same PR set.
  # From: Issue #1683 | PR #2004
  pull_request_limit: 5
  recent_merged_lookback: 5
  # What: pushes to these refs refresh the one draft.
  # Why: release-drafter ran on both; last push wins.
  # From: Issue #1683 | PR #2004
  draft_refs: [refs/heads/current_dev, refs/heads/master]
  # What: discussion category a published release opens.
  # Why: maintainer: every release gets its discussion.
  # From: Issue #1683 | PR #2004
  discussion_category: Announcements
  # What: PR label that marks a deliberate CHANGELOG.md edit
  # Why: the release flow owns the file; a label opts in
  # From: Issue #1683 | PR #1858
  changelog_edit_label: release

# What: notes groups in order: icon title, labels, bump.
# Why: a PR shows in every group whose label it carries.
# From: Issue #1683 | PR #2004
release_notes_categories:
  fixed:
    title: "🐛 Fixed"
    labels: [bug]
    increment: patch
  added:
    title: "🚀 Added"
    labels: [enhancement]
    increment: minor
  documentation:
    title: "📚 Documentation"
    labels: [documentation]
    increment: patch
  dependencies:
    title: "🔧 Dependencies"
    labels: [dependencies]
    increment: patch
  chore:
    title: "🧰 Chore / CI"
    labels: [chore, ci]
    increment: patch

# What: CI runtime variables with their fallback defaults.
# Why: No hardcode, like CARGO_BUILD_JOBS (AG-CI-006).
# From: Issue #1683
ci_variables:
  # What: cargo fmt/clippy/test in CI; off unless "true".
  # Why: AG-VAL-008: a variable, disabled by default.
  # From: Issue #1683
  CI_RUST_VALIDATION: "false"
  # What: lowest Node major an action may run on.
  # Why: nothing below Node 24; a name list misses names.
  # From: Issue #1683 | PR #1858
  CI_ACTION_NODE_MIN: "24"
  # What: GitHub REST API base for release lookups.
  # Why: one owner; host and job use the same base.
  # From: Issue #1683 | PR #1858
  CI_GITHUB_API_URL: https://api.github.com
  # What: backtrace switch of the CI cargo test run.
  # Why: a panicking test shows where (AG-INT-002).
  # From: Issue #1683 | PR #1912
  RUST_BACKTRACE: "1"
  # What: sccache cache mode: required, optional or off.
  # Why: AG-CI-004 mode; required fails closed (AG-CI-011).
  # From: Issue #1683 | PR #1858
  SCCACHE_REDIS_MODE: required
  # What: sccache Redis key prefix; ci.sh adds -<service>.
  # Why: one owner for the project's shared cache namespace.
  # From: Issue #1683 | PR #1912
  CI_CACHE_PREFIX: lancache-ng
  # What: CARGO_HOME of rust-build; cache mount root.
  # Why: §39 Cargo registry and git caches as mounts.
  # From: Issue #1683 | PR #1912
  CI_CARGO_HOME: /root/.cargo
  # What: mount point of the build context in rust-build.
  # Why: the tree is mounted, not copied.
  # From: Issue #1683 | PR #1858
  CI_RUST_SOURCE_DIR: /src
  # What: sccache dist toolchain cache size in bytes.
  # Why: AG-CI-006: no size literal in the dist config.
  # From: Issue #1683 | PR #1858
  CI_SCCACHE_DIST_TOOLCHAIN_CACHE_SIZE: 5368709120
  # What: compiler VAR=driver pairs; the first is default.
  # Why: distcc, ccache and smoke read one compiler list.
  # From: Issue #1683 | PR #1858
  CI_TOOLCHAIN_COMPILERS: CC=cc GCC=gcc CXX=c++ GXX=g++
  # What: kill timeout (s) of the GHA runtime export step.
  # Why: AG-CI-016: every container command is bounded.
  # From: Issue #1683 | PR #1858
  CI_GHA_RUNTIME_EXPORT_TIMEOUT: 30
  # What: kill timeout (s) of a docker run/exec CI command.
  # Why: AG-CI-016 needs an unignorable kill timeout.
  # From: Issue #1683 | PR #1858
  CI_CONTAINER_CMD_TIMEOUT: 120
  # What: workspace toml and the lock ci.sh generates.
  # Why: no lock in git; cargo resolves the latest.
  # From: Issue #1683 | PR #1858
  CI_CARGO_MANIFEST: Cargo.toml
  CI_CARGO_LOCK: Cargo.lock
  # What: the installer script the stack checks read.
  # Why: one path owner; ci.sh holds no installer literal.
  # From: Issue #1683 | PR #1858
  CI_INSTALLER: setup.sh
  # What: the trivy ignore list scans and VEX read.
  # Why: one path owner for scan, release VEX, vex-drift.
  # From: Issue #1683 | PR #1858
  CI_TRIVY_IGNORE: .trivyignore.yaml
  # What: file name of the OpenVEX release asset.
  # Why: one name owner for the asset and the notes.
  # From: Issue #1683 | PR #1858
  CI_RELEASE_VEX_ASSET: vex.openvex.json
  # What: color of a created status label.
  # Why: one owner for the tracking labels' look.
  # From: Issue #1683 | PR #1912
  CI_STATUS_LABEL_COLOR: b60205
  # What: raw evidence bytes one status issue carries.
  # Why: GitHub caps a body; the run log holds the rest.
  # From: Issue #1683 | PR #1912
  CI_STATUS_EVIDENCE_BYTES: 20000
  # What: log lines a failed validation run container ships.
  # Why: the cause sits at the log end; the rest is run log.
  # From: Issue #1683 | PR #1912
  CI_VALIDATE_RUN_LOG_TAIL: 80
  # What: PR actors whose token cannot write issues.
  # Why: a status write would fail; the report says NOT-RUN.
  # From: Issue #1683 | PR #1912
  CI_READONLY_TOKEN_ACTORS: dependabot[bot]
  # What: repo paths the checks read; one owner each.
  # Why: ci.sh joins them via _ci_repo_path, no literals.
  # From: Issue #1683 | PR #1858
  CI_WORKFLOW_DIR: .github/workflows
  CI_PR_TEMPLATE: .github/pull_request_template.md
  CI_CHANGELOG: CHANGELOG.md
  CI_README: README.md
  CI_ARCH_DOC: docs/architecture-ng.md
  CI_BACKUP_RESTORE_DOC: docs/README.md
  CI_DOCS_DIR: docs
  # What: attempts and backoff base of the retry owner.
  # Why: AG-CI-006: a retry/timeout value has one owner.
  # From: Issue #1683 | PR #1858
  CI_RETRY_MAX_ATTEMPTS: 4
  CI_RETRY_BACKOFF_BASE_SECONDS: 1
  # What: connect and total seconds of one raw content read.
  # Why: AG-CI-006: a timeout value has one owner.
  # From: Issue #1683 | PR #1912
  CI_RAW_GET_CONNECT_TIMEOUT: 10
  CI_RAW_GET_MAX_TIME: 30
  # What: connect seconds and stall seconds of one download.
  # Why: a stalled transfer ends; _ci_retry tries again.
  # From: Issue #1683 | PR #1858
  CI_DOWNLOAD_CONNECT_TIMEOUT: 10
  CI_DOWNLOAD_STALL_SECONDS: 30
  # What: exactly true moves CI jobs to runner_self_hosted.
  # Why: GitHub-hosted is the default; a repo var switches.
  # From: Issue #1683 | PR #1912
  PROJECT_SELFHOSTED_RUNNER_USAGE_CI: "false"
  # What: the trivy scanners every image scan runs.
  # Why: AG-CI-006: scan policy values have one owner.
  # From: Issue #1683 | PR #1858
  CI_TRIVY_SCANNERS: vuln,secret
  # What: severities a scan fails on and its run timeout.
  # Why: AG-CI-006: scan policy values have one owner.
  # From: Issue #1683 | PR #1858
  CI_TRIVY_SEVERITY: HIGH,CRITICAL
  CI_TRIVY_TIMEOUT: 5m0s
  # What: the validate slot count.
  # Why: AG-CI-006: the slot limit has one owner.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_MAX_SLOTS: 10
  # What: validation address pool and slot prefix length
  # Why: AG-CI-006 one owner for the slot every run takes
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_SUBNET_POOL: 172.16.0.0/12
  CI_VALIDATE_SLOT_PREFIX: 27
  # What: host dir shared with the validate job container
  # Why: same path both sides; the daemon binds host paths
  # From: Issue #1683 | PR #1912
  CI_VALIDATE_SHARED_DIR: /var/tmp/ci-validate
  # What: validate probe groups, ; apart; one job each.
  # Why: groups run at once; probes in a group in order.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_PROBE_GROUPS: dns proxy
  # What: DNS probe label, TEST-NET net, TTL, waits, polls
  # Why: AG-CI-006: probe values and waits have one owner.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_PROBE_LABEL: ci-probe
  CI_VALIDATE_PROBE_NET: 203.0.113.0/24
  CI_VALIDATE_PROBE_TTL: 60
  CI_VALIDATE_DNS_WAIT: 15
  # What: dig timeout seconds and tries of the DNS probe.
  # Why: AG-CI-006: probe timing values have one owner.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_DIG_TIMEOUT: 2
  CI_VALIDATE_DIG_TRIES: 1
  # What: connect/total seconds of one HTTP or TLS probe.
  # Why: a hung service fails its probe, not the whole job.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_HTTP_CONNECT_TIMEOUT: 10
  CI_VALIDATE_HTTP_MAX_TIME: 60
  CI_VALIDATE_SNAPSHOT_POLL_ATTEMPTS: 15
  CI_VALIDATE_POLL_PAUSE: 1
  CI_VALIDATE_PROBE_MAC: "02:00:00:00:07:00"
  # What: decoy host PDNS_API_KEY for the setup.sh rollback
  # Why: setup.sh must read the key in the container
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_DECOY_API_KEY: CHANGE_ME_host_side_key_never_used
  # What: in-container limit of one image smoke and grace.
  # Why: AG-CI-016 kill timeout; AG-CI-006 one owner.
  # From: Issue #1683 | PR #1858
  CI_SMOKE_TIMEOUT: 14m
  CI_SMOKE_KILL_AFTER: 30s
  # What: workflow file and run-block size ceilings.
  # Why: AG-CI-006: the YAML-stays-thin limits, one owner.
  # From: Issue #1683 | PR #1858
  MAX_WORKFLOW_LINES: 8999
  MAX_WORKFLOW_BYTES: 512000
  MAX_RUN_BLOCK_BYTES: 74000
  # What: ledger ref + file; the remote git ops use.
  # Why: AG-CI-006: one owner for ledger ref, file, remote.
  # From: Issue #1683 | PR #1858
  CI_LEDGER_REF: refs/ci/acceptance/ledger
  CI_LEDGER_FILE: records
  CI_GIT_REMOTE: origin
  # What: ref + file of §17 apk refresh, toolchain records.
  # Why: a refresh run writes them; every id reads them.
  # From: Issue #1683 | PR #1858
  CI_REFRESH_REF: refs/ci/refresh/packages
  CI_REFRESH_FILE: records
  # What: the refresh records of the last promoted stack.
  # Why: a failed refresh run must not move PR run ids.
  # From: Issue #1683 | PR #1984
  CI_REFRESH_ACCEPTED_REF: refs/ci/refresh/accepted
  # What: layer cache tag stem; ci.sh appends -<arch>.
  # Why: §35: one registry cache per service and arch.
  # From: Issue #1683 | PR #1912
  CI_BUILD_CACHE_TAG: buildcache
  # What: BuildKit builder name; hosted runs add the pid.
  # Why: §34: self-hosted keeps this one builder per host.
  # From: Issue #1683 | PR #1912
  CI_BUILDX_BUILDER: lancache-ci
  # What: layer compression of every built image.
  # Why: A3: gzip unpack took 12 s per job container.
  # From: Issue #1683 | PR #1858
  CI_IMAGE_COMPRESSION: zstd
  # What: poll seconds of every CI lock wait.
  # Why: AG-CI-006: lock timing has one owner.
  # From: Issue #1683 | PR #1858
  CI_LOCK_POLL_SECONDS: 10
  # What: min seconds between two reads of a run's state.
  # Why: AG-CI-020: GitHub Actions polls >= 300 s apart.
  # From: Issue #1683 | PR #1912
  CI_RUN_STATE_POLL_SECONDS: 300
  # What: runner daemon.json path, GC reserve, log policy.
  # Why: AG-CI-016: one owner for the runner Docker limits.
  # From: Issue #1255 | PR #1349
  CI_DAEMON_JSON: /etc/docker/daemon.json
  CI_BUILDER_GC_RESERVED_SPACE: 20GB
  CI_DAEMON_LOG_MAX_SIZE: 10m
  CI_DAEMON_LOG_MAX_FILE: 3
  CI_DAEMON_LOG_DRIVER: json-file
  # What: daemon-config stage and backup file suffixes.
  # Why: AG-CI-006: file names have one owner.
  # From: Issue #1683 | PR #1912
  CI_DAEMON_STAGED_SUFFIX: .staged
  CI_DAEMON_BACKUP_SUFFIX: .bak.
  # What: ref prefix of the per-identity build lock.
  # Why: one build per identity (§20); frees on run end.
  # From: Issue #1683 | PR #1912
  CI_BUILD_LOCK_REF: refs/ci/build-lock
  # What: ref prefix of the verified-digest marks.
  # Why: only a digest a build verified may be accepted.
  # From: Issue #1683 | PR #1912
  CI_VERIFIED_REF: refs/ci/verified
  # What: ref prefix of the clean-scan marks per pair.
  # Why: §30: same scan identity, same result; no rescan.
  # From: Issue #1683 | PR #1858
  CI_SCANNED_REF: refs/ci/scanned
  # What: ref prefix of the last green run mark per PR.
  # Why: the same tree and digests need no second run.
  # From: Issue #1683 | PR #1858
  CI_GREEN_REF: refs/ci/green
  # What: ref prefix of the analyzed CodeQL content marks.
  # Why: §73: analyzed content is NOOP on a later PR run.
  # From: Issue #1683 | PR #1858
  CI_CODEQL_REF: refs/ci/codeql
  # What: page size of GitHub REST and GraphQL lists.
  # Why: AG-CI-006; 100 is the API maximum; no cut list.
  # From: Issue #1683 | PR #1984
  CI_GH_PAGE_SIZE: 100
  # What: PR title lint mode (warn|block).
  # Why: AG-GH-018: the mode is a value, default warn.
  # From: Issue #1683 | PR #1858
  PR_TITLE_LINT_MODE: warn
  # What: debug mode (true|false): log all raw output.
  # Why: DoMe: raw output of every command must show.
  # From: Issue #1683 | PR #1984
  PROJECT_DEBUG_MODE: "true"
  # What: seconds gc waits between two deletes.
  # Why: DoMe: empty repo variable means 2 seconds.
  # From: Issue #1683 | PR #1858
  PROJECT_GC_DELETE_PAUSE_SECONDS: 2
  # What: minutes gc may delete before it ends green.
  # Why: the gc job timeout keeps time for the checks.
  # From: Issue #1683 | PR #1858
  CI_GC_DELETE_MINUTES: 40

# What: runner host values: paths, ages, units, packages.
# Why: AG-CI-016: ci.sh runner-host reads them; no copy.
# From: Issue #1622 | PR #1624
runner_host:
  # What: runner install root, hooks dir, runner account.
  # Why: every runner host uses the same layout.
  # From: Issue #1622 | PR #1624
  opt_root: /opt
  hooks_dir: "@{runner_host.opt_root}/lancache-ci-hooks"
  user: codex
  # What: archives from this size up are clone leftovers.
  # Why: clone leftover archives are GB-sized.
  # From: Issue #1622 | PR #1912
  stray_archive_min_bytes: 1073741824
  # What: cleanup log, its size cap, reap ages in hours.
  # Why: AG-CI-016: a timer run has no terminal; bound all.
  # From: Issue #1255 | PR #1349
  cleanup_log: /var/log/lancache-ci-cleanup.log
  cleanup_log_max_bytes: 5242880
  # What: filesystem the cleanup measures before and after.
  # Why: AG-CI-006: the measured path has one owner.
  # From: Issue #1683 | PR #1912
  disk_path: /
  reap_build_tools_hours: 2
  reap_validation_hours: 2
  reap_buildx_hours: 3
  build_tools_match: build-tools
  buildx_match: buildx_buildkit_builder-
  # What: CI 1.x validate project prefix on shared hosts.
  # Why: AG-CI-016; 1.x runs until cutover (Arch Phase 15).
  # From: Issue #1683 | PR #1912
  legacy_validation_prefix: lancache-ng-validation-
  # What: CI 1.x Trivy cache root and its max age.
  # Why: dirs of dead branches are never reused.
  # From: Issue #1255 | PR #1334
  trivy_leftover_root: /var/tmp/lancache-ng-trivy-cache
  trivy_leftover_days: 1
  # What: grace seconds before an empty validate net goes.
  # Why: a sibling job may not have attached a container.
  # From: Issue #1095 | PR #1426
  hook_network_min_age: 120
  # What: cleanup timer schedule and systemd unit location.
  # Why: units are generated from ci.sh with these values.
  # From: Issue #1255 | PR #1349
  timer_calendar: "*-*-* 04:00:00"
  timer_delay: 900
  unit_dir: /etc/systemd/system
  unit_name: lancache-ci-cleanup
  # What: runner restart delay in seconds.
  # Why: a crashed runner recovers without a hand.
  # From: Issue #1622 | PR #1624
  restart_sec: 10
  # What: the Debian suite host-prep writes backports for.
  # Why: a wrong suite would mix distribution archives.
  # From: Issue #1622 | PR #1624
  debian_suite: trixie
  # What: ERE per naming scheme; group 1 = host number.
  # Why: a loose match could take the instance suffix.
  # From: Issue #1622 | PR #1624
  fleet_name_patterns:
    - "gh-lancache-[a-z]+-[A-Za-z0-9]+-([0-9]+)"
    - "[a-z]-lancache-runner-([0-9]+)"
  # What: /root template scripts that full-reset removes.
  # Why: an allowlist; a glob would delete other scripts.
  # From: Issue #1622 | PR #1624
  template_scripts: [prepare-proxmox-template.sh]
  # What: nested Proxmox VE packages purge-pve removes.
  # Why: the kernel and firmware packages are never listed.
  # From: Issue #1622 | PR #1624
  pve_packages:
    - corosync
    - libcorosync-common4
    - libproxmox-acme-perl
    - libproxmox-acme-plugins
    - libproxmox-backup-qemu0
    - libproxmox-rs-perl
    - libpve-access-control
    - libpve-apiclient-perl
    - libpve-cluster-api-perl
    - libpve-cluster-perl
    - libpve-common-perl
    - libpve-guest-common-perl
    - libpve-http-server-perl
    - libpve-network-api-perl
    - libpve-network-perl
    - libpve-notify-perl
    - libpve-rs-perl
    - libpve-storage-perl
    - proxmox-backup-client
    - proxmox-backup-file-restore
    - proxmox-backup-restore-image
    - proxmox-firewall
    - proxmox-mail-forward
    - proxmox-mini-journalreader
    - proxmox-offline-mirror-docs
    - proxmox-offline-mirror-helper
    - proxmox-termproxy
    - proxmox-ve
    - proxmox-websocket-tunnel
    - proxmox-widget-toolkit
    - pve-cluster
    - pve-container
    - pve-docs
    - pve-esxi-import-tools
    - pve-firewall
    - pve-ha-manager
    - pve-i18n
    - pve-lxc-syscalld
    - pve-manager
    - pve-nvidia-vgpu-helper
    - pve-qemu-kvm
    - pve-xtermjs
    - pve-yew-mobile-gui
    - pve-yew-mobile-i18n
    - proxmox-enterprise-support-keyring
  # What: units purge-pve stops before the purge.
  # Why: stop first so dpkg prerm does not race the daemons.
  # From: Issue #1622 | PR #1624
  pve_services: [pveproxy, pvedaemon, pvestatd, pvescheduler, spiceproxy, pve-ha-crm, pve-ha-lrm, pve-firewall, proxmox-firewall, pve-lxc-syscalld, qmeventd, pve-cluster, corosync, pvefw-logger, proxmox-firewall.timer, watchdog-mux]
  # What: package name parts that must never be purged.
  # Why: purging the only kernel leaves the host unbootable.
  # From: Issue #1622 | PR #1624
  pve_keep: [proxmox-kernel, proxmox-default-kernel, proxmox-kernel-helper, pve-firmware, pve-edk2-firmware]
  # What: package name families the PVE inventory matches.
  # Why: dpkg greps and the purge check share one list.
  # From: Issue #1683 | PR #1912
  pve_package_families: [pve-, proxmox-, pmxcfs, corosync]
  # What: unit and mount name families of the PVE stack.
  # Why: the inventory greps units, mounts and fstab by it.
  # From: Issue #1683 | PR #1912
  pve_unit_families: [pve, corosync, proxmox, pmxcfs]
  # What: PVE config and cron dirs the purge check scans.
  # Why: open files or cron jobs on the stack block a purge.
  # From: Issue #1622 | PR #1912
  pve_config_dir: /etc/pve
  pve_cron_dirs: [/etc/cron.d, /etc/cron.daily, /etc/cron.hourly]
  # What: process name families gone after the purge.
  # Why: a running daemon means the purge did not finish.
  # From: Issue #1683 | PR #1912
  pve_process_families: [pve, pmxcfs, corosync, spiceproxy, qmeventd]
  # What: package families autoremove may take after purge.
  # Why: autoremove must stay inside the PVE set.
  # From: Issue #1683 | PR #1912
  pve_autoremove_families: [pve-, proxmox-, libpve-, libproxmox-, pmxcfs, corosync, spice]
  # What: the file that lets apt remove proxmox-ve.
  # Why: pve-apt-hook refuses the removal without it.
  # From: Issue #1683 | PR #1912
  pve_apt_override: /please-remove-proxmox-ve
  # What: sccache client files required on heavy hosts.
  # Why: Rust CI on heavy hosts fails without the client.
  # From: Issue #1622 | PR #1624
  sccache_bins: [sccache, sccache-dist]
  # What: the directory the sccache client binaries live in.
  # Why: ci.sh joins it with each name; no path copy.
  # From: Issue #1683 | PR #1912
  sccache_bin_dir: /usr/local/bin
  # What: file mode of the installed sccache binaries.
  # Why: AG-CI-006: no mode literal in ci.sh.
  # From: Issue #1683 | PR #1912
  sccache_bin_mode: "0755"
  # What: staged name beside the live binary; @FILE@ = name.
  # Why: mv in one dir is atomic; no name literal in ci.sh.
  # From: Issue #1683 | PR #1912
  sccache_staged_name: ".@FILE@.new"
  sccache_dist_dir: "@{runner_host.opt_root}/sccache/dist-client"
  # What: unit file texts of the cleanup run, one line each.
  # Why: AG-CI-006: unit text is data; ci.sh fills keys.
  # From: Issue #1683 | PR #1912
  service_unit:
    - "[Unit]"
    - Description=lancache-ng CI runner host docker cleanup
    - After=docker.service
    - Requires=docker.service
    - "[Service]"
    - Type=oneshot
    - Environment=GITHUB_REPOSITORY=@REPO@
    - ExecStart=/usr/bin/env bash @SCRIPT_DIR@/ci.sh runner-host cleanup
  timer_unit:
    - "[Unit]"
    - Description=Daily lancache-ng CI runner host docker cleanup
    - "[Timer]"
    - OnCalendar=@CALENDAR@
    - RandomizedDelaySec=@DELAY@
    - Persistent=true
    - "[Install]"
    - WantedBy=timers.target
  # What: runner file, dir and unit names.
  # Why: AG-CI-006: host names and globs have one owner.
  # From: Issue #1683 | PR #1912
  runner_dir_glob: "actions-runner*"
  runner_unit_glob: "actions.runner.*.service"
  stray_archive_globs: ["*.tgz", "*.tar.gz"]
  runner_file: .runner
  runner_credential_files: [.credentials, .credentials_rsaparams]
  runner_agent_field: agentName
  runner_env_file: .env
  runner_env_lang: LANG=C
  # What: sudoers file, rule, mode, docker group, hooks.
  # Why: AG-CI-006: the access contract has one owner.
  # From: Issue #1683 | PR #1912
  sudoers_dir: /etc/sudoers.d
  sudoers_suffix: -nopasswd
  sudoers_rule: "@USER@ ALL=(ALL) NOPASSWD:ALL"
  sudoers_mode: "0440"
  docker_group: docker
  hook_pre_name: pre-job-cleanup.sh
  hook_post_name: post-job-cleanup.sh
  hook_env_started: ACTIONS_RUNNER_HOOK_JOB_STARTED
  hook_env_completed: ACTIONS_RUNNER_HOOK_JOB_COMPLETED
  opt_root_mode: g+s
  # What: clone identity files, journals, hosts, ssh, logs.
  # Why: AG-CI-006: every host path has one owner.
  # From: Issue #1683 | PR #1912
  root_home: /root
  home_root: /home
  history_file: .bash_history
  lesshst_file: /root/.lesshst
  known_hosts_file: .ssh/known_hosts
  ssh_dir: .ssh
  authorized_keys_file: .ssh/authorized_keys
  ssh_private_key_glob: "id_*"
  ssh_public_key_glob: "*.pub"
  ssh_host_key_glob: /etc/ssh/ssh_host_*
  ssh_units: [ssh, sshd]
  machine_id_file: /etc/machine-id
  dbus_machine_id_file: /var/lib/dbus/machine-id
  hostid_file: /etc/hostid
  zgenhostid_bin: /usr/sbin/zgenhostid
  journal_dir: /var/log/journal
  journald_unit: systemd-journald
  hosts_file: /etc/hosts
  hosts_self_ip: 127.0.1.1
  fstab_file: /etc/fstab
  apt_log_globs: [/var/log/apt/history.log*, /var/log/dpkg.log*]
  # What: Debian backports files and apt-listchanges.
  # Why: AG-CI-006: the apt layout has one owner.
  # From: Issue #1683 | PR #1912
  os_release_file: /etc/os-release
  backports_list: /etc/apt/sources.list.d/backports.list
  backports_pref: /etc/apt/preferences.d/backports
  backports_repo: "deb http://deb.debian.org/debian @SUITE@-backports main"
  backports_pin: ["Package: *", "Pin: release a=stable-backports", "Pin-Priority: 500"]
  apt_listchanges_pkg: apt-listchanges
  # What: env every unattended apt-get call runs with.
  # Why: no prompt may block a host run (AG-CI-006).
  # From: Issue #1683 | PR #1912
  apt_env: DEBIAN_FRONTEND=noninteractive
  heavy_host_pattern: heavy
  # What: restart drop-in, sccache dist mode and leftovers.
  # Why: AG-CI-006: unit and dir contracts have one owner.
  # From: Issue #1683 | PR #1912
  restart_policy: on-failure
  restart_dropin: override.conf
  sccache_dist_mode: "2775"
  sccache_stale_files: [.config/sccache/config, sccache-dist/client.conf]
  sccache_stale_dirs: [.config/sccache, sccache-dist]

# What: header text and the globs the comment check skips.
# Why: vendored, binary or prose files carry no header.
# From: Issue #1683 | PR #1912
file_headers:
  project: "LanCache-NG (https://github.com/wiki-mod/lancache-ng)"
  spdx: "SPDX-License-Identifier: AGPL-3.0-or-later"
  exempt:
    - "*.md"
    - "*.png"
    - "*.ico"
    - LICENSE
    - Cargo.lock
    - services/ui/src/static/admin.css
    - "services/ui/src/lang/*.json"
    - services/ui/nginx/public_suffix_list.dat

# What: CI variables each build type passes as build-args.
# Why: builders read repo/org vars; no YAML or literal copy.
# From: Issue #1683 | PR #1858
build_variables:
  rust: [CARGO_BUILD_JOBS, PROJECT_CARGO_LTO, PROJECT_CARGO_CODEGENUNIT, CI_TOOLCHAIN_COMPILERS, CI_CACHE_PREFIX, CI_CARGO_HOME, CI_RUST_SOURCE_DIR]

# What: repo variables each ci.sh workflow passes by name.
# Why: toJSON(vars) would show LAN IPs in public logs.
# From: Issue #1683 | PR #1858
repo_variables:
  # What: the switch that gates the self_hosted values.
  # Why: GitHub-hosted runners have no LAN route.
  # From: Issue #1683 | PR #1858
  switch: PROJECT_SELFHOSTED_RUNNER_USAGE_CI
  plain: [CARGO_BUILD_JOBS, PROJECT_CARGO_LTO, PROJECT_CARGO_CODEGENUNIT, PROJECT_NIGHTLY_REF, PROJECT_SELFHOSTED_RUNNER_USAGE_CI, SCCACHE_REDIS_MODE, CI_RUST_VALIDATION, PR_TITLE_LINT_MODE, PROJECT_DEBUG_MODE, PROJECT_GC_DELETE_PAUSE_SECONDS]
  # What: values with LAN addresses; set only self-hosted.
  # Why: a GitHub-hosted log must show no LAN address.
  # From: Issue #1683 | PR #1858
  self_hosted: [PROJECT_SELFHOSTED_PROXY_HTTP, PROJECT_SELFHOSTED_PROXY_HTTPS, PROJECT_SELFHOSTED_PROXY_EXCLUSION, SCCACHE_DIST_SCHEDULER_URL, DISTCC_POTENTIAL_HOSTS]

# What: CI variables every ci.sh build stage reads
# Why: a stage has no SOT; these never key an identity
# From: Issue #1683 | PR #1858
stage_variables:
  ci_sh: [CI_RETRY_MAX_ATTEMPTS, CI_RETRY_BACKOFF_BASE_SECONDS, CI_DOWNLOAD_CONNECT_TIMEOUT, CI_DOWNLOAD_STALL_SECONDS]

# What: PR title taxonomy and project board for PR checks.
# Why: AG-GH-018/008 name one CI policy owner for them.
# From: Issue #1683 | PR #1858
pr_policy:
  title_types: [feat, fix, docs, refactor, perf, test, build, ci, chore, style, revert, security]
  # What: PR-title scopes beyond the build targets.
  # Why: cross-cutting areas own no image of their own.
  # From: Issue #1683 | PR #1858
  title_scopes_extra: [setup, ci, governance, docs, scripts, tests]
  project_number: 7
  # What: PR milestone unless one closed issue has one.
  # Why: AG-GH-008 wants a milestone when the PR opens.
  # From: Issue #1683 | PR #1984
  milestone_number: 11
  # What: PR-template heading of the closing refs.
  # Why: the template heading is a contract, not a literal.
  # From: Issue #1683 | PR #1858
  linked_section: Linked Issues
  # What: PR-template heading that needs a marked checkbox
  # Why: the template heading is a contract, not a literal
  # From: Issue #1683 | PR #1858
  checkbox_section: Type of change
  # What: PR authors the title and template checks skip
  # Why: bot PRs carry generated titles and bodies
  # From: Issue #1683 | PR #1858
  check_exempt_authors:
    - dependabot[bot]

# What: Orphan-branch sweep inputs (AG-GH-017).
# Why: age gate and long-lived refs are data, not code.
# From: Issue #1683 | PR #1858
branch_policy:
  orphan_min_age_seconds: 3600
  # What: long-lived refs besides the channel refs.
  # Why: release.channels owns master and current_dev.
  # From: Issue #1683 | PR #1858
  long_lived: [history/current_dev_old_ci_1.x]
  # What: POSIX ERE for long-lived ref families.
  # Why: tags-as-branches and release branches.
  # From: Issue #1683 | PR #1858
  long_lived_regex:
    - "^v[0-9]"
    - "^release/v[0-9]"

# What: Stack-validation check parameters (data, not logic).
# Why: One SOT for check inputs; logic stays in ci.sh.
# From: Issue #1683 | PR #1858
validation:
  # What: tools validate needs inside the build-tools job.
  # Why: AG-CI-001: verified fail-closed, never assumed.
  # From: Issue #1683
  host_tools: [bash, docker, jq, curl, dig, git, awk, sed, find, flock, openssl, getent]
  # What: CDN domains that resolve from validation hosts.
  # Why: Real dig targets; some Steam domains fail.
  # From: Issue #1683 | PR #1858
  dns_test_domains: [deb.debian.org, download.epicgames.com]
  # What: compose service of each validation role.
  # Why: AG-CI-006: service names have one owner.
  # From: Issue #1683 | PR #1858
  dns_service: dns
  proxy_service: proxy
  ui_service: ui
  dhcp_service: dhcp
  # What: Cacheable HTTP URL for the proxy MISS/HIT probe.
  # Why: Only HTTP is cached; a real HIT proves the path.
  # From: Issue #1683 | PR #1858
  proxy_cache_probe_url: http://deb.debian.org/debian/dists/stable/InRelease
  # What: compose files besides runtime.compose_file.
  # Why: each renders clean in all of its own profiles.
  # From: Issue #1683 | PR #1858
  compose_targets: deploy/secondary/docker-compose.yml
  # What: peer address of a secondary validation.
  # Why: one RFC 5737 address; the env rows name it.
  # From: Issue #1683 | PR #1912
  peer_ip: 192.0.2.10
  # What: compose env rows; a bare KEY takes its default.
  # Why: operator keys are :?-required; one owner.
  # From: Issue #1683 | PR #1858
  compose_validation_env:
    - DNS_XFR_PRIMARY=@{validation.peer_ip}
    - IP_HTTPS=127.0.0.2
    - IP_HTTP=@LOOPBACK_BIND_IP@
    - LISTEN_IP=127.0.0.3
    - LISTEN_IP_HTTPS=@LOOPBACK_BIND_IP@
    - DNS_HTTPS_HOST_PORT=
    - ALLOW_INSECURE_UI=true
    - NGINX_UPSTREAM_RESOLVER
    - CACHE_MAX_GB
    - CACHE_MEM_MB
    - DHCP_SUBNET
    - LANCACHE_STATE_DIR
    - DDNS_TSIG_NAME
    - DNS_SECONDARY_ZONES=@DHCP_DOMAIN@
  # What: required keys setup.sh repairs
  # Why: empty required key breaks the stack
  # From: Issue #1683 | PR #1858
  setup_required_repairs: DDNS_TSIG_KEY KEA_CTRL_TOKEN LANCACHE_IMAGE_CHANNEL LANCACHE_IMAGE_PREFIX LANCACHE_IMAGE_REGISTRY LANCACHE_IMAGE_TAG PDNS_API_KEY SECONDARY_REGISTRATION_TOKEN
