
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: Single source of truth for CI 2.0 build inputs.
# Why: One list ends the copied-in-many-places drift.
# From: Issue #1683
schema: build-manifest/v1

# What: runtime apk packages and smoke every image gets
# Why: CI tools belong to build-tools, not product images
# From: Issue #1683 | PR #1858
image_base:
  packages:
    - bash
    - ca-certificates
    - coreutils
    - curl
    - findutils
    - gettext-envsubst
    - grep
    - jq
    - sed
    - util-linux
    - zstd
  smoke:
    - bash --version
    - curl --version
    - envsubst --version
    - find --version
    - grep --version
    - jq --version
    - sed --version
    - zstd --version

# What: The product services this repository builds.
# Why: One list; matrices/scans/release derive from it.
# From: Issue #1683
services:
  # What: one image for watchdog, syslog, NTP and netdata.
  # Why: the watchdog owns the services image.
  # From: Issue #1683
  services:
    context: services/watchdog
    labels: [services, watchdog, syslog, ntp, netdata]
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: supervisor and cachehamster run in one container.
    # From: Issue #1683
    crates: [lancache-watchdog, lancache-cachehamster]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [watch, retention, syslog-ng, chronyd, netdata]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - group=@LOG_READER_GROUP@:@GID@
      - member=netdata:@LOG_READER_GROUP@
    final_base: alpine
    # What: final-image apk packages; the SOT owns the list.
    # Why: consumers derive; no hardcoding (AG-CI-006)
    # From: Issue #1683
    packages:
      - syslog-ng
      - chrony-nts
      - netdata
      - netdata-go-plugins
      - tzdata
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - syslog-ng --version
      - chronyd -v
      - netdata -v
  proxy:
    context: services/proxy
    labels: [proxy, nginx]
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: the supervisor renders, certifies and runs nginx.
    # From: Issue #1683
    crates: [lancache-watchdog]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [nginx]
    # What: runtime defaults the Dockerfile takes as args.
    # Why: the image builds with the value; it names none.
    # From: Issue #1683 | PR #1912
    default_args: [NGINX_DIR]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - dir=@NGINX_DIR@/ssl/ca
      - dir=@NGINX_DIR@/ssl/certs
      - dir=/var/cache/nginx/lancache
      - dir=/var/cache/nginx/tmp
    final_base: alpine
    # What: final-image apk packages; nginx from nginx.org.
    # Why: AG-KD-007: stream module only in nginx.org build.
    # From: Issue #1683 | PR #1858
    packages:
      - openssl
      - nginx@nginx
    # What: nginx.org mainline repo for the base's branch.
    # Why: ci.sh fills @ALPINE_BRANCH@ from the alpine pin.
    # From: Issue #1683 | PR #1858
    apk_repositories:
      - nginx=http://nginx.org/packages/mainline/alpine/@ALPINE_BRANCH@/main
    # What: the repo signing key and its sha256 pin.
    # Why: the tagged repo is trusted only with this key.
    # From: Issue #1683 | PR #1858
    apk_keys:
      - https://nginx.org/keys/nginx_signing.rsa.pub=ff7cf138acc09f2a5029300ab713fe6a1440605fca72e2bab76a4da9206fec87
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - 'v="$(nginx -V 2>&1)" && grep -q -- --with-stream_ssl_preread_module <<< "${v}"'
  dns:
    context: services/dns
    labels: [dns, pdns, nats]
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: subscriber and supervisor run in one container.
    # From: Issue #1683
    crates: [nats-subscriber, lancache-watchdog]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [pdns, dns-http, dns-https, nats-server, nats-subscriber, soa]
    # What: runtime defaults the Dockerfile takes as args.
    # Why: the image builds with the value; it names none.
    # From: Issue #1683 | PR #1912
    default_args: [CDN_DOMAINS_FILE, PDNS_LUA_DNS_SCRIPT, PDNS_SCHEMA_FILE]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - dir=/etc/pdns/auth
      - dir=/var/lib/powerdns:pdns
      - dir=/var/run/pdns:pdns
    final_base: alpine
    # What: final-image apk packages; the SOT owns the list.
    # Why: consumers derive; no hardcoding (AG-CI-006)
    # From: Issue #1683
    packages:
      - pdns
      - pdns-backend-sqlite3
      - pdns-recursor-luajit
      - nats-server
      - bind-tools
      - sqlite
      - iproute2
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - nats-server --version
  dhcp:
    context: services/dhcp
    labels: [dhcp, kea, dnsmasq]
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: the supervisor switches Kea and dnsmasq modes.
    # From: Issue #1683
    crates: [lancache-watchdog]
    # What: processes lancache-watchdog supervise runs.
    # Why: ci.sh bakes them as LANCACHE_PROCESSES; one list.
    # From: Issue #1683
    processes: [kea-dhcp4, kea-ctrl-agent, kea-dhcp-ddns, dnsmasq, dhcp-probe]
    final_base: alpine
    # What: final-image apk packages; the SOT owns the list.
    # Why: consumers derive; no hardcoding (AG-CI-006)
    # From: Issue #1683
    packages:
      - kea-dhcp4
      - kea-ctrl-agent
      - kea-dhcp-ddns
      - kea-admin
      - kea-hook-lease-cmds
      - dnsmasq
      - openssl
      - iptables
    # What: execute-smoke checks run post-build by ci.sh.
    # Why: prove apk binaries run, not just exist
    # From: Issue #1613
    smoke:
      - kea-dhcp4 -v
      - lancache-watchdog probe
      - dnsmasq --version
  ui:
    context: services/ui
    labels: [admin-ui]
    build_type: rust
    # What: workspace crates (cargo -p) this image builds.
    # Why: rust checks target crates, not the build context
    # From: Issue #1683 | PR #1858
    crates: [lancache-ui]
    # What: runtime defaults the Dockerfile takes as args.
    # Why: the image builds with the value; it names none.
    # From: Issue #1683 | PR #1912
    default_args: [TEMPLATE_DIR, UI_LISTEN_PORT]
    # What: accounts and dirs ci.sh image-setup creates.
    # Why: no RUN logic in the Dockerfile; @KEY@ = default.
    # From: Issue #1683 | PR #1912
    setup:
      - group=@LOG_READER_GROUP@:@GID@
      - user=@LOG_READER_GROUP@:@GID@:@LOG_READER_GROUP@
    final_base: alpine

# What: The toolchain image that builds the product stack.
# Why: built by generic pipeline; not in stack
# From: Issue #1683
build_toolchain:
  build-tools:
    context: tools/build-tools
    labels: [build-tools]
    build_type: toolchain
    final_base: alpine
    # What: apk packages installed into the toolchain image.
    # Why: SOT owns the one list; consumers read it.
    # From: Issue #1683
    packages:
      - actionlint
      - bats
      - bc
      - bind-tools
      - build-base
      - cargo
      - cargo-audit
      - ccache
      - clang22
      - cmake
      - distcc
      - distcc-pump
      - docker-cli
      - docker-cli-buildx
      - docker-cli-compose
      - expect
      - gawk
      - gcompat
      - gettext
      - git
      - github-cli
      - gnupg
      - iproute2
      - lld22
      - lsof
      - make
      - musl-dev
      - nano
      - nodejs
      - npm
      - openjdk21-jre-headless
      - openssl
      - openssl-dev
      - openssl-libs-static
      - parallel
      - perl
      - pkgconf
      - procps-ng
      - python3
      - ripgrep
      - rsync
      - run-parts
      - rust
      - rust-clippy
      - rustfmt
      - sccache
      - shellcheck
      - shfmt
      - sqlite
      - tcpdump
      - trivy@testing=0.74.0-r0
      - tzdata
      - xz
      - yq-go
      - zlib-dev
      - zlib-static
    # What: apk repos (tag=url) added by build and resolver
    # Why: trivy is only in edge/testing; @testing scopes it
    # From: Issue #1683 | PR #1858
    apk_repositories:
      - testing=http://dl-cdn.alpinelinux.org/alpine/edge/testing
    # What: Executables the toolchain smoke must find+run.
    # Why: One owner of the smoke list; ci.sh reads it.
    # From: Issue #1683
    smoke_tools:
      - actionlint
      - ar
      - awk
      - basename
      - bash
      - bats
      - cargo
      - cargo-audit
      - cat
      - ccache
      - chgrp
      - chmod
      - chown
      - clang
      - clippy-driver
      - cmake
      - cp
      - curl
      - dhclient
      - dig
      - dirname
      - distcc
      - docker
      - envsubst
      - expect
      - find
      - flock
      - getent
      - gh
      - git
      - gpg
      - grep
      - gzip
      - install
      - ip
      - java
      - jq
      - ld.lld
      - make
      - mkdir
      - mktemp
      - mv
      - node
      - npm
      - openssl
      - parallel
      - pkg-config
      - ps
      - pump
      - rm
      - rsync
      - rustc
      - rustfmt
      - sccache
      - sed
      - sha256sum
      - shellcheck
      - shfmt
      - sort
      - tar
      - tcpdump
      - tee
      - timeout
      - trivy
      - xargs
      - xz
      - yq
    # What: Commands the toolchain smoke must run clean.
    # Why: present is not runnable; one owner of the runs.
    # From: Issue #1683 | PR #1858
    smoke_runs:
      - cargo --version
      - cargo fmt --version
      - cargo clippy --version
      - cargo audit --version
      - 'c="$(rustc --print cfg)" && grep -qx target_env=.musl. <<< "${c}"'
      - sccache --version
      - ccache --version
      - bc --version
      - docker --version
      - expect -v
      - gettext --version
      - gh --version
      - git --version
      - gpg --version
      - lsof -v
      - parallel --version
      - rg --version
      - xz --version
      - actionlint --version
      - bats --version
      - shellcheck --version
      - shfmt --version
      - yq --version
      - docker compose version
      - docker buildx version
      - dhclient --version
      - 'm="$(gcc -dumpmachine)" && [[ "${m}" == *-musl ]]'
      - trivy --version
      - java -version

# What: Pinned external base images by full digest.
# Why: Single owner of the alpine pin, no per-file copies.
# From: Issue #1683
base_images:
  alpine: "mirror.gcr.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
  # What: the registry ci.bats runs on the test daemon.
  # Why: image lookups hit a real registry, no stub.
  # From: Issue #1683 | PR #1858
  registry: "mirror.gcr.io/library/registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8"

# What: the runtime group id the containers share.
# Why: ci.sh bakes it into each image; one owner.
# From: Issue #1683 | PR #1912
runtime:
  gid: 10001
  # What: default values, KEY=value list joined by pipes.
  # Why: images bake them; no .env template holds any.
  # From: Issue #1683 | PR #1912
  defaults: PDNS_AUTH_API_PORT=8081|PDNS_HTTP_API_PORT=8082|PDNS_HTTPS_API_PORT=8084|DNS_ROLLBACK_PORT=8083|PDNS_SOA_REFRESH=30|PDNS_SOA_RETRY=10|PDNS_SOA_RESYNC_INTERVAL=3600|CHECK_INTERVAL=30|RESTART_AFTER=3|DISK_WARN_PCT=85|DISK_ALARM_PCT=95|DOCKER_API_TIMEOUT=5|DOCKER_RESTART_TIMEOUT=30|SYSLOG_PRUNE_RETRY_COOLDOWN=3600|CACHEHAMSTER_CONCURRENCY=4|DHCP_LEASE_TIME=86400|CACHE_SLICE_SIZE=8m|CACHE_VALID_HIT=365d|CACHE_VALID_ANY=1m|CACHE_INACTIVE=365d|CACHE_MIN_FREE=1g|CACHE_VALID_DAYS=365|SYSLOG_MAX_GB=10|SYSLOG_RETENTION_DAYS=30|LOG_QUERIES=0|ROOT_ZONE_MIRROR=1|DHCP_DOMAIN=lan|DHCP_DDNS_ENABLED=false|KEA_CTRL_USER=admin|KEA_CTRL_PORT=8000|KEA_CONFIG_SNAPSHOT_DIR=/var/lib/kea/config-snapshots|KEEP_KNOWN_GOOD_CONFIGS=3|NATS_UI_USER=lancache-ui|NATS_DNS_WRITER_USER=lancache-dns-writer|NATS_CALLOUT_USER=lancache-nats-callout|NATS_SYS_USER=lancache-nats-sys|LANCACHE_LOG_PORT=5514|LOGGING_PROXY_ENABLED=1|LOGGING_DNS_ENABLED=1|LOGGING_DHCP_ENABLED=1|LOGGING_UI_ENABLED=1|NGINX_UPSTREAM_RESOLVER=8.8.8.8 8.8.4.4 [2001:4860:4860::8888] [2001:4860:4860::8844]|PROXY_SECURITY_MODE=lazy|NTP_UPSTREAM_SERVERS=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org time.cloudflare.com|CACHE_MAX_SIZE=50g|CACHE_MEM_MB=512|DHCP_SUBNET=10.0.0.0/24|DHCP_RANGE_START=10.0.0.128|DHCP_RANGE_END=10.0.0.254|DHCP_GATEWAY=10.0.0.1|DHCP_NTP_SERVERS=debian.pool.ntp.org,time.nist.gov|ALLOW_INSECURE_UI=false|SUPERVISE_RUN_DIR=/run/lancache|LANCACHE_SHARED_SECRET_DIR=/var/lib/lancache-secrets|UI_DATA_DIR=/data|DESIRED_STATE_FILE=/data/desired-state.json|UI_SETTINGS_FILE=/data/lancache-ui-settings.env|DHCP_PROBE_REQUEST_FILE=/data/dhcp-probe-request|DHCP_PROBE_RESULT_FILE=/var/lib/kea/dhcp-probe-result.json|UI_SESSION_SECRET_FILE=/data/lancache-ui-session.secret|SECONDARY_REGISTRATION_TOKEN_FILE=/data/lancache-secondary-registration.token|NETDATA_ALARMS_FILE=/data/netdata-alarms.json|NATS_ISSUER_SEED_PATH=/data/lancache-nats-issuer.seed|NATS_XKEY_SEED_PATH=/data/lancache-nats-xkey.seed|UI_DATABASE_FILE=/data/lancache-ui.db|UI_LOG_FILE=/var/log/lancache-ui/ui.log|UI_LISTEN_PORT=8080|UI_LOGS_MAX_ENTRIES=200|UI_SESSION_TTL_SECONDS=86400|KEA_DATA_DIR=/var/lib/kea|DHCP_SNAPSHOT_MOUNT=/var/lib/lancache-dhcp|DHCP_CONFIG_SNAPSHOT_DIR=/var/lib/lancache-dhcp/config-snapshots|DNS_SNAPSHOT_MOUNT=/var/lib/lancache-dns|DNS_CONFIG_SNAPSHOT_DIR=/var/lib/lancache-dns/config-snapshots|PROXY_SNAPSHOT_MOUNT=/var/lib/lancache-proxy|PROXY_CONFIG_SNAPSHOT_DIR=/var/lib/lancache-proxy/config-snapshots|DNS_STATE_DIR=/var/lib/powerdns-state|PDNS_DATA_DIR=/var/lib/powerdns|NATS_CONF_MOUNT=/etc/nats|NATS_CONF_PATH=/etc/nats/nats.conf|NATS_AUTH_CALLOUT_PATH=/etc/nats/auth_callout.conf|NATS_STORE_DIR=/var/lib/nats|NATS_PORT=4222|NATS_MONITOR_PORT=8222|NATS_URL=nats://dns:4222|NATS_CONSUMER=dns|NATS_RECONCILER=1|NATS_PASSWORD_SHARED_SECRET=nats-dns-writer-password|DNS_REPLICATION_ROLE=primary|CDN_DOMAINS_FILE=/etc/lancache/cdn-domains.txt|CACHEHAMSTER_DATA_DIR=/var/lib/lancache-cachehamster|CACHE_DIR=/var/cache/lancache|CACHE_DIR_ALLOWED_PREFIX=/var/cache|DOCKER_SOCKET=/var/run/docker.sock|NETDATA_CONFIG_DIR=/etc/netdata|NETDATA_LIB_DIR=/var/lib/netdata|NETDATA_CACHE_DIR=/var/cache/netdata|NETDATA_WEB_LOG=/var/log/lancache-syslog-ng/LanCache-NG-proxy/*.log|NETDATA_URL=http://services:19999|NETDATA_ALARM_UI_URL=http://ui:8080|NETDATA_ALARM_MAX_TIME=15|NETDATA_ALARM_RECIPIENT=lancache-ui|NTP_STATE_DIR=/var/lib/chrony|NTP_DRIFT_FILE=/var/lib/chrony/drift|NTP_ENABLED=0|RETENTION_STATE_DIR=/var/lib/lancache-retention-state|PURGE_STAMP=/var/lib/lancache-retention-state/purge.stamp|SYSLOG_PRUNE_STAMP=/var/lib/lancache-retention-state/syslog-prune.stamp|STATUS_DIR=/var/run/watchdog|STATUS_FILE=/var/run/watchdog/status.json|SYSLOG_LOG_ROOT=/var/log/lancache-syslog-ng|SYSLOG_LOG_ROOT_ALLOWED_PREFIX=/var/log|PROXY_LOG_DIR=/var/log/lancache-syslog-ng/LanCache-NG-proxy|PROXY_HTTP_URL=http://proxy|PROXY_HTTPS_URL=http://proxy|DHCP_API_URL=http://host.docker.internal|DNS_URL=http://dns|HTTPS_ENABLED=1|DHCP_MODE=disabled|LOG_READER_GROUP=lancache|LANCACHE_STATE_DIR=/opt/lancache-ng|TEMPLATE_DIR=/templates|PDNS_LUA_DNS_SCRIPT=/etc/pdns/filter-aaaa.lua|PDNS_SCHEMA_FILE=/usr/share/lancache-ng/schema.sqlite3.sql|NGINX_DIR=/etc/nginx|PROXY_HEALTH_URL=http://127.0.0.1/healthz|PROXY_HEALTH_HTTPS_URL=https://127.0.0.1:8445/healthz|NGINX_MITM_PORT=8444|NGINX_MITM_RELAY_PORT=9445|NGINX_PASSTHROUGH_RELAY_PORT=9446|NGINX_PASSTHROUGH_PORT=8443|KEA_NCR_PORT=53001|NGINX_HTTPS_LISTEN_FILE=conf.d/https-listen.inc|DNS_PORT=53|DNS_HTTPS_PORT=1053|PDNS_AUTH_PORT=5300|NTP_PORT=123|LOOPBACK_BIND_IP=127.0.0.1|UI_SESSION_TTL_MAX_SECONDS=31536000|STATE_SUBDIR_SYSLOG_NG=syslog-ng|STATE_SUBDIR_NTP=ntp|STATE_SUBDIR_CACHEHAMSTER=cachehamster|STATE_SUBDIR_PDNS=pdns|STATE_SUBDIR_PDNS_FILTER=pdns-filter-state|STATE_SUBDIR_NATS=nats|STATE_SUBDIR_NATS_CONF=nats-conf|STATE_SUBDIR_KEA=kea|STATE_SUBDIR_CACHE=cache
  # What: defaults compose interpolates as SOT_<KEY>.
  # Why: setup.sh and ci.sh export them; no clash with .env.
  # From: Issue #1683 | PR #1912
  compose_keys: LANCACHE_LOG_PORT SUPERVISE_RUN_DIR LANCACHE_SHARED_SECRET_DIR UI_DATA_DIR STATUS_DIR CACHE_DIR SYSLOG_LOG_ROOT RETENTION_STATE_DIR NTP_STATE_DIR CACHEHAMSTER_DATA_DIR NETDATA_CONFIG_DIR NETDATA_LIB_DIR NETDATA_CACHE_DIR DOCKER_SOCKET CDN_DOMAINS_FILE PDNS_DATA_DIR DNS_STATE_DIR NATS_STORE_DIR NATS_CONF_MOUNT DNS_SNAPSHOT_MOUNT DHCP_SNAPSHOT_MOUNT PROXY_SNAPSHOT_MOUNT KEA_DATA_DIR NATS_PORT UI_LISTEN_PORT DNS_PORT DNS_HTTPS_PORT PDNS_AUTH_PORT NTP_PORT NGINX_PASSTHROUGH_PORT LOOPBACK_BIND_IP STATE_SUBDIR_SYSLOG_NG STATE_SUBDIR_NTP STATE_SUBDIR_CACHEHAMSTER STATE_SUBDIR_PDNS STATE_SUBDIR_PDNS_FILTER STATE_SUBDIR_NATS STATE_SUBDIR_NATS_CONF STATE_SUBDIR_KEA STATE_SUBDIR_CACHE

# What: Pinned external tool/asset versions and checksums.
# Why: Central version owner; consumers never re-pin.
# From: Issue #1683
external_versions:
  # What: ISC dhclient reused from Alpine v3.20 pkg.
  # Why: Alpine 3.21+ dropped it; musl build, both arches.
  # From: Issue #1683
  dhclient:
    consumer: build-tools
    build_args: [version, alpine_branch, url]
    version: 4.4.3_p1-r4
    alpine_branch: v3.20
    url: "http://dl-cdn.alpinelinux.org/alpine/@BRANCH@/main/@ARCH@/dhclient-@VERSION@.apk"
    sha256_x86_64: 068c97e534e9c8f03db9064296b1d3c21d957f328e40309278559a92f9a74557
    sha256_aarch64: f1bd3a42210768b049f3157db09d68a399521db16f63122e7b6af28bf16fbea2
  # What: CodeQL CLI bundle the codeql job downloads.
  # Why: the only pin owner; codeql.yml carries no pin.
  # From: Issue #1683 | PR #1858
  codeql:
    repository: github/codeql-action
    release_tag: codeql-bundle-v2.27.1
    asset: codeql-bundle-linux64.tar.gz
    sha256: 1d380f79896ededc654c7b21fafb3360136f1aeb678ad4df4df9af3910c6b815

# What: The one authoritative platform list for all targets.
# Why: Platform is a parameter, not a twin/list.
# From: Issue #1683
build_matrix:
  platforms: [linux/amd64, linux/arm64]

# What: Per-arch apk arch, rust target and runner label.
# Why: one SOT owner; no platform case dup in ci.sh.
# From: Issue #1683
platform_arch:
  amd64:
    apk: x86_64
    runner: ubuntu-latest
    rust_target: x86_64-alpine-linux-musl
  arm64:
    apk: aarch64
    runner: ubuntu-24.04-arm
    rust_target: aarch64-alpine-linux-musl

# What: timeout minutes per workflow job id; one owner
# Why: root jobs keep a literal the guard holds equal
# From: Issue #1683 | PR #1858
ci_job_timeouts:
  aggregate: 30
  analyze: 120
  assemble: 30
  build: 90
  cargo-audit: 30
  checks: 30
  claude: 360
  close-linked-issues: 15
  cut-release-tag: 15
  gc: 60
  impact: 15
  lint: 30
  nightly: 30
  orphaned-branches: 15
  plan: 30
  platform: 15
  project-board: 15
  promote: 30
  release: 30
  release-sbom: 60
  resolve-build-tools: 15
  result: 15
  scan: 60
  test: 45
  validate: 60
  welcome: 15

# What: CI phases that must run and succeed on every run.
# Why: §62: a skipped plan or checks would hide a red run.
# From: Issue #1683 | PR #1858
ci_result_gate:
  required: [platform, plan, checks]

# What: Build-identity inputs per build type (§7).
# Why: Impact is content-identity, never path-touched alone.
# From: Issue #1683
build_identity:
  rust:
    inputs: [source_sha, toolchain_digest, base_digest, package_versions, build_variables]
  toolchain:
    inputs: [toolchain_source_sha, base_digest]

# What: apk packages every image of a build type needs.
# Why: musl rust binaries link libgcc_s.so.1 dynamically.
# From: Issue #1683 | PR #1858
build_runtime:
  rust:
    packages: [libgcc]
    # What: ldd the crate binary; the binary never runs.
    # Why: a missing .so must fail verify, not validate.
    # From: Issue #1683 | PR #1858
    smoke:
      - ldd /usr/local/bin/@CRATE@

# What: repo paths Dockerfiles copy from outside a context.
# Why: a change there must reach every image built from it.
# From: Issue #1683 | PR #1912
named_contexts:
  cargo-workspace:
    path: Cargo.toml
  cargo-lock:
    path: Cargo.lock
  rust-common:
    path: services/common
  supervisor-src:
    path: services/watchdog/src
  supervisor-manifest:
    path: services/watchdog/Cargo.toml
  ui-manifest:
    path: services/ui/Cargo.toml
  cachehamster-manifest:
    path: services/cachehamster/Cargo.toml
  cachehamster-src:
    path: services/cachehamster/src
  subscriber-manifest:
    path: services/dns/nats-subscriber/Cargo.toml

# What: Per-service rebuild edges beyond its own context.
# Why: plan picks candidates, identity decides the build.
# From: Issue #1683 | PR #1912
dependency_graph:
  services:
    contexts: [cargo-workspace, cargo-lock, rust-common, ui-manifest, cachehamster-manifest, cachehamster-src, subscriber-manifest]
  proxy:
    contexts: [cargo-workspace, cargo-lock, rust-common, supervisor-src, supervisor-manifest, ui-manifest, cachehamster-manifest, subscriber-manifest]
  dns:
    contexts: [cargo-workspace, cargo-lock, rust-common, supervisor-src, supervisor-manifest, ui-manifest, cachehamster-manifest]
  dhcp:
    contexts: [cargo-workspace, cargo-lock, rust-common, supervisor-src, supervisor-manifest, ui-manifest, cachehamster-manifest, subscriber-manifest]
  ui:
    contexts: [cargo-workspace, cargo-lock, rust-common, supervisor-manifest, cachehamster-manifest, subscriber-manifest]

# What: CodeQL query suites and ignored paths.
# Why: One SOT owner; codeql.yml/ci.sh derive, no dup.
# From: Issue #1683
codeql:
  queries: [security-extended, security-and-quality]
  paths_ignore: ["**/target/**"]

# What: Analyzed paths per CodeQL language (entry=language).
# Why: read like services; generic block reader, no dup.
# From: Issue #1683
codeql_languages:
  actions:
    paths: [.github/workflows]
  rust:
    files: ["*.rs"]
    paths: [services/cachehamster/src, services/common, services/dns/nats-subscriber/src, services/ui/src, services/watchdog/src]

# What: release version, channels, validation and GC inputs
# Why: AG-REL-010: one release and artifact inventory
# From: Issue #1683 | PR #1858
release:
  registry: ghcr.io
  # What: current release version of the whole project.
  # Why: one owner; Cargo, lock, VERSION are synced from it.
  # From: Issue #1683 | PR #1858
  version: 0.3.0
  # What: SPDX license of the whole project.
  # Why: crates and image labels read it; no literal copies.
  # From: Issue #1683 | PR #1858
  license: AGPL-3.0-or-later
  # What: validation record and its full-invalidation paths.
  # Why: AG-REL-011 gate reads them; no ci.sh literal.
  # From: Issue #1683
  validation_state: docs/validation-state.json
  governance_paths: [AGENTS.md, .github/AGENTS.md]
  # What: the pr_labels path class each layer record covers
  # Why: setup.sh, deploy and ci.sh changes stale a layer
  # From: Issue #1683 | PR #1858
  validation_layers:
    stack: setup
    ci: ci
  channels:
    nightly:
      mutable: true
      # What: the ref a nightly run checks out and builds
      # Why: AG-REL-009: nightly comes from current_dev only
      # From: Issue #1683 | PR #1858
      source_ref: refs/heads/current_dev
    latest:
      mutable: true
      # What: pushes to this ref move the channel.
      # Why: one ref->channel owner; ci.sh has no literal.
      # From: Issue #1683
      ref: refs/heads/master
      # What: final vX.Y.Z tags also move this channel.
      # Why: AG-REL-009 stable channel; read by ci.sh.
      # From: Issue #1683
      release_tags: true
      # What: other names setup.sh accepts for it.
      # Why: release-versioning names stable for it
      # From: Issue #1683 | PR #1858
      aliases: [stable]
  # What: the install mode that pins one fixed tag.
  # Why: release-versioning: pinned stays a channel value.
  # From: Issue #1683 | PR #1858
  pinned_channel: pinned
  # What: refused channel names and why they went.
  # Why: release-versioning: a clear error, no fallback.
  # From: Issue #1683 | PR #1858
  retired_channels:
    edge: "renamed to nightly in v0.3.0 (#1056)"
    dev: "retired in v0.3.0 (#825/#1141)"
  # What: channel a ref without its own channel uses.
  # Why: AG-REL-009 pre-stable default; no ci.sh literal.
  # From: Issue #1683
  default_channel: nightly
  # What: GC grace window and the delete policy gate
  # Why: §76: unreachable versions go only after the grace
  # From: Issue #1683 | PR #1858
  retention:
    deletion_policy: manual-or-approved-automation-only
    unaggregated_grace_minutes: 1440

# What: path classes for PR labels and validation layers
# Why: service/toolchain labels apply under their context.
# From: Issue #1683 | PR #1858
pr_labels:
  setup: [setup.sh, "deploy/**"]
  docker: ["deploy/**", "**/Dockerfile"]
  rust: ["**/*.rs"]
  ci: [".github/workflows/**", ".github/scripts/**", ".github/yaml/**"]
  github_actions: [".github/workflows/**"]
  documentation: ["docs/**", "**/*.md"]

# What: Release notes: PR section, skip label, fallback.
# Why: one owner for release-publish and CHANGELOG.md.
# From: Issue #894 | PR #1858
release_notes:
  pr_section: Changelog
  skip_label: skip-changelog
  other_title: Other
  # What: PR label that marks a deliberate CHANGELOG.md edit
  # Why: the release flow owns the file; a label opts in
  # From: Issue #1683 | PR #1858
  changelog_edit_label: release

# What: Release-notes groups: PR label -> heading.
# Why: grouping is data; the first matching label wins.
# From: Issue #894 | PR #1858
release_notes_categories:
  bug:
    title: Fixed
  enhancement:
    title: Added
  documentation:
    title: Documentation
  dependencies:
    title: Dependencies
  chore:
    title: Chore / CI
  ci:
    title: Chore / CI

# What: CI runtime variables with their fallback defaults.
# Why: No hardcode, like CARGO_BUILD_JOBS (AG-CI-006).
# From: Issue #1683
ci_variables:
  REPOSITORY_CI_LEDGER_RETENTION_DAYS: 30
  # What: cargo fmt/clippy/test in CI; off unless "true".
  # Why: AG-VAL-008: a variable, disabled by default.
  # From: Issue #1683
  CI_RUST_VALIDATION: "false"
  # What: sccache cache mode: required, optional or off.
  # Why: AG-CI-004 mode; required fails closed (AG-CI-011).
  # From: Issue #1683 | PR #1858
  SCCACHE_REDIS_MODE: required
  # What: sccache Redis key prefix; ci.sh adds -<service>.
  # Why: one owner for the project's shared cache namespace.
  # From: Issue #1683 | PR #1912
  CI_CACHE_PREFIX: lancache-ng
  # What: sccache dist toolchain cache size in bytes.
  # Why: AG-CI-006: no size literal in the dist config.
  # From: Issue #1683 | PR #1858
  CI_SCCACHE_DIST_TOOLCHAIN_CACHE_SIZE: 5368709120
  # What: compiler VAR=driver pairs; the first is default.
  # Why: distcc, ccache and smoke read one compiler list.
  # From: Issue #1683 | PR #1858
  CI_TOOLCHAIN_COMPILERS: CC=cc GCC=gcc CXX=c++ GXX=g++
  # What: kill timeout (s) of the GHA runtime export step.
  # Why: AG-CI-016: every container command is bounded.
  # From: Issue #1683 | PR #1858
  CI_GHA_RUNTIME_EXPORT_TIMEOUT: 30
  # What: compose file validate starts (AG-KD-008).
  # Why: one deploy profile; a repo var may override.
  # From: Issue #1683 | PR #1858
  CI_COMPOSE_FILE: deploy/prod/docker-compose.yml
  # What: the workspace lockfile cargo-audit reads.
  # Why: plan audits only when this file changed.
  # From: Issue #1683 | PR #1858
  CI_CARGO_LOCK: Cargo.lock
  # What: plain version file setup.sh reads for archives.
  # Why: it must equal release.version (version-drift).
  # From: Issue #1683 | PR #1858
  CI_VERSION_FILE: VERSION
  # What: the installer script the stack checks read.
  # Why: one path owner; ci.sh holds no installer literal.
  # From: Issue #1683 | PR #1858
  CI_INSTALLER: setup.sh
  # What: the trivy ignore list scans and VEX read.
  # Why: one path owner for scan, release VEX, vex-drift.
  # From: Issue #1683 | PR #1858
  CI_TRIVY_IGNORE: .trivyignore.yaml
  # What: repo paths the checks read; one owner each.
  # Why: ci.sh joins them via _ci_repo_path, no literals.
  # From: Issue #1683 | PR #1858
  CI_WORKFLOW_DIR: .github/workflows
  CI_ACTIONS_DIR: .github/actions
  CI_PR_TEMPLATE: .github/pull_request_template.md
  CI_CHANGELOG: CHANGELOG.md
  CI_README: README.md
  CI_ARCH_DOC: docs/architecture-ng.md
  CI_BACKUP_RESTORE_DOC: docs/backup-restore.md
  CI_DOCS_DIR: docs
  # What: attempts and backoff base of the retry owner.
  # Why: AG-CI-006: a retry/timeout value has one owner.
  # From: Issue #1683 | PR #1858
  CI_RETRY_MAX_ATTEMPTS: 4
  CI_RETRY_BACKOFF_BASE_SECONDS: 1
  # What: trivy scanners, DB dir and DB lock timing.
  # Why: AG-CI-006: scan policy values have one owner.
  # From: Issue #1683 | PR #1858
  CI_TRIVY_SCANNERS: vuln,secret
  CI_TRIVY_SHARED_DIR: /mnt/trivy-db
  CI_TRIVY_LOCK_POLL: 5
  CI_TRIVY_LOCK_TIMEOUT: 900
  CI_TRIVY_LOCK_STALE: 1200
  # What: validate slot count and timing, in seconds.
  # Why: AG-CI-006: validate timeouts have one owner.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_MAX_SLOTS: 10
  CI_VALIDATE_DETACH_TIMEOUT: 30
  CI_VALIDATE_HEALTH_TIMEOUT: 180
  CI_VALIDATE_STABLE_WINDOW: 20
  # What: validation address pool and slot prefix length
  # Why: AG-CI-006 one owner for the slot every run takes
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_SUBNET_POOL: 172.16.0.0/12
  CI_VALIDATE_SLOT_PREFIX: 27
  # What: host dir shared with the validate job container
  # Why: same path both sides; the daemon binds host paths
  # From: Issue #1683 | PR #1912
  CI_VALIDATE_SHARED_DIR: /var/tmp/ci-validate
  # What: DNS probe label, TEST-NET net, TTL, waits, polls
  # Why: AG-CI-006: probe values and waits have one owner.
  # From: Issue #1683 | PR #1858
  CI_VALIDATE_PROBE_LABEL: ci-probe
  CI_VALIDATE_PROBE_NET: 203.0.113.0/24
  CI_VALIDATE_PROBE_TTL: 60
  CI_VALIDATE_DNS_WAIT: 15
  CI_VALIDATE_UI_POLL_ATTEMPTS: 30
  CI_VALIDATE_UI_POLL_PAUSE: 2
  CI_VALIDATE_LISTENER_POLL_ATTEMPTS: 30
  CI_VALIDATE_LISTENER_POLL_PAUSE: 1
  CI_VALIDATE_SNAPSHOT_POLL_ATTEMPTS: 15
  CI_VALIDATE_SNAPSHOT_POLL_PAUSE: 1
  CI_VALIDATE_KEA_POLL_ATTEMPTS: 30
  CI_VALIDATE_KEA_POLL_PAUSE: 2
  CI_VALIDATE_PROBE_MAC: "02:00:00:00:07:00"
  # What: in-container limit of one image smoke and grace.
  # Why: AG-CI-016 kill timeout; AG-CI-006 one owner.
  # From: Issue #1683 | PR #1858
  CI_SMOKE_TIMEOUT: 14m
  CI_SMOKE_KILL_AFTER: 30s
  # What: workflow file and run-block size ceilings.
  # Why: AG-CI-006: the YAML-stays-thin limits, one owner.
  # From: Issue #1683 | PR #1858
  MAX_WORKFLOW_LINES: 8999
  MAX_WORKFLOW_BYTES: 512000
  MAX_RUN_BLOCK_BYTES: 74000
  # What: ledger ref + file; the remote git ops use.
  # Why: AG-CI-006: one owner for ledger ref, file, remote.
  # From: Issue #1683 | PR #1858
  CI_LEDGER_REF: refs/ci/acceptance/ledger
  CI_LEDGER_FILE: records
  CI_GIT_REMOTE: origin
  # What: promote lock attempts, backoff and stale seconds.
  # Why: AG-CI-006: lock timing has one owner.
  # From: Issue #1683 | PR #1858
  CI_PROMOTE_LOCK_MAX: 30
  CI_PROMOTE_LOCK_BACKOFF: 10
  CI_PROMOTE_LOCK_STALE: 900
  # What: ref prefix of the per-channel promote lock.
  # Why: promote and the installer read one lock location.
  # From: Issue #1683 | PR #1858
  CI_PROMOTE_LOCK_REF: refs/ci/promote-lock
  # What: PR title lint mode (warn|block), chronology mode.
  # Why: AG-CI-006: check modes are values with one owner.
  # From: Issue #1683 | PR #1858
  PR_TITLE_LINT_MODE: warn
  CHRONOLOGY_WARN_ONLY: 0

# What: files the header and prose checks skip, by path.
# Why: vendored or generated content carries no header.
# From: Issue #1683 | PR #1858
file_headers:
  exempt:
    - services/ui/src/static/chart.umd.min.js
    - services/ui/src/static/admin.css
    - services/proxy/public_suffix_list.dat
    - services/dns/schema.sqlite3.sql

# What: CI variables each build type passes as build-args.
# Why: builders read repo/org vars; no YAML or literal copy.
# From: Issue #1683 | PR #1858
build_variables:
  rust: [CARGO_BUILD_JOBS, PROJECT_CARGO_LTO, PROJECT_CARGO_CODEGENUNIT, CI_TOOLCHAIN_COMPILERS, CI_CACHE_PREFIX]

# What: CI variables every ci.sh build stage reads
# Why: a stage has no SOT; these never key an identity
# From: Issue #1683 | PR #1858
stage_variables:
  ci_sh: [CI_RETRY_MAX_ATTEMPTS, CI_RETRY_BACKOFF_BASE_SECONDS]

# What: PR title taxonomy and project board for PR checks.
# Why: AG-GH-018/008 name one CI policy owner for them.
# From: Issue #1683 | PR #1858
pr_policy:
  title_types: [feat, fix, docs, refactor, perf, test, build, ci, chore, style, revert, security]
  # What: PR-title scopes beyond the build targets.
  # Why: cross-cutting areas own no image of their own.
  # From: Issue #1683 | PR #1858
  title_scopes_extra: [setup, ci, governance, docs, scripts, tests]
  project_number: 6
  # What: PR-template heading close-linked-issues reads.
  # Why: the template heading is a contract, not a literal.
  # From: Issue #1683 | PR #1858
  linked_section: Linked Issues
  # What: PR-template heading that needs a marked checkbox
  # Why: the template heading is a contract, not a literal
  # From: Issue #1683 | PR #1858
  checkbox_section: Type of change
  # What: PR authors the title and template checks skip
  # Why: bot PRs carry generated titles and bodies
  # From: Issue #1683 | PR #1858
  check_exempt_authors:
    - dependabot[bot]
  # What: welcome text for a first issue, one line per item
  # Why: ci.sh welcome posts it; the text is data, not code
  # From: Issue #1683 | PR #1858
  welcome_issue:
    - Thanks for opening your first issue in lancache-ng.
    - ""
    - "Please make sure the issue includes:"
    - "- expected behavior"
    - "- actual behavior"
    - "- logs or reproduction steps"
    - "- relevant configuration without secrets"
    - ""
    - Do not post private keys, tokens, passwords, personal data, or private infrastructure details.
    - Security-sensitive reports should use the project's private security reporting channel.
  # What: welcome text for a first PR, one line per item
  # Why: ci.sh welcome posts it; the text is data, not code
  # From: Issue #1683 | PR #1858
  welcome_pr:
    - Thanks for opening your first pull request in lancache-ng.
    - ""
    - "Please make sure the pull request:"
    - "- links the related issue"
    - "- explains the user-visible behavior change"
    - "- lists the validation that was run"
    - "- does not include private keys, tokens, passwords, personal data, or private infrastructure details"
    - ""
    - Security-sensitive reports should use the project's private security reporting channel.

# What: Orphan-branch sweep inputs (AG-GH-017).
# Why: age gate and long-lived refs are data, not code.
# From: Issue #1683 | PR #1858
branch_policy:
  orphan_min_age_seconds: 3600
  # What: long-lived refs besides the channel refs.
  # Why: release.channels owns master and current_dev.
  # From: Issue #1683 | PR #1858
  long_lived: [badges]
  # What: POSIX ERE for long-lived ref families.
  # Why: release branches and the VEX automation branch.
  # From: Issue #1683 | PR #1858
  long_lived_regex:
    - "^v[0-9]"
    - "^CI-Automation/"

# What: Stack-validation check parameters (data, not logic).
# Why: One SOT for check inputs; logic stays in ci.sh.
# From: Issue #1683 | PR #1858
validation:
  # What: tools validate needs inside the build-tools job.
  # Why: AG-CI-001: verified fail-closed, never assumed.
  # From: Issue #1683
  host_tools: [bash, docker, jq, curl, dig, git, awk, sed, find, flock, openssl, getent]
  # What: CDN domains that resolve from validation hosts.
  # Why: Real dig targets; some Steam domains fail.
  # From: Issue #1683 | PR #1858
  dns_test_domains: [deb.debian.org, download.epicgames.com]
  # What: Cacheable HTTP URL for the proxy MISS/HIT probe.
  # Why: Only HTTP is cached; a real HIT proves the path.
  # From: Issue #1683 | PR #1858
  proxy_cache_probe_url: http://deb.debian.org/debian/dists/stable/InRelease
  # What: compose files checked besides CI_COMPOSE_FILE.
  # Why: each renders clean in all of its own profiles.
  # From: Issue #1683 | PR #1858
  compose_targets: deploy/secondary/docker-compose.yml
  # What: placeholder env for targets without .env
  # Why: operator keys are :?-required
  # From: Issue #1683 | PR #1858
  compose_validation_env: DNS_XFR_PRIMARY=192.0.2.10:5300 IP_HTTPS=127.0.0.2 IP_HTTP=127.0.0.1 LISTEN_IP=127.0.0.3 LISTEN_IP_HTTPS=127.0.0.1 DNS_HTTPS_HOST_PORT= ALLOW_INSECURE_UI=true NATS_CONSUMER=ci-secondary NATS_USER=ci-nats-user NATS_ADVERTISE_URL=nats://192.0.2.10:4222 NATS_URL=nats://127.0.0.1:4222 NGINX_UPSTREAM_RESOLVER=1.1.1.1
  # What: secret keys of the render env, by value format.
  # Why: no secret value in the SOT; ci.sh makes each run.
  # From: Issue #1683 | PR #1858
  compose_validation_secrets:
    hex32: [KEA_CTRL_TOKEN, NATS_CALLOUT_PASSWORD, NATS_DNS_WRITER_PASSWORD, NATS_PASSWORD, NATS_SYS_PASSWORD, NATS_UI_PASSWORD, NETDATA_ALARM_TOKEN, PDNS_API_KEY, SECONDARY_REGISTRATION_TOKEN]
    base64_32: [DDNS_TSIG_KEY]
  # What: default keys compose needs in the render env.
  # Why: compose reads them; runtime.defaults owns them.
  # From: Issue #1683 | PR #1912
  compose_validation_defaults: CACHE_MAX_SIZE CACHE_MEM_MB DHCP_SUBNET LANCACHE_STATE_DIR
  # What: required keys setup.sh repairs
  # Why: empty required key breaks the stack
  # From: Issue #1683 | PR #1858
  setup_required_repairs: CACHE_MAX_GB CACHE_MAX_SIZE CACHE_MEM_MB DDNS_TSIG_KEY KEA_CTRL_TOKEN LANCACHE_IMAGE_CHANNEL LANCACHE_IMAGE_PREFIX LANCACHE_IMAGE_REGISTRY LANCACHE_IMAGE_TAG NATS_DNS_WRITER_PASSWORD NATS_CALLOUT_PASSWORD NATS_SYS_PASSWORD NATS_UI_PASSWORD PDNS_API_KEY HTTPS_ENABLED SECONDARY_REGISTRATION_TOKEN
