
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Trivy scan exact image digest
description: |
  What: runs the blocking vulnerability/secret scan against one immutable, digest-qualified image reference.
  Why: every candidate build job shares this action so all architectures and event paths enforce the same fail-closed scan policy.
  From: PR #1523

inputs:
  image-ref:
    description: |
      What: repository@sha256:<digest> reference for the exact image to scan.
      Why: a mutable tag could resolve to a different artifact than the one that actually gets published.
      From: PR #1523
    required: true
  cache-dir:
    description: |
      What: filesystem path for Trivy's vulnerability-database cache.
      Why: caller-owned so concurrent matrix jobs never share one cache directory.
      From: PR #1523
    required: true
  cleanup-cache:
    description: |
      What: deletes cache-dir after the scan when set to "true".
      Why: an ephemeral per-run cache must not accumulate; a shared persistent cache must never be deleted this way.
      From: PR #1523
    required: false
    default: "false"
  registry-username:
    description: |
      What: registry username forwarded to trivy-scan-retry.
      Why: needed for GHCR authentication and for re-login on a retried scan attempt.
      From: PR #1543 | Issue #1535
    required: true
  registry-password:
    description: |
      What: registry password/token forwarded to trivy-scan-retry.
      Why: needed for GHCR authentication and for re-login on a retried scan attempt.
      From: PR #1543 | Issue #1535
    required: true
  dockerhub-username:
    description: |
      What: optional Docker Hub username forwarded to trivy-scan-retry.
      Why: Docker Hub is trivy-scan-retry's optional third vulnerability-DB source tier.
      From: PR #1543 | Issue #1535
    required: false
    default: ""
  dockerhub-password:
    description: |
      What: optional Docker Hub password/token forwarded to trivy-scan-retry.
      Why: Docker Hub is trivy-scan-retry's optional third vulnerability-DB source tier.
      From: PR #1543 | Issue #1535
    required: false
    default: ""

outputs:
  db-unavailable:
    description: |
      What: forwards trivy-scan-retry's own db-unavailable output.
      Why: "true" only for DB-download failure, never a genuine finding --
        see that action's own output for the full contract.
      From: Issue #1095
    value: ${{ steps.scan.outputs.db-unavailable }}

runs:
  using: composite
  steps:
    - name: Require immutable digest identity
      id: require
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        CACHE_DIR: ${{ inputs.cache-dir }}
        CLEANUP_CACHE: ${{ inputs.cleanup-cache }}
      run: |
        set -euo pipefail
        case "$IMAGE_REF" in
          *@sha256:[0-9a-fA-F]*) ;;
          *)
            echo "::error::Exact-digest scan refuses mutable image reference '$IMAGE_REF'. Expected repository@sha256:<digest>."
            exit 1
            ;;
        esac
        if [[ ! "$IMAGE_REF" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
          echo "::error::Exact-digest scan received malformed OCI digest '$IMAGE_REF'."
          exit 1
        fi
        : "${CACHE_DIR:?cache-dir is required}"

        cleanup_safe=false
        # What: restricts safe-to-delete cache paths to two known roots.
        # Why: a typo in the caller-controlled cache-dir input must never
        #   turn a reusable action into an arbitrary recursive deletion.
        # From: PR #1523
        if [[ "$CLEANUP_CACHE" == "true" ]]; then
          [[ "$CACHE_DIR" == /* ]] || {
            echo "::error::Refusing to clean non-absolute Trivy cache path '$CACHE_DIR'."
            exit 1
          }
          case "/${CACHE_DIR#/}/" in
            */../* | */./*)
              echo "::error::Refusing Trivy cache cleanup path containing dot traversal: '$CACHE_DIR'."
              exit 1
              ;;
          esac

          runner_temp="${RUNNER_TEMP:-}"
          runner_temp="${runner_temp%/}"
          if [[ -n "$runner_temp" && "$CACHE_DIR" == "$runner_temp/"* ]]; then
            cleanup_safe=true
          elif [[ "$CACHE_DIR" == /var/tmp/lancache-ng-trivy-cache/* ]]; then
            cleanup_safe=true
          fi

          if [[ "$cleanup_safe" != "true" ]]; then
            echo "::error::Refusing to clean unexpected Trivy cache path '$CACHE_DIR'."
            exit 1
          fi
        fi

        mkdir -p "$CACHE_DIR"
        if [[ "$CLEANUP_CACHE" == "true" && -L "$CACHE_DIR" ]]; then
          echo "::error::Refusing to clean symlinked Trivy cache path '$CACHE_DIR'."
          exit 1
        fi
        printf 'cleanup-safe=%s\n' "$cleanup_safe" >> "$GITHUB_OUTPUT"

    # What: scans with trivy-scan-retry, not aquasecurity/trivy-action directly.
    # Why: the unauthenticated first-choice vulnerability-DB mirror caused
    #   real CI failures with zero retry anywhere.
    # From: PR #1542 | Issue #1535
    - name: Scan exact image digest with Trivy
      id: scan
      uses: ./.github/actions/trivy-scan-retry
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln,secret
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        trivyignores: .trivyignore.yaml
        skip-dirs: /usr/local/rustup/toolchains
        hide-progress: true
        cache: "false"
        cache-dir: ${{ inputs.cache-dir }}
        timeout: 10m
        exit-code: "1"

    - name: Remove ephemeral exact-digest scan cache
      if: always() && inputs.cleanup-cache == 'true' && steps.require.outputs.cleanup-safe == 'true'
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        set -euo pipefail
        : "${CACHE_DIR:?cache-dir is required}"
        rm -rf -- "$CACHE_DIR"
