
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Docker build and push to GHCR with retry
description: >-
  Builds once, then retries only the GHCR push after re-authentication.

# GitHub Actions composite steps cannot loop, and `uses:` cannot be
# parameterized by an input (the action reference must be static YAML), so
# the "at least 3 retries" attempt count below is 4 explicit, chained
# docker/build-push-action steps rather than a real loop calling
# scripts/lib/ghcr-retry.sh (that file's shell loop only works for plain
# shell commands -- see its own header comment for why a `uses:` step needs
# its own wrapper like this one instead).
#
# Extracted from .github/workflows/build-push.yml's build/build-arm64 jobs
# (#541's "Wait before retrying the push" / "Re-authenticate to GHCR before
# retry" / "Retry Build and push" steps), which had exactly one retry (2
# total attempts) and existed only in those two jobs. Issue #822 found
# build-tools.yml's own build-tools/build-tools-arm64 jobs run the identical
# docker/build-push-action push with ZERO retry at all. Both now use this one
# action so the policy can't drift between copies again (see #820's
# duplicated-overlap-check lesson).
inputs:
  registry:
    description: Registry hostname to log in to on retry.
    required: false
    default: ghcr.io
  username:
    description: Registry username to re-authenticate with before a retry.
    required: true
  password:
    description: Registry password/token to re-authenticate with before a retry.
    required: true
  backoff-seconds:
    description: Seconds to wait before each retry, before re-authenticating.
    required: false
    default: "30"
  builder:
    required: false
    default: ""
  context:
    required: false
    default: "."
  dockerfile:
    description: Path to the Dockerfile (default "{context}/Dockerfile").
    required: false
    default: ""
  build-contexts:
    required: false
    default: ""
  secret-files:
    required: false
    default: ""
  build-args:
    required: false
    default: ""
  network:
    required: false
    default: ""
  allow:
    required: false
    default: ""
  push:
    required: false
    default: "true"
  tags:
    required: false
    default: ""
  labels:
    required: false
    default: ""
  outputs:
    required: false
    default: ""
  platforms:
    required: false
    default: ""
  provenance:
    required: false
    default: ""
  load:
    required: false
    default: "false"
  pull:
    required: false
    default: "false"
  cache-from:
    required: false
    default: ""
  cache-to:
    required: false
    default: ""
outputs:
  digest:
    description: Digest of the pushed image from whichever attempt succeeded.
    value: ${{ steps.resolve.outputs.digest }}
runs:
  using: composite
  steps:
    - id: build
      uses: ./.github/actions/docker-build-push-action-centralized-version
      if: inputs.push != 'true'
      with:
        builder: ${{ inputs.builder }}
        context: ${{ inputs.context }}
        dockerfile: ${{ inputs.dockerfile }}
        build-contexts: ${{ inputs.build-contexts }}
        secret-files: ${{ inputs.secret-files }}
        build-args: ${{ inputs.build-args }}
        network: ${{ inputs.network }}
        allow: ${{ inputs.allow }}
        push: false
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        outputs: ${{ inputs.outputs }}
        platforms: ${{ inputs.platforms }}
        provenance: ${{ inputs.provenance }}
        load: ${{ inputs.load }}
        pull: ${{ inputs.pull }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    - id: build-for-push
      uses: ./.github/actions/docker-build-push-action-centralized-version
      if: inputs.push == 'true'
      with:
        builder: ${{ inputs.builder }}
        context: ${{ inputs.context }}
        dockerfile: ${{ inputs.dockerfile }}
        build-contexts: ${{ inputs.build-contexts }}
        secret-files: ${{ inputs.secret-files }}
        build-args: ${{ inputs.build-args }}
        network: ${{ inputs.network }}
        allow: ${{ inputs.allow }}
        push: false
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        outputs: ""
        platforms: ${{ inputs.platforms }}
        provenance: ${{ inputs.provenance }}
        load: true
        pull: ${{ inputs.pull }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    - id: push
      name: Push built image to GHCR
      if: inputs.push == 'true'
      continue-on-error: true
      shell: bash
      env:
        GHCR_REGISTRY: ${{ inputs.registry }}
        GHCR_USERNAME: ${{ inputs.username }}
        GHCR_PASSWORD: ${{ inputs.password }}
        GHCR_TAGS: ${{ inputs.tags }}
        GHCR_BACKOFF: ${{ inputs.backoff-seconds }}
      run: |
        set -euo pipefail
        source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
        export GHCR_RETRY_BACKOFF_SECONDS="$GHCR_BACKOFF"
        push_log="$(mktemp -p /var/tmp lancache-ghcr-push.XXXXXX)"
        trap 'rm -f "$push_log"' EXIT
        mapfile -t tags < <(printf '%s\n' "$GHCR_TAGS" | sed '/^[[:space:]]*$/d')
        if ((${#tags[@]} == 0)); then
          echo '::error::GHCR push requested without an image tag.' >&2
          exit 1
        fi
        digest=''
        for tag in "${tags[@]}"; do
          : > "$push_log"
          export GHCR_PUSH_TAG="$tag" GHCR_PUSH_LOG="$push_log"
          if ghcr_retry "$GHCR_REGISTRY" "$GHCR_USERNAME" "$GHCR_PASSWORD" -- \
            bash -c 'set -o pipefail; docker push "$GHCR_PUSH_TAG" 2>&1 | tee "$GHCR_PUSH_LOG"'; then
            status=0
          else
            status=$?
          fi
          if ((status != 0)); then
            exit "$status"
          fi
          digest="$(grep -Eo 'sha256:[0-9a-f]{64}' "$push_log" | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR push for $tag did not report a valid digest." >&2
            exit 1
          fi
        done
        printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

    - id: resolve
      if: always()
      shell: bash
      env:
        PUSH_MODE: ${{ inputs.push }}
        PUSH_OUTCOME: ${{ steps.push.outcome }}
        PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        BUILD_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        if [[ "$PUSH_MODE" == 'true' ]]; then
          if [[ "$PUSH_OUTCOME" != 'success' || ! "$PUSH_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::GHCR push failed or returned no valid digest.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$PUSH_DIGEST" >> "$GITHUB_OUTPUT"
        else
          if [[ "$BUILD_OUTCOME" != 'success' ]]; then
            echo '::error::Docker build failed.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$BUILD_DIGEST" >> "$GITHUB_OUTPUT"
        fi
