
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Ensure the shared Trivy DB exists (bootstrap-only lock)
description: >-
  Cheap presence check for the shared, persistent Trivy DB cache-dir.
  trivy-db-scheduled-refresh.yml is now the sole regular writer to this
  shared path on its own cron, so every regular scan job only needs to
  know whether a DB file exists at all (a stat, no lock, no per-job
  trivy --download-db-only freshness check) before passing
  skip-db-update unconditionally. The only remaining lock-guarded path
  is the genuine first-time-ever bootstrap case (no trivy.db anywhere
  yet on a cold shared cache), where a real concurrent-write race
  between two callers is still possible until the scheduled workflow's
  first successful run creates the file this action then finds.

# What: stat-only in the common case; locks only bootstrap
# Why: scheduled workflow is now the sole regular writer
# From: Issue #1780 | Issue #1095

inputs:
  cache-dir:
    description: The directory returned by trivy-cache-dir's `dir` output.
    required: true
  lock-timeout-seconds:
    description: >-
      Maximum time to wait for the bootstrap lock before giving up and
      letting the downstream scan step run its own unlocked bootstrap
      attempt (db-present stays "false") rather than blocking the whole
      pipeline indefinitely.
    required: false
    default: "900"
  stale-lock-seconds:
    description: >-
      A lock directory older than this is assumed to belong to a crashed
      holder and is reclaimed. Generous on purpose: a genuine ~1.3 GB DB
      download over a home-lab link can legitimately take several minutes.
    required: false
    default: "1200"
outputs:
  db-present:
    description: >-
      "true" once a real trivy.db file exists in cache-dir after this
      action runs (whether it already existed, or this action's own
      bootstrap download just created it). "false" only when no DB
      exists at all yet AND the bootstrap download itself failed,
      timed out waiting for the lock, or lost a stale-lock race -- the
      sole case where a downstream scan step must NOT pass
      skip-db-update, so Trivy's own unlocked bootstrap can still run,
      exactly as it would have before this action existed.
    value: ${{ steps.check.outputs.db-present }}

runs:
  using: composite
  steps:
    # What: stats for a DB file; no lock, no trivy call.
    # Why: scheduled workflow already keeps this fresh.
    # From: Issue #1780
    - name: Check for an already-present Trivy DB
      id: precheck
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        set -euo pipefail
        : "${CACHE_DIR:?cache-dir is required}"
        if [ -s "$CACHE_DIR/db/trivy.db" ]; then
          echo "::notice::Trivy DB already present in '$CACHE_DIR/db' -- trusting trivy-db-scheduled-refresh.yml as sole writer, no lock and no per-job freshness check needed."
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install trivy CLI for the bootstrap-only DB download
      if: steps.precheck.outputs.present != 'true'
      uses: ./.github/actions/aquasecurity-setup-trivy-centralized-version

    # What: locked download, reached only on a cold cache.
    # Why: sole case two callers could still race a write.
    # From: Issue #1780 | Issue #1095
    - name: Bootstrap-download the DB under lock (cold cache only)
      id: bootstrap
      if: steps.precheck.outputs.present != 'true'
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
        LOCK_TIMEOUT: ${{ inputs.lock-timeout-seconds }}
        STALE_AFTER: ${{ inputs.stale-lock-seconds }}
      run: |
        set -euo pipefail
        : "${CACHE_DIR:?cache-dir is required}"
        lock_dir="$CACHE_DIR/.trivy-db-update.lock"
        poll_interval=5
        waited=0

        # What: uses atomic mkdir for lock, not flock
        # Why: soft NFS mount cannot reliably support flock
        # From: Issue #1780 | Issue #1095
        acquire() {
          mkdir "$lock_dir" 2>/dev/null
        }

        while ! acquire; do
          if [ -d "$lock_dir" ]; then
            lock_mtime="$(stat -c %Y "$lock_dir" 2>/dev/null || echo 0)"
            now="$(date +%s)"
            age=$(( now - lock_mtime ))
            if [ "$age" -gt "$STALE_AFTER" ]; then
              echo "::warning::Reclaiming stale Trivy DB bootstrap lock '$lock_dir' (age ${age}s > ${STALE_AFTER}s) -- previous holder almost certainly crashed or was cancelled mid-download."
              rm -rf -- "$lock_dir"
              continue
            fi
          fi
          if [ "$waited" -ge "$LOCK_TIMEOUT" ]; then
            echo "::warning::Timed out after ${LOCK_TIMEOUT}s waiting for the Trivy DB bootstrap lock held by another concurrent cold-cache caller -- leaving db-present=false so the caller's own scan step attempts an unlocked bootstrap download itself."
            exit 0
          fi
          sleep "$poll_interval"
          waited=$(( waited + poll_interval ))
        done

        # What: trap ensures lock release even on failure
        # Why: unreleased lock wedges every later caller.
        # From: Issue #1780 | Issue #1095
        trap 'rm -rf -- "$lock_dir"' EXIT

        echo "::notice::Holding Trivy DB bootstrap lock on '$lock_dir' -- no DB exists yet in '$CACHE_DIR' (first-time-ever cold cache), downloading once so every other caller can read it unlocked from now on."
        trivy image --download-db-only --cache-dir "$CACHE_DIR"

    - name: Determine whether a DB is present after this action ran
      id: check
      if: always()
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
        PRECHECK_PRESENT: ${{ steps.precheck.outputs.present }}
      run: |
        set -euo pipefail
        : "${CACHE_DIR:?cache-dir is required}"
        if [ "$PRECHECK_PRESENT" = "true" ] || [ -s "$CACHE_DIR/db/trivy.db" ]; then
          echo "db-present=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No trivy.db present in '$CACHE_DIR' after the bootstrap attempt (lock timeout on a cold cache, or the download itself failed) -- the next scan step will run WITHOUT skip-db-update so Trivy can still attempt its own unlocked bootstrap download, exactly as it would have before this action existed."
          echo "db-present=false" >> "$GITHUB_OUTPUT"
        fi
