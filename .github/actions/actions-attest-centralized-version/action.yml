name: Centralized version -- actions/attest
description: >-
  Single owner of the actions/attest pin. Every caller that needs this
  action goes through here instead of repeating the ref, so a version bump
  is one edit, not N.

# What: exists because a YAML anchor/alias cannot serve this role.
# Why: GitHub's composite-action manifest parser rejects anchors/aliases
#   outright ("Anchors are not currently supported") -- confirmed live,
#   PR #1665's `&anchor`/`*alias` attempt broke every build/build-arm64
#   job for every service (issue #1095). A local `uses: ./...` reference
#   has no such restriction, so this thin pass-through wrapper is the
#   pin's one real maintenance point instead.
# From: Issue #1095
inputs:
  subject-name:
    required: true
  subject-digest:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        push-to-registry: true
