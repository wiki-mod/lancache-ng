# lancache-ng (https://github.com/wiki-mod/lancache-ng)
name: PR tracking metadata fetch and validate
description: >-
  Two of pr-tracking-metadata-check's three steps, extracted into a composite action
  (issue #1095 duplication finding): this job and pr-tracking-metadata-check-hosted below
  used to carry these two steps as byte-identical duplicated text. The job's first step,
  "Auto-assign Dependabot PR milestone", deliberately stays duplicated on both calling
  jobs instead of moving here -- its warning-path `run:` text genuinely differs between
  the two jobs (references its own job name, and the self-hosted copy carries an extra
  trailing clause), so unifying it would either lose that per-job detail or require
  parameterizing two independent string edits for a step that only ever prints a
  human-facing warning. Not worth forcing; see build-push.yml's own two calling jobs for
  that step's real content. `secrets.PROJECT_AUTOMATION_PAT` is passed in as an input
  rather than read directly here because `secrets.*` (beyond the always-available
  `github.token`) is only guaranteed to resolve in the calling workflow, not inside a
  composite action.
inputs:
  build-tools-image:
    description: Resolved BUILD_TOOLS_IMAGE reference (already smoke-tested by the caller).
    required: true
  project-automation-pat:
    description: >-
      Caller's `secrets.PROJECT_AUTOMATION_PAT` value (Projects v2 read scope;
      empty on fork PRs by design -- GITHUB_TOKEN cannot write/read Projects v2 data
      and forked-repo pull_request runs never receive repository secrets beyond it).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch current labels/milestone live
      # Same class of bug found and fixed in pr-template-check (2026-07-16):
      # github.event.pull_request.labels/.milestone is a snapshot taken when
      # THIS event fired, and can go stale (confirmed live: a PR that
      # genuinely had labels and a milestone set was reported as having
      # neither). Fetched live via `gh pr view` on the runner instead, then
      # threaded into the container the same way the event-derived values
      # used to be. Uses `github.token`, not `secrets.GITHUB_TOKEN` as both original jobs
      # had it: a composite action cannot resolve `secrets.*` directly, and GitHub's own
      # docs state `github.token` is "functionally equivalent to the GITHUB_TOKEN secret"
      # -- read-only access to the PR is all this call needs, which the default scope
      # covers either way.
      id: live-metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels' > /tmp/pr-labels-live.json
        milestone_title="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json milestone -q '.milestone.title // ""')"
        {
          echo "labels_file=/tmp/pr-labels-live.json"
          echo "milestone_title=$milestone_title"
        } >> "$GITHUB_OUTPUT"

    - name: Validate labels, milestone, and project-board placement
      shell: bash
      env:
        PR_LABELS_JSON: ${{ steps.live-metadata.outputs.labels_file }}
        PR_MILESTONE_TITLE: ${{ steps.live-metadata.outputs.milestone_title }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.project-automation-pat }}
        # GitHub does not pass repository secrets (other than the
        # read-only GITHUB_TOKEN) to pull_request-triggered runs from a
        # forked repository, so GH_TOKEN above is empty for every external
        # contributor's PR even once PROJECT_AUTOMATION_PAT is configured.
        # Telling the script whether this run is from a fork lets it warn
        # with the right explanation instead of implying the secret is
        # simply unconfigured -- see check-pr-tracking-metadata.sh.
        PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        BUILD_TOOLS_IMAGE: ${{ inputs.build-tools-image }}
      run: |
        set -euo pipefail
        # PR_LABELS_JSON now names a live-fetched file (mounted below),
        # not an inline JSON string -- read its content before handing it
        # to the container as an env var, same shape the script always
        # expected.
        labels_json="$(cat "$PR_LABELS_JSON")"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          -e PR_LABELS_JSON="$labels_json" \
          -e PR_MILESTONE_TITLE \
          -e PR_DRAFT \
          -e PR_NUMBER \
          -e REPO \
          -e GH_TOKEN \
          -e PR_IS_FORK \
          "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
          bash scripts/check-pr-tracking-metadata.sh
