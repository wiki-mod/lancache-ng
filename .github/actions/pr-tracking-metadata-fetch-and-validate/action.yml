
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: PR tracking metadata fetch and validate
description: >-
  Two of pr-tracking-metadata-check's three steps, shared with its hosted-fallback
  counterpart. The remaining step ("Auto-assign Dependabot PR milestone") stays
  duplicated on both callers since its warning text genuinely differs per job
  (From: PR #1467).
inputs:
  build-tools-image:
    description: Resolved BUILD_TOOLS_IMAGE reference (already smoke-tested by the caller).
    required: true
  project-automation-pat:
    description: >-
      Caller's `secrets.PROJECT_AUTOMATION_PAT` value (Projects v2 read scope;
      empty on fork PRs by design -- GITHUB_TOKEN cannot write/read Projects v2 data
      and forked-repo pull_request runs never receive repository secrets beyond it).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch current labels/milestone live
      # What: Fetch live labels/milestone via gh pr view.
      # Why: Event payload goes stale; github.token covers read.
      # From: PR #1467
      id: live-metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '.labels' > /tmp/pr-labels-live.json
        milestone_title="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json milestone -q '.milestone.title // ""')"
        {
          echo "labels_file=/tmp/pr-labels-live.json"
          echo "milestone_title=$milestone_title"
        } >> "$GITHUB_OUTPUT"

    - name: Validate labels, milestone, and project-board placement
      shell: bash
      env:
        PR_LABELS_JSON: ${{ steps.live-metadata.outputs.labels_file }}
        PR_MILESTONE_TITLE: ${{ steps.live-metadata.outputs.milestone_title }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.project-automation-pat }}
        # What: Signals whether run is from fork PR.
        # Why: GitHub doesn't pass secrets to fork runs; flag needed.
        # From: PR #1467
        PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        BUILD_TOOLS_IMAGE: ${{ inputs.build-tools-image }}
      run: |
        set -euo pipefail
        # What: Reads PR_LABELS_JSON file content before docker run.
        # Why: PR_LABELS_JSON is live-fetched file, not inline JSON.
        # From: PR #1467
        labels_json="$(cat "$PR_LABELS_JSON")"
        # 600s: this script makes real GraphQL Projects v2 calls (and a
        # milestone auto-assign write for Dependabot PRs) against
        # api.github.com, not a pure text scan -- 300s would be tight under
        # real API latency/retry conditions. The calling job's own
        # timeout-minutes: 15 (900s) covers checkout plus the earlier
        # "Fetch current labels/milestone live" step too, so 600s here still
        # leaves real headroom.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          -e PR_LABELS_JSON="$labels_json" \
          -e PR_MILESTONE_TITLE \
          -e PR_DRAFT \
          -e PR_NUMBER \
          -e REPO \
          -e GH_TOKEN \
          -e PR_IS_FORK \
          "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
          timeout --kill-after=30 --signal=KILL 600 bash scripts/tracked/check-pr-tracking-metadata.sh
