# What: Use trivy-config input instead of env var.
# Why: env vars unreliable in nested composite actions.
# From: Issue #1535 | PR #1542

# What: Order trivy DB repos: GHCR, mirror.gcr.io, Docker Hub.
# Why: mirror.gcr.io not using Docker quota; Hub sits last.
# From: Issue #1535 | PR #1543
db:
  repository:
    - ghcr.io/aquasecurity/trivy-db:2
    - mirror.gcr.io/aquasec/trivy-db:2
    - docker.io/aquasec/trivy-db:2
  java-repository:
    - ghcr.io/aquasecurity/trivy-java-db:1
    - mirror.gcr.io/aquasec/trivy-java-db:1
    - docker.io/aquasec/trivy-java-db:1
