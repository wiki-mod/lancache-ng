
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: Retries trivy-action up to 4 times with re-auth.
# Why: trivy only retries on transient DB failures.
# From: Issue #1535 | PR #1542
name: Trivy scan with GHCR-first DB mirror, authenticated pull, and retry
description: >-
  Wraps aquasecurity/trivy-action with a 4-attempt retry and a GHCR-first,
  mirror.gcr.io-second, Docker-Hub-third DB-source order (see
  trivy-config.yaml), retrying only a DB-download failure, never a genuine
  vulnerability/secret finding.
inputs:
  registry:
    description: Registry hostname to log in to (and to prefer for DB downloads).
    required: false
    default: ghcr.io
  username:
    description: Registry username to authenticate with (initially, and again before each retry).
    required: true
  password:
    description: Registry password/token to authenticate with (initially, and again before each retry).
    required: true
  dockerhub-username:
    description: >-
      Docker Hub username for the optional third, last-resort DB-source
      tier. Left blank (default), the Docker Hub login step is skipped and
      this action behaves exactly as before this input existed.
    required: false
    default: ""
  dockerhub-password:
    description: Docker Hub password/access token to pair with dockerhub-username (initially, and again before each retry).
    required: false
    default: ""
  backoff-seconds:
    description: Seconds to wait before each retry, before re-authenticating.
    required: false
    default: "30"
  scan-type:
    required: false
    default: image
  image-ref:
    required: false
    default: ""
  format:
    required: false
    default: table
  output:
    description: Report output file. Left blank, this action still forces one internally (a fixed path under runner.temp) to drive the retry discriminator, and restores stdout visibility via its own final step.
    required: false
    default: ""
  scanners:
    required: false
    default: ""
  severity:
    required: false
    default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  ignore-unfixed:
    required: false
    default: "false"
  trivyignores:
    required: false
    default: ""
  skip-dirs:
    required: false
    default: ""
  hide-progress:
    required: false
    default: ""
  cache:
    required: false
    default: "true"
  cache-dir:
    required: false
    default: ${{ github.workspace }}/.cache/trivy
  timeout:
    required: false
    default: ""
  exit-code:
    required: false
    default: ""
outputs:
  db-status:
    description: >-
      Three-valued, never a boolean: "unavailable" when the final attempt
      wrote no report AND no DB file exists (the DB never downloaded);
      "available" when a report was written (genuine finding) or a DB was
      present (some other pre-report error), and on overall success;
      "unknown" when this action did not reach its own determination step
      at all (timeout, cancellation, output-propagation failure). A
      consumer must treat "unknown" as NOT-RUN -- never as recovery, never
      as a finding. See "Determine DB status" step below.
    value: ${{ steps.db-status.outputs.value }}
  scan-error:
    description: >-
      "true" only when the terminal attempt failed with no report AND the
      DB was already present -- a pre-report error (image pull/auth
      failure, bad config, scanner crash), never a genuine finding and
      never a DB outage. A consumer must not treat this as a finding and
      must not delete/promote on db-status "available" alone when this is
      "true". "false" on every other outcome, including overall success.
    value: ${{ steps.db-status.outputs.scan-error }}
runs:
  using: composite
  steps:
    # What: Resolves output path, defaulting to runner.temp file.
    # Why: retry discriminator needs stable path across all attempts.
    # From: Issue #1535 | PR #1542
    - name: Resolve effective Trivy output path
      id: outpath
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.output }}" ]; then
          echo "path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        else
          echo "path=${{ runner.temp }}/trivy-scan-retry-output.txt" >> "$GITHUB_OUTPUT"
        fi

    # What: Deletes leftover report file from earlier invocation.
    # Why: stale file would misread as current attempt's result.
    # From: Issue #1535 | PR #1542
    - name: Clear any stale Trivy report file
      shell: bash
      run: rm -f "${{ steps.outpath.outputs.path }}"

    # What: Write shared attempt-failure classifier script.
    # Why: unified classifier prevents divergence across attempts.
    # From: Issue #1095
    - name: Prepare shared attempt-classifier script
      id: classify-script
      shell: bash
      run: |
        set -euo pipefail
        script="${{ runner.temp }}/trivy-scan-retry-classify.sh"
        cat > "$script" <<'CLASSIFY'
        #!/usr/bin/env bash
        set -euo pipefail
        attempt="$1"
        report="$2"
        cache_dir="${3:-}"
        # Empty cache-dir means trivy-action used its own default.
        if [ -z "$cache_dir" ]; then
          cache_dir="${HOME}/.cache/trivy"
        fi
        if [ -s "$report" ]; then
          echo "retryable=false" >> "$GITHUB_OUTPUT"
          echo "error-kind=finding" >> "$GITHUB_OUTPUT"
          echo "::warning::Trivy attempt $attempt failed but its report ('$report') was written -- a genuine finding or non-download error, not retryable." >&2
        elif [ -s "$cache_dir/db/trivy.db" ]; then
          echo "retryable=false" >> "$GITHUB_OUTPUT"
          echo "error-kind=pre-report-error" >> "$GITHUB_OUTPUT"
          echo "::warning::Trivy attempt $attempt failed with no report, but the vulnerability DB IS present in '$cache_dir/db' -- not a DB-download failure, some other pre-report error (target-image pull/auth, config, scanner crash)." >&2
        else
          echo "retryable=true" >> "$GITHUB_OUTPUT"
          echo "error-kind=db-missing" >> "$GITHUB_OUTPUT"
          echo "::warning::Trivy attempt $attempt failed with no report and no DB file in '$cache_dir/db' -- classified as a DB-download failure." >&2
        fi
        CLASSIFY
        echo "path=$script" >> "$GITHUB_OUTPUT"

    # What: Authenticate to GHCR before Trivy DB pull.
    # Why: defense-in-depth for shared egress-IP pool runners.
    # From: Issue #1535 | PR #1542
    - name: Log in to GHCR for authenticated Trivy DB pull
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # What: Authenticate to Docker Hub for third DB-source tier.
    # Why: default docker/login-action target is Hub.
    # From: Issue #1535 | PR #1543
    - name: Log in to Docker Hub for the third DB-source tier
      if: inputs.dockerhub-username != ''
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - id: attempt1
      uses: ./.github/actions/aquasecurity-trivy-action-centralized-version
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ steps.outpath.outputs.path }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    # What: Check trivy report file presence and size after failure.
    # Why: report means scanning succeeded; missing = DB failure.
    # From: Issue #1535 | PR #1542
    - name: Classify attempt 1 failure
      id: classify1
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: bash "${{ steps.classify-script.outputs.path }}" 1 "${{ steps.outpath.outputs.path }}" "${{ inputs.cache-dir }}"

    - name: Wait before retry 1
      if: steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"

    - name: Re-authenticate to GHCR before retry 1
      if: steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true'
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # What: Re-authenticate to Docker Hub before retry 1.
    # Why: match GHCR retry gate so edits cannot diverge.
    # From: Issue #1535 | PR #1543
    - name: Re-authenticate to Docker Hub before retry 1
      if: steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' && inputs.dockerhub-username != ''
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - id: attempt2
      if: steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true'
      uses: ./.github/actions/aquasecurity-trivy-action-centralized-version
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ steps.outpath.outputs.path }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    - name: Classify attempt 2 failure
      id: classify2
      if: steps.attempt2.outcome == 'failure'
      shell: bash
      run: bash "${{ steps.classify-script.outputs.path }}" 2 "${{ steps.outpath.outputs.path }}" "${{ inputs.cache-dir }}"

    - name: Wait before retry 2
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"

    - name: Re-authenticate to GHCR before retry 2
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true'
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # What: Re-authenticate to Docker Hub before retry 2.
    # Why: match GHCR retry gate so edits cannot diverge.
    # From: Issue #1535 | PR #1543
    - name: Re-authenticate to Docker Hub before retry 2
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true' &&
        inputs.dockerhub-username != ''
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - id: attempt3
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true'
      uses: ./.github/actions/aquasecurity-trivy-action-centralized-version
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ steps.outpath.outputs.path }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    - name: Classify attempt 3 failure
      id: classify3
      if: steps.attempt3.outcome == 'failure'
      shell: bash
      run: bash "${{ steps.classify-script.outputs.path }}" 3 "${{ steps.outpath.outputs.path }}" "${{ inputs.cache-dir }}"

    - name: Wait before retry 3
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true' &&
        steps.attempt3.outcome == 'failure' && steps.classify3.outputs.retryable == 'true'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"

    - name: Re-authenticate to GHCR before retry 3
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true' &&
        steps.attempt3.outcome == 'failure' && steps.classify3.outputs.retryable == 'true'
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # What: Re-authenticate to Docker Hub before retry 3.
    # Why: match GHCR retry gate so edits cannot diverge.
    # From: Issue #1535 | PR #1543
    - name: Re-authenticate to Docker Hub before retry 3
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true' &&
        steps.attempt3.outcome == 'failure' && steps.classify3.outputs.retryable == 'true' &&
        inputs.dockerhub-username != ''
      continue-on-error: true
      uses: ./.github/actions/docker-login-action-centralized-version
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - id: attempt4
      if: >-
        steps.attempt1.outcome == 'failure' && steps.classify1.outputs.retryable == 'true' &&
        steps.attempt2.outcome == 'failure' && steps.classify2.outputs.retryable == 'true' &&
        steps.attempt3.outcome == 'failure' && steps.classify3.outputs.retryable == 'true'
      uses: ./.github/actions/aquasecurity-trivy-action-centralized-version
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ steps.outpath.outputs.path }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    # What: Classify attempt 4 via shared script.
    # Why: unified classifier prevents misread across all attempts.
    # From: Issue #1095
    - name: Classify attempt 4 failure
      id: classify4
      if: steps.attempt4.outcome == 'failure'
      shell: bash
      run: bash "${{ steps.classify-script.outputs.path }}" 4 "${{ steps.outpath.outputs.path }}" "${{ inputs.cache-dir }}"

    # What: Print report file to job log for table format output.
    # Why: writing to file suppresses stdout; caller handles output.
    # From: Issue #1535 | PR #1542
    - name: Show Trivy report
      if: always() && inputs.format == 'table'
      shell: bash
      run: |
        set -euo pipefail
        report="${{ steps.outpath.outputs.path }}"
        if [ -s "$report" ]; then
          cat "$report"
        else
          echo "No Trivy report file was produced (every attempt failed before reaching report generation)."
        fi

    # What: Surface pass/fail status across all attempts.
    # Why: non-retryable attempt must count as failure.
    # From: Issue #1535 | PR #1542
    - name: Resolve outcome across all attempts
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        for outcome in "${{ steps.attempt1.outcome }}" "${{ steps.attempt2.outcome }}" "${{ steps.attempt3.outcome }}" "${{ steps.attempt4.outcome }}"; do
          if [[ "$outcome" == "success" ]]; then
            exit 0
          fi
        done
        echo "::error::All Trivy scan attempts for image-ref '${{ inputs.image-ref }}' failed." >&2
        exit 1

    # What: Emit db-status and separate scan-error flag.
    # Why: pre-report error must not read as finding.
    # From: Issue #1095 | PR #1735
    - name: Determine DB status
      id: db-status
      if: always()
      shell: bash
      env:
        OUT1: ${{ steps.attempt1.outcome }}
        OUT2: ${{ steps.attempt2.outcome }}
        OUT3: ${{ steps.attempt3.outcome }}
        OUT4: ${{ steps.attempt4.outcome }}
        KIND1: ${{ steps.classify1.outputs.error-kind }}
        KIND2: ${{ steps.classify2.outputs.error-kind }}
        KIND3: ${{ steps.classify3.outputs.error-kind }}
        KIND4: ${{ steps.classify4.outputs.error-kind }}
      run: |
        set -euo pipefail
        # What: Check overall success before any error-kind.
        # Why: later success must never read as unavailable.
        # From: Issue #1095 | PR #1735
        succeeded=false
        for outcome in "$OUT1" "$OUT2" "$OUT3" "$OUT4"; do
          if [ "$outcome" = "success" ]; then
            succeeded=true
            break
          fi
        done
        if [ "$succeeded" = "true" ]; then
          echo "value=available" >> "$GITHUB_OUTPUT"
          echo "scan-error=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        kind=""
        for candidate in "$KIND4" "$KIND3" "$KIND2" "$KIND1"; do
          if [ -n "$candidate" ]; then
            kind="$candidate"
            break
          fi
        done
        case "$kind" in
          db-missing)
            echo "value=unavailable" >> "$GITHUB_OUTPUT"
            echo "scan-error=false" >> "$GITHUB_OUTPUT"
            ;;
          pre-report-error)
            echo "value=available" >> "$GITHUB_OUTPUT"
            echo "scan-error=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "value=available" >> "$GITHUB_OUTPUT"
            echo "scan-error=false" >> "$GITHUB_OUTPUT"
            ;;
        esac
