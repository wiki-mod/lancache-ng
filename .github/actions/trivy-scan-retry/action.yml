
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Trivy scan with GHCR-first DB mirror, authenticated pull, and retry
description: >-
  Wraps aquasecurity/trivy-action with the AG-CI-013 retry policy (issue
  #1535) applied to trivy's own vulnerability/Java-DB download, the same
  policy .github/actions/ghcr-build-push-retry and
  .github/actions/ghcr-attest-retry already apply to the image push and
  attestation steps: scan once, and on failure wait, re-authenticate with a
  fresh `docker login`, and retry the identical scan -- up to 4 total
  attempts (1 initial + 3 retries). See ghcr-build-push-retry's own header
  comment for why a `uses:` step needs this explicit chained-attempts shape
  instead of a real loop (scripts/lib/ghcr-retry.sh's shell loop only works
  for plain shell commands, not another `uses:` action).

  Two real CI failures (issue #1535: PR #1503 "failed to download artifact
  from mirror.gcr.io/aquasec/trivy-db:2", PR #1500 "Unable to initialize the
  Java DB") both hit trivy's *first* default DB mirror
  (mirror.gcr.io/aquasec/trivy-db, a GCR-hosted proxy of the Docker Hub
  image `aquasec/trivy-db` -- so it inherits Docker Hub's separate anonymous
  pull rate limit, the same class of problem this project already knows
  from Docker Hub rate limiting elsewhere) with no retry anywhere
  (`.github/actions/trivy-scan-with-cache/action.yml` had none, and neither
  did any direct aquasecurity/trivy-action call site -- grepping the whole
  project for retry/attempt/backoff near a trivy invocation returned
  nothing). Trivy's own internal fallback
  (aquasecurity/trivy's pkg/oci/artifact.go Artifacts.Download) only tries
  its second configured repository when the first failure is classified as
  a *transient* transport error; a failure shape outside that classification
  aborts immediately with exactly the "failed to download artifact from
  <repo>: <err>" message both PRs hit, never reaching the second mirror at
  all.

  Fix, beyond the retry itself: `trivy-config.yaml` (alongside this file,
  passed via trivy-action's own `trivy-config` INPUT, never an env var --
  see that file's own header comment for why an input was chosen instead,
  confirmed live against the real GHCR/GCR registries on issue #1535) pins
  TRIVY_DB_REPOSITORY/TRIVY_JAVA_DB_REPOSITORY-equivalent config to try
  ghcr.io/aquasecurity/trivy-db (this project's own already-used registry,
  which this action also explicitly authenticates to below) *first*,
  falling back to trivy's normal Docker-Hub-backed GCR mirror second rather
  than dropping it -- reduced exposure to the Docker Hub-specific rate
  limit without losing trivy's own resilience if GHCR itself has an outage.
  ghcr.io currently carries no documented anonymous per-IP pull-count cap
  the way Docker Hub does, but this project's self-hosted runner fleet
  shares a small pool of egress IPs across many concurrent scans, so
  authenticating (via the same docker/login-action pattern
  ghcr-build-push-retry/ghcr-attest-retry already use, not raw
  TRIVY_USERNAME/TRIVY_PASSWORD env vars, which trivy would apply globally
  to *every* registry it touches including whatever unrelated image-ref is
  being scanned) is real defense-in-depth, not just a formality. The login
  step below runs unconditionally on every event, including pull_request --
  unlike the existing job-level "Log in to GHCR" steps in build-tools.yml/
  build-push.yml, which are gated `if: github.event_name != 'pull_request'`
  because they exist for the *push* step, not for a read-only DB pull, so a
  PR-triggered scan (exactly where both #1503 and #1500 failed) never
  benefited from GHCR auth before this action existed. Login failures are
  `continue-on-error: true`: GHCR anonymous pulls already work (confirmed
  live, see this action's own verification record on issue #1535), so this
  auth step is additive defense-in-depth, not a hard dependency -- it must
  never itself turn a scan that would otherwise succeed into a failure.

  KNOWN, DELIBERATELY UNRESOLVED LIMITATION on AG-CI-013's "must distinguish
  retryable transient failures from genuine failures, which must never be
  masked by blind retries" requirement: every attempt below is a blind
  retry, identical to ghcr-build-push-retry/ghcr-attest-retry's own
  precedent, with no discriminator between a real DB-download failure and a
  genuine Trivy finding (`exit-code: "1"` on an actual HIGH/CRITICAL CVE --
  routine in this project's history: issues #1281, #1314, #1493, #1147).
  Two discriminators were tried and rejected after live verification on
  issue #1535's runner-host testing, not merely reasoned about: (1) checking
  whether trivy's own db/trivy.db + java-db/trivy-java.db cache files exist
  after a failed attempt breaks down because the Java DB is fetched lazily
  only when trivy encounters Java/JAR content -- confirmed live: a full,
  successful scan of a non-Java image (nginx:1.27-alpine) never creates a
  java-db/ directory at all, so an OR-based "either file missing =
  retryable" rule would misclassify a genuine finding on any of this
  project's (Java-free) proxy/DNS/DHCP/watchdog/Rust-service images as
  retryable, defeating the discriminator for the majority case, not an edge
  case; (2) using java-db/ directory existence as an "attempt was made"
  signal also breaks down -- confirmed live: a deliberately-failed Java DB
  download (invalid repository tag) creates no java-db/ directory at all,
  identical to "never attempted," so directory presence cannot distinguish
  the two. Neither failure mode is masked by this blind-retry choice (a
  genuine finding still fails after all 4 attempts, exactly like
  ghcr-build-push-retry's own accepted trade-off for a real Dockerfile
  syntax error) -- the cost is wasted CI time (up to ~90s backoff plus 3
  extra scan attempts) on every genuine finding, not an incorrect result.
  Recorded as a structured open question on issue #1535 for a maintainer
  decision per AG-WF-029, rather than left as an undocumented gap.

  The db-repository schema-version tags in trivy-config.yaml (":2" for
  trivy-db, ":1" for trivy-java-db) are trivy's own current defaults,
  confirmed live in the #1503 failure log itself
  ("mirror.gcr.io/aquasec/trivy-db:2") and in aquasecurity/trivy's
  pkg/db/db.go and pkg/javadb/client.go at the pinned aquasecurity/trivy-action
  commit's own default trivy version (v0.70.0). These are coupled to
  whatever trivy version trivy-action resolves -- re-verify both schema
  versions against trivy's own db.SchemaVersion/javadb.SchemaVersion
  whenever the pinned aquasecurity/trivy-action commit below is bumped, the
  same way a pinned build-tools image digest bump elsewhere in this project
  needs its own re-verification.
inputs:
  registry:
    description: Registry hostname to log in to (and to prefer for DB downloads).
    required: false
    default: ghcr.io
  username:
    description: Registry username to authenticate with (initially, and again before each retry).
    required: true
  password:
    description: Registry password/token to authenticate with (initially, and again before each retry).
    required: true
  backoff-seconds:
    description: Seconds to wait before each retry, before re-authenticating.
    required: false
    default: "30"
  scan-type:
    required: false
    default: image
  image-ref:
    required: false
    default: ""
  format:
    required: false
    default: table
  output:
    required: false
    default: ""
  scanners:
    required: false
    default: ""
  severity:
    required: false
    default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  ignore-unfixed:
    required: false
    default: "false"
  trivyignores:
    required: false
    default: ""
  skip-dirs:
    required: false
    default: ""
  hide-progress:
    required: false
    default: ""
  cache:
    required: false
    default: "true"
  cache-dir:
    required: false
    default: ${{ github.workspace }}/.cache/trivy
  timeout:
    required: false
    default: ""
  exit-code:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Log in to GHCR for authenticated Trivy DB pull
      # continue-on-error: this is defense-in-depth (see this file's own
      # header comment) -- GHCR already permits anonymous pulls, so a login
      # failure here must never fail a scan that would otherwise succeed.
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - id: attempt1
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    - name: Wait before retry 1
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"

    - name: Re-authenticate to GHCR before retry 1
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - id: attempt2
      if: steps.attempt1.outcome == 'failure'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    - name: Wait before retry 2
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"

    - name: Re-authenticate to GHCR before retry 2
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - id: attempt3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    - name: Wait before retry 3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"

    - name: Re-authenticate to GHCR before retry 3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - id: attempt4
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ github.action_path }}/trivy-config.yaml

    # continue-on-error on every attempt above means none of their failures
    # fail this composite action by itself -- this step surfaces the real
    # pass/fail to the calling job, same shape as ghcr-attest-retry's own
    # final step.
    - name: Resolve outcome across all attempts
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        for outcome in "${{ steps.attempt1.outcome }}" "${{ steps.attempt2.outcome }}" "${{ steps.attempt3.outcome }}" "${{ steps.attempt4.outcome }}"; do
          if [[ "$outcome" == "success" ]]; then
            exit 0
          fi
        done
        echo "::error::All Trivy scan attempts for image-ref '${{ inputs.image-ref }}' failed." >&2
        exit 1
