
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Compose healthcheck coverage check
description: >-
  The single byte-identical step build-push.yml's self-hosted
  `compose-healthchecks` job and its `compose-healthchecks-hosted`
  GitHub-hosted fallback both carried as a duplicated inline step (issue
  #1095 duplication finding). No build-tools image is needed here -- the
  underlying script is a pure bash/grep scan of the committed
  deploy/*/docker-compose.yml files, unlike shellcheck's steps.
runs:
  using: composite
  steps:
    - name: Check every deploy/*/docker-compose.yml service has a healthcheck
      shell: bash
      run: bash scripts/untracked/check-compose-healthchecks.sh
