# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
name: Attest custom GHCR evidence with retry
description: Creates a custom predicate attestation bound to one exact OCI digest, retrying transient GHCR publication failures.
inputs:
  registry:
    required: false
    default: ghcr.io
  username:
    required: true
  password:
    required: true
  subject-name:
    required: true
  subject-digest:
    required: true
  predicate-type:
    required: true
  predicate-path:
    required: true
  backoff-seconds:
    required: false
    default: "30"
runs:
  using: composite
  steps:
    - id: attempt1
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      continue-on-error: true
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        predicate-type: ${{ inputs.predicate-type }}
        predicate-path: ${{ inputs.predicate-path }}
        push-to-registry: true
    - if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"
    - if: steps.attempt1.outcome == 'failure'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - id: attempt2
      if: steps.attempt1.outcome == 'failure'
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      continue-on-error: true
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        predicate-type: ${{ inputs.predicate-type }}
        predicate-path: ${{ inputs.predicate-path }}
        push-to-registry: true
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - id: attempt3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      continue-on-error: true
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        predicate-type: ${{ inputs.predicate-type }}
        predicate-path: ${{ inputs.predicate-path }}
        push-to-registry: true
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
      shell: bash
      run: sleep "${{ inputs.backoff-seconds }}"
    - if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - id: attempt4
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      continue-on-error: true
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        predicate-type: ${{ inputs.predicate-type }}
        predicate-path: ${{ inputs.predicate-path }}
        push-to-registry: true
    - name: Resolve attestation outcome
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        for outcome in "${{ steps.attempt1.outcome }}" "${{ steps.attempt2.outcome }}" "${{ steps.attempt3.outcome }}" "${{ steps.attempt4.outcome }}"; do
          [[ "$outcome" == success ]] && exit 0
        done
        echo "::error::All custom attestation attempts failed for ${{ inputs.subject-name }}@${{ inputs.subject-digest }}." >&2
        exit 1

    - name: Verify final acceptance attestation roundtrip
      if: >-
        inputs.predicate-type == 'https://wiki-mod.github.io/lancache-ng/attestations/acceptance/v1' ||
        inputs.predicate-type == 'https://wiki-mod.github.io/lancache-ng/attestations/release/v1'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.password }}
        SUBJECT_NAME: ${{ inputs.subject-name }}
        SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        PREDICATE_TYPE: ${{ inputs.predicate-type }}
        PREDICATE_PATH: ${{ inputs.predicate-path }}
      run: |
        set -euo pipefail
        : "${GITHUB_WORKFLOW_REF:?GITHUB_WORKFLOW_REF is required}"
        : "${GITHUB_REF:?GITHUB_REF is required}"
        : "${GITHUB_SHA:?GITHUB_SHA is required}"
        signer_workflow="${GITHUB_WORKFLOW_REF%@*}"
        [[ "$signer_workflow" == "$GITHUB_REPOSITORY/.github/workflows/"* ]] || {
          echo "::error::Could not derive caller workflow identity from GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" >&2
          exit 1
        }

        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT
        gh_bin="$(timeout --kill-after=30 600 bash "$GITHUB_WORKSPACE/scripts/ci-install-gh-attestation-verifier.sh" "$work_dir/gh")"
        verification_json="$work_dir/verification.json"
        timeout --kill-after=30 300 "$gh_bin" attestation verify \
          "oci://${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
          --repo "$GITHUB_REPOSITORY" \
          --predicate-type "$PREDICATE_TYPE" \
          --signer-workflow "$signer_workflow" \
          --source-ref "$GITHUB_REF" \
          --source-digest "$GITHUB_SHA" \
          --bundle-from-oci \
          --format json >"$verification_json"

        expected="$(jq -cS '.' "$PREDICATE_PATH")"
        jq -e --argjson expected "$expected" '
          length > 0
          and any(.[]; .verificationResult.statement.predicate == $expected)
        ' "$verification_json" >/dev/null || {
          echo "::error::No verified final-acceptance predicate exactly matches $PREDICATE_PATH" >&2
          exit 1
        }
