
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: ShellCheck/ActionLint plus standing text/YAML guards
description: >-
  Shared step logic for the self-hosted `shellcheck` job and its `shellcheck-hosted`
  fallback. Every check runs inside the build-tools image (AG-VAL-016) so host tools
  are never trusted (From: PR #1467).
inputs:
  build-tools-image:
    description: Resolved BUILD_TOOLS_IMAGE reference (already smoke-tested by the caller).
    required: true
runs:
  using: composite
  steps:
    # What: nested in-container timeouts (300s actionlint, 600s docker run).
    # Why: actionlint's embedded shellcheck can hang indefinitely in a
    #   Go-runtime deadlock; a composite-action step can't declare
    #   timeout-minutes, so an in-container SIGKILL is the only protection.
    # From: PR #1383 | PR #1523
    - name: Run ShellCheck and ActionLint
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 600 \
          bash -lc 'set -euo pipefail; find . \( -name "*.sh" -o -name "*.bats" \) -not -path "./.git/*" -not -path "*/target/*" -print0 | xargs -0 --no-run-if-empty shellcheck --severity=warning; timeout --kill-after=30 300 actionlint .github/workflows/*.yml'

    - name: Run setup migration semantics tests
      shell: bash
      run: |
        set -euo pipefail
        # What: mounts the repo read-only for this test.
        # Why: tests/setup-migration-semantics.sh only reads setup.sh and writes to mktemp -d
        # (container /tmp), so a read-only mount is sufficient.
        # From: PR #1467
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash tests/setup-migration-semantics.sh

    - name: Check pinned GitHub Actions for deprecated Node runtimes
      # What: runs check-action-node-versions.sh inside the build-tools container with GH_TOKEN.
      # Why: the script calls curl against api.github.com (must not rely on a host-local tool,
      # AG-VAL-016); GH_TOKEN only raises the rate limit and also works fine unauthenticated
      # at this repo's current pin count.
      # From: Issue #801 | PR #804
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # 600s, not the 300s used for this file's other (pure text-scan)
        # steps: this script makes real curl calls to api.github.com per
        # pinned action and has its own rate-limit retry/backoff path
        # (tests/bats/check_action_node_versions.bats covers a transient
        # rate-limit response that recovers on a later attempt) that can
        # legitimately need more time than a text scan under real GitHub API
        # backoff -- still well inside the calling step's own 900s
        # (timeout-minutes: 15) budget for this whole composite action.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          -e GH_TOKEN \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 600 bash scripts/tracked/check-action-node-versions.sh

    - name: Check validation-subnet wrapper coverage
      # What: asserts every full-setup-validate.yml/full-setup-deep-validate.yml job that
      # starts its own compose stack is wired through the collision-safe subnet reservation.
      # Why: two jobs added after the original wiring pass were never connected to it and hit
      # a real "Pool overlaps" collision under concurrent CI load.
      # From: Issue #896 | PR #917
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-validation-subnet-wrapper-coverage.sh

    - name: Check executable bits on bare-path script invocations
      # What: scans every workflow/composite-action file and .githooks/ hook for a bare-path
      # script invocation and asserts each such file is committed with mode 100755.
      # Why: a script committed 100644 but invoked by bare path fails in CI with exit 126, a
      # defect invisible from a Windows/core.filemode=false author host (AG-VAL-024).
      # From: Issue #1019 | PR #1021
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-executable-bits.sh

    - name: Check build-tools smoke-test coverage
      # What: compares select-build-tools-image.sh's smoke_test_image() required-tools list
      # against tools/build-tools/Dockerfile's own verification list.
      # Why: a tool the Dockerfile installs and a consumer needs had repeatedly gone silently
      # unverified by the smoke test after drifting behind the Dockerfile's list.
      # From: Issue #790, Issue #791 | PR #1022
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-build-tools-smoke-coverage.sh

    - name: Check for pipefail/SIGPIPE early-exit-consumer pattern (AG-VAL-029)
      # What: scans scripts/**, tools/**, services/**, and setup.sh for a live producer
      # piped into an early-exiting consumer (`grep -q`, `head`, ...) under `set -o pipefail`.
      # Why: the consumer exiting early closes the pipe while the producer is still
      # writing, so the producer's SIGPIPE gets reported as a pipefail failure.
      # From: Issue #815 | PR #1374
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/untracked/check-pipefail-early-exit-grep.sh

    - name: Check pipefail guard's own scope coverage
      # What: verifies the pipefail-early-exit bats fixture covers every path prefix
      # check-pipefail-early-exit-grep.sh's scan_files scans, and that scan_files has
      # not narrowed below this project's pinned required minimum.
      # Why: a scan_files narrower than its documented scope can hide a real gap.
      # From: PR #1500
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-pipefail-scope-coverage.sh

    - name: Check github.repository case-safety in GHCR paths
      # What: runs check-mutable-refs.sh's repository-case check only.
      # Why: GHCR requires a lowercase owner/repo; github.repository is not
      #   guaranteed lowercase.
      # From: Issue #1095 (G1) | Issue #1504
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-mutable-refs.sh --only repository-case
