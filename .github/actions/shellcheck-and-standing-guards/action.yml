
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: ShellCheck/ActionLint plus standing text/YAML guards
description: >-
  Shared step logic for the self-hosted `shellcheck` job and its `shellcheck-hosted`
  fallback. Every check runs inside the build-tools image (AG-VAL-016) so host tools
  are never trusted (From: PR #1467).
inputs:
  build-tools-image:
    description: Resolved BUILD_TOOLS_IMAGE reference (already smoke-tested by the caller).
    required: true
runs:
  using: composite
  steps:
    # What: nested in-container timeouts (300s, 600s docker).
    # Why: composite can't set timeout; SIGKILL only protection.
    # From: PR #1383 | PR #1523
    - name: Run ShellCheck and ActionLint
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 600 \
          bash -lc 'set -euo pipefail; find . \( -name "*.sh" -o -name "*.bats" \) -not -path "./.git/*" -not -path "*/target/*" -print0 | xargs -0 --no-run-if-empty shellcheck --severity=warning; timeout --kill-after=30 300 actionlint .github/workflows/*.yml'

    - name: Run setup migration semantics tests
      shell: bash
      run: |
        set -euo pipefail
        # What: mounts the repo read-only for this test.
        # Why: script reads setup.sh only; writes to /tmp in container.
        # From: PR #1467
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh setup-migration-check

    - name: Check pinned GitHub Actions for runtime / drift / duplication guardrails
      # What: check pinned actions: Node runtime, single-ref, no drift.
      # Why: curl needed; host tools untrusted (AG-VAL-016).
      # From: Issue #801 | PR #804
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # 600s, not the 300s used for this file's other (pure text-scan)
        # steps: this script makes real curl calls to api.github.com per
        # pinned action and has its own rate-limit retry/backoff path
        # (tests/bats/check_action_node_versions.bats covers a transient
        # rate-limit response that recovers on a later attempt) that can
        # legitimately need more time than a text scan under real GitHub API
        # backoff -- still well inside the calling step's own 900s
        # (timeout-minutes: 15) budget for this whole composite action.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          -e GH_TOKEN \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 600 bash scripts/ci/ci.sh action-node-versions-check

    - name: Check validation-subnet wrapper coverage
      # What: validate all jobs using compose stack use subnet reservation.
      # Why: added jobs missed wiring; caused pool collision.
      # From: Issue #896 | PR #917
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh validation-subnet-check

    - name: Check executable bits on bare-path script invocations
      # What: validate bare-path scripts have 100755 file mode.
      # Why: 100644 fails bare-path; hidden on Windows (VAL-024).
      # From: Issue #1019 | PR #1021
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh executable-bits-check

    - name: Check build-tools smoke-test coverage
      # What: validate smoke test covers all Dockerfile-installed tools.
      # Why: tool drift undetected; Dockerfile/test divergence.
      # From: Issue #790, Issue #791 | PR #1022
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh build-tools-smoke-cov-check

    - name: Check for pipefail/SIGPIPE early-exit-consumer pattern (AG-VAL-029)
      # What: detect producer piped to early-exit consumer under pipefail.
      # Why: early-exit closes pipe; SIGPIPE reported as pipefail.
      # From: Issue #815 | PR #1374
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh pipefail-early-exit-check

    - name: Check pipefail guard's own scope coverage
      # What: verify pipefail fixture covers all scanned path prefixes.
      # Why: narrower scan than documented scope hides real gaps.
      # From: PR #1500
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh pipefail-scope-check

    - name: Check github.repository case-safety in GHCR paths
      # What: validate GHCR paths use lowercase repository reference.
      # Why: GHCR requires lowercase; variable not case-reduced.
      # From: Issue #1095 (G1) | Issue #1504
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/ci/ci.sh repository-case-check
