
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: ShellCheck/ActionLint plus standing text/YAML guards
description: >-
  Shared step logic for the self-hosted `shellcheck` job and its `shellcheck-hosted`
  fallback. Every check runs inside the build-tools image (AG-VAL-016) so host tools
  are never trusted (From: PR #1467).
inputs:
  build-tools-image:
    description: Resolved BUILD_TOOLS_IMAGE reference (already smoke-tested by the caller).
    required: true
runs:
  using: composite
  steps:
    # What: Nested timeouts guard vs actionlint.
    # Why: Shellcheck can hang in Go deadlock.
    # From: Issue #1255 | PR #1258
    - name: Run ShellCheck and ActionLint
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 600 \
          bash -lc 'set -euo pipefail; find . \( -name "*.sh" -o -name "*.bats" \) -not -path "./.git/*" -not -path "*/target/*" -print0 | xargs -0 --no-run-if-empty shellcheck --severity=warning; timeout --kill-after=30 300 actionlint .github/workflows/*.yml'

    - name: Run setup migration semantics tests
      shell: bash
      run: |
        set -euo pipefail
        # What: Mount repo read-only for test.
        # Why: Reads setup.sh; writes via mktemp.
        # From: PR #1467
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash tests/setup-migration-semantics.sh

    - name: Check pinned GitHub Actions for runtime / drift / duplication guardrails
      # What: Validate Actions versions.
      # Why: Calls api.github.com; needs container.
      # From: Issue #801 | PR #804
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # What: Allow 600s for api.github.com rate-limit retry.
        # Why: Slower than 300s text-scan steps (real HTTP calls).
        # From: PR #1856
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          -e GH_TOKEN \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 600 bash scripts/tracked/check-action-node-versions.sh

    - name: Check validation-subnet wrapper coverage
      # What: Validate subnet coverage.
      # Why: Late jobs may lack subnet wiring.
      # From: Issue #896 | PR #917
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-validation-subnet-wrapper-coverage.sh

    - name: Check registry-login and shared-scripts build-context coverage
      # What: Registry-login + shared-scripts context check.
      # Why: A job/script move can drop the required flag.
      # From: Issue #1095 | PR #1856
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-registry-login-coverage.sh

    - name: Check executable bits on bare-path script invocations
      # What: Check script executable bits.
      # Why: Exit 126 without execute bit.
      # From: Issue #1019 | PR #1021
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-executable-bits.sh

    - name: Check build-tools smoke-test coverage
      # What: Verify build-tools image.
      # Why: Detect tool drift vs Dockerfile.
      # From: Issue #822 | PR #1022
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-build-tools-smoke-coverage.sh

    - name: Check for pipefail/SIGPIPE early-exit-consumer pattern (AG-VAL-029)
      # What: Check producer-consumer SIGPIPE.
      # Why: Early exit closes pipe on error.
      # From: Issue #815 | PR #1374
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/untracked/check-pipefail-early-exit-grep.sh

    - name: Check pipefail guard's own scope coverage
      # What: Check pipefail scope coverage.
      # Why: Narrow scan scope hides gaps.
      # From: PR #1500
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-pipefail-scope-coverage.sh

    - name: Check github.repository case-safety in GHCR paths
      # What: Check repo case for GHCR.
      # Why: github.repository may not be lowercase.
      # From: Issue #1095 | PR #1597
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-mutable-refs.sh --only repository-case
