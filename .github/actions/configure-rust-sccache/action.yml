
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# GitHub Action for configuring Rust sccache with Redis and optional sccache-dist support
name: Configure Rust sccache
description: Configure Redis-backed sccache for trusted Rust CI jobs while keeping the fallback path explicit.

inputs:
  mode:
    description: "sccache mode: required, optional, or off."
    required: false
    default: required
  redis-url:
    description: Redis URL used by sccache.
    required: false
    default: ""
  key-prefix:
    description: Redis key prefix used by sccache.
    required: false
    default: lancache-ci
  dist-scheduler-url:
    description: Optional sccache-dist scheduler URL.
    required: false
    default: ""
  dist-auth-token:
    description: Optional sccache-dist client auth token.
    required: false
    default: ""
  dist-toolchain-cache-size:
    description: sccache-dist client toolchain cache size in bytes.
    required: false
    default: "5368709120"
  verify-binary:
    description: Verify sccache on the invoking environment.
    required: false
    default: "true"
  emit-buildkit-secrets:
    description: Emit temporary GHA cache files for a BuildKit secret mount.
    required: false
    default: "false"
outputs:
  config-file:
    description: Generated sccache configuration file.
    value: ${{ steps.configure.outputs.config-file }}
  url-file:
    description: Generated GitHub Actions cache URL file.
    value: ${{ steps.configure.outputs.url-file }}
  token-file:
    description: Generated GitHub Actions runtime token file.
    value: ${{ steps.configure.outputs.token-file }}
runs:
  using: composite
  steps:
    - name: Export GitHub Actions cache runtime
      if: runner.environment != 'self-hosted'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Configure Rust sccache environment
      id: configure
      shell: bash
      env:
        SCCACHE_REDIS_MODE: ${{ inputs.mode }}
        SCCACHE_REDIS_URL: ${{ inputs.redis-url }}
        SCCACHE_REDIS_KEY_PREFIX: ${{ inputs.key-prefix }}
        SCCACHE_DIST_SCHEDULER_URL: ${{ inputs.dist-scheduler-url }}
        SCCACHE_DIST_AUTH_TOKEN: ${{ inputs.dist-auth-token }}
        SCCACHE_DIST_TOOLCHAIN_CACHE_SIZE: ${{ inputs.dist-toolchain-cache-size }}
        SCCACHE_VERIFY_BINARY: ${{ inputs.verify-binary }}
        EMIT_BUILDKIT_SECRETS: ${{ inputs.emit-buildkit-secrets }}
        ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
        ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        mode="${SCCACHE_REDIS_MODE:-required}"

        case "$mode" in
          required|optional|off)
            ;;
          *)
            echo "::error::SCCACHE_REDIS_MODE must be one of: required, optional, off."
            exit 1
            ;;
        esac

        gha_enabled=0
        if [ -n "$ACTIONS_RESULTS_URL" ] && [ -n "$ACTIONS_RUNTIME_TOKEN" ]; then
          gha_enabled=1
        fi

        # Optional or off modes let CI keep running on runners without LAN-only acceleration.
        if [ "$mode" = "off" ] && [ "$gha_enabled" = "0" ]; then
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "Redis-backed sccache is disabled by SCCACHE_REDIS_MODE=off."
          exit 0
        fi

        if [ -n "$SCCACHE_DIST_SCHEDULER_URL" ] && [ -z "$SCCACHE_DIST_AUTH_TOKEN" ]; then
          echo "::error::SCCACHE_DIST_AUTH_TOKEN is required when SCCACHE_DIST_SCHEDULER_URL is set."
          exit 1
        fi

        if [ -z "$SCCACHE_DIST_SCHEDULER_URL" ] && [ -n "$SCCACHE_DIST_AUTH_TOKEN" ]; then
          echo "::error::SCCACHE_DIST_SCHEDULER_URL is required when SCCACHE_DIST_AUTH_TOKEN is set."
          exit 1
        fi

        case "$SCCACHE_DIST_TOOLCHAIN_CACHE_SIZE" in
          ''|*[!0-9]*)
            echo "::error::dist-toolchain-cache-size must be a positive integer."
            exit 1
            ;;
        esac

        if [ "$SCCACHE_DIST_TOOLCHAIN_CACHE_SIZE" -le 0 ]; then
          echo "::error::dist-toolchain-cache-size must be greater than zero."
          exit 1
        fi

        redis_enabled=1
        if [ -z "$SCCACHE_REDIS_URL" ]; then
          if [ "$mode" = "required" ]; then
            echo "::error::SCCACHE_REDIS_URL is required for trusted Rust CI jobs when SCCACHE_REDIS_MODE=required."
            exit 1
          fi
          redis_enabled=0
        fi

        if [ "$redis_enabled" = "0" ] && [ "$gha_enabled" = "0" ] && [ -z "$SCCACHE_DIST_SCHEDULER_URL" ]; then
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "Skipping sccache because Redis is optional but unset and sccache-dist is not configured."
          exit 0
        fi

        if [ "$SCCACHE_VERIFY_BINARY" = "false" ]; then
          :
        elif ! command -v sccache >/dev/null 2>&1; then
          if [ "$mode" = "optional" ] && [ "$gha_enabled" = "0" ] && [ -z "$SCCACHE_DIST_SCHEDULER_URL" ]; then
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            echo "Skipping Redis-backed sccache because no sccache binary is available and SCCACHE_REDIS_MODE=optional."
            exit 0
          fi

          echo "::error::sccache is required on the runner when Redis-backed sccache or sccache-dist is configured."
          exit 1
        fi

        toml_escape() {
          printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
        }

        config_root="${RUNNER_TEMP:-/var/tmp}"
        mkdir -p -- "$config_root"
        sccache_config="$(mktemp "$config_root/lancache-sccache.XXXXXX")"
        : > "$sccache_config"
        if [ "$redis_enabled" = "1" ]; then
          printf '[cache.redis]\nurl = "%s"\n' "$(toml_escape "$SCCACHE_REDIS_URL")" > "$sccache_config"
        fi

        if [ "$gha_enabled" = "1" ]; then
          {
            printf '\n[cache.gha]\n'
            printf 'enabled = true\n'
            printf 'version = "%s"\n' "$(toml_escape "$SCCACHE_REDIS_KEY_PREFIX")"
            printf 'rw_mode = "READ_WRITE"\n'
          } >> "$sccache_config"
        fi

        if [ "$redis_enabled" = "1" ] && [ "$gha_enabled" = "1" ]; then
          {
            printf '\n[cache.multilevel]\n'
            printf 'chain = ["redis", "gha"]\n'
          } >> "$sccache_config"
        fi

        if [ "$EMIT_BUILDKIT_SECRETS" = "true" ]; then
          if [ "$gha_enabled" != "1" ]; then
            echo "::error::GitHub Actions cache runtime is required for BuildKit sccache secrets."
            exit 1
          fi
          url_file="${RUNNER_TEMP}/sccache-gha-url-${GITHUB_JOB:-rust}"
          token_file="${RUNNER_TEMP}/sccache-gha-token-${GITHUB_JOB:-rust}"
          umask 077
          printf '%s' "$ACTIONS_RESULTS_URL" > "$url_file"
          printf '%s' "$ACTIONS_RUNTIME_TOKEN" > "$token_file"
          {
            printf 'config-file=%s\n' "$sccache_config"
            printf 'url-file=%s\n' "$url_file"
            printf 'token-file=%s\n' "$token_file"
          } >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$SCCACHE_DIST_SCHEDULER_URL" ]; then
          {
            printf '\n[dist]\n'
            printf 'scheduler_url = "%s"\n' "$(toml_escape "$SCCACHE_DIST_SCHEDULER_URL")"
            printf 'toolchains = []\n'
            printf 'toolchain_cache_size = %s\n' "$SCCACHE_DIST_TOOLCHAIN_CACHE_SIZE"
            printf '\n[dist.auth]\n'
            printf 'type = "token"\n'
            printf 'token = "%s"\n' "$(toml_escape "$SCCACHE_DIST_AUTH_TOKEN")"
          } >> "$sccache_config"
        fi

        {
          echo "SCCACHE_REDIS_MODE=$mode"
          echo "LANCACHE_SCCACHE_CONF=$sccache_config"
          echo "RUSTC_WRAPPER=sccache"
          if [ "$redis_enabled" = "1" ]; then
            echo "SCCACHE_REDIS=$SCCACHE_REDIS_URL"
          fi
          echo "SCCACHE_REDIS_KEY_PREFIX=$SCCACHE_REDIS_KEY_PREFIX"
          echo "SCCACHE_CONF=$sccache_config"
          if [ "$gha_enabled" = "1" ]; then
            echo "SCCACHE_GHA_ENABLED=on"
          fi
          echo "SCCACHE_NO_DAEMON=1"
          echo "LANCACHE_SCCACHE_ENABLED=1"
        } >> "$GITHUB_ENV"

        export SCCACHE_CONF="$sccache_config"
        export SCCACHE_REDIS_KEY_PREFIX="$SCCACHE_REDIS_KEY_PREFIX"
        if [ "$redis_enabled" = "1" ]; then
          export SCCACHE_REDIS="$SCCACHE_REDIS_URL"
        fi

        if [ "$SCCACHE_VERIFY_BINARY" != "false" ]; then
          sccache --version
        fi
        if [ "$SCCACHE_VERIFY_BINARY" != "false" ] && [ -n "$SCCACHE_DIST_SCHEDULER_URL" ]; then
          sccache --dist-status
        fi
