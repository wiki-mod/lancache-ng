# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
name: Trivy scan with digest-bound result cache
description: >-
  Scans one exact image digest with an explicitly fresh Trivy vulnerability DB.
  A previous clean verdict may be reused only for the same digest, caller scope,
  caller freshness token, and internal six-hour vulnerability-DB epoch.
inputs:
  image-ref:
    description: Digest-qualified image reference to scan (e.g. ghcr.io/org/repo/service@sha256:...).
    required: true
  digest:
    description: The bare digest (sha256:...) of image-ref, used verbatim in the cache identity.
    required: true
  cache-key-scope:
    description: Caller-chosen scope prefix (e.g. service+platform) so unrelated matrix rows never share a clean verdict.
    required: true
  freshness-bucket:
    description: Caller freshness token. The action additionally limits clean-result reuse to one six-hour UTC DB epoch.
    required: true
  trivyignores:
    required: false
    default: .trivyignore.yaml
  skip-dirs:
    required: false
    default: /usr/local/rustup/toolchains
  vuln-db-cache-dir:
    description: Optional root for Trivy DB data. The action always appends a six-hour epoch so an older local DB cannot cross the freshness boundary.
    required: false
    default: ""
outputs:
  cache-hit:
    description: "true when the exact digest already has a clean result in the current six-hour DB epoch."
    value: ${{ steps.restore.outputs.cache-hit }}
  db-freshness-bucket:
    description: Six-hour UTC vulnerability-DB epoch used by this scan/result cache.
    value: ${{ steps.freshness.outputs.bucket }}
runs:
  using: composite
  steps:
    - name: Resolve six-hour Trivy freshness epoch and explicit DB path
      id: freshness
      shell: bash
      env:
        INPUT_DB_ROOT: ${{ inputs.vuln-db-cache-dir }}
        INPUT_DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        [[ "$INPUT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
          echo "::error::Trivy scan requires a valid sha256 digest, got '$INPUT_DIGEST'." >&2
          exit 1
        }
        hour="$(date -u +%H)"
        slot=$((10#$hour / 6 * 6))
        bucket="$(date -u +%Y-%m-%d)-$(printf '%02d' "$slot")"
        digest_key="${INPUT_DIGEST#sha256:}"
        if [[ -n "$INPUT_DB_ROOT" ]]; then
          db_root="${INPUT_DB_ROOT%/}"
        else
          db_root="${RUNNER_TEMP:?RUNNER_TEMP is required}/trivy-v2-db"
        fi
        db_dir="${db_root}/${bucket}"
        marker_dir="${RUNNER_TEMP:?RUNNER_TEMP is required}/trivy-scan-clean/${digest_key}/${bucket}"
        mkdir -p "$db_dir" "$marker_dir"
        printf 'bucket=%s\n' "$bucket" >> "$GITHUB_OUTPUT"
        printf 'db_dir=%s\n' "$db_dir" >> "$GITHUB_OUTPUT"
        printf 'marker_dir=%s\n' "$marker_dir" >> "$GITHUB_OUTPUT"

    - name: Restore digest-bound clean-scan marker
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.freshness.outputs.marker_dir }}
        key: trivy-scan-clean-${{ inputs.cache-key-scope }}-${{ inputs.digest }}-${{ inputs.freshness-bucket }}-${{ steps.freshness.outputs.bucket }}

    - name: Scan image with Trivy
      if: steps.restore.outputs.cache-hit != 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln,secret
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: true
        cache: "false"
        cache-dir: ${{ steps.freshness.outputs.db_dir }}
        timeout: 10m
        exit-code: "1"

    # Reaching this step proves the real Trivy invocation either ran and
    # passed, or the restore step already proved the same digest had passed in
    # this exact six-hour epoch. A failed scan never writes a clean marker.
    - name: Write clean-scan marker
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        MARKER_DIR: ${{ steps.freshness.outputs.marker_dir }}
        DB_BUCKET: ${{ steps.freshness.outputs.bucket }}
      run: |
        set -euo pipefail
        mkdir -p "$MARKER_DIR"
        {
          printf 'scanned_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'db_freshness_bucket=%s\n' "$DB_BUCKET"
        } > "$MARKER_DIR/result.env"

    - name: Save digest-bound clean-scan marker
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.freshness.outputs.marker_dir }}
        key: trivy-scan-clean-${{ inputs.cache-key-scope }}-${{ inputs.digest }}-${{ inputs.freshness-bucket }}-${{ steps.freshness.outputs.bucket }}
