
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: Cache scan results keyed by digest and bucket
# Why: Vulnerability verdicts time-depend; caller sets window
# From: Issue #1095
name: Trivy scan with digest-bound result cache
description: >-
  Scans an image with Trivy, but skips the scan entirely if the exact same
  digest was already confirmed clean within the caller-supplied freshness
  window.
inputs:
  image-ref:
    description: Digest-qualified image reference to scan (e.g. ghcr.io/org/repo/service@sha256:...).
    required: true
  digest:
    description: The bare digest (sha256:...) of image-ref, used verbatim in the cache key.
    required: true
  cache-key-scope:
    description: Caller-chosen scope prefix (e.g. service+platform) so unrelated matrix rows never collide on the same cache key even if a digest were ever reused.
    required: true
  freshness-bucket:
    description: Caller-computed freshness window token (e.g. a UTC date). Same digest + same bucket = scan skipped; a new bucket forces a real re-scan regardless of digest.
    required: true
  trivyignores:
    required: false
    default: .trivyignore.yaml
  skip-dirs:
    required: false
    default: /usr/local/rustup/toolchains
  vuln-db-cache-dir:
    description: Trivy's own vulnerability-database cache dir (a different concept from this action's scan-result cache above) -- passed through to trivy-action's cache-dir input unchanged.
    required: false
    default: ""
  vuln-db-skip-update:
    description: >-
      What: forwarded to trivy-scan-retry's own skip-db-update input.
      Why: set "true" once the caller's own trivy-db-ensure-fresh step has
        already refreshed vuln-db-cache-dir under its lock, so this scan
        never writes to the shared DB itself (Issue #912).
      From: Issue #1095
    required: false
    default: "false"
  registry-username:
    description: Registry username, forwarded to trivy-scan-retry for GHCR authentication and retry re-login.
    required: true
  registry-password:
    description: Registry password/token, forwarded to trivy-scan-retry for GHCR authentication and retry re-login.
    required: true
  dockerhub-username:
    description: >-
      Docker Hub username, forwarded to trivy-scan-retry for its optional
      third DB-source tier. Optional, default "" -- matches trivy-scan-retry's
      own optionality, this action does not add a hard dependency on top of it.
    required: false
    default: ""
  dockerhub-password:
    description: Docker Hub password/token, forwarded to trivy-scan-retry.
    required: false
    default: ""
outputs:
  cache-hit:
    description: "true if a clean-scan marker already existed for this digest+bucket (the Trivy scan below was skipped)."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # What: Restore clean-scan marker from prior run
    # Why: Key must match the save step exactly for hits
    # From: Issue #1095
    - name: Restore scan-result marker
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-scan-clean
        key: trivy-scan-clean-${{ inputs.cache-key-scope }}-${{ inputs.digest }}-${{ inputs.freshness-bucket }}

    # What: Scan with trivy-scan-retry, not trivy-action
    # Why: Default mirror lacked retry; caused CI failures
    # From: Issue #1535 | PR #1542
    - name: Scan image with Trivy
      if: steps.restore.outputs.cache-hit != 'true'
      uses: ./.github/actions/trivy-scan-retry
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
        dockerhub-username: ${{ inputs.dockerhub-username }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln,secret
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: true
        cache: "false"
        cache-dir: ${{ inputs.vuln-db-cache-dir }}
        skip-db-update: ${{ inputs.vuln-db-skip-update }}
        timeout: 10m
        exit-code: "1"

    # What: Write clean-scan marker after passing Trivy
    # Why: Failing scans never reach here; safe to cache
    # From: Issue #1095
    - name: Write scan-result marker
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ runner.temp }}/trivy-scan-clean"
        date -u +%Y-%m-%dT%H:%M:%SZ > "${{ runner.temp }}/trivy-scan-clean/scanned-at"

    # What: Save scan-result marker with restore key
    # Why: Key must match restore step to enable cache hits
    # From: Issue #1095
    - name: Save scan-result marker
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-scan-clean
        key: trivy-scan-clean-${{ inputs.cache-key-scope }}-${{ inputs.digest }}-${{ inputs.freshness-bucket }}
