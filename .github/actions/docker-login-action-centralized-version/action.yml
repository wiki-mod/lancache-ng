
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Centralized version -- docker/login-action
description: >-
  Single owner of the docker/login-action pin. Every caller that needs this
  action goes through here instead of repeating the ref, so a version bump
  is one edit, not N.

# What: Centralizes docker/login-action pinning.
# Why: Anchors unsupported; prevents duplicate version refs.
# From: Issue #1095 | PR #1665
inputs:
  registry:
    description: >-
      Registry to log in to. Left empty (the docker/login-action default)
      logs in to Docker Hub instead of a named registry.
    required: false
    default: ""
  username:
    required: true
  password:
    required: true
runs:
  using: composite
  steps:
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
