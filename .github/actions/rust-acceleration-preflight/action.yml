
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# GitHub Action for validating Rust build acceleration infrastructure (sccache, sccache-dist, distcc, and services/dns's ccache-over-distcc layer) configuration and connectivity
name: Rust acceleration infrastructure preflight
description: Validate Rust build acceleration infrastructure outside BuildKit cacheable Docker build layers.

inputs:
  service:
    description: Service name used for logs and sccache key prefix.
    required: true
  redis-file:
    description: Optional file containing the sccache Redis URL.
    required: false
    default: ""
  dist-config-file:
    description: Optional sccache-dist client configuration file.
    required: false
    default: ""
  distcc-hosts-file:
    description: Optional file containing DISTCC_POTENTIAL_HOSTS.
    required: false
    default: ""
  ccache-redis-file:
    description: |
      Optional file containing the ccache Redis remote-storage endpoint for
      services/dns/Dockerfile's ccache-over-distcc C-dependency cache only. Reuses the
      same Redis URL as redis-file -- see build-push.yml's own comment on why this is
      not a second secret.
    required: false
    default: ""
  build-tools-image:
    description: |
      Build tools image that provides rustc, sccache, distcc, distcc-pump, and ccache.
      Primary CI workflows (build-push.yml) pass an explicit pinned digest via
      scripts/untracked/select-build-tools-image.sh; this `:latest` default is a fallback
      for local developer usage and other callers that do not override it.
    required: false
    default: ghcr.io/wiki-mod/lancache-ng/build-tools:latest
  build-network:
    description: Docker network mode shared with the real Rust image builds.
    required: false
    default: bridge
  platform:
    description: Docker platform shared with the real Rust image builds.
    required: false
    default: linux/amd64

runs:
  using: composite
  steps:
    - name: Validate acceleration-infrastructure secrets
      shell: bash
      env:
        LANCACHE_SERVICE: ${{ inputs.service }}
        REDIS_FILE: ${{ inputs.redis-file }}
        DIST_CONFIG_FILE: ${{ inputs.dist-config-file }}
        DISTCC_HOSTS_FILE: ${{ inputs.distcc-hosts-file }}
        CCACHE_REDIS_FILE: ${{ inputs.ccache-redis-file }}
        BUILD_TOOLS_IMAGE: ${{ inputs.build-tools-image }}
        BUILD_NETWORK: ${{ inputs.build-network }}
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail

        # This preflight is intentionally inert when no acceleration secrets are present.
        # Fallback CI paths should continue without LAN-only acceleration.
        mount_args=()
        if [ -n "$REDIS_FILE" ]; then
          [ -s "$REDIS_FILE" ] || { echo "::error::redis-file input points to an empty or missing file."; exit 1; }
          mount_args+=(-v "$REDIS_FILE:/run/lancache/sccache-redis-url:ro")
        fi
        if [ -n "$DIST_CONFIG_FILE" ]; then
          [ -s "$DIST_CONFIG_FILE" ] || { echo "::error::dist-config-file input points to an empty or missing file."; exit 1; }
          mount_args+=(-v "$DIST_CONFIG_FILE:/run/lancache/sccache-dist-config:ro")
        fi
        if [ -n "$DISTCC_HOSTS_FILE" ]; then
          [ -s "$DISTCC_HOSTS_FILE" ] || { echo "::error::distcc-hosts-file input points to an empty or missing file."; exit 1; }
          mount_args+=(-v "$DISTCC_HOSTS_FILE:/run/lancache/distcc-potential-hosts:ro")
        fi
        if [ -n "$CCACHE_REDIS_FILE" ]; then
          [ -s "$CCACHE_REDIS_FILE" ] || { echo "::error::ccache-redis-file input points to an empty or missing file."; exit 1; }
          mount_args+=(-v "$CCACHE_REDIS_FILE:/run/lancache/ccache-redis-url:ro")
        fi

        if [ "${#mount_args[@]}" -eq 0 ]; then
          echo "[INFO] no Rust acceleration secrets configured; skipping external preflight."
          exit 0
        fi

        # What: pulls and runs the tools image outside BuildKit, via the shared retry wrapper.
        # Why: a BuildKit cache layer could mask an acceleration-infrastructure failure, and
        # this repeats per matrix leg -- optional credentials only add a relogin.
        # From: Issue #822 | PR #833
        # shellcheck source=scripts/lib/ghcr-retry.sh
        source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
        ghcr_retry ghcr.io "${GHCR_RETRY_USERNAME:-}" "${GHCR_RETRY_PASSWORD:-}" -- docker pull --platform "$BUILD_PLATFORM" "$BUILD_TOOLS_IMAGE" >/dev/null

        # AG-CI-016: the in-container command needs its own unignorable
        # kill-timeout, not just this step's outer `timeout-minutes` --
        # GitHub cancels a timed-out step by sending SIGTERM to this
        # `docker run` client, which a signal-deaf or network-hung sccache-dist/
        # distcc-pump call inside the container would not receive, leaving
        # both the client and the container running and the runner slot
        # occupied (same failure mode documented in
        # .github/actions/shellcheck-and-standing-guards/action.yml).
        # Verified live in the pinned build-tools container (AG-VAL-030):
        # `timeout --kill-after` only signals its DIRECT child (the `bash -s`
        # below), and if bash is itself blocked waiting on a hung grandchild
        # (e.g. a stuck sccache/distcc network call), the SIGKILL at the end
        # of the grace period kills bash without ever running its `trap
        # cleanup EXIT` (confirmed: a `trap ...EXIT; sleep 60` heredoc under
        # `timeout --kill-after=30 --signal=KILL 3` exits 137 with no trap
        # output). That is still safe here specifically because every
        # resource the trap would clean up (the mktemp -d preflight dir, the
        # distcc-pump include server) lives entirely inside this container
        # and is discarded when `docker run --rm` tears the container down
        # regardless of whether the trap ran -- there is no host-shared or
        # writable-mount state (mount_args above are all `:ro`) that could
        # leak past a missed trap.
        # 600s, not the 300s used for pure-text-scan checks elsewhere in this
        # project: this preflight makes real network calls (sccache-dist
        # --dist-status, distcc-pump --startup probing every candidate host
        # via lsdistcc) that can legitimately take longer than a text scan
        # under real network latency. The calling job (`build` in
        # build-push.yml) has its own timeout-minutes: 150 covering the full
        # Rust/Docker build that follows, so 600s here for this early step
        # leaves the overwhelming majority of that budget intact.
        docker run --rm -i --platform "$BUILD_PLATFORM" --network "$BUILD_NETWORK" \
          "${mount_args[@]}" \
          -e "LANCACHE_SERVICE=$LANCACHE_SERVICE" \
          "$BUILD_TOOLS_IMAGE" \
          timeout --kill-after=30 --signal=KILL 600 bash -s <<'PREFLIGHT'
            set -euo pipefail

            preflight_dir="$(mktemp -d)"
            # What: bounds distcc-pump --shutdown with its own short timeout.
            # Why: the call can block in do_wait() indefinitely; only the
            # outer 600s timeout guarded against that before. `|| true`
            # stays -- a failed shutdown must not fail the build.
            # From: Issue #1590
            shutdown_distcc_pump() {
              timeout --kill-after=5 --signal=KILL 10 distcc-pump --shutdown >/dev/null 2>&1 || true
            }
            cleanup() {
              if [ -n "${pump_started:-}" ]; then
                shutdown_distcc_pump
              fi
              rm -rf "$preflight_dir"
            }
            trap cleanup EXIT

            # What: fails closed if a log file contains a warning/error/failure/panic diagnostic.
            # Why: a silently-degraded acceleration tool must not pass as a clean preflight.
            # From: PR #441
            scan_log() {
              local log_file="$1"
              if grep -Eai "(^|[^[:alpha:]])(warning|warn|error|failed|failure|panic)([^[:alpha:]]|$)" "$log_file"; then
                echo "[ERROR] Rust acceleration preflight emitted a forbidden diagnostic." >&2
                exit 1
              fi
            }

            # What: like scan_log(), but first strips distcc's own per-host
            # "nonblocking connect to <host>:<port> failed" diagnostic --
            # and only when more than one host was configured.
            # Why: DISTCC_FALLBACK=0 (set below) means a total dispatch
            # failure already fails the `cc` invocation itself, landing in
            # the plain-cc-fallback branch instead of ever reaching this
            # function -- so reaching here with a successful compile
            # (host_count > 1) plus this exact diagnostic means one host
            # was down and another from the list picked up the job, not a
            # silent degradation scan_log() exists to catch. Confirmed live
            # (2026-08-21, job 96873255522, PR #1610): "distcc preflight
            # failed; using plain cc fallback." never appeared in that
            # job's log, i.e. `cc -c` itself returned 0, yet the job was
            # still killed by scan_log() matching only this one line. A
            # single-host list (host_count <= 1) still goes through the
            # original strict scan_log() unchanged -- there is no second
            # host to have picked up the job in that case.
            # From: Issue #1633
            scan_distcc_compile_log() {
              local log_file="$1"
              local host_count="$2"
              # What: anchored start-to-end (^...$), not just a prefix match.
              # Why: classifies each already-suspicious LINE as either fully
              # this one benign shape or not, rather than deleting a whole
              # line on a prefix match -- if a real diagnostic ever shared a
              # line with this one (unflushed/interleaved stdio), the
              # combined line would not fully match this anchored pattern
              # and still trips the fail-closed branch below, instead of
              # silently vanishing along with the benign prefix.
              # From: Issue #1633
              local benign_pattern='^distcc\[[0-9]+\] (ERROR|WARNING): nonblocking connect to [0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]+ failed: [A-Za-z0-9 ,.()'\''-]+$'

              if [ "$host_count" -le 1 ]; then
                scan_log "$log_file"
                return
              fi

              local suspicious_lines
              suspicious_lines="$(grep -Eai "(^|[^[:alpha:]])(warning|warn|error|failed|failure|panic)([^[:alpha:]]|$)" "$log_file" || true)"
              if [ -z "$suspicious_lines" ]; then
                return
              fi

              local non_benign_lines
              non_benign_lines="$(printf '%s\n' "$suspicious_lines" | grep -Ev "$benign_pattern" || true)"
              if [ -n "$non_benign_lines" ]; then
                printf '%s\n' "$non_benign_lines" >&2
                echo "[ERROR] Rust acceleration preflight emitted a forbidden diagnostic." >&2
                exit 1
              fi

              local tolerated_count
              tolerated_count="$(printf '%s\n' "$suspicious_lines" | grep -c . || true)"
              echo "[INFO] Tolerated $tolerated_count distcc per-host connectivity diagnostic(s) ($host_count hosts configured; every suspicious line fully matched the known benign shape, so the compile succeeded via a live host anyway)."
            }

            # What: runs a command, capturing its output to log_file, then feeds it through scan_log.
            # Why: every acceleration command run below needs the same fail-closed exit/log/scan
            # behavior; this avoids repeating it at each call site.
            # From: PR #441
            run_logged() {
              local log_file="$1"
              shift

              if ! "$@" >"$log_file" 2>&1; then
                cat "$log_file" >&2
                echo "[ERROR] Rust acceleration preflight command failed: $*" >&2
                exit 1
              fi
              scan_log "$log_file"
            }

            # What: fails closed unless `sccache --dist-status`'s JSON shows a connected scheduler.
            # Why: a misconfigured sccache-dist client can start up without ever reaching a scheduler.
            # From: PR #441
            require_sccache_dist_connected() {
              local status_file="$1"
              if ! jq -e 'type == "object" and has("SchedulerStatus")' "$status_file" >/dev/null; then
                echo "[ERROR] sccache-dist did not report a connected scheduler status." >&2
                cat "$status_file" >&2
                exit 1
              fi
            }

            # What: fails closed unless sccache's stats show the compile request, and (when
            # require_cache_write is set) a real Redis-backed cache write, read hit, and zero errors.
            # Why: a preflight compile that "succeeds" without touching the cache backend at all
            # would silently mask a broken Redis connection.
            # From: PR #441
            require_sccache_activity() {
              local stats_file="$1"
              local require_cache_write="$2"
              local count_cache_entries='
                def count_entries:
                  if type == "number" then .
                  elif type == "object" then ([.. | numbers] | add // 0)
                  else 0
                  end;
              '

              if ! jq -e '(.stats.compile_requests // 0) > 0' "$stats_file" >/dev/null; then
                echo "[ERROR] sccache did not record the Rust compile request." >&2
                cat "$stats_file" >&2
                exit 1
              fi

              if [ "$require_cache_write" = "1" ]; then
                if ! jq -e '(.stats.cache_writes // 0) > 0' "$stats_file" >/dev/null; then
                  echo "[ERROR] Redis-backed sccache did not record a cache write." >&2
                  cat "$stats_file" >&2
                  exit 1
                fi

                if ! jq -e "$count_cache_entries (.stats.cache_hits // {} | count_entries) > 0" "$stats_file" >/dev/null; then
                  echo "[ERROR] Redis-backed sccache did not record a cache read hit." >&2
                  cat "$stats_file" >&2
                  exit 1
                fi

                if ! jq -e '
                  (.stats.cache_read_errors // 0) == 0
                  and (.stats.cache_write_errors // 0) == 0
                  and (.stats.cache_timeouts // 0) == 0
                ' "$stats_file" >/dev/null; then
                  echo "[ERROR] Redis-backed sccache recorded cache read, write, or timeout errors." >&2
                  cat "$stats_file" >&2
                  exit 1
                fi

                if ! jq -e "$count_cache_entries (.stats.cache_errors // {} | count_entries) == 0" "$stats_file" >/dev/null; then
                  echo "[ERROR] Redis-backed sccache recorded cache backend errors." >&2
                  cat "$stats_file" >&2
                  exit 1
                fi
              fi
            }

            # What: fails closed unless sccache-dist's stats show zero dist_errors and at least
            # one successful distributed compile.
            # Why: a client that falls back to local compilation without erroring would otherwise
            # pass this preflight while never actually exercising the dist scheduler.
            # From: PR #441
            require_sccache_dist_activity() {
              local stats_file="$1"

              if ! jq -e '(.stats.dist_errors // 0) == 0' "$stats_file" >/dev/null; then
                echo "[ERROR] sccache-dist recorded distributed compile errors." >&2
                cat "$stats_file" >&2
                exit 1
              fi

              if ! jq -e '
                (.stats.dist_compiles // {}) as $dist
                | if ($dist | type) == "object" then
                    (($dist | to_entries | map(.value // 0) | add) // 0) > 0
                  else
                    (($dist | tonumber?) // 0) > 0
                  end
              ' "$stats_file" >/dev/null; then
                echo "[ERROR] sccache-dist did not record a successful distributed compile." >&2
                cat "$stats_file" >&2
                exit 1
              fi
            }

            if [ -s /run/lancache/sccache-redis-url ] || [ -s /run/lancache/sccache-dist-config ]; then
              export SCCACHE_NO_DAEMON=1
              export SCCACHE_SERVER_UDS="$preflight_dir/sccache.sock"
              export SCCACHE_REDIS_KEY_PREFIX="lancache-${LANCACHE_SERVICE}"
              require_cache_write=0
              require_dist_activity=0
              if [ -s /run/lancache/sccache-redis-url ]; then
                SCCACHE_REDIS="$(cat /run/lancache/sccache-redis-url)"
                export SCCACHE_REDIS
                require_cache_write=1
              fi
              if [ -s /run/lancache/sccache-dist-config ]; then
                export SCCACHE_CONF=/run/lancache/sccache-dist-config
                require_dist_activity=1
                dist_log="$preflight_dir/sccache-dist-status.log"
                run_logged "$dist_log" sccache --dist-status
                require_sccache_dist_connected "$dist_log"
              fi

              zero_stats_log="$preflight_dir/sccache-zero-stats.log"
              run_logged "$zero_stats_log" sccache --zero-stats
              mkdir -p "$preflight_dir/out"
              printf '%s\n' 'pub fn lancache_accel_preflight() -> u8 { 42 }' > "$preflight_dir/lib.rs"
              rust_log="$preflight_dir/sccache-rustc.log"
              run_logged "$rust_log" sccache rustc --crate-name lancache_accel_preflight --crate-type lib "$preflight_dir/lib.rs" --emit=link,dep-info --out-dir "$preflight_dir/out"
              run_logged "$rust_log" sccache rustc --crate-name lancache_accel_preflight --crate-type lib "$preflight_dir/lib.rs" --emit=link,dep-info --out-dir "$preflight_dir/out"
              stats_log="$preflight_dir/sccache-stats.log"
              run_logged "$stats_log" sccache --show-stats --stats-format=json
              require_sccache_activity "$stats_log" "$require_cache_write"
              if [ "$require_dist_activity" = "1" ]; then
                require_sccache_dist_activity "$stats_log"
              fi
              echo "[INFO] sccache preflight completed."
            fi

            if [ -s /run/lancache/distcc-potential-hosts ]; then
              # What: locates the cc/gcc/c++/g++ distcc wrapper directory.
              # Why: the two candidates are both valid, image-dependent
              # install layouts; an absent wrapper disables distcc for this
              # run instead of failing hard.
              # From: Issue #1590
              wrapper_dir=""
              for candidate in /usr/local/lib/distcc /usr/lib/distcc; do
                if [ -x "$candidate/cc" ] && [ -x "$candidate/gcc" ] && [ -x "$candidate/c++" ] && [ -x "$candidate/g++" ]; then
                  wrapper_dir="$candidate"
                  break
                fi
              done
              original_path="$PATH"
              distcc_enabled=1
              if [ -z "$wrapper_dir" ]; then
                echo "[INFO] distcc wrapper directory not found; skipping distcc preflight and using plain cc."
                distcc_enabled=0
              fi

              printf '%s\n' 'int main(void) { return 0; }' > "$preflight_dir/distcc-probe.c"

              # What: splits DISTCC_POTENTIAL_HOSTS into pump-capable vs
              # plain-distcc host lists.
              # Why: pump and plain distcc dispatch take different host list
              # shapes downstream; only a ,cpp-tagged host is pump-capable.
              # From: Issue #1590
              distcc_hosts=""
              distcc_pump_hosts=""
              distcc_hosts_without_pump=""
              distcc_pump_filtered_hosts=""
              for distcc_host_spec in $(cat /run/lancache/distcc-potential-hosts); do
                distcc_host_base="${distcc_host_spec%%,*}"
                if [ -n "$distcc_host_base" ]; then
                  distcc_hosts="${distcc_hosts:+$distcc_hosts }$distcc_host_base"
                fi
                case "$distcc_host_spec" in
                  # What: strips the ,cpp/,lzo suffix before feeding a pump candidate host to distcc-pump.
                  # Why: distcc-pump's own lsdistcc probe does a literal hostname lookup per token and
                  # fails gethostbyname() on the suffixed form; it re-derives and re-appends that suffix
                  # itself for whichever hosts it confirms alive.
                  # From: PR #613
                  *,cpp*) distcc_pump_hosts="${distcc_pump_hosts:+$distcc_pump_hosts }$distcc_host_base" ;;
                  *) distcc_hosts_without_pump="${distcc_hosts_without_pump:+$distcc_hosts_without_pump }$distcc_host_spec" ;;
                esac
              done
              if [ -z "$distcc_hosts" ]; then
                echo "[INFO] DISTCC_POTENTIAL_HOSTS did not resolve to usable remote hosts; falling back to 127.0.0.1."
                distcc_hosts="127.0.0.1"
              fi
              distcc_hosts_without_pump="${distcc_hosts_without_pump:-$distcc_hosts}"

              # What: checks for a real host token after distcc-pump's leading
              # "--randomize" option, not just a non-empty DISTCC_HOSTS.
              # Why: distcc-pump exports that option token even with zero live hosts found.
              # From: PR #613
              distcc_pump_published_hosts() {
                for distcc_host_token in $1; do
                  case "$distcc_host_token" in
                    --*) ;;
                    *) return 0 ;;
                  esac
                done
                return 1
              }

              if [ "$distcc_enabled" = "1" ]; then
                export PATH="$wrapper_dir:$PATH"
                export DISTCC_FALLBACK=0

                if [ -n "$distcc_pump_hosts" ]; then
                  export DISTCC_POTENTIAL_HOSTS="$distcc_pump_hosts"
                  unset DISTCC_HOSTS
                  pump_env="$(distcc-pump --startup)"
                  eval "$pump_env"
                  distcc_pump_filtered_hosts="${DISTCC_HOSTS:-}"
                  PATH="$wrapper_dir:$PATH"
                  export PATH
                  if distcc_pump_published_hosts "$distcc_pump_filtered_hosts"; then
                    pump_started=1
                    pump_log="$preflight_dir/distcc-pump.log"
                    if cc -c "$preflight_dir/distcc-probe.c" -o "$preflight_dir/distcc-pump.o" >"$pump_log" 2>&1; then
                      scan_log "$pump_log"
                    else
                      cat "$pump_log" >&2
                      echo "[INFO] distcc-pump probe did not complete; continuing with plain distcc fallback."
                      unset pump_started
                    fi
                  else
                    echo "[INFO] distcc-pump did not publish usable hosts (lsdistcc found none of the candidate hosts alive); continuing with plain distcc fallback."
                    distcc_pump_filtered_hosts=""
                  fi
                  shutdown_distcc_pump
                  unset pump_started INCLUDE_SERVER_PORT INCLUDE_SERVER_PID DISTCC_POTENTIAL_HOSTS DISTCC_HOSTS
                fi

                # What: uses distcc_hosts_without_pump, not the pump-published host list.
                # Why: the pump list's ",cpp"/",lzo" suffix only means anything to a running
                # include server, which this post-shutdown probe no longer has.
                # From: PR #613
                final_distcc_hosts="$distcc_hosts_without_pump"
                if [ -z "$final_distcc_hosts" ]; then
                  final_distcc_hosts="$distcc_hosts"
                fi
                if [ -z "$final_distcc_hosts" ]; then
                  echo "[INFO] distcc host list unavailable after pump handling; skipping distcc preflight and using plain cc."
                  distcc_enabled=0
                fi
              fi

              if [ "$distcc_enabled" = "1" ]; then
                export DISTCC_HOSTS="$final_distcc_hosts"
                distcc_log="$preflight_dir/distcc.log"
                # What: word-splits the space-separated final_distcc_hosts
                # to count configured hosts, deliberately unquoted. A bare
                # assignment, not `if ! x=$(...)` (this file's usual guard
                # for a substitution that can fail under `set -e`): `set --`
                # and `echo` cannot themselves fail, unlike the gh/jq/curl
                # calls that convention exists for.
                # Why: scan_distcc_compile_log() only tolerates a per-host
                # connectivity diagnostic when real redundancy existed.
                # From: Issue #1633
                # shellcheck disable=SC2086
                final_distcc_host_count=$(set -- $final_distcc_hosts; echo "$#")
                if cc -c "$preflight_dir/distcc-probe.c" -o "$preflight_dir/distcc.o" >"$distcc_log" 2>&1; then
                  scan_distcc_compile_log "$distcc_log" "$final_distcc_host_count"
                  echo "[INFO] distcc preflight completed."
                else
                  cat "$distcc_log" >&2
                  echo "[INFO] distcc preflight failed; using plain cc fallback."
                  export PATH="$original_path"
                  unset DISTCC_HOSTS DISTCC_FALLBACK
                  plain_log="$preflight_dir/plain-cc.log"
                  run_logged "$plain_log" cc -c "$preflight_dir/distcc-probe.c" -o "$preflight_dir/distcc.o"
                  echo "[INFO] plain cc fallback completed."
                fi
              else
                export PATH="$original_path"
                unset DISTCC_HOSTS DISTCC_FALLBACK
                plain_log="$preflight_dir/plain-cc.log"
                run_logged "$plain_log" cc -c "$preflight_dir/distcc-probe.c" -o "$preflight_dir/distcc.o"
                echo "[INFO] plain cc fallback completed."
              fi

              # What: validates ccache-over-distcc (services/dns only) with a real Redis
              # write, then a real Redis read from a deliberately fresh local
              # CCACHE_DIR, mirroring the sccache validation above.
              # Why: only meaningful once real distcc dispatch above succeeded, and a
              # fresh CCACHE_DIR proves the Redis round trip instead of passing on
              # local-disk-only caching alone.
              # From: Issue #887
              if [ -s /run/lancache/ccache-redis-url ] && [ "$distcc_enabled" = "1" ] && [ -n "${DISTCC_HOSTS:-}" ]; then
                real_cc="$(PATH="$original_path" command -v cc)"
                ccache_redis_endpoint="$(cat /run/lancache/ccache-redis-url)"
                # What: normalizes a schemeless ccache_redis_endpoint to redis://.
                # Why: ccache rejects a bare host:port outright, and this must accept
                # the same configurations services/dns/Dockerfile's own normalization
                # already accepts.
                # From: Issue #887
                case "$ccache_redis_endpoint" in
                  redis://*|redis+unix:*) ;;
                  *) ccache_redis_endpoint="redis://$ccache_redis_endpoint" ;;
                esac
                export CCACHE_REMOTE_STORAGE="$ccache_redis_endpoint"
                export CCACHE_PREFIX=distcc
                export CCACHE_COMPILERCHECK=content
                # What: pins CCACHE_BASEDIR to this probe's own directory, and compiles
                # using a relative filename from inside it (both below).
                # Why: ccache's default hash_dir behavior folds the compile's absolute
                # source path and CWD into the remote cache key; preflight_dir is a fresh
                # mktemp path every run, so without this every CI run would leak a
                # brand-new, never-reused Redis entry with no TTL. Verified empirically
                # (2026-08-14, real Redis on lancache-240): CCACHE_BASEDIR alone, with an
                # absolute compile argument, still produced a remote miss on a second run
                # from a different mktemp dir; combining it with `cd` into that dir and a
                # relative filename produced a genuine remote_storage_hit from the first
                # run's entry.
                # From: Issue #887
                export CCACHE_BASEDIR="$preflight_dir"
                printf '%s\n' 'int main(void) { return 0; }' > "$preflight_dir/ccache-probe.c"
                cd "$preflight_dir"

                ccache_dir_cold="$preflight_dir/ccache-dir-cold"
                mkdir -p "$ccache_dir_cold"
                CCACHE_DIR="$ccache_dir_cold" ccache --zero-stats >/dev/null
                cold_log="$preflight_dir/ccache-cold.log"
                run_logged "$cold_log" env CCACHE_DIR="$ccache_dir_cold" ccache "$real_cc" -c ccache-probe.c -o ccache-cold.o
                cold_stats="$preflight_dir/ccache-cold-stats.log"
                CCACHE_DIR="$ccache_dir_cold" ccache --print-stats > "$cold_stats"
                if ! grep -qE '^remote_storage_write[[:space:]]+[1-9]' "$cold_stats"; then
                  echo "[ERROR] ccache did not record a Redis remote-storage write on the cold compile." >&2
                  cat "$cold_stats" >&2
                  exit 1
                fi

                ccache_dir_warm="$preflight_dir/ccache-dir-warm"
                mkdir -p "$ccache_dir_warm"
                CCACHE_DIR="$ccache_dir_warm" ccache --zero-stats >/dev/null
                warm_log="$preflight_dir/ccache-warm.log"
                run_logged "$warm_log" env CCACHE_DIR="$ccache_dir_warm" ccache "$real_cc" -c ccache-probe.c -o ccache-warm.o
                warm_stats="$preflight_dir/ccache-warm-stats.log"
                CCACHE_DIR="$ccache_dir_warm" ccache --print-stats > "$warm_stats"
                if ! grep -qE '^remote_storage_hit[[:space:]]+[1-9]' "$warm_stats"; then
                  echo "[ERROR] ccache did not record a Redis remote-storage read hit from a fresh local CCACHE_DIR -- the Redis round trip is not proven, only local-disk caching (if any)." >&2
                  cat "$warm_stats" >&2
                  exit 1
                fi
                if grep -qE '^remote_storage_error[[:space:]]+[1-9]' "$cold_stats" "$warm_stats"; then
                  echo "[ERROR] ccache recorded a Redis remote-storage error." >&2
                  cat "$cold_stats" "$warm_stats" >&2
                  exit 1
                fi

                unset CCACHE_REMOTE_STORAGE CCACHE_PREFIX CCACHE_COMPILERCHECK
                echo "[INFO] ccache-over-distcc preflight completed (real Redis write + read confirmed)."
              elif [ -s /run/lancache/ccache-redis-url ]; then
                echo "[INFO] ccache-redis-file was provided but real distcc dispatch did not succeed above; skipping ccache preflight (nothing real to prefix)."
              fi
            fi
        PREFLIGHT
