# SPDX-License-Identifier: AGPL-3.0-or-later
name: Smoke-test build-tools candidate
description: Runs the build-tools executable checks against the candidate image.

inputs:
  image-ref:
    description: Candidate image reference. May be a local PR-only image or an immutable repository@sha256 digest.
    required: true
  platform:
    description: Docker platform used to execute the candidate.
    required: true
runs:
  using: composite
  steps:
    - name: Smoke-test acceleration-infrastructure tools
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        : "${IMAGE_REF:?image-ref is required}"
        : "${PLATFORM:?platform is required}"
        mapfile -t required_tool_list < <(
          bash scripts/tracked/check-build-tools-smoke-coverage.sh --print-required-tools
        )
        required_tools="${required_tool_list[*]}"
        : "${required_tools:?canonical build-tools inventory is empty}"

        # What: Runs timeout in candidate container over tool checks.
        # Why: Prevents signal-deaf tool from wedging runner slot.
        # From: Issue #1522 | PR #1523
        docker run --rm --platform "$PLATFORM" \
          -e "REQUIRED_TOOLS=$required_tools" \
          "$IMAGE_REF" \
          timeout --kill-after=30s --signal=TERM 14m bash -c '
        set -euo pipefail
        read -r -a required_tools <<< "${REQUIRED_TOOLS:?canonical build-tools inventory is required}"
        for tool in "${required_tools[@]}"; do command -v "$tool" >/dev/null; done
        cargo --version
        cargo audit --version
        cargo-audit --version
        ccache --version
        sccache --version
        actionlint --version
        bats --version
        parallel --version
        shellspec --version
        shellcheck --version
        distcc --version
        distcc-pump --help >/dev/null
        target_triplet="$(gcc -dumpmachine)"
        case "$target_triplet" in ""|unknown*|*-unknown-*) exit 1 ;; esac
        musl_target_compiler="${target_triplet}-gcc"
        command -v "$musl_target_compiler" >/dev/null
        "$musl_target_compiler" --version >/dev/null
        docker --version
        docker compose version
        docker buildx version
        '
