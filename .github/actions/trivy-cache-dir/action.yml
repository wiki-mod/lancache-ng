
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Resolve shared Trivy vulnerability-DB cache directory
description: >-
  Resolves one shared, persistent Trivy DB cache directory for every
  self-hosted scan job: the NFS-backed share when it is really mounted and
  writable, otherwise a real local-disk fallback -- never the per-run
  ephemeral directories this replaces, and never tmpfs/OS-default /tmp.

# What: replaces the "Prepare candidate/pushed Trivy cache" steps that
#   derived a fresh, empty directory per ref/run for pull_request,
#   workflow_dispatch, and retried runs.
# Why: an always-empty directory defeats Trivy's own DB-freshness check
#   (metadata.json's NextUpdate), forcing a full ~1.3 GB re-download on
#   every single one of those runs. This action instead returns a
#   directory that is genuinely persistent, so that freshness check can
#   finally do its job. Race-safety against Issue #912 (concurrent writers
#   corrupting Trivy's BoltDB) is NOT this action's job -- it only ever
#   resolves and read/write-probes a path. The caller must run
#   trivy-db-ensure-fresh (lock-guarded) before treating this directory as
#   safe to scan against with skip-db-update.
# From: Issue #1095 | Issue #912 | PR #927

inputs: {}
outputs:
  dir:
    description: The resolved, real, writable cache directory to pass as Trivy's cache-dir.
    value: ${{ steps.resolve.outputs.dir }}
  source:
    description: "'nfs-shared' or 'local-fallback' -- which path was actually used, for logging/diagnostics."
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: composite
  steps:
    - name: Probe shared Trivy DB mount, fall back to real local disk
      id: resolve
      shell: bash
      env:
        # What: overridable via workflow/job env for testing; defaults
        #   match the real runner-hosting NFS layout.
        # Why: a hardcoded path with no override would make the fallback
        #   path itself untestable without physically unmounting NFS.
        # From: Issue #1095
        PRIMARY_DIR: ${{ env.TRIVY_SHARED_CACHE_DIR || '/mnt/trivy-db' }}
        FALLBACK_DIR: ${{ env.TRIVY_FALLBACK_CACHE_DIR || '/var/tmp/lancache-ng-trivy-cache-fallback' }}
      run: |
        set -euo pipefail

        # What: writes and reads back a uniquely-named probe file AND a
        #   probe subdirectory with a file inside it, then removes both.
        # Why: a directory merely "existing" proves nothing -- a stale or
        #   half-dead NFS mount (server down, export revoked) can still
        #   list as a directory while every real I/O hangs or fails. The
        #   subdirectory half of this probe is not redundant: a real
        #   incident during this action's own development found a shared
        #   directory where flat-file writes at the root succeeded but
        #   `mkdir` for a NEW subdirectory (which is exactly what Trivy
        #   itself does on first use -- it creates fanal/, policy/, and
        #   java-db/ under cache-dir alongside db/) failed with EACCES,
        #   which a flat-file-only probe would have missed entirely,
        #   passing this action while every real scan then crashed.
        # From: Issue #1095 | Issue #912
        probe_writable() {
          local dir="$1"
          local probe="$dir/.trivy-cache-dir-write-probe.$$.${RANDOM}"
          local subdir="$dir/.trivy-cache-dir-write-probe-dir.$$.${RANDOM}"
          [ -d "$dir" ] || return 1
          ( set -e
            printf 'probe' > "$probe"
            [ "$(cat "$probe")" = "probe" ]
            rm -f "$probe"
            mkdir "$subdir"
            printf 'probe' > "$subdir/probe"
            [ "$(cat "$subdir/probe")" = "probe" ]
            rm -rf "$subdir"
          ) 2>/dev/null
        }

        if probe_writable "$PRIMARY_DIR"; then
          echo "::notice::Using shared NFS-backed Trivy DB cache at '$PRIMARY_DIR'."
          echo "dir=$PRIMARY_DIR" >> "$GITHUB_OUTPUT"
          echo "source=nfs-shared" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # What: loud, explicit warning -- never a silent degrade.
        # Why: AG-INT-002 -- a real capability loss (no shared DB across
        #   runners, back to per-host downloads) must be visible in the
        #   job log, not swallowed.
        # From: Issue #1095
        echo "::warning::Shared Trivy DB cache '$PRIMARY_DIR' is not mounted or not writable (NFS server unreachable, export revoked, or genuinely absent). Falling back to a real local-disk directory on THIS runner host only -- never tmpfs/OS-default /tmp, since that was the actual cause of a prior 'no space left on device' outage. This runner will not share the DB with any other runner host until the mount recovers."

        mkdir -p "$FALLBACK_DIR" || {
          echo "::error::Could not create local fallback Trivy cache dir '$FALLBACK_DIR' on real disk either -- refusing to fall through to tmpfs/OS-default /tmp."
          exit 1
        }

        if ! probe_writable "$FALLBACK_DIR"; then
          echo "::error::Local fallback Trivy cache dir '$FALLBACK_DIR' exists but failed a real write+read+delete test -- refusing to proceed onto ephemeral/tmp storage."
          exit 1
        fi

        echo "dir=$FALLBACK_DIR" >> "$GITHUB_OUTPUT"
        echo "source=local-fallback" >> "$GITHUB_OUTPUT"
