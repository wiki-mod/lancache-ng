
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# GitHub Action for cargo invocation with automatic sccache-fallback retry on failure or timeout
name: Run cargo with sccache fallback
description: Run one cargo command and retry without sccache if the cache wrapper fails, so CI still completes without LAN-only acceleration.

inputs:
  command:
    description: Cargo command to run.
    required: true
  sccache-timeout-seconds:
    description: Maximum runtime for the sccache-backed cargo attempt.
    required: false
    default: "120"
  fallback-timeout-seconds:
    description: Maximum runtime for the fallback cargo attempt without sccache.
    required: false
    default: "1800"
  container-image:
    description: Run the cargo command in the selected build-tools image.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run cargo command
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        SCCACHE_TIMEOUT_SECONDS: ${{ inputs.sccache-timeout-seconds }}
        FALLBACK_TIMEOUT_SECONDS: ${{ inputs.fallback-timeout-seconds }}
        CONTAINER_IMAGE: ${{ inputs.container-image }}
      run: |
        set -euo pipefail

        sccache_enabled="${LANCACHE_SCCACHE_ENABLED:-0}"
        sccache_mode="${SCCACHE_REDIS_MODE:-required}"

        case "$sccache_mode" in
          required|optional|off)
            ;;
          *)
            echo "::error::SCCACHE_REDIS_MODE must be one of: required, optional, off."
            exit 1
            ;;
        esac

        if [ "$sccache_enabled" != "1" ]; then
          # Fallback must leave Cargo runnable without any LAN-only acceleration.
          unset RUSTC_WRAPPER SCCACHE_REDIS SCCACHE_REDIS_KEY_PREFIX SCCACHE_CONF SCCACHE_NO_DAEMON
        fi

        run_command() {
          local use_sccache="$1"
          if [ -z "$CONTAINER_IMAGE" ]; then
            bash -euo pipefail -c "$COMMAND"
            return
          fi

          local cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p -- "$cargo_home"
          local -a docker_args=(
            run --rm
            --user "$(id -u):$(id -g)"
            -v "$GITHUB_WORKSPACE:/workspace"
            -w /workspace
            -e HOME=/var/tmp
            -e CARGO_HOME=/var/tmp/cargo-home
            -v "$cargo_home:/var/tmp/cargo-home"
          )
          if [ "$use_sccache" = "1" ]; then
            docker_args+=(
              -e RUSTC_WRAPPER=sccache
              -e SCCACHE_NO_DAEMON=1
              -e SCCACHE_GHA_ENABLED
              -e ACTIONS_RESULTS_URL
              -e ACTIONS_RUNTIME_TOKEN
              -e SCCACHE_REDIS_MODE
              -e SCCACHE_REDIS_KEY_PREFIX
            )
            if [ -n "${SCCACHE_CONF:-}" ]; then
              docker_args+=(
                --mount "type=bind,src=${SCCACHE_CONF},dst=/run/lancache/sccache.conf,readonly"
                -e SCCACHE_CONF=/run/lancache/sccache.conf
              )
            fi
          fi
          docker_args+=("$CONTAINER_IMAGE" bash -euo pipefail -c "$COMMAND")
          docker "${docker_args[@]}"
        }

        validate_positive_integer() {
          local name="$1"
          local value="$2"

          case "$value" in
            ''|*[!0-9]*)
              echo "::error::$name must be a positive integer."
              exit 1
              ;;
          esac

          if [ "$value" -le 0 ]; then
            echo "::error::$name must be greater than zero."
            exit 1
          fi
        }

        if [ -z "${CARGO_BUILD_JOBS:-}" ]; then
          detected_cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
          cargo_jobs=$((detected_cores - 2))
          if [ "$cargo_jobs" -lt 4 ]; then
            cargo_jobs=4
          fi
          export CARGO_BUILD_JOBS="$cargo_jobs"
          echo "::notice::Using CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS} from ${detected_cores} detected cores."
        else
          validate_positive_integer "CARGO_BUILD_JOBS" "$CARGO_BUILD_JOBS"
          echo "::notice::Using CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS} from workflow environment."
        fi

        validate_timeout() {
          local name="$1"
          local value="$2"

          validate_positive_integer "$name" "$value"
        }

        validate_timeout "sccache-timeout-seconds" "$SCCACHE_TIMEOUT_SECONDS"
        validate_timeout "fallback-timeout-seconds" "$FALLBACK_TIMEOUT_SECONDS"

        if [ "$sccache_enabled" != "1" ]; then
          SCCACHE_TIMEOUT_SECONDS="$FALLBACK_TIMEOUT_SECONDS"
        fi

        run_with_log() {
          local output_file="$1"
          local timeout_seconds="$2"
          local use_sccache="$3"
          local status

          set +e
          timeout --kill-after=30s "${timeout_seconds}s" bash -c "$(declare -f run_command); run_command '$use_sccache'" 2>&1 | tee "$output_file"
          status="${PIPESTATUS[0]}"
          set -e

          return "$status"
        }

        is_sccache_failure() {
          local status="$1"
          local output_file="$2"

          if [ "$status" -eq 124 ]; then
            return 0
          fi

          # "sccache: Job failed on server ..." covers sccache-dist remote-build
          # failures (e.g. a dist server's sandbox rejecting the build, as seen
          # with a bwrap mount-namespace error on one compile-farm host) that
          # cc-rs surfaces as a generic ToolExecError/exit-254 with no other
          # sccache-recognizable string, and which the prior pattern missed
          # entirely (issue #783: 4 identical failures on one PR never
          # triggered this fallback because none of them matched).
          grep -Eqi 'sccache: error|Fixed token mismatch|Timed out waiting for server startup|SCCACHE_|sccache: Job failed on server' "$output_file"
        }

        log_root="${RUNNER_TEMP:-/var/tmp}"
        mkdir -p -- "$log_root"
        output_file="$(mktemp "$log_root/lancache-cargo-sccache.XXXXXX")"

        # Capture the real exit status in the else branch — under `set -e`, a bare
        # failing command would abort the script immediately, and `$?` after an
        # `if` with no matching `else` is defined by POSIX as the `if` construct's
        # own exit status (0 when no branch ran), not the tested command's status.
        if run_with_log "$output_file" "$SCCACHE_TIMEOUT_SECONDS" 1; then
          status=0
        else
          status="$?"
        fi

        if [ "$status" -eq 0 ]; then
          exit 0
        fi

        if [ "$sccache_enabled" != "1" ] || ! is_sccache_failure "$status" "$output_file"; then
          exit "$status"
        fi

        if [ "$sccache_mode" = "required" ]; then
          echo "::error::Cargo command failed because required sccache acceleration failed; local fallback is disabled."
          exit "$status"
        fi

        echo "::warning::Cargo command failed because optional sccache acceleration failed or timed out; retrying once without RUSTC_WRAPPER."
        unset RUSTC_WRAPPER SCCACHE_REDIS SCCACHE_REDIS_KEY_PREFIX SCCACHE_CONF SCCACHE_NO_DAEMON

        fallback_output="$(mktemp "$log_root/lancache-cargo-fallback.XXXXXX")"
        run_with_log "$fallback_output" "$FALLBACK_TIMEOUT_SECONDS" 0
