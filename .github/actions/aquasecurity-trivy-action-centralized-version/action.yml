
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Centralized version -- aquasecurity/trivy-action
description: >-
  Single owner of the aquasecurity/trivy-action pin. Every caller that
  needs this action goes through here instead of repeating the ref, so a
  version bump is one edit, not N.

# What: exists because a YAML anchor/alias cannot serve this role.
# Why: GitHub's composite-action manifest parser rejects anchors/aliases
#   outright ("Anchors are not currently supported"); a local
#   `uses: ./...` reference has no such restriction.
# From: Issue #1095 | PR #1665
inputs:
  scan-type:
    required: false
    default: ""
  image-ref:
    required: false
    default: ""
  format:
    required: false
    default: ""
  output:
    required: false
    default: ""
  scanners:
    required: false
    default: ""
  severity:
    required: false
    default: ""
  ignore-unfixed:
    required: false
    default: ""
  trivyignores:
    required: false
    default: ""
  skip-dirs:
    required: false
    default: ""
  hide-progress:
    required: false
    default: ""
  cache:
    required: false
    default: ""
  cache-dir:
    required: false
    default: ""
  timeout:
    required: false
    default: ""
  exit-code:
    required: false
    default: ""
  trivy-config:
    description: >-
      Absolute path to a trivy-config.yaml. Must be computed by the caller
      as its own github dot action_path joined with trivy-config.yaml --
      this wrapper's own action_path would resolve to its own directory,
      not the caller's, so it cannot compute this path itself. (Written
      without GitHub Actions expression syntax on purpose: this field's
      template gets evaluated even as plain documentation prose.)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # What: forces the underlying trivy binary's scratch/temp directory
    # (its image-export work, in particular) onto real runner disk instead
    # of its Go-toolchain default of os.TempDir(), which resolves to /tmp.
    # Why: confirmed live and root-caused on the self-hosted fleet (issue
    # #1671, 2026-08-29): this project's own runners mount /tmp as a
    # RAM-backed tmpfs sized far below the images this Dockerfile now
    # produces (2.0-2.8 GiB tmpfs vs. 62-65 GiB free on the real root
    # filesystem) -- a real "Scan pushed amd64 build-tools digest with
    # Trivy" failure hit exactly this: `write
    # /tmp/trivy-<pid>/docker-export-<n>: no space left on device`, despite
    # the host's actual disk having tens of gigabytes free throughout. This
    # is a distinct bug from the Trivy vulnerability-DB cache-dir sizing
    # work tracked separately under issue #1095 (trivy-cache-dir/
    # trivy-db-ensure-fresh): that work targets the DB cache directory this
    # action already receives as `cache-dir` (already real-disk,
    # `/var/tmp/lancache-ng-trivy-cache/...`); this fixes trivy's own
    # separate, unconfigurable image-export scratch directory, which never
    # goes through cache-dir at all. /var/tmp is this repo's own existing
    # convention for Trivy's real-disk scratch space (see cache-dir above)
    # and is safe for concurrent scans: trivy names its own scratch
    # subdirectory uniquely per invocation.
    # From: Issue #1095 | Issue #1671
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TMPDIR: /var/tmp
      with:
        scan-type: ${{ inputs.scan-type }}
        image-ref: ${{ inputs.image-ref }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        scanners: ${{ inputs.scanners }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        trivyignores: ${{ inputs.trivyignores }}
        skip-dirs: ${{ inputs.skip-dirs }}
        hide-progress: ${{ inputs.hide-progress }}
        cache: ${{ inputs.cache }}
        cache-dir: ${{ inputs.cache-dir }}
        timeout: ${{ inputs.timeout }}
        exit-code: ${{ inputs.exit-code }}
        trivy-config: ${{ inputs.trivy-config }}
