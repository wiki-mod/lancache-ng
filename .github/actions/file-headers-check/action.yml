
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: File header / workflow size / review-chronology / dependabot-docker-base / trivy-action-direct-usage / short-sha-truncation checks
description: >-
  The six repository-hygiene checks shared by the self-hosted and
  GitHub-hosted file-header jobs. Keeping the steps in one composite action
  prevents the fallback path from silently enforcing a smaller policy set.
inputs:
  build-tools-image:
    description: Immutable build-tools image selected by the calling workflow
    required: true
runs:
  using: composite
  steps:
    - name: Check repository header on all tracked files
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-file-headers.sh

    # What: runs scripts/check-workflow-line-limit.sh in the build-tools container.
    # Why: enforces AG-CI-021's whole-file and per-run:-block ceilings.
    # From: Issue #1095 | Issue #1535
    - name: Check workflow files stay under the line/byte/run-block ceilings
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-workflow-line-limit.sh

    # See scripts/check-review-chronology-comments.sh's own header comment
    # for the exact sub-pattern this targets and why.
    - name: Check for review-chronology comments (AG-CODE-003)
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-review-chronology-comments.sh

    # See scripts/check-dependabot-docker-base-consistency.sh's own header
    # for the shared-base-image assumption this guards.
    - name: Check dependabot.yml's docker-group base-image assumption still holds
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-dependabot-docker-base-consistency.sh

    # See scripts/check-trivy-action-direct-usage.sh's own header for why a
    # direct call site regresses issue #1535's retry/auth/mirror fix
    # (AG-VAL-029: a point fix alone is not sufficient).
    - name: Check no direct aquasecurity/trivy-action call sites outside the retry wrapper
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-trivy-action-direct-usage.sh

    # See scripts/check-short-sha-truncation.sh's own header comment for the
    # full list of prior real instances (issue #1095 G2) this guard exists
    # to prevent a recurrence of.
    - name: Check for hardcoded short-SHA truncation lengths (issue #1095 G2)
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-short-sha-truncation.sh
