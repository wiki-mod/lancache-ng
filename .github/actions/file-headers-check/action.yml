name: File header / workflow size / review-chronology / dependabot-docker-base checks
description: >-
  The four repository-hygiene checks shared by the self-hosted and
  GitHub-hosted file-header jobs. Keeping the steps in one composite action
  prevents the fallback path from silently enforcing a smaller policy set.
inputs:
  build-tools-image:
    description: Immutable build-tools image selected by the calling workflow
    required: true
runs:
  using: composite
  steps:
    - name: Check repository header on all tracked files
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-file-headers.sh

    # The script's header documents why GitHub's workflow-size ceiling must
    # be checked before an oversized workflow silently loses its triggers.
    - name: Check workflow files stay under the hard line-count ceiling
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-workflow-line-limit.sh

    # See scripts/untracked/check-review-chronology-comments.sh's own header comment
    # for the exact sub-pattern this targets and why.
    - name: Check for review-chronology comments (AG-CODE-003)
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-review-chronology-comments.sh

    # See scripts/check-dependabot-docker-base-consistency.sh's own header
    # for the shared-base-image assumption this guards.
    - name: Check dependabot.yml's docker-group base-image assumption still holds
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/check-dependabot-docker-base-consistency.sh
