# lancache-ng (https://github.com/wiki-mod/lancache-ng)
name: File header / workflow size / review-chronology / dependabot-docker-base checks
description: >-
  The four plain bash/grep/awk checks build-push.yml's self-hosted
  `file-headers` job runs. Extracted (issue #1095 duplication finding) after
  finding that `file-headers-hosted`, the GitHub-hosted fallback for when
  self-hosted runners are down, only ever mirrored the first of these checks
  -- the "workflow line-count ceiling" (AG-CI-021) and "review-chronology
  comments" (AG-CODE-003) checks silently never ran at all on the fallback
  path, a real coverage gap rather than duplication, fixed by adding them
  here so both jobs now run the same checks. A fourth check
  (dependabot.yml's docker-group base-image consistency, AG-VAL-029) was
  added later for the same reason: a cheap, host-runnable bash/awk/grep
  script with no build-tools-image dependency of its own, matching this
  action's own established shape exactly.
runs:
  using: composite
  steps:
    - name: Check repository header on all tracked files
      shell: bash
      run: bash scripts/check-file-headers.sh

    # See scripts/check-workflow-line-limit.sh's own header comment for why
    # this exists (issue #1095, 2026-08-01 build-push.yml trigger bug).
    - name: Check workflow files stay under the hard line-count ceiling
      shell: bash
      run: bash scripts/check-workflow-line-limit.sh

    # See scripts/check-review-chronology-comments.sh's own header comment
    # for the exact sub-pattern this targets and why.
    - name: Check for review-chronology comments (AG-CODE-003)
      shell: bash
      run: bash scripts/check-review-chronology-comments.sh

    # See scripts/check-dependabot-docker-base-consistency.sh's own header
    # comment for the real drift incident (a stale "shared base image"
    # comment) this guards against.
    - name: Check dependabot.yml's docker-group base-image assumption still holds
      shell: bash
      run: bash scripts/check-dependabot-docker-base-consistency.sh
