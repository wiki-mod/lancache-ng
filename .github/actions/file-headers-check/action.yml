
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: File header / workflow size / review-chronology / dependabot-docker-base / trivy-action-direct-usage / short-sha-truncation checks
description: >-
  The six repository-hygiene checks build-push.yml's file-headers job
  carries. All six now call the proven `ci.sh check` subcommand
  (file-headers, workflow-line-limit, review-chronology,
  dependabot-docker-base-consistency, trivy-action-direct-usage,
  deny-short-sha). Their legacy scripts are deleted; only
  workflow-line-limit's remains (a second caller holds it until cutover).
inputs:
  build-tools-image:
    description: Immutable build-tools image selected by the calling workflow
    required: true
  diff-base-sha:
    description: >-
      Base commit SHA for the PR-scoped review-chronology check. Empty
      (the default) skips that step entirely.
    required: false
    default: ''
  diff-base-ref:
    description: >-
      Base branch ref for the PR-scoped review-chronology check. Empty
      (the default) skips that step entirely.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check repository header on all tracked files
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash .github/scripts/ci.sh check file-headers

    # What: Checks workflow line/byte/run-block limits
    # Why: Enforces AG-CI-021 policy
    # From: Issue #1535 | PR #1575
    - name: Check workflow files stay under the line/byte/run-block ceilings
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash .github/scripts/ci.sh check workflow-line-limit

    # What: Repo-wide review-chronology baseline check
    # Why: Push events need repo-wide guard; PR has diff-check
    # From: Issue #1095 | PR #1546
    - name: Check for review-chronology comments repo-wide (AG-CODE-003)
      shell: bash
      env:
        CHRONOLOGY_WARN_ONLY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        -e CHRONOLOGY_WARN_ONLY
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash .github/scripts/ci.sh check review-chronology

    # What: Diff-scoped review-chronology check on PR changes
    # Why: Repo-wide is warn-only; this blocks PR violations
    # From: Issue #1095 | PR #1686
    - name: Check review-chronology comments on this PR's changed files (AG-CODE-002/003/012)
      if: inputs.diff-base-sha != ''
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/source:ro" \
          -w /tmp \
          -e CHRONOLOGY_DIFF_BASE_SHA="${{ inputs.diff-base-sha }}" \
          -e CHRONOLOGY_DIFF_BASE_REF="${{ inputs.diff-base-ref }}" \
          -e GITHUB_SHA \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash -c \
            'cp -a /source /tmp/work && cd /tmp/work && bash .github/scripts/ci.sh check review-chronology'

    # The shared-base-image assumption this guards is documented in ci.sh's
    # _ci_check_dependabot_docker_base_consistency.
    - name: Check dependabot.yml's docker-group base-image assumption still holds
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash .github/scripts/ci.sh check dependabot-docker-base-consistency

    # ci.sh's _ci_check_trivy_action_direct_usage guards why a direct call
    # site regresses the retry/auth/mirror fix
    # (AG-VAL-029: a point fix alone is not sufficient).
    - name: Check no direct aquasecurity/trivy-action call sites outside the retry wrapper
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash .github/scripts/ci.sh check trivy-action-direct-usage

    # What: Deny any short-SHA slice
    # Why: Short SHAs banned; see script header for rationale
    # From: Issue #1095
    - name: Deny any short-SHA slice
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash .github/scripts/ci.sh check deny-short-sha
