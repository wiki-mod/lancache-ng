
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: File header / workflow size / review-chronology / dependabot-docker-base / trivy-action-direct-usage / short-sha-truncation / docker-run-stdin-heredoc checks
description: >-
  The seven repository-hygiene checks shared by the self-hosted and
  GitHub-hosted file-header jobs. Keeping the steps in one composite action
  prevents the fallback path from silently enforcing a smaller policy set.
inputs:
  build-tools-image:
    description: Immutable build-tools image selected by the calling workflow
    required: true
runs:
  using: composite
  steps:
    - name: Check repository header on all tracked files
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-file-headers.sh

    # What: runs scripts/untracked/check-workflow-line-limit.sh in the build-tools container.
    # Why: enforces AG-CI-021's whole-file and per-run:-block ceilings.
    # From: Issue #1095 | Issue #1535
    - name: Check workflow files stay under the line/byte/run-block ceilings
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-workflow-line-limit.sh

    # See scripts/untracked/check-review-chronology-comments.sh's own header comment
    # for the exact sub-pattern this targets and why.
    - name: Check for review-chronology comments (AG-CODE-003)
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-review-chronology-comments.sh

    # See scripts/tracked/check-dependabot-docker-base-consistency.sh's own header
    # for the shared-base-image assumption this guards.
    - name: Check dependabot.yml's docker-group base-image assumption still holds
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-dependabot-docker-base-consistency.sh

    # See scripts/untracked/check-trivy-action-direct-usage.sh's own header for why a
    # direct call site regresses the retry/auth/mirror fix
    # (AG-VAL-029: a point fix alone is not sufficient).
    - name: Check no direct aquasecurity/trivy-action call sites outside the retry wrapper
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-trivy-action-direct-usage.sh

    # What: runs scripts/untracked/check-short-sha-truncation.sh in the build-tools container.
    # Why: see that script's own header comment for the full list of prior real instances
    #   this guard exists to prevent a recurrence of.
    # From: Issue #1095 (G2)
    - name: Check for hardcoded short-SHA truncation lengths
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-short-sha-truncation.sh

    # See scripts/untracked/check-docker-run-stdin-heredoc.sh's own header for the
    # confirmed real incident (AG-VAL-029) this guards against: a `docker run`
    # feeding a `bash -s`/`sh -s` stdin heredoc without `-i` silently executes
    # nothing while the step still reports success.
    - name: Check docker run invocations feeding a stdin heredoc all pass -i
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-docker-run-stdin-heredoc.sh
