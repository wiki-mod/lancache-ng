
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: File header / workflow size / review-chronology / dependabot-docker-base / trivy-action-direct-usage / short-sha-truncation checks
description: >-
  The six repository-hygiene checks shared by the self-hosted and
  GitHub-hosted file-header jobs. Keeping the steps in one composite action
  prevents the fallback path from silently enforcing a smaller policy set.
inputs:
  build-tools-image:
    description: Immutable build-tools image selected by the calling workflow
    required: true
  diff-base-sha:
    description: >-
      Base commit SHA for the PR-scoped review-chronology check. Empty
      (the default) skips that step entirely.
    required: false
    default: ''
  diff-base-ref:
    description: >-
      Base branch ref for the PR-scoped review-chronology check. Empty
      (the default) skips that step entirely.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check repository header on all tracked files
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-file-headers.sh

    # What: runs scripts/tracked/check-workflow-line-limit.sh in the build-tools container.
    # Why: enforces AG-CI-021's whole-file and per-run:-block ceilings.
    # From: Issue #1095 | Issue #1535
    - name: Check workflow files stay under the line/byte/run-block ceilings
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-workflow-line-limit.sh

    # What: repo-wide review-chronology baseline; warn-only on a pull_request, blocking on a push.
    # Why: the diff-scoped step below already blocks pull_request on its
    #   own diff; a push event has no PR diff to scope to, so this
    #   baseline is the only guard for it and must stay blocking there.
    # From: PR #1546 | Issue #1095
    - name: Check for review-chronology comments repo-wide (AG-CODE-003)
      shell: bash
      env:
        CHRONOLOGY_WARN_ONLY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        -e CHRONOLOGY_WARN_ONLY
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-review-chronology-comments.sh

    # What: diff-scoped, blocking review-chronology check on PR-changed files.
    # Why: the repo-wide step above is warn-only on pull_request, so a
    #   pre-existing violation elsewhere doesn't block this PR; this catches
    #   a violation this PR's own diff introduces or touches.
    # From: Issue #1095 | PR #1686
    - name: Check review-chronology comments on this PR's changed files (AG-CODE-002/003/012)
      if: inputs.diff-base-sha != ''
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/source:ro" \
          -w /tmp \
          -e CHRONOLOGY_DIFF_BASE_SHA="${{ inputs.diff-base-sha }}" \
          -e CHRONOLOGY_DIFF_BASE_REF="${{ inputs.diff-base-ref }}" \
          -e GITHUB_SHA \
          "${{ inputs.build-tools-image }}" \
          timeout --kill-after=30 --signal=KILL 300 bash -c \
            'cp -a /source /tmp/work && cd /tmp/work && bash scripts/tracked/check-review-chronology-comments.sh'

    # See scripts/untracked/check-dependabot-docker-base-consistency.sh's own header
    # for the shared-base-image assumption this guards.
    - name: Check dependabot.yml's docker-group base-image assumption still holds
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/untracked/check-dependabot-docker-base-consistency.sh

    # See scripts/tracked/check-trivy-action-direct-usage.sh's own header for why a
    # direct call site regresses the retry/auth/mirror fix
    # (AG-VAL-029: a point fix alone is not sufficient).
    - name: Check no direct aquasecurity/trivy-action call sites outside the retry wrapper
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-trivy-action-direct-usage.sh

    # What: runs scripts/tracked/check-deny-short-sha.sh in the build-tools container.
    # Why: short SHAs are banned outright (not merely required to stay
    #   consistent); see that script's own header comment for the full
    #   rationale.
    # From: Issue #1095 (G2)
    - name: Deny any short-SHA slice
      shell: bash
      run: >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work
        "${{ inputs.build-tools-image }}" timeout --kill-after=30s 5m
        bash scripts/tracked/check-deny-short-sha.sh
