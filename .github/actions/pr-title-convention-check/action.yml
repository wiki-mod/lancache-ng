
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: PR title Conventional-Commit lint
description: >-
  Shared step logic for the self-hosted `pr-title-convention-check` job and its
  `pr-title-convention-check-hosted` fallback (From: PR #1467).
inputs:
  build-tools-image:
    description: Resolved BUILD_TOOLS_IMAGE reference (already smoke-tested by the caller).
    required: true
  pr-title-lint-mode:
    description: >-
      Caller's PR_TITLE_LINT_MODE repository variable, passed in as a plain input
      because `vars.*`/`secrets.*` only resolve in the calling workflow, not inside
      a composite action. Do not add GitHub Actions expression-interpolation syntax
      to this description string (even as an example): GitHub's schema validator
      evaluates it here too and fails the whole action to load on an unresolvable
      name (From: PR #1467).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch current PR title live
      # What: fetches PR title live via `gh pr view` not event.
      # Why: event payload snapshots go stale on title edits.
      # From: PR #1467
      id: live-title
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title > /tmp/pr-title-live.txt

    - name: Validate PR title convention
      shell: bash
      env:
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        # What: PR author login for dependabot exemption.
        # Why: check script skips linting for dependabot[bot].
        # From: PR #1467
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # What: lint mode switch: warn (default) vs block.
        # Why: transitional period; warns don't hard-block yet.
        # From: Issue #850
        PR_TITLE_LINT_MODE: ${{ inputs.pr-title-lint-mode }}
        BUILD_TOOLS_IMAGE: ${{ inputs.build-tools-image }}
      run: |
        set -euo pipefail
        pr_title="$(cat /tmp/pr-title-live.txt)"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD:/work:ro" \
          -w /work \
          -e PR_TITLE="$pr_title" \
          -e PR_DRAFT \
          -e PR_AUTHOR \
          -e PR_TITLE_LINT_MODE \
          "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
          timeout --kill-after=30 --signal=KILL 300 bash scripts/tracked/check-pr-title-convention.sh
