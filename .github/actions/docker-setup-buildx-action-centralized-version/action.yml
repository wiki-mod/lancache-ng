
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Centralized version -- docker/setup-buildx-action
description: >-
  Single owner of the docker/setup-buildx-action pin. Every caller that
  needs this action goes through here instead of repeating the ref, so a
  version bump is one edit, not N.

# What: Single-source docker/setup-buildx-action version pin
# Why: YAML anchors unsupported in composite-action parser.
# From: Issue #1095 | PR #1665
inputs:
  version:
    required: false
    default: ""
  driver:
    required: false
    default: "docker-container"
  driver-opts:
    required: false
    default: ""
  buildkitd-flags:
    required: false
    default: ""
  buildkitd-config:
    required: false
    default: ""
  buildkitd-config-inline:
    required: false
    default: ""
  use:
    required: false
    default: "true"
  name:
    required: false
    default: ""
  endpoint:
    required: false
    default: ""
  platforms:
    required: false
    default: ""
  append:
    required: false
    default: ""
  keep-state:
    required: false
    default: "false"
  cache-binary:
    required: false
    default: "true"
  cleanup:
    required: false
    default: "true"
outputs:
  name:
    description: Builder name.
    value: ${{ steps.setup.outputs.name }}
  driver:
    description: Builder driver.
    value: ${{ steps.setup.outputs.driver }}
  platforms:
    description: Builder node platforms.
    value: ${{ steps.setup.outputs.platforms }}
  nodes:
    description: Builder nodes metadata.
    value: ${{ steps.setup.outputs.nodes }}
  endpoint:
    description: Builder node endpoint (deprecated).
    value: ${{ steps.setup.outputs.endpoint }}
  status:
    description: Builder node status (deprecated).
    value: ${{ steps.setup.outputs.status }}
  flags:
    description: Builder node flags (deprecated).
    value: ${{ steps.setup.outputs.flags }}
runs:
  using: composite
  steps:
    - id: setup
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: ${{ inputs.version }}
        driver: ${{ inputs.driver }}
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        buildkitd-config: ${{ inputs.buildkitd-config }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
        use: ${{ inputs.use }}
        name: ${{ inputs.name }}
        endpoint: ${{ inputs.endpoint }}
        platforms: ${{ inputs.platforms }}
        append: ${{ inputs.append }}
        keep-state: ${{ inputs.keep-state }}
        cache-binary: ${{ inputs.cache-binary }}
        cleanup: ${{ inputs.cleanup }}
    - shell: bash
      run: |
        set -euo pipefail
        builder_config="${DOCKER_CONFIG:-${HOME:?}/.docker}/buildx"
        workspace_key="$(printf '%s' "${GITHUB_WORKSPACE:?}" | sha256sum | cut -c1-16)"
        docker_config="${RUNNER_TEMP:?}/docker-config/${GITHUB_RUN_ID:?}/${GITHUB_JOB:?}-${workspace_key}"
        mkdir -p "$docker_config"
        chmod 700 "$docker_config"
        {
          printf 'DOCKER_CONFIG=%s\n' "$docker_config"
          printf 'BUILDX_CONFIG=%s\n' "$builder_config"
        } >> "$GITHUB_ENV"
