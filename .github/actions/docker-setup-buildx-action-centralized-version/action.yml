
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Centralized version -- docker/setup-buildx-action
description: >-
  Single owner of the docker/setup-buildx-action pin. Every caller that
  needs this action goes through here instead of repeating the ref, so a
  version bump is one edit, not N.

# What: exists because a YAML anchor/alias cannot serve this role.
# Why: GitHub's composite-action manifest parser rejects anchors/aliases
#   outright ("Anchors are not currently supported") -- confirmed live,
#   PR #1665's `&anchor`/`*alias` attempt broke every build/build-arm64
#   job for every service (issue #1095). A local `uses: ./...` reference
#   has no such restriction, so this thin pass-through wrapper is the
#   pin's one real maintenance point instead.
# From: Issue #1095
inputs:
  version:
    required: false
    default: ""
  driver:
    required: false
    default: ""
  driver-opts:
    required: false
    default: ""
  buildkitd-flags:
    required: false
    default: ""
  buildkitd-config:
    required: false
    default: ""
  buildkitd-config-inline:
    required: false
    default: ""
  use:
    required: false
    default: ""
  name:
    required: false
    default: ""
  endpoint:
    required: false
    default: ""
  platforms:
    required: false
    default: ""
  append:
    required: false
    default: ""
  keep-state:
    required: false
    default: ""
  cache-binary:
    required: false
    default: ""
  cleanup:
    required: false
    default: ""
outputs:
  name:
    description: Builder name.
    value: ${{ steps.setup.outputs.name }}
  driver:
    description: Builder driver.
    value: ${{ steps.setup.outputs.driver }}
  platforms:
    description: Builder node platforms.
    value: ${{ steps.setup.outputs.platforms }}
  nodes:
    description: Builder nodes metadata.
    value: ${{ steps.setup.outputs.nodes }}
  endpoint:
    description: Builder node endpoint (deprecated).
    value: ${{ steps.setup.outputs.endpoint }}
  status:
    description: Builder node status (deprecated).
    value: ${{ steps.setup.outputs.status }}
  flags:
    description: Builder node flags (deprecated).
    value: ${{ steps.setup.outputs.flags }}
runs:
  using: composite
  steps:
    - id: setup
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        version: ${{ inputs.version }}
        driver: ${{ inputs.driver }}
        driver-opts: ${{ inputs.driver-opts }}
        buildkitd-flags: ${{ inputs.buildkitd-flags }}
        buildkitd-config: ${{ inputs.buildkitd-config }}
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
        use: ${{ inputs.use }}
        name: ${{ inputs.name }}
        endpoint: ${{ inputs.endpoint }}
        platforms: ${{ inputs.platforms }}
        append: ${{ inputs.append }}
        keep-state: ${{ inputs.keep-state }}
        cache-binary: ${{ inputs.cache-binary }}
        cleanup: ${{ inputs.cleanup }}
