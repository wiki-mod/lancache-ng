# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary same-repository executor for the active CI 1.1 Draft.

name: CDX CI 1.1 unused full-setup image audit

on:
  pull_request:
    branches: [current_dev]
    types: [synchronize]

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.number == 1523 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/1.1-single-artifact-consolidation
          fetch-depth: 0

      - name: Audit, remove unused image build, and validate
        run: |
          set -euo pipefail

          echo '=== Pre-change exact validation-image references ==='
          grep -nF 'lancache-ng-full-setup:validation' \
            .github/workflows/build-push.yml \
            .github/workflows/full-setup-sims.yml
          ref_count="$(grep -hF 'lancache-ng-full-setup:validation' \
            .github/workflows/build-push.yml \
            .github/workflows/full-setup-sims.yml | wc -l)"
          test "$ref_count" -eq 4

          echo '=== Explicit deploy/full-setup/Dockerfile references before change ==='
          git grep -nF 'deploy/full-setup/Dockerfile' -- ':!.github/cdx-*' ':!.github/workflows/cdx-*' || true

          python3 .github/cdx-1522-unused-fullsetup-image.py
          git rm -- .github/cdx-1522-unused-fullsetup-image.py .github/workflows/cdx-1522-unused-fullsetup-image.yml

          if grep -nF 'lancache-ng-full-setup:validation' \
            .github/workflows/build-push.yml \
            .github/workflows/full-setup-sims.yml; then
            echo '::error::Unused full-setup validation image reference remains.'
            exit 1
          fi
          if grep -nF 'Build full-setup validation image' \
            .github/workflows/build-push.yml \
            .github/workflows/full-setup-sims.yml; then
            echo '::error::Unused full-setup validation image build step remains.'
            exit 1
          fi

          # Coverage must remain: Compose parse, stack start, health, client simulation and teardown.
          for needle in \
            'Validate compose configuration' \
            'Reserve a validation subnet and start the stack' \
            'Wait for the stack to stabilize and check container health' \
            'Run client simulation against the full-setup stack' \
            'Tear down full-setup validation stack'; do
            grep -F "$needle" .github/workflows/build-push.yml >/dev/null
            grep -F "$needle" .github/workflows/full-setup-sims.yml >/dev/null
          done
          grep -F 'rm -f deploy/full-setup/.ci-exact-digests.yml' .github/workflows/build-push.yml >/dev/null

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/build-push.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/full-setup-sims.yml

          echo '=== Remaining deploy/full-setup references after removal ==='
          git grep -nF 'deploy/full-setup' -- ':!.github/cdx-*' ':!.github/workflows/cdx-*' || true

          git add -A
          git diff --cached --check
          wc -l -c .github/workflows/build-push.yml .github/workflows/full-setup-sims.yml

          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/cdx-1522-unused-fullsetup-image.py \
            .github/workflows/build-push.yml \
            .github/workflows/cdx-1522-unused-fullsetup-image.yml \
            .github/workflows/full-setup-sims.yml | sort)"
          if [ "$changed" != "$expected" ]; then
            echo '::error::Unexpected target file set.'
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$changed"
            exit 1
          fi

          marker="CDX-$(date +%s)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$marker ci: remove unused full-setup validation image build"

          printf 'CDX_COMMIT_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'CDX_TREE_SHA=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'CDX_BUILD_PUSH_BLOB_SHA=%s\n' "$(git rev-parse 'HEAD:.github/workflows/build-push.yml')"
          printf 'CDX_FULL_SETUP_SIMS_BLOB_SHA=%s\n' "$(git rev-parse 'HEAD:.github/workflows/full-setup-sims.yml')"

          git push origin HEAD:refs/heads/ci/1.1-single-artifact-consolidation
