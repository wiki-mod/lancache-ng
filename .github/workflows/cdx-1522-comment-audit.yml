# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary read-only audit for PR #1523 comment-size cleanup.

name: CDX CI 1.1 build-push comment audit

on:
  pull_request:
    branches: [current_dev]
    types: [synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.number == 1523 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/1.1-single-artifact-consolidation

      - name: Measure YAML comment blocks outside block scalars
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-push.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          # Track YAML literal/folded block scalars so shell/awk/heredoc comments inside
          # run: | / run: >- are never classified as removable YAML commentary.
          scalar_indent = None
          yaml_comment_lines = []
          yaml_comment_bytes = 0
          blocks = []
          current = None

          for n, raw in enumerate(lines, 1):
              text = raw.rstrip('\n')
              stripped = text.lstrip(' ')
              indent = len(text) - len(stripped)

              if scalar_indent is not None:
                  if stripped and indent <= scalar_indent:
                      scalar_indent = None
                  else:
                      if current:
                          blocks.append(current)
                          current = None
                      continue

              if re.search(r':\s*[|>]([+-]?\d*)?\s*(?:#.*)?$', text):
                  scalar_indent = indent

              if stripped.startswith('#'):
                  yaml_comment_lines.append(n)
                  yaml_comment_bytes += len(raw.encode('utf-8'))
                  if current and n == current['end'] + 1:
                      current['end'] = n
                      current['lines'] += 1
                      current['bytes'] += len(raw.encode('utf-8'))
                      current['text'].append(stripped[1:].strip())
                  else:
                      if current:
                          blocks.append(current)
                      current = {
                          'start': n, 'end': n, 'lines': 1,
                          'bytes': len(raw.encode('utf-8')),
                          'text': [stripped[1:].strip()],
                      }
              else:
                  if current:
                      blocks.append(current)
                      current = None

          if current:
              blocks.append(current)

          total_bytes = path.stat().st_size
          print(f'TOTAL_LINES={len(lines)}')
          print(f'TOTAL_BYTES={total_bytes}')
          print(f'YAML_COMMENT_LINES_OUTSIDE_SCALARS={len(yaml_comment_lines)}')
          print(f'YAML_COMMENT_BYTES_OUTSIDE_SCALARS={yaml_comment_bytes}')
          print(f'YAML_COMMENT_LINE_PERCENT={len(yaml_comment_lines) * 100 / len(lines):.2f}')
          print(f'YAML_COMMENT_BYTE_PERCENT={yaml_comment_bytes * 100 / total_bytes:.2f}')
          print(f'CONTIGUOUS_YAML_COMMENT_BLOCKS={len(blocks)}')
          print('=== TOP 40 YAML COMMENT BLOCKS BY BYTES ===')
          for block in sorted(blocks, key=lambda b: (-b['bytes'], b['start']))[:40]:
              preview = ' '.join(x for x in block['text'] if x)[:220]
              print(f"L{block['start']}-L{block['end']} lines={block['lines']} bytes={block['bytes']} :: {preview}")
          PY
