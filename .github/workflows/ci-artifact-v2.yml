# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
#
# Opt-in immutable-artifact candidate pipeline. PR runs may build, scan and
# deeply validate quarantine candidates, but they can never publish a reusable
# accepted pointer. Reusable acceptance is restricted to an explicitly
# dispatched run on protected current_dev/master and is signed against that
# exact protected source ref and commit.
name: CI Artifact Identity v2

on:
  workflow_dispatch:
    inputs:
      reuse_stack_tag:
        description: Accepted stack tag to reuse unchanged service digests from, or "none".
        required: false
        default: none
        type: string
      run_supplemental_full_setup:
        description: Run the complete reusable full-setup simulation suite. Acceptance is impossible when disabled.
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [current_dev]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request' &&
        github.run_attempt == 1 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci-v2-test') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci-v2-test')
      ) &&
      format('{0}-pr-{1}', github.workflow, github.ref) ||
      format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' &&
      github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ci-v2-test') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci-v2-test')
    }}

env:
  CANDIDATE_TAG: candidate-v2-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: plan immutable image candidates
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci-v2-test') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci-v2-test')
      )
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      candidate_tag: ${{ steps.config.outputs.candidate_tag }}
      refresh_bucket: ${{ steps.config.outputs.refresh_bucket }}
      supplemental: ${{ steps.config.outputs.supplemental }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: config
        name: Resolve v2 run configuration
        env:
          DISPATCH_REUSE_STACK_TAG: ${{ inputs.reuse_stack_tag }}
          DISPATCH_SUPPLEMENTAL: ${{ inputs.run_supplemental_full_setup }}
        run: |
          set -euo pipefail
          reuse_tag=none
          supplemental=true
          refresh_bucket="$(date -u +%G-W%V)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            reuse_tag="${DISPATCH_REUSE_STACK_TAG:-none}"
            supplemental="${DISPATCH_SUPPLEMENTAL:-true}"
          fi
          printf 'candidate_tag=%s\n' "$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          printf 'reuse_tag=%s\n' "$reuse_tag" >> "$GITHUB_OUTPUT"
          printf 'refresh_bucket=%s\n' "$refresh_bucket" >> "$GITHUB_OUTPUT"
          printf 'supplemental=%s\n' "$supplemental" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR for accepted-baseline reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable bootstrap build-tools verifier
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/select-build-tools-image.sh)"
          [[ "$image" == *@sha256:* ]] || {
            echo "::error::build-tools verifier is not digest-qualified: $image"
            exit 1
          }
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          printf 'CI_BOOTSTRAP_BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Freeze exact external builder base identities
        run: |
          set -euo pipefail
          golang="$(timeout --kill-after=30 300 bash scripts/ci-resolve-image-ref.sh golang:latest)"
          rust="$(timeout --kill-after=30 300 bash scripts/ci-resolve-image-ref.sh rust:latest)"
          printf 'CI_GOLANG_BASE_IMAGE=%s\n' "$golang" >> "$GITHUB_ENV"
          printf 'CI_RUST_BASE_IMAGE=%s\n' "$rust" >> "$GITHUB_ENV"

      - name: Extract accepted baseline lock
        if: steps.config.outputs.reuse_tag != 'none'
        env:
          REUSE_STACK_TAG: ${{ steps.config.outputs.reuse_tag }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          stack_ref="ghcr.io/${repo}/stack:${REUSE_STACK_TAG}"
          if ! timeout --kill-after=30 300 bash scripts/ci-extract-stack-lock.sh "$stack_ref" "$RUNNER_TEMP/baseline-stack-lock.json"; then
            echo "::warning::Could not prove $stack_ref is a valid accepted stack pointer. Reuse is disabled and every image will build."
            rm -f "$RUNNER_TEMP/baseline-stack-lock.json"
          fi

      - name: Validate v2 scripts and workflows, then create plan
        id: plan
        run: |
          set -euo pipefail
          baseline_args=()
          if [[ -f "$RUNNER_TEMP/baseline-stack-lock.json" ]]; then
            baseline_args=(-e BASELINE_STACK_LOCK=/tmp/out/baseline.json)
          fi
          mkdir -p "$RUNNER_TEMP/ci-v2-out"
          if [[ -f "$RUNNER_TEMP/baseline-stack-lock.json" ]]; then
            cp "$RUNNER_TEMP/baseline-stack-lock.json" "$RUNNER_TEMP/ci-v2-out/baseline.json"
          fi
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e SOURCE_SHA="$GITHUB_SHA" \
            -e CI_BOOTSTRAP_BUILD_TOOLS_IMAGE \
            -e CI_GOLANG_BASE_IMAGE \
            -e CI_RUST_BASE_IMAGE \
            -e CI_SOURCE_APT_CACHE_BUST="${{ steps.config.outputs.refresh_bucket }}" \
            -e CI_SOURCE_REQUIRE_APT_CACHE_BUST=true \
            "${baseline_args[@]}" \
            -v "$PWD:/work:ro" \
            -v "$RUNNER_TEMP/ci-v2-out:/tmp/out" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 1200 bash -lc '
              set -euo pipefail
              bash -n scripts/ci-*.sh scripts/query-stack-images.sh scripts/lib/ci-artifact-identity.sh scripts/lib/network-retry.sh
              shellcheck --severity=warning scripts/ci-*.sh scripts/query-stack-images.sh scripts/lib/ci-artifact-identity.sh scripts/lib/network-retry.sh
              actionlint -config-file .github/actionlint.yaml \
                .github/workflows/ci-artifact-v2.yml \
                .github/workflows/ci-promote-accepted-v2.yml \
                .github/workflows/ci-security-refresh-v2.yml \
                .github/workflows/ci-release-accepted-v2.yml \
                .github/workflows/full-setup-sims.yml
              bash scripts/check-workflow-line-limit.sh
              bats \
                tests/bats/ci_artifact_identity.bats \
                tests/bats/ci_build_inputs.bats \
                tests/bats/ci_docker_lock_shim.bats \
                tests/bats/ci_plan_run_invocation.bats \
                tests/bats/ci_release_identity.bats \
                tests/bats/ci_reused_index_identity.bats \
                tests/bats/network_retry.bats \
                tests/bats/select_build_tools_runtime_contract.bats
              bash scripts/query-stack-images.sh all >/tmp/out/catalog.json
              bash scripts/ci-plan-run.sh >/tmp/out/plan.json
            '
          matrix="$(jq -c '{include}' "$RUNNER_TEMP/ci-v2-out/plan.json")"
          [[ "$(jq '.include | length' <<<"$matrix")" -gt 0 ]] || {
            echo "::error::candidate plan is empty"
            exit 1
          }
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-v2-plan
          path: ${{ runner.temp }}/ci-v2-out/
          retention-days: 14

  platform-candidate:
    name: candidate ${{ matrix.service }} ${{ matrix.arch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        if: matrix.mode == 'build'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx on persistent amd64 runner
        if: matrix.mode == 'build' && matrix.arch == 'amd64'
        id: buildx-self
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Buildx with hosted arm64 retry
        if: matrix.mode == 'build' && matrix.arch == 'arm64'
        id: buildx-arm
        uses: ./.github/actions/buildx-setup-retry

      - name: Resolve effective build arguments
        if: matrix.mode == 'build'
        id: build-args
        env:
          SOURCE_DOCKERFILE: ${{ matrix.source }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
          REFRESH_BUCKET: ${{ needs.plan.outputs.refresh_bucket }}
        run: |
          set -euo pipefail
          [[ "$REFRESH_BUCKET" =~ ^[0-9]{4}-W[0-9]{2}$ ]] || {
            echo "::error::invalid frozen refresh bucket: ${REFRESH_BUCKET:-<empty>}"
            exit 1
          }
          {
            echo 'args<<EOF'
            if [[ -n "$MATRIX_BUILD_ARGS" ]]; then
              printf '%s\n' "$MATRIX_BUILD_ARGS"
            fi
            if grep -Eq '^ARG[[:space:]]+APT_CACHE_BUST(=|[[:space:]]|$)' "$SOURCE_DOCKERFILE"; then
              printf 'APT_CACHE_BUST=%s\n' "$REFRESH_BUCKET"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # DO NOT ENABLE YET. The project-specific GHCR path must first prove that
      # anonymous digest pushes remain pullable and preserve retry/attestation
      # behavior. Until then, a unique quarantine tag is transport only; all
      # downstream gates consume the digest returned by Buildx.
      #
      # outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Build and push quarantine candidate exactly once
        if: matrix.mode == 'build'
        id: build
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ matrix.arch == 'amd64' && steps.buildx-self.outputs.name || steps.buildx-arm.outputs.name }}
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: ${{ steps.build-args.outputs.args }}
          push: "true"
          tags: ${{ matrix.image }}:${{ needs.plan.outputs.candidate_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.lancache-ng.candidate=${{ needs.plan.outputs.candidate_tag }}
          platforms: ${{ matrix.platform }}
          provenance: "false"
          pull: "true"
          cache-from: type=gha,scope=ci-v2-${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-v2-${{ matrix.service }}-${{ matrix.arch }}

      - name: Attest build provenance to exact child digest
        if: matrix.mode == 'build'
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Write immutable platform record
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          REUSED_DIGEST: ${{ matrix.reused_digest }}
          MATRIX_MODE: ${{ matrix.mode }}
          REUSED_INDEX_DIGEST: ${{ matrix.reused_index_digest }}
          CI_SOURCE_BUILD_INPUTS_JSON: ${{ toJSON(matrix.build_inputs) }}
          CI_SOURCE_APT_CACHE_BUST: ${{ needs.plan.outputs.refresh_bucket }}
          CI_SOURCE_REQUIRE_APT_CACHE_BUST: "true"
        run: |
          set -euo pipefail
          digest="$BUILT_DIGEST"
          mode=built
          if [[ "$MATRIX_MODE" == reuse ]]; then
            digest="$REUSED_DIGEST"
            mode=reused
          fi
          mkdir -p candidate-record
          bash scripts/ci-write-candidate-record.sh \
            "${{ matrix.scope }}" \
            "${{ matrix.service }}" \
            "${{ matrix.image }}" \
            "$GITHUB_SHA" \
            "${{ matrix.artifact_source_sha }}" \
            "${{ matrix.source_fingerprint }}" \
            "${{ matrix.platform }}" \
            "$digest" \
            "$mode" \
            "candidate-record/${{ matrix.service }}__${{ matrix.arch }}.json"

      - name: Remove amd64 Buildx builder
        if: always() && matrix.mode == 'build' && matrix.arch == 'amd64'
        run: docker buildx rm "${{ steps.buildx-self.outputs.name }}" || true

      - name: Remove arm64 Buildx builder
        if: always() && matrix.mode == 'build' && matrix.arch == 'arm64'
        run: docker buildx rm "${{ steps.buildx-arm.outputs.name }}" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-platform-${{ matrix.service }}-${{ matrix.arch }}
          path: candidate-record/*.json
          retention-days: 14

  security-smoke:
    name: secure and smoke ${{ matrix.service }} ${{ matrix.arch }}
    needs: [plan, platform-candidate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-platform-${{ matrix.service }}-${{ matrix.arch }}
          path: candidate-record

      - id: identity
        env:
          RECORD: candidate-record/${{ matrix.service }}__${{ matrix.arch }}.json
        run: |
          set -euo pipefail
          digest="$(jq -r '.digest' "$RECORD")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::invalid candidate digest $digest"
            exit 1
          }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s@%s\n' "${{ matrix.image }}" "$digest" >> "$GITHUB_OUTPUT"
          printf 'freshness=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Trivy exact child digest
        id: trivy
        uses: ./.github/actions/trivy-scan-with-cache
        with:
          image-ref: ${{ steps.identity.outputs.image_ref }}
          digest: ${{ steps.identity.outputs.digest }}
          cache-key-scope: ci-v2-${{ matrix.service }}-${{ matrix.arch }}
          freshness-bucket: ${{ steps.identity.outputs.freshness }}

      - name: Native-platform smoke on exact digest
        run: |
          set -euo pipefail
          timeout --kill-after=30 300 docker pull "${{ steps.identity.outputs.image_ref }}"
          timeout --kill-after=30 120 docker run --rm --entrypoint /bin/sh \
            "${{ steps.identity.outputs.image_ref }}" -c 'true'

      - name: Write digest-bound security and smoke evidence
        env:
          CACHE_HIT: ${{ steps.trivy.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n \
            --arg service "${{ matrix.service }}" \
            --arg platform "${{ matrix.platform }}" \
            --arg digest "${{ steps.identity.outputs.digest }}" \
            --arg cache_hit "${CACHE_HIT:-false}" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema:"candidate-evidence/v1",service:$service,platform:$platform,digest:$digest,trivy:"passed",trivy_cache_hit:($cache_hit == "true"),native_smoke:"passed",observed_at:$observed_at}' \
            > "evidence/${{ matrix.service }}__${{ matrix.arch }}.json"

      - name: Attest exact-digest security and smoke evidence
        uses: ./.github/actions/ghcr-custom-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          predicate-type: https://wiki-mod.github.io/lancache-ng/attestations/security-smoke/v1
          predicate-path: evidence/${{ matrix.service }}__${{ matrix.arch }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-evidence-${{ matrix.service }}-${{ matrix.arch }}
          path: evidence/*.json
          retention-days: 14

  assemble-indexes:
    name: assemble exact multi-platform indexes
    needs: [plan, security-smoke]
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-platform-*
          merge-multiple: true
          path: candidate-platforms
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Assemble without rebuilding
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG_VALUE: ${{ needs.plan.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          mkdir -p image-indexes
          catalog="$(bash scripts/query-stack-images.sh all)"
          while IFS= read -r entry; do
            service="$(jq -r '.service' <<<"$entry")"
            image="$(jq -r '.image' <<<"$entry")"
            bash scripts/ci-assemble-service-index.sh \
              "$service" "$image" "$GITHUB_SHA" "$CANDIDATE_TAG_VALUE" \
              candidate-platforms "image-indexes/${service}.json"
          done < <(jq -c '.include[]' <<<"$catalog")

      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-indexes
          path: image-indexes/*.json
          retention-days: 14

  stack-lock:
    name: freeze exact stack lock
    needs: [plan, assemble-indexes]
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 15
    outputs:
      candidate_tag: ${{ needs.plan.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-indexes
          path: image-indexes
      - name: Assemble stack lock
        run: |
          set -euo pipefail
          mkdir -p stack-lock
          bash scripts/ci-assemble-stack-lock.sh \
            "$GITHUB_SHA" \
            "${{ needs.plan.outputs.candidate_tag }}" \
            image-indexes \
            stack-lock/stack-lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-lock
          path: stack-lock/stack-lock.json
          retention-days: 30

  exact-locked-stack:
    name: validate exact digest-locked stack
    needs: stack-lock
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stack-lock
          path: stack-lock
      - run: timeout --kill-after=30 2400 bash scripts/ci-validate-locked-stack.sh stack-lock/stack-lock.json

  runtime-deep-ntp:
    name: validate candidate NTP clock-discipline path
    needs: stack-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stack-lock
          path: stack-lock
      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Prove transport tags match frozen lock before NTP simulation
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh stack-lock/stack-lock.json
      - name: Run NTP CAP_SYS_TIME simulation against exact locked digest
        run: timeout --kill-after=30 900 bash scripts/ci-run-locked-ntp-simulation.sh stack-lock/stack-lock.json
      - name: Prove transport tags still match frozen lock after NTP simulation
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh stack-lock/stack-lock.json
      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  runtime-deep-quickstart:
    name: validate complete candidate quickstart/logging runtime
    needs: stack-lock
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stack-lock
          path: stack-lock
      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Prove transport tags match frozen lock before quickstart simulation
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh stack-lock/stack-lock.json
      - name: Resolve exact build-tools identity from stack lock
        run: |
          set -euo pipefail
          image="$(jq -r '.tooling["build-tools"].image' stack-lock/stack-lock.json)"
          digest="$(jq -r '.tooling["build-tools"].digest' stack-lock/stack-lock.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::invalid build-tools digest in stack lock"
            exit 1
          }
          printf 'BUILD_TOOLS_IMAGE=%s@%s\n' "$image" "$digest" >> "$GITHUB_ENV"
      - name: Run complete quickstart/logging simulation on exact locked runtime
        env:
          SETUP_SIM_IMAGE_CHANNEL: pinned
          SETUP_SIM_IMAGE_TAG: ${{ needs.stack-lock.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          source scripts/lib/quickstart-compose-lock.sh
          quickstart_compose_lock_acquire
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e BUILD_TOOLS_IMAGE \
            -e SETUP_SIM_IMAGE_CHANNEL \
            -e SETUP_SIM_IMAGE_TAG \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 2400 bash scripts/ci-run-locked-quickstart-simulation.sh stack-lock/stack-lock.json
      - name: Prove transport tags still match frozen lock after quickstart simulation
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh stack-lock/stack-lock.json
      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  supplemental-full-setup:
    name: supplemental full-setup simulations
    needs: [plan, stack-lock]
    if: needs.plan.outputs.supplemental == 'true'
    uses: ./.github/workflows/full-setup-sims.yml
    with:
      image_tag: ${{ needs.stack-lock.outputs.candidate_tag }}
      should_run: "true"
      pr_staging_available: "true"
      build_tools_touched: "true"
      stack_lock_artifact: stack-lock
    secrets: inherit

  pr-validation-proof:
    name: record non-promotable PR validation proof
    needs:
      - plan
      - stack-lock
      - exact-locked-stack
      - runtime-deep-ntp
      - runtime-deep-quickstart
      - supplemental-full-setup
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.plan.outputs.supplemental == 'true' &&
      needs['stack-lock'].result == 'success' &&
      needs['exact-locked-stack'].result == 'success' &&
      needs['runtime-deep-ntp'].result == 'success' &&
      needs['runtime-deep-quickstart'].result == 'success' &&
      needs['supplemental-full-setup'].result == 'success'
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stack-lock
          path: stack-lock
      - name: Write explicitly non-promotable PR proof
        run: |
          set -euo pipefail
          mkdir -p validation-proof
          lock_hash="$(sha256sum stack-lock/stack-lock.json | awk '{print $1}')"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg lock_hash "$lock_hash" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema:"candidate-validation/v1",accepted:false,promotion_eligible:false,source_sha:$source_sha,source_ref:$source_ref,stack_lock_sha256:$lock_hash,run_url:$run_url,observed_at:$observed_at,gates:{exact_digest_security:true,native_platform_smoke:true,exact_locked_stack:true,runtime_deep_validation:true,supplemental_full_setup:true}}' \
            > validation-proof/pr-validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-v2-pr-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-proof/pr-validation.json
          retention-days: 30

  accept:
    name: final protected-branch candidate acceptance
    needs:
      - plan
      - stack-lock
      - exact-locked-stack
      - runtime-deep-ntp
      - runtime-deep-quickstart
      - supplemental-full-setup
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_protected == true &&
      (github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
      needs.plan.outputs.supplemental == 'true' &&
      needs['stack-lock'].result == 'success' &&
      needs['exact-locked-stack'].result == 'success' &&
      needs['runtime-deep-ntp'].result == 'success' &&
      needs['runtime-deep-quickstart'].result == 'success' &&
      needs['supplemental-full-setup'].result == 'success'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stack-lock
          path: stack-lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-evidence-*
          merge-multiple: true
          path: evidence
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify complete digest-bound evidence set
        run: |
          set -euo pipefail
          source scripts/lib/ci-artifact-identity.sh
          expected="$(( $(bash scripts/query-stack-images.sh all | jq '.include | length') * 2 ))"
          mapfile -t files < <(find evidence -maxdepth 1 -type f -name '*.json' -print | sort)
          [[ "${#files[@]}" -eq "$expected" ]] \
            || ci_ai_fail "expected $expected platform evidence records, found ${#files[@]}"
          for file in "${files[@]}"; do
            service="$(jq -r '.service' "$file")"
            platform="$(jq -r '.platform' "$file")"
            digest="$(jq -r '.digest' "$file")"
            [[ "$(jq -r '.trivy' "$file")" == passed ]] \
              || ci_ai_fail "Trivy evidence is not passed in $file"
            [[ "$(jq -r '.native_smoke' "$file")" == passed ]] \
              || ci_ai_fail "native smoke evidence is not passed in $file"
            locked="$(jq -r --arg service "$service" --arg platform "$platform" '(.runtime[$service] // .tooling[$service]).platforms[$platform] // empty' stack-lock/stack-lock.json)"
            [[ -n "$locked" && "$locked" == "$digest" ]] \
              || ci_ai_fail "evidence digest $digest does not match stack lock for $service/$platform"
          done

      - name: Re-resolve every candidate transport tag before acceptance
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh stack-lock/stack-lock.json

      - name: Write final protected-branch acceptance record
        run: |
          set -euo pipefail
          lock_hash="$(sha256sum stack-lock/stack-lock.json | awk '{print $1}')"
          accepted_tag="accepted-v2-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg lock_hash "$lock_hash" \
            --arg accepted_tag "$accepted_tag" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg accepted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema:"stack-acceptance/v1",accepted:true,source_sha:$source_sha,source_ref:$source_ref,stack_lock_sha256:$lock_hash,accepted_tag:$accepted_tag,run_url:$run_url,accepted_at:$accepted_at,gates:{identity_complete:true,platform_complete:true,provenance:true,exact_digest_security:true,native_platform_smoke:true,exact_locked_stack:true,runtime_deep_validation:true,supplemental_full_setup:true,publication_policy:true}}' \
            > stack-lock/acceptance.json
          bash -c 'source scripts/lib/ci-artifact-identity.sh; ci_ai_validate_acceptance stack-lock/acceptance.json'
          printf 'ACCEPTED_TAG=%s\n' "$accepted_tag" >> "$GITHUB_ENV"

      - name: Prepare accepted stack-pointer context
        run: cp release/stack-pointer/Dockerfile stack-lock/Dockerfile

      - name: Build immutable accepted stack pointer
        id: pointer
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: stack-lock
          push: "true"
          tags: ghcr.io/wiki-mod/lancache-ng/stack:${{ env.ACCEPTED_TAG }}
          build-args: SOURCE_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          provenance: "false"

      - name: Attest accepted stack-pointer build provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/wiki-mod/lancache-ng/stack
          subject-digest: ${{ steps.pointer.outputs.digest }}

      - name: Attest final acceptance last
        uses: ./.github/actions/ghcr-custom-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/wiki-mod/lancache-ng/stack
          subject-digest: ${{ steps.pointer.outputs.digest }}
          predicate-type: https://wiki-mod.github.io/lancache-ng/attestations/acceptance/v1
          predicate-path: stack-lock/acceptance.json

      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Publish accepted records for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-stack-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stack-lock/stack-lock.json
            stack-lock/acceptance.json
          retention-days: 90
