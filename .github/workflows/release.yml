
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: promote a v-tag, then release, OpenVEX and SBOM.
# Why: separate release workflow (§6.3); ci.sh owns it.
# From: Issue #1683
name: CI 2.0 Release
on:
  push:
    tags: ['v*']
  # What: publish a tag, or cut the next patch tag.
  # Why: AG-REL-013: a tag cut is its own dispatch.
  # From: Issue #1683 | PR #1858
  workflow_dispatch:
    inputs:
      action:
        description: publish a release tag, or cut the next patch tag from the previous release
        type: choice
        options: [publish, cut-patch]
        default: publish
      tag:
        description: Release tag to (re)publish (vX.Y.Z or vX.Y.Z-rc.N); empty for cut-patch.
        required: false
permissions:
  contents: read
concurrency:
  group: ci-2.0-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
# What: GHCR token; the release tag, empty for cut-patch.
# Why: a cut-patch run has no tag; ci.sh reads one name.
# From: Issue #1683 | PR #1858
env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_RELEASE_TAG: ${{ inputs.action != 'cut-patch' && (github.event.inputs.tag || github.ref_name) || '' }}
  # What: LAN proxy CA secret; ci.sh uses it self-hosted.
  # Why: secrets are not in CI_VARIABLES; vars are.
  # From: Issue #1683 | PR #1858
  PROJECT_SELFHOSTED_PROXY_CA: ${{ secrets.PROJECT_SELFHOSTED_PROXY_CA }}
  # What: all repo/org variables once, as json, for ci.sh.
  # Why: ci.sh reads vars by name; YAML lists none of them.
  # From: Issue #1683 | PR #1858
  CI_VARIABLES: ${{ toJSON(vars) }}
jobs:
  # What: resolve build-tools image and job settings.
  # Why: every later job runs in build-tools (AG-VAL-016).
  # From: Issue #1683
  resolve-build-tools:
    name: resolve build-tools
    # What: the one literal runner/timeout; emits the rest.
    # Why: ci.sh can only pick a runner once one runs it.
    # From: Issue #1683 | PR #1858
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What: one mutable entry: the current_dev channel.
    # Why: ci.sh cannot run before a container exists.
    # From: Issue #1683 | PR #1858
    container:
      image: ghcr.io/${{ github.repository }}/build-tools:nightly
      credentials: &ghcr_credentials
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      runner: ${{ steps.jobs.outputs.runner }}
      timeouts: ${{ steps.jobs.outputs.timeouts }}
      validate-dir: ${{ steps.jobs.outputs.validate-dir }}
    steps:
      # What: shallow checkout of the tag, else the event.
      # Why: a dispatch runs on a branch ref, not the tag.
      # From: Issue #1683 | PR #1858
      - &bootstrap
        name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 1
      - name: Resolve the build-tools image
        id: resolve
        run: bash .github/scripts/ci.sh build-tools resolve-image
      - name: Resolve the job settings
        id: jobs
        run: bash .github/scripts/ci.sh job-settings

  # What: record the run identities of the release commit.
  # Why: §56.1: resolve the exact accepted stack; no build.
  # From: Issue #1683 | PR #1858
  plan:
    name: plan
    needs: resolve-build-tools
    if: inputs.action != 'cut-patch'
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['plan'] }}
    container: &bt_container
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials: *ghcr_credentials
    permissions: &release_read
      contents: read
      packages: read
    outputs:
      identities: ${{ steps.plan.outputs.identities }}
    steps:
      - *bootstrap
      - name: Collect changed files
        id: changed
        run: bash .github/scripts/ci.sh changed-files
      - name: Plan the release stack
        id: plan
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci.sh plan-matrix

  # What: validate the accepted stack of the release commit.
  # Why: §50: promote moves a validated stack only.
  # From: Issue #1683 | PR #1858
  validate:
    name: validate
    needs: [resolve-build-tools, plan]
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['validate'] }}
    # What: build-tools container, one shared host dir.
    # Why: AG-VAL-016; same path both sides for binds.
    # From: Issue #1683 | PR #1858
    container:
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials: *ghcr_credentials
      volumes:
        - ${{ needs.resolve-build-tools.outputs.validate-dir }}:${{ needs.resolve-build-tools.outputs.validate-dir }}
    permissions: *release_read
    outputs:
      stack: ${{ steps.validate.outputs.stack }}
    steps:
      - *bootstrap
      - name: Validate the accepted stack candidate
        id: validate
        env:
          CI_RUN_IDENTITIES: &run_ids ${{ needs.plan.outputs.identities }}
        run: bash .github/scripts/ci.sh validate

  # What: move the release tag and the channels it moves.
  # Why: §56.1: promotion comes before the GitHub Release.
  # From: Issue #1683 | PR #1858
  promote:
    name: promote
    needs: [resolve-build-tools, plan, validate]
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['promote'] }}
    container: *bt_container
    # What: actions read: lock waits ask if a holder ended.
    # Why: the lock is a git ref; channels are packages.
    # From: Issue #1683 | PR #1858
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      CI_STACK_VALIDATED: ${{ needs.validate.outputs.stack }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_RUN_IDENTITIES: *run_ids
    steps:
      - *bootstrap
      - name: Promote the release tag and its channels
        run: bash .github/scripts/ci.sh promote-ref

  # What: publish the GitHub release notes and OpenVEX.
  # Why: §6.3 release artifacts; ci.sh is idempotent.
  # From: Issue #1683
  release:
    name: release
    needs: [resolve-build-tools, promote]
    if: inputs.action != 'cut-patch'
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['release'] }}
    container: *bt_container
    # What: token may write releases and assets, read GHCR
    # Why: the workflow default token is read-only
    # From: Issue #1683 | PR #1858
    permissions: &release_write
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - *bootstrap
      # What: name every released image digest
      # Why: §82: the tag resolves once; later steps reuse
      # From: Issue #1683 | PR #1912
      - name: Resolve the released image digests
        id: images
        run: bash .github/scripts/ci.sh release-images "${CI_RELEASE_TAG}"
      - name: Publish the GitHub release
        env:
          CI_RELEASE_IMAGES: ${{ steps.images.outputs.matrix }}
        run: bash .github/scripts/ci.sh release-publish "${CI_RELEASE_TAG}"
      - name: Attach the OpenVEX document
        run: bash .github/scripts/ci.sh release-vex "${CI_RELEASE_TAG}"
      # What: the PAT reaches the CHANGELOG push step only
      # Why: the branch ruleset refuses GITHUB_TOKEN pushes
      # From: Issue #1683 | PR #1858
      - name: Add the release to CHANGELOG.md
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: bash .github/scripts/ci.sh release-changelog "${CI_RELEASE_TAG}"
      # What: PROJECT_RELEASE_VERSION from the stable tag
      # Why: GITHUB_TOKEN cannot write repo variables
      # From: Issue #1683 | PR #1858
      - name: Set the release version variable
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: bash .github/scripts/ci.sh release-variable "${CI_RELEASE_TAG}"

  # What: attest the provenance of each released digest.
  # Why: §59: provenance names the exact digest, no tag.
  # From: Issue #1683 | PR #1912
  release-provenance:
    name: release-provenance
    needs: [resolve-build-tools, release]
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['release-provenance'] }}
    # What: the attestation needs OIDC and packages.
    # Why: least privilege; only this job gets them.
    # From: Issue #1683 | PR #1912
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.images) }}
    steps:
      # What: uses: refs name SOT github_actions entries.
      # Why: GitHub reads uses: only; ci.sh checks vN.
      # From: Issue #1683 | PR #1912
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true

  # What: attach a CycloneDX SBOM per first-party image.
  # Why: per-image provenance; SOT-driven walk, no matrix.
  # From: Issue #1683
  release-sbom:
    name: release-sbom
    needs: [resolve-build-tools, release]
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['release-sbom'] }}
    container: *bt_container
    permissions: *release_write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_RELEASE_IMAGES: ${{ needs.release.outputs.images }}
    steps:
      - *bootstrap
      - name: Attach a CycloneDX SBOM per published image
        run: bash .github/scripts/ci.sh release-sbom-stack "${CI_RELEASE_TAG}"

  # What: cut the next patch tag on an explicit dispatch.
  # Why: the PAT tag push then starts the tag publish.
  # From: Issue #1683 | PR #1858
  cut-release-tag:
    name: cut-release-tag
    needs: resolve-build-tools
    if: inputs.action == 'cut-patch'
    runs-on: ${{ needs.resolve-build-tools.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.resolve-build-tools.outputs.timeouts)['cut-release-tag'] }}
    container: *bt_container
    steps:
      - *bootstrap
      # What: the PAT reaches the tag push step only
      # Why: least privilege; the checkout needs no PAT
      # From: Issue #1683 | PR #1858
      - name: Cut and push the next patch tag
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: bash .github/scripts/ci.sh cut-release-tag
