
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# GitHub's built-in "Closes #N"/"Fixes #N" issue auto-close only fires when a
# pull request merges into the repository's DEFAULT branch (currently
# master). This project's active development happens on `current_dev` (see
# #825), so that native mechanism never fires for the PRs that actually
# resolve issues day to day, leaving them open forever unless someone closes
# them by hand -- this workflow mechanizes the manual pattern already used
# by hand dozens of times.
#
# This workflow:
#   1. Fires only when a PR merges into `current_dev` (never master/vX.Y.Z --
#      GitHub's native mechanism already covers those; this must not
#      duplicate or interfere with it).
#   2. Reads only the PR body's exact `## Linked Issues` section and parses
#      `Closes #N` / `Fixes #N` (and the rest of GitHub's own accepted
#      keyword set) within it, case-insensitive, same-repo only.
#   3. For each referenced issue: posts a comment containing the PR's own
#      body verbatim (mechanical relay, not an AI-generated summary), then
#      closes the issue.
#   4. Also exposes a `workflow_dispatch` test mode that runs the exact same
#      parsing/comment-building logic in dry-run against a real, already-
#      merged PR number, without posting or closing anything -- this is how
#      the logic is validated without spamming a real issue with a
#      duplicate comment (see the PR that introduced this workflow for the
#      dry-run transcript proving the parsing path against real data).
#
# A bad or stale issue reference (issue doesn't exist, is already closed, or
# the number actually belongs to a pull request) is logged as a warning and
# skipped -- it must never fail the whole job just because one of several
# referenced issues among many is no longer valid.
#
# What: Only the PR body's exact `## Linked Issues` section is scanned for
# closing keywords; text elsewhere in the body has zero effect.
# Why: Free-form prose elsewhere cannot be reliably told apart from a real
# closing instruction (confirmed false-close: PR #1443).
# From: Issue #1496
name: current_dev Auto-Close Linked Issues

on:
  # What: Uses pull_request_target (matching first-interaction.yml/labeler.yml).
  # Why: Runs with the base repo's token; evaluates the workflow already
  # merged into the base branch. No fork-code risk: never checks out PR code.
  # From: Issue #1137 | PR #1157
  pull_request_target:
    types: [closed]
    branches: [current_dev]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Already-merged current_dev PR number to replay in dry-run mode
          (no comments are posted, no issues are closed or modified).
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  auto-close:
    name: Relay PR body and close linked issues
    runs-on: ubuntu-latest
    # What: Guards on `merged == true` in addition to `types: [closed]`.
    # Why: `types: [closed]` alone also fires for a PR closed without
    # merging; workflow_dispatch always runs since it is dry-run only.
    # From: Issue #1137 | PR #1157
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    steps:
      - name: Parse PR body and relay/close linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isDryRun = context.eventName === 'workflow_dispatch';

            // Step 1: Resolve the PR to process -- the real event payload
            // already carries everything for the pull_request trigger, but
            // workflow_dispatch only gives us a bare number and must fetch
            // the rest for real.
            let pr;
            if (isDryRun) {
              // What: Converts the dispatch input to a Number explicitly.
              // Why: `context.payload.inputs` values arrive as strings even
              // when declared `type: number` in the workflow file.
              // From: Issue #1137 | PR #1157
              const prNumber = Number(context.payload.inputs?.pr_number);
              if (!prNumber || Number.isNaN(prNumber)) {
                core.setFailed('workflow_dispatch requires a numeric pr_number input.');
                return;
              }
              try {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                pr = data;
              } catch (err) {
                core.setFailed(`Could not fetch PR #${prNumber}: ${err.message}`);
                return;
              }
              core.info(`[dry-run] Replaying PR #${pr.number} ("${pr.title}"), merged=${pr.merged}, base=${pr.base?.ref}`);
              if (!pr.merged || pr.base?.ref !== 'current_dev') {
                core.warning(`[dry-run] PR #${pr.number} was not actually merged into current_dev (merged=${pr.merged}, base=${pr.base?.ref}) -- continuing anyway since this is a logic-only replay, but a real run would never have been triggered for it.`);
              }
            } else {
              pr = context.payload.pull_request;
            }

            const prNumber = pr.number;
            const prUrl = pr.html_url;
            const prBody = pr.body || '';
            const mergedAt = pr.merged_at || 'unknown time';
            const mergeSha = pr.merge_commit_sha || 'unknown commit';

            // What: Locates every line matching the exact "## Linked
            // Issues" heading, to isolate that section's text below.
            // Why: A near-miss heading (case, extra text) must be treated
            // as missing, never fuzzy-matched into an unintended section.
            // From: Issue #1496
            const bodyLines = prBody.split(/\r\n|\r|\n/);
            const linkedIssuesHeadingRe = /^## Linked Issues\s*$/;
            // What: Matches any ATX heading level (1-6), not only level 2.
            // Why: `/^## /` alone does not match `### `/`# ` and would let
            // the section run past a deeper sub-heading into later content.
            // From: Issue #1496
            const anyAtxHeadingRe = /^#{1,6} /;
            const headingLineIndexes = [];
            bodyLines.forEach((line, idx) => {
              if (linkedIssuesHeadingRe.test(line)) {
                headingLineIndexes.push(idx);
              }
            });

            let linkedIssuesText = null;
            if (headingLineIndexes.length === 0) {
              // What: Warns when no "## Linked Issues" heading is found.
              // Why: The section is the sole authoritative input; a
              // missing section must fail closed, not fall back to the body.
              // From: Issue #1496
              core.warning(`PR #${prNumber}'s body has no exact "## Linked Issues" section. Failing closed to "close nothing" (issue #1496).`);
            } else if (headingLineIndexes.length > 1) {
              // What: Warns when the heading appears more than once.
              // Why: Which occurrence is authoritative is ambiguous;
              // guessing would reopen the false-positive surface being closed.
              // From: Issue #1496
              core.warning(`PR #${prNumber}'s body has ${headingLineIndexes.length} exact "## Linked Issues" headings (duplicated/ambiguous). Failing closed to "close nothing" (issue #1496).`);
            } else {
              const sectionStart = headingLineIndexes[0] + 1;
              let sectionEnd = bodyLines.length;
              for (let i = sectionStart; i < bodyLines.length; i++) {
                if (anyAtxHeadingRe.test(bodyLines[i])) {
                  sectionEnd = i;
                  break;
                }
              }
              linkedIssuesText = bodyLines.slice(sectionStart, sectionEnd).join('\n');
            }

            // What: Normalizes a null extraction result to an empty string.
            // Why: Missing, duplicated, and genuinely empty sections must
            // all converge on zero keyword matches ("close nothing").
            // From: Issue #1496
            const linkedIssuesSectionText = linkedIssuesText || '';

            // Step 3: Parse the Linked Issues section text for closing keywords.
            // What: Matches closing keywords, skipping a same-sentence
            // negated mention (e.g. "does not close #N"); never matches `Refs`.
            // Why: Without the lookbehind, that prose matched like a real
            // close (PR #1443 incident).
            // From: PR #1491
            const keywordPattern = /(?<!\b(?:not|never|cannot)\b[^.!?\n]{0,20}|n't\b[^.!?\n]{0,20})\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = new Set();
            let match;
            while ((match = keywordPattern.exec(linkedIssuesSectionText)) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info(`No closing-keyword issue references found in PR #${prNumber}'s "## Linked Issues" section. Nothing to do.`);
              return;
            }
            core.info(`Found ${issueNumbers.size} closing-keyword reference(s) in PR #${prNumber}'s "## Linked Issues" section: ${[...issueNumbers].join(', ')}`);

            const commentBody = [
              '## Closed via merge to `current_dev` (not the default branch -- see #1137)',
              '',
              `**Auto-close notice:** This comment and this issue's closure were generated automatically by the \`current-dev-auto-close\` GitHub Actions workflow, not by a human or an interactive session. GitHub's built-in "Closes #N"/"Fixes #N" auto-close only fires for merges into the default branch (\`master\`); this workflow mirrors that behavior for \`current_dev\`, the project's actual active development branch (see #1137). The content below is PR #${prNumber}'s own description, relayed verbatim -- it is not an AI-generated summary.`,
              '',
              `Resolved by PR #${prNumber}: ${prUrl} (merged ${mergedAt}, commit \`${mergeSha}\`). Full PR body below.`,
              '',
              '---',
              '',
              prBody,
            ].join('\n');

            // Step 4: Resolve each referenced number and act on it
            // independently -- one bad reference (missing issue, already
            // closed, or actually a PR number) must not abort the others.
            for (const issueNumber of issueNumbers) {
              try {
                let issue;
                try {
                  const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  issue = data;
                } catch (err) {
                  if (err.status === 404) {
                    core.warning(`Skipping #${issueNumber}: no such issue/PR exists in ${owner}/${repo}.`);
                    continue;
                  }
                  throw err;
                }

                // What: Skips a referenced number when it is a PR.
                // Why: The Issues API returns pull requests too (a PR is a
                // superset of an issue in GitHub's data model).
                // From: Issue #1137 | PR #1157
                if (issue.pull_request) {
                  core.warning(`Skipping #${issueNumber}: it is a pull request, not an issue.`);
                  continue;
                }

                if (issue.state === 'closed') {
                  core.warning(`Skipping #${issueNumber}: already closed.`);
                  continue;
                }

                if (isDryRun) {
                  core.info(`[dry-run] Would comment on #${issueNumber} ("${issue.title}") and close it. Comment body:\n${commentBody}\n---`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: commentBody,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${issueNumber} with a relayed comment from PR #${prNumber}.`);
              } catch (err) {
                // What: Warns and continues the loop on an unexpected error.
                // Why: A single failure (rate limit, permissions, transient
                // API error) for one issue must not abort the remaining ones.
                // From: Issue #1137 | PR #1157
                core.warning(`Failed to process #${issueNumber}: ${err.message}`);
              }
            }
