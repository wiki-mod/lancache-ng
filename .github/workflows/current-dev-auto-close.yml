
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: Relay merged PR body and close linked issues.
# Why: Closes only triggers on master, not current_dev.
# From: Issue #1496
name: current_dev Auto-Close Linked Issues

on:
  # What: Use pull_request_target like first-interaction.yml.
  # Why: Runs with repo token; no fork-code risk.
  # From: Issue #1137 | PR #1157
  pull_request_target:
    types: [closed]
    branches: [current_dev]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Already-merged current_dev PR number to replay in dry-run mode
          (no comments are posted, no issues are closed or modified).
        required: true
        type: number

permissions:
  # What: Grants write to issues and read-only to pull requests.
  # Why: Relays merged PR body; never touches repo.
  # From: Issue #1137 | PR #1157
  issues: write
  pull-requests: read

jobs:
  auto-close:
    name: Relay PR body and close linked issues
    runs-on: ubuntu-latest
    # What: Guard on merged==true in addition to trigger filter.
    # Why: Closed-without-merging PR still matches types:[closed].
    # From: Issue #1137 | PR #1157
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    steps:
      - name: Parse PR body and relay/close linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isDryRun = context.eventName === 'workflow_dispatch';

            // What: Resolve PR for dispatch; real trigger already has it.
            // Why: payload.inputs arrives as strings; needs conversion.
            // From: Issue #1137 | PR #1157
            let pr;
            if (isDryRun) {
              const prNumber = Number(context.payload.inputs?.pr_number);
              if (!prNumber || Number.isNaN(prNumber)) {
                core.setFailed('workflow_dispatch requires a numeric pr_number input.');
                return;
              }
              try {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                pr = data;
              } catch (err) {
                core.setFailed(`Could not fetch PR #${prNumber}: ${err.message}`);
                return;
              }
              core.info(`[dry-run] Replaying PR #${pr.number} ("${pr.title}"), merged=${pr.merged}, base=${pr.base?.ref}`);
              if (!pr.merged || pr.base?.ref !== 'current_dev') {
                core.warning(`[dry-run] PR #${pr.number} was not actually merged into current_dev (merged=${pr.merged}, base=${pr.base?.ref}) -- continuing anyway since this is a logic-only replay, but a real run would never have been triggered for it.`);
              }
            } else {
              pr = context.payload.pull_request;
            }

            const prNumber = pr.number;
            const prUrl = pr.html_url;
            const prBody = pr.body || '';
            const mergedAt = pr.merged_at || 'unknown time';
            const mergeSha = pr.merge_commit_sha || 'unknown commit';

            // What: Match exact "## Linked Issues" heading.
            // Why: Near-miss headings must not fuzzy-match into sections.
            // From: Issue #1496
            const bodyLines = prBody.split(/\r\n|\r|\n/);
            const linkedIssuesHeadingRe = /^## Linked Issues\s*$/;
            // What: Match all ATX heading levels (1-6), not only level 2.
            // Why: /^##/ misses ### and #; prevents section bleed.
            // From: Issue #1496
            const anyAtxHeadingRe = /^#{1,6} /;
            const headingLineIndexes = [];
            bodyLines.forEach((line, idx) => {
              if (linkedIssuesHeadingRe.test(line)) {
                headingLineIndexes.push(idx);
              }
            });

            let linkedIssuesText = null;
            // What: Fail closed if heading missing or duplicated.
            // Why: Missing/ambiguous heading risks closing wrong issue.
            // From: Issue #1496
            if (headingLineIndexes.length === 0) {
              core.warning(`PR #${prNumber}'s body has no exact "## Linked Issues" section. Failing closed to "close nothing" (issue #1496).`);
            } else if (headingLineIndexes.length > 1) {
              core.warning(`PR #${prNumber}'s body has ${headingLineIndexes.length} exact "## Linked Issues" headings (duplicated/ambiguous). Failing closed to "close nothing" (issue #1496).`);
            } else {
              const sectionStart = headingLineIndexes[0] + 1;
              let sectionEnd = bodyLines.length;
              for (let i = sectionStart; i < bodyLines.length; i++) {
                if (anyAtxHeadingRe.test(bodyLines[i])) {
                  sectionEnd = i;
                  break;
                }
              }
              linkedIssuesText = bodyLines.slice(sectionStart, sectionEnd).join('\n');
            }

            // What: Normalize null result to empty string.
            // Why: Missing, duplicate, empty sections converge to zero.
            // From: Issue #1496
            const linkedIssuesSectionText = linkedIssuesText || '';

            // What: Extract link-close keywords; skip negated & Refs.
            // Why: Negation guard prevents matching "does not close".
            // From: PR #1491
            const keywordPattern = /(?<!\b(?:not|never|cannot)\b[^.!?\n]{0,20}|n't\b[^.!?\n]{0,20})\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = new Set();
            let match;
            while ((match = keywordPattern.exec(linkedIssuesSectionText)) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info(`No closing-keyword issue references found in PR #${prNumber}'s "## Linked Issues" section. Nothing to do.`);
              return;
            }
            core.info(`Found ${issueNumbers.size} closing-keyword reference(s) in PR #${prNumber}'s "## Linked Issues" section: ${[...issueNumbers].join(', ')}`);

            const commentBody = [
              '## Closed via merge to `current_dev` (not the default branch -- see #1137)',
              '',
              `**Auto-close notice:** This comment and this issue's closure were generated automatically by the \`current-dev-auto-close\` GitHub Actions workflow, not by a human or an interactive session. GitHub's built-in "Closes #N"/"Fixes #N" auto-close only fires for merges into the default branch (\`master\`); this workflow mirrors that behavior for \`current_dev\`, the project's actual active development branch. The content below is PR #${prNumber}'s own description, relayed verbatim -- it is not an AI-generated summary.`,
              '',
              `Resolved by PR #${prNumber}: ${prUrl} (merged ${mergedAt}, commit \`${mergeSha}\`). Full PR body below.`,
              '',
              '---',
              '',
              prBody,
            ].join('\n');

            // What: Process issues independently; failure doesn't abort.
            // Why: Missing/closed/PR reference or API error must not stop.
            // From: Issue #1137 | PR #1157
            for (const issueNumber of issueNumbers) {
              try {
                let issue;
                try {
                  const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  issue = data;
                } catch (err) {
                  if (err.status === 404) {
                    core.warning(`Skipping #${issueNumber}: no such issue/PR exists in ${owner}/${repo}.`);
                    continue;
                  }
                  throw err;
                }

                // What: Skips a referenced number when it is a PR.
                // Why: GitHub Issues API returns PRs as superset of issues.
                // From: Issue #1137 | PR #1157
                if (issue.pull_request) {
                  core.warning(`Skipping #${issueNumber}: it is a pull request, not an issue.`);
                  continue;
                }

                if (issue.state === 'closed') {
                  core.warning(`Skipping #${issueNumber}: already closed.`);
                  continue;
                }

                if (isDryRun) {
                  core.info(`[dry-run] Would comment on #${issueNumber} ("${issue.title}") and close it. Comment body:\n${commentBody}\n---`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: commentBody,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${issueNumber} with a relayed comment from PR #${prNumber}.`);
              } catch (err) {
                core.warning(`Failed to process #${issueNumber}: ${err.message}`);
              }
            }
