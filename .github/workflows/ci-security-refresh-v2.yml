# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
#
# Re-scans accepted child digests against the current vulnerability database.
# A stale security verdict causes a re-scan of the same identity, never rebuild.
name: Refresh Accepted Security Evidence v2

on:
  workflow_dispatch:
    inputs:
      accepted_stack_tag:
        description: Immutable accepted-v2-* stack tag to re-scan.
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate accepted tag input
        env:
          ACCEPTED_STACK_TAG: ${{ inputs.accepted_stack_tag }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTED_STACK_TAG" == accepted-v2-* ]] \
            || { echo "::error::accepted_stack_tag must be an immutable accepted-v2-* tag"; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract positively accepted stack lock
        run: |
          set -euo pipefail
          bash scripts/ci-extract-stack-lock.sh \
            "ghcr.io/wiki-mod/lancache-ng/stack:${{ inputs.accepted_stack_tag }}" \
            "$RUNNER_TEMP/stack-lock.json"
      - id: matrix
        run: printf 'matrix=%s\n' "$(bash scripts/ci-lock-matrix.sh "$RUNNER_TEMP/stack-lock.json" platform)" >> "$GITHUB_OUTPUT"

  scan:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: time
        run: printf 'bucket=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Re-scan accepted child digest
        uses: ./.github/actions/trivy-scan-with-cache
        with:
          image-ref: ${{ matrix.image }}@${{ matrix.digest }}
          digest: ${{ matrix.digest }}
          cache-key-scope: security-refresh-${{ matrix.service }}-${{ matrix.platform }}
          freshness-bucket: ${{ steps.time.outputs.bucket }}
      - name: Write refreshed digest-bound evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n \
            --arg service "${{ matrix.service }}" \
            --arg platform "${{ matrix.platform }}" \
            --arg digest "${{ matrix.digest }}" \
            --arg scanned_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema:"security-refresh/v1", service:$service, platform:$platform, digest:$digest, trivy:"passed", scanned_at:$scanned_at}' \
            > evidence/security-refresh.json
      - name: Attest refreshed evidence to exact digest with GHCR retry
        uses: ./.github/actions/ghcr-custom-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          predicate-type: https://wiki-mod.github.io/lancache-ng/attestations/security-refresh/v1
          predicate-path: evidence/security-refresh.json
