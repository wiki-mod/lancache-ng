
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Reusable workflow: the ten shared full-setup validation/simulation jobs that
# used to be maintained as two independently-drifting copies in
# full-setup-validate.yml (manual) and full-setup-deep-validate.yml (per-PR).
# This is now their single source (issue #1014); each caller keeps its own
# trigger/path-filter surface and passes its own inputs.
#
# CALLERS pass:
#   image_tag            -- the image tag under test (a dispatch input, or the
#                           PR staging tag / channel tag the caller's `plan`
#                           job resolved).
#   should_run           -- 'true' to run the suite ('false' short-circuits
#                           every job; the manual caller always passes 'true').
#   pr_staging_available -- 'true' only for a same-repo PR whose per-service
#                           pr-<N>-sha staging tags exist; selects PR-staging
#                           image resolution in the sim jobs. Dispatch/fork/
#                           Dependabot pass 'false' and validate a published tag.
#   build_tools_touched  -- 'true' when this PR changed tools/build-tools, so a
#                           sim prefers the confirmed PR-scoped build-tools image
#                           over build-tools:latest.
#
# Cross-workflow ordering the caller owns: the caller's invoking job must
# `needs:` its own `ensure-pr-staging-images` job (when it has one) so every job
# here already sees the PR's staging images; that job's failure/cancel guard
# therefore lives on the caller's `uses:` job, not on the jobs below.
#
# LINCHPIN FIX (issue #1014): full-setup-validate no longer carries a job-level
# VALIDATION_* env block. A job-level `env:` entry is re-applied on top of every
# step's accumulated $GITHUB_ENV state, so it silently overrode the reserve
# step's per-attempt retry writes across the health/teardown steps -- a latent
# #703-class collision on the compose-project name / host UI port that only
# full-setup-deep-validate.yml still carried. Reserving via the composite action
# (which writes the reserved slot to $GITHUB_ENV) is the correct, already-proven
# pattern the manual file and build-push.yml both use.
name: Full-Setup Simulations (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag under test (dispatch input, PR staging tag, or channel tag).
        required: true
        type: string
      should_run:
        description: "'true' to run the suite; 'false' short-circuits every job."
        required: false
        default: "true"
        type: string
      pr_staging_available:
        description: "'true' when the PR's per-service staging tags exist (same-repo PR)."
        required: false
        default: "false"
        type: string
      build_tools_touched:
        description: "'true' when this PR changed tools/build-tools."
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  # Derives a per-run validation subnet keyed on this run's own id/attempt
  # (#623). Its outputs are threaded into the sim jobs' env blocks below; the
  # actual collision-safe reservation is still the per-job flock+retry (the
  # composite action for full-setup-validate, run-in-validation-subnet.sh for
  # the sims), so this is effectively a per-run starting candidate plus a
  # serialization anchor.
  compute-validation-network:
    name: derive per-run validation subnet
    if: inputs.should_run == 'true'
    # Stays light (not a stack-driving job): pure subnet/IP derivation via a
    # composite action, no Docker/compose stack of its own.
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 45
    outputs:
      subnet: ${{ steps.derive.outputs.subnet }}
      gateway: ${{ steps.derive.outputs.gateway }}
      proxy_ip: ${{ steps.derive.outputs.proxy_ip }}
      proxy_ssl_ip: ${{ steps.derive.outputs.proxy_ssl_ip }}
      dns_standard_ip: ${{ steps.derive.outputs.dns_standard_ip }}
      dns_ssl_ip: ${{ steps.derive.outputs.dns_ssl_ip }}
      watchdog_ip: ${{ steps.derive.outputs.watchdog_ip }}
      netdata_ip: ${{ steps.derive.outputs.netdata_ip }}
      nats_ip: ${{ steps.derive.outputs.nats_ip }}
      ui_ip: ${{ steps.derive.outputs.ui_ip }}
      standard_shim_ip: ${{ steps.derive.outputs.standard_shim_ip }}
      project_name: ${{ steps.derive.outputs.project_name }}
      ui_port: ${{ steps.derive.outputs.ui_port }}
    steps:
      - uses: &checkout_centraliced_versioning actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive validation network
        id: derive
        uses: ./.github/actions/derive-validation-network

  # Strict superset of build-push.yml's shallow "validate full-setup image"
  # job: compose-config validation, locked subnet reservation + stack bring-up,
  # health/crash-loop assertions, client simulation. On a PR (image_tag = the
  # resolved pr-<N>-sha tag) it validates the PR's own images.
  full-setup-validate:
    name: validate full-setup image
    needs: compute-validation-network
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registries before stack pull.
      # Why: docker.io pulls anonymous without auth.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable build-tools image
        id: build-tools
        run: |
          set -euo pipefail
          build_tools_image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          case "$build_tools_image" in
            *@sha256:*) ;;
            *)
              echo "::error::Expected digest-qualified build-tools image, got '$build_tools_image'."
              exit 1
              ;;
          esac
          printf 'image=%s\n' "$build_tools_image" >> "$GITHUB_OUTPUT"

      - name: Validate compose configuration
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
          LANCACHE_IMAGE_REGISTRY: ghcr.io
          LANCACHE_IMAGE_PREFIX: wiki-mod/lancache-ng
        run: |
          set -euo pipefail
          : "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}"

          docker run --rm \
            -v "$PWD/deploy/full-setup:/validation:ro" \
            -w /validation \
            --env LANCACHE_IMAGE_REGISTRY \
            --env LANCACHE_IMAGE_PREFIX \
            --env LANCACHE_IMAGE_TAG \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 --signal=KILL 300 \
            docker compose -f docker-compose.yml config >/dev/null

      - name: Reserve a validation subnet and start the stack (locked, retries on collision)
        uses: ./.github/actions/reserve-validation-subnet-stack
        with:
          image-tag: ${{ inputs.image_tag }}

      - name: Wait for the stack to stabilize and check container health
        uses: ./.github/actions/wait-validation-stack-health

      - name: Run client simulation against the full-setup stack
        env:
          FULL_SETUP_CLIENT_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/full-setup-client-simulation.sh

      - name: Tear down full-setup validation stack
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true

          # `down` above can lose Docker's own "has active endpoints" race
          # (a container-removal API call can return before its network
          # endpoint is actually unwired -- confirmed for real in CI, see
          # validation_project_networks_teardown's own comment in
          # reserve-validation-subnet.sh) and silently leave this project's
          # network(s) non-empty, poisoning them for whichever job/run
          # reserves this slot next. Wait for and force a real removal
          # instead of trusting `down`'s own exit code.
          # shellcheck source=scripts/lib/reserve-validation-subnet.sh
          source "$GITHUB_WORKSPACE/scripts/lib/reserve-validation-subnet.sh"
          # This step runs unconditionally (`if: always()`), including when
          # the reserve composite failed before ever setting
          # COMPOSE_PROJECT_NAME -- under `set -u`, a bare "$COMPOSE_PROJECT_NAME"
          # would abort this whole step with "unbound variable" in exactly that
          # case. The safe-default form skips teardown when there is nothing to
          # tear down instead.
          if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
            validation_project_networks_teardown "$COMPOSE_PROJECT_NAME" || true
          fi

          # What: release host subnet lock from reserve.
          # Why: frees slot immediately, not at exit.
          # From: PR #1523
          if [[ -n "${VALIDATION_LOCK_HOLDER_PID:-}" ]]; then
            kill "$VALIDATION_LOCK_HOLDER_PID" 2>/dev/null || true
          fi

  ssl-mitm-cache-simulation:
    # What: real DNS/HTTP/HTTPS caching test.
    # Why: serialize runner; if: always() gate.
    # From: PR #1523
    name: SSL MITM cache simulation
    needs: [compute-validation-network, full-setup-validate]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
      # Per-run compose project name + UI host port keep this sim isolated from
      # build-push.yml's own shallow validate job when both run for the same
      # PR (they derive different values from different run ids). The
      # VALIDATION_SUBNET/*_IP/GATEWAY block below is needed too, not just
      # the project name: scripts/untracked/simulations/ssl-mitm-cache-simulation.sh calls `docker
      # compose up` against deploy/full-setup/docker-compose.yml, whose
      # network block falls back to the fixed 172.30.99.0/27 subnet
      # (docker-compose.yml's own ${VALIDATION_SUBNET:-172.30.99.0/27}
      # default) whenever these are unset -- a different project NAME alone
      # does not stop two concurrent runs' bridge networks from overlapping
      # on the same fixed subnet on a shared self-hosted host -- the
      # isolation claim above only holds once VALIDATION_SUBNET/*_IP/GATEWAY
      # are actually threaded through, as this job does below.
      VALIDATION_SUBNET: ${{ needs.compute-validation-network.outputs.subnet }}
      VALIDATION_GATEWAY: ${{ needs.compute-validation-network.outputs.gateway }}
      VALIDATION_PROXY_IP: ${{ needs.compute-validation-network.outputs.proxy_ip }}
      VALIDATION_PROXY_SSL_IP: ${{ needs.compute-validation-network.outputs.proxy_ssl_ip }}
      VALIDATION_DNS_STANDARD_IP: ${{ needs.compute-validation-network.outputs.dns_standard_ip }}
      VALIDATION_DNS_SSL_IP: ${{ needs.compute-validation-network.outputs.dns_ssl_ip }}
      VALIDATION_WATCHDOG_IP: ${{ needs.compute-validation-network.outputs.watchdog_ip }}
      VALIDATION_NETDATA_IP: ${{ needs.compute-validation-network.outputs.netdata_ip }}
      VALIDATION_NATS_IP: ${{ needs.compute-validation-network.outputs.nats_ip }}
      VALIDATION_UI_IP: ${{ needs.compute-validation-network.outputs.ui_ip }}
      # What: thread collision-safe IP for standard shim.
      # Why: only this job starts this service.
      # From: Issue #668
      VALIDATION_STANDARD_SHIM_IP: ${{ needs.compute-validation-network.outputs.standard_shim_ip }}
      COMPOSE_PROJECT_NAME: ${{ needs.compute-validation-network.outputs.project_name }}
      VALIDATION_UI_PORT: ${{ needs.compute-validation-network.outputs.ui_port }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before compose.
      # Why: compose pulls nats from docker.io.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # BUILD_TOOLS_REQUIRE_PUBLISHED=true: this job's dig/curl client checks
        # only need tools already in every published build-tools image, so it
        # should fail loudly rather than silently build a branch-local one.
        # EXCEPTION: when this PR itself touched tools/build-tools,
        # ensure-pr-staging-images has already polled for and confirmed
        # build-tools:$PR_TAG exists (scripts/untracked/ensure-pr-staging-images.sh),
        # so use that PR-scoped image directly instead of build-tools:latest
        # -- otherwise a same-PR build-tools change that still happens to
        # pass select-build-tools-image.sh's baseline smoke test would never
        # actually be exercised by this job.
        id: build-tools-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          # What: pass inputs via env, not interpolation.
          # Why: OSPS-BR-01.04 script-injection hardening.
          # From: Issue #1130
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run SSL MITM cache simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          # Reserve a collision-free /27 subnet within 172.30.0.0/16 (flock +
          # retry, issue #820) and run the sim inside it, instead of racing the single
          # job-level VALIDATION_SUBNET against every other concurrent run on
          # this host. The wrapper exports the whole VALIDATION_* set (incl.
          # VALIDATION_STANDARD_SHIM_IP, which compose reads to place the
          # standard-passthrough-shim this sim relies on) for the slot it wins.
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/ssl-mitm-cache-simulation.sh

  proxy-deep-wildcard-tls-simulation:
    # Real TLS-handshake test for entrypoint.sh's deep leading-dot wildcard
    # cert path (_EXTRA_WILDCARD_BASES/_bounded_cert_name/_sign_cert),
    # exercising a synthetic example.com-rooted fixture rather than the real
    # cdn-domains.txt (see scripts/untracked/simulations/proxy-deep-wildcard-tls-simulation.sh's own
    # header for why this needs its own locally-built image instead of
    # reusing ssl-mitm-cache-simulation's published-image approach). Does not
    # need the compute-validation-network subnet/IP outputs at all -- it
    # builds its own throwaway images and creates its own auto-addressed
    # Docker network, no docker-compose stack involved. Still chained after
    # ssl-mitm-cache-simulation (not just gated on compute-validation-network
    # in parallel with every other sim) for the same reason every other job
    # in this file is chained rather than run concurrently: two independent
    # `docker build`s racing against full-setup-validate's own build on the
    # same shared BuildKit content store is exactly the source-level
    # contention AG-CI-017 requires bounding (the recurring
    # `ref layer-sha256:...locked` signature across #1246-#1249 under this
    # runner pool's known saturation, #1065) -- a retry wrapper alone would
    # not fix a structural concurrency problem this job would otherwise add.
    name: Proxy deep-wildcard TLS simulation
    needs: [compute-validation-network, ssl-mitm-cache-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run proxy deep-wildcard TLS simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/proxy-deep-wildcard-tls-simulation.sh

  proxy-standard-mode-sni-routing-simulation:
    # Real TLS-handshake test for entrypoint.sh's standard-mode (SNI
    # passthrough) stream-target map generation loop over _UNIQUE_DOMAINS
    # (issue #1297) -- a different bug class and a
    # different nginx context (the stream module's own :8443 passthrough
    # listener, not the http block's cert-selection map the sibling
    # proxy-deep-wildcard-tls-simulation job above validates). See
    # scripts/untracked/simulations/proxy-standard-mode-sni-routing-simulation.sh's own header for
    # the full fake-origin/Docker-embedded-DNS mechanism this needs and why
    # it can't reuse either sibling script's approach. Chained after the
    # existing proxy-deep-wildcard-tls-simulation job for the same
    # AG-CI-017 BuildKit-content-store contention reasoning that job's own
    # comment documents -- this job also builds its own throwaway proxy
    # image via a locally-built Dockerfile, on the same runner pool.
    name: Proxy standard-mode SNI routing simulation
    needs: [compute-validation-network, proxy-deep-wildcard-tls-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run proxy standard-mode SNI routing simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/proxy-standard-mode-sni-routing-simulation.sh

  proxy-ssl-mode-two-relay-dispatch-simulation:
    # What: test SSL-mode SNI two-relay dispatch.
    # Why: base has fix; chain for AG-CI-017.
    # From: Issue #1276
    name: Proxy SSL-mode two-relay dispatch simulation
    needs: [compute-validation-network, proxy-standard-mode-sni-routing-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run proxy SSL-mode two-relay dispatch simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          # What: reserves a collision-free subnet.
          # Why: replaces a hardcoded subnet with the flock.
          # From: Issue #822
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/proxy-ssl-mode-two-relay-dispatch-simulation.sh

  ui-nats-dns-integration-simulation:
    # Real UI -> NATS -> nats-subscriber -> PowerDNS integration test. Wiring
    # LANCACHE_IMAGE_TAG here is the direct fix for the inconsistency #715
    # calls out: the manual full-setup-validate.yml never passed its image_tag
    # through to this job, so it always tested "nightly" regardless of intent.
    name: UI/NATS/DNS integration simulation
    needs: [compute-validation-network, proxy-ssl-mode-two-relay-dispatch-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
      # See ssl-mitm-cache-simulation's identical block above for why the
      # full VALIDATION_SUBNET/*_IP/GATEWAY set (not just the project name)
      # is required for this job's own `docker compose up` call to actually
      # land on this run's derived, collision-free subnet.
      VALIDATION_SUBNET: ${{ needs.compute-validation-network.outputs.subnet }}
      VALIDATION_GATEWAY: ${{ needs.compute-validation-network.outputs.gateway }}
      VALIDATION_PROXY_IP: ${{ needs.compute-validation-network.outputs.proxy_ip }}
      VALIDATION_PROXY_SSL_IP: ${{ needs.compute-validation-network.outputs.proxy_ssl_ip }}
      VALIDATION_DNS_STANDARD_IP: ${{ needs.compute-validation-network.outputs.dns_standard_ip }}
      VALIDATION_DNS_SSL_IP: ${{ needs.compute-validation-network.outputs.dns_ssl_ip }}
      VALIDATION_WATCHDOG_IP: ${{ needs.compute-validation-network.outputs.watchdog_ip }}
      VALIDATION_NETDATA_IP: ${{ needs.compute-validation-network.outputs.netdata_ip }}
      VALIDATION_NATS_IP: ${{ needs.compute-validation-network.outputs.nats_ip }}
      VALIDATION_UI_IP: ${{ needs.compute-validation-network.outputs.ui_ip }}
      COMPOSE_PROJECT_NAME: ${{ needs.compute-validation-network.outputs.project_name }}
      VALIDATION_UI_PORT: ${{ needs.compute-validation-network.outputs.ui_port }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before compose.
      # Why: pulls nats/docker-socket-proxy docker.io.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
