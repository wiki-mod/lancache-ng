
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: consolidates full-setup validate/sim jobs.
# Why: single source; env leaks broke reserve retries.
# From: Issue #1014
name: Full-Setup Simulations (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag under test (dispatch input, PR staging tag, or channel tag).
        required: true
        type: string
      should_run:
        description: "'true' to run the suite; 'false' short-circuits every job."
        required: false
        default: "true"
        type: string
      pr_staging_available:
        description: "'true' when the PR's per-service staging tags exist (same-repo PR)."
        required: false
        default: "false"
        type: string
      build_tools_touched:
        description: "'true' when this PR changed tools/build-tools."
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  # What: derives a per-run subnet candidate + anchor.
  # Why: per-job flock+retry still does real reservation.
  # From: Issue #623
  compute-validation-network:
    name: derive per-run validation subnet
    if: inputs.should_run == 'true'
    # Stays light (not a stack-driving job): pure subnet/IP derivation via a
    # composite action, no Docker/compose stack of its own.
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 45
    outputs:
      subnet: ${{ steps.derive.outputs.subnet }}
      gateway: ${{ steps.derive.outputs.gateway }}
      proxy_ip: ${{ steps.derive.outputs.proxy_ip }}
      proxy_ssl_ip: ${{ steps.derive.outputs.proxy_ssl_ip }}
      dns_standard_ip: ${{ steps.derive.outputs.dns_standard_ip }}
      dns_ssl_ip: ${{ steps.derive.outputs.dns_ssl_ip }}
      watchdog_ip: ${{ steps.derive.outputs.watchdog_ip }}
      netdata_ip: ${{ steps.derive.outputs.netdata_ip }}
      nats_ip: ${{ steps.derive.outputs.nats_ip }}
      ui_ip: ${{ steps.derive.outputs.ui_ip }}
      standard_shim_ip: ${{ steps.derive.outputs.standard_shim_ip }}
      project_name: ${{ steps.derive.outputs.project_name }}
      ui_port: ${{ steps.derive.outputs.ui_port }}
    steps:
      - uses: &checkout_centraliced_versioning actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive validation network
        id: derive
        uses: ./.github/actions/derive-validation-network

  # What: superset of build-push.yml's shallow validate job.
  # Why: adds stack bring-up, health checks, client sim.
  full-setup-validate:
    name: validate full-setup image
    needs: compute-validation-network
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registries before stack pull.
      # Why: docker.io pulls anonymous without auth.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable build-tools image
        id: build-tools
        run: |
          set -euo pipefail
          build_tools_image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          case "$build_tools_image" in
            *@sha256:*) ;;
            *)
              echo "::error::Expected digest-qualified build-tools image, got '$build_tools_image'."
              exit 1
              ;;
          esac
          printf 'image=%s\n' "$build_tools_image" >> "$GITHUB_OUTPUT"

      - name: Validate compose configuration
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
          LANCACHE_IMAGE_REGISTRY: ghcr.io
          LANCACHE_IMAGE_PREFIX: wiki-mod/lancache-ng
        run: |
          set -euo pipefail
          : "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}"

          docker run --rm \
            -v "$PWD/deploy/full-setup:/validation:ro" \
            -w /validation \
            --env LANCACHE_IMAGE_REGISTRY \
            --env LANCACHE_IMAGE_PREFIX \
            --env LANCACHE_IMAGE_TAG \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 --signal=KILL 300 \
            docker compose -f docker-compose.yml config >/dev/null

      - name: Reserve a validation subnet and start the stack (locked, retries on collision)
        uses: ./.github/actions/reserve-validation-subnet-stack
        with:
          image-tag: ${{ inputs.image_tag }}

      - name: Wait for the stack to stabilize and check container health
        uses: ./.github/actions/wait-validation-stack-health

      - name: Run client simulation against the full-setup stack
        env:
          FULL_SETUP_CLIENT_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/full-setup-client-simulation.sh

      - name: Tear down full-setup validation stack
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true

          # `down` above can lose Docker's own "has active endpoints" race
          # (a container-removal API call can return before its network
          # endpoint is actually unwired -- confirmed for real in CI, see
          # validation_project_networks_teardown's own comment in
          # reserve-validation-subnet.sh) and silently leave this project's
          # network(s) non-empty, poisoning them for whichever job/run
          # reserves this slot next. Wait for and force a real removal
          # instead of trusting `down`'s own exit code.
          # shellcheck source=scripts/lib/reserve-validation-subnet.sh
          source "$GITHUB_WORKSPACE/scripts/lib/reserve-validation-subnet.sh"
          # This step runs unconditionally (`if: always()`), including when
          # the reserve composite failed before ever setting
          # COMPOSE_PROJECT_NAME -- under `set -u`, a bare "$COMPOSE_PROJECT_NAME"
          # would abort this whole step with "unbound variable" in exactly that
          # case. The safe-default form skips teardown when there is nothing to
          # tear down instead.
          if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
            validation_project_networks_teardown "$COMPOSE_PROJECT_NAME" || true
          fi

          # What: release host subnet lock from reserve.
          # Why: frees slot immediately, not at exit.
          # From: PR #1523
          if [[ -n "${VALIDATION_LOCK_HOLDER_PID:-}" ]]; then
            kill "$VALIDATION_LOCK_HOLDER_PID" 2>/dev/null || true
          fi

  ssl-mitm-cache-simulation:
    # What: real DNS/HTTP/HTTPS caching test.
    # Why: serialize runner; if: always() gate.
    # From: PR #1523
    name: SSL MITM cache simulation
    needs: [compute-validation-network, full-setup-validate]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
      # What: threads VALIDATION_SUBNET/*_IP via env.
      # Why: compose falls back to a fixed subnet else.
      # From: Issue #820
      VALIDATION_SUBNET: ${{ needs.compute-validation-network.outputs.subnet }}
      VALIDATION_GATEWAY: ${{ needs.compute-validation-network.outputs.gateway }}
      VALIDATION_PROXY_IP: ${{ needs.compute-validation-network.outputs.proxy_ip }}
      VALIDATION_PROXY_SSL_IP: ${{ needs.compute-validation-network.outputs.proxy_ssl_ip }}
      VALIDATION_DNS_STANDARD_IP: ${{ needs.compute-validation-network.outputs.dns_standard_ip }}
      VALIDATION_DNS_SSL_IP: ${{ needs.compute-validation-network.outputs.dns_ssl_ip }}
      VALIDATION_WATCHDOG_IP: ${{ needs.compute-validation-network.outputs.watchdog_ip }}
      VALIDATION_NETDATA_IP: ${{ needs.compute-validation-network.outputs.netdata_ip }}
      VALIDATION_NATS_IP: ${{ needs.compute-validation-network.outputs.nats_ip }}
      VALIDATION_UI_IP: ${{ needs.compute-validation-network.outputs.ui_ip }}
      # What: thread collision-safe IP for standard shim.
      # Why: only this job starts this service.
      # From: Issue #668
      VALIDATION_STANDARD_SHIM_IP: ${{ needs.compute-validation-network.outputs.standard_shim_ip }}
      COMPOSE_PROJECT_NAME: ${{ needs.compute-validation-network.outputs.project_name }}
      VALIDATION_UI_PORT: ${{ needs.compute-validation-network.outputs.ui_port }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before compose.
      # Why: compose pulls nats from docker.io.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: requires a published build-tools image.
        # Why: unless this PR's own build-tools is staged.
        id: build-tools-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          # What: pass inputs via env, not interpolation.
          # Why: OSPS-BR-01.04 script-injection hardening.
          # From: Issue #1130
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run SSL MITM cache simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          # What: reserves a free /27 slot via flock+retry.
          # Why: avoids racing concurrent runs on this host.
          # From: Issue #820
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/ssl-mitm-cache-simulation.sh

  proxy-deep-wildcard-tls-simulation:
    # What: TLS-handshake test for deep wildcard certs.
    # Why: chained to bound shared BuildKit contention.
    # From: Issue #1065
    name: Proxy deep-wildcard TLS simulation
    needs: [compute-validation-network, ssl-mitm-cache-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run proxy deep-wildcard TLS simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/proxy-deep-wildcard-tls-simulation.sh

  proxy-standard-mode-sni-routing-simulation:
    # What: TLS-handshake test for SNI passthrough.
    # Why: chained to bound shared BuildKit contention.
    # From: Issue #1297
    name: Proxy standard-mode SNI routing simulation
    needs: [compute-validation-network, proxy-deep-wildcard-tls-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run proxy standard-mode SNI routing simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/proxy-standard-mode-sni-routing-simulation.sh

  proxy-ssl-mode-two-relay-dispatch-simulation:
    # What: test SSL-mode SNI two-relay dispatch.
    # Why: base has fix; chain for AG-CI-017.
    # From: Issue #1276
    name: Proxy SSL-mode two-relay dispatch simulation
    needs: [compute-validation-network, proxy-standard-mode-sni-routing-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run proxy SSL-mode two-relay dispatch simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          # What: reserves a collision-free subnet.
          # Why: replaces a hardcoded subnet with the flock.
          # From: Issue #822
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/proxy-ssl-mode-two-relay-dispatch-simulation.sh

  ui-nats-dns-integration-simulation:
    # What: wires LANCACHE_IMAGE_TAG for this UI/DNS test.
    # Why: fixes always testing nightly, not the real tag.
    # From: Issue #715
    name: UI/NATS/DNS integration simulation
    needs: [compute-validation-network, proxy-ssl-mode-two-relay-dispatch-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
      # What: threads VALIDATION_SUBNET/*_IP via env.
      # Why: compose falls back to a fixed subnet else.
      # From: Issue #820
      VALIDATION_SUBNET: ${{ needs.compute-validation-network.outputs.subnet }}
      VALIDATION_GATEWAY: ${{ needs.compute-validation-network.outputs.gateway }}
      VALIDATION_PROXY_IP: ${{ needs.compute-validation-network.outputs.proxy_ip }}
      VALIDATION_PROXY_SSL_IP: ${{ needs.compute-validation-network.outputs.proxy_ssl_ip }}
      VALIDATION_DNS_STANDARD_IP: ${{ needs.compute-validation-network.outputs.dns_standard_ip }}
      VALIDATION_DNS_SSL_IP: ${{ needs.compute-validation-network.outputs.dns_ssl_ip }}
      VALIDATION_WATCHDOG_IP: ${{ needs.compute-validation-network.outputs.watchdog_ip }}
      VALIDATION_NETDATA_IP: ${{ needs.compute-validation-network.outputs.netdata_ip }}
      VALIDATION_NATS_IP: ${{ needs.compute-validation-network.outputs.nats_ip }}
      VALIDATION_UI_IP: ${{ needs.compute-validation-network.outputs.ui_ip }}
      COMPOSE_PROJECT_NAME: ${{ needs.compute-validation-network.outputs.project_name }}
      VALIDATION_UI_PORT: ${{ needs.compute-validation-network.outputs.ui_port }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before compose.
      # Why: pulls nats/docker-socket-proxy docker.io.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        # What: reads step inputs via env: variables.
        # Why: avoids script-injection (OSPS-BR-01.04).
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run UI/NATS/DNS integration simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          # What: reserves a collision-free subnet.
          # Why: avoids racing the job-level subnet pool.
          # From: Issue #820
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/ui-nats-dns-integration-simulation.sh

  setup-cli-simulation:
    # What: pins the sim to the PR's own immutable image.
    # Why: avoids testing a stale, slow-moving channel tag.
    # From: PR #786
    name: setup.sh CLI simulation
    # What: chains after the UI/NATS/DNS sim job.
    # Why: serializes the shared runner slot, not data.
    needs: [ui-nats-dns-integration-simulation]
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before setup.sh.
      # Why: container inherits config via mount.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: prefers the PR's staging build-tools tag.
        # Why: avoids silently falling back to latest.
        id: build-tools-image
        # What: reads step inputs via env: variables.
        # Why: avoids script-injection (OSPS-BR-01.04).
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image."
          else
            image="$(bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run setup.sh CLI simulation
        # What: bind-mount path matches host; locked.
        # Why: avoids the quickstart fixed-name collision.
        # From: Issue #1415
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
          # What: selects which images setup.sh installs.
          # Why: pins PR's own tag; else base channel.
          SETUP_SIM_IMAGE_CHANNEL: ${{ inputs.pr_staging_available == 'true' && 'pinned' || inputs.image_tag }}
          SETUP_SIM_IMAGE_TAG: ${{ inputs.pr_staging_available == 'true' && inputs.image_tag || '' }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/quickstart-compose-lock.sh
          source "scripts/lib/quickstart-compose-lock.sh"
          quickstart_compose_lock_acquire

          # What: mount docker login into container.
          # Why: compose calls run via host socket.
          # From: Issue #1095
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e SETUP_SIM_IMAGE_CHANNEL \
            -e SETUP_SIM_IMAGE_TAG \
            -v "$HOME/.docker:/root/.docker:ro" \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 --signal=KILL 1800 \
            bash scripts/untracked/simulations/setup-cli-simulation.sh

  dhcp-kea-lease-flow-simulation:
    # What: tests DHCP lease flow via this PR's Kea build.
    # Why: needs no staging tag; builds from this checkout.
    name: DHCP Kea lease-flow simulation
    needs: [setup-cli-simulation]
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Resolve build-tools image
        # What: omits BUILD_TOOLS_REQUIRE_PUBLISHED here.
        # Why: needs isc-dhcp-client for a PR-scoped image.
        id: build-tools-image
        # What: reads step inputs via env: variables.
        # Why: avoids script-injection (OSPS-BR-01.04).
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
          # What: require dhclient in smoke test.
          # Why: opt-in, not baseline in build-tools.
          # From: Issue #1095
          EXTRA_REQUIRED_TOOLS: dhclient
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image."
          else
            image="$(bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run DHCP Kea lease-flow simulation
        env:
          DHCP_LEASE_FLOW_CLIENT_IMAGE: ${{ steps.build-tools-image.outputs.image }}
          # What: builds services/dns Rust subscriber.
          # Why: matches repo's cargo build settings.
          PROJECT_CARGO_LTO: ${{ vars.PROJECT_CARGO_LTO }}
          PROJECT_CARGO_CODEGENUNIT: ${{ vars.PROJECT_CARGO_CODEGENUNIT }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/dhcp-kea-lease-flow-simulation.sh

  nats-auth-callout-simulation:
    # Real per-secondary NATS auth-callout integration test. Pulls the real
    # dns/ui/nats images (via the script), so it threads the PR staging tag to
    # test the PR's own secondary credentialing code.
    name: NATS auth-callout simulation
    needs: [compute-validation-network, dhcp-kea-lease-flow-simulation]
    if: >-
      always() &&
      inputs.should_run == 'true' &&
      needs['compute-validation-network'].result != 'failure' &&
      needs['compute-validation-network'].result != 'cancelled'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
      # What: threads VALIDATION_SUBNET/*_IP via env.
      # Why: compose falls back to a fixed subnet else.
      # From: Issue #820
      VALIDATION_SUBNET: ${{ needs.compute-validation-network.outputs.subnet }}
      VALIDATION_GATEWAY: ${{ needs.compute-validation-network.outputs.gateway }}
      VALIDATION_PROXY_IP: ${{ needs.compute-validation-network.outputs.proxy_ip }}
      VALIDATION_PROXY_SSL_IP: ${{ needs.compute-validation-network.outputs.proxy_ssl_ip }}
      VALIDATION_DNS_STANDARD_IP: ${{ needs.compute-validation-network.outputs.dns_standard_ip }}
      VALIDATION_DNS_SSL_IP: ${{ needs.compute-validation-network.outputs.dns_ssl_ip }}
      VALIDATION_WATCHDOG_IP: ${{ needs.compute-validation-network.outputs.watchdog_ip }}
      VALIDATION_NETDATA_IP: ${{ needs.compute-validation-network.outputs.netdata_ip }}
      VALIDATION_NATS_IP: ${{ needs.compute-validation-network.outputs.nats_ip }}
      VALIDATION_UI_IP: ${{ needs.compute-validation-network.outputs.ui_ip }}
      COMPOSE_PROJECT_NAME: ${{ needs.compute-validation-network.outputs.project_name }}
      VALIDATION_UI_PORT: ${{ needs.compute-validation-network.outputs.ui_port }}
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before compose.
      # Why: pulls nats/docker-socket-proxy docker.io.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: same build-tools resolution pattern.
        # Why: prefer PR staging tag for same-PR.
        # From: PR #1523
        id: build-tools-image
        # What: reads step inputs via env: variables.
        # Why: avoids script-injection (OSPS-BR-01.04).
        env:
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image instead of build-tools:latest."
          else
            image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run NATS auth-callout simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
        run: |
          set -euo pipefail
          # What: reserves a collision-free subnet first.
          # Why: avoids Pool-overlaps on concurrent runs.
          # From: Issue #820
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/nats-secondary-auth-callout-simulation.sh

