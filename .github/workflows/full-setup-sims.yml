# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
#
# Shared full-setup and integration simulation suite. Tests that exercise the
# stock full-setup topology run in one heavy job on one runner against one
# collision-reserved Compose project. Purpose-specific fixture topologies stay
# isolated and serialized after that shared stack is torn down.
name: Full-Setup Simulations (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag under test for normal callers and transport tag for stack-lock callers.
        required: true
        type: string
      should_run:
        description: "'true' runs the suite; 'false' short-circuits it."
        required: false
        default: "true"
        type: string
      pr_staging_available:
        description: "'true' when same-repository PR staging images exist."
        required: false
        default: "false"
        type: string
      build_tools_touched:
        description: "'true' when the caller changed tools/build-tools."
        required: false
        default: "false"
        type: string
      stack_lock_artifact:
        description: Same-run Actions artifact containing stack-lock.json. Empty preserves normal tag behavior.
        required: false
        default: ""
        type: string
      run_dns_zone_rollback:
        description: "'true' adds the live DNS zone rollback proof to the shared stack sequence."
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  shared-full-setup-stack:
    name: full-setup shared-stack simulations
    if: inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # This replaces six former 45-minute jobs and can optionally absorb one
    # additional rollback simulation. The cap remains below GitHub's default
    # while preserving the old per-test upper-bound budget in one serial job.
    timeout-minutes: 315
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
      LANCACHE_IMAGE_REGISTRY: ghcr.io
      LANCACHE_IMAGE_PREFIX: wiki-mod/lancache-ng
      FULL_SETUP_SHARED_STACK: "1"
      # The standard passthrough shim is part of the initial Compose model so
      # the SSL proof does not need a second `compose up` later in the suite.
      COMPOSE_PROFILES: ssl-mitm-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: lock
        name: Enable exact stack-lock Docker boundary
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}

      - id: build-tools
        name: Resolve validation build-tools identity
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "true"

      - name: Build full-setup validation image
        run: |
          set -euo pipefail
          source scripts/lib/build-retry.sh
          build_retry -- docker build \
            --build-arg LANCACHE_IMAGE_REGISTRY="$LANCACHE_IMAGE_REGISTRY" \
            --build-arg LANCACHE_IMAGE_PREFIX="$LANCACHE_IMAGE_PREFIX" \
            --build-arg LANCACHE_IMAGE_TAG="$LANCACHE_IMAGE_TAG" \
            -t lancache-ng-full-setup:validation \
            deploy/full-setup

      - name: Validate Compose configuration inside immutable build-tools
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/deploy/full-setup:/validation:ro" \
            -w /validation \
            --env LANCACHE_IMAGE_REGISTRY \
            --env LANCACHE_IMAGE_PREFIX \
            --env LANCACHE_IMAGE_TAG \
            --env COMPOSE_PROFILES \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 300 docker compose -f docker-compose.yml config >/dev/null

      - name: Reserve one validation subnet and start one shared stack
        uses: ./.github/actions/reserve-validation-subnet-stack
        with:
          image-tag: ${{ inputs.image_tag }}

      - name: Wait for shared stack stabilization and container health
        uses: ./.github/actions/wait-validation-stack-health

      - name: Verify initial passthrough shim is healthy
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          cid="$(docker compose ps -q standard-passthrough-shim)"
          [[ -n "$cid" ]] || {
            echo "::error::standard-passthrough-shim was not started with the initial shared stack."
            exit 1
          }
          status="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
          [[ "$status" == healthy ]] || {
            echo "::error::standard-passthrough-shim is not healthy (status: $status)."
            docker compose logs --no-color standard-passthrough-shim || true
            exit 1
          }

      - name: Run base client simulation
        env:
          FULL_SETUP_CLIENT_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/full-setup-client-simulation.sh

      - name: Run SSL MITM cache simulation on shared stack
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/ssl-mitm-cache-simulation.sh

      - name: Run UI/NATS/DNS integration simulation on shared stack
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/ui-nats-dns-integration-simulation.sh

      - name: Run DNS zone rollback simulation on shared stack
        if: inputs.run_dns_zone_rollback == 'true'
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/dns-zone-rollback-simulation.sh

      - name: Run setup.sh DNS reset simulation on shared stack
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/setup-reset-dns-config-simulation.sh

      - name: Run NATS auth-callout simulation on shared stack
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/nats-secondary-auth-callout-simulation.sh

      # This test deliberately recreates proxy into a crash loop and tears the
      # Compose project down in its EXIT trap, so it must remain the final test
      # that consumes the shared stack. The outer teardown below is idempotent.
      - name: Run Admin UI reachability during crash-loop simulation last
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/ui-reachability-crash-loop-simulation.sh

      - name: Tear down shared validation stack and release subnet lock
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true
          source "$GITHUB_WORKSPACE/scripts/lib/reserve-validation-subnet.sh"
          if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
            validation_project_networks_teardown "$COMPOSE_PROJECT_NAME" || true
          fi
          if [[ -n "${VALIDATION_LOCK_HOLDER_PID:-}" ]]; then
            kill "$VALIDATION_LOCK_HOLDER_PID" 2>/dev/null || true
          fi

      - name: Remove validation image
        if: always()
        run: docker rmi lancache-ng-full-setup:validation || true

  proxy-deep-wildcard-tls-simulation:
    name: Proxy deep-wildcard TLS simulation
    needs: shared-full-setup-stack
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "true"
      - name: Run proxy deep-wildcard TLS simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/proxy-deep-wildcard-tls-simulation.sh

  proxy-standard-mode-sni-routing-simulation:
    name: Proxy standard-mode SNI routing simulation
    needs: proxy-deep-wildcard-tls-simulation
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "true"
      - name: Run proxy standard-mode SNI routing simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/proxy-standard-mode-sni-routing-simulation.sh

  proxy-ssl-mode-two-relay-dispatch-simulation:
    name: Proxy SSL-mode two-relay dispatch simulation
    needs: proxy-standard-mode-sni-routing-simulation
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "true"
      - name: Run proxy SSL-mode two-relay dispatch simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/proxy-ssl-mode-two-relay-dispatch-simulation.sh

  setup-cli-simulation:
    name: setup.sh CLI simulation
    needs: proxy-ssl-mode-two-relay-dispatch-simulation
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "false"
      - name: Run setup.sh CLI simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
          SETUP_SIM_IMAGE_CHANNEL: ${{ inputs.pr_staging_available == 'true' && 'pinned' || inputs.image_tag }}
          SETUP_SIM_IMAGE_TAG: ${{ inputs.pr_staging_available == 'true' && inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          source scripts/lib/quickstart-compose-lock.sh
          quickstart_compose_lock_acquire
          lock_env=()
          if [[ -n "${CI_LOCKED_STACK_FILE:-}" ]]; then
            lock_env=(
              -e CI_LOCKED_STACK_FILE
              -e CI_LOCKED_DOCKER_SHIM_DIR
              -e BASH_ENV="$CI_LOCKED_BASH_ENV"
            )
          fi
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e SETUP_SIM_IMAGE_CHANNEL \
            -e SETUP_SIM_IMAGE_TAG \
            "${lock_env[@]}" \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 2400 bash scripts/setup-cli-simulation.sh

  dhcp-kea-lease-flow-simulation:
    name: DHCP Kea lease-flow simulation
    needs: setup-cli-simulation
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "false"
      - name: Run DHCP Kea lease-flow simulation
        env:
          DHCP_LEASE_FLOW_CLIENT_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/dhcp-kea-lease-flow-simulation.sh

  setup-reset-kea-config-simulation:
    name: setup.sh reset-to-last-known-good-config (Kea) simulation
    needs: dhcp-kea-lease-flow-simulation
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        uses: ./.github/actions/enable-locked-docker
        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "true"
      - name: Run setup.sh reset-to-last-known-good-config (Kea) simulation
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/setup-reset-kea-config-simulation.sh
