        with:
          artifact-name: ${{ inputs.stack_lock_artifact }}
      - id: build-tools
        uses: ./.github/actions/resolve-simulation-build-tools
        with:
          locked-image: ${{ steps.lock.outputs.build-tools-image }}
          pr-staging-available: ${{ inputs.pr_staging_available }}
          build-tools-touched: ${{ inputs.build_tools_touched }}
          image-tag: ${{ inputs.image_tag }}
          repository: ${{ github.repository }}
          require-published: "false"
      - name: Run DHCP Kea lease-flow simulation
        env:
          DHCP_LEASE_FLOW_CLIENT_IMAGE: ${{ steps.build-tools.outputs.image }}
        run: |
          set -euo pipefail
          bash scripts/dhcp-kea-lease-flow-simulation.sh

