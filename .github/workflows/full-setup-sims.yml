  setup-cli-simulation:
    # What: pins the sim to the PR's own immutable image.
    # Why: avoids testing a stale, slow-moving channel tag.
    # From: PR #786
    name: setup.sh CLI simulation
    # What: chains after the UI/NATS/DNS sim job.
    # Why: serializes the shared runner slot, not data.
    needs: [ui-nats-dns-integration-simulation]
    if: always() && inputs.should_run == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: authenticate registry before setup.sh.
      # Why: container inherits config via mount.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: prefers the PR's staging build-tools tag.
        # Why: avoids silently falling back to latest.
        id: build-tools-image
        # What: reads step inputs via env: variables.
        # Why: avoids script-injection (OSPS-BR-01.04).
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_STAGING_AVAILABLE: ${{ inputs.pr_staging_available }}
          BUILD_TOOLS_TOUCHED: ${{ inputs.build_tools_touched }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$PR_STAGING_AVAILABLE" == "true" && "$BUILD_TOOLS_TOUCHED" == "true" ]]; then
            image="ghcr.io/${REPOSITORY}/build-tools:${IMAGE_TAG}"
            echo "::notice::This PR touched tools/build-tools; using its confirmed staging image $image."
          else
            image="$(bash scripts/untracked/select-build-tools-image.sh)"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Run setup.sh CLI simulation
        # Mounted at the SAME absolute path inside the container as on the host
        # so docker compose bind-mount sources (resolved against the HOST
        # daemon) match; see full-setup-validate.yml's identical step comment.
        # --network host: also required here for the same reason as that
        # step -- setup.sh's update-flow health gate curls the stack's own
        # loopback-published addresses (127.0.0.x), which are per-network-
        # namespace and otherwise unreachable from this sibling container.
        #
        # flock: see full-setup-validate.yml's identical step comment for the
        # full finding -- this job installs a real quickstart stack against
        # deploy/quickstart/docker-compose.yml. Historically (issue #838)
        # that compose file pinned FIXED container names (lancache-nats,
        # lancache-ui, ...), not project-name-scoped, so two runs of this job
        # landing on the same physical runner host (this repo's runners are
        # registered several-per-host, sharing one Docker daemon) collided.
        # The `needs:` chain onto ui-nats-dns-integration-simulation above
        # only serializes jobs *within this one workflow run*; it does
        # nothing for two different PRs' runs overlapping, which is what
        # actually happened.
        #
        # UPDATE (issue #1415): the compose file's container names are no
        # longer literally fixed -- every `container_name:` now carries
        # `${LANCACHE_CONTAINER_SUFFIX:-}`, and this job exports a real
        # per-run suffix (plus a per-run loopback IP pair via
        # setup-cli-simulation.sh's own sim_ip_octet()). That does NOT make
        # this lock unnecessary: both this job's and syslog-forwarding-
        # simulation.sh's per-run uniqueness still comes from a
        # `cksum ... % 200` hash of a run-scoped string, a ~200-value space
        # in which a same-host collision between two concurrent runs of the
        # SAME script remains a real, non-negligible probability at this
        # project's confirmed multi-runner-per-host concurrency -- see
        # scripts/lib/quickstart-compose-lock.sh's own header for the full,
        # current rationale (kept in sync with this comment).
        #
        # The lock itself now comes from scripts/lib/quickstart-compose-lock.sh
        # (issue #838) -- see that file's header for why it must be `source`d
        # rather than executed, and why its lock path is a single shared
        # constant rather than a per-caller argument.
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build-tools-image.outputs.image }}
          # Which images setup.sh installs (see setup-cli-simulation.sh for the
          # full rationale). Same-repo PR: pin the PR's own immutable
          # pr-<N>-sha tag (plan.image_tag) so the gate tests THIS PR's code and
          # can never go stale. Otherwise (dispatch/fork/Dependabot, where
          # image_tag is already a channel word): install the base-ref channel
          # -- resolved by plan, never hardcoded nightly -- which also keeps
          # setup.sh's channel->stack-pointer->sha resolution path covered.
          SETUP_SIM_IMAGE_CHANNEL: ${{ inputs.pr_staging_available == 'true' && 'pinned' || inputs.image_tag }}
          SETUP_SIM_IMAGE_TAG: ${{ inputs.pr_staging_available == 'true' && inputs.image_tag || '' }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/quickstart-compose-lock.sh
          source "scripts/lib/quickstart-compose-lock.sh"
          quickstart_compose_lock_acquire

          # What: mount docker login into container.
          # Why: compose calls run via host socket.
          # From: Issue #1095
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e SETUP_SIM_IMAGE_CHANNEL \
            -e SETUP_SIM_IMAGE_TAG \
            -v "$HOME/.docker:/root/.docker:ro" \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 --signal=KILL 1800 \
            bash scripts/untracked/simulations/setup-cli-simulation.sh

  dhcp-kea-lease-flow-simulation:
