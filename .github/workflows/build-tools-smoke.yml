permissions:
  contents: read

# Cheap, read-only job: unlike build-tools.yml (which must survive to
# completion once it starts publishing mutable/immutable tags), a superseded
# run here has written nothing shareable yet, so reclaiming its runner slot
# for a newer push/PR update is pure benefit. Scoped per-workflow-per-ref, the
# same shape as build-tools.yml's own pull_request group.
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bats-shellspec-smoke:
    # Light tier, not heavy (#1253 design decision): this job never builds an
    # image -- it pulls an already-published, already-smoke-tested digest
    # (scripts/select-build-tools-image.sh with BUILD_TOOLS_REQUIRE_PUBLISHED=
    # true, the same strict pull-only mode build-push.yml's validate-compose
    # job already uses on lancache-light for the identical reason: "this job
    # runs on the light tier, so it must not trigger the selector's
    # trusted-ref fallback Docker build"). Running `bats tests/bats` and
    # `shellspec tests/shellspec` inside a `docker run` of that pulled image
    # is pure shell-script execution, no compilation and no BuildKit/Trivy
    # work, so it fits the light tier's "lightweight static checks" contract
    # (AG-CI-002) rather than the heavy tier's Docker-build/CodeQL/
    # container-scan one.
    name: run bats/shellspec suites against the published build-tools image
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs are expected to be dominated by the image pull (a few tens of
    # seconds on a warm runner) plus the two suites themselves (bounded by
    # build-tools.yml's own identical steps, each given 20 minutes there);
    # generous headroom for a cold pull under concurrent load.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx for manifest inspection
        # select-build-tools-image.sh's published_image_reference() resolves
        # the channel tag to its immutable digest via `docker buildx
        # imagetools inspect` -- same requirement, same step shape, as
        # build-push.yml's validate-compose job.
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select published build-tools image
        id: select-image
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          # Authenticated pulls avoid GHCR's much lower anonymous rate limit
          # under concurrent CI load -- same fix, same reasoning, as
          # validate-compose's identical env block in build-push.yml (that
          # job hit a real "denied: denied" failure during a burst of
          # concurrent runs before this was added).
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # BUILD_TOOLS_REQUIRE_PUBLISHED=true forces the strict pull-only
          # path (no local Docker build fallback, ever) -- required on this
          # light-tier job for the same reason validate-compose's own
          # comment states: a local fallback build would be the very
          # heavy-tier work this split exists to avoid.
          image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/select-build-tools-image.sh)"
          case "$image" in
            *@sha256:*)
              ;;
            *)
              echo "::error::Expected a digest-qualified build-tools image from the published build-tools selector, got '$image'."
              exit 1
              ;;
          esac
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      # Mirrors build-tools.yml's identically-named step exactly, against
      # the pulled published image instead of a freshly built local one --
      # same command, same suite, same regression coverage.
      - name: Run Bats setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -lc 'set -euo pipefail; bats tests/bats'

      # Mirrors build-tools.yml's identically-named step exactly.
      - name: Run ShellSpec setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -lc 'set -euo pipefail; shellspec --shell bash tests/shellspec'
