
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: runs bats/shellspec against published build-tools
# Why: split from build-tools.yml to avoid full rebuilds
# From: Issue #1253 | PR #1501
name: Build Tools Smoke Tests

on:
  # What: legacy CI frozen on the #1683 rewrite branch.
  # Why: stop the old pipeline building containers here.
  # From: Issue #1683
  workflow_dispatch: {}
# What: grants only read access to repository contents
# Why: job never writes, so applies least privilege
# From: PR #1501
permissions:
  contents: read

# What: cancels a superseded run for the same workflow+ref
# Why: read-only job hasn't published, so canceling is safe
# From: PR #1501
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bats-shellspec-smoke:
    # What: runs on the light tier, not heavy
    # Why: pulls digest and runs suites per light tier contract
    # From: PR #1501
    name: run bats/shellspec suites against the published build-tools image
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # What: sets a generous timeout well above observed runtime
    # Why: headroom covers image pull and test suites under load
    # From: PR #1501
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: sets up Docker Buildx for manifest inspection
      # Why: resolves channel tag to digest via buildx imagetools
      # From: PR #1501
      - name: Set up Docker Buildx for manifest inspection
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # What: authenticates published-image pull with credentials
      # Why: avoids GHCR's lower anonymous rate limit under CI load
      # From: PR #1501
      - name: Select published build-tools image
        id: select-image
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # What: sets BUILD_TOOLS_REQUIRE_PUBLISHED=true
          # Why: forces strict pull-only path for this light-tier job
          # From: PR #1501
          image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          case "$image" in
            *@sha256:*)
              ;;
            *)
              echo "::error::Expected a digest-qualified build-tools image from the published build-tools selector, got '$image'."
              exit 1
              ;;
          esac
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      # What: mirrors identically-named step against published image
      # Why: light-tier job must stay pull-only, never build locally
      # From: PR #1501
      - name: Run Bats setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # What: runs with init process as container PID 1
          # Why: without PID-1 reaper, zombie processes remain alive
          # From: Issue #1522 | PR #1523
          #
          # What: kill-timeout guards a signal-deaf in-container hang.
          # Why: SIGTERM to docker run alone cannot reach it (AG-CI-016).
          # From: Issue #1781 | PR #1783
          #
          # What: exit code captured explicitly, not left to set -e.
          # Why: surfaces the real code (AG-INT-002), not a generic message.
          # From: Issue #1781 | PR #1783
          set +e
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 --signal=KILL 1000 \
            bash -lc 'set -euo pipefail; bats tests/bats'
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::docker run (bats tests/bats) exited $status. 124/137 means the AG-CI-016 kill-timeout fired (a hung/signal-deaf process); any other code with no preceding 'not ok' line means the failure is in the wrapper/container lifecycle itself, not an individual test -- see the streamed output above for whatever bats/the shell did print."
            exit "$status"
          fi

      # What: mirrors identically-named ShellSpec step
      # Why: keeps light-tier job pull-only and consistent
      # From: PR #1501
      - name: Run ShellSpec setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # What: uses init-as-PID-1 container like Bats step
          # Why: keeps fixture runners on same lifecycle contract
          # From: Issue #1522 | PR #1523
          #
          # What: kill-timeout guards a signal-deaf in-container hang.
          # Why: SIGTERM to docker run alone cannot reach it (AG-CI-016).
          # From: Issue #1781 | PR #1783
          #
          # What: exit code captured explicitly, not left to set -e.
          # Why: surfaces the real code (AG-INT-002), not a generic message.
          # From: Issue #1781 | PR #1783
          set +e
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 --signal=KILL 1000 \
            bash -lc 'set -euo pipefail; shellspec --shell bash tests/shellspec'
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::docker run (shellspec) exited $status. 124/137 means the AG-CI-016 kill-timeout fired (a hung/signal-deaf process); any other code with no preceding failing-example line means the failure is in the wrapper/container lifecycle itself -- see the streamed output above for whatever shellspec/the shell did print."
            exit "$status"
          fi
