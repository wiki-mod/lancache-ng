      # From: PR #1501.
      - "services/proxy/public_suffix_list.dat"
      - "services/ui/docker-entrypoint.sh"
      - "services/netdata/Dockerfile"
      # What: lists services/syslog/netdata-web_log.conf.
      # Why: tests/bats/check_logging_matrix_weblog_parity.bats reads this
      # file directly to assert byte-parity with
      # deploy/quickstart/docker-compose.yml's inline copy (issue #879).
      # From: PR #1501.
      - "services/syslog/netdata-web_log.conf"
      - "deploy/prod/docker-compose.yml"
      - "deploy/quickstart/docker-compose.yml"
      # What: lists deploy/secondary/docker-compose.yml.
      # Why: tests/bats/setup_secondary_docker_compose.bats's
      # cmd_secondary heredoc sync-guard uses this as its checked-in
      # reference file (issue #946).
      # From: PR #1501.
      - "deploy/secondary/docker-compose.yml"
      # What: lists deploy/full-setup/docker-compose.yml.
      # Why: tests/bats/watchdog_docker_socket_proxy_startup_dependency.bats
      # reads this file directly.
      # From: PR #1501.
      - "deploy/full-setup/docker-compose.yml"
