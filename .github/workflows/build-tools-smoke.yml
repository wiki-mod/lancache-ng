# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# Runs repository shell regression suites against the already-published,
# digest-qualified build-tools image. This workflow never builds or publishes
# an image, so superseded runs are safe to cancel and no self-hosted state is
# required.
name: Build Tools Smoke Tests

on:
  push:
    branches: [master, current_dev, v0.2.0]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "certs/**"
      - "config/**"
      - "deploy/**"
      - "release/**"
      - "scripts/**"
      - "services/**"
      - "setup.sh"
      - "tests/**"
      - "tools/runner-host/**"
  pull_request:
    branches: [master, current_dev, v0.2.0]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "certs/**"
      - "config/**"
      - "deploy/**"
      - "release/**"
      - "scripts/**"
      - "services/**"
      - "setup.sh"
      - "tests/**"
      - "tools/runner-host/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bats-shellspec-smoke:
    name: run bats/shellspec suites against the published build-tools image
    # The job only performs registry reads and containerized shell tests. It
    # has no LAN, persistent-cache, or host-local-state requirement, so keeping
    # it on the scarce self-hosted light pool only turns local runner failures
    # into unrelated regression-test failures.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx for manifest inspection
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select published build-tools image
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/select-build-tools-image.sh)"
          case "$image" in
            *@sha256:*) ;;
            *)
              echo "::error::Expected a digest-qualified published build-tools image, got '$image'."
              exit 1
              ;;
          esac
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Run Bats setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 1200 bash -lc 'set -euo pipefail; bats tests/bats'

      - name: Run ShellSpec setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 1200 bash -lc 'set -euo pipefail; shellspec --shell bash tests/shellspec'
