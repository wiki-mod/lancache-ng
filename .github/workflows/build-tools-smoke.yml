
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: runs the tests/bats and tests/shellspec fixture suites against the
# already-published build-tools image (pulled via
# scripts/select-build-tools-image.sh) -- never builds or publishes
# anything itself.
# Why: split out of build-tools.yml so a test/script-only change gets full
# regression coverage without forcing a full multi-arch image rebuild on
# scarce lancache-heavy capacity; scripts/check-bats-path-filter-coverage.sh
# targets this file's own path filters as the workflow that actually
# executes both suites against a real dependency change (issue #1253/#1255,
# #879). build-tools.yml still runs the same two suites too, but only
# against the local image it just built on its own now-narrow trigger --
# that is a smoke test of the freshly built image itself, not a
# regression gate for test/script changes, so it is not a duplicate of
# this workflow.
# From: PR #1501.
name: Build Tools Smoke Tests

on:
  push:
    # What: mirrors build-tools.yml's own branches list.
    # Why: current_dev is the active development branch; v0.2.0 stays
    # listed as the frozen long-lived hotfix branch (issue #709).
    # From: PR #1501.
    branches: [master, current_dev, v0.2.0]
    paths:
      - ".github/workflows/build-tools-smoke.yml"
      - "certs/generate-ca.sh"
      - "tests/bats/**"
      - "tests/shellspec/**"
      - "tests/fixtures/**"
      - "setup.sh"
      - "scripts/check-idempotence-test-coverage.sh"
      - "scripts/check-validation-subnet-wrapper-coverage.sh"
