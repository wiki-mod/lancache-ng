      # From: PR #1501.
      - "services/watchdog/retention.sh"
      # What: lists services/proxy/public_suffix_list.dat.
      # Why: tests/bats/proxy_registrable_domain.bats points
      # PUBLIC_SUFFIX_LIST_FILE at this real vendored data file, so a PSL
