      # What: lists scripts/setup-cli-simulation.sh and
      # scripts/syslog-forwarding-simulation.sh.
      # Why: both are real tests/bats/healthcheck_service_lists.bats
      # dependencies.
      # From: PR #1501.
      - "scripts/setup-cli-simulation.sh"
      - "scripts/syslog-forwarding-simulation.sh"
      # What: lists scripts/gc-pr-staging-images.sh.
      # Why: tests/bats/gc_pr_staging_images.bats sources it directly, and
      # it is not under scripts/lib/, which is already covered; without
      # this entry that suite would never run for a change to only this
      # script (issue #1095).
      # From: PR #1501.
      - "scripts/gc-pr-staging-images.sh"
