      # From: PR #1501.
      - "services/proxy/conf.d/http.conf"
      - "services/proxy/conf.d/https.conf"
      - "services/proxy/proxy-params.conf"
      - "services/watchdog/watchdog.sh"
      - "services/watchdog/healthcheck.sh"
      # What: lists services/watchdog/retention.sh.
      # Why: its own bats coverage (tests/bats/retention_*.bats) sources it
