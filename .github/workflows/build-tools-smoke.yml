# What: grants only read access to repository contents.
# Why: this job never writes to the repo or registry, so no broader scope
# is requested (least privilege).
# From: PR #1501.
permissions:
  contents: read

# What: cancels a superseded run for the same workflow+ref.
# Why: unlike build-tools.yml (which must finish once it starts publishing
# tags), this read-only job has published nothing yet, so canceling is safe.
# From: PR #1501.
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bats-shellspec-smoke:
    # What: runs on the light tier, not heavy.
    # Why: pulls an already-built, already-smoke-tested digest and runs two
    # suites -- pure shell execution, fitting the light tier's contract (AG-CI-002).
    # From: PR #1501.
    name: run bats/shellspec suites against the published build-tools image
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # What: sets a generous timeout well above real observed runtime.
    # Why: real runs are dominated by the image pull (seconds on a warm
    # runner) plus the two suites; this headroom covers a cold pull under
    # concurrent load.
    # From: PR #1501.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: sets up Docker Buildx for manifest inspection.
      # Why: the image selector resolves a channel tag to its digest via
      # `docker buildx imagetools inspect`, same as build-push.yml's validate-compose.
      # From: PR #1501.
      - name: Set up Docker Buildx for manifest inspection
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # What: authenticates the published-image pull with GHCR_RETRY_USERNAME/PASSWORD.
      # Why: avoids GHCR's much lower anonymous rate limit under concurrent
      #   CI load, the same fix as validate-compose's identical env block
      #   in build-push.yml.
      # From: PR #1501
      - name: Select published build-tools image
        id: select-image
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # What: sets BUILD_TOOLS_REQUIRE_PUBLISHED=true.
          # Why: forces the strict pull-only path (no local Docker build
          # fallback) on this light-tier job -- a local fallback build
          # would be the very heavy-tier work this split exists to avoid.
          # From: PR #1501.
          image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          case "$image" in
            *@sha256:*)
              ;;
            *)
              echo "::error::Expected a digest-qualified build-tools image from the published build-tools selector, got '$image'."
              exit 1
              ;;
          esac
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      # What: mirrors build-tools.yml's identically-named step against the pulled published image.
      # Why: this light-tier job must stay pull-only and never build locally.
      # From: PR #1501
      - name: Run Bats setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # What: runs with an init process as container PID 1.
          # Why: without a PID-1 reaper, the lock-holder subprocess
          # tests/bats/reserve_validation_subnet.bats kills becomes a
          # permanent zombie that `kill -0` still reports as alive.
          # From: Issue #1522 | PR #1523
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -lc 'set -euo pipefail; bats tests/bats'

      # What: mirrors build-tools.yml's identically-named ShellSpec step.
      # Why: keeps this light-tier job pull-only, consistent with the Bats
      #   step above.
      # From: PR #1501
      - name: Run ShellSpec setup fixtures
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # What: uses the same init-as-PID-1 container setting as the Bats step above.
          # Why: keeps both fixture runners on the same resource-lifecycle contract.
          # From: Issue #1522 | PR #1523
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -lc 'set -euo pipefail; shellspec --shell bash tests/shellspec'
