      - ".github/workflows/full-setup-sims.yml"
      - ".github/actions/derive-validation-network/action.yml"
      - ".github/actions/wait-validation-stack-health/action.yml"
      # What: lists individual files under services/, not
      # "services/<name>/**" wildcards.
      # Why: each service directory also holds a Dockerfile and other
      # non-bats-relevant assets; scripts/check-bats-path-filter-coverage.sh
      # (#879) is the source of truth for which files below are real bats
      # dependencies and keeps this list in sync automatically -- re-run it
      # after touching this list (issue #1198, #873).
      # From: PR #1501.
      #
      # What: lists check-idempotence-test-coverage.sh,
      # check-validation-subnet-wrapper-coverage.sh, and
      # check-bats-path-filter-coverage.sh individually.
      # Why: each guard's own fixture suite is what proves that specific
      # guard catches a real regression, not just that it currently passes
      # against today's tree; without the entry, a PR touching only the
      # guard script would not match tests/bats/** (#732).
      # From: PR #1501.
      #
      # What: lists build-push.yml, full-setup-validate.yml,
      # full-setup-deep-validate.yml, and derive-validation-network's
      # action.yml.
      # Why: three bats suites assert cross-file content agreement between
      # these files (healthcheck service lists, validation-image-tag reuse,
      # reserve-validation-subnet reuse) that shellcheck cannot catch, since
      # it only validates shell syntax (#879).
      # From: PR #1501.
      #
      # What: lists full-setup-sims.yml and wait-validation-stack-health's
      # action.yml.
      # Why: issue #1112 moved shared full-setup jobs into this reusable
      # workflow/composite action without updating this filter, so two bats
      # suites failed deterministically against current_dev until issue
      # #1171 fixed both the tests and this list together.
      # From: PR #1501.
      #
      # What: lists tools/runner-host/lancache-ci-docker-daemon-config.sh.
      # Why: its own fixture suite sources this script directly; without
      # the entry, a PR touching only this script would not match any
      # other path above (issue #1255).
      # From: PR #1501.
      - "tools/runner-host/lancache-ci-docker-daemon-config.sh"
