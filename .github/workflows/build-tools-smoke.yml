# What: runs tests/bats + tests/shellspec against the already-published build-tools image only.
# Why: split from build-tools.yml so a script/test-only change gets full
#   regression coverage without a wasteful full multi-arch rebuild.
# From: Issue #1253 | Issue #1255 | PR #1501 | Issue #1095
name: Build Tools Smoke Tests

on:
  push:
    # What: mirrors build-tools.yml's own branches list.
    # Why: current_dev is the active development branch; v0.2.0 stays
    # listed as the frozen long-lived hotfix branch (issue #709).
    # From: PR #1501.
    branches: [master, current_dev, v0.2.0]
    # What: every entry below mirrors scripts/tracked/check-bats-path-filter-coverage.sh's own bats/shellspec dependency scan.
    # Why: that script is the authoritative source for exactly which files
    #   are real test dependencies; treat it (not this list) as truth, and
    #   re-run it after touching this list.
    # From: Issue #1095 | PR #1501
    paths:
      - ".github/workflows/build-tools-smoke.yml"
      - "certs/generate-ca.sh"
      - "tests/bats/**"
      - "tests/shellspec/**"
      - "tests/fixtures/**"
