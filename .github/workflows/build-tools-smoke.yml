
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: runs tests/bats + tests/shellspec against the already-published
# build-tools image (pulled via scripts/untracked/select-build-tools-image.sh);
# never builds or publishes anything itself.
# Why: split from build-tools.yml so a test/script-only
# change gets full regression coverage without a wasteful full multi-arch
# rebuild; scripts/tracked/check-bats-path-filter-coverage.sh now
# targets THIS file's own path list, not build-tools.yml's.
# From: Issue #1253 | Issue #1255 | PR #1501.
name: Build Tools Smoke Tests

