
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: opt-in, maintainer-dispatched GitHub-hosted overflow build/scan/merge path.
# Why: self-hosted lancache-heavy stays the default; this only covers a
#   self-hosted outage (workflow_dispatch only, never push/PR).
# From: Issue #686
name: Build & Push (GitHub-hosted overflow fallback)

on:
  workflow_dispatch:
    inputs:
      use_hosted_fallback:
        description: >-
          Must be "yes" to actually run. This is an explicit maintainer-invoked
          overflow path for a self-hosted lancache-heavy outage, not a routine
          CI job -- see this workflow file's header comment.
        type: choice
        options: ["no", "yes"]
        default: "no"
      services:
        description: >-
          Comma-separated subset of proxy,dns,watchdog,dhcp,dhcp-proxy,ntp,syslog,ui,build-tools,utilities
          to build, or "all".
        required: false
        default: all
      merge_manifest:
        description: >-
          After the amd64 build, merge it with build-arm64's existing arm64
          tag into the real multi-platform sha-<commit> tag.
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    # What: gates the run, then builds the service matrix for later jobs.
    # Why: a plain workflow_dispatch click with the default "no" must not
    #   silently build/push; resolves the same digest-pinned build-tools
    #   image build-push.yml's own validate-compose job resolves.
    # From: Issue #686
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_tools_image: ${{ steps.select-image.outputs.build_tools_image }}
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Require explicit opt-in
        env:
          USE_HOSTED_FALLBACK: ${{ inputs.use_hosted_fallback }}
        run: |
          set -euo pipefail
          if [ "$USE_HOSTED_FALLBACK" != "yes" ]; then
            echo "::error::use_hosted_fallback must be explicitly set to 'yes' to run this overflow workflow. This is not a routine CI job -- see this workflow file's header comment."
            exit 1
          fi
          echo "::notice::Hosted overflow fallback explicitly confirmed by dispatching operator."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: sets up the builder select-build-tools-image.sh needs below.
      # Why: its imagetools inspect call requires a configured builder.
      # From: Issue #686
      - name: Set up Docker Buildx
        id: buildx
        uses: ./.github/actions/buildx-setup-retry

      - name: Resolve build-tools image
        id: select-image
        run: |
          set -euo pipefail
          build_tools_image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          case "$build_tools_image" in
            *@sha256:*)
              ;;
            *)
              echo "::error::Expected a digest-qualified build-tools image, got '$build_tools_image'."
              exit 1
              ;;
          esac
          printf 'build_tools_image=%s\n' "$build_tools_image" >> "$GITHUB_OUTPUT"

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Compute service matrix
        id: services
        env:
          SERVICES_INPUT: ${{ inputs.services }}
        run: |
          set -euo pipefail

          # What: service context/build-context/description tables below.
          # Why: kept in sync by hand with build-push.yml's own matrix.include
          #   list; GitHub Actions has no cross-workflow YAML include mechanism.
          # From: Issue #686
          declare -A contexts=(
            [proxy]=services/proxy
            [dns]=services/dns
            [watchdog]=services/watchdog
            [dhcp]=services/dhcp
            [dhcp-proxy]=services/dhcp-proxy
            [ntp]=services/ntp
            [syslog]=services/syslog
            [ui]=services/ui
            [build-tools]=tools/build-tools
            [utilities]=services/utilities
          )
          declare -A build_contexts=(
            [proxy]="dns-domains=services/dns"
            [dns]=""
            [watchdog]=""
            [dhcp]=""
            [dhcp-proxy]=""
            [ntp]=""
            [syslog]=""
            [ui]=""
            [build-tools]=""
            [utilities]=""
          )
          declare -A descriptions=(
            [proxy]="nginx-based lancache-ng caching proxy for standard and TLS-interception cache traffic."
            [dns]="PowerDNS recursor, authoritative DNS, and NATS subscriber service for lancache-ng cache routing."
            [watchdog]="lancache-ng watchdog helper for runtime health checks and recovery hooks."
            [dhcp]="Kea DHCP, control-agent, and DHCP-DDNS service for lancache-ng managed networks."
            [dhcp-proxy]="dnsmasq-based DHCP proxy and relay helper for lancache-ng deployments."
            [ntp]="chrony-based NTP server for lancache-ng, disciplined against public NTP servers and serving LAN clients on UDP/123."
            [syslog]="Combined fluent-bit + syslog-ng first-party central logging service for lancache-ng (issue #1428)."
            [ui]="lancache-ng Admin UI and control-plane service for cache, DNS, DHCP, and secondary management."
            [build-tools]="Prebuilt lancache-ng CI and developer validation toolchain image."
            [utilities]="Shared lancache-ng utilities image (curl, nano, lsof, ripgrep, findutils, coreutils, gettext-envsubst, jq, ca-certificates, zstd) for COPY --from= consumption by other first-party images (issue #1556)."
          )

          if [ "$SERVICES_INPUT" = "all" ] || [ -z "$SERVICES_INPUT" ]; then
            selected=(proxy dns watchdog dhcp dhcp-proxy ntp syslog ui build-tools utilities)
          else
            IFS=',' read -ra selected <<< "$SERVICES_INPUT"
          fi

          rows="[]"
          for raw in "${selected[@]}"; do
            svc="$(printf '%s' "$raw" | xargs)"
            [ -z "$svc" ] && continue
            if [ -z "${contexts[$svc]+set}" ]; then
              echo "::error::Unknown service '$svc'. Valid services: ${!contexts[*]}."
              exit 1
            fi
            row="$(jq -n \
              --arg service "$svc" \
              --arg context "${contexts[$svc]}" \
              --arg build_contexts "${build_contexts[$svc]}" \
              --arg description "${descriptions[$svc]}" \
              '{service: $service, context: $context, build_contexts: $build_contexts, description: $description}')"
            rows="$(printf '%s' "$rows" | jq --argjson row "$row" '. + [$row]')"
          done

          if [ "$(printf '%s' "$rows" | jq 'length')" -eq 0 ]; then
            echo "::error::No valid services selected; 'services' input resolved to an empty set."
            exit 1
          fi

          echo "::notice::Building services: $(printf '%s' "$rows" | jq -c '[.[].service]')"
          printf 'matrix=%s\n' "$(printf '%s' "$rows" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build-hosted-fallback:
    # What: single build/push/scan job, no separate local-scan-only pre-build.
    # Why: the digest scanned below is the exact same digest that gets
    #   pushed, attested, and published.
    # From: Issue #1522 | PR #1523
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      BUILD_TOOLS_IMAGE: ${{ needs.preflight.outputs.build_tools_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: uses the retried builder-setup variant, not the plain action.
      # Why: this fresh hosted VM has no local image cache, the same
      #   Docker Hub rate-limit exposure build-arm64 hit.
      # From: Issue #930
      - name: Set up Docker Buildx
        id: buildx
        uses: ./.github/actions/buildx-setup-retry

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-amd64

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: matrix.service == 'build-tools'
        run: |
          set -euo pipefail
          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }
          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      # What: adds the two ::notice:: lines this step's build-push.yml sibling already has.
      # Why: this copy silently resolved parallelism with no build-log trace of the value or
      # its source (explicit vs. auto-detected) -- the same silent-decision-point class as
      # issue #1095 G15's checkout guard, found via a repo-wide pattern search for it.
      # From: Issue #1095 (G15), PR #1640
      - name: Compute Docker build parallelism
        id: docker-build-jobs
        run: |
          set -euo pipefail
          if [ -n "${CARGO_BUILD_JOBS:-}" ]; then
            case "$CARGO_BUILD_JOBS" in
              ''|*[!0-9]*) echo "::error::CARGO_BUILD_JOBS must be a positive integer."; exit 1 ;;
            esac
            [ "$CARGO_BUILD_JOBS" -gt 0 ] || { echo "::error::CARGO_BUILD_JOBS must be greater than zero."; exit 1; }
            jobs="$CARGO_BUILD_JOBS"
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from repository variable for Docker builds."
          else
            detected_cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
            jobs=$((detected_cores - 2))
            [ "$jobs" -ge 4 ] || jobs=4
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from $detected_cores detected cores for Docker builds."
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      # What: builds and pushes a single-platform (amd64) candidate image.
      # Why: forces oci-mediatypes so the later imagetools merge with
      #   build-arm64's arm64 leg does not silently drop the description
      #   annotation (build-push.yml's equivalent step has the full rationale).
      # From: Issue #620 | Issue #1522 | PR #1523
      - name: Build and push candidate once
        id: build
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: |
            BUILD_TOOLS_IMAGE=${{ env.BUILD_TOOLS_IMAGE }}
            CARGO_BUILD_JOBS=${{ steps.docker-build-jobs.outputs.jobs }}
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=${{ matrix.description }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.rust.digest={0}', steps.build-tools-base-digests.outputs.rust) || '' }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.golang.digest={0}', steps.build-tools-base-digests.outputs.golang) || '' }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}-amd64-hosted-fallback
          cache-to: type=gha,scope=${{ matrix.service }}-amd64-hosted-fallback,mode=max

      - name: Smoke-test exact build-tools candidate digest
        if: matrix.service == 'build-tools'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/build-tools@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          run-fixtures: "true"

      # What: scans the just-pushed candidate digest with a 50-minute bound.
      # Why: trivy-scan-retry can run up to 4 attempts; the timeout must
      #   cover the worst case.
      # From: Issue #1535
      - name: Scan the exact pushed candidate digest
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          # What: passes the same unconditional Docker Hub credential pair.
          # Why: an unauthenticated first-choice vulnerability-DB mirror
          #   caused real CI failures.
          # From: Issue #1535
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ runner.temp }}/trivy-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          cleanup-cache: "true"

      - name: Attest image build provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}

      # What: assembles the real multi-platform tag from this job's amd64 candidate and build-arm64's arm64 leg.
      # Why: this hosted-fallback job only ever builds amd64; merging by
      #   digest keeps the exact scanned/attested candidate from being
      #   swapped for a newer push mid-assembly.
      # From: Issue #1522 | PR #1523
      - name: Merge exact candidate with existing arm64 leg
        id: merge
        if: ${{ inputs.merge_manifest }}
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
          DESCRIPTION: ${{ matrix.description }}
          AMD64_DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository is not guaranteed lowercase; GHCR requires it.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
            echo "::error::Build step did not export a valid amd64 digest for $SERVICE: '$AMD64_DIGEST'."
            exit 1
          }

          arm64_tag="ghcr.io/${REPOSITORY}/${SERVICE}:sha-${COMMIT_SHA}-arm64"
          lookup_log="$(mktemp)"
          cleanup_lookup_log() { rm -f "$lookup_log"; }
          trap cleanup_lookup_log EXIT
          if ! arm64_digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools inspect "$arm64_tag" --format '{{json .Manifest.Digest}}' 2>"$lookup_log")"; then
            echo "::notice::Skipping multi-platform merge for $SERVICE because no usable arm64 leg exists at $arm64_tag after the registry retry budget. Run build-push.yml's build-arm64 job for this commit first (it runs unconditionally on every push/PR)."
            exit 0
          fi
          if [[ -s "$lookup_log" ]]; then
            echo "::notice::Arm64 manifest lookup for $SERVICE succeeded after at least one registry retry."
          fi
          cleanup_lookup_log
          trap - EXIT

          arm64_digest="${arm64_digest%\"}"
          arm64_digest="${arm64_digest#\"}"
          [[ "$arm64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
            echo "::error::Resolved malformed arm64 digest for $arm64_tag: '$arm64_digest'."
            exit 1
          }

          amd64_ref="ghcr.io/${REPOSITORY}/${SERVICE}@${AMD64_DIGEST}"
          arm64_ref="ghcr.io/${REPOSITORY}/${SERVICE}@${arm64_digest}"
          target_image="ghcr.io/${REPOSITORY}/${SERVICE}:sha-${COMMIT_SHA}"

          # What: resolves the arm64 staging tag once, then merges by digest.
          # Why: keeps the tested amd64 candidate from being replaced between
          #   verification and assembly.
          # From: Issue #1095
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create -t "$target_image" "$amd64_ref" "$arm64_ref" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}"
          GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
            bash scripts/untracked/require-image-platforms.sh "$target_image" linux/amd64,linux/arm64

          merged_digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools inspect "$target_image" --format '{{json .Manifest.Digest}}')"
          merged_digest="${merged_digest%\"}"
          merged_digest="${merged_digest#\"}"
          [[ "$merged_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
            echo "::error::Could not resolve merged manifest digest for $target_image: '$merged_digest'."
            exit 1
          }
          {
            printf 'subject-name=ghcr.io/%s/%s\n' "$REPOSITORY" "$SERVICE"
            printf 'digest=%s\n' "$merged_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest merged multi-platform manifest
        if: ${{ inputs.merge_manifest && steps.merge.outputs.digest != '' }}
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ steps.merge.outputs.subject-name }}
          subject-digest: ${{ steps.merge.outputs.digest }}

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Summary
        run: echo "::notice::Hosted overflow fallback completed ${{ matrix.service }} from one amd64 candidate; channel promotion remains owned by build-push.yml."
