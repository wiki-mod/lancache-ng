
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: reaps closed PR, orphan, and over-budget sha-* GHCR versions.
# Why: CI continuously creates immutable history and artifact closure, so
# the registry needs a bounded retention collector rather than PR-only GC.
# From: Issue #1095.
#
# What: closed PRs reap promptly and an 8x/day schedule bounds normal growth.
# Why: the delete-capable checkout is pinned below to a trusted merged ref,
# never to feature-branch code, regardless of which event invoked the job.
# From: Issue #1095.
name: GHCR Retention GC

on:
  pull_request:
    types: [closed]
    # What: also matches current_dev, the active development branch.
    # Why: without it, a closed current_dev PR misses this prompt reap and
    # falls back to the 8x/day schedule sweep as its only cleanup path.
    # From: PR #1110
    branches: [master, current_dev, "release/**", "v[0-9]*"]
  schedule:
    # What: sweep every 3 hours (8x/day) at :17 past the hour.
    # Why: the capped max_deletions_per_service/_total limits mean one run
    # cannot clear the existing backlog; running 8x/day instead of daily
    # reaches the same total ceiling faster without raising per-run caps.
    # Minute offset preserved from build-tools.yml's 03:23 refresh so the
    # two scheduled jobs don't contend for the same runner.
    # From: Issue #1585 | PR #1586
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Classify and revalidate candidates without deleting them.
        type: choice
        options: ["false", "true"]
        default: "false"
      concurrency:
        description: Packages processed in parallel.
        type: string
        # What: starts supervised/manual sweeps with one package worker.
        # Why: real 2026-08-17 dry-runs showed transient GitHub API failures even at
        # five workers; one worker stays the conservative default while higher values remain opt-in.
        # From: Issue #1585 | PR #1586
        default: "1"
      max_deletions_per_service:
        description: Maximum deletions per package for this manual run.
        type: string
        default: "500"
      max_deletions_total:
        description: Maximum deletions across all packages for this manual run.
        type: string
        default: "1500"
      minimum_age_seconds:
        description: Minimum version age before any deletion.
        type: string
        # What: manual-dispatch default, mirrors GC_MIN_AGE_SECONDS's own default.
        # Why: raised from 24h to 7 days (604800s) per the v1.2 plan.
        # From: Issue #1585
        default: "604800"

# What: no elevated `permissions:` block; deletion uses a separate PAT.
# Why: GitHub's package-version-delete REST API requires a classic PAT with
# read:packages+delete:packages -- the Actions-issued GITHUB_TOKEN cannot do
# this regardless of any `packages: write` job permission.
# From: PR #627
permissions: {}

# What: one shared concurrency group serializes every run;
# `cancel-in-progress: false`, not the more common `true`.
# Why: two concurrent sweeps exhausted the shared PAT rate limit; every run
# is a full sweep (never "just PR <N>"), so a running one must finish.
# From: PR #1443
concurrency:
  group: gc-pr-staging-images
  cancel-in-progress: false

jobs:
  gc:
    name: collect unprotected GHCR versions
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/current_dev'
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # What: gives the bounded package-parallel collector a 120-minute ceiling.
    # Why: backlog-drain dispatches may legitimately process thousands of
    # deletions while a stuck API/registry call still needs a hard stop.
    # From: Issue #1095.
    timeout-minutes: 120
    env:
      # What: the collector checkout uses the protected PR base, current_dev, or default ref.
      # Why: the delete-capable script itself never comes from a feature checkout;
      # manual dispatch is additionally gated above to refs/heads/current_dev.
      # From: Issue #1095.
      GC_CODE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || (github.event_name == 'workflow_dispatch' && 'current_dev' || github.event.repository.default_branch) }}
    steps:
      # What: checks whether GHCR_PACKAGE_DELETE_PAT is configured.
      # Why: minting this PAT is a deliberate admin action, not automatable;
      # absent, this job degrades to a loud no-op instead of failing.
      # From: PR #627
      - name: Check for GHCR deletion credentials
        id: creds
        env:
          HAVE_PAT: ${{ secrets.GHCR_PACKAGE_DELETE_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_PAT" = "true" ]; then
            echo "have-pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GHCR_PACKAGE_DELETE_PAT is not configured; skipping GHCR GC. Container package version deletion requires a classic PAT with read:packages+delete:packages scopes (the default GITHUB_TOKEN cannot delete package versions) -- a repo/org admin must create this PAT and add it as a repository secret named GHCR_PACKAGE_DELETE_PAT before this job can reap anything. Until then, package versions will keep accumulating in GHCR. See issue #626."
            echo "have-pat=false" >> "$GITHUB_OUTPUT"
          fi

      # What: preflight-checks every required collector path on GC_CODE_REF.
      # Why: an incomplete trusted checkout must stop before delete-capable code runs.
      # From: Issue #1095.
      - name: Verify required collector paths exist on trusted ref
        id: script-check
        if: steps.creds.outputs.have-pat == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # What: read-only Contents-API existence check per required path,
          # using GITHUB_TOKEN, not GHCR_PACKAGE_DELETE_PAT.
          # Why: that PAT is scoped for package deletion, not repo reads;
          # `--silent` discards the file body, only the HTTP status decides.
          # From: Issue #1095 | PR #1528
          required_paths=(
            "scripts/untracked/gc-pr-staging-images.sh"
            "scripts/untracked/gc-sha-retention-audit.sh"
            "scripts/untracked/select-build-tools-image.sh"
            "scripts/lib/gc-pr-staging-images.sh"
            "scripts/lib/ghcr-retry.sh"
            "scripts/lib/github-api-retry.sh"
            "scripts/lib/sha-retention-audit.sh"
            "scripts/lib/build-tools-channel.sh"
            "scripts/lib/docker-buildx-retry.sh"
            "release/stack-images.yml"
          )
          missing=()
          for path in "${required_paths[@]}"; do
            if ! gh api "repos/${{ github.repository }}/contents/${path}?ref=${GC_CODE_REF}" --silent >/dev/null 2>&1; then
              missing+=("$path")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Skipping GHCR GC: ${#missing[@]} required path(s) do not exist on trusted ref '${GC_CODE_REF}': ${missing[*]}. No delete-capable script will run from an incomplete checkout."
            echo "scripts-present=false" >> "$GITHUB_OUTPUT"
          else
            echo "scripts-present=true" >> "$GITHUB_OUTPUT"
          fi

      # What: sparse-checks out the collector, shared retention code, and manifest.
      # Why: fetch-depth 0 supplies all producer-branch history needed to rank
      # current_dev/master/release/v* roots while the narrow tree stays minimal.
      # From: Issue #1095.
      - name: Checkout GHCR collector and retention planner
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GC_CODE_REF }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts/untracked/gc-pr-staging-images.sh
            scripts/untracked/gc-sha-retention-audit.sh
            scripts/untracked/select-build-tools-image.sh
            scripts/lib/gc-pr-staging-images.sh
            scripts/lib/ghcr-retry.sh
            scripts/lib/github-api-retry.sh
            scripts/lib/sha-retention-audit.sh
            scripts/lib/build-tools-channel.sh
            scripts/lib/docker-buildx-retry.sh
            release/stack-images.yml
          sparse-checkout-cone-mode: false

      # What: resolves the pinned build-tools image via the shared selector.
      # Why: the collector below runs inside it for real sqlite3 availability
      #   (SRA_CACHE_DB below), matching the audit workflow's own container.
      # From: Issue #1095 (G17/#1585).
      - name: Select immutable build-tools image
        id: build_tools
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(bash scripts/untracked/select-build-tools-image.sh)"
          if [[ -z "$image" ]]; then
            echo "::error::Build-tools selector returned an empty image reference."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # What: exports the runner.temp classification-cache dir via GITHUB_ENV.
      # Why: reuses this job's own prior classification-cache writes; cross-
      #   sharing with the audit workflow is narrower than the matching key
      #   names suggest (GH Actions cache ref-scoping -- see PR/Issue).
      # From: Issue #1095 (G17/#1585).
      - name: Prepare incremental classification cache directory
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        env:
          GC_CLASSIFICATION_CACHE_DIR: ${{ runner.temp }}/f17-sha-retention-classification-cache
        run: |
          set -euo pipefail
          mkdir -p -- "$GC_CLASSIFICATION_CACHE_DIR"
          echo "GC_CLASSIFICATION_CACHE_DIR=$GC_CLASSIFICATION_CACHE_DIR" >> "$GITHUB_ENV"

      # What: restores the SQLite classification cache, same rotating-key +
      #   prefix-fallback pattern as gc-sha-retention-audit.yml's own cache.
      # Why: picks up whatever a prior run on the same ref-scope classified
      #   -- in practice usually a prior run of this same job.
      # From: Issue #1095 (G17/#1585).
      - name: Restore SHA retention classification cache
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GC_CLASSIFICATION_CACHE_DIR }}
          key: sha-retention-classification-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sha-retention-classification-cache-

      # What: runs the collector inside the pinned build-tools container,
      #   with the shared classification cache mounted read-write.
      # Why: gc_build_service_retention_plan() shells out to
      #   gc-sha-retention-audit.sh internally; without this, that internal
      #   re-run always reclassified cold, duplicating the audit's own work.
      # From: Issue #1095 (G17/#1585).
      - name: Collect unprotected GHCR versions
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build_tools.outputs.image }}
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          GC_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GC_CONCURRENCY: ${{ github.event.inputs.concurrency || vars.GC_CONCURRENCY || '1' }}
          GC_MAX_DELETIONS_PER_SERVICE: ${{ github.event.inputs.max_deletions_per_service || vars.GC_MAX_DELETIONS_PER_SERVICE || '40' }}
          GC_MAX_DELETIONS_TOTAL: ${{ github.event.inputs.max_deletions_total || vars.GC_MAX_DELETIONS_TOTAL || '1500' }}
          GC_MIN_AGE_SECONDS: ${{ github.event.inputs.minimum_age_seconds || vars.GC_MIN_AGE_SECONDS || '604800' }}
          GC_MAX_PR_LOOKUP_FAILURES: ${{ vars.GC_MAX_PR_LOOKUP_FAILURES || '10' }}
        run: |
          set -euo pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e GC_DRY_RUN \
            -e GC_CONCURRENCY \
            -e GC_MAX_DELETIONS_PER_SERVICE \
            -e GC_MAX_DELETIONS_TOTAL \
            -e GC_MIN_AGE_SECONDS \
            -e GC_MAX_PR_LOOKUP_FAILURES \
            -e SRA_HISTORY_REF=origin/current_dev \
            -e SRA_CACHE_DB=/classification-cache/sha-retention-audit.db \
            -v "$PWD:/work:ro" \
            -v "${GC_CLASSIFICATION_CACHE_DIR}:/classification-cache:rw" \
            -w /work \
            "$BUILD_TOOLS_IMAGE" \
            bash scripts/untracked/gc-pr-staging-images.sh

      # What: saves the classification cache with if: always(), matching
      #   gc-sha-retention-audit.yml's own save step reasoning.
      # Why: a failed/timed-out run still resolved a real prefix of
      #   versions, worth keeping for the next audit or GC run.
      # From: Issue #1095 (G17/#1585).
      - name: Save SHA retention classification cache
        if: always() && steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GC_CLASSIFICATION_CACHE_DIR }}
          key: sha-retention-classification-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # What: restores a full working tree, verifying the real index state
      # rather than trusting `disable`'s exit code.
      # Why: non-cone sparse-checkout doesn't reliably clear on `disable`;
      # a narrowed tree corrupts the next job reusing this runner instance.
      # From: PR #1492
      #
      # What: runs unconditionally, not gated on `scripts-present`.
      # Why: when the preflight above skips Checkout, this step's commands
      # are trivial no-ops -- still a safety net for pre-existing narrowing.
      # From: Issue #1095 | PR #1528
      - name: Restore full working tree for the next job on this runner
        if: always() && steps.creds.outputs.have-pat == 'true'
        run: |
          set -euo pipefail
          git sparse-checkout init || true
          git sparse-checkout disable || true
          git config --local --unset-all core.sparseCheckout || true
          rm -f .git/info/sparse-checkout

          # What: sweeps remaining skip-worktree bits, capturing `git
          # ls-files -v` into a variable before piping to awk.
          # Why: a direct pipe would hide a real git failure behind awk's
          # own exit code instead of tripping `set -e`.
          # From: PR #1492
          ls_files_before="$(git ls-files -v)"
          mapfile -t remaining_skip_worktree < <(printf '%s\n' "$ls_files_before" | awk '/^S /{print substr($0,3)}')
          if [ "${#remaining_skip_worktree[@]}" -gt 0 ]; then
            git update-index --no-skip-worktree -- "${remaining_skip_worktree[@]}"
          fi
          git checkout --progress --force HEAD -- .

          # What: verifies the restore worked, failing loudly if any path
          # is still excluded, using awk's count (not `grep -c`).
          # Why: awk's exit code is always 0 regardless of match count, so
          # a `|| true` fallback could silently skip the `-ne 0` check.
          # From: PR #1492
          ls_files_after="$(git ls-files -v)"
          remaining_after="$(printf '%s\n' "$ls_files_after" | awk '/^S /{c++} END{print c+0}')"
          if [ "$remaining_after" -ne 0 ]; then
            echo "::error::${remaining_after} path(s) still carry the skip-worktree bit after the restore sequence -- the working tree may still be narrowed for the next job on this runner." >&2
            printf '%s\n' "$ls_files_after" | grep '^S ' >&2 || true
            exit 1
          fi

