
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Reaps the per-PR GHCR staging tags that build-push.yml now pushes on
# pull_request events (see #626) so "validate full-setup image" can test a
# PR's own commits instead of stale base-branch state. Three tag shapes
# exist per touched service: pr-<N>-sha-<short>-amd64 and
# pr-<N>-sha-<short>-arm64 (the per-arch legs pushed by build/build-arm64),
# and pr-<N>-sha-<short> (the combined multi-platform tag merge-manifests
# assembles from those two legs, and the only one full-setup-validate
# actually pulls). Without this workflow, those tags would accumulate in
# GHCR forever -- every PR that touches a runtime service pushes staging
# images per touched service, and nothing else in the repo ever removes
# them.
#
# ALSO reaps genuinely orphaned untagged package versions -- the per-
# platform manifests and Buildx attestation/SBOM sub-manifests every
# multi-arch push creates automatically alongside a real tag. The original
# (pre-2026-08) version of this workflow's own inline classification logic
# never considered an untagged version at all: it only ever asked "are ALL
# of this version's tags closed-PR tags?", a question with no meaningful
# answer for a version that has zero tags to begin with. Confirmed live
# (2026-08-06, issue #1095): roughly 55% of this project's ~24,734 GHCR
# package versions across its 8 services are completely untagged, and none
# of them were ever reachable by that check -- this was the majority
# contributor to registry bloat, not the closed-PR tags this workflow was
# originally built to reap. See scripts/lib/gc-pr-staging-images.sh's own
# header for the full manifest-graph mechanism that now classifies these
# safely (never deleting a still-referenced platform manifest or a live
# referrers-API attestation), and this file's own "reap staging tags and
# orphaned versions" step below for why the actual logic now lives in
# scripts/gc-pr-staging-images.sh rather than inline here.
#
# Two triggers cover both the common case and the safety-net case:
#   - pull_request (closed): reaps promptly right after the PR that owns a
#     given staging tag closes (merged or not).
#   - schedule: a periodic full sweep across every service's package
#     versions, so a PR whose close-triggered run never fired (workflow
#     added after the PR closed, a failed run, a PR closed via a path that
#     doesn't fire this trigger) still gets cleaned up eventually.
# Both paths run the exact same reap logic: find every pr-<N>-sha-<short>
# (optionally -amd64/-arm64 suffixed) tag, resolve PR <N>'s current state,
# delete if it isn't open; and separately, find every untagged version no
# live tagged manifest still references and old enough to be safe. There is
# no separate "delete just this one PR" fast path -- checking every
# version's own state is simple, avoids duplicating the reap logic, and
# doubles as a general sweep on every PR close for free.
#
# NOTE (AG-CI-018/AG-CI-019): the `schedule:` trigger only ever fires from
# this file's copy on the repository's DEFAULT branch (currently `master`)
# -- confirmed generally true for `schedule:` triggers by issue #1254's
# `nightly-refresh.yml` incident, not re-verified specifically for this file.
# Whatever classification/cap logic lands here via this PR on `current_dev`
# will not actually run on a real schedule until a release promotes it to
# `master`.
#
# The `pull_request: closed` trigger's own evaluating-branch semantics WERE
# independently verified live (2026-08-13, issue #1095's checkout-failure
# investigation, see the "Verify required scripts exist on the default
# branch" step below for the fix this produced): for `pull_request` events,
# GitHub evaluates this workflow's JOB DEFINITION (steps, sparse-checkout
# patterns, `run:` commands) from the closed PR's own HEAD BRANCH copy of
# this file -- never from `master`, regardless of the `ref:` input passed to
# `actions/checkout` below. That `ref:` input only controls which commit's
# CONTENT gets checked out; it does not change which commit's copy of this
# YAML file GitHub used to build the job graph in the first place. Confirmed
# via three real job logs (runs 31673827569/31613327375/31594464341, all
# `event: pull_request`, head branches based on `current_dev` post-#1095's
# 2026-08-06 script-extraction commit 7b03f99b): each one ran THIS job's
# 3-path sparse-checkout definition while checking out `master`'s content --
# and `master` (last promoted at v0.3.0, no release since) still lacks
# `scripts/gc-pr-staging-images.sh` and `scripts/lib/gc-pr-staging-images.sh`
# entirely. Non-cone sparse-checkout matching zero real paths in the checked-
# out tree makes git treat almost every other file as "outside the sparse
# scope, must be removed" -- and `error: Path 'X' not uptodate; will not
# remove from working tree` (a safety refusal non-cone sparse-checkout does
# not always let even `--force` override) fires for whichever subset happens
# to have any real stat/content difference from that runner instance's own
# checkout history, followed by `scripts/gc-pr-staging-images.sh: No such
# file or directory` (exit 127) once the doomed checkout partially completes.
# This reproduced on 3 independent runner instances across 2 hosts because
# it is deterministic content drift between the evaluating branch and the
# pinned `ref:`, not a corrupted or leftover-dirty working directory --
# confirmed by the successful-run counterexample: every real success in the
# last 40 runs came from either a `schedule:` run (always uses `master`'s own
# copy, which -- pre-#1095's extraction -- has no checkout step and no
# sparse-checkout at all) or a `pull_request`-triggered run whose head branch
# still matched `master`'s pre-extraction, script-less shape.
name: GC PR Staging Images

on:
  pull_request:
    types: [closed]
    # current_dev is the active development branch today (v0.2.0 is frozen).
    # Without it, a closed PR against current_dev misses this prompt reap and
    # falls back to the weekly schedule sweep below as its only cleanup path
    # (#709).
    branches: [master, current_dev, "v[0-9]*"]
  schedule:
    # Weekly, offset from build-tools.yml's Sunday 03:23 refresh so the two
    # scheduled jobs don't contend for the same runner at the same minute.
    - cron: "17 4 * * 0"
  workflow_dispatch: {}

# Package version deletion is intentionally NOT done with the default
# GITHUB_TOKEN: GitHub's REST API for deleting a container package version
# requires a classic personal access token with read:packages and
# delete:packages scopes (confirmed against GitHub's own REST API docs while
# implementing #626) -- the Actions-issued GITHUB_TOKEN cannot do this
# regardless of the `packages: write` permission granted to a job. No
# permissions are needed here beyond the workflow default.
permissions: {}

# Serializes every run of this workflow (both triggers share one group, no
# per-PR/per-ref suffix) rather than letting several pull_request(closed)
# events fire concurrent full sweeps. Root-caused live (2026-08-06, issue
# #1095): two independent runs (31071606321 and its neighbor, 75 seconds
# apart, both `pull_request: closed`) both hit "API rate limit exceeded ...
# (HTTP 403)" on their very first per-service listing call, because both
# shared the same GHCR_PACKAGE_DELETE_PAT's single 5000-requests/hour REST
# budget -- 0 deleted, 0 kept, complete failure for both. `cancel-in-
# progress: false` is deliberate, not the more common `true`: this job is
# never scoped to "just PR <N>" -- every run (pull_request OR schedule) does
# a full sweep across all 8 services -- so a currently-running sweep must be
# allowed to finish rather than be killed mid-listing/mid-delete, which could
# otherwise leave a service's classification only half-applied. With
# `cancel-in-progress: false`, GitHub Actions keeps the in-progress run plus
# only the SINGLE MOST RECENT queued run, discarding any other queued runs in
# between -- safe here specifically because every discarded queued run would
# only have repeated the exact same full-sweep work the one that does run
# already covers; no queued run carries unique per-PR work that a later sweep
# wouldn't also pick up.
concurrency:
  group: gc-pr-staging-images
  cancel-in-progress: false

jobs:
  gc:
    name: reap closed-PR staging tags and orphaned versions
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # 60 minutes: a real, reasoned durable value, replacing the prior
    # "TEMPORARY DIAGNOSTIC BUMP...this bump to 150 is explicitly a test"
    # placeholder (2026-08-03) that was never revisited. Real runs since that
    # bump (no longer hitting a timeout/cancellation) completed a full sweep
    # across all 8 services in 20-30 minutes. This PR adds, per tagged
    # version, one anonymous registry manifest GET (for the new orphan
    # manifest-graph classification -- see scripts/lib/gc-pr-staging-images.sh)
    # plus, per about-to-delete orphan candidate, one more GET to check for a
    # referrers-API attestation subject -- real added work, not free, but
    # bounded by max_deletions_per_service (see GC_MAX_DELETIONS_PER_SERVICE
    # in scripts/gc-pr-staging-images.sh) rather than by the full ~13,600-
    # version untagged backlog this PR deliberately does not drain in one
    # pass. 60 minutes is double the observed 20-30 minute baseline -- enough
    # headroom for the new per-version registry calls under normal GHCR
    # response times, without reintroducing a multi-hour silent-hang window
    # the way 150 minutes did.
    timeout-minutes: 60
    steps:
      # GHCR_PACKAGE_DELETE_PAT does not exist yet as of #626 -- creating and
      # storing it is a deliberate human/admin action (a new credential with
      # org package-delete rights is a real operational decision, not
      # something to mint unattended). Until a repo/org admin adds it, this
      # job degrades to a loud no-op instead of failing the workflow: PR
      # staging tags will keep accumulating in GHCR, but nothing else breaks.
      - name: Check for GHCR deletion credentials
        id: creds
        env:
          HAVE_PAT: ${{ secrets.GHCR_PACKAGE_DELETE_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_PAT" = "true" ]; then
            echo "have-pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GHCR_PACKAGE_DELETE_PAT is not configured; skipping PR staging-tag GC. Container package version deletion requires a classic PAT with read:packages+delete:packages scopes (the default GITHUB_TOKEN cannot delete package versions) -- a repo/org admin must create this PAT and add it as a repository secret named GHCR_PACKAGE_DELETE_PAT before this job can reap anything. Until then, per-PR staging tags pushed by build-push.yml will keep accumulating in GHCR. See issue #626."
            echo "have-pat=false" >> "$GITHUB_OUTPUT"
          fi

      # This job's JOB DEFINITION (this file's steps, including the
      # sparse-checkout patterns below) is evaluated from whichever branch
      # actually triggered the run -- the closed PR's own head branch for
      # `pull_request: closed`, or the default branch for `schedule:`/
      # `workflow_dispatch:` (see the AG-CI-018/AG-CI-019 header note above).
      # The `Checkout` step's own `ref:` is deliberately pinned to the
      # default branch instead (security reason documented on that step
      # below), which means the two can name script paths that do not
      # actually exist yet in what gets checked out: an active development
      # branch can already have this job's script-extraction merged (as
      # `current_dev` has, since 7b03f99b, 2026-08-06) while the default
      # branch -- only updated at a release cut -- still lacks it. Root-
      # caused live 2026-08-13 (issue #1095): every `pull_request`-triggered
      # run since 7b03f99b landed hit this exact mismatch, because `master`
      # (last promoted at v0.3.0) still lacks two of the three paths below.
      # A non-cone sparse-checkout applied against a ref where the patterns
      # match nothing makes git try to remove almost the entire tree, which
      # trips `error: Path 'X' not uptodate; will not remove from working
      # tree` for whatever subset differs from that runner instance's prior
      # checkout -- not a corrupted runner, a guaranteed-to-fail checkout
      # given the current content mismatch. This preflight turns that
      # guaranteed failure into an accurate, informative skip instead of a
      # misleading red job: it does not restore GC functionality by itself
      # (the reap script genuinely cannot run against `master`'s content
      # until a release promotes the extraction there -- see AG-CI-019,
      # tracked for a decision in issue #1095), it only stops this workflow
      # from failing loudly for a condition that is not actually fixable
      # from inside a single `pull_request`-triggered run.
      - name: Verify required scripts exist on the default branch
        id: script-check
        if: steps.creds.outputs.have-pat == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Read-only Contents-API existence check, one call per required
          # path -- deliberately NOT using GHCR_PACKAGE_DELETE_PAT (that
          # credential is scoped for package deletion, not repo reads; the
          # default, unprivileged GITHUB_TOKEN already has read access to
          # this repository's own contents). `--silent` discards the file
          # body (irrelevant here, and this repo disallows fetching it
          # through a non-reviewed ref regardless -- see the Checkout step's
          # own comment); only the HTTP status decides presence/absence.
          required_paths=(
            "scripts/gc-pr-staging-images.sh"
            "scripts/lib/ghcr-retry.sh"
            "scripts/lib/gc-pr-staging-images.sh"
          )
          missing=()
          for path in "${required_paths[@]}"; do
            if ! gh api "repos/${{ github.repository }}/contents/${path}?ref=${DEFAULT_BRANCH}" --silent >/dev/null 2>&1; then
              missing+=("$path")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Skipping GC reap: ${#missing[@]} required script path(s) do not exist yet on the default branch ('${DEFAULT_BRANCH}'): ${missing[*]}. This job's own job definition was evaluated from a branch that already has issue #1095's scripts/gc-pr-staging-images.sh extraction (2026-08-06, commit 7b03f99b), but the default branch has not received it via a release yet -- attempting the sparse checkout below against that mismatch is a guaranteed failure (git tries to remove nearly the whole tree and hits 'not uptodate' errors), not a real GC attempt. This self-heals automatically once a release promotes the extraction to the default branch; until then, PR staging tags accumulate in GHCR same as the missing-PAT case above. See issue #1095."
            echo "scripts-present=false" >> "$GITHUB_OUTPUT"
          else
            echo "scripts-present=true" >> "$GITHUB_OUTPUT"
          fi

      # Needed only because the reap logic now lives in a real script file
      # (scripts/gc-pr-staging-images.sh) instead of inline YAML -- the
      # pre-extraction version of this workflow never checked out the repo
      # at all, since every line it needed was already inline. `sparse-
      # checkout` keeps this light (just the three script paths this job
      # actually runs), matching AG-CI-002's "route lightweight static
      # checks to the light runner tier" intent -- this job has no other use
      # for the rest of the repository tree.
      #
      # `ref` is pinned to the default branch deliberately, not left to
      # default to `github.ref`: for this job's actual trigger,
      # `pull_request: closed`, `github.ref` resolves to
      # `refs/pull/<N>/merge` -- a ref GitHub does NOT maintain once a PR is
      # closed WITHOUT merging, so an unpinned checkout could fail outright
      # on exactly that path and silently stop the whole reap job from
      # running for every closed-unmerged PR. Pinning to the default branch
      # also means this privileged, GHCR_PACKAGE_DELETE_PAT-wielding script
      # always runs the reviewed, already-merged version -- never a version
      # edited on the PR branch that triggered the run -- which matters
      # because `pull_request` (unlike `pull_request_target`) normally
      # checks out the PR's own head; an unpinned ref here would let any
      # branch that touches this file redefine what a privileged deletion
      # job does to GHCR before that change is ever reviewed. The
      # consequence to be aware of: edits to this script only take effect
      # for closed-PR sweeps (and the `schedule:`/`workflow_dispatch:`
      # triggers below) after they land on the default branch -- consistent
      # with this file's own AG-CI-018 note above about `schedule:` already
      # only ever running the default-branch copy. The `scripts-present`
      # check above exists precisely because that lag is real and ongoing,
      # not merely theoretical.
      - name: Checkout gc-pr-staging-images.sh and its lib
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/gc-pr-staging-images.sh
            scripts/lib/ghcr-retry.sh
            scripts/lib/gc-pr-staging-images.sh
          sparse-checkout-cone-mode: false

      - name: Reap staging tags and orphaned versions
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
        run: bash scripts/gc-pr-staging-images.sh

      # actions/checkout@v7.0.1's sparseCheckoutNonConeMode() (the code path
      # `sparse-checkout-cone-mode: false` above selects) sets core.sparseCheckout
      # via `git config` but writes the path patterns by appending directly to
      # .git/info/sparse-checkout with a raw file write, never going through the
      # `git sparse-checkout set` porcelain command. Reproduced repeatedly, live,
      # on a self-hosted runner host (git 2.47.3, 2026-08-07), both against this
      # real repository and against throwaway synthetic repositories of varying
      # size: a sparse-checkout state set up that way does not reliably clear on
      # a later job's plain `git sparse-checkout disable` call, nor on `git
      # sparse-checkout init` immediately followed by `disable` -- both report
      # exit 0, and across repeated runs the outcome varied between full
      # recovery and index skip-worktree bits staying set on every path outside
      # the narrow set (the working tree stays wrongly narrowed even though
      # `disable` reported success). The exact trigger for the variation was not
      # isolated; this step therefore does not trust either subcommand to have
      # worked and verifies the actual index state instead of the exit code.
      # Self-hosted runners reuse `_work/lancache-ng/lancache-ng` across
      # unrelated jobs and workflows (no per-job clone), and no other workflow
      # in this repo passes a sparse-checkout input at all -- so whatever state
      # this job leaves behind is inherited by the next job scheduled onto the
      # same runner instance, whatever workflow it belongs to, with that job's
      # own checkout step reporting full success regardless (confirmed: this
      # produced "No such file or directory" / "Can't find 'action.yml'"
      # failures across several unrelated build-push.yml jobs on 2026-08-07,
      # traced via the runner's own _diag worker logs to a prior run of this
      # exact job on the same runner instance). A lingering
      # core.sparseCheckout=true is dangerous even when the working tree
      # happens to look complete right now: git re-applies whatever
      # sparse-checkout config is active on every future tree-changing
      # operation, so the next job's checkout of a genuinely different commit
      # (not the no-op case most of these reproductions exercised) would
      # re-narrow down to the three paths above again. `if: always()` so a
      # failing reap script still leaves the runner clean for whatever job
      # runs on it next.
      #
      # Deliberately NOT additionally gated on `steps.script-check.outputs.
      # scripts-present`: when the preflight above skips the Checkout step
      # (default-branch content mismatch, see that step's own comment), this
      # step's own `git sparse-checkout`/`git checkout --force` commands run
      # against an already-unsparse tree and are trivial, side-effect-free
      # no-ops (0 skip-worktree bits to sweep, verified below) -- keeping the
      # gate simpler and running this step unconditionally on every
      # `have-pat` run remains a real, still-useful safety net for any
      # narrowing left over from a run that predates this fix, rather than
      # only self-healing on runs where the checkout itself happened to run.
      - name: Restore full working tree for the next job on this runner
        if: always() && steps.creds.outputs.have-pat == 'true'
        run: |
          set -euo pipefail
          git sparse-checkout init || true
          git sparse-checkout disable || true
          git config --local --unset-all core.sparseCheckout || true
          rm -f .git/info/sparse-checkout

          # `disable` above is not trusted to have actually cleared every
          # index skip-worktree bit (see the comment above this step) -- sweep
          # any that remain directly rather than assuming a clean state.
          # `git ls-files -v` is captured into a variable BEFORE piping to
          # awk, not piped to it directly: a real git failure here (broken
          # repo, corrupted index) must trip `set -e` immediately via this
          # plain assignment, which a direct pipe into awk would instead hide
          # behind awk's own unrelated exit code.
          ls_files_before="$(git ls-files -v)"
          mapfile -t remaining_skip_worktree < <(printf '%s\n' "$ls_files_before" | awk '/^S /{print substr($0,3)}')
          if [ "${#remaining_skip_worktree[@]}" -gt 0 ]; then
            git update-index --no-skip-worktree -- "${remaining_skip_worktree[@]}"
          fi
          git checkout --progress --force HEAD -- .

          # Verify the actual result instead of trusting the commands above
          # reported success: fail loudly if any path is still excluded, so a
          # silently-incomplete restore never masquerades as a healthy runner
          # for the next job scheduled onto this same instance. Counts with
          # awk rather than `grep -c`: awk's own exit code is 0 regardless of
          # match count, so a zero-match "fully restored" result needs no
          # `|| true` fallback that could otherwise let remaining_after end up
          # empty/invalid and silently skip the check below under `set -e`
          # (an empty `[ "$x" -ne 0 ]` comparison is a runtime error, not a
          # fatal one, inside an `if` condition -- it would NOT stop the
          # script, and the check would be silently skipped).
          ls_files_after="$(git ls-files -v)"
          remaining_after="$(printf '%s\n' "$ls_files_after" | awk '/^S /{c++} END{print c+0}')"
          if [ "$remaining_after" -ne 0 ]; then
            echo "::error::${remaining_after} path(s) still carry the skip-worktree bit after the restore sequence -- the working tree may still be narrowed for the next job on this runner." >&2
            printf '%s\n' "$ls_files_after" | grep '^S ' >&2 || true
            exit 1
          fi

