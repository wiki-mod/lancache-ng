
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: reaps per-PR GHCR staging tags (pr-<N>-sha-<short>[-amd64/-arm64])
# build-push.yml pushes on pull_request events, plus orphaned untagged
# package versions via scripts/lib/gc-pr-staging-images.sh's manifest-graph
# classification.
# Why: nothing else removes them; ~55% of this project's GHCR versions were
# untagged and unreachable by a tagged-only check alone.
# From: PR #627 | PR #1443
#
# What: two triggers -- pull_request(closed) reaps promptly; a weekly
# schedule is the safety net for a run that never fired.
# Why: `schedule:` only ever evaluates from the default branch's own file
# copy (AG-CI-018), independent of what triggered a given PR's own branch.
# From: PR #627 | PR #1443
#
# What: this job's own step definitions evaluate from whichever branch
# triggered the run, but Checkout (below) pins `ref:` to the default
# branch, which can lack scripts a PR branch already has.
# Why: confirmed live 2026-08-13 -- every pull_request run since issue
# #1095's script extraction (7b03f99b) failed a non-cone sparse checkout
# this way; "Verify required scripts exist" below turns that into a skip.
# From: Issue #1095 | PR #1528
name: GC PR Staging Images

on:
  pull_request:
    types: [closed]
    # What: also matches current_dev, the active development branch.
    # Why: without it, a closed current_dev PR misses this prompt reap and
    # falls back to the weekly schedule sweep as its only cleanup path.
    # From: PR #1110
    branches: [master, current_dev, "v[0-9]*"]
  schedule:
    # Weekly, offset from build-tools.yml's Sunday 03:23 refresh so the two
    # scheduled jobs don't contend for the same runner at the same minute.
    - cron: "17 4 * * 0"
  workflow_dispatch: {}

# What: no elevated `permissions:` block; deletion uses a separate PAT.
# Why: GitHub's package-version-delete REST API requires a classic PAT with
# read:packages+delete:packages -- the Actions-issued GITHUB_TOKEN cannot do
# this regardless of any `packages: write` job permission.
# From: PR #627
permissions: {}

# What: one shared concurrency group (no per-PR/per-ref suffix) serializes
# every run; `cancel-in-progress: false`, not the more common `true`.
# Why: two concurrent full sweeps exhausted GHCR_PACKAGE_DELETE_PAT's shared
# rate limit and both failed; every run does a full 8-service sweep (never
# "just PR <N>"), so a running sweep must finish, not be killed mid-delete.
# From: PR #1443
concurrency:
  group: gc-pr-staging-images
  cancel-in-progress: false

jobs:
  gc:
    name: reap closed-PR staging tags and orphaned versions
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # What: 60-minute job timeout, replacing an earlier temporary bump to
    # 150 that was never revisited.
    # Why: double the observed 20-30 minute full-sweep baseline, leaving
    # headroom for the added per-version registry GETs without reopening a
    # multi-hour silent-hang window.
    # From: PR #1443
    timeout-minutes: 60
    steps:
      # What: checks whether GHCR_PACKAGE_DELETE_PAT is configured.
      # Why: minting this PAT is a deliberate admin action, not automatable;
      # absent, this job degrades to a loud no-op instead of failing.
      # From: PR #627
      - name: Check for GHCR deletion credentials
        id: creds
        env:
          HAVE_PAT: ${{ secrets.GHCR_PACKAGE_DELETE_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_PAT" = "true" ]; then
            echo "have-pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GHCR_PACKAGE_DELETE_PAT is not configured; skipping PR staging-tag GC. Container package version deletion requires a classic PAT with read:packages+delete:packages scopes (the default GITHUB_TOKEN cannot delete package versions) -- a repo/org admin must create this PAT and add it as a repository secret named GHCR_PACKAGE_DELETE_PAT before this job can reap anything. Until then, per-PR staging tags pushed by build-push.yml will keep accumulating in GHCR. See issue #626."
            echo "have-pat=false" >> "$GITHUB_OUTPUT"
          fi

      # What: preflight-checks that the required scripts exist on the
      # default branch before the sparse checkout below attempts them.
      # Why: the job definition evaluates from the triggering branch, but
      # Checkout pins `ref:` to the default branch, which can still lack a
      # script an active branch already has -- a guaranteed sparse-checkout
      # failure this turns into an accurate skip instead.
      # From: Issue #1095 | PR #1528
      - name: Verify required scripts exist on the default branch
        id: script-check
        if: steps.creds.outputs.have-pat == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # What: read-only Contents-API existence check per required path,
          # using GITHUB_TOKEN, not GHCR_PACKAGE_DELETE_PAT.
          # Why: that PAT is scoped for package deletion, not repo reads;
          # `--silent` discards the file body, only the HTTP status decides.
          # From: Issue #1095 | PR #1528
          required_paths=(
            "scripts/gc-pr-staging-images.sh"
            "scripts/lib/ghcr-retry.sh"
            "scripts/lib/gc-pr-staging-images.sh"
          )
          missing=()
          for path in "${required_paths[@]}"; do
            if ! gh api "repos/${{ github.repository }}/contents/${path}?ref=${DEFAULT_BRANCH}" --silent >/dev/null 2>&1; then
              missing+=("$path")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Skipping GC reap: ${#missing[@]} required script path(s) do not exist yet on the default branch ('${DEFAULT_BRANCH}'): ${missing[*]}. This job's own job definition was evaluated from a branch that already has issue #1095's scripts/gc-pr-staging-images.sh extraction (2026-08-06, commit 7b03f99b), but the default branch has not received it via a release yet -- attempting the sparse checkout below against that mismatch is a guaranteed failure (git tries to remove nearly the whole tree and hits 'not uptodate' errors), not a real GC attempt. This self-heals automatically once a release promotes the extraction to the default branch; until then, PR staging tags accumulate in GHCR same as the missing-PAT case above. See issue #1095."
            echo "scripts-present=false" >> "$GITHUB_OUTPUT"
          else
            echo "scripts-present=true" >> "$GITHUB_OUTPUT"
          fi

      # What: sparse checkout of only the three script paths this job runs.
      # Why: the reap logic lives in real script files now, not inline YAML;
      # sparse-checkout keeps this light-tier job's checkout minimal.
      # From: PR #1443
      #
      # What: `ref:` is pinned to the default branch, not left to default.
      # Why: `github.ref` for a closed-unmerged PR is a ref GitHub drops;
      # pinning also ensures this GHCR_PACKAGE_DELETE_PAT-wielding script
      # only ever runs the reviewed, merged version, never a PR-edited one.
      # From: PR #1443
      - name: Checkout gc-pr-staging-images.sh and its lib
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/gc-pr-staging-images.sh
            scripts/lib/ghcr-retry.sh
            scripts/lib/gc-pr-staging-images.sh
          sparse-checkout-cone-mode: false

      - name: Reap staging tags and orphaned versions
        if: steps.creds.outputs.have-pat == 'true' && steps.script-check.outputs.scripts-present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
        run: bash scripts/gc-pr-staging-images.sh

      # What: restores a full (non-sparse) working tree, verifying the real
      # index state rather than trusting `disable`'s exit code.
      # Why: `actions/checkout`'s non-cone sparse-checkout does not reliably
      # clear on a later `disable` call (reproduced live, git 2.47.3); a
      # narrowed tree silently corrupts the next unrelated job on this
      # reused self-hosted runner instance (confirmed 2026-08-07 incident).
      # From: PR #1492
      #
      # What: runs unconditionally on every `have-pat` run (not gated on
      # `scripts-present`).
      # Why: when the preflight above skips Checkout, this step's commands
      # are trivial no-ops against an already-unsparse tree -- still a real
      # safety net for narrowing left over from a run predating this fix.
      # From: Issue #1095 | PR #1528
      - name: Restore full working tree for the next job on this runner
        if: always() && steps.creds.outputs.have-pat == 'true'
        run: |
          set -euo pipefail
          git sparse-checkout init || true
          git sparse-checkout disable || true
          git config --local --unset-all core.sparseCheckout || true
          rm -f .git/info/sparse-checkout

          # What: sweeps any remaining skip-worktree bits `disable` above
          # did not clear, capturing `git ls-files -v` into a variable
          # before piping to awk rather than piping directly.
          # Why: a direct pipe would hide a real git failure behind awk's
          # own unrelated exit code instead of tripping `set -e`.
          # From: PR #1492
          ls_files_before="$(git ls-files -v)"
          mapfile -t remaining_skip_worktree < <(printf '%s\n' "$ls_files_before" | awk '/^S /{print substr($0,3)}')
          if [ "${#remaining_skip_worktree[@]}" -gt 0 ]; then
            git update-index --no-skip-worktree -- "${remaining_skip_worktree[@]}"
          fi
          git checkout --progress --force HEAD -- .

          # What: verifies the restore actually worked, failing loudly if
          # any path is still excluded, using awk's count (not `grep -c`).
          # Why: awk's exit code is always 0 regardless of match count, so
          # a zero-match result needs no `|| true` that could otherwise
          # leave the `-ne 0` check silently skipped under `set -e`.
          # From: PR #1492
          ls_files_after="$(git ls-files -v)"
          remaining_after="$(printf '%s\n' "$ls_files_after" | awk '/^S /{c++} END{print c+0}')"
          if [ "$remaining_after" -ne 0 ]; then
            echo "::error::${remaining_after} path(s) still carry the skip-worktree bit after the restore sequence -- the working tree may still be narrowed for the next job on this runner." >&2
            printf '%s\n' "$ls_files_after" | grep '^S ' >&2 || true
            exit 1
          fi

