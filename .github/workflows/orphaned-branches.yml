
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: Scans branches older than 1h with no PR/issue ref
# Why: Discovers quietly accumulating orphaned branches
name: Orphaned Branch Guard

on:
  schedule:
    # What: Daily sweep at 05:38 UTC for orphaned branches
    # Why: Frequent runs needed for 1-hour threshold to work
    - cron: "38 5 * * *"
  workflow_dispatch: {}

# What: Read-only branch/PR/issue scans; no PAT needed
# Why: Default token covers required repo-scoped reads
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: orphaned-branch-guard
  cancel-in-progress: false

jobs:
  orphaned-branches:
    name: scan for orphaned branches
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch every remote branch's tip
        # What: Explicitly fetch all branch tips via depth=1
        # Why: Need all branches, not just trigger
        run: |
          set -euo pipefail
          git fetch --prune --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Resolve build-tools image
        # What: Resolve published build-tools digest.
        # Why: scheduled run, no PR; published channel only.
        # From: Issue #1683 | PR #1858
        run: |
          set -euo pipefail
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$(bash .github/scripts/ci.sh build-tools resolve-image)" >> "$GITHUB_ENV"

      - name: Scan for orphaned branches
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            -e REPO \
            -e GH_TOKEN \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash scripts/tracked/check-orphaned-branches.sh
