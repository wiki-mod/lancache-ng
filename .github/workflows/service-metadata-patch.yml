
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary branch-scoped repair runner. It applies the already-audited service
# metadata synchronization, validates it, removes itself, and only then pushes.
name: Service Metadata Patch

on:
  push:
    branches:
      - ci/1095-f16-scripts-restructure
    paths:
      - ".github/workflows/service-metadata-patch.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_BASE_SHA: e5c803cbccf926dc5db23f97d12b6dc428b344b4
      TARGET_BRANCH: ci/1095-f16-scripts-restructure
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited service metadata failure-class fix
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, data):
              Path(path).write_text(data)

          def replace_once(data, old, new, label):
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return data.replace(old, new, 1)

          build = read('.github/workflows/build-push.yml')

          def matrix_description(service):
              lines = build.splitlines()
              service_re = re.compile(r'^\s*-\s*service:\s*' + re.escape(service) + r'\s*$')
              for idx, line in enumerate(lines):
                  if not service_re.match(line):
                      continue
                  base_indent = len(line) - len(line.lstrip())
                  for candidate in lines[idx + 1:]:
                      indent = len(candidate) - len(candidate.lstrip())
                      if indent == base_indent and re.match(r'^\s*-\s*service:', candidate):
                          break
                      match = re.match(r'^\s*description:\s*(.*?)\s*$', candidate)
                      if match:
                          value = match.group(1).strip()
                          if len(value) >= 2 and value[0] == value[-1] and value[0] in ('"', "'"):
                              value = value[1:-1]
                          if not value:
                              break
                          return value
                  break
              raise SystemExit(f"build-push.yml: no description found for service {service}")

          ntp_description = matrix_description('ntp')
          syslog_description = matrix_description('syslog')

          hosted_path = '.github/workflows/build-push-hosted-fallback.yml'
          hosted = read(hosted_path)
          description_pattern = re.compile(r'^(\s*description:\s*["\']?)Comma-separated subset of proxy,dns,watchdog,dhcp,dhcp-proxy,ui,build-tools(["\']?)\s*$', re.M)
          hosted, count = description_pattern.subn(r'\1Comma-separated subset of proxy,dns,watchdog,dhcp,dhcp-proxy,ntp,syslog,ui,build-tools\2', hosted)
          if count != 1:
              raise SystemExit(f"hosted fallback dispatch description: expected one match, found {count}")

          def add_assoc_entries(data, array_name, entries):
              pattern = re.compile(r'(?ms)^(?P<lead>\s*)declare -A ' + re.escape(array_name) + r'=\(\n(?P<body>.*?)(?P<close>^\s*\)\s*$)')
              match = pattern.search(data)
              if not match:
                  raise SystemExit(f"hosted fallback: missing {array_name} associative array")
              body = match.group('body')
              existing = set(re.findall(r'^\s*\[([a-z0-9-]+)\]=', body, re.M))
              first_entry = re.search(r'^(\s*)\[[a-z0-9-]+\]=', body, re.M)
              indent = first_entry.group(1) if first_entry else match.group('lead') + '  '
              additions = ''
              for key, value in entries:
                  if key not in existing:
                      additions += f'{indent}[{key}]={value}\n'
              if not additions:
                  return data
              new_body = body + additions
              return data[:match.start('body')] + new_body + data[match.end('body'):]

          hosted = add_assoc_entries(hosted, 'contexts', [
              ('ntp', 'services/ntp'),
              ('syslog', 'services/syslog'),
          ])
          hosted = add_assoc_entries(hosted, 'build_contexts', [
              ('ntp', '""'),
              ('syslog', '""'),
          ])
          quoted_ntp = ntp_description.replace('\\', '\\\\').replace('"', '\\"')
          quoted_syslog = syslog_description.replace('\\', '\\\\').replace('"', '\\"')
          hosted = add_assoc_entries(hosted, 'descriptions', [
              ('ntp', f'"{quoted_ntp}"'),
              ('syslog', f'"{quoted_syslog}"'),
          ])
          hosted, count = re.subn(
              r'(?m)^(\s*)selected=\(proxy dns watchdog dhcp dhcp-proxy ui build-tools\)\s*$',
              r'\1selected=(proxy dns watchdog dhcp dhcp-proxy ntp syslog ui build-tools)',
              hosted,
          )
          if count != 1:
              raise SystemExit(f"hosted fallback selected array: expected one match, found {count}")
          write(hosted_path, hosted)

          guard_path = 'scripts/tracked/check-workflow-service-lists.sh'
          guard = read(guard_path)
          old_parser = '''if [[ -n "${1:-}" ]]; then
              workflow="$1"
              shift
              extra_files=("$@")
          else
              cd "$repo_root"
              workflow=".github/workflows/build-push.yml"
              extra_files=(
                  "scripts/untracked/gc-pr-staging-images.sh"
                  ".github/workflows/backfill-stack-latest.yml"
                  "scripts/untracked/ensure-pr-staging-images.sh"
              )
          fi'''
          new_parser = '''hosted_fallback=""
          if [[ "${1:-}" == "--hosted-fallback" ]]; then
              [[ -n "${2:-}" ]] || { printf '[SERVICE LISTS] --hosted-fallback requires a path\\n' >&2; exit 1; }
              hosted_fallback="$2"
              shift 2
          fi

          if [[ -n "${1:-}" ]]; then
              workflow="$1"
              shift
              extra_files=("$@")
          else
              cd "$repo_root"
              workflow=".github/workflows/build-push.yml"
              hosted_fallback="${hosted_fallback:-.github/workflows/build-push-hosted-fallback.yml}"
              extra_files=(
                  "scripts/untracked/gc-pr-staging-images.sh"
                  ".github/workflows/backfill-stack-latest.yml"
                  "scripts/untracked/ensure-pr-staging-images.sh"
              )
          fi'''
          guard = replace_once(guard, old_parser, new_parser, 'service-list argument parser')

          hosted_functions = r'''
          # The GitHub-hosted build fallback duplicates the same build-matrix service
          # decision in associative maps rather than services=(...) arrays. Validate the
          # keys and default selection against the canonical build matrix so a new service
          # cannot silently disappear only when the fallback path is needed.
          assoc_array_keys() {
              local file="$1" array_name="$2"
              awk -v target="$array_name" '
                BEGIN { in_block=0; found=0 }
                $0 ~ "^[[:space:]]*declare -A[[:space:]]+" target "=\\([[:space:]]*$" { in_block=1; found=1; next }
                in_block && /^[[:space:]]*\)[[:space:]]*$/ { in_block=0; exit }
                in_block {
                  line=$0
                  if (line ~ /^[[:space:]]*\[[a-z0-9-]+\]=/) {
                    sub(/^[[:space:]]*\[/, "", line)
                    sub(/\].*$/, "", line)
                    print line
                  }
                }
                END { if (!found) exit 2 }
              ' "$file" | sort -u
          }

          check_hosted_fallback_matrix() {
              local file="$1" array_name elements selected_entry selected_elements
              local -a selected_entries
              [[ -f "$file" ]] || { fail "expected hosted fallback workflow not found: $file"; return; }

              for array_name in contexts build_contexts descriptions; do
                  if ! elements="$(assoc_array_keys "$file" "$array_name")"; then
                      fail "hosted fallback $file is missing declare -A ${array_name}=(...)"
                      continue
                  fi
                  if [[ "$elements" != "$canonical" ]]; then
                      fail "hosted fallback ${array_name} keys in $file diverge from the build matrix."
                      printf "    expected: %s\\n" "$canonical_oneline" >&2
                      printf "    found:    %s\\n" "$(printf '%s' "$elements" | tr '\\n' ' ')" >&2
                  fi
              done

              mapfile -t selected_entries < <(grep -nE '^[[:space:]]*selected=\(' "$file" || true)
              if [[ ${#selected_entries[@]} -eq 0 ]]; then
                  fail "hosted fallback $file has no selected=(...) default service set"
                  return
              fi
              for selected_entry in "${selected_entries[@]}"; do
                  selected_elements="$(array_elements "${selected_entry#*:}")"
                  if [[ "$selected_elements" != "$canonical" ]]; then
                      fail "hosted fallback selected=(...) at $file:${selected_entry%%:*} diverges from the build matrix."
                      printf "    expected: %s\\n" "$canonical_oneline" >&2
                      printf "    found:    %s\\n" "$(printf '%s' "$selected_elements" | tr '\\n' ' ')" >&2
                  fi
              done
          }

          '''
          anchor = '# Per-extra-file expectation of which array kind each file must declare at\n'
          if hosted_functions.strip() not in guard:
              if anchor not in guard:
                  raise SystemExit('service-list guard: hosted-fallback function insertion anchor missing')
              guard = guard.replace(anchor, hosted_functions + anchor, 1)
          call_anchor = 'check_full_setup_arrays "$workflow" "optional"\n\n'
          call = 'check_full_setup_arrays "$workflow" "optional"\n[[ -z "$hosted_fallback" ]] || check_hosted_fallback_matrix "$hosted_fallback"\n\n'
          guard = replace_once(guard, call_anchor, call, 'service-list hosted fallback invocation')
          write(guard_path, guard)

          bats_path = 'tests/bats/check_workflow_service_lists.bats'
          bats = read(bats_path)
          bats = replace_once(
              bats,
              '    ensure_fixture="$BATS_TEST_TMPDIR/ensure-pr-staging-images.sh"\n',
              '    ensure_fixture="$BATS_TEST_TMPDIR/ensure-pr-staging-images.sh"\n    hosted_fixture="$BATS_TEST_TMPDIR/build-push-hosted-fallback.yml"\n',
              'bats hosted fixture setup',
          )
          bats = replace_once(
              bats,
              '          - service: ntp\n          - service: ui\n',
              '          - service: ntp\n          - service: syslog\n          - service: ui\n',
              'bats canonical matrix syslog row',
          )
          bats = bats.replace('dhcp-proxy ntp ui', 'dhcp-proxy ntp syslog ui')
          bats = bats.replace('build-tools ui ntp dhcp-proxy dhcp watchdog dns proxy', 'build-tools ui syslog ntp dhcp-proxy dhcp watchdog dns proxy')
          bats = bats.replace('proxy dns watchdog dhcp ntp build-tools', 'proxy dns watchdog dhcp ntp syslog build-tools')
          bats = bats.replace('proxy dns watchdog dhcp dhcp-proxy ui build-tools', 'proxy dns watchdog dhcp dhcp-proxy syslog ui build-tools')
          bats = bats.replace('all eight real services', 'all nine real services')
          bats = bats.replace('full 8-service set', 'full 9-service set')
          bats = bats.replace('all other 7 real services', 'all other 8 real services')
          bats = bats.replace('the full 8-service set below', 'the full 9-service set below')

          hosted_tests = r'''
          # Hosted fallback maps are a separate service-list representation from the
          # bash services=(...) arrays above. These fixtures make the fallback drift
          # class repeatable instead of depending on a live outage to expose it.
          write_good_hosted_fixture() {
              cat > "$hosted_fixture" <<'EOF'
          declare -A contexts=(
            [proxy]=services/proxy
            [dns]=services/dns
            [watchdog]=services/watchdog
            [dhcp]=services/dhcp
            [dhcp-proxy]=services/dhcp-proxy
            [ntp]=services/ntp
            [syslog]=services/syslog
            [ui]=services/ui
            [build-tools]=tools/build-tools
          )
          declare -A build_contexts=(
            [proxy]=""
            [dns]=services/dns
            [watchdog]=""
            [dhcp]=""
            [dhcp-proxy]=""
            [ntp]=""
            [syslog]=""
            [ui]=services/ui
            [build-tools]=""
          )
          declare -A descriptions=(
            [proxy]="proxy"
            [dns]="dns"
            [watchdog]="watchdog"
            [dhcp]="dhcp"
            [dhcp-proxy]="dhcp-proxy"
            [ntp]="ntp"
            [syslog]="syslog"
            [ui]="ui"
            [build-tools]="build-tools"
          )
          declare -A is_rust=(
            [dns]=true
            [ui]=true
          )
          selected=(proxy dns watchdog dhcp dhcp-proxy ntp syslog ui build-tools)
          EOF
          }

          @test "hosted fallback: passes when maps and selected set match the canonical matrix" {
              write_matrix_source_with_services > "$fixture"
              write_good_hosted_fixture

              run bash "$script" --hosted-fallback "$hosted_fixture" "$fixture"
              [ "$status" -eq 0 ]
              [[ "$output" == *"consistent"* ]]
          }

          @test "hosted fallback: fails when contexts silently drops syslog" {
              write_matrix_source_with_services > "$fixture"
              write_good_hosted_fixture
              sed -i '/^  \[syslog\]=services\/syslog$/d' "$hosted_fixture"

              run bash "$script" --hosted-fallback "$hosted_fixture" "$fixture"
              [ "$status" -ne 0 ]
              [[ "$output" == *"contexts keys"* ]]
          }

          @test "hosted fallback: fails when selected silently drops syslog" {
              write_matrix_source_with_services > "$fixture"
              write_good_hosted_fixture
              sed -i 's/ ntp syslog ui/ ntp ui/' "$hosted_fixture"

              run bash "$script" --hosted-fallback "$hosted_fixture" "$fixture"
              [ "$status" -ne 0 ]
              [[ "$output" == *"selected=(...)"* ]]
          }

          @test "hosted fallback: fails closed when a required metadata map disappears" {
              write_matrix_source_with_services > "$fixture"
              write_good_hosted_fixture
              sed -i '/^declare -A descriptions=(/,/^)/d' "$hosted_fixture"

              run bash "$script" --hosted-fallback "$hosted_fixture" "$fixture"
              [ "$status" -ne 0 ]
              [[ "$output" == *"missing declare -A descriptions"* ]]
          }

          '''
          bats_anchor = '# Defense-in-depth: proves the guard\'s default zero-argument production\n'
          if hosted_tests.strip() not in bats:
              if bats_anchor not in bats:
                  raise SystemExit('bats: hosted test insertion anchor missing')
              bats = bats.replace(bats_anchor, hosted_tests + bats_anchor, 1)
          write(bats_path, bats)

          validator_path = 'scripts/untracked/validate-stack-images.sh'
          validator = read(validator_path)
          validator = replace_once(
              validator,
              'runtime_images=(proxy dns watchdog dhcp dhcp-proxy ui syslog)',
              'runtime_images=(proxy dns watchdog dhcp dhcp-proxy ntp ui syslog)\n'
              'runtime_images_sorted="$(printf \'%s\\n\' "${runtime_images[@]}" | sort)"\n'
              'runtime_names_sorted="$(sort <<<"$runtime_names")"\n'
              '[[ "$runtime_images_sorted" == "$runtime_names_sorted" ]] || fail "runtime_images must match every runtime image declared by release/stack-images.yml"',
              'validator runtime image set',
          )
          validator = replace_once(
              validator,
              '  services/dhcp-proxy/Dockerfile \\\n  services/ui/Dockerfile \\\n  services/syslog/Dockerfile \\\n',
              '  services/dhcp-proxy/Dockerfile \\\n  services/ntp/Dockerfile \\\n  services/ui/Dockerfile \\\n  services/syslog/Dockerfile \\\n',
              'validator required Dockerfile set',
          )
          validator = replace_once(
              validator,
              '  services/dhcp-proxy/Dockerfile \\\n  services/ui/Dockerfile \\\n  tools/build-tools/Dockerfile\n',
              '  services/dhcp-proxy/Dockerfile \\\n  services/ntp/Dockerfile \\\n  services/ui/Dockerfile \\\n  services/syslog/Dockerfile \\\n  tools/build-tools/Dockerfile\n',
              'validator OCI description Dockerfile set',
          )
          write(validator_path, validator)

          syslog_path = 'services/syslog/Dockerfile'
          syslog = read(syslog_path)
          if 'LABEL org.opencontainers.image.description=' in syslog:
              raise SystemExit('syslog Dockerfile unexpectedly already has an OCI description label')
          lines = syslog.splitlines(keepends=True)
          for idx, line in enumerate(lines):
              if line.startswith('FROM '):
                  description = syslog_description.replace('\\', '\\\\').replace('"', '\\"')
                  lines.insert(idx + 1, f'LABEL org.opencontainers.image.description="{description}"\n')
                  break
          else:
              raise SystemExit('syslog Dockerfile: FROM line not found')
          write(syslog_path, ''.join(lines))
          PY

      - name: Validate focused patch in immutable build-tools image
        run: |
          set -euo pipefail

          bash -n scripts/tracked/check-workflow-service-lists.sh scripts/untracked/validate-stack-images.sh
          BUILD_TOOLS_IMAGE="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          [[ "$BUILD_TOOLS_IMAGE" == *@sha256:* ]] || { echo "::error::build-tools selector did not return an immutable digest: $BUILD_TOOLS_IMAGE"; exit 1; }
          docker pull "$BUILD_TOOLS_IMAGE"

          run_tools() {
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$PWD:/work:ro" \
              -w /work \
              "$BUILD_TOOLS_IMAGE" \
              timeout --kill-after=30 --signal=KILL 600 "$@"
          }

          run_tools shellcheck --severity=warning scripts/tracked/check-workflow-service-lists.sh scripts/untracked/validate-stack-images.sh
          run_tools bats tests/bats/check_workflow_service_lists.bats
          run_tools bash scripts/tracked/check-workflow-service-lists.sh
          run_tools bash scripts/untracked/validate-stack-images.sh
          run_tools actionlint .github/workflows/build-push-hosted-fallback.yml
          run_tools bash scripts/tracked/check-file-headers.sh \
            .github/workflows/build-push-hosted-fallback.yml \
            scripts/tracked/check-workflow-service-lists.sh \
            tests/bats/check_workflow_service_lists.bats \
            scripts/untracked/validate-stack-images.sh \
            services/syslog/Dockerfile
          run_tools bash scripts/untracked/check-workflow-line-limit.sh .github/workflows/build-push-hosted-fallback.yml
          git diff --check

          timeout --kill-after=30 --signal=KILL 900 docker build --pull \
            -f services/syslog/Dockerfile services/syslog

      - name: Commit and push only after validation
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          [[ "$remote_head" == "$GITHUB_SHA" ]] || {
            echo "::error::Branch moved while validation ran: expected $GITHUB_SHA, found ${remote_head:-<missing>}"
            exit 1
          }
          remote_base="$(git ls-remote origin refs/heads/current_dev | awk '{print $1}')"
          [[ "$remote_base" == "$EXPECTED_BASE_SHA" ]] || {
            echo "::error::current_dev moved while validation ran: expected $EXPECTED_BASE_SHA, found ${remote_base:-<missing>}"
            exit 1
          }

          git config user.name 'ChatGPT Connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git rm .github/workflows/service-metadata-patch.yml
          git add \
            .github/workflows/build-push-hosted-fallback.yml \
            scripts/tracked/check-workflow-service-lists.sh \
            tests/bats/check_workflow_service_lists.bats \
            scripts/untracked/validate-stack-images.sh \
            services/syslog/Dockerfile
          marker="GPT-$(date +%s)"
          git commit -m "$marker" -m 'fix(ci): synchronize first-party service metadata'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
