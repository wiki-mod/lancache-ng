# SPDX-License-Identifier: AGPL-3.0-or-later
# lancache-ng (https://github.com/wiki-mod/lancache-ng)
#
# Releases consume an already accepted runtime stack without rebuilding any
# runtime service. Release build-tools is a separate freshly-built tooling
# identity whose complete external build inputs are frozen before either native
# platform build starts.
name: Release Accepted Stack v2

on:
  workflow_dispatch:
    inputs:
      accepted_stack_tag:
        description: Immutable accepted-v2-* stack tag providing the tested runtime lock.
        required: true
        type: string
      release_tag:
        description: Existing release tag, for example v0.4.0 or v0.4.0-rc.1.
        required: true
        type: string
      confirm:
        description: Type PUBLISH to move OCI release references. Any other value performs validation/SBOM only.
        required: true
        default: DRY-RUN
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: freeze accepted runtime and release source
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish: ${{ steps.mode.outputs.publish }}
      source_sha: ${{ steps.release-source.outputs.source_sha }}
      candidate_tag: ${{ steps.config.outputs.candidate_tag }}
      refresh_bucket: ${{ steps.config.outputs.refresh_bucket }}
      accepted_runtime_pointer_digest: ${{ steps.accepted-runtime.outputs.pointer_digest }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate release input shape
        env:
          ACCEPTED_STACK_TAG: ${{ inputs.accepted_stack_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTED_STACK_TAG" == accepted-v2-* ]] \
            || { echo "::error::accepted_stack_tag must be an immutable accepted-v2-* tag"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] \
            || { echo "::error::invalid release tag: $RELEASE_TAG"; exit 1; }

      - name: Checkout the exact release-tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: config
        name: Freeze release build inputs for the whole run
        run: |
          set -euo pipefail
          printf 'candidate_tag=release-v2-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'refresh_bucket=%s\n' "$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - id: accepted-runtime
        name: Extract cryptographically accepted runtime lock and verified pointer digest
        env:
          ACCEPTED_STACK_TAG: ${{ inputs.accepted_stack_tag }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-v2-release"
          timeout --kill-after=30 300 bash scripts/ci-extract-stack-lock.sh \
            "ghcr.io/wiki-mod/lancache-ng/stack:${ACCEPTED_STACK_TAG}" \
            "$RUNNER_TEMP/ci-v2-release/accepted-stack-lock.json" \
            "$RUNNER_TEMP/ci-v2-release/accepted-stack-pointer.digest"
          pointer_digest="$(cat "$RUNNER_TEMP/ci-v2-release/accepted-stack-pointer.digest")"
          [[ "$pointer_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::accepted runtime extractor returned an invalid pointer digest"
            exit 1
          }
          printf 'pointer_digest=%s\n' "$pointer_digest" >> "$GITHUB_OUTPUT"

      - id: release-source
        name: Require release tag to identify the accepted runtime source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          accepted_sha="$(jq -r '.source_sha' "$RUNNER_TEMP/ci-v2-release/accepted-stack-lock.json")"
          [[ "$tag_sha" == "$accepted_sha" ]] || {
            echo "::error::Release tag $RELEASE_TAG resolves to $tag_sha, but accepted runtime source is $accepted_sha."
            exit 1
          }
          [[ "$GITHUB_SHA" == "$tag_sha" ]] || {
            echo "::notice::Workflow-dispatch source $GITHUB_SHA differs from release source $tag_sha; all release build/test checkouts stay pinned to the tag commit."
          }
          printf 'source_sha=%s\n' "$tag_sha" >> "$GITHUB_OUTPUT"

      - id: matrix
        name: Derive release build-tools matrix with frozen external bases
        run: |
          set -euo pipefail
          entry="$(bash scripts/query-stack-images.sh tooling | jq -c '.include[] | select(.service == "build-tools")')"
          [[ -n "$entry" ]] || { echo "::error::canonical catalog has no build-tools entry"; exit 1; }

          golang="$(timeout --kill-after=30 300 bash scripts/ci-resolve-image-ref.sh golang:latest)"
          rust="$(timeout --kill-after=30 300 bash scripts/ci-resolve-image-ref.sh rust:latest)"
          build_inputs="$(CI_GOLANG_BASE_IMAGE="$golang" CI_RUST_BASE_IMAGE="$rust" bash scripts/ci-build-inputs.sh build-tools json)"
          build_contexts="$(CI_GOLANG_BASE_IMAGE="$golang" CI_RUST_BASE_IMAGE="$rust" bash scripts/ci-build-inputs.sh build-tools build-contexts)"

          matrix="$(
            jq -cn \
              --argjson entry "$entry" \
              --argjson build_inputs "$build_inputs" \
              --arg build_contexts "$build_contexts" '{
              include: [
                $entry.platforms[] as $platform
                | $entry + {
                    platform:$platform,
                    arch:(if $platform == "linux/arm64" then "arm64" else "amd64" end),
                    runner:(if $platform == "linux/arm64" then "ubuntu-24.04-arm" else ["self-hosted","linux","lancache","lancache-heavy"] end),
                    build_inputs:$build_inputs,
                    build_contexts:$build_contexts
                  }
                | del(.platforms)
              ]
            }'
          )"
          [[ "$(jq '.include | length' <<<"$matrix")" -eq 2 ]] \
            || { echo "::error::release build-tools requires exactly amd64 and arm64"; exit 1; }
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - id: mode
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" == PUBLISH ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Release workflow is in validation/SBOM-only mode. No release reference will move."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-v2-accepted-runtime-lock
          path: |
            ${{ runner.temp }}/ci-v2-release/accepted-stack-lock.json
            ${{ runner.temp }}/ci-v2-release/accepted-stack-pointer.digest
          retention-days: 30

      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  build-tools-platform:
    name: build release build-tools ${{ matrix.arch }} once
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: ci-v2-release-build-tools-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout frozen release source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx on persistent amd64 runner
        if: matrix.arch == 'amd64'
        id: buildx-self
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Buildx with hosted arm64 retry
        if: matrix.arch == 'arm64'
        id: buildx-arm
        uses: ./.github/actions/buildx-setup-retry

      - name: Build and push release build-tools quarantine candidate exactly once
        id: build
        uses: ./.github/actions/ghcr-build-once-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ matrix.arch == 'amd64' && steps.buildx-self.outputs.name || steps.buildx-arm.outputs.name }}
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: APT_CACHE_BUST=${{ needs.plan.outputs.refresh_bucket }}
          tag: ${{ matrix.image }}:${{ needs.plan.outputs.candidate_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.source_sha }}
            io.lancache-ng.candidate=${{ needs.plan.outputs.candidate_tag }}
            io.lancache-ng.release=${{ inputs.release_tag }}
          platform: ${{ matrix.platform }}
          pull: "true"
          cache-from: type=gha,scope=ci-v2-release-build-tools-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-v2-release-build-tools-${{ matrix.arch }}

      - name: Attest release build-tools child provenance to exact digest
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Record exact release build-tools producer identity
        env:
          CI_SOURCE_BUILD_INPUTS_JSON: ${{ toJSON(matrix.build_inputs) }}
        run: |
          set -euo pipefail
          mkdir -p candidate-record
          bash scripts/ci-write-candidate-record.sh \
            tooling build-tools "${{ matrix.image }}" \
            "${{ needs.plan.outputs.source_sha }}" "${{ needs.plan.outputs.source_sha }}" \
            "${{ matrix.platform }}" "${{ steps.build.outputs.digest }}" built \
            "candidate-record/build-tools__${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-tools-${{ matrix.arch }}
          path: candidate-record/build-tools__${{ matrix.arch }}.json
          retention-days: 30

      - name: Remove amd64 Buildx builder
        if: always() && matrix.arch == 'amd64'
        run: docker buildx rm "${{ steps.buildx-self.outputs.name }}" || true

      - name: Remove arm64 Buildx builder
        if: always() && matrix.arch == 'arm64'
        run: docker buildx rm "${{ steps.buildx-arm.outputs.name }}" || true

  assemble-release:
    name: assemble release build-tools index and exact release lock
    needs: [plan, build-tools-platform]
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout frozen release source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-v2-accepted-runtime-lock
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-tools-*
          merge-multiple: true
          path: release/build-tools-platforms

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: tooling-index
        name: Assemble release build-tools index without rebuilding
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release/index
          bash scripts/ci-assemble-service-index.sh \
            build-tools ghcr.io/wiki-mod/lancache-ng/build-tools \
            "${{ needs.plan.outputs.source_sha }}" \
            "${{ needs.plan.outputs.candidate_tag }}" \
            release/build-tools-platforms release/index/build-tools.json
          digest="$(jq -r '.digest' release/index/build-tools.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid release build-tools index digest"; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest assembled release build-tools index provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/wiki-mod/lancache-ng/build-tools
          subject-digest: ${{ steps.tooling-index.outputs.digest }}

      - name: Assemble release lock from accepted runtime plus fresh tooling
        run: |
          set -euo pipefail
          bash scripts/ci-assemble-release-lock.sh \
            release/accepted-stack-lock.json \
            "${{ needs.plan.outputs.accepted_runtime_pointer_digest }}" \
            release/index/build-tools.json \
            "${{ inputs.release_tag }}" \
            "${{ needs.plan.outputs.candidate_tag }}" \
            release/release-lock.json

      - name: Prove all release-lock transport references still resolve to recorded identities
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh release/release-lock.json

      - id: matrix
        name: Derive exact release evidence matrix from lock
        run: |
          set -euo pipefail
          printf 'matrix=%s\n' "$(bash scripts/ci-lock-matrix.sh release/release-lock.json platform)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-v2-release-lock
          path: release/release-lock.json
          retention-days: 90

      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  release-evidence:
    name: release evidence ${{ matrix.service }} ${{ matrix.arch }}
    needs: [plan, assemble-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.assemble-release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout frozen release source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: freshness
        run: printf 'bucket=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Re-scan exact release child digest
        uses: ./.github/actions/trivy-scan-with-cache
        with:
          image-ref: ${{ matrix.image }}@${{ matrix.digest }}
          digest: ${{ matrix.digest }}
          cache-key-scope: release-${{ matrix.service }}-${{ matrix.arch }}
          freshness-bucket: ${{ steps.freshness.outputs.bucket }}

      - name: Native smoke exact release child digest
        run: |
          set -euo pipefail
          ref="${{ matrix.image }}@${{ matrix.digest }}"
          timeout --kill-after=30 300 docker pull "$ref"
          timeout --kill-after=30 120 docker run --rm --entrypoint /bin/sh "$ref" -c 'true'

      - name: Prove release build-tools can execute the v2 validation contract natively
        if: matrix.service == 'build-tools'
        run: |
          set -euo pipefail
          ref="${{ matrix.image }}@${{ matrix.digest }}"
          timeout --kill-after=30 1500 docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "$ref" \
            timeout --kill-after=30 1200 bash -lc '
              set -euo pipefail
              bash -n scripts/ci-*.sh scripts/query-stack-images.sh scripts/lib/ci-artifact-identity.sh scripts/lib/network-retry.sh
              shellcheck --severity=warning scripts/ci-*.sh scripts/query-stack-images.sh scripts/lib/ci-artifact-identity.sh scripts/lib/network-retry.sh
              bats \
                tests/bats/ci_artifact_identity.bats \
                tests/bats/ci_build_inputs.bats \
                tests/bats/ci_release_identity.bats \
                tests/bats/ci_docker_lock_shim.bats \
                tests/bats/ci_optional_ref_snapshot.bats \
                tests/bats/network_retry.bats
            '

      - name: Generate SPDX SBOM from exact release digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ matrix.digest }}
          format: spdx-json
          output: sbom-${{ matrix.service }}-${{ matrix.arch }}.spdx.json
          hide-progress: true
          cache: "false"
          timeout: 10m

      - name: Attest SBOM to exact release digest
        uses: ./.github/actions/ghcr-sbom-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sbom-${{ matrix.service }}-${{ matrix.arch }}.spdx.json

      - name: Write exact-digest release evidence record
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n \
            --arg service "${{ matrix.service }}" \
            --arg platform "${{ matrix.platform }}" \
            --arg digest "${{ matrix.digest }}" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema:"release-evidence/v1",
              service:$service,
              platform:$platform,
              digest:$digest,
              trivy:"passed",
              native_smoke:"passed",
              sbom_attested:true,
              observed_at:$observed_at
            }' > "evidence/${{ matrix.service }}__${{ matrix.arch }}.evidence.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.service }}-${{ matrix.arch }}
          path: |
            evidence/${{ matrix.service }}__${{ matrix.arch }}.evidence.json
            sbom-${{ matrix.service }}-${{ matrix.arch }}.spdx.json
          retention-days: 90

  publish:
    name: publish coherent release references
    needs: [plan, assemble-release, release-evidence]
    if: needs.plan.outputs.publish == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout frozen release source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-v2-release-lock
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: release/evidence

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify complete exact-digest release evidence set
        run: |
          set -euo pipefail
          source scripts/lib/ci-artifact-identity.sh
          ci_ai_validate_stack_lock release/release-lock.json
          expected="$(( $(bash scripts/query-stack-images.sh all | jq '.include | length') * 2 ))"
          mapfile -t files < <(find release/evidence -type f -name '*.evidence.json' -print | sort)
          [[ "${#files[@]}" -eq "$expected" ]] \
            || ci_ai_fail "expected $expected release evidence records, found ${#files[@]}"
          for file in "${files[@]}"; do
            service="$(jq -r '.service' "$file")"
            platform="$(jq -r '.platform' "$file")"
            digest="$(jq -r '.digest' "$file")"
            [[ "$(jq -r '.schema' "$file")" == release-evidence/v1 ]] \
              || ci_ai_fail "unexpected release evidence schema in $file"
            [[ "$(jq -r '.trivy' "$file")" == passed ]] \
              || ci_ai_fail "release Trivy evidence is not passed in $file"
            [[ "$(jq -r '.native_smoke' "$file")" == passed ]] \
              || ci_ai_fail "release native smoke evidence is not passed in $file"
            [[ "$(jq -r '.sbom_attested' "$file")" == true ]] \
              || ci_ai_fail "release SBOM evidence is not attested in $file"
            locked="$(jq -r --arg service "$service" --arg platform "$platform" '(.runtime[$service] // .tooling[$service]).platforms[$platform] // empty' release/release-lock.json)"
            [[ -n "$locked" && "$locked" == "$digest" ]] \
              || ci_ai_fail "release evidence digest $digest does not match lock for $service/$platform"
          done

      - name: Re-resolve release candidate references before acceptance
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-verify-lock-tags.sh release/release-lock.json

      - name: Prepare immutable release acceptance and pointer context
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          source scripts/lib/ci-artifact-identity.sh
          mkdir -p release-pointer
          cp release/release-lock.json release-pointer/stack-lock.json
          release_lock_hash="$(sha256sum release-pointer/stack-lock.json | awk '{print $1}')"
          accepted_runtime_pointer_digest="$(jq -r '.release.accepted_runtime_pointer_digest' release-pointer/stack-lock.json)"
          accepted_runtime_lock_sha256="$(jq -r '.release.accepted_runtime_lock_sha256' release-pointer/stack-lock.json)"
          ci_ai_require_digest "$accepted_runtime_pointer_digest"
          [[ "$accepted_runtime_lock_sha256" =~ ^[0-9a-f]{64}$ ]] \
            || ci_ai_fail "release lock has invalid accepted runtime lock hash"
          accepted_tag="accepted-v2-release-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg source_sha "${{ needs.plan.outputs.source_sha }}" \
            --arg source_ref "refs/tags/${RELEASE_TAG}" \
            --arg release_lock_hash "$release_lock_hash" \
            --arg accepted_tag "$accepted_tag" \
            --arg release_tag "$RELEASE_TAG" \
            --arg accepted_runtime_pointer_digest "$accepted_runtime_pointer_digest" \
            --arg accepted_runtime_lock_sha256 "$accepted_runtime_lock_sha256" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg accepted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema:"release-acceptance/v1",
              accepted:true,
              source_sha:$source_sha,
              source_ref:$source_ref,
              release_lock_sha256:$release_lock_hash,
              accepted_tag:$accepted_tag,
              release_tag:$release_tag,
              accepted_runtime_pointer_digest:$accepted_runtime_pointer_digest,
              accepted_runtime_lock_sha256:$accepted_runtime_lock_sha256,
              run_url:$run_url,
              accepted_at:$accepted_at,
              gates:{
                accepted_runtime_acceptance_verified:true,
                accepted_runtime_identity_preserved:true,
                release_build_tools_built:true,
                release_build_tools_provenance:true,
                release_exact_digest_security:true,
                release_native_platform_smoke:true,
                release_sbom_attested:true,
                release_build_tools_validation_contract:true,
                publication_policy:true
              }
            }' > release-pointer/acceptance.json
          ci_ai_validate_release_acceptance release-pointer/acceptance.json
          cp release/stack-pointer/Dockerfile release-pointer/Dockerfile
          printf 'RELEASE_ACCEPTED_TAG=%s\n' "$accepted_tag" >> "$GITHUB_ENV"

      - name: Build immutable release stack pointer before mutable publication
        id: stack
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: release-pointer
          push: "true"
          tags: ghcr.io/wiki-mod/lancache-ng/stack:${{ env.RELEASE_ACCEPTED_TAG }}
          build-args: SOURCE_SHA=${{ needs.plan.outputs.source_sha }}
          platforms: linux/amd64,linux/arm64
          provenance: "false"

      - name: Attest immutable release pointer provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/wiki-mod/lancache-ng/stack
          subject-digest: ${{ steps.stack.outputs.digest }}

      - name: Attest immutable release acceptance before mutable publication
        uses: ./.github/actions/ghcr-custom-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/wiki-mod/lancache-ng/stack
          subject-digest: ${{ steps.stack.outputs.digest }}
          predicate-type: https://wiki-mod.github.io/lancache-ng/attestations/release/v1
          predicate-path: release-pointer/acceptance.json

      - name: Acquire cross-workflow promotion lock
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/promote-lock.sh"
          holder_note="$(promote_lock_holder_note "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME")"
          echo "Acquiring $PROMOTE_LOCK_REF as: $holder_note"
          promote_lock_acquire_with_retry origin "$holder_note" 40 15 900

      - name: Publish release refs as one rollback-protected critical section
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_STACK_DIGEST: ${{ steps.stack.outputs.digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/lib/ci-artifact-identity.sh
          source scripts/lib/ghcr-retry.sh

          ci_ai_require_digest "$RELEASE_STACK_DIGEST"
          declare -A previous_refs=()
          promoted_targets=()

          snapshot_previous_ref() {
            local target="$1" previous status
            if previous="$(ci_ai_ref_digest_optional "$target")"; then
              previous_refs["$target"]="$previous"
              return 0
            else
              status=$?
            fi
            if (( status == CI_AI_REF_ABSENT_STATUS )); then
              previous_refs["$target"]=""
              return 0
            fi
            ci_ai_fail "could not determine previous digest for $target; refusing to publish without an unambiguous rollback snapshot"
          }

          rollback_release_refs() {
            local status=$? target previous index
            if [[ "$status" -eq 0 || "${#promoted_targets[@]}" -eq 0 ]]; then
              exit "$status"
            fi
            echo "::error::Release publication failed after one or more refs moved; attempting best-effort rollback in reverse publication order."
            for ((index=${#promoted_targets[@]} - 1; index >= 0; index--)); do
              target="${promoted_targets[$index]}"
              previous="${previous_refs[$target]:-}"
              if [[ -n "$previous" ]]; then
                ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                  docker buildx imagetools create --prefer-index=false \
                    --tag "$target" "${target%:*}@${previous}" \
                  || echo "::error::Could not restore previous digest for $target."
              else
                echo "::error::$target did not exist before this run and cannot be safely tag-deleted without risking its shared package version. The coherent stack release ref was not advanced; inspect this non-authoritative partial ref before retrying."
              fi
            done
            exit "$status"
          }
          trap rollback_release_refs EXIT

          bash scripts/ci-verify-lock-tags.sh release/release-lock.json

          while IFS=$'\t' read -r image digest; do
            ci_ai_require_digest "$digest"
            target="${image}:${RELEASE_TAG}"
            snapshot_previous_ref "$target"
            metadata="$(mktemp)"
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create --prefer-index=false \
                --tag "$target" "${image}@${digest}" \
                --metadata-file "$metadata"
            published="$(jq -r '."containerimage.descriptor".digest' "$metadata")"
            rm -f "$metadata"
            [[ "$published" == "$digest" ]] \
              || ci_ai_fail "release tagging changed digest for $image"
            promoted_targets+=("$target")
          done < <(jq -r '(.runtime + .tooling)[] | [.image, .digest] | @tsv' release/release-lock.json)

          stack_target="ghcr.io/wiki-mod/lancache-ng/stack:${RELEASE_TAG}"
          snapshot_previous_ref "$stack_target"
          metadata="$(mktemp)"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create --prefer-index=false \
              --tag "$stack_target" \
              "ghcr.io/wiki-mod/lancache-ng/stack@${RELEASE_STACK_DIGEST}" \
              --metadata-file "$metadata"
          published_stack="$(jq -r '."containerimage.descriptor".digest' "$metadata")"
          rm -f "$metadata"
          [[ "$published_stack" == "$RELEASE_STACK_DIGEST" ]] \
            || ci_ai_fail "release stack tag changed pointer digest"
          promoted_targets+=("$stack_target")

          while IFS=$'\t' read -r image digest; do
            actual="$(ci_ai_ref_digest "${image}:${RELEASE_TAG}")"
            [[ "$actual" == "$digest" ]] \
              || ci_ai_fail "post-publication digest mismatch for ${image}:${RELEASE_TAG}"
          done < <(jq -r '(.runtime + .tooling)[] | [.image, .digest] | @tsv' release/release-lock.json)
          [[ "$(ci_ai_ref_digest "$stack_target")" == "$RELEASE_STACK_DIGEST" ]] \
            || ci_ai_fail "post-publication stack pointer digest mismatch"

      - name: Release cross-workflow promotion lock
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/promote-lock.sh"
          holder_note="$(promote_lock_holder_note "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME")"
          promote_lock_release origin "$holder_note" || true

      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true
