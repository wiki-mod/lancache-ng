
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: Drafts release on pushes to master/current_dev
# Why: Automates collecting merged PRs from pushes
name: Release Drafter

on:
  push:
    # What: Refresh draft on pushes to master/current_dev
    # Why: Keeps shared draft release current with merges
    branches: [master, current_dev]
  workflow_dispatch:

permissions:
  # What: Grant write to contents and read to pull-requests
  # Why: Job needs both; workflow-level floor only
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    name: draft/update release notes
    runs-on: ubuntu-latest
    # What: Explicit 15-minute timeout on single API call
    # Why: AG-CI-016 requires explicit bound, not 360 min
    timeout-minutes: 15
    permissions:
      # What: contents:write for draft; PR:read for metadata
      # Why: release-drafter documented minimum per scope
      contents: write
      pull-requests: read
    steps:
      - name: Run release-drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          # What: Publish on dispatch; draft on push
          # Why: Dispatch fires changelog; push just drafts
          publish: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          # What: Use PAT, not default GITHUB_TOKEN
          # Why: Default token cannot trigger release events
          GITHUB_TOKEN: ${{ secrets.RELEASE_DRAFTER_PAT }}
