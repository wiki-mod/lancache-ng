
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Temporary one-shot transport used to update only the already-authorized
# AG-HDR contract in the large AGENTS.md file without replacing that file
# wholesale through the Contents API. This file is removed after read-back.
name: Temporary AGENTS header contract sync

on:
  push:
    branches: ["agent/1517-spdx-header-backfill"]
    paths: [".github/workflows/_agents-header-contract-once.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/1517-spdx-header-backfill

      - name: Replace only the authorized AG-HDR contract text
        shell: bash
        run: |
          set -euo pipefail

          matrix_001=0
          matrix_008=0
          matrix_009=0
          rule_001=0
          rule_008=0
          rule_009=0
          skip_rule_001=0

          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '| AG-HDR-001 |'*)
                printf '%s\n' '| AG-HDR-001 | Every in-scope source/config file uses the canonical physical three-line `LanCache-NG` + SPDX prefix, preserving a required line-1 interpreter/parser marker or using a blank line 1, with native comment syntax | CI (`file-headers` job runs `scripts/check-file-headers.sh` in build-push.yml) |'
                matrix_001=$((matrix_001 + 1))
                continue
                ;;
              '| AG-HDR-008 |'*)
                printf '%s\n' '| AG-HDR-008 | AGPL-3.0-or-later adopted (root `LICENSE` file); every in-scope file carries `SPDX-License-Identifier: AGPL-3.0-or-later` on physical line 3 after the canonical project line 2; repo-wide backfill is complete | CI (`scripts/check-file-headers.sh` hard-enforces both whole-repository and explicit-file scans) |'
                matrix_008=$((matrix_008 + 1))
                continue
                ;;
              '| AG-HDR-009 |'*)
                printf '%s\n' '| AG-HDR-009 | Repo-wide canonical project/SPDX header backfill is complete; CI hard-fails missing, misplaced, duplicate, or legacy-lowercase headers on non-excluded tracked files | CI (`file-headers` job in build-push.yml) |'
                matrix_009=$((matrix_009 + 1))
                continue
                ;;
              '- **[AG-HDR-001]**'*)
                printf '%s\n' '- **[AG-HDR-001]** Every source/config file (Rust, shell, YAML, Dockerfiles, `.conf`/template files, HTML/CSS/JS) in scope for repository headers uses one canonical physical prefix. Physical line 1 is reserved for a genuinely required interpreter/parser marker such as a shebang; when no such marker is required, line 1 is intentionally blank. Physical line 2 contains the literal project form `LanCache-NG (https://github.com/wiki-mod/lancache-ng)` in the native comment syntax valid for that file. Physical line 3 contains `SPDX-License-Identifier: AGPL-3.0-or-later` using the same native comment syntax. Existing file-purpose documentation follows this fixed prefix and is not displaced or removed merely to satisfy the three-line contract. `scripts/check-file-headers.sh` enforces the exact capitalization, physical positions, native syntax, and uniqueness of the project/SPDX lines.'
                printf '%s\n' '  - Rust: `//!` inner doc comments on lines 2 and 3.'
                printf '%s\n' '  - Shell, Bats, YAML, Dockerfiles, TOML, PowerShell, systemd units, and genuinely plain-text `.conf`/template/config files: `#` line comments on lines 2 and 3. A shebang or supported required parser directive may occupy line 1; otherwise line 1 stays blank.'
                printf '%s\n' '  - HTML Tera templates under `services/ui/src/templates/`: complete standalone Tera comments, exactly `{# LanCache-NG (https://github.com/wiki-mod/lancache-ng) #}` on line 2 and `{# SPDX-License-Identifier: AGPL-3.0-or-later #}` on line 3. Do not use a raw HTML `<!-- ... -->` comment there: Tera comments are safe before an `{% extends ... %}` tag, while ordinary HTML content before `extends` can break template loading. Existing Tera purpose-comment blocks follow the fixed prefix.'
                printf '%s\n' '  - Other HTML: `<!-- ... -->` comments.'
                printf '%s\n' '  - CSS (`.css`): `/* ... */` comments.'
                printf '%s\n' '  - JavaScript (`.js`): `//` line comments.'
                printf '%s\n' '  - Lua (`.lua`): `--` line comments.'
                printf '%s\n' "  - If a file language is not listed here, use that language's own standard comment syntax only after confirming it is valid for the real parser; never default to \`#\` merely from the filename."
                rule_001=$((rule_001 + 1))
                skip_rule_001=1
                continue
                ;;
              '- **[AG-HDR-002]**'*)
                skip_rule_001=0
                ;;
              '- **[AG-HDR-008]**'*)
                printf '%s\n' "- **[AG-HDR-008]** The project adopted the GNU Affero General Public License v3.0 (or later), effective 2026-07-24 (issue #1130, PR referencing #1145); the license text lives at the repository root (\`LICENSE\`) and is not restated here. Every file in scope under Rule-Ref: AG-HDR-001/007 carries \`SPDX-License-Identifier: AGPL-3.0-or-later\` on physical line 3, immediately after the canonical \`LanCache-NG (https://github.com/wiki-mod/lancache-ng)\` project header on line 2 and using that file's native comment syntax. The repository-wide SPDX/project-header backfill is complete, so \`scripts/check-file-headers.sh\` hard-enforces the same contract in both explicit-file mode and whole-repository mode; there is no remaining soft/informational backfill exception."
                rule_008=$((rule_008 + 1))
                continue
                ;;
              '- **[AG-HDR-009]**'*)
                printf '%s\n' '- **[AG-HDR-009]** The repo-wide canonical header backfill is complete. `scripts/check-file-headers.sh` runs in CI and fails when any non-excluded tracked file is missing the required three-line prefix, places the canonical project/SPDX lines on the wrong physical lines, duplicates either line, or retains the legacy lowercase `lancache-ng (...)` project form. New in-scope files must use the same contract immediately rather than treating a CI failure as something to work around.'
                rule_009=$((rule_009 + 1))
                continue
                ;;
            esac

            if [ "$skip_rule_001" -eq 1 ]; then
              continue
            fi
            printf '%s\n' "$line"
          done < AGENTS.md > AGENTS.md.new

          for count in "$matrix_001" "$matrix_008" "$matrix_009" "$rule_001" "$rule_008" "$rule_009"; do
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected every authorized AG-HDR replacement anchor exactly once; counts: matrix=$matrix_001/$matrix_008/$matrix_009 rules=$rule_001/$rule_008/$rule_009"
              exit 1
            fi
          done
          if [ "$skip_rule_001" -ne 0 ]; then
            echo "::error::AG-HDR-002 boundary was not found while replacing AG-HDR-001."
            exit 1
          fi

          mv AGENTS.md.new AGENTS.md
          git diff --check -- AGENTS.md

          changed="$(git diff --name-only)"
          if [ "$changed" != 'AGENTS.md' ]; then
            echo "::error::Temporary sync touched an unexpected path: $changed"
            exit 1
          fi

          git config user.name 'DoMe'
          git config user.email '1812020+djdomi@users.noreply.github.com'
          marker="GPT-$(date +%s)"
          git add AGENTS.md
          git commit -m "$marker" -m 'docs(governance): align canonical header contract'
          git push origin HEAD:agent/1517-spdx-header-backfill
