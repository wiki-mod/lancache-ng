    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning (no new commit,
    # so no new behavior to test).
    name: test (dns/nats-subscriber)
    needs: [validate-compose, dns_rust_quality, detect-changes]
    # What: path-scoped on both pull_request and push events.
    # Why: full canonical reasoning on the linked issue.
