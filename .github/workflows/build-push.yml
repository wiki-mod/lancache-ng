  ci_scope_policy:
    # What: verifies every check required for the PR's files ran.
    # Why: full tolerance-matrix reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    name: CI scope policy
    needs:
      - detect-changes
      - dns_rust_quality
      - ui_rust_quality
      - watchdog_rust_quality
      - dns_test
      - ui_test
      - watchdog_test
      - dns_cargo_audit
      - ui_cargo_audit
      - watchdog_cargo_audit
    if: always()
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # What: 15-minute timeout floor, well above the real 7-14s runtime
    # (only reads upstream `needs` results, runs a policy script).
    # Why: matches detect-changes' own floor for lightweight policy jobs.
    # From: Issue #1095 | PR #1532
    timeout-minutes: 15
    # What: cancel-in-progress is scoped to pull_request only.
    # Why: full reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-ci-scope-policy-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-ci-scope-policy-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      # What: checks out the repo before the Buildx-step guard below.
      # Why: full reasoning (workspace reuse) on the linked issue.
      # From: Issue #1095 | PR #1532
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Enforce scoped CI gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DETECT_RESULT: ${{ needs['detect-changes'].result }}
          DNS_RUST_CHANGED: ${{ needs['detect-changes'].outputs.dns_rust }}
          UI_CHANGED: ${{ needs['detect-changes'].outputs.ui }}
          WATCHDOG_CHANGED: ${{ needs['detect-changes'].outputs.watchdog }}
          WORKFLOW_CHANGED: ${{ needs['detect-changes'].outputs.workflow_reuse_scope }}
          DOCS_CHANGED: ${{ needs['detect-changes'].outputs.docs }}
          DOCS_ONLY: ${{ needs['detect-changes'].outputs.docs_only }}
          GOVERNANCE_CHANGED: ${{ needs['detect-changes'].outputs.governance }}
          SETUP_RUNTIME_CHANGED: ${{ needs['detect-changes'].outputs.setup_runtime }}
          DEPLOY_CHANGED: ${{ needs['detect-changes'].outputs.deploy }}
          RELEASE_CONTRACT_CHANGED: ${{ needs['detect-changes'].outputs.release_contract }}
          SCRIPTS_CHANGED: ${{ needs['detect-changes'].outputs.scripts }}
          DNS_RUST_QUALITY_RESULT: ${{ needs.dns_rust_quality.result }}
          UI_RUST_QUALITY_RESULT: ${{ needs.ui_rust_quality.result }}
          WATCHDOG_RUST_QUALITY_RESULT: ${{ needs.watchdog_rust_quality.result }}
          DNS_TEST_RESULT: ${{ needs.dns_test.result }}
          UI_TEST_RESULT: ${{ needs.ui_test.result }}
          WATCHDOG_TEST_RESULT: ${{ needs.watchdog_test.result }}
          DNS_CARGO_AUDIT_RESULT: ${{ needs.dns_cargo_audit.result }}
          UI_CARGO_AUDIT_RESULT: ${{ needs.ui_cargo_audit.result }}
          WATCHDOG_CARGO_AUDIT_RESULT: ${{ needs.watchdog_cargo_audit.result }}
        run: |
          set -euo pipefail

          # What: greps for the literal step name via a [S] character class.
          # Why: avoids self-matching; full reasoning on the linked issue.
          # From: Issue #1095 | PR #1532
          grep -n -- "- name: [S]et up Docker Buildx for manifest inspection" .github/workflows/build-push.yml >/dev/null || {
            echo "::error::validate-compose must set up Buildx before resolving digest-qualified build-tools images."
            exit 1
          }

          require_boolean() {
            local name="$1" value="$2"
            case "$value" in
              true|false)
                ;;
              *)
                echo "::error::detect-changes output '$name' must be true or false, got '${value:-<empty>}'."
                exit 1
                ;;
            esac
          }

          require_success() {
            local name="$1" value="$2"
            if [ "$value" != "success" ]; then
              echo "::error::$name must succeed for this change set, got '$value'."
              exit 1
            fi
          }

          require_success_or_intentional_skip() {
            local name="$1" value="$2"
            case "$value" in
              success|skipped)
                ;;
              *)
                echo "::error::$name may only be skipped by the PR path filter, got '$value'."
                exit 1
                ;;
            esac
          }

          # What: tolerates success/skipped/cancelled for test/audit jobs.
          # Why: full per-job tolerance reasoning on the linked issue.
          # From: Issue #1095 | PR #1532
          require_success_or_intentional_cancellation() {
            local name="$1" value="$2"
            case "$value" in
              success|skipped|cancelled)
                ;;
              *)
                echo "::error::$name must succeed for this change set, or show a clean supersession outcome (skipped/cancelled) from a newer push superseding it, got '$value'."
                exit 1
                ;;
            esac
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            require_success "rust-quality (dns/nats-subscriber)" "$DNS_RUST_QUALITY_RESULT"
            require_success "rust-quality (ui)" "$UI_RUST_QUALITY_RESULT"
            require_success "rust-quality (watchdog)" "$WATCHDOG_RUST_QUALITY_RESULT"
            require_success_or_intentional_cancellation "test (dns/nats-subscriber)" "$DNS_TEST_RESULT"
            require_success_or_intentional_cancellation "test (ui)" "$UI_TEST_RESULT"
            require_success_or_intentional_cancellation "test (watchdog)" "$WATCHDOG_TEST_RESULT"
            require_success_or_intentional_cancellation "cargo-audit (dns/nats-subscriber)" "$DNS_CARGO_AUDIT_RESULT"
            require_success_or_intentional_cancellation "cargo-audit (ui)" "$UI_CARGO_AUDIT_RESULT"
            require_success_or_intentional_cancellation "cargo-audit (watchdog)" "$WATCHDOG_CARGO_AUDIT_RESULT"
            exit 0
          fi

          require_success "detect changed paths" "$DETECT_RESULT"

          for output in \
            DNS_RUST_CHANGED \
            UI_CHANGED \
            WATCHDOG_CHANGED \
            WORKFLOW_CHANGED \
            DOCS_CHANGED \
            DOCS_ONLY \
            GOVERNANCE_CHANGED \
            SETUP_RUNTIME_CHANGED \
            DEPLOY_CHANGED \
            RELEASE_CONTRACT_CHANGED \
            SCRIPTS_CHANGED
          do
            require_boolean "$output" "${!output}"
          done

          # What: treats labeled/unlabeled/etc. as non-content PR actions.
          # Why: full reasoning on the linked issue.
          # From: Issue #1095 | PR #1532
          content_event=true
          case "$EVENT_ACTION" in
            labeled|unlabeled|milestoned|demilestoned)
              content_event=false
              ;;
          esac

          dns_rust_required=false
          ui_required=false
          watchdog_required=false
          if [ "$content_event" = "true" ]; then
            if [ "$WORKFLOW_CHANGED" = "true" ]; then
              dns_rust_required=true
              ui_required=true
              watchdog_required=true
            fi
            if [ "$DNS_RUST_CHANGED" = "true" ]; then
              dns_rust_required=true
            fi
            if [ "$UI_CHANGED" = "true" ]; then
              ui_required=true
            fi
            if [ "$WATCHDOG_CHANGED" = "true" ]; then
              watchdog_required=true
            fi
          fi
          # What: watchdog_required follows the same content_event gate.
          # Why: full reasoning on the linked issue.
          # From: Issue #1095 | PR #1532

          if [ "$dns_rust_required" = "true" ]; then
            require_success "rust-quality (dns/nats-subscriber)" "$DNS_RUST_QUALITY_RESULT"
            require_success "test (dns/nats-subscriber)" "$DNS_TEST_RESULT"
            require_success "cargo-audit (dns/nats-subscriber)" "$DNS_CARGO_AUDIT_RESULT"
          else
            require_success_or_intentional_skip "rust-quality (dns/nats-subscriber)" "$DNS_RUST_QUALITY_RESULT"
            require_success_or_intentional_skip "test (dns/nats-subscriber)" "$DNS_TEST_RESULT"
            require_success_or_intentional_skip "cargo-audit (dns/nats-subscriber)" "$DNS_CARGO_AUDIT_RESULT"
          fi

          if [ "$ui_required" = "true" ]; then
            require_success "rust-quality (ui)" "$UI_RUST_QUALITY_RESULT"
            require_success "test (ui)" "$UI_TEST_RESULT"
            require_success "cargo-audit (ui)" "$UI_CARGO_AUDIT_RESULT"
          else
            require_success_or_intentional_skip "rust-quality (ui)" "$UI_RUST_QUALITY_RESULT"
            require_success_or_intentional_skip "test (ui)" "$UI_TEST_RESULT"
            require_success_or_intentional_skip "cargo-audit (ui)" "$UI_CARGO_AUDIT_RESULT"
          fi

          if [ "$watchdog_required" = "true" ]; then
            require_success "rust-quality (watchdog)" "$WATCHDOG_RUST_QUALITY_RESULT"
            require_success "test (watchdog)" "$WATCHDOG_TEST_RESULT"
            require_success "cargo-audit (watchdog)" "$WATCHDOG_CARGO_AUDIT_RESULT"
          else
            require_success_or_intentional_skip "rust-quality (watchdog)" "$WATCHDOG_RUST_QUALITY_RESULT"
            require_success_or_intentional_skip "test (watchdog)" "$WATCHDOG_TEST_RESULT"
            require_success_or_intentional_skip "cargo-audit (watchdog)" "$WATCHDOG_CARGO_AUDIT_RESULT"
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice::Docs-only PR: heavy Rust and Docker checks may be skipped, but unconditional policy checks still ran."
          fi
          if [ "$GOVERNANCE_CHANGED" = "true" ]; then
            echo "::notice::Governance files changed; keep review focused on project rules, not only generated artifacts."
          fi
          if [ "$SETUP_RUNTIME_CHANGED" = "true" ] || [ "$DEPLOY_CHANGED" = "true" ] || [ "$RELEASE_CONTRACT_CHANGED" = "true" ]; then
            echo "::notice::Runtime/deploy/release contract files changed; validate-compose remains the lightweight project-wide guard."
          fi

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  container-scan:
    # What: skips on pull_request; needs validate-compose/push-super-
    # session success, tolerates determine-push-reuse-scope skipped.
    # Why: build's own scan covers PRs; that skip is legit off-push,
    # not a failure -- also avoids a stale rebuild-then-scan digest.
    # From: Issue #532 | PR #1339
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs['validate-compose'].result == 'success' &&
        needs['push-supersession-check'].result == 'success' &&
        (needs['determine-push-reuse-scope'].result == 'success' || needs['determine-push-reuse-scope'].result == 'skipped')
      }}
    needs: [validate-compose, push-supersession-check, determine-push-reuse-scope]
    # What: job-level concurrency, keyed per matrix row (service +
    # platform) and per ref; cancel-in-progress is pull_request-only.
    # Why: on push, `build` requires this job's success, so cancelling it
    # would starve the channel; on a PR it's safe since this job never
    # builds locally (G8 fix) and only ever reads a remote image.
    # From: PR #888
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-container-scan-{1}-{2}-{3}-{4}', github.workflow, matrix.service, matrix.platform_tag, github.ref, github.run_id) ||
          format('{0}-container-scan-{1}-{2}-{3}', github.workflow, matrix.service, matrix.platform_tag, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # What: runner selector kept aligned with build/build-arm64's own
    # per-arch split, though this job builds nothing anymore (G8 fix).
    # Why: the surviving pull+scan path still benefits from the same
    # split; one shared convention beats a second, independent selector.
    # From: PR #1482
    runs-on: ${{ fromJSON(matrix.runner) }}
    # What: 60-minute timeout; a changed service finishes in seconds
    # (cheap reuse check only), an unchanged one pulls + scans as usual.
    # Why: headroom for a cold layer cache or vuln-DB refresh, not
    # reflected in the warm-cache samples above.
    # From: PR #1482
    timeout-minutes: 60
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # What: context/build_contexts/description/platform dropped;
          # only service/platform_tag/runner are still read below.
          # Why: this job builds nothing anymore (G8 fix), so those
          # build-only keys have no consumer left.
          # From: PR #1482
          - service: proxy
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dns
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: watchdog
            platform_tag: amd64
            # Moved to heavy alongside build/build-arm64's own watchdog
            # entry (the Rust rewrite's real compile/link step) -- this
            # job's own comment above says its runner selector stays
            # aligned with those two.
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: dhcp
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dhcp-proxy
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ntp
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: syslog
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ui
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: build-tools
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: utilities
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: proxy
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: dns
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: watchdog
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: dhcp
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: dhcp-proxy
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: ntp
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: syslog
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: ui
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: build-tools
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: utilities
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
        if: contains(matrix.runner, 'self-hosted')
      - uses: *checkout_centraliced_versioning # v7.0.1

      - name: Determine per-service publish scan reuse
        # What: reads determine-push-reuse-scope's reuse_<service> output.
        # Why: full reasoning (shared decision) on the linked issue.
        # From: Issue #1095 | PR #1532
        id: push-scan-changes
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          REUSE_JOB_RESULT: ${{ needs['determine-push-reuse-scope'].result }}
          REUSE_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_proxy }}
          REUSE_DNS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dns }}
          REUSE_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_watchdog }}
          REUSE_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp }}
          REUSE_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp_proxy }}
          REUSE_NTP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ntp }}
          REUSE_UI: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ui }}
          REUSE_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_build_tools }}
          REUSE_SYSLOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_syslog }}
          REUSE_UTILITIES: ${{ needs['determine-push-reuse-scope'].outputs.reuse_utilities }}
        run: |
          set -euo pipefail

          # What: mirrors build/build-arm64's own "needs building" case map.
          # Why: single source for which reuse_* output belongs to which
          # matrix.service, not a second copy that could drift.
          # From: PR #1344
          case "$MATRIX_SERVICE" in
            proxy) reuse="$REUSE_PROXY" ;;
            dns) reuse="$REUSE_DNS" ;;
            watchdog) reuse="$REUSE_WATCHDOG" ;;
            dhcp) reuse="$REUSE_DHCP" ;;
            dhcp-proxy) reuse="$REUSE_DHCP_PROXY" ;;
            ntp) reuse="$REUSE_NTP" ;;
            ui) reuse="$REUSE_UI" ;;
            build-tools) reuse="$REUSE_BUILD_TOOLS" ;;
            syslog) reuse="$REUSE_SYSLOG" ;;
            utilities) reuse="$REUSE_UTILITIES" ;;
            *) reuse="false" ;;
          esac

          if [ "$REUSE_JOB_RESULT" = "success" ] && [ "$reuse" = "true" ]; then
            should_scan=false
            echo "::notice::determine-push-reuse-scope confirmed $MATRIX_SERVICE is unchanged and safe to reuse this push; skipping the local rebuild and scanning the unchanged published channel image directly instead."
          else
            should_scan=true
            echo "::notice::determine-push-reuse-scope result was '$REUSE_JOB_RESULT' (reuse='$reuse' for $MATRIX_SERVICE); scan stays enabled, scanning a freshly built local image."
          fi
          echo "should-scan=$should_scan" >> "$GITHUB_OUTPUT"

      # What: a changed service does nothing further here (G8 fix).
      # Why: build/build-arm64's own Trivy-scan step is the sole scan.
      # From: PR #1482

      - name: Self-heal Trivy's own default cache directory ownership
        # What: chowns/setgids ~/.cache/trivy if it exists.
        # Why: a prior root-run process can leave the cache dir root-owned.
        # From: PR #1405
        run: |
          set -euo pipefail
          trivy_home_cache="${HOME}/.cache/trivy"
          if [ -d "$trivy_home_cache" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$trivy_home_cache"
            find "$trivy_home_cache" -type d -exec chmod g+s {} +
          fi

      # What: companion to "Determine per-service publish scan reuse"
      # above; scans the same digest build/build-arm64's retag step used.
      # Why: no local image was built, but skipping the scan entirely
      # would miss a newly disclosed CVE in the published channel image.
      # From: PR #1344
      - name: Resolve channel image for unchanged-scan retag
        id: channel-image
        # What: also gated on push-supersession-check's `superseded` output.
        # Why: a push already superseded before this job started has no
        # reason to pay for a Trivy scan either.
        # From: PR #1334
        if: steps.push-scan-changes.outputs.should-scan == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          # What: consumes determine-push-reuse-scope's own pinned digest
          # instead of re-resolving the mutable channel tag here again.
          # Why: closes a digest TOCTOU race between that job's
          # verification and this job's own re-resolution.
          # From: PR #1499
          DIGEST_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_proxy }}
          DIGEST_DNS: ${{ needs['determine-push-reuse-scope'].outputs.digest_dns }}
          DIGEST_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_watchdog }}
          DIGEST_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp }}
          DIGEST_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp_proxy }}
          DIGEST_NTP: ${{ needs['determine-push-reuse-scope'].outputs.digest_ntp }}
          DIGEST_UI: ${{ needs['determine-push-reuse-scope'].outputs.digest_ui }}
          DIGEST_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.digest_build_tools }}
          DIGEST_SYSLOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_syslog }}
          DIGEST_UTILITIES: ${{ needs['determine-push-reuse-scope'].outputs.digest_utilities }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          repository="$(dmeta_ghcr_repo)"
          case "$MATRIX_SERVICE" in
            proxy) digest="$DIGEST_PROXY" ;;
            dns) digest="$DIGEST_DNS" ;;
            watchdog) digest="$DIGEST_WATCHDOG" ;;
            dhcp) digest="$DIGEST_DHCP" ;;
            dhcp-proxy) digest="$DIGEST_DHCP_PROXY" ;;
            ntp) digest="$DIGEST_NTP" ;;
            ui) digest="$DIGEST_UI" ;;
            build-tools) digest="$DIGEST_BUILD_TOOLS" ;;
            syslog) digest="$DIGEST_SYSLOG" ;;
            utilities) digest="$DIGEST_UTILITIES" ;;
            *) digest="" ;;
          esac

          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "::error::determine-push-reuse-scope reported reuse=true for $MATRIX_SERVICE but did not export a pinned digest -- refusing to scan an unverified reference." >&2
            exit 1
          fi
          image="ghcr.io/${repository}/${MATRIX_SERVICE}@${digest}"
          echo "::notice::$MATRIX_SERVICE is unchanged on this push; scanning $image (the exact digest determine-push-reuse-scope already pinned and verified) instead of rebuilding it."
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # What: UTC-day bucket for the scan-result cache below (G11),
      # computed here rather than inside the composite action.
      # Why: bounds how long an unchanged digest can skip a real Trivy
      # re-scan, as a plain, reviewable line rather than hidden in an action.
      # From: PR #1467
      - name: Compute scan-result cache freshness bucket
        if: steps.push-scan-changes.outputs.should-scan == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        id: scan-cache-bucket
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # What: image-ref is multi-platform; Trivy/Docker resolve it to
      # the runner's own native platform.
      # Why: G11 skips the scan below when this digest scanned clean today.
      # From: PR #1467
      - name: Scan channel image with Trivy (no rebuild)
        if: steps.push-scan-changes.outputs.should-scan == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        uses: ./.github/actions/trivy-scan-with-cache
        with:
          image-ref: ${{ steps.channel-image.outputs.image }}
          digest: ${{ steps.channel-image.outputs.digest }}
          cache-key-scope: ${{ matrix.service }}-${{ matrix.platform_tag }}
          freshness-bucket: ${{ steps.scan-cache-bucket.outputs.value }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          # What: vuln-db-cache-dir omitted; trivy-action falls back to
          # its own default (~/.cache/trivy).
          # Why: "Self-heal Trivy's own cache dir ownership" above already
          # keeps that default writable.
          # From: Issue #1095 | PR #1532

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always() && contains(matrix.runner, 'self-hosted')
  determine-push-reuse-scope:
    # What: decides once per push whether a service can safely retag.
    # Why: full reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    name: determine push reuse scope (Step 4)
    needs: detect-changes
    # Branches only -- a release tag push has no meaningful "channel" to
    # reuse from (github.event.before is meaningless for the first push of a
    # new tag, and AG-CI-010 already requires release tags to always build
    # the tag-scoped build-tools image fresh; the same reasoning applies to
    # every other service here). Release tags always get a full, fresh
    # build/scan -- no reuse path at all.
    # What: skip-tolerant; excludes schedule/nightly-dispatch too.
    # Why: dependency-refresh triggers must always build fresh.
    # From: Issue #1683 | PR #1778
    if: >-
      ${{
        always() &&
        (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')) &&
        github.event_name != 'schedule' &&
        !(github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'nightly') &&
        (needs['detect-changes'].result == 'success' || needs['detect-changes'].result == 'skipped')
      }}
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real cost here is a handful of registry reads (docker buildx imagetools
    # inspect, twice per allowlisted service) plus one classify-image-impact.sh
    # invocation per service -- the same "cheap self-hosted script job" class
    # as detect-changes itself (6-17s real). 15 minutes matches that job's
    # own floor for the same reason: generous, round, and still turns any
    # future hang into a fast, bounded failure rather than genuinely needed
    # headroom.
    timeout-minutes: 15
    permissions:
      contents: read
      # Read-only: this job only inspects already-published images, it never
      # pushes or retags anything itself (build/build-arm64 do the actual
      # `imagetools create` retag, each for its own arch, once this job's
      # decision says it's safe to).
      packages: read
    outputs:
      reuse_proxy: ${{ steps.decide.outputs.reuse_proxy }}
      reuse_dns: ${{ steps.decide.outputs.reuse_dns }}
      reuse_ui: ${{ steps.decide.outputs.reuse_ui }}
      reuse_watchdog: ${{ steps.decide.outputs.reuse_watchdog }}
      reuse_dhcp: ${{ steps.decide.outputs.reuse_dhcp }}
      reuse_dhcp_proxy: ${{ steps.decide.outputs.reuse_dhcp_proxy }}
      reuse_ntp: ${{ steps.decide.outputs.reuse_ntp }}
      reuse_build_tools: ${{ steps.decide.outputs.reuse_build_tools }}
      # What: syslog/utilities reuse-decision outputs, alongside the
      # other 8 allowlisted services.
      # Why: same three-part verification as every other allowlisted
      # service; no new logic, only these two additional outputs.
      # From: Issue #1095
      reuse_syslog: ${{ steps.decide.outputs.reuse_syslog }}
      reuse_utilities: ${{ steps.decide.outputs.reuse_utilities }}
      # What: the pinned digest reuse=true services verified against.
      # Why: closes a digest TOCTOU race; see the linked issue.
      # From: Issue #1095 | PR #1532
      digest_proxy: ${{ steps.decide.outputs.digest_proxy }}
      digest_dns: ${{ steps.decide.outputs.digest_dns }}
      digest_ui: ${{ steps.decide.outputs.digest_ui }}
      digest_watchdog: ${{ steps.decide.outputs.digest_watchdog }}
      digest_dhcp: ${{ steps.decide.outputs.digest_dhcp }}
      digest_dhcp_proxy: ${{ steps.decide.outputs.digest_dhcp_proxy }}
      digest_ntp: ${{ steps.decide.outputs.digest_ntp }}
      digest_build_tools: ${{ steps.decide.outputs.digest_build_tools }}
      digest_syslog: ${{ steps.decide.outputs.digest_syslog }}
      digest_utilities: ${{ steps.decide.outputs.digest_utilities }}
    steps:
      # fetch-depth: 0 (not the default shallow depth-1 clone) so
      # sif_is_ancestor_or_equal below can prove real git ancestry between a
      # channel image's build commit (which may be many commits behind
      # github.sha -- nightly is only refreshed once daily/on-demand, see
      # scripts/lib/push-reuse.sh's header) and github.sha itself. Same
      # requirement, same fix, as detect-changes' own fetch-depth: 0
      # checkout a few jobs up in this same file.
      - uses: *checkout_centraliced_versioning # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        # Without this, the registry reads below pull anonymously -- a much lower GHCR rate
        # limit that has already failed for real under concurrent CI load in this exact
        # workflow (see "Resolve compose validation image"'s own comment earlier in this
        # file for the confirmed incident: "denied: denied" under a real push burst). This
        # job exists specifically to help with burst/push-cost behavior, so skipping this
        # login would risk reintroducing the exact class of failure it's meant to reduce.
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide per-service push reuse
        id: decide
        env:
          # What: resolves REF_NAME via base_ref on pull_request.
          # Why: ref_name is the merge ref, not the target branch.
          # From: Issue #1683 | PR #1778
          REF_NAME: ${{ github.base_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PROXY_CHANGED: ${{ needs['detect-changes'].outputs.proxy }}
          DNS_CHANGED: ${{ needs['detect-changes'].outputs.dns_image }}
          UI_CHANGED: ${{ needs['detect-changes'].outputs.ui }}
          WATCHDOG_CHANGED: ${{ needs['detect-changes'].outputs.watchdog }}
          DHCP_CHANGED: ${{ needs['detect-changes'].outputs.dhcp }}
          DHCP_PROXY_CHANGED: ${{ needs['detect-changes'].outputs.dhcp_proxy }}
          NTP_CHANGED: ${{ needs['detect-changes'].outputs.ntp }}
          BUILD_TOOLS_CHANGED: ${{ needs['detect-changes'].outputs.build_tools }}
          SYSLOG_CHANGED: ${{ needs['detect-changes'].outputs.syslog }}
          UTILITIES_CHANGED: ${{ needs['detect-changes'].outputs.utilities }}
          # What: needed for push_reuse_decide's sif_image_revision call
          # and this step's own digest-pinning read below.
          # Why: sif_image_revision is now ghcr_retry-wrapped (see
          # staging-image-freshness.sh).
          # From: Issue #1095 | PR #1532
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/staging-image-freshness.sh
          source "$GITHUB_WORKSPACE/scripts/lib/staging-image-freshness.sh"
          # shellcheck source=scripts/lib/push-reuse.sh
          source "$GITHUB_WORKSPACE/scripts/lib/push-reuse.sh"
          # What: resolve_build_tools_channel is reused as-is despite its
          # build-tools-specific name; the mapping itself is generic.
          # Why: avoids duplicating the same ref-to-channel mapping twice.
          # From: Issue #1095 | PR #1532
          # shellcheck source=scripts/lib/build-tools-channel.sh
          source "$GITHUB_WORKSPACE/scripts/lib/build-tools-channel.sh"

          channel="$(resolve_build_tools_channel "$REF_NAME")"
          echo "::notice::Resolved channel '$channel' for ref '$REF_NAME'."

          # What: decide_one is shared; two services skip one check.
          # Why: build-tools/utilities skip the workflow gate below.
          # From: Issue #1095
          allowlist=(proxy dns ui watchdog dhcp dhcp-proxy ntp build-tools syslog utilities)

          is_allowlisted() {
            case " ${allowlist[*]} " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # decide_one <classify_key> <matrix_service> <before_sha_changed> [dep_keys] [ignore_workflow_gate]
          # What: dep_keys are extra classify keys that must also show unchanged.
          # Why: push_reuse_decide needs them to check base-image dependencies.
          # From: Issue #1095 | PR #1532
          decide_one() {
            local classify_key="$1" matrix_service="$2" before_sha_changed="$3" dep_keys="${4:-}"
            local ignore_workflow_gate="${5:-}"
            local output_key="${matrix_service//-/_}"

            # What: fast-path skip fires only on a proven 'true'.
            # Why: detect-changes is skipped (empty) off push/PR.
            # From: Issue #1683 | PR #1778
            if [ "$before_sha_changed" = "true" ]; then
              echo "::notice::$matrix_service: detect-changes reports this service changed since the immediately preceding push; not attempting reuse (a real rebuild is needed regardless of channel state)." >&2
              printf 'false\n'
              return
            fi
            if ! is_allowlisted "$matrix_service"; then
              echo "::notice::$matrix_service: not yet in the Step 4 allowlist; building normally." >&2
              printf 'false\n'
              return
            fi

            # What: a manual dispatch beats the workflow-gate exemption.
            # Why: "build everything now" must also reach these two.
            # From: Issue #1095
            if [ "$ignore_workflow_gate" = "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::notice::$matrix_service: workflow_dispatch requested; building for real instead of attempting reuse (the workflow-gate exemption applies only to push/pull_request)." >&2
              printf 'false\n'
              return
            fi

            local channel_image="ghcr.io/${REPOSITORY}/${matrix_service}:${channel}"

            # Resolve the channel tag to its immutable manifest-list digest ONCE, right here,
            # before any verification -- not independently, later, by container-scan/build/
            # build-arm64 (the digest TOCTOU race; see this job's own `outputs:` comment
            # above). push_reuse_decide below then verifies safety (revision label + ancestry
            # + content diff) against this EXACT pinned reference instead of the mutable tag,
            # so the verified bytes and the exported bytes are provably identical.
            local digest
            digest="$(ghcr_retry ghcr.io "${GHCR_RETRY_USERNAME:-}" "${GHCR_RETRY_PASSWORD:-}" -- docker buildx imagetools inspect "$channel_image" --format '{{json .Manifest.Digest}}' 2>/dev/null)" || digest=""
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" == "null" ]]; then
              echo "::notice::$matrix_service: could not resolve a manifest digest for $channel_image; not attempting reuse (failing closed to a real rebuild)." >&2
              printf 'false\n'
              return
            fi

            local pinned_ref="ghcr.io/${REPOSITORY}/${matrix_service}@${digest}"
            local reuse
            reuse="$(push_reuse_decide "$classify_key" "$pinned_ref" "$COMMIT_SHA" "$dep_keys" "$ignore_workflow_gate")"
            if [ "$reuse" = "true" ]; then
              printf 'digest_%s=%s\n' "$output_key" "$digest" >> "$GITHUB_OUTPUT"
            fi
            printf '%s\n' "$reuse"
          }

          # What: 7 services depend on utilities; dns/ui/watchdog also on build-tools.
          # Why: matches each Dockerfile's real FROM/COPY --from= dependency graph.
          # From: Issue #1095
          {
            printf 'reuse_proxy=%s\n' "$(decide_one proxy proxy "$PROXY_CHANGED" utilities)"
            printf 'reuse_dns=%s\n' "$(decide_one dns_image dns "$DNS_CHANGED" "utilities build_tools")"
            printf 'reuse_ui=%s\n' "$(decide_one ui ui "$UI_CHANGED" "utilities build_tools")"
            printf 'reuse_watchdog=%s\n' "$(decide_one watchdog watchdog "$WATCHDOG_CHANGED" "utilities build_tools")"
            printf 'reuse_dhcp=%s\n' "$(decide_one dhcp dhcp "$DHCP_CHANGED" utilities)"
            printf 'reuse_dhcp_proxy=%s\n' "$(decide_one dhcp_proxy dhcp-proxy "$DHCP_PROXY_CHANGED" utilities)"
            printf 'reuse_ntp=%s\n' "$(decide_one ntp ntp "$NTP_CHANGED" utilities)"
            printf 'reuse_syslog=%s\n' "$(decide_one syslog syslog "$SYSLOG_CHANGED")"
            # What: these two alone ignore the workflow gate (last arg).
            # Why: shared tooling/base image; own path fully gates them.
            # From: Issue #1095
            printf 'reuse_build_tools=%s\n' "$(decide_one build_tools build-tools "$BUILD_TOOLS_CHANGED" "" true)"
            printf 'reuse_utilities=%s\n' "$(decide_one utilities utilities "$UTILITIES_CHANGED" "" true)"
          } >> "$GITHUB_OUTPUT"

  # What: computes build/build-arm64's shared should-build admission once,
  #   exposed as a plain output both jobs read.
  # Why: the two jobs previously each duplicated the same boolean `if:`
  #   byte-for-byte; a fix to one copy could silently leave the other diverged.
  # From: Issue #1095 (G7) | PR #1503
  determine-build-admission:
    name: determine build/build-arm64 admission (G7)
    needs:
      - shellcheck
      - validate-compose
      - ci_scope_policy
      - line-endings
      - container-scan
      - file-headers
      - compose-healthchecks
      - pr-template-check
      - pr-tracking-metadata-check
      - pr-title-convention-check
    # What: never resolves to "skipped" (if: always(), no other condition).
    # Why: avoids the implicit-success()-over-a-skippable-dependency hazard
    #   noted on container-scan/promote's own `if:` blocks in this file.
    # From: Issue #1095 (G7) | PR #1503
    if: always()
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 15
    outputs:
      admitted: ${{ steps.decide.outputs.admitted }}
    steps:
      - name: Decide whether build/build-arm64 may run
        id: decide
        env:
          # What: passes each dependency's result as a plain env string.
          # Why: a malformed value fails the `case` match below loudly
          #   instead of silently passing a raw `[[ ... ]]` expansion.
          # From: Issue #1095 (G7) | PR #1503
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          VALIDATE_COMPOSE_RESULT: ${{ needs['validate-compose'].result }}
          CI_SCOPE_POLICY_RESULT: ${{ needs.ci_scope_policy.result }}
          LINE_ENDINGS_RESULT: ${{ needs['line-endings'].result }}
          CONTAINER_SCAN_RESULT: ${{ needs['container-scan'].result }}
          FILE_HEADERS_RESULT: ${{ needs['file-headers'].result }}
          COMPOSE_HEALTHCHECKS_RESULT: ${{ needs['compose-healthchecks'].result }}
          PR_TEMPLATE_CHECK_RESULT: ${{ needs['pr-template-check'].result }}
          PR_TRACKING_METADATA_CHECK_RESULT: ${{ needs['pr-tracking-metadata-check'].result }}
          PR_TITLE_CONVENTION_CHECK_RESULT: ${{ needs['pr-title-convention-check'].result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          is_success() { [ "$1" = "success" ]; }

          admitted=true

          # What: Step 1 -- gates required regardless of event type.
          # Why: shellcheck/validate-compose/ci_scope_policy must pass
          # before any build/scan work, on every trigger.
          # From: Issue #1095 (G7) | PR #1503
          is_success "$SHELLCHECK_RESULT" || admitted=false
          is_success "$VALIDATE_COMPOSE_RESULT" || admitted=false
          is_success "$CI_SCOPE_POLICY_RESULT" || admitted=false
          is_success "$LINE_ENDINGS_RESULT" || admitted=false

          # What: Step 2 -- rejects a metadata-only pull_request event.
          # Why: labeled/unlabeled/milestoned/demilestoned never carry a new
          #   commit, so there is no new image content to build.
          # From: Issue #1095 (G7) | PR #1503
          case "$EVENT_NAME" in
            pull_request)
              case "$EVENT_ACTION" in
                labeled | unlabeled | milestoned | demilestoned)
                  admitted=false
                  ;;
              esac
              ;;
          esac

          # What: Step 3 -- pull_request-only gates, skipped otherwise.
          # Why: these jobs only run on pull_request; a plain is_success check
          #   would fail closed on any other event where they never ran.
          # From: Issue #1095 (G7) | PR #1503
          if [ "$EVENT_NAME" = "pull_request" ]; then
            is_success "$FILE_HEADERS_RESULT" || admitted=false
            is_success "$COMPOSE_HEALTHCHECKS_RESULT" || admitted=false
            is_success "$PR_TEMPLATE_CHECK_RESULT" || admitted=false
            is_success "$PR_TRACKING_METADATA_CHECK_RESULT" || admitted=false
            is_success "$PR_TITLE_CONVENTION_CHECK_RESULT" || admitted=false
          else
            # What: container-scan gate, required only off pull_request.
            # Why: mirrors build's own if: block (container-scan is the
            #   inverse shape of the pull_request-only gates above).
            # From: Issue #1095 (G7) | PR #1503
            is_success "$CONTAINER_SCAN_RESULT" || admitted=false
          fi

          echo "admitted=$admitted" >> "$GITHUB_OUTPUT"

  build:
    # What: the only job that publishes service sha-* images.
    # Why: full reasoning on the linked issue.
    # From: Issue #1095 | PR #1499 | PR #1503 | PR #1532
    needs:
      - determine-build-admission
      - shellcheck
      - validate-compose
      - container-scan
      - detect-changes
      - determine-push-reuse-scope
      - ci_scope_policy
      - file-headers
      - compose-healthchecks
      - pr-template-check
      - pr-tracking-metadata-check
      - pr-title-convention-check
      - line-endings
      - push-supersession-check
    if: always() && needs['determine-build-admission'].result == 'success' && needs['determine-build-admission'].outputs.admitted == 'true'
    # What: selects the runner per matrix service via fromJSON, mirroring
    # container-scan's own pattern.
    # Why: an AG-CI-002 measured exception; see this job's matrix comment
    # for which services route to light vs heavy and why.
    # From: Issue #1095 | PR #1532
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 150
    # What: job-level concurrency, keyed per matrix service and ref.
    # Why: full cancellation reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-build-{1}-{2}-{3}', github.workflow, matrix.service, github.ref, github.run_id) ||
          format('{0}-build-{1}-{2}', github.workflow, matrix.service, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    # What: adds issues:write; other scopes below stay unchanged.
    # Why: job-level permissions: replaces, not merges, the
    #   workflow-level block; issues:write is for the self-closing
    #   Trivy report added to this job.
    # From: Issue #1095
      UTILITIES_IMAGE: ${{ needs['validate-compose'].outputs.utilities_image }}
      UTILITIES_DIGEST: ${{ needs['validate-compose'].outputs.utilities_digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: &normal-build-services
          # What: runner tiers below (AG-CI-002 measured exception).
          # Why: full per-service reasoning on the linked issue.
          # From: Issue #1095 | PR #1523

          - service: proxy
            context: services/proxy
            # Proxy needs DNS domain data that lives outside its own build context.
            build_contexts: dns-domains=services/dns
            description: &ci-description-proxy "nginx-based lancache-ng caching proxy for standard and TLS-interception cache traffic."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dns
            # What: repo-root context; dockerfile set below.
            # Why: workspace needs all 5 member manifests.
            # From: Issue #1095
            context: .
            dockerfile: services/dns/Dockerfile
            build_contexts: ""
            description: &ci-description-dns "PowerDNS recursor, authoritative DNS, and NATS subscriber service for lancache-ng cache routing."
            rust: true
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: watchdog
            # What: repo-root context; dockerfile set below.
            # Why: workspace needs all 5 member manifests.
            # From: Issue #1095
            context: .
            dockerfile: services/watchdog/Dockerfile
            build_contexts: ""
            description: &ci-description-watchdog "lancache-ng watchdog helper for runtime health checks and recovery hooks."
            # Re-evaluation triggered (the Rust rewrite is now
            # wired into this Dockerfile's own builder stage): watchdog no
            # longer qualifies for the AG-CI-002 light-tier exception the
            # comment above documents -- it now has a real musl cargo
            # build/link step (sccache/distcc/ccache-accelerated, same as
            # dns/ui), so it moves to lancache-heavy alongside them, per
            # this exception's own explicit non-grandfathering text.
            rust: true
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: dhcp
            context: services/dhcp
            build_contexts: ""
            description: &ci-description-dhcp "Kea DHCP, control-agent, and DHCP-DDNS service for lancache-ng managed networks."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dhcp-proxy
            context: services/dhcp-proxy
            build_contexts: ""
            description: &ci-description-dhcp-proxy "dnsmasq-based DHCP proxy and relay helper for lancache-ng deployments."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ntp
            context: services/ntp
            build_contexts: ""
            description: &ci-description-ntp "chrony-based NTP server for lancache-ng, disciplined against public NTP servers and serving LAN clients on UDP/123."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: syslog
            context: services/syslog
            build_contexts: ""
            description: &ci-description-syslog "Combined fluent-bit + syslog-ng first-party central logging service for lancache-ng (issue #1428)."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ui
            # What: repo-root context; dockerfile set below.
            # Why: workspace needs all 5 member manifests.
            # From: Issue #1095
            context: .
            dockerfile: services/ui/Dockerfile
            build_contexts: ""
            description: &ci-description-ui "lancache-ng Admin UI and control-plane service for cache, DNS, DHCP, and secondary management."
            rust: true
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: build-tools
            context: tools/build-tools
            build_contexts: ""
            description: &ci-description-build-tools "Prebuilt lancache-ng CI and developer validation toolchain image."
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: utilities
            context: services/utilities
            build_contexts: ""
            description: "Shared lancache-ng utilities image (curl, nano, lsof, ripgrep, findutils, coreutils, gettext-envsubst, jq, ca-certificates, zstd) for COPY --from= consumption by eight first-party images (issue #1556)."
            # Heavy, not light, despite being a small/fast build in practice
            # (curl's own C compile is ~20s): AG-CI-002's light-tier exception
            # requires "no real compile/link step of its own AT ALL", verified
            # by inspecting the Dockerfile's own build graph, not assumed --
            # services/utilities/Dockerfile's curl-builder stage genuinely
            # compiles/links curl from source (gcc/make), so it does not meet
            # that carve-out's literal precondition the way proxy/dhcp-proxy/
            # watchdog/dhcp/syslog/ntp (pure package-install or COPY --from,
            # no compiler invoked at all) do. Revisit if a future change
            # removes the from-source curl build.
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'

    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Determine whether this service needs building
        id: should-build
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          DETECT_CHANGES_RESULT: ${{ needs['detect-changes'].result }}
          SUPERSEDED: ${{ needs['push-supersession-check'].outputs.superseded }}
          # What: reuse scope now also runs on pull_request events.
          # Why: still 'skipped' for a non-branch push (e.g. a tag).
          # From: Issue #1683 | PR #1778
          REUSE_JOB_RESULT: ${{ needs['determine-push-reuse-scope'].result }}
          REUSE_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_proxy }}
          REUSE_DNS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dns }}
          REUSE_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_watchdog }}
          REUSE_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp }}
          REUSE_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp_proxy }}
          REUSE_NTP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ntp }}
          REUSE_UI: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ui }}
          REUSE_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_build_tools }}
          REUSE_SYSLOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_syslog }}
          REUSE_UTILITIES: ${{ needs['determine-push-reuse-scope'].outputs.reuse_utilities }}
        run: |
          set -euo pipefail

          # What: maps a service to its reuse output (per-step helper).
          # Why: no GH Actions expression indexes outputs dynamically.
          # From: Issue #1683 | PR #1778
          reuse_for_service() {
            case "$1" in
              proxy) printf '%s' "$REUSE_PROXY" ;;
              dns) printf '%s' "$REUSE_DNS" ;;
              watchdog) printf '%s' "$REUSE_WATCHDOG" ;;
              dhcp) printf '%s' "$REUSE_DHCP" ;;
              dhcp-proxy) printf '%s' "$REUSE_DHCP_PROXY" ;;
              ntp) printf '%s' "$REUSE_NTP" ;;
              ui) printf '%s' "$REUSE_UI" ;;
              build-tools) printf '%s' "$REUSE_BUILD_TOOLS" ;;
              syslog) printf '%s' "$REUSE_SYSLOG" ;;
              utilities) printf '%s' "$REUSE_UTILITIES" ;;
              *) printf 'false' ;;
            esac
          }

          should_build=true
          reuse_eligible=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
              echo "::error::Pull request build scoping requires detect-changes to succeed, got '$DETECT_CHANGES_RESULT'."
              exit 1
            fi
            case "$MATRIX_SERVICE" in
              proxy) should_build="${{ needs['detect-changes'].outputs.proxy }}" ;;
              dns) should_build="${{ needs['detect-changes'].outputs.dns_image }}" ;;
              watchdog) should_build="${{ needs['detect-changes'].outputs.watchdog }}" ;;
              dhcp) should_build="${{ needs['detect-changes'].outputs.dhcp }}" ;;
              dhcp-proxy) should_build="${{ needs['detect-changes'].outputs.dhcp_proxy }}" ;;
              ntp) should_build="${{ needs['detect-changes'].outputs.ntp }}" ;;
              syslog) should_build="${{ needs['detect-changes'].outputs.syslog }}" ;;
              utilities) should_build="${{ needs['detect-changes'].outputs.utilities }}" ;;
              ui) should_build="${{ needs['detect-changes'].outputs.ui }}" ;;
              build-tools) should_build="${{ needs['detect-changes'].outputs.build_tools }}" ;;
              *)
                echo "::error::Unknown matrix service '$MATRIX_SERVICE' has no path-scoping mapping."
                exit 1
                ;;
            esac

            # What: PR-untouched services also consult the reuse check.
            # Why: lets the retag step publish a PR tag, no rebuild.
            # From: Issue #1683 | PR #1778
            if [ "$should_build" = "false" ] && [ "$REUSE_JOB_RESULT" = "success" ]; then
              reuse="$(reuse_for_service "$MATRIX_SERVICE")"
              if [ "$reuse" = "true" ]; then
                reuse_eligible=true
                echo "::notice::$MATRIX_SERVICE is unchanged since the PR base AND content-diff-verified reusable; the retag step below will publish this PR's staging tag without a rebuild."
              else
                echo "::notice::$MATRIX_SERVICE is unchanged since the PR base but not (yet) content-diff-verified reusable (reuse job result='$REUSE_JOB_RESULT', reuse='${reuse:-<unset>}'); its PR staging tag stays absent pending a later ancestor-fallback backfill."
              fi
            fi
          elif [ "$REUSE_JOB_RESULT" = "success" ]; then
            # What: determine-push-reuse-scope's check covers all 10 services.
            # Why: full reasoning on the linked issue.
            # From: Issue #1095 | PR #1532
            reuse="$(reuse_for_service "$MATRIX_SERVICE")"
            if [ "$reuse" = "true" ]; then
              should_build=false
              reuse_eligible=true
            fi
          fi

          # What: a newer commit may have superseded this one already.
          # Why: full reasoning on the linked issue.
          # From: Issue #1095 | PR #1532
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$SUPERSEDED" = "true" ]; then
            echo "::notice::A newer push to $GITHUB_REF has already superseded this run; skipping $MATRIX_SERVICE's build so only the run already targeting the current tip does the heavy work."
            should_build=false
            reuse_eligible=false
          fi

          case "$should_build" in
            true|false)
              ;;
            *)
              echo "::error::Build scope for $MATRIX_SERVICE must resolve to true or false, got '${should_build:-<empty>}'."
              exit 1
              ;;
          esac

          if [ "$should_build" = "true" ]; then
            echo "::notice::$MATRIX_SERVICE inputs changed (or this is not a pull request); image build remains enabled."
          else
            echo "::notice::$MATRIX_SERVICE inputs did not change in this pull request; skipping routine image rebuild."
          fi
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"
          echo "reuse-eligible=$reuse_eligible" >> "$GITHUB_OUTPUT"

      # Widened to also cover a Step 4 push-reuse-only path (should-build
      # == 'false' but matrix.service is a push-reusable service on a push
      # event, not a pull_request skip): "Retag unchanged service image for
      # this commit" below needs a real builder the same way an actual
      # build/push would, even though it never invokes `docker buildx
      # build`. Mirrors issue #1290's identical widening for build-tools's
      # own retag-only path.
      # What: also covers a trusted PR reuse-eligible retag path.
      # Why: reuse-eligible is now computed for pull_request too.
      # From: Issue #1683 | PR #1778

      - name: Clean up stale Buildx builder containers (self-hosted reuse hardening)
        run: bash scripts/tracked/cleanup-stale-buildx-builders.sh
      - name: Set up Docker Buildx
        if: >-
          ${{
            steps.should-build.outputs.should-build == 'true' ||
            steps.should-build.outputs.reuse-eligible == 'true'
          }}
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        # What: also logs in on pull_request events, for the PR-scoped
        # staging tag push below.
        # Why: fork/Dependabot PRs get a read-only GITHUB_TOKEN, so login
        # there is safe by construction.
        # From: Issue #1095 | PR #1619
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true' ||
              steps.should-build.outputs.reuse-eligible == 'true'
            ) &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: retags an already-verified, unchanged service's image.
      # Why: full digest-race reasoning on the linked issue.
      # From: Issue #1095 | PR #1532
      - name: Retag unchanged service image for this commit (linux/amd64, no rebuild)
        # What: also fires for a trusted, reuse-eligible pull_request.
        # Why: fork/Dependabot never reach reuse-eligible (no login).
        # From: Issue #1683 | PR #1778
        if: >-
          ${{
            steps.should-build.outputs.reuse-eligible == 'true' &&
            needs['push-supersession-check'].outputs.superseded != 'true' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          MATRIX_SERVICE: ${{ matrix.service }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_proxy }}
          DIGEST_DNS: ${{ needs['determine-push-reuse-scope'].outputs.digest_dns }}
          DIGEST_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_watchdog }}
          DIGEST_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp }}
          DIGEST_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp_proxy }}
          DIGEST_NTP: ${{ needs['determine-push-reuse-scope'].outputs.digest_ntp }}
          DIGEST_UI: ${{ needs['determine-push-reuse-scope'].outputs.digest_ui }}
          DIGEST_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.digest_build_tools }}
          DIGEST_SYSLOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_syslog }}
          DIGEST_UTILITIES: ${{ needs['determine-push-reuse-scope'].outputs.digest_utilities }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required on this runner for the Step 4 retag-only path."
            exit 1
          }

          case "$MATRIX_SERVICE" in
            proxy) pinned_digest="$DIGEST_PROXY" ;;
            dns) pinned_digest="$DIGEST_DNS" ;;
            watchdog) pinned_digest="$DIGEST_WATCHDOG" ;;
            dhcp) pinned_digest="$DIGEST_DHCP" ;;
            dhcp-proxy) pinned_digest="$DIGEST_DHCP_PROXY" ;;
            ntp) pinned_digest="$DIGEST_NTP" ;;
            ui) pinned_digest="$DIGEST_UI" ;;
            build-tools) pinned_digest="$DIGEST_BUILD_TOOLS" ;;
            syslog) pinned_digest="$DIGEST_SYSLOG" ;;
            utilities) pinned_digest="$DIGEST_UTILITIES" ;;
            *) pinned_digest="" ;;
          esac
          if [ -z "$pinned_digest" ]; then
            echo "::error::determine-push-reuse-scope reported reuse=true for $MATRIX_SERVICE but did not export a pinned digest -- refusing to retag from an unverified reference."
            exit 1
          fi
          pinned_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${pinned_digest}"

          # What: PR events retag under the PR's own staging tag.
          # Why: matches "Compute PR staging tag"'s exact tag shape.
          # From: Issue #1683 | PR #1778
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            : "${PR_NUMBER:?PR_NUMBER (github.event.pull_request.number) is required}"
            target="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}:pr-${PR_NUMBER}-sha-${COMMIT_SHA}-amd64"
          else
            # What: uses the full commit SHA directly, no local truncation.
            # Why: short-SHA tags are banned; a local slice risks collisions.
            # From: Issue #1095 (G2) | PR #1503
            target="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}:sha-${COMMIT_SHA}-amd64"
          fi

          manifest_json="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$pinned_ref" --raw)"
          amd64_digest="$(printf '%s' "$manifest_json" | jq -r '[.manifests[]? | select(.platform.architecture == "amd64" and .platform.os == "linux")][0].digest // empty')"
          if [ -z "$amd64_digest" ]; then
            echo "::error::Could not find a linux/amd64 manifest for $pinned_ref; refusing to retag $MATRIX_SERVICE -- this would leave promote without a valid amd64 source image for this commit."
            exit 1
          fi

          source_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${amd64_digest}"
          echo "::notice::$MATRIX_SERVICE is unchanged (Step 4, verified via scripts/lib/push-reuse.sh); retagging $source_ref (from the pinned digest $pinned_ref) as $target instead of rebuilding."
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create --tag "$target" "$source_ref"

      - name: Extract metadata
        # This job only ever publishes the linux/amd64 leg of each service
        # image, under a platform-suffixed tag. The merge-manifests job below
        # combines this tag with build-arm64's linux/arm64 tag into the real
        # sha-<commit> multi-platform tag that promote/release/setup.sh
        # actually consume -- see docs/self-hosted-actions-runner.md.
        if: steps.should-build.outputs.should-build == 'true'
        id: meta
        uses: &docker_metadata_centraliced_versioning docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-amd64

      # Key PR staging tags by github.sha, the actual synthetic merge commit that was built.
      # This prevents two events for the same PR head but different base states from overwriting one staging tag.
      - name: Compute PR staging tag
        id: pr-tag
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.should-build.outputs.should-build == 'true' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
          MATRIX_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: uses the full commit SHA directly, no local truncation.
          # Why: short-SHA tags are banned; a local slice risks collisions.
          # From: Issue #1095 (G2) | PR #1503
          tag="pr-${PR_NUMBER}-sha-${BUILD_SHA}-amd64"
          echo "::notice::This PR's linux/amd64 staging tag for $MATRIX_SERVICE is $tag."
          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          repository="$(dmeta_ghcr_repo)"
          {
            printf 'tag=%s\n' "$tag"
            printf 'image=ghcr.io/%s/%s:%s\n' "$repository" "$MATRIX_SERVICE" "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: matrix.service == 'build-tools' && steps.should-build.outputs.should-build == 'true'
        run: |
          set -euo pipefail

          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare local Buildx cache
        if: steps.should-build.outputs.should-build == 'true'
        id: buildx-cache
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_READ: ${{ runner.temp }}/lancache-ng-buildx-cache/${{ matrix.service }}-read
          BUILDX_CACHE_DEST: ${{ runner.temp }}/lancache-ng-buildx-cache/${{ matrix.service }}-new
        run: |
          set -euo pipefail

          if ! command -v flock >/dev/null 2>&1; then
            echo "::error::flock is required for safe local Buildx cache locking."
            exit 1
          fi

          cache_dir="$BUILDX_CACHE_ROOT/${{ matrix.service }}"
          lock_file="$BUILDX_CACHE_ROOT/${{ matrix.service }}.lock"

          mkdir -p "$BUILDX_CACHE_ROOT"
          rm -rf "$BUILDX_CACHE_READ" "$BUILDX_CACHE_DEST"
          mkdir -p "$BUILDX_CACHE_READ" "$(dirname "$BUILDX_CACHE_DEST")"

          (
            flock -x 9
            mkdir -p "$cache_dir"
            cp -a "$cache_dir/." "$BUILDX_CACHE_READ/"
          ) 9>"$lock_file"

          {
            echo "cache-from=$BUILDX_CACHE_READ"
            echo "cache-to=$BUILDX_CACHE_DEST"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Docker build parallelism
        if: steps.should-build.outputs.should-build == 'true'
        id: docker-build-jobs
        run: |
          set -euo pipefail

          if [ -n "${CARGO_BUILD_JOBS:-}" ]; then
            case "$CARGO_BUILD_JOBS" in
              ''|*[!0-9]*)
                echo "::error::CARGO_BUILD_JOBS must be a positive integer."
                exit 1
                ;;
            esac
            if [ "$CARGO_BUILD_JOBS" -le 0 ]; then
              echo "::error::CARGO_BUILD_JOBS must be greater than zero."
              exit 1
            fi
            jobs="$CARGO_BUILD_JOBS"
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from repository variable for Docker builds."
          else
            detected_cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
            jobs=$((detected_cores - 2))
            if [ "$jobs" -lt 4 ]; then
              jobs=4
            fi
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from $detected_cores detected cores for Docker builds."
          fi

          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Prepare Rust acceleration secret files
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true'
            ) &&
            matrix.rust == true &&
            github.actor != 'dependabot[bot]' &&
            github.event_name != 'pull_request'
          }}
        id: sccache-secret
        env:
          SCCACHE_REDIS_MODE: ${{ vars.SCCACHE_REDIS_MODE }}
          SCCACHE_REDIS_URL: ${{ secrets.SCCACHE_REDIS_URL }}
          SCCACHE_DIST_SCHEDULER_URL: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          SCCACHE_DIST_AUTH_TOKEN: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
          DISTCC_POTENTIAL_HOSTS: ${{ vars.DISTCC_POTENTIAL_HOSTS }}
        run: |
          set -euo pipefail

          mode="${SCCACHE_REDIS_MODE:-required}"
          secret_files=()

          toml_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          case "$mode" in
            required|optional|off)
              ;;
            *)
              echo "::error::SCCACHE_REDIS_MODE must be one of: required, optional, off."
              exit 1
              ;;
          esac

          sccache_enabled=1
          redis_enabled=1
          if [ "$mode" = "off" ]; then
            sccache_enabled=0
            redis_enabled=0
            echo "Redis-backed sccache is disabled by SCCACHE_REDIS_MODE=off."
          fi

          if [ "$sccache_enabled" = "1" ] && [ -n "$SCCACHE_DIST_SCHEDULER_URL" ] && [ -z "$SCCACHE_DIST_AUTH_TOKEN" ]; then
            echo "::error::SCCACHE_DIST_AUTH_TOKEN is required when SCCACHE_DIST_SCHEDULER_URL is set."
            exit 1
          fi

          if [ "$sccache_enabled" = "1" ] && [ -z "$SCCACHE_DIST_SCHEDULER_URL" ] && [ -n "$SCCACHE_DIST_AUTH_TOKEN" ]; then
            echo "::error::SCCACHE_DIST_SCHEDULER_URL is required when SCCACHE_DIST_AUTH_TOKEN is set."
            exit 1
          fi

          if [ "$sccache_enabled" = "1" ] && [ -z "$SCCACHE_REDIS_URL" ]; then
            if [ "$mode" = "optional" ]; then
              echo "Skipping Redis-backed sccache because SCCACHE_REDIS_URL is empty and SCCACHE_REDIS_MODE=optional."
              redis_enabled=0
            else
              echo "::error::SCCACHE_REDIS_URL repository secret is required for trusted Rust image builds so sccache can use Redis."
              exit 1
            fi
          fi

          umask 077
          if [ "$redis_enabled" = "1" ]; then
            redis_file="${{ runner.temp }}/sccache-redis-url"
            printf '%s' "$SCCACHE_REDIS_URL" > "$redis_file"
            secret_files+=("sccache_redis_url=$redis_file")
            echo "redis-file=$redis_file" >> "$GITHUB_OUTPUT"
            # What: also mounts the same Redis URL under a second BuildKit
            # secret id, `ccache_redis_url`.
            # Why: AG-CI-022's opt-in ccache-over-distcc layer (services/dns's
            # nats-subscriber builder, and now services/watchdog's builder)
            # deliberately reuses this same SCCACHE_REDIS_URL-sourced secret
            # rather than a second GitHub repository secret (see either
            # Dockerfile's own configure_ccache() comment) -- this was
            # documented as the intended design in both Dockerfiles but never
            # actually wired here, so `[ -s /run/secrets/ccache_redis_url ]`
            # was always false and every Rust image build silently fell back
            # to plain distcc (safe, but not the real acceleration AG-CI-022
            # describes). A distinct file (not reusing $redis_file's path
            # under a second secret_files entry) matches BuildKit's own
            # one-path-per-secret-id mount contract.
            # From: Issue #842 | Issue #887 (AG-CI-022 origin)
            ccache_redis_file="${{ runner.temp }}/ccache-redis-url"
            printf '%s' "$SCCACHE_REDIS_URL" > "$ccache_redis_file"
            secret_files+=("ccache_redis_url=$ccache_redis_file")
            echo "ccache-redis-file=$ccache_redis_file" >> "$GITHUB_OUTPUT"
          fi

          # This job only ever builds linux/amd64 (see build-arm64 for the
          # native arm64 leg), so dist/distcc acceleration -- LAN-only
          # infrastructure tied to the self-hosted amd64 runner pool -- is
          # unconditionally applicable here.
          if [ "$sccache_enabled" = "1" ] && [ -n "$SCCACHE_DIST_SCHEDULER_URL" ]; then
            dist_config_file="${{ runner.temp }}/sccache-dist-config"
            {
              printf '[dist]\n'
              printf 'scheduler_url = "%s"\n' "$(toml_escape "$SCCACHE_DIST_SCHEDULER_URL")"
              printf 'toolchains = []\n'
              printf 'toolchain_cache_size = 5368709120\n'
              printf '\n[dist.auth]\n'
              printf 'type = "token"\n'
              printf 'token = "%s"\n' "$(toml_escape "$SCCACHE_DIST_AUTH_TOKEN")"
            } > "$dist_config_file"
            secret_files+=("sccache_dist_config=$dist_config_file")
            echo "dist-config-file=$dist_config_file" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$DISTCC_POTENTIAL_HOSTS" ]; then
            # here-string per AG-VAL-032, same SIGPIPE-under-pipefail hazard
            # as the other `printf | grep -q` conversions in this file.
            if ! grep -q ',cpp' <<<"$DISTCC_POTENTIAL_HOSTS"; then
              echo "::error::DISTCC_POTENTIAL_HOSTS must include at least one pump-capable host with the ',cpp' option."
              exit 1
            fi

            distcc_hosts_file="${{ runner.temp }}/distcc-potential-hosts"
            printf '%s' "$DISTCC_POTENTIAL_HOSTS" > "$distcc_hosts_file"
            secret_files+=("distcc_potential_hosts=$distcc_hosts_file")
            echo "distcc-hosts-file=$distcc_hosts_file" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "secret-files<<SECRET_FILES"
            printf '%s\n' "${secret_files[@]}"
            echo "SECRET_FILES"
          } >> "$GITHUB_OUTPUT"

      # What: produces ccache_redis_url for utilities and build-tools.
      # Why: dns/ui/watchdog already get it from the generic secret-file
      #   step above; only these two lack a matrix.rust step for it.
      # From: Issue #1095 (G15 | #1556) | PR #1661
      - name: Prepare ccache Redis endpoint (utilities + build-tools C-dependency cache)
        if: >-
          ${{
            steps.should-build.outputs.should-build == 'true' &&
            (matrix.service == 'utilities' || matrix.service == 'build-tools') &&
            github.actor != 'dependabot[bot]' &&
            github.event_name != 'pull_request'
          }}
        id: ccache-redis-secret
        env:
          SCCACHE_REDIS_URL: ${{ secrets.SCCACHE_REDIS_URL }}
          SCCACHE_REDIS_MODE: ${{ vars.SCCACHE_REDIS_MODE }}
        run: |
          set -euo pipefail
          if [ "${SCCACHE_REDIS_MODE:-}" = "off" ]; then
            echo "::notice::SCCACHE_REDIS_MODE=off; ${{ matrix.service }}'s ccache layer stays disabled."
          elif [ -n "$SCCACHE_REDIS_URL" ]; then
            umask 077
            redis_file="${{ runner.temp }}/ccache-redis-url-${{ matrix.service }}"
            printf '%s' "$SCCACHE_REDIS_URL" > "$redis_file"
            echo "redis-file=$redis_file" >> "$GITHUB_OUTPUT"
            echo "secret-files=ccache_redis_url=$redis_file" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No SCCACHE_REDIS_URL configured; ${{ matrix.service }}'s ccache layer stays disabled (fails closed to a plain compile)."
          fi

      # What: produces the distcc_potential_hosts secret for build-tools.
      # Why: build-tools' curl/git build is C, not Rust -- it never sets
      #   matrix.rust, so it misses the DISTCC_POTENTIAL_HOSTS wiring the
      #   sccache-secret step above gives dns/ui/watchdog.
      # From: PR #1661
      - name: Prepare distcc hosts (build-tools C-dependency distribution)
        if: >-
          ${{
            steps.should-build.outputs.should-build == 'true' &&
            matrix.service == 'build-tools' &&
            github.actor != 'dependabot[bot]' &&
            github.event_name != 'pull_request'
          }}
        id: distcc-hosts-secret
        env:
          DISTCC_POTENTIAL_HOSTS: ${{ vars.DISTCC_POTENTIAL_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DISTCC_POTENTIAL_HOSTS" ]; then
            echo "::notice::No DISTCC_POTENTIAL_HOSTS configured; build-tools' distcc layer stays disabled (fails closed to a plain compile)."
            exit 0
          fi
          if ! grep -q ',cpp' <<<"$DISTCC_POTENTIAL_HOSTS"; then
            echo "::error::DISTCC_POTENTIAL_HOSTS must include at least one pump-capable host with the ',cpp' option."
            exit 1
          fi
          umask 077
          hosts_file="${{ runner.temp }}/distcc-potential-hosts-${{ matrix.service }}"
          printf '%s' "$DISTCC_POTENTIAL_HOSTS" > "$hosts_file"
          echo "hosts-file=$hosts_file" >> "$GITHUB_OUTPUT"
          echo "secret-files=distcc_potential_hosts=$hosts_file" >> "$GITHUB_OUTPUT"

      - name: Select Rust acceleration network
        if: matrix.rust == true || matrix.service == 'build-tools'
        env:
          SECRET_FILES: >-
            ${{
              steps.sccache-secret.outputs.secret-files ||
              steps['ccache-redis-secret'].outputs['secret-files'] ||
              steps['distcc-hosts-secret'].outputs['secret-files']
            }}
        run: |
          set -euo pipefail

          # Default to bridge so GitHub-hosted or otherwise non-accelerated paths stay valid.
          # Secret-backed jobs switch to host only when the acceleration inputs exist.
          rust_network=bridge
          buildx_network=default
          if [ -n "$SECRET_FILES" ]; then
            rust_network=host
            buildx_network=host
          fi
          printf 'RUST_ACCELERATION_NETWORK=%s\n' "$rust_network" >> "$GITHUB_ENV"
          printf 'RUST_BUILDX_NETWORK=%s\n' "$buildx_network" >> "$GITHUB_ENV"

      # What: also runs for build-tools (no matrix.rust) so a broken Redis/
      #   distcc endpoint can't hide behind a cached curl/git Docker layer.
      # Why: the action itself is compiler-agnostic (validates via `cc`,
      #   not rustc) and already gates each check on its own file input.
      # From: PR #1661
      - name: Validate acceleration infrastructure outside BuildKit cache
        if: matrix.rust == true || matrix.service == 'build-tools'
        uses: ./.github/actions/rust-acceleration-preflight
        with:
          service: ${{ matrix.service }}
          redis-file: ${{ steps.sccache-secret.outputs.redis-file }}
          dist-config-file: ${{ steps.sccache-secret.outputs.dist-config-file }}
          distcc-hosts-file: ${{ matrix.service == 'build-tools' && steps['distcc-hosts-secret'].outputs['hosts-file'] || steps.sccache-secret.outputs.distcc-hosts-file }}
          # What: wired via ccache-redis-secret for build-tools only now.
          # Why: dns/ui/watchdog already get ccache-redis-file from the
          #   generic sccache-secret step above; avoids a duplicate read.
          # From: Issue #1095 (G15) | PR #1661
          ccache-redis-file: ${{ matrix.service == 'build-tools' && steps['ccache-redis-secret'].outputs['redis-file'] || steps.sccache-secret.outputs['ccache-redis-file'] }}
          build-tools-image: ${{ env.BUILD_TOOLS_IMAGE }}
          build-network: ${{ env.RUST_ACCELERATION_NETWORK }}
          platform: linux/amd64

      # What: merges sccache-secret, ccache-redis-secret, and distcc-hosts-secret.
      # Why: a block-scalar interpolation of all three outputs would add blank
      #   lines wherever one is empty; this reproduces the prior single-source
      #   input byte-for-byte instead.
      # From: Issue #1095 (G15) | PR #1661
      - name: Combine sccache/ccache secret files
        id: combined-secret-files
        env:
          SCCACHE_FILES: ${{ steps.sccache-secret.outputs.secret-files }}
          CCACHE_FILES: ${{ steps['ccache-redis-secret'].outputs['secret-files'] }}
          DISTCC_FILES: ${{ steps['distcc-hosts-secret'].outputs['secret-files'] }}
        run: |
          set -euo pipefail
          combined=""
          if [ -n "$SCCACHE_FILES" ]; then
            combined="$SCCACHE_FILES"
          fi
          if [ -n "$CCACHE_FILES" ]; then
            if [ -n "$combined" ]; then
              combined="$combined"$'\n'"$CCACHE_FILES"
            else
              combined="$CCACHE_FILES"
            fi
          fi
          if [ -n "$DISTCC_FILES" ]; then
            if [ -n "$combined" ]; then
              combined="$combined"$'\n'"$DISTCC_FILES"
            else
              combined="$DISTCC_FILES"
            fi
          fi
          {
            echo "secret-files<<SECRET_FILES"
            if [ -n "$combined" ]; then
              printf '%s\n' "$combined"
            fi
            echo "SECRET_FILES"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        # What: uses the shared ghcr-build-push-retry composite action.
        # Why: ghcr.io push-token issuance intermittently fails for the
        # slowest builds in this matrix.
        # From: Issue #1095 | PR #1619
        id: build
        if: steps.should-build.outputs.should-build == 'true'
        timeout-minutes: 60
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          secret-files: ${{ steps['combined-secret-files'].outputs['secret-files'] }}
          build-args: |
            BUILD_TOOLS_IMAGE=${{ env.BUILD_TOOLS_IMAGE }}
            UTILITIES_IMAGE=${{ env.UTILITIES_IMAGE }}
            CARGO_BUILD_JOBS=${{ steps.docker-build-jobs.outputs.jobs }}
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
          network: ${{ env.RUST_BUILDX_NETWORK }}
          allow: ${{ env.RUST_BUILDX_NETWORK == 'host' && 'network.host' || '' }}
          push: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.pr-tag.outputs.image || steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=${{ matrix.description }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.rust.digest={0}', steps.build-tools-base-digests.outputs.rust) || '' }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.golang.digest={0}', steps.build-tools-base-digests.outputs.golang) || '' }}
            ${{ contains(fromJSON('["proxy","dns","dhcp","dhcp-proxy","ntp","ui","watchdog"]'), matrix.service) && format('org.opencontainers.image.base.utilities.digest={0}', env.UTILITIES_DIGEST) || '' }}
          # What: no `annotations:` input on this single-platform push.
          # Why: no index exists here for `--annotation` to attach to.
          # From: Issue #1095 | PR #1619
          outputs: type=image,oci-mediatypes=true
          platforms: linux/amd64
          provenance: false
          cache-from: type=local,src=${{ steps.buildx-cache.outputs.cache-from }}
          cache-to: type=local,dest=${{ steps.buildx-cache.outputs.cache-to }},mode=max

      # This job never `--load`s a local image (push-only), so unlike container-scan it
      # had no existing final cleanup step to piggyback on -- but "Set up Docker Buildx"
      # above still creates a real docker-container builder + state volume on this
      # persistent self-hosted runner pool that setup-buildx-action never removes on its
      # own. "Build and push" above is the only step in this job that uses it for a real
      # build; "Retag unchanged service image" above also uses it (for `imagetools create`,
      # on a Step 4 retag-only path) -- matches "Set up Docker Buildx"'s own widened
      # condition so a builder that step actually created always gets torn down. "Rotate
      # local Buildx cache" below only manipulates the local cache directory on disk, not
      # the builder itself.
      - name: Remove buildx builder
        # What: mirrors "Set up Docker Buildx"'s own widened condition.
        # Why: whatever step creates the builder must also remove it.
        # From: Issue #1683 | PR #1778
        if: >-
          ${{
            always() &&
            (
              steps.should-build.outputs.should-build == 'true' ||
              steps.should-build.outputs.reuse-eligible == 'true'
            )
          }}
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Rotate local Buildx cache
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true'
            ) &&
            always() &&
            steps.build.outcome == 'success'
          }}
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_DEST: ${{ steps.buildx-cache.outputs.cache-to }}
        run: |
          set -euo pipefail

          if [ ! -d "$BUILDX_CACHE_DEST" ]; then
            exit 0
          fi

          cache_dir="$BUILDX_CACHE_ROOT/${{ matrix.service }}"
          lock_file="$BUILDX_CACHE_ROOT/${{ matrix.service }}.lock"

          mkdir -p "$BUILDX_CACHE_ROOT"
          (
            flock -x 9
            rm -rf "$BUILDX_CACHE_ROOT/${{ matrix.service }}"
            mv "$BUILDX_CACHE_DEST" "$cache_dir"
          ) 9>"$lock_file"

      # What: resolves the shared, persistent NFS-backed Trivy DB directory
      #   (real local-disk fallback if the mount is unavailable), then
      #   refreshes it under a lock using Trivy's own --download-db-only
      #   freshness check. This job builds linux/amd64 only (see
      #   build-arm64 for the native arm64 leg, a separate GitHub-hosted
      #   job with no route to this NFS mount -- its own step below stays
      #   on its prior runner.temp design for that reason).
      # Why: skip-db-update below (steps.trivy-db-fresh.outputs.db-present)
      #   is what keeps every matrix.service instance's concurrent read
      #   safe against the shared directory's single writer -- the actual
      #   fix for the redundant-download outage a per-run-wiped directory
      #   used to cause on pull_request/workflow_dispatch/retry/tag-push.
      # From: Issue #1095 | Issue #912 | PR #927 | PR #1532
      - name: Resolve shared Trivy DB cache directory
        id: trivy-cache
        if: >-
          ${{
                      steps.build.outcome == 'success' &&
                      (
                        github.event_name != 'pull_request' ||
                        (
                          github.actor != 'dependabot[bot]' &&
                          github.event.pull_request.head.repo.id == github.event.repository.id
                        )
                      )
                    }}
        uses: ./.github/actions/trivy-cache-dir

      - name: Ensure shared Trivy DB is current
        id: trivy-db-fresh
        if: ${{ steps.trivy-cache.outcome == 'success' }}
        uses: ./.github/actions/trivy-db-ensure-fresh
        with:
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}

      - name: Scan pushed service digest with Trivy
        # What: Step 3 -- scans the exact pushed digest before promotion.
        # Why: now the only scan for a changed service; see the linked issue.
        # From: Issue #1095 | PR #1532
        id: trivy-scan-pushed
        if: >-
          ${{
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        # What: soft-fails only on a PR; push stays hard-failing.
        # Why: a PR-context finding reports via the step below instead
        #   (release-gate decision -- still tracked, not hidden).
        # From: Issue #1095
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # What: 50-minute timeout for this Trivy scan step.
        # Why: The wrapped trivy-scan-retry action can attempt up to 4 scans.
        # From: Issue #1095 | PR #1619
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}
          # What: never cleaned up now -- it's the shared/fallback dir, not
          #   a per-run throwaway.
          # Why: cleanup-cache "true" here would delete the shared DB out
          #   from under every other concurrent matrix.service job.
          # From: Issue #1095 | Issue #912
          cleanup-cache: "false"
          skip-db-update: ${{ steps.trivy-db-fresh.outputs.db-present == 'true' }}

      # What: fails when db-status is undetermined, scan ran.
      # Why: an unknown status must never be read as a clean scan.
      # From: Issue #1095 | PR #1741
      - name: Require a determined Trivy DB status (amd64)
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.trivy-scan-pushed.outcome != 'skipped' &&
          steps.trivy-scan-pushed.outputs.db-status != 'unavailable' &&
          steps.trivy-scan-pushed.outputs.db-status != 'available'
        run: |
          echo "::error::Trivy db-status for ${{ matrix.service }} (amd64) is '${{ steps.trivy-scan-pushed.outputs.db-status }}' -- the scan never reached its own determination step (timeout, cancellation, or output-propagation failure). Treating this as NOT-RUN: no status report is filed and no image is deleted, because nothing was established either way." >&2
          exit 1

      # What: reports DB-unavailability as a separate issue.
      # Why: a distinct label keeps this visible without closing a
      #   real open vulnerability finding on a mere DB miss.
      # From: Issue #1095
      - name: Report Trivy DB-unavailable status (amd64, separate issue)
        if: >-
          always() && steps.build.outcome == 'success' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
          (steps.trivy-scan-pushed.outputs.db-status == 'unavailable' ||
           steps.trivy-scan-pushed.outputs.db-status == 'available')
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan-pushed.outputs.db-status == 'unavailable' && 'failure' || 'success' }}
          label: trivy-db-unavailable-buildpush-${{ matrix.service }}-amd64
          scope: >-
            Trivy vulnerability DB never downloaded for
            ${{ matrix.service }} (amd64) across all retry attempts
          fork-check-step-name: Scan pushed service digest with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports a pre-report scan error, not a finding.
      # Why: no report exists to evaluate as a finding here.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy scan-error status (amd64, separate issue)
        if: >-
          always() && steps.build.outcome == 'success' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
          steps.trivy-scan-pushed.outputs.db-status == 'available'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan-pushed.outputs.scan-error == 'true' && 'failure' || 'success' }}
          label: trivy-scan-error-buildpush-${{ matrix.service }}-amd64
          scope: >-
            Trivy scan of ${{ matrix.service }} (amd64) failed before
            producing a report while its DB was present (pull/auth/
            config/scanner error, not a DB outage and not a finding)
          fork-check-step-name: Scan pushed service digest with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports the scan outcome as a self-closing issue.
      # Why: PR or canonical-ref runs only; avoids a stale non-
      #   canonical ref opening/closing a shared standing issue.
      # From: Issue #1095 | PR #1741
      - name: Report Trivy scan status (self-closing issue)
        if: >-
          always() && steps.build.outcome == 'success' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
          steps.trivy-scan-pushed.outputs.db-status == 'available' &&
          steps.trivy-scan-pushed.outputs.scan-error != 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan-pushed.outcome == 'failure' && 'failure' || 'success' }}
          label: trivy-finding-${{ matrix.service }}-amd64
          scope: >-
            Trivy HIGH/CRITICAL finding in ${{ matrix.service }} (amd64),
            not covered by .trivyignore.yaml
          fork-check-step-name: Scan pushed service digest with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      - name: Delete GHCR package version pushed by a failed scan
        # What: deletes the just-pushed digest on a genuine finding.
        # Why: only an actual report proves the image unsafe.
        # From: Issue #1095 | PR #1735
        if: >-
          ${{
            always() && steps.build.outcome == 'success' &&
            steps.trivy-scan-pushed.outcome == 'failure' &&
            steps.trivy-scan-pushed.outputs.db-status == 'available' &&
            steps.trivy-scan-pushed.outputs.scan-error != 'true'
          }}
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          : "${GH_TOKEN:?GHCR_PACKAGE_DELETE_PAT secret is required to delete a scan-failed package version -- see issue #626. Without it, this scan-failed image cannot be removed automatically and needs immediate manual deletion in GHCR.}"
          org="wiki-mod"
          package="lancache-ng%2F${SERVICE}"
          fetch_versions() { gh api --paginate "orgs/${org}/packages/container/${package}/versions" > "$versions_file"; }
          versions_file="$(mktemp)"
          trap 'rm -f "$versions_file"' EXIT
          ghcr_retry ghcr.io "" "" -- fetch_versions
          version_id="$(jq -r --arg digest "$DIGEST" '[.[] | select(.name == $digest)][0].id // empty' "$versions_file")"
          if [ -z "$version_id" ]; then
            echo "::error::Trivy scan failed for the just-pushed lancache-ng/${SERVICE}@${DIGEST}, but no matching GHCR package version was found to delete. Manual verification in GHCR is required."
            exit 1
          fi
          echo "::notice::Trivy scan failed for lancache-ng/${SERVICE}@${DIGEST} (GHCR package version ${version_id}) -- deleting it immediately (issue #1095 G8): a scan-failed image must never remain reachable."
          ghcr_retry ghcr.io "" "" -- gh api -X DELETE "orgs/${org}/packages/container/${package}/versions/${version_id}"
          echo "::notice::Deleted GHCR package version ${version_id} (lancache-ng/${SERVICE}@${DIGEST}) after its Trivy scan failed."

      - name: Smoke-test exact build-tools candidate
        if: >-
          ${{
            matrix.service == 'build-tools' &&
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/build-tools@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          run-fixtures: "true"
      # No separate "Log in to GHCR for provenance attestation" step: the
      # ghcr-attest-retry composite action re-authenticates itself before
      # each retry (see that action), and its first attempt reuses the
      # session docker/login-action already created earlier in this job for
      # the "Build and push" step above.
      - name: Attest image build provenance
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            (
              steps.should-build.outputs.should-build == 'true'
            )
          }}
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  build-arm64:
    # What: native linux/arm64 leg of build's publish contract.
    # Why: hosted runners can't reach the self-hosted LAN's
    # Redis-backed sccache/sccache-dist/distcc.
    # From: Issue #592
    #
    # What: `needs:` mirrors `build`'s own superset, for the same reason.
    # Why: see `build`'s own `needs:` comment above.
    # From: Issue #1095 (G7) | PR #1503
    needs:
      - determine-build-admission
      - shellcheck
      - validate-compose
      - container-scan
      - detect-changes
      - determine-push-reuse-scope
      - ci_scope_policy
      - file-headers
      - compose-healthchecks
      - pr-template-check
      - pr-tracking-metadata-check
      - pr-title-convention-check
      - line-endings
      - push-supersession-check
    if: always() && needs['determine-build-admission'].result == 'success' && needs['determine-build-admission'].outputs.admitted == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    # Obsolete PR arm64 work may be cancelled; push/tag candidates must survive for manifest assembly.
    # Dispatches and reruns use isolated concurrency keys.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-build-arm64-{1}-{2}-{3}', github.workflow, matrix.service, github.ref, github.run_id) ||
          format('{0}-build-arm64-{1}-{2}', github.workflow, matrix.service, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    # What: adds issues:write; other scopes below stay unchanged.
    # Why: job-level permissions: replaces, not merges, the
    #   workflow-level block; issues:write is for the self-closing
    #   Trivy report added to this job.
    # From: Issue #1095
      UTILITIES_IMAGE: ${{ needs['validate-compose'].outputs.utilities_image }}
      UTILITIES_DIGEST: ${{ needs['validate-compose'].outputs.utilities_digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # CI 1.1: reuses build:'s own canonical matrix (including its unused-here
        # `runner:`/`description:` anchor fields) via YAML alias instead of a
        # hand-kept duplicate, so a new/changed service can never drift between
        # the two jobs -- see build:'s own &normal-build-services comment.
        include: *normal-build-services

    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Determine whether this service needs building
        id: should-build
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          DETECT_CHANGES_RESULT: ${{ needs['detect-changes'].result }}
          SUPERSEDED: ${{ needs['push-supersession-check'].outputs.superseded }}
          REUSE_JOB_RESULT: ${{ needs['determine-push-reuse-scope'].result }}
          REUSE_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_proxy }}
          REUSE_DNS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dns }}
          REUSE_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_watchdog }}
          REUSE_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp }}
          REUSE_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp_proxy }}
          REUSE_NTP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ntp }}
          REUSE_UI: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ui }}
          REUSE_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_build_tools }}
          REUSE_SYSLOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_syslog }}
          REUSE_UTILITIES: ${{ needs['determine-push-reuse-scope'].outputs.reuse_utilities }}
        run: |
          set -euo pipefail

          # What: maps a service to its reuse output (per-step helper).
          # Why: no GH Actions expression indexes outputs dynamically.
          # From: Issue #1683 | PR #1778
          reuse_for_service() {
            case "$1" in
              proxy) printf '%s' "$REUSE_PROXY" ;;
              dns) printf '%s' "$REUSE_DNS" ;;
              watchdog) printf '%s' "$REUSE_WATCHDOG" ;;
              dhcp) printf '%s' "$REUSE_DHCP" ;;
              dhcp-proxy) printf '%s' "$REUSE_DHCP_PROXY" ;;
              ntp) printf '%s' "$REUSE_NTP" ;;
              ui) printf '%s' "$REUSE_UI" ;;
              build-tools) printf '%s' "$REUSE_BUILD_TOOLS" ;;
              syslog) printf '%s' "$REUSE_SYSLOG" ;;
              utilities) printf '%s' "$REUSE_UTILITIES" ;;
              *) printf 'false' ;;
            esac
          }

          should_build=true
          reuse_eligible=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
              echo "::error::Pull request build scoping requires detect-changes to succeed, got '$DETECT_CHANGES_RESULT'."
              exit 1
            fi
            case "$MATRIX_SERVICE" in
              proxy) should_build="${{ needs['detect-changes'].outputs.proxy }}" ;;
              dns) should_build="${{ needs['detect-changes'].outputs.dns_image }}" ;;
              watchdog) should_build="${{ needs['detect-changes'].outputs.watchdog }}" ;;
              dhcp) should_build="${{ needs['detect-changes'].outputs.dhcp }}" ;;
              dhcp-proxy) should_build="${{ needs['detect-changes'].outputs.dhcp_proxy }}" ;;
              ntp) should_build="${{ needs['detect-changes'].outputs.ntp }}" ;;
              syslog) should_build="${{ needs['detect-changes'].outputs.syslog }}" ;;
              utilities) should_build="${{ needs['detect-changes'].outputs.utilities }}" ;;
              ui) should_build="${{ needs['detect-changes'].outputs.ui }}" ;;
              build-tools) should_build="${{ needs['detect-changes'].outputs.build_tools }}" ;;
              *)
                echo "::error::Unknown matrix service '$MATRIX_SERVICE' has no path-scoping mapping."
                exit 1
                ;;
            esac

            # What: PR-untouched services also consult the reuse check.
            # Why: lets the retag step publish a PR tag, no rebuild.
            # From: Issue #1683 | PR #1778
            if [ "$should_build" = "false" ] && [ "$REUSE_JOB_RESULT" = "success" ]; then
              reuse="$(reuse_for_service "$MATRIX_SERVICE")"
              if [ "$reuse" = "true" ]; then
                reuse_eligible=true
                echo "::notice::$MATRIX_SERVICE is unchanged since the PR base AND content-diff-verified reusable; the retag step below will publish this PR's staging tag without a rebuild."
              else
                echo "::notice::$MATRIX_SERVICE is unchanged since the PR base but not (yet) content-diff-verified reusable (reuse job result='$REUSE_JOB_RESULT', reuse='${reuse:-<unset>}'); its PR staging tag stays absent pending a later ancestor-fallback backfill."
              fi
            fi
          elif [ "$REUSE_JOB_RESULT" = "success" ]; then
            # What: mirrors build's own (amd64) identical Step 4 branch.
            # Why: full reasoning on the linked issue.
            # From: Issue #1095 | PR #1532
            reuse="$(reuse_for_service "$MATRIX_SERVICE")"
            if [ "$reuse" = "true" ]; then
              should_build=false
              reuse_eligible=true
            fi
          fi

          # What: mirrors build's own copy of this check exactly.
          # Why: see build's own comment for the full supersession reasoning.
          # From: Issue #1095 | PR #1532
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$SUPERSEDED" = "true" ]; then
            echo "::notice::A newer push to $GITHUB_REF has already superseded this run; skipping $MATRIX_SERVICE's build so only the run already targeting the current tip does the heavy work."
            should_build=false
            reuse_eligible=false
          fi

          case "$should_build" in
            true|false)
              ;;
            *)
              echo "::error::Build scope for $MATRIX_SERVICE must resolve to true or false, got '${should_build:-<empty>}'."
              exit 1
              ;;
          esac

          if [ "$should_build" = "true" ]; then
            echo "::notice::$MATRIX_SERVICE inputs changed (or this is not a pull request); image build remains enabled."
          else
            echo "::notice::$MATRIX_SERVICE inputs did not change in this pull request; skipping routine image rebuild."
          fi
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"
          echo "reuse-eligible=$reuse_eligible" >> "$GITHUB_OUTPUT"

      # Widened to also cover a Step 4 push-reuse-only path -- same
      # reasoning as build's own (the amd64 leg) identical widening.
      - name: Set up Docker Buildx
        # Issue #930: retried via .github/actions/buildx-setup-retry -- this GitHub-hosted
        # arm64 runner is a fresh VM every run and has hit Docker Hub's anonymous-pull rate
        # limit (surfacing as "unauthorized: authentication required") while bootstrapping
        # moby/buildkit:buildx-stable-1. Confirmed transient: a rerun with zero code changes
        # succeeded. The self-hosted amd64 `build` job's equivalent step keeps the plain,
        # unretried action -- it persists its local Buildx cache/image pulls across runs and
        # has never shown this symptom.
        if: >-
          ${{
            steps.should-build.outputs.should-build == 'true' ||
            steps.should-build.outputs.reuse-eligible == 'true'
          }}
        id: buildx
        uses: ./.github/actions/buildx-setup-retry

      - name: Log in to GHCR
        # Same fork-safety and Dependabot-safety reasoning as build's own
        # "Log in to GHCR" step. Also widened for a Step 4
        # push-reuse-only path, same reasoning as "Set up Docker Buildx"
        # immediately above.
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true' ||
              steps.should-build.outputs.reuse-eligible == 'true'
            ) &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: mirrors build's "Retag unchanged service image" step, for
      # the arm64 leg -- see that step's comment for the full rationale.
      # Why: both legs resolve the same pinned digest
      # determine-push-reuse-scope exported, so they always agree.
      # From: Issue #1095 | PR #1532
      - name: Retag unchanged service image for this commit (linux/arm64, no rebuild)
        # What: also fires for a trusted, reuse-eligible pull_request.
        # Why: fork/Dependabot never reach reuse-eligible (no login).
        # From: Issue #1683 | PR #1778
        if: >-
          ${{
            steps.should-build.outputs.reuse-eligible == 'true' &&
            needs['push-supersession-check'].outputs.superseded != 'true' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          MATRIX_SERVICE: ${{ matrix.service }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_proxy }}
          DIGEST_DNS: ${{ needs['determine-push-reuse-scope'].outputs.digest_dns }}
          DIGEST_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_watchdog }}
          DIGEST_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp }}
          DIGEST_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp_proxy }}
          DIGEST_NTP: ${{ needs['determine-push-reuse-scope'].outputs.digest_ntp }}
          DIGEST_UI: ${{ needs['determine-push-reuse-scope'].outputs.digest_ui }}
          DIGEST_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.digest_build_tools }}
          DIGEST_SYSLOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_syslog }}
          DIGEST_UTILITIES: ${{ needs['determine-push-reuse-scope'].outputs.digest_utilities }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required on this runner for the Step 4 retag-only path."
            exit 1
          }

          case "$MATRIX_SERVICE" in
            proxy) pinned_digest="$DIGEST_PROXY" ;;
            dns) pinned_digest="$DIGEST_DNS" ;;
            watchdog) pinned_digest="$DIGEST_WATCHDOG" ;;
            dhcp) pinned_digest="$DIGEST_DHCP" ;;
            dhcp-proxy) pinned_digest="$DIGEST_DHCP_PROXY" ;;
            ntp) pinned_digest="$DIGEST_NTP" ;;
            ui) pinned_digest="$DIGEST_UI" ;;
            build-tools) pinned_digest="$DIGEST_BUILD_TOOLS" ;;
            syslog) pinned_digest="$DIGEST_SYSLOG" ;;
            utilities) pinned_digest="$DIGEST_UTILITIES" ;;
            *) pinned_digest="" ;;
          esac
          if [ -z "$pinned_digest" ]; then
            echo "::error::determine-push-reuse-scope reported reuse=true for $MATRIX_SERVICE but did not export a pinned digest -- refusing to retag from an unverified reference."
            exit 1
          fi
          pinned_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${pinned_digest}"

          # What: PR events retag under the PR's own staging tag.
          # Why: matches "Compute PR staging tag"'s exact tag shape.
          # From: Issue #1683 | PR #1778
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            : "${PR_NUMBER:?PR_NUMBER (github.event.pull_request.number) is required}"
            target="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}:pr-${PR_NUMBER}-sha-${COMMIT_SHA}-arm64"
          else
            # What: uses the full commit SHA directly, no local truncation.
            # Why: short-SHA tags are banned; a local slice risks collisions.
            # From: Issue #1095 (G2) | PR #1503
            target="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}:sha-${COMMIT_SHA}-arm64"
          fi

          manifest_json="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$pinned_ref" --raw)"
          arm64_digest="$(printf '%s' "$manifest_json" | jq -r '[.manifests[]? | select(.platform.architecture == "arm64" and .platform.os == "linux")][0].digest // empty')"
          if [ -z "$arm64_digest" ]; then
            echo "::error::Could not find a linux/arm64 manifest for $pinned_ref; refusing to retag $MATRIX_SERVICE -- this would leave promote without a valid arm64 source image for this commit."
            exit 1
          fi

          source_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${arm64_digest}"
          echo "::notice::$MATRIX_SERVICE is unchanged (Step 4, verified via scripts/lib/push-reuse.sh); retagging $source_ref (from the pinned digest $pinned_ref) as $target instead of rebuilding."
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create --tag "$target" "$source_ref"

      - name: Extract metadata
        # Suffixed the same way as build's linux/amd64 tag, just for the
        # arm64 leg -- see the comment on build's own "Extract metadata" step.
        if: steps.should-build.outputs.should-build == 'true'
        id: meta
        uses: *docker_metadata_centraliced_versioning # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-arm64

      # Mirrors build's own "Compute PR staging tag" step, just for the
      # arm64 leg -- see that step's comment for the full rationale.
      - name: Compute PR staging tag
        id: pr-tag
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.should-build.outputs.should-build == 'true' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
          MATRIX_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: uses the full commit SHA directly, no local truncation.
          # Why: short-SHA tags are banned; a local slice risks collisions.
          # From: Issue #1095 (G2) | PR #1503
          tag="pr-${PR_NUMBER}-sha-${BUILD_SHA}-arm64"
          echo "::notice::This PR's linux/arm64 staging tag for $MATRIX_SERVICE is $tag."
          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          repository="$(dmeta_ghcr_repo)"
          {
            printf 'tag=%s\n' "$tag"
            printf 'image=ghcr.io/%s/%s:%s\n' "$repository" "$MATRIX_SERVICE" "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: matrix.service == 'build-tools' && steps.should-build.outputs.should-build == 'true'
        run: |
          set -euo pipefail

          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Docker build parallelism
        if: steps.should-build.outputs.should-build == 'true'
        id: docker-build-jobs
        run: |
          set -euo pipefail

          if [ -n "${CARGO_BUILD_JOBS:-}" ]; then
            case "$CARGO_BUILD_JOBS" in
              ''|*[!0-9]*)
                echo "::error::CARGO_BUILD_JOBS must be a positive integer."
                exit 1
                ;;
            esac
            if [ "$CARGO_BUILD_JOBS" -le 0 ]; then
              echo "::error::CARGO_BUILD_JOBS must be greater than zero."
              exit 1
            fi
            jobs="$CARGO_BUILD_JOBS"
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from repository variable for Docker builds."
          else
            detected_cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
            jobs=$((detected_cores - 2))
            if [ "$jobs" -lt 4 ]; then
              jobs=4
            fi
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from $detected_cores detected cores for Docker builds."
          fi

          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"


      - name: Build and push
        # No secret-files/network/allow here: this runner cannot reach the LAN-only
        # Redis/sccache-dist/distcc acceleration infrastructure, so this always builds as a
        # plain, uncached (but native) cargo build. Uses the GitHub Actions cache backend
        # (type=gha) instead of the self-hosted local Buildx cache, since this runner is
        # ephemeral and has no persistent /var/tmp to reuse across runs.
        #
        # What: same shared ghcr-build-push-retry action as build's step.
        # Why: one shared GHCR retry+re-login policy, not a second copy.
        # From: Issue #1095 | PR #1619
        id: build
        if: steps.should-build.outputs.should-build == 'true'
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: |
            BUILD_TOOLS_IMAGE=${{ env.BUILD_TOOLS_IMAGE }}
            UTILITIES_IMAGE=${{ env.UTILITIES_IMAGE }}
            CARGO_BUILD_JOBS=${{ steps.docker-build-jobs.outputs.jobs }}
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
          push: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.pr-tag.outputs.image || steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=${{ matrix.description }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.rust.digest={0}', steps.build-tools-base-digests.outputs.rust) || '' }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.golang.digest={0}', steps.build-tools-base-digests.outputs.golang) || '' }}
            ${{ contains(fromJSON('["proxy","dns","dhcp","dhcp-proxy","ntp","ui","watchdog"]'), matrix.service) && format('org.opencontainers.image.base.utilities.digest={0}', env.UTILITIES_DIGEST) || '' }}
          # What: no `annotations:` input here, mirroring build's step.
          # Why: no index exists here for `--annotation` to attach to.
          # From: Issue #1095 | PR #1619
          outputs: type=image,oci-mediatypes=true
          platforms: linux/arm64
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,scope=${{ matrix.service }}-arm64,mode=max

      # Same leak as build's own equivalent step: this job never `--load`s a local image
      # (push-only), so it had no existing local-image cleanup step -- but "Set up Docker
      # Buildx" above still creates a real docker-container builder that
      # setup-buildx-action/buildx-setup-retry never remove on their own. This runner is
      # GitHub-hosted (ephemeral), so unlike build's self-hosted equivalent this is a
      # defensive no-op today rather than an active leak, but kept for consistency and in
      # case this job is ever moved to a persistent runner. Widened the same way as build's
      # own equivalent step to also cover a Step 4 retag-only path.
      - name: Remove buildx builder
        # What: mirrors "Set up Docker Buildx"'s own widened condition.
        # Why: whatever step creates the builder must also remove it.
        # From: Issue #1683 | PR #1778
        if: >-
          ${{
            always() &&
            (
              steps.should-build.outputs.should-build == 'true' ||
              steps.should-build.outputs.reuse-eligible == 'true'
            )
          }}
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Scan pushed service digest with Trivy
        # CI 1.1: this scan consumes the immutable digest emitted by the one
        # candidate build. Same-repo PR candidates are scanned too; fork and
        # Dependabot PRs remain read-only and therefore have no pushed digest.
        id: trivy-scan-pushed
        if: >-
          ${{
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        # What: soft-fails only on a PR; push stays hard-failing.
        # Why: a PR-context finding reports via the step below instead
        #   (release-gate decision -- still tracked, not hidden).
        # From: Issue #1095
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # What: 50-minute timeout for this Trivy scan step.
        # Why: The wrapped trivy-scan-retry action can attempt up to 4 scans.
        # From: Issue #1095 | PR #1619
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          # What: unchanged from before this PR -- a runner.temp path,
          #   cleaned up every run.
          # Why: this job (build-arm64) runs on GitHub-hosted
          #   ubuntu-24.04-arm, not the self-hosted LAN runners the shared
          #   NFS Trivy-DB mount (/mnt/trivy-db) lives on. A GitHub-hosted
          #   runner's entire filesystem is destroyed after the job anyway,
          #   so neither the shared mount nor a local persistent-fallback
          #   directory would survive to a later run here regardless --
          #   there is nothing to fix on this leg. See the amd64 "build"
          #   job's identical step above (self-hosted) for the actual fix.
          # From: Issue #1095 | Issue #912
          cache-dir: ${{ runner.temp }}/trivy-${{ matrix.service }}-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          cleanup-cache: "true"

      # What: fails when db-status is undetermined, scan ran.
      # Why: an unknown status must never be read as a clean scan.
      # From: Issue #1095 | PR #1741
      - name: Require a determined Trivy DB status (arm64)
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.trivy-scan-pushed.outcome != 'skipped' &&
          steps.trivy-scan-pushed.outputs.db-status != 'unavailable' &&
          steps.trivy-scan-pushed.outputs.db-status != 'available'
        run: |
          echo "::error::Trivy db-status for ${{ matrix.service }} (arm64) is '${{ steps.trivy-scan-pushed.outputs.db-status }}' -- the scan never reached its own determination step (timeout, cancellation, or output-propagation failure). Treating this as NOT-RUN: no status report is filed and no image is deleted, because nothing was established either way." >&2
          exit 1

      # What: reports DB-unavailability as a separate issue.
      # Why: a distinct label keeps this visible without closing a
      #   real open vulnerability finding on a mere DB miss.
      # From: Issue #1095
      - name: Report Trivy DB-unavailable status (arm64, separate issue)
        if: >-
          always() && steps.build.outcome == 'success' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
          (steps.trivy-scan-pushed.outputs.db-status == 'unavailable' ||
           steps.trivy-scan-pushed.outputs.db-status == 'available')
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan-pushed.outputs.db-status == 'unavailable' && 'failure' || 'success' }}
          label: trivy-db-unavailable-buildpush-${{ matrix.service }}-arm64
          scope: >-
            Trivy vulnerability DB never downloaded for
            ${{ matrix.service }} (arm64) across all retry attempts
          fork-check-step-name: Scan pushed service digest with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports a pre-report scan error, not a finding.
      # Why: no report exists to evaluate as a finding here.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy scan-error status (arm64, separate issue)
        if: >-
          always() && steps.build.outcome == 'success' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
          steps.trivy-scan-pushed.outputs.db-status == 'available'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan-pushed.outputs.scan-error == 'true' && 'failure' || 'success' }}
          label: trivy-scan-error-buildpush-${{ matrix.service }}-arm64
          scope: >-
            Trivy scan of ${{ matrix.service }} (arm64) failed before
            producing a report while its DB was present (pull/auth/
            config/scanner error, not a DB outage and not a finding)
          fork-check-step-name: Scan pushed service digest with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports the scan outcome as a self-closing issue.
      # Why: PR or canonical-ref runs only; avoids a stale non-
      #   canonical ref opening/closing a shared standing issue.
      # From: Issue #1095 | PR #1741
      - name: Report Trivy scan status (self-closing issue)
        if: >-
          always() && steps.build.outcome == 'success' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/current_dev' || github.ref == 'refs/heads/master') &&
          steps.trivy-scan-pushed.outputs.db-status == 'available' &&
          steps.trivy-scan-pushed.outputs.scan-error != 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan-pushed.outcome == 'failure' && 'failure' || 'success' }}
          label: trivy-finding-${{ matrix.service }}-arm64
          scope: >-
            Trivy HIGH/CRITICAL finding in ${{ matrix.service }} (arm64),
            not covered by .trivyignore.yaml
          fork-check-step-name: Scan pushed service digest with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      - name: Delete GHCR package version pushed by a failed scan
        # What: same cleanup as build's arm64 leg's own scan.
        # Why: only an actual report proves the image unsafe.
        # From: Issue #1095 | PR #1735
        if: >-
          ${{
            always() && steps.build.outcome == 'success' &&
            steps.trivy-scan-pushed.outcome == 'failure' &&
            steps.trivy-scan-pushed.outputs.db-status == 'available' &&
            steps.trivy-scan-pushed.outputs.scan-error != 'true'
          }}
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          : "${GH_TOKEN:?GHCR_PACKAGE_DELETE_PAT secret is required to delete a scan-failed package version -- see issue #626. Without it, this scan-failed image cannot be removed automatically and needs immediate manual deletion in GHCR.}"
          org="wiki-mod"
          package="lancache-ng%2F${SERVICE}"
          fetch_versions() { gh api --paginate "orgs/${org}/packages/container/${package}/versions" > "$versions_file"; }
          versions_file="$(mktemp)"
          trap 'rm -f "$versions_file"' EXIT
          ghcr_retry ghcr.io "" "" -- fetch_versions
          version_id="$(jq -r --arg digest "$DIGEST" '[.[] | select(.name == $digest)][0].id // empty' "$versions_file")"
          if [ -z "$version_id" ]; then
            echo "::error::Trivy scan failed for the just-pushed lancache-ng/${SERVICE}@${DIGEST}, but no matching GHCR package version was found to delete. Manual verification in GHCR is required."
            exit 1
          fi
          echo "::notice::Trivy scan failed for lancache-ng/${SERVICE}@${DIGEST} (GHCR package version ${version_id}) -- deleting it immediately (issue #1095 G8): a scan-failed image must never remain reachable."
          ghcr_retry ghcr.io "" "" -- gh api -X DELETE "orgs/${org}/packages/container/${package}/versions/${version_id}"
          echo "::notice::Deleted GHCR package version ${version_id} (lancache-ng/${SERVICE}@${DIGEST}) after its Trivy scan failed."


      - name: Smoke-test exact build-tools candidate
        if: >-
          ${{
            matrix.service == 'build-tools' &&
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/build-tools@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          run-fixtures: "false"
      - name: Attest image build provenance
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            (
              steps.should-build.outputs.should-build == 'true'
            )
          }}
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}

  merge-manifests:
    # Combines build's linux/amd64 per-service tag with build-arm64's linux/arm64
    # per-service tag into the real sha-<commit> multi-platform tag that
    # promote/release/setup.sh consume. Uses imagetools create -- the same tool promote
    # already uses to move channel tags -- so no image is rebuilt here, only a manifest
    # list assembled from two already-pushed digests.
    #
    # Also runs on pull_request events now: a same-repo PR pushes its own
    # pr-<N>-sha-<full>-{amd64,arm64} legs in build/build-arm64, and this job merges
    # those into the real pr-<N>-sha-<full> tag that full-setup-validate consumes to
    # test the PR's own commits. The existing sha-<commit> merge below stays gated to
    # non-PR events only -- that tag's inputs are never pushed on a PR, so running it on a
    # PR would just loop through seven harmless "no linux/amd64 image" skips for no
    # reason.
    name: merge multi-platform manifests
    needs: [determine-build-admission, build, build-arm64, push-supersession-check]
    # What: merges manifests only after build admission opens.
    # Why: skipped image jobs leave no valid manifest inputs.
    # From: Issue #1095
    if: "!cancelled() && needs['determine-build-admission'].result == 'success' && needs['determine-build-admission'].outputs.admitted == 'true' && needs.build.result != 'cancelled' && needs['build-arm64'].result != 'cancelled'"
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real runs: 17s-4.1min (per this job's own comment, it only assembles a
    # manifest list from two already-pushed digests -- no image rebuild).
    # 30 minutes covers the ghcr_retry backoff windows on its GHCR calls
    # (max ~2 minutes total) plus real headroom for registry slowness.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # The manifest lists created below (both the trusted sha-<commit> tag
      # and the PR staging tag) are the actual multi-platform references that
      # promote/release/setup.sh/full-setup-validate resolve and pull -- not
      # the platform-suffixed -amd64/-arm64 legs build/build-arm64 already
      # attest. Those per-arch attestations say nothing about the merged
      # digest itself, so this job needs the same attestation permissions
      # build/build-arm64/promote already carry.
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      proxy_digest: ${{ steps.create-trusted-manifests.outputs.proxy_digest || steps.create-pr-staging-manifests.outputs.proxy_digest }}
      dns_digest: ${{ steps.create-trusted-manifests.outputs.dns_digest || steps.create-pr-staging-manifests.outputs.dns_digest }}
      watchdog_digest: ${{ steps.create-trusted-manifests.outputs.watchdog_digest || steps.create-pr-staging-manifests.outputs.watchdog_digest }}
      dhcp_digest: ${{ steps.create-trusted-manifests.outputs.dhcp_digest || steps.create-pr-staging-manifests.outputs.dhcp_digest }}
      dhcp_proxy_digest: ${{ steps.create-trusted-manifests.outputs.dhcp_proxy_digest || steps.create-pr-staging-manifests.outputs.dhcp_proxy_digest }}
      ntp_digest: ${{ steps.create-trusted-manifests.outputs.ntp_digest || steps.create-pr-staging-manifests.outputs.ntp_digest }}
      syslog_digest: ${{ steps.create-trusted-manifests.outputs.syslog_digest || steps.create-pr-staging-manifests.outputs.syslog_digest }}
      ui_digest: ${{ steps.create-trusted-manifests.outputs.ui_digest || steps.create-pr-staging-manifests.outputs.ui_digest }}
      build_tools_digest: ${{ steps.create-trusted-manifests.outputs.build_tools_digest || steps.create-pr-staging-manifests.outputs.build_tools_digest }}
      utilities_digest: ${{ steps.create-trusted-manifests.outputs.utilities_digest || steps.create-pr-staging-manifests.outputs.utilities_digest }}
      stack_digest: ${{ steps.create-trusted-manifests.outputs.stack_digest }}
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Clean up stale Buildx builder containers (self-hosted reuse hardening)
        run: bash scripts/tracked/cleanup-stale-buildx-builders.sh
      - name: Set up Docker Buildx
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifests
        id: create-trusted-manifests
        # What: also skips when push-supersession-check reports superseded.
        # Why: a superseded push forces should-build to false for every
        # service, so every per-service probe below would miss and the
        # stack-pointer step would hard-fail on an empty digest set.
        # From: Issue #1095
        if: "github.event_name != 'pull_request' && needs['push-supersession-check'].outputs.superseded != 'true'"
        env:
          COMMIT_SHA: ${{ github.sha }}
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # What: delete-scoped PAT for the orphaned-tag cleanup below.
          # Why: GITHUB_TOKEN cannot delete a GHCR package version; same PAT the Trivy
          #   scan-failure deletion above and gc-pr-staging-images.yml already use.
          # From: Issue #1095 | PR #1642
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          DESCRIPTION_PROXY: *ci-description-proxy
          DESCRIPTION_DNS: *ci-description-dns
          DESCRIPTION_WATCHDOG: *ci-description-watchdog
          DESCRIPTION_DHCP: *ci-description-dhcp
          DESCRIPTION_DHCP_PROXY: *ci-description-dhcp-proxy
          DESCRIPTION_NTP: *ci-description-ntp
          DESCRIPTION_SYSLOG: *ci-description-syslog
          DESCRIPTION_UI: *ci-description-ui
          DESCRIPTION_BUILD_TOOLS: *ci-description-build-tools
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the shared CI_BUILD_SERVICES scalar, not a
          # hand-duplicated services=(...) literal.
          # Why: check-workflow-service-lists.sh only guards known copies.
          # From: Issue #1095 | PR #1619
          read -ra services <<< "$CI_BUILD_SERVICES"
          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # What: uses the full commit SHA directly, no local truncation.
          # Why: short-SHA tags are banned; a local slice risks collisions.
          # From: Issue #1095 (G2) | PR #1503
          source_tag="sha-${COMMIT_SHA}"
          declare -A merged_digests=()
          # What: Tracks each service left with an orphaned single-platform tag this run.
          # Why: amd64/arm64 builds are independent jobs that can genuinely diverge (one
          #   fails, one succeeds) with no relation to concurrency. The prior code logged
          #   an ordinary ::notice:: for that case and `exit 1`'d the whole loop on the
          #   other-direction case, both silently orphaning the surviving per-arch tag.
          # From: Issue #1095 | PR #1642
          declare -A orphaned_services=()

          declare -A service_descriptions=(
            [proxy]="nginx-based lancache-ng caching proxy for standard and TLS-interception cache traffic."
            [dns]="PowerDNS recursor, authoritative DNS, and NATS subscriber service for lancache-ng cache routing."
            [watchdog]="lancache-ng watchdog helper for runtime health checks and recovery hooks."
            [dhcp]="Kea DHCP, control-agent, and DHCP-DDNS service for lancache-ng managed networks."
            [dhcp-proxy]="dnsmasq-based DHCP proxy and relay helper for lancache-ng deployments."
            [ntp]="chrony-based NTP server for lancache-ng, disciplined against public NTP servers and serving LAN clients on UDP/123."
            [ui]="lancache-ng Admin UI and control-plane service for cache, DNS, DHCP, and secondary management."
            [build-tools]="Prebuilt lancache-ng CI and developer validation toolchain image."
            [syslog]="Combined fluent-bit + syslog-ng first-party central logging service for lancache-ng (issue #1428)."
            [utilities]="Shared lancache-ng utilities image (curl, nano, lsof, ripgrep, findutils, coreutils, gettext-envsubst, jq, ca-certificates, zstd) for COPY --from= consumption by eight first-party images (issue #1556)."
          )

          # Duplicated rather than factored into a shared script/action: GitHub Actions
          # workflow YAML has no import mechanism for shell functions across job steps, and
          # this file's own convention (see build/build-tools-base-digests and promote's copies
          # of this same helper) is a local copy per job over introducing a new composite
          # action just for one function. Same quote-stripping as those.
          #
          # What: wrapped in ghcr_retry -- reads the digest of a manifest
          # this same step just created.
          # Why: a transient GHCR read failure here is a real retry
          # candidate, not an expected-absent probe.
          # From: Issue #1095 | PR #1619
          digest_for_image() {
            local image=$1
            local digest

            if ! digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
              return 1
            fi
            digest="${digest%\"}"
            digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]]
            printf '%s\n' "$digest"
          }

          # What: deletes GHCR's copy of one orphaned single-platform tag.
          # Why: an orphan (loop below) can never join a multi-platform manifest and would
          #   sit in GHCR forever; scoped to this run's exact tag, and refuses to delete
          #   when the matched version carries any other tag (a shared-digest version).
          # From: Issue #1095 | PR #1642
          delete_orphaned_tag() {
            local service=$1 tag=$2
            local org="wiki-mod"
            local package="lancache-ng%2F${service}"
            local versions_file version_json version_id tag_count other_tags

            : "${GH_TOKEN:?GHCR_PACKAGE_DELETE_PAT secret is required to delete an orphaned single-platform tag -- see issue #1095. Without it, this stray tag cannot be removed automatically and needs manual deletion in GHCR.}"

            versions_file="$(mktemp)"
            fetch_versions() { gh api --paginate "orgs/${org}/packages/container/${package}/versions" > "$versions_file"; }
            if ! ghcr_retry ghcr.io "" "" -- fetch_versions; then
              echo "::error::Could not list GHCR package versions for lancache-ng/${service} to delete its orphaned tag ${tag}; leaving it in place for manual cleanup."
              rm -f "$versions_file"
              return 1
            fi

            version_json="$(jq -c --arg tag "$tag" '[.[] | select((.metadata.container.tags // []) | index($tag))][0] // empty' "$versions_file")"
            rm -f "$versions_file"
            if [ -z "$version_json" ]; then
              echo "::error::No GHCR package version found carrying orphaned tag lancache-ng/${service}:${tag}; it may already be gone."
              return 1
            fi

            # What: refuses to delete a version whose digest is shared by another tag.
            # Why: `gh api -X DELETE .../versions/<id>` deletes the whole manifest version,
            #   not just $tag -- an arm64 build byte-identical to an older commit's, or a
            #   digest a promoted channel tag already references, would be destroyed too.
            # From: Issue #1095 | PR #1642
            version_id="$(jq -r '.id' <<<"$version_json")"
            tag_count="$(jq -r '(.metadata.container.tags // []) | length' <<<"$version_json")"
            if [ "$tag_count" -ne 1 ]; then
              other_tags="$(jq -r '(.metadata.container.tags // []) | join(", ")' <<<"$version_json")"
              echo "::error::GHCR package version ${version_id} for lancache-ng/${service} carries ${tag_count} tag(s) (${other_tags}), not only the orphaned ${tag} -- refusing to delete a version another tag or manifest may still reference. Manual verification is required."
              return 1
            fi

            if ! ghcr_retry ghcr.io "" "" -- gh api -X DELETE "orgs/${org}/packages/container/${package}/versions/${version_id}"; then
              echo "::error::Failed to delete GHCR package version ${version_id} (lancache-ng/${service}:${tag}); manual cleanup required."
              return 1
            fi
            echo "::notice::Deleted orphaned GHCR package version ${version_id} (lancache-ng/${service}:${tag}) -- its counterpart architecture was never published for this commit."
          }

          for service in "${services[@]}"; do
            amd64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-amd64"
            arm64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-arm64"
            target_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"

            # Deliberately NOT wrapped in ghcr_retry: an absent per-arch staging tag here almost
            # always means "this service's build was legitimately skipped" (unchanged on a PR, or
            # a fork/Dependabot PR with no push permission), not a transient registry error.
            # Retrying 3x with a 30s backoff would turn every expected skip into a ~90s stall per
            # service, and worse, could misclassify a genuine transient 401 as "not built" and
            # silently skip merging a service that actually was pushed -- the retry policy exists
            # to protect real registry-write operations below, not this expected-failure control
            # flow.
            if ! docker buildx imagetools inspect "$amd64_image" >/dev/null 2>&1; then
              if docker buildx imagetools inspect "$arm64_image" >/dev/null 2>&1; then
                echo "::error::$service: linux/arm64 image $arm64_image was published for this commit but linux/amd64 was not -- the two architectures' build jobs diverged (one succeeded, the other failed or was skipped independently). $arm64_image is now a permanent orphan: it can never be merged into $target_image. Check the build (amd64) job for $service on this commit to find out why it did not publish, then push a new commit so both architectures retry together -- this run will not retry it for you."
                orphaned_services["$service"]="$arm64_image"
                # What: attempts real deletion; `|| true` isolates a delete failure.
                # Why: must not trip `set -e` and abort remaining services (AG-WF-011).
                # From: Issue #1095 | PR #1642
                delete_orphaned_tag "$service" "${source_tag}-arm64" || true
              else
                echo "::notice::Skipping $service: no linux/amd64 or linux/arm64 image was published for this commit -- unchanged/not built on this push, or both architectures' builds independently failed; check the build and build-arm64 jobs for $service to tell which."
              fi
              continue
            fi
            if ! docker buildx imagetools inspect "$arm64_image" >/dev/null 2>&1; then
              echo "::error::$service: linux/amd64 image $amd64_image was published for this commit but linux/arm64 was not -- the two architectures' build jobs diverged (one succeeded, the other failed or was skipped independently). $amd64_image is now a permanent orphan: it can never be merged into $target_image. Check the build-arm64 job for $service on this commit to find out why it did not publish, then push a new commit so both architectures retry together -- this run will not retry it for you."
              orphaned_services["$service"]="$amd64_image"
              # Same failure-isolation reasoning as the arm64-orphan branch above.
              delete_orphaned_tag "$service" "${source_tag}-amd64" || true
              continue
            fi

            amd64_digest="$(digest_for_image "$amd64_image")"
            arm64_digest="$(digest_for_image "$arm64_image")"
            [[ "$amd64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest for $service: $amd64_digest"; exit 1; }
            [[ "$arm64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest for $service: $arm64_digest"; exit 1; }
            amd64_ref="ghcr.io/${REPOSITORY}/${service}@${amd64_digest}"
            arm64_ref="ghcr.io/${REPOSITORY}/${service}@${arm64_digest}"

            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create -t "$target_image" "$amd64_ref" "$arm64_ref" \
              --annotation "index:org.opencontainers.image.description=${service_descriptions[$service]}"
            GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
              bash scripts/untracked/require-image-platforms.sh "$target_image" "$REQUIRED_PLATFORMS"

            # Output key uses underscores (dhcp-proxy/build-tools contain
            # hyphens, which the expression syntax in the attest steps below
            # would otherwise parse as subtraction) so those steps can
            # reference steps.create-trusted-manifests.outputs.<service>_digest.
            merged_digest="$(digest_for_image "$target_image")"
            [[ "$merged_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid merged digest for $service: $merged_digest"; exit 1; }
            merged_digests["$service"]="$merged_digest"
            printf '%s_digest=%s\n' "${service//-/_}" "$merged_digest" >> "$GITHUB_OUTPUT"
          done

          # What: Prints one consolidated ::error:: naming every orphan this run found.
          # Why: Carries the full list in the run's log tail, not just scattered
          #   per-service lines, even though delete_orphaned_tag above already
          #   attempted real deletion for each one -- a deleted orphan is still a real
          #   incident (an amd64/arm64 build divergence) worth surfacing loudly, and a
          #   delete that itself failed leaves a stray tag this summary is the only
          #   run-level signal for.
          # From: Issue #1095 | PR #1642
          if [ "${#orphaned_services[@]}" -gt 0 ]; then
            echo "::error::${#orphaned_services[@]} service(s) ended this run with an orphaned single-platform tag for $source_tag that can never become part of a multi-platform manifest: ${!orphaned_services[*]}. See each service's own ::error:: above for its exact stray tag; the stack pointer step below will also fail because of this."
          fi

          # Build the immutable stack pointer before any public channel is moved.
          # All service digests must already be present so the pointer can only
          # represent one complete, validated candidate set.
          for service in "${services[@]}"; do
            digest="${merged_digests[$service]:-}"
            [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
              echo "::error::Cannot create stack pointer: missing exact digest for $service."
              exit 1
            }
          done

          pointer_context="$(mktemp -d)"
          cleanup_pointer_context() { rm -rf "$pointer_context"; }
          trap cleanup_pointer_context EXIT

          {
            printf 'LANCACHE_IMAGE_TAG=%s\n' "$source_tag"
            printf 'LANCACHE_IMAGE_COMMIT=%s\n' "$COMMIT_SHA"
            printf 'LANCACHE_IMAGE_SERVICES=%s\n' "${services[*]}"
          } > "$pointer_context/stack.env"

          stack_pointer_description="Resolves a mutable lancache-ng stack channel to one immutable sha-* service image set."
          cat > "$pointer_context/Dockerfile" <<DOCKERFILE
          FROM busybox:stable-musl@sha256:3c6ae8008e2c2eedd141725c30b20d9c36b026eb796688f88205845ef17aa213
          LABEL org.opencontainers.image.title="lancache-ng stack channel pointer"
          LABEL org.opencontainers.image.description="${stack_pointer_description}"
          COPY stack.env /stack.env
          CMD ["true"]
          DOCKERFILE

          stack_pointer_image="ghcr.io/${REPOSITORY}/stack:${source_tag}"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx build \
            --platform "$REQUIRED_PLATFORMS" \
            --push \
            -t "$stack_pointer_image" \
            --annotation "index:org.opencontainers.image.description=${stack_pointer_description}" \
            "$pointer_context"
          GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
            bash scripts/untracked/require-image-platforms.sh "$stack_pointer_image" "$REQUIRED_PLATFORMS"
          stack_digest="$(digest_for_image "$stack_pointer_image")"
          [[ "$stack_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid stack pointer digest: $stack_digest"; exit 1; }
          printf 'stack_digest=%s\n' "$stack_digest" >> "$GITHUB_OUTPUT"
          cleanup_pointer_context
          trap - EXIT

      # Same merge, for the PR-scoped staging tag instead of the trusted-ref sha-<commit>
      # tag. Only same-repo PRs ever push the two per-arch inputs (build/build-arm64's own
      # fork check), so this naturally no-ops for a fork PR: neither leg exists, every
      # service is skipped, nothing is published. A service this PR did not touch also has
      # no inputs here (detect-changes scoped build/build-arm64 to skip it) -- that is
      # expected and not an error; full-setup-validate's own backfill step fills the gap.

      - name: Create PR staging multi-platform manifest
        id: create-pr-staging-manifests
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Must match build/build-arm64's "Compute PR staging tag" exactly
          # -- see that step's comment for why this is github.sha (the
          # actual built merge commit), not the PR head SHA.
          BUILD_SHA: ${{ github.sha }}
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # What: uses the full commit SHA directly, no local truncation.
          # Why: short-SHA tags are banned; a local slice risks collisions.
          # From: Issue #1095 (G2) | PR #1503
          source_tag="pr-${PR_NUMBER}-sha-${BUILD_SHA}"

          # Same helper as the trusted-ref step above (and promote's own
          # copy) -- kept duplicated per step/job rather than shared, which
          # is the existing convention in this file. Same ghcr_retry
          # reasoning as that step's copy: this reads a manifest just
          # created below, not an expected-absence probe.
          digest_for_image() {
            local image=$1
            local digest

            if ! digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
              return 1
            fi
            digest="${digest%\"}"
            digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]]
            printf '%s\n' "$digest"
          }

          # What: tracks each service whose amd64/arm64 PR-staging tags diverged this run.
          # Why: the loop below now `continue`s past a divergence instead of `exit 1`ing
          #   immediately (same fix as the trusted-ref step above) so every OTHER
          #   service still gets processed -- but unlike that step, this loop has no
          #   later stack-pointer check to re-assert completeness, so without this array
          #   the step would exit 0 (job success) despite a real divergence, letting
          #   full-setup-validate's base-channel fallback silently validate STALE content
          #   for a service this PR actually touched -- exactly what the "Refusing to
          #   fall back to the PR base commit's content for a touched service" guard in
          #   "Ensure PR staging tags exist for full-setup services" exists to prevent.
          # From: Issue #1095 | PR #1642 | PR #1643
          declare -a diverged_services=()

          for service in "${services[@]}"; do
            amd64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-amd64"
            arm64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-arm64"
            target_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"

            # Same "do not retry an expected-absence probe" reasoning as the
            # trusted-ref step above.
            if ! docker buildx imagetools inspect "$amd64_image" >/dev/null 2>&1; then
              echo "::notice::Skipping $service: no linux/amd64 PR staging image (not touched by this PR, or a fork PR)."
              continue
            fi
            if ! docker buildx imagetools inspect "$arm64_image" >/dev/null 2>&1; then
              # What: `continue`, not `exit 1` -- same failure class already fixed for the
              #   trusted-ref step above (found while working full-setup-validate's gate).
              # Why: aborting the whole loop here silently dropped every service iterated
              #   after this one from this step's outputs too, with no error naming them;
              #   the post-loop check below still fails the step overall (see above).
              # From: Issue #1095 | PR #1642 | PR #1643
              echo "::error::$service has a linux/amd64 PR staging image but no linux/arm64 one ($arm64_image); build and build-arm64 disagreed on whether this service needed building. Continuing to process other services below, but this step still fails overall."
              diverged_services+=("$service")
              continue
            fi

            amd64_digest="$(digest_for_image "$amd64_image")"
            arm64_digest="$(digest_for_image "$arm64_image")"
            [[ "$amd64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest for $service: $amd64_digest"; exit 1; }
            [[ "$arm64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest for $service: $arm64_digest"; exit 1; }
            amd64_ref="ghcr.io/${REPOSITORY}/${service}@${amd64_digest}"
            arm64_ref="ghcr.io/${REPOSITORY}/${service}@${arm64_digest}"

            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create -t "$target_image" "$amd64_ref" "$arm64_ref"
            GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
              bash scripts/untracked/require-image-platforms.sh "$target_image" "$REQUIRED_PLATFORMS"

            # Same underscore-key reasoning as the trusted-ref step above.
            # This PR staging manifest is the exact tag full-setup-validate
            # pulls and runs for this PR's commits, not a throwaway build
            # artifact, so it gets the same provenance attestation.
            merged_digest="$(digest_for_image "$target_image")"
            printf '%s_digest=%s\n' "${service//-/_}" "$merged_digest" >> "$GITHUB_OUTPUT"
          done

          # What: the backstop `diverged_services` above exists to enforce -- fails the
          #   step now that every service has been processed.
          # Why: without this, the step would exit 0 despite a real divergence (see the
          #   array's own comment above for the exact guard this would otherwise defeat).
          # From: Issue #1095 | PR #1642 | PR #1643
          if [ "${#diverged_services[@]}" -gt 0 ]; then
            echo "::error::${#diverged_services[@]} service(s) had a linux/amd64 PR staging image but no linux/arm64 one this run (${diverged_services[*]}). See each service's own ::error:: above; this step fails so merge-manifests reports failure and full-setup-validate cannot silently fall back to stale base-channel content for a touched service."
            exit 1
          fi

      # "Set up Docker Buildx" above runs unconditionally (unlike the two
      # mutually-exclusive "Create ..." steps that consume it), so this
      # teardown is unconditional too -- exactly one of those two steps ever
      # uses the builder per run, but it was created either way.

      - name: Attest immutable stack pointer provenance
        if: steps.create-trusted-manifests.outputs.stack_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/stack
          subject-digest: ${{ steps.create-trusted-manifests.outputs.stack_digest }}

      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      # What: one explicit attest step per service, digest-gated.
      # Why: full reasoning on the linked issue.
      # From: Issue #1095 | PR #1532
      - name: Attest proxy merged manifest provenance
        if: steps.create-trusted-manifests.outputs.proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/proxy
          subject-digest: ${{ steps.create-trusted-manifests.outputs.proxy_digest }}

      - name: Attest dns merged manifest provenance
        if: steps.create-trusted-manifests.outputs.dns_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dns
          subject-digest: ${{ steps.create-trusted-manifests.outputs.dns_digest }}

      - name: Attest watchdog merged manifest provenance
        if: steps.create-trusted-manifests.outputs.watchdog_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/watchdog
          subject-digest: ${{ steps.create-trusted-manifests.outputs.watchdog_digest }}

      - name: Attest dhcp merged manifest provenance
        if: steps.create-trusted-manifests.outputs.dhcp_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp
          subject-digest: ${{ steps.create-trusted-manifests.outputs.dhcp_digest }}

      - name: Attest dhcp-proxy merged manifest provenance
        if: steps.create-trusted-manifests.outputs.dhcp_proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp-proxy
          subject-digest: ${{ steps.create-trusted-manifests.outputs.dhcp_proxy_digest }}

      - name: Attest ntp merged manifest provenance
        if: steps.create-trusted-manifests.outputs.ntp_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ntp
          subject-digest: ${{ steps.create-trusted-manifests.outputs.ntp_digest }}

      - name: Attest ui merged manifest provenance
        if: steps.create-trusted-manifests.outputs.ui_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ui
          subject-digest: ${{ steps.create-trusted-manifests.outputs.ui_digest }}

      - name: Attest build-tools merged manifest provenance
        if: steps.create-trusted-manifests.outputs.build_tools_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/build-tools
          subject-digest: ${{ steps.create-trusted-manifests.outputs.build_tools_digest }}

      - name: Attest syslog merged manifest provenance
        if: steps.create-trusted-manifests.outputs.syslog_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/syslog
          subject-digest: ${{ steps.create-trusted-manifests.outputs.syslog_digest }}

      # Fork PRs self-skip here without any extra guard needed: build/build-arm64
      # never push a fork PR's per-arch legs, so create-pr-staging-manifests'
      # own loop above never emits these *_digest outputs for a fork PR, and
      # every one of these seven steps is gated off by its own `if:` as a result.
      - name: Attest proxy PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/proxy
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.proxy_digest }}

      - name: Attest dns PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.dns_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dns
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.dns_digest }}

      - name: Attest watchdog PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.watchdog_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/watchdog
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.watchdog_digest }}

      - name: Attest dhcp PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.dhcp_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.dhcp_digest }}

      - name: Attest dhcp-proxy PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.dhcp_proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp-proxy
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.dhcp_proxy_digest }}

      - name: Attest ntp PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.ntp_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ntp
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.ntp_digest }}

      - name: Attest ui PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.ui_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ui
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.ui_digest }}

      - name: Attest build-tools PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.build_tools_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/build-tools
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.build_tools_digest }}

      # Same gap as the trusted-ref block above: syslog was missing here too.
      - name: Attest syslog PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.syslog_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/syslog
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.syslog_digest }}

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  promote:
    # What: promotion is gated by an explicit !cancelled() condition.
    # Why: avoids the implicit-success() skip trap; see the linked issue.
    # From: Issue #1095 | PR #1532
    name: promote stack image channels
    needs: [merge-manifests, full-setup-validate]
    if: "!cancelled() && needs['merge-manifests'].result == 'success' && needs['full-setup-validate'].result == 'success' && github.event_name != 'pull_request'"
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # 45 minutes covers the cross-workflow promote-lock retry budget plus normal registry work.
    timeout-minutes: 45
    # What: real mutual exclusion comes from the cross-workflow lock.
    # Why: full reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    permissions:
      # What: contents: write, for the promote-lock's compare-and-swap
      # push/delete of refs/promote-lock/global (a non-branch/non-tag ref).
      # Why: grants no write to master/tags -- branch protection only
      # matches refs/heads/*, and this ref lives outside refs/heads/*
      # and refs/tags/* both.
      # From: Issue #1095 | PR #1532
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      # What: fetch-depth: 0 for a full-history checkout.
      # Why: the version-bump step needs `git describe --tags` and
      # classify-image-impact.sh's merge-base diff, neither shallow-safe.
      # From: Issue #1095 | PR #1532
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1
        with:
          fetch-depth: 0

      # What: acquires cross-host mutual exclusion before any image work.
      # Why: fails closed under set -euo pipefail; see the linked issue.
      # From: Issue #1095 | PR #1532
      - name: Acquire the cross-workflow promote lock
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/promote-lock.sh
          source "$GITHUB_WORKSPACE/scripts/lib/promote-lock.sh"

          holder_note="$(promote_lock_holder_note "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME")"
          echo "Acquiring $PROMOTE_LOCK_REF as: $holder_note"

          # Budget: up to 40 attempts, 15s backoff on a held-but-not-stale lock (~10 minutes
          # total) -- generous relative to promote's own typical runtime, so a realistic queue
          # of a few waiting promotions drains well within budget. stale_after=900s (15
          # minutes) is comfortably longer than any legitimate promote/backfill run, so a
          # crashed or killed holder's abandoned lock is recovered promptly without risking a
          # takeover of a run still legitimately working.
          promote_lock_acquire_with_retry origin "$holder_note" 40 15 900

      - name: Clean up stale Buildx builder containers (self-hosted reuse hardening)
        run: bash scripts/tracked/cleanup-stale-buildx-builders.sh
      - name: Set up Docker Buildx
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote coherent stack tags
        id: promote-stack
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PROXY_DIGEST: ${{ needs['merge-manifests'].outputs.proxy_digest }}
          DNS_DIGEST: ${{ needs['merge-manifests'].outputs.dns_digest }}
          WATCHDOG_DIGEST: ${{ needs['merge-manifests'].outputs.watchdog_digest }}
          DHCP_DIGEST: ${{ needs['merge-manifests'].outputs.dhcp_digest }}
          DHCP_PROXY_DIGEST: ${{ needs['merge-manifests'].outputs.dhcp_proxy_digest }}
          NTP_DIGEST: ${{ needs['merge-manifests'].outputs.ntp_digest }}
          SYSLOG_DIGEST: ${{ needs['merge-manifests'].outputs.syslog_digest }}
          UI_DIGEST: ${{ needs['merge-manifests'].outputs.ui_digest }}
          BUILD_TOOLS_DIGEST: ${{ needs['merge-manifests'].outputs.build_tools_digest }}
          UTILITIES_DIGEST: ${{ needs['merge-manifests'].outputs.utilities_digest }}
          STACK_DIGEST: ${{ needs['merge-manifests'].outputs.stack_digest }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # What: uses the full commit SHA directly, no local truncation.
          # Why: short-SHA tags are banned; a local slice risks collisions.
          # From: Issue #1095 (G2) | PR #1503
          source_tag="sha-${COMMIT_SHA}"
          stack_pointer_image="ghcr.io/${REPOSITORY}/stack@${STACK_DIGEST}"
          channel_tags=()
          declare -A candidate_digests=(
            [proxy]="$PROXY_DIGEST"
            [dns]="$DNS_DIGEST"
            [watchdog]="$WATCHDOG_DIGEST"
            [dhcp]="$DHCP_DIGEST"
            [dhcp-proxy]="$DHCP_PROXY_DIGEST"
            [ntp]="$NTP_DIGEST"
            [syslog]="$SYSLOG_DIGEST"
            [ui]="$UI_DIGEST"
            [build-tools]="$BUILD_TOOLS_DIGEST"
            [utilities]="$UTILITIES_DIGEST"
          )
          declare -A previous_refs=()
          promoted_targets=()

          # What: wrapped in ghcr_retry -- absence is never expected here,
          # unlike merge-manifests' existence probes.
          # Why: rollback_promotions needs the real previous digest.
          # From: Issue #1095 | PR #1619
          digest_for_image() {
            local image=$1
            local digest

            if ! digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
              return 1
            fi
            digest="${digest%\"}"
            digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]]
            printf '%s\n' "$digest"
          }

          rollback_promotions() {
            local status=$?
            local target_image previous_digest

            if [[ "$status" = "0" || "${#promoted_targets[@]}" = "0" ]]; then
              exit "$status"
            fi

            echo "::error::Promotion failed after public tags were moved; attempting best-effort rollback."
            for target_image in "${promoted_targets[@]}"; do
              previous_digest="${previous_refs[$target_image]:-}"
              if [[ -n "$previous_digest" ]]; then
                ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                  docker buildx imagetools create --prefer-index=false -t "$target_image" "${target_image%:*}@${previous_digest}" \
                  || echo "::error::Could not restore previous digest for $target_image."
              else
                echo "::error::No previous digest existed for $target_image; manual GHCR inspection is required."
              fi
            done
            exit "$status"
          }
          trap rollback_promotions EXIT

          # What: debounce -- skips the move if the ref's remote tip
          # moved past this commit.
          # Why: a queued older run must not move a channel tag onto a
          # superseded commit.
          # From: Issue #1095 | PR #1619
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            current_tip="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
            if [[ -z "$current_tip" ]]; then
              echo "::error::Could not resolve the current tip of ${GITHUB_REF} via git ls-remote; refusing to promote blind."
              exit 1
            fi
            if [[ "$current_tip" != "$COMMIT_SHA" ]]; then
              echo "::notice::${GITHUB_REF} has already moved to ${current_tip} since this run was triggered for ${COMMIT_SHA}; skipping channel promotion so the run already targeting the current tip can supersede it."
              exit 0
            fi
          fi

          # What: maps the triggering ref to its channel tag(s).
          # Why: full channel-cadence reasoning on the linked issue.
          # From: Issue #1095 | PR #1532
          if [[ "$GITHUB_REF" = "refs/heads/master" ]]; then
            channel_tags+=(latest)
          elif [[ "$GITHUB_REF" = "refs/heads/current_dev" ]]; then
            : # Deliberately no automatic channel tag on a plain push; see the comment above this if/elif chain.
          elif [[ "$GITHUB_REF" = refs/tags/v* ]]; then
            channel_tags+=("$GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              :
            elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              bash scripts/tracked/check-stable-external-images.sh
              channel_tags+=(latest)
            else
              echo "::error::Unsupported release tag '${GITHUB_REF_NAME}'. Use vX.Y.Z or vX.Y.Z-rc.N."
              exit 1
            fi
          fi

          # workflow_dispatch can additionally request one channel move from
          # whatever ref it's dispatched against, independent of the
          # automatic branch/tag rule above -- e.g. spot-check a feature
          # branch as "dev" without merging it into v0.2.0 first. "none"
          # (the default) adds nothing.
          if [[ -n "$REQUESTED_CHANNEL" && "$REQUESTED_CHANNEL" != "none" ]]; then
            already_requested=false
            for existing_channel in "${channel_tags[@]}"; do
              [[ "$existing_channel" = "$REQUESTED_CHANNEL" ]] && already_requested=true
            done
            if [[ "$already_requested" = false ]]; then
              channel_tags+=("$REQUESTED_CHANNEL")
            fi
          fi

          if (( ${#channel_tags[@]} == 0 )); then
            echo "::notice::No public channel tags are configured for $GITHUB_REF."
            exit 0
          fi

          # Validate the exact candidate identities handed off by merge-manifests.
          # The sha-* names are checked only as immutable-record pointers; promotion
          # itself consumes repository@sha256 references from the job outputs.
          for service in "${services[@]}"; do
            expected_digest="${candidate_digests[$service]:-}"
            [[ "$expected_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
              echo "::error::Missing or malformed candidate digest for $service: '$expected_digest'."
              exit 1
            }
            source_tag_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"
            source_tag_digest="$(digest_for_image "$source_tag_image")"
            [[ "$source_tag_digest" = "$expected_digest" ]] || {
              echo "::error::$source_tag_image moved away from the merge-manifests digest; refusing promotion."
              exit 1
            }
            GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
              bash scripts/untracked/require-image-platforms.sh "ghcr.io/${REPOSITORY}/${service}@${expected_digest}" "$REQUIRED_PLATFORMS"
          done

          [[ "$STACK_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Missing or malformed stack pointer digest '$STACK_DIGEST'."; exit 1; }
          stack_tag_image="ghcr.io/${REPOSITORY}/stack:${source_tag}"
          [[ "$(digest_for_image "$stack_tag_image")" = "$STACK_DIGEST" ]] || {
            echo "::error::$stack_tag_image moved away from the merge-manifests stack pointer digest; refusing promotion."
            exit 1
          }
          GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
            bash scripts/untracked/require-image-platforms.sh "$stack_pointer_image" "$REQUIRED_PLATFORMS"

          # What: neither loop below passes --annotation.
          # Why: passing it again would re-serialize with a new digest.
          # From: Issue #1095 | PR #1619
          for service in "${services[@]}"; do
            source_image="ghcr.io/${REPOSITORY}/${service}@${candidate_digests[$service]}"
            for channel_tag in "${channel_tags[@]}"; do
              target_image="ghcr.io/${REPOSITORY}/${service}:${channel_tag}"
              previous_refs["$target_image"]="$(digest_for_image "$target_image" || true)"
              ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                docker buildx imagetools create --prefer-index=false -t "$target_image" "$source_image"
              promoted_targets+=("$target_image")
            done
          done

          for channel_tag in "${channel_tags[@]}"; do
            target_image="ghcr.io/${REPOSITORY}/stack:${channel_tag}"
            previous_refs["$target_image"]="$(digest_for_image "$target_image" || true)"
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create --prefer-index=false -t "$target_image" "$stack_pointer_image"
            promoted_targets+=("$target_image")
          done

          for service in "${services[@]}"; do
            for channel_tag in "${channel_tags[@]}"; do
              ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                docker buildx imagetools inspect "ghcr.io/${REPOSITORY}/${service}:${channel_tag}" >/dev/null
            done
          done

          for channel_tag in "${channel_tags[@]}"; do
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools inspect "ghcr.io/${REPOSITORY}/stack:${channel_tag}" >/dev/null
          done

      # "Promote coherent stack tags" above is the only step in this job
      # that uses the builder set up above -- neither "Cut an automated
      # patch release tag" nor anything after it touches buildx. Torn down
      # here rather than left running until this job's own much-later
      # "Release the cross-workflow promote lock" cleanup.

      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      # Automated SemVer patch (Z) tagging (#819). Gated to the release-bearing branch
      # (master) only -- on any other ref this step is a deliberate no-op until master
      # itself starts receiving pushes, the still-undesigned "v0.2.0 -> master" promotion
      # event tracked in #825. Minor/major bumps stay a manual maintainer tag push; only Z
      # is ever computed here (see scripts/untracked/compute-next-release-tag.sh).
      #
      # `if:` is written as `success() && ...`, not a bare `github.ref == ...` condition,
      # for the same reason the job-level `if:` above carries its own long comment: a
      # step's own `if:` REPLACES (does not extend) the implicit `success()` GitHub Actions
      # would otherwise apply, so leaving `success()` out would let this step run even
      # after the "Promote coherent stack tags" step above it failed.
      - name: Cut an automated patch release tag for image-affecting master changes
        if: ${{ success() && github.ref == 'refs/heads/master' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # This is core release machinery on the release-bearing branch, not
          # optional convenience automation, so a missing PAT fails closed
          # rather than silently skipping the release (AGENTS.md: do not hide
          # required-command failures).
          : "${PROJECT_AUTOMATION_PAT:?PROJECT_AUTOMATION_PAT is required to push an automated release tag (GITHUB_TOKEN-authored tag pushes do not re-trigger this workflow, a documented GitHub anti-recursion behavior, so the tag-triggered release job would never run).}"

          # A missing bootstrap tag is an expected, one-time prerequisite gap (see #819 Point
          # 4), not a broken-release-machinery state -- the channel-tag promotion in the step
          # above this one has already succeeded by the time this runs. Failing the whole job
          # here would misreport "bootstrap not done yet" as "promotion is broken," so this is
          # a skip (::notice:: + exit 0), not a hard failure. Once the maintainer cuts the
          # first vX.Y.Z tag, this same push (or the next one) picks it up automatically.
          base_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [[ -z "$base_tag" ]]; then
            echo "::notice::No vX.Y.Z release tag exists yet on this history; skipping automated patch tagging until the first release tag is bootstrapped (see #819 Point 4)."
            exit 0
          fi
          base_commit="$(git rev-list -n1 "$base_tag")"

          # Reuse the SAME classifier detect-changes and the earlier channel
          # promotion above both rely on (#819 Point 1: do not invent a
          # parallel classifier). Diffing from the last release's own commit
          # (not just "the previous push") means a burst of N merges landing
          # on master between two promote runs still yields exactly ONE
          # bump reflecting the whole burst, not N.
          image_impact="$(bash scripts/untracked/classify-image-impact.sh "$base_commit" "$COMMIT_SHA" | grep -x 'IMAGE_IMPACT=true' || true)"
          if [[ -z "$image_impact" ]]; then
            echo "::notice::No image-affecting change between ${base_tag} (${base_commit}) and ${COMMIT_SHA}; no patch release cut."
            exit 0
          fi

          next_tag="$(bash scripts/untracked/compute-next-release-tag.sh "$base_tag")"

          # Cheap end-of-run re-check, independent of and in addition to the debounce check
          # the "Promote coherent stack tags" step already performed earlier in this same job:
          # re-resolve master's tip again immediately before pushing the version tag itself.
          # Two releases landing back-to-back within the few seconds between that earlier check
          # and this one is a low-probability window, but it is a single, near-free
          # git ls-remote call, so there is no reason not to close it.
          current_tip="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ -z "$current_tip" ]]; then
            echo "::error::Could not resolve the current tip of refs/heads/master via git ls-remote; refusing to cut a release tag blind."
            exit 1
          fi
          if [[ "$current_tip" != "$COMMIT_SHA" ]]; then
            echo "::notice::refs/heads/master has already moved to ${current_tip} since this run was triggered for ${COMMIT_SHA}; skipping the version-tag cut so the run already targeting the current tip can supersede it."
            exit 0
          fi

          # What: skips tag creation if this exact tag already exists.
          # Why: a re-run, or an earlier attempt that pushed the tag but
          # failed later, must not fail or push a duplicate.
          # From: Issue #1095 | PR #1532
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${next_tag}" 2>/dev/null)" ]]; then
            echo "::notice::${next_tag} already exists on origin; nothing to do."
            exit 0
          fi

          git tag -a "$next_tag" "$COMMIT_SHA" -m "Automated patch release ${next_tag}"
          # What: pushes the release tag via a Basic-Auth header, not the URL.
          # Why: avoids anti-recursion + a secret leak; see linked issue.
          # From: Issue #1095 | PR #1532
          push_url="https://github.com/${REPOSITORY}.git"
          # What: resets checkout's persisted Authorization header first.
          # Why: avoids a duplicate-header push rejection; see the linked issue.
          # From: Issue #1095 | PR #1532
          git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="" \
          GIT_CONFIG_KEY_1="http.${push_url}.extraheader" \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $(printf '%s' "x-access-token:${PROJECT_AUTOMATION_PAT}" | base64 -w0)" \
            git push "$push_url" "refs/tags/${next_tag}"
          echo "::notice::Cut ${next_tag} from ${COMMIT_SHA}. The tag-triggered run of this workflow will move 'latest' and publish the GitHub release."

      # What: same digest-bound cache as merge-manifests' attest steps.
      # Why: an all-unchanged push reproduces the identical stack-pointer
      # digest, which would otherwise be re-attested for no reason.
      # From: Issue #1095 | PR #1532
      - name: Release the cross-workflow promote lock
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/promote-lock.sh
          source "$GITHUB_WORKSPACE/scripts/lib/promote-lock.sh"

          holder_note="$(promote_lock_holder_note "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME")"
          # `|| true` here is the documented, narrow exception AG-VAL-004 allows:
          # promote_lock_release already prints its own ::warning:: for every non-fatal outcome
          # (already released, no longer ours, or a failed delete push), and this whole
          # design's stale_after takeover exists specifically so a genuinely failed/skipped
          # release here is recovered by the next waiter rather than wedging the lock forever --
          # release is best-effort cleanup, not a correctness-critical step.
          promote_lock_release origin "$holder_note" || true

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  release:
    # Release source archives must match the same commit that produced the images. This
    # keeps source, image tags, and attestations traceable together.
    #
    # Same reasoning as promote's `if:` above: use an explicit needs.promote.result check
    # under a status function rather than a bare condition, so this job isn't silently
    # skipped by the implicit success() walking back through promote's own
    # transitively-skipped dependencies. `!cancelled()`, not `always()`, so a maintainer
    # cancelling the run can still stop this from publishing a release source archive.
    name: publish release source
    needs: promote
    if: "!cancelled() && needs.promote.result == 'success' && startsWith(github.ref, 'refs/tags/v')"
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # NO REAL RUN DATA: this job only runs on an actual `refs/tags/v*` push, and no such
    # run of this workflow has completed in the recorded history checked for this rollout
    # (2026-07, ~3800 total workflow runs) -- tags v0.1.0/v0.2.0/v0.3.0/v0.3.1 exist as
    # GitHub releases, but none was created by a tag push that triggered this exact job.
    # This value is therefore an estimate, not a measurement: 30 minutes, anchored to
    # promote's/merge-manifests' class of work (no compilation), not scaled from any
    # observed duration. Flagged explicitly rather than guessed silently -- revisit once a
    # real tag-push run of this job exists to measure.
    timeout-minutes: 30
    # Job-level concurrency, keyed per tag ref: this job's GET-then-create-or-PATCH logic
    # against the GitHub Releases API is only safe if at most one instance runs per tag
    # at a time (two concurrent instances could both GET "no release yet" and race two
    # separate POSTs, or one could PATCH over the other's body-preservation read). Before
    # this workflow's top-level group became run_id-suffixed for tag pushes, that
    # whole-run serialization made two `release` runs for the same tag effectively
    # impossible; it no longer does, so this job needs its own guarantee. Scoped by ref
    # (not global like `promote`'s group) because release publishing for different tags
    # is genuinely independent. cancel-in-progress stays false: queue a second attempt for
    # the same tag rather than cancel the first mid-write.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Clean up stale Buildx builder containers (self-hosted reuse hardening)
        run: bash scripts/tracked/cleanup-stale-buildx-builders.sh
      - name: Set up Docker Buildx
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release image platform coverage
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          # What: syslog/utilities are explicit in this SERVICES scalar.
          # Why: check-workflow-service-lists.sh's regex guard can only
          # see a space-separated scalar here, not a bash array.
          # From: Issue #1428 | PR #1433 | Issue #1556 | PR #1574
          SERVICES: proxy dns watchdog dhcp dhcp-proxy ntp syslog ui build-tools utilities stack
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          read -r -a services <<< "$SERVICES"
          for service in "${services[@]}"; do
            image="ghcr.io/${REPOSITORY}/${service}:${TAG_NAME}"
            bash scripts/untracked/require-image-platforms.sh "$image" "$REQUIRED_PLATFORMS"
          done

      # Patches (rather than overwrites) an existing release body: the image_notes_start/end
      # HTML-comment markers bound exactly the auto-generated section, so any text a
      # maintainer added by hand outside those markers survives a re-run of this job (e.g. a
      # manual re-promotion of the same tag, or a rerun after a transient failure). A
      # brand-new release has no existing body to preserve, so its notes are just the
      # auto-generated section verbatim. The prerelease-state check further down exists
      # because GitHub's PATCH endpoint would otherwise happily flip a release's prerelease
      # flag to match whatever this run computes -- silently promoting/demoting a release a
      # maintainer may have already published deliberately.
      - name: Create or update GitHub release for built images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # What: uses the full commit SHA directly, no local truncation.
          # Why: short-SHA tags are banned; a local slice risks collisions.
          # From: Issue #1095 (G2) | PR #1503
          source_tag="sha-${COMMIT_SHA}"
          expected_prerelease=false
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            expected_prerelease=true
            echo "::notice::Tag $TAG_NAME is a release candidate and will be published as a prerelease."
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            expected_prerelease=false
          else
            echo "::error::Unsupported release tag '$TAG_NAME'. Use vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi

          digest_for_image() {
            local image=$1
            local digest

            digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          build_tools_image="ghcr.io/${REPOSITORY}/build-tools:${TAG_NAME}"
          stack_pointer_image="ghcr.io/${REPOSITORY}/stack:${TAG_NAME}"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$build_tools_image" >/dev/null
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$stack_pointer_image" >/dev/null
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker pull "$build_tools_image" >/dev/null
          rust_base_digest="$(docker image inspect "$build_tools_image" --format '{{ index .Config.Labels "org.opencontainers.image.base.rust.digest" }}')"
          golang_base_digest="$(docker image inspect "$build_tools_image" --format '{{ index .Config.Labels "org.opencontainers.image.base.golang.digest" }}')"
          if [[ ! "$rust_base_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$golang_base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-tools image is missing build-time base digest labels."
            exit 1
          fi

          image_notes_start='<!-- lancache-ng-image-tags:start -->'
          image_notes_end='<!-- lancache-ng-image-tags:end -->'
          notes_file="$(mktemp)"
          {
            printf '%s\n' "$image_notes_start"
            printf 'This release source is the exact commit used by CI to build and publish the service images for %s.\n\n' "$TAG_NAME"
            printf 'Commit: %s\n\n' "$COMMIT_SHA"
            printf 'Published image tags and digests:\n\n'
            for service in "${services[@]}"; do
              tag_image="ghcr.io/${REPOSITORY}/${service}:${TAG_NAME}"
              sha_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"
              tag_digest="$(digest_for_image "$tag_image")"
              sha_digest="$(digest_for_image "$sha_image")"
              if [[ "$tag_digest" != "$sha_digest" ]]; then
                echo "::error::Release tag digest for $tag_image does not match $sha_image."
                exit 1
              fi
              printf -- '- %s -> %s\n' "$tag_image" "$tag_digest"
            done
            printf '\nMatching immutable SHA image tags:\n\n'
            for service in "${services[@]}"; do
              sha_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"
              sha_digest="$(digest_for_image "$sha_image")"
              printf -- '- %s -> %s\n' "$sha_image" "$sha_digest"
            done
            printf '\nStack channel pointer:\n\n'
            printf -- '- %s -> %s\n' "$stack_pointer_image" "$(digest_for_image "$stack_pointer_image")"
            printf -- '- ghcr.io/%s/stack:%s -> %s\n' "$REPOSITORY" "$source_tag" "$(digest_for_image "ghcr.io/${REPOSITORY}/stack:${source_tag}")"
            printf '\nResolved build-tools base image digests:\n\n'
            printf -- '- rust:latest -> %s\n' "$rust_base_digest"
            printf -- '- golang:latest -> %s\n' "$golang_base_digest"
            printf '\nProvenance and SBOM status:\n\n'
            printf -- '- Provenance attestations are pushed to GHCR for every first-party service image digest and the stack channel-pointer digest.\n'
            printf -- '- CycloneDX SBOMs are generated per released first-party image digest (via Trivy) and attached to this GitHub release as <service>.cdx.json assets by the release-sbom job.\n'
            printf -- '- An OpenVEX document generated from .trivyignore.yaml is attached to this release as vex.openvex.json.\n'
            printf '%s\n' "$image_notes_end"
          } > "$notes_file"

          # What: -i attaches host stdin (script is fed via the bash -s
          # <<'UPDATE_RELEASE' heredoc below).
          # Why: without -i, `docker run` never connects container stdin;
          # the containerized `bash -s` gets immediate EOF and exits 0
          # having done nothing -- a silent no-op, not a visible failure.
          # From: Issue #1095 (F-22)
          docker run --rm -i \
            -e GITHUB_TOKEN \
            -e REPOSITORY \
            -e TAG_NAME \
            -e COMMIT_SHA \
            -e EXPECTED_PRERELEASE="$expected_prerelease" \
            -v "$notes_file:/tmp/lancache-release-notes.md:ro" \
            "$build_tools_image" \
            timeout --kill-after=30 --signal=KILL 600 \
            bash -s <<'UPDATE_RELEASE'
          set -euo pipefail

          api_url="https://api.github.com/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"
          image_notes_start='<!-- lancache-ng-image-tags:start -->'
          image_notes_end='<!-- lancache-ng-image-tags:end -->'
          expected_prerelease="$EXPECTED_PRERELEASE"

          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "$auth_header" \
            -H "$accept_header" \
            -H "$version_header" \
            "$api_url/releases/tags/$TAG_NAME")"

          if [ "$status" = "200" ]; then
            release_id="$(jq -r '.id' "$response_file")"
            existing_prerelease="$(jq -r '.prerelease' "$response_file")"
            if [ "$existing_prerelease" != "$expected_prerelease" ]; then
              echo "Existing GitHub release prerelease state does not match tag policy for $TAG_NAME." >&2
              echo "Expected prerelease=$expected_prerelease, found prerelease=$existing_prerelease." >&2
              exit 1
            fi
            existing_body="$(jq -r '.body // ""' "$response_file")"
            # shellcheck disable=SC2016
            updated_body="$(jq -nr \
              --arg body "$existing_body" \
              --arg notes "$(cat /tmp/lancache-release-notes.md)" \
              --arg start "$image_notes_start" \
              --arg end "$image_notes_end" \
              '
              if ($body | contains($start)) and ($body | contains($end)) then
                ($body | split($start)[0]) as $prefix
                | ($body | split($end)[1:] | join($end)) as $suffix
                | $prefix + $notes + $suffix
              elif ($body | length) > 0 then
                $body + "\n\n" + $notes
              else
                $notes
              end
              ')"
            # draft:false and target_commitish are forced here, not just body:
            # a pre-existing release object for this tag (e.g. one release-drafter
            # auto-created as a draft before this job ever ran, potentially
            # target_commitish-ing a dev branch tip rather than this tag's own
            # commit) must still end up published and pointed at the right
            # commit once this job confirms the tag's images are good -- unlike
            # prerelease above, there is no legitimate "maintainer deliberately
            # left it draft/mistargeted" case to protect against here.
            jq -n \
              --arg body "$updated_body" \
              --arg target_commitish "$COMMIT_SHA" \
              '{body:$body, draft:false, target_commitish:$target_commitish}' \
              > "$response_file.patch"
            curl -fsS -X PATCH \
              -H "$auth_header" \
              -H "$accept_header" \
              -H "$version_header" \
              -d @"$response_file.patch" \
              "$api_url/releases/$release_id" >/dev/null
          elif [ "$status" = "404" ]; then
            # shellcheck disable=SC2016
            jq -n \
              --arg tag_name "$TAG_NAME" \
              --arg target_commitish "$COMMIT_SHA" \
              --arg name "$TAG_NAME" \
              --arg body "$(cat /tmp/lancache-release-notes.md)" \
              --argjson prerelease "$expected_prerelease" \
              '{tag_name:$tag_name, target_commitish:$target_commitish, name:$name, body:$body, draft:false, prerelease:$prerelease}' \
              > "$response_file.create"
            curl -fsS -X POST \
              -H "$auth_header" \
              -H "$accept_header" \
              -H "$version_header" \
              -d @"$response_file.create" \
              "$api_url/releases" >/dev/null
          else
            cat "$response_file"
            echo "Failed to inspect GitHub release for $TAG_NAME; HTTP status $status" >&2
            exit 1
          fi
          UPDATE_RELEASE

      # "Create or update GitHub release for built images" above is the last
      # step in this job that uses the builder set up above -- "Attach
      # OpenVEX document to the release" below only touches a release asset
      # via curl, no buildx.
      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Attach OpenVEX document to the release
        # OSPS-VM-04.02: publish the portable OpenVEX document (vex.openvex.json) as a
        # release asset. Regenerated fresh here from THIS TAG's own checked-out
        # .trivyignore.yaml via scripts/untracked/generate-vex.sh, rather than read from
        # the checkout (vex.openvex.json is no longer committed to current_dev at all)
        # or copied from the CI-Automation/vex branch's current tip
        # (that branch is refreshed asynchronously by .github/workflows/vex-regenerate.yml
        # on a plain `push` to current_dev and could legitimately still be catching up
        # when a release tag is cut moments later -- reading it here would risk shipping a
        # stale VEX for a real, if narrow, race). Regenerating directly from the tag's
        # own .trivyignore.yaml is race-free by construction: whatever that file says at
        # this exact tag is what ships, unconditionally. Idempotent: an existing
        # same-named asset is deleted before re-upload. bash/jq/curl run in the
        # tag-scoped build-tools image (guaranteed built for a release tag per AG-CI-010),
        # same as the release-notes step above, rather than assuming host tooling
        # (AG-CI-001).
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          if [ ! -s .trivyignore.yaml ]; then
            echo "::error::.trivyignore.yaml is missing from the ${TAG_NAME} checkout; cannot generate the release VEX document." >&2
            exit 1
          fi

          build_tools_image="ghcr.io/${REPOSITORY}/build-tools:${TAG_NAME}"

          # Generate against this tag's own .trivyignore.yaml first, outside the upload
          # container, so a generator failure is reported clearly before any release-asset
          # API calls happen.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "$build_tools_image" \
            timeout --kill-after=30 --signal=KILL 300 \
            bash scripts/untracked/generate-vex.sh > vex.openvex.json.release
          if [ ! -s vex.openvex.json.release ]; then
            echo "::error::scripts/untracked/generate-vex.sh produced empty output for ${TAG_NAME}'s .trivyignore.yaml." >&2
            exit 1
          fi

          # -i required: see the identical note on "Create or update GitHub release for
          # built images" above -- this is the same stdin-heredoc shape (bash -s
          # <<'UPLOAD_VEX'), and without -i the upload would silently no-op.
          docker run --rm -i \
            -e GITHUB_TOKEN \
            -e REPOSITORY \
            -e TAG_NAME \
            -v "$PWD/vex.openvex.json.release:/tmp/vex.openvex.json:ro" \
            "$build_tools_image" \
            timeout --kill-after=30 --signal=KILL 600 \
            bash -s <<'UPLOAD_VEX'
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          uploads="https://uploads.github.com/repos/${REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"
          asset_name="vex.openvex.json"

          release_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/tags/$TAG_NAME" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Could not resolve release id for $TAG_NAME." >&2
            exit 1
          fi

          existing_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/$release_id/assets" | jq -r --arg n "$asset_name" '.[] | select(.name == $n) | .id')"
          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            curl -fsS -X DELETE -H "$auth" -H "$accept" -H "$version" "$api/releases/assets/$existing_id" >/dev/null
          fi

          curl -fsS -X POST \
            -H "$auth" -H "$accept" -H "$version" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vex.openvex.json \
            "$uploads/releases/$release_id/assets?name=$asset_name" >/dev/null
          echo "Uploaded $asset_name to release $TAG_NAME."
          UPLOAD_VEX

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  release-sbom:
    # What: generates a CycloneDX SBOM per released digest, attached as
    # a GitHub release asset (OSPS-QA-02.02).
    # Why: release-tags only; a push-time SBOM would redo container-scan.
    # From: Issue #1095 | PR #1619
    name: publish SBOM for ${{ matrix.service }}
    needs: release
    if: "!cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v')"
    # What: Runs on the heavy self-hosted tier (AG-CI-002).
    # Why: Container image scanning is memory-heavy.
    # From: Issue #1095 | PR #1619
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # What: 65-minute timeout estimate for this job.
    # Why: covers the Trivy scan-retry's worst case plus checkout/buildx.
    # From: Issue #1095 | PR #1619
    timeout-minutes: 65
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # What: container-scan's own Trivy-scanned set, minus `stack`
        # (an unscanned channel-pointer image).
        # Why: a hand-kept copy risks drifting out of sync.
        # From: Issue #1095 | PR #1619
        service: [proxy, dns, watchdog, dhcp, dhcp-proxy, ntp, syslog, ui, build-tools, utilities]
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Clean up stale Buildx builder containers (self-hosted reuse hardening)
        run: bash scripts/tracked/cleanup-stale-buildx-builders.sh
      - name: Set up Docker Buildx
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released image digest
        id: digest
        env:
          SERVICE: ${{ matrix.service }}
          TAG_NAME: ${{ github.ref_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          image="ghcr.io/${REPOSITORY}/${SERVICE}:${TAG_NAME}"
          # Scan by the immutable digest, never the mutable vX.Y.Z tag
          # (AG-VAL-026): resolve tag -> digest right before the scan consumes
          # it so the SBOM is bound to the exact released image content.
          digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
          digest="${digest%\"}"
          digest="${digest#\"}"
          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "::error::Could not resolve digest for $image." >&2
            exit 1
          fi
          echo "image-ref=ghcr.io/${REPOSITORY}/${SERVICE}@${digest}" >> "$GITHUB_OUTPUT"

          # What: reads utilities' digest from the released image's own
          #   build-time label via the digest-qualified ref resolved above.
          # Why: utilities:latest can move between builds; the label+digest
          #   keep this bound to what the scan above actually covers (AG-VAL-026).
          # From: Issue #1613 | Issue #1095
          case "$SERVICE" in
            proxy|dhcp|dhcp-proxy|dns|ntp|ui|watchdog)
              released_image="ghcr.io/${REPOSITORY}/${SERVICE}@${digest}"
              ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker pull "$released_image" >/dev/null
              utilities_digest="$(docker image inspect "$released_image" --format '{{ index .Config.Labels "org.opencontainers.image.base.utilities.digest" }}')"
              if [[ ! "$utilities_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::$released_image is missing its build-time utilities base-digest label (org.opencontainers.image.base.utilities.digest)." >&2
                exit 1
              fi
              echo "utilities-image-ref=ghcr.io/${REPOSITORY}/utilities@${utilities_digest}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # "Resolve released image digest" above is the only step in this job
      # that uses the builder set up above -- the Trivy scan and release
      # upload steps below don't touch buildx.
      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Generate CycloneDX SBOM with Trivy
        # Retry + GHCR-first-DB-mirror + authenticated-pull wrapper (issue
        # #1535) around the same pinned trivy-action the scan jobs use, in
        # SBOM mode. Scans the digest-qualified reference resolved above
        # (mirrors build-arm64's "Scan pushed service digest with Trivy"
        # step, which likewise scans a ghcr.io/...@sha256:... reference
        # after the GHCR login). timeout-minutes added (none before): see
        # this job's own timeout-minutes comment above for the worst-case
        # math now that this step can retry up to 4 times.
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          scan-type: image
          image-ref: ${{ steps.digest.outputs.image-ref }}
          format: cyclonedx
          output: ${{ matrix.service }}.cdx.json
          hide-progress: true
          cache: "false"
          timeout: 10m

      - name: Generate utilities image SBOM for component merge
        # Consumer-only: scans the same released utilities digest resolved
        # above so its components can be merged below.
        if: contains(fromJSON('["proxy", "dhcp", "dhcp-proxy", "dns", "ntp", "ui", "watchdog"]'), matrix.service)
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          scan-type: image
          image-ref: ${{ steps.digest.outputs.utilities-image-ref }}
          format: cyclonedx
          output: utilities-for-merge.cdx.json
          hide-progress: true
          cache: "false"
          timeout: 10m

      - name: Merge utilities components into this service's SBOM
        # What: merges only the utilities apk packages this service COPY's.
        # Why: those packages aren't apk-installed here so this image's own
        # scan can't see them; merging the FULL utilities SBOM over-reports.
        # From: Issue #1613 | Issue #1095
        if: contains(fromJSON('["proxy", "dhcp", "dhcp-proxy", "dns", "ntp", "ui", "watchdog"]'), matrix.service)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          asset="${SERVICE}.cdx.json"
          bash scripts/untracked/merge-utilities-sbom-components.sh \
            "$SERVICE" "$asset" utilities-for-merge.cdx.json > "${asset}.merged"
          mv "${asset}.merged" "$asset"

      - name: Attach SBOM to the release
        # Idempotent same-named-asset replace, curl/jq in the tag-scoped
        # build-tools image -- same delivery mechanism as the release job's
        # OpenVEX upload above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          asset="${SERVICE}.cdx.json"
          if [ ! -s "$asset" ]; then
            echo "::error::Trivy did not produce $asset." >&2
            exit 1
          fi

          build_tools_image="ghcr.io/${REPOSITORY}/build-tools:${TAG_NAME}"
          # -i required: same stdin-heredoc shape and gap as the release job's
          # "Create or update GitHub release for built images" / "Attach OpenVEX
          # document to the release" steps. Without -i, docker run never attaches
          # container stdin, so this bash -s heredoc would read immediate EOF and
          # silently upload nothing while still exiting 0.
          docker run --rm -i \
            -e GITHUB_TOKEN \
            -e REPOSITORY \
            -e TAG_NAME \
            -e ASSET_NAME="$asset" \
            -v "$PWD/$asset:/tmp/$asset:ro" \
            "$build_tools_image" \
            timeout --kill-after=30 --signal=KILL 600 \
            bash -s <<'UPLOAD_SBOM'
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          uploads="https://uploads.github.com/repos/${REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"

          release_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/tags/$TAG_NAME" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Could not resolve release id for $TAG_NAME." >&2
            exit 1
          fi

          existing_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/$release_id/assets" | jq -r --arg n "$ASSET_NAME" '.[] | select(.name == $n) | .id')"
          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            curl -fsS -X DELETE -H "$auth" -H "$accept" -H "$version" "$api/releases/assets/$existing_id" >/dev/null
          fi

          curl -fsS -X POST \
            -H "$auth" -H "$accept" -H "$version" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/$ASSET_NAME" \
            "$uploads/releases/$release_id/assets?name=$ASSET_NAME" >/dev/null
          echo "Uploaded $ASSET_NAME to release $TAG_NAME."
          UPLOAD_SBOM

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()

  # What: files/updates/closes a standing issue for a nightly dispatch's
  #   real result -- nightly-refresh.yml only reports its own dispatch
  #   call, never the dispatched run's actual outcome.
  # Why: confirmed live -- nightly sat frozen on a 9-day-old commit while
  #   nightly-refresh.yml reported daily "success" throughout.
  # From: Issue #1095
  report-nightly-status:
    name: report nightly channel status
    if: "always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly'"
    needs: [build, build-arm64, merge-manifests, full-setup-validate, promote]
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: List which needed jobs did not succeed
        id: failed-jobs
        env:
          BUILD: ${{ needs.build.result }}
          BUILD_ARM64: ${{ needs['build-arm64'].result }}
          MERGE_MANIFESTS: ${{ needs['merge-manifests'].result }}
          FULL_SETUP_VALIDATE: ${{ needs['full-setup-validate'].result }}
          PROMOTE: ${{ needs.promote.result }}
        run: |
          set -euo pipefail
          declare -A results=(
            [build]="$BUILD"
            [build-arm64]="$BUILD_ARM64"
            [merge-manifests]="$MERGE_MANIFESTS"
            [full-setup-validate]="$FULL_SETUP_VALIDATE"
            [promote]="$PROMOTE"
          )
          failed=()
          for job in "${!results[@]}"; do
            [[ "${results[$job]}" == "success" ]] || failed+=("$job (${results[$job]})")
          done
          outcome="success"
          [[ ${#failed[@]} -eq 0 ]] || outcome="failure"
          {
            echo "outcome=$outcome"
            echo "list=${failed[*]}"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.failed-jobs.outputs.outcome }}
          scope: nightly channel promote (current_dev)
          failed_jobs: ${{ steps.failed-jobs.outputs.list }}
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}
