      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/ui'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/ui'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: *dtolnay_rust_toolchain_centraliced_versioning # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
