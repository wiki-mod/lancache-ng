  dns_test:
    # DNS unit tests are separate from quality checks so failures identify
    # whether the regression is lint/format level or behavioral.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning (no new commit,
    # so no new behavior to test).
    name: test (dns/nats-subscriber)
    needs: [validate-compose, dns_rust_quality, detect-changes]
    # What: Path-scoped on BOTH pull_request and push; detect-changes now runs on push too (diffing github.event.before..github.sha), so this consults its outputs uniformly instead of the old always-run-on-push short-circuit. Canonical rationale; ui_test/watchdog_test/dns_cargo_audit/ui_cargo_audit/watchdog_cargo_audit's own `if:` comments point back to this one.
    # Why: On a push that did not touch the crate (nor the workflow), the PR that produced that push already ran and passed this exact test (AG-WF-004), so skipping reuses that known-good result; `detect-changes.result != 'success'` fails safe to running when classification is unavailable, and ci_scope_policy tolerates the resulting `skipped` on push while re-deriving strict per-path required-ness on pull_request.
    # From: Issue #1095 | PR #1532
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.dns_rust_quality.result == 'success' || needs.dns_rust_quality.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real warm-cache runs: 26-56s. Same class of risk as dns_rust_quality's
    # clippy step above (this job's own "test" step compiles the crate via
    # the same cargo-with-sccache-fallback path, so an sccache/sccache-dist
    # miss forces the same full local recompile) -- 45 minutes matches
    # dns_rust_quality/ui_rust_quality's bound for that reason, not derived
    # from the fast warm-cache samples alone.
    timeout-minutes: 45
    # What: Job-level concurrency, cancel-in-progress: true -- reclaims a superseded run's lancache-heavy slot; canonical rationale ui_test/dns_cargo_audit/ui_cargo_audit/rust_coverage's own concurrency comments below point back to.
    # Why: Safe because it is one of ci_scope_policy's `needs`, whose push-branch check on this job's result uses require_success_or_intentional_cancellation(); its only other consumer, rust_coverage, already treats a non-success result as a clean skip.
    # From: PR #926
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-dns-test-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-dns-test-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/dns-nats-subscriber'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/dns-nats-subscriber'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: test (dns/nats-subscriber)
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo test --locked --manifest-path services/dns/nats-subscriber/Cargo.toml

  ui_test:
    # UI tests run only when the UI or workflow contract changes. This keeps
    # docs/setup-only PRs from paying for unrelated Rust test work.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning.
    name: test (ui)
    needs: [validate-compose, ui_rust_quality, detect-changes]
    # What: Path-scoped on BOTH pull_request and push, identical to dns_test's own if: above.
    # Why: Same detect-changes/AG-WF-004 known-good-result reuse and ci_scope_policy tolerance as dns_test.
    # From: Issue #1095 | PR #1532
