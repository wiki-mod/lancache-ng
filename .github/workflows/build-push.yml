    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Same reasoning as dns_rust_quality above: this job's own "cargo
    # clippy" step below already carries a 35-minute timeout, so the
    # job-level bound must exceed it. Real warm-cache runs: 50s-3.3min.
