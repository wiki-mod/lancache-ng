        run: |
          bash -n services/watchdog/watchdog.sh
          test -x services/watchdog/watchdog.sh

  dns_cargo_audit:
    # Dependency audits remain crate-specific. They are skipped only when path
    # filtering proves the crate and workflow contract did not change.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning (Cargo.lock is
    # unchanged, so a prior run's audit result already stands).
    name: cargo-audit (dns/nats-subscriber)
    needs: [validate-compose, detect-changes]
    # What: path-scoped same as dns_test; identical if: condition.
    # Why: reuses dns_test's known-good-result/AG-WF-004 tolerance.
    # From: Issue #1095 | PR #1532
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real runs: 10-14s. cargo-audit checks Cargo.lock against the advisory
    # database using a prebuilt binary (AG-KD-003) -- it does not compile
    # the crate, so it does not share dns_test's cold-compile risk. 20
    # minutes covers a slow advisory-database fetch with real headroom.
    timeout-minutes: 20
    # What: job-level concurrency, cancel-in-progress: true -- same
    # pattern as dns_test above.
    # Why: no consumer besides ci_scope_policy, which tolerates cancelled.
    # From: PR #926
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-dns-cargo-audit-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-dns-cargo-audit-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Audit Rust dependencies (dns/nats-subscriber)
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo-home \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 --signal=KILL 900 \
            bash -c 'set -euo pipefail
              audit_log="$(mktemp)"
              trap '"'"'rm -f "$audit_log"'"'"' EXIT
              if ! cargo audit --deny warnings --file Cargo.lock >"$audit_log" 2>&1; then
                cat "$audit_log"
                exit 1
              fi
              cat "$audit_log"
              if grep -Eiq '"'"'(^|[[:space:]])warning:'"'"' "$audit_log"; then
                echo "::error::cargo-audit emitted warnings."
                exit 1
              fi'

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
