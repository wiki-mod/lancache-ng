  rust_coverage:
    # What: content-gated only; no event-type skip clause here.
    # Why: a skip here overwrites a branch-protection result.
    # From: Issue #1095 | PR #1718
    name: coverage (Rust)
    needs: [validate-compose, dns_test, ui_test, detect-changes]
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.dns_test.result == 'success' || needs.dns_test.result == 'skipped') &&
        (needs.ui_test.result == 'success' || needs.ui_test.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.ui == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real warm-cache runs: 1.3-6.6min. 60 minutes rather than a tighter
    # multiple of that: cargo-tarpaulin instruments and recompiles both
    # crates for coverage (its own build path, separate from the
    # sccache-fallback compiles elsewhere in this file), and this job can
    # also fall back to a branch-local build-tools image rebuild (see the
    # step comment below) when a PR's own Dockerfile change hasn't been
    # published yet -- neither cold path is represented by the samples above.
    timeout-minutes: 60
    # What: job-level concurrency, cancel-in-progress: true.
    # Why: same scarce pool as dns_test/build/container-scan.
    # From: PR #915
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-rust-coverage-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-rust-coverage-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - uses: *checkout_centraliced_versioning # v7.0.1
      # This job resolves its own build-tools image rather than reusing validate-compose's
      # exported build_tools_image output. That output is deliberately locked to the
      # published, digest-qualified image (never a branch-local fallback) because
      # dns_cargo_audit/ui_cargo_audit need a reproducible, previously-audited image.
      # Coverage measurement has no such reproducibility requirement, so it can accept a
      # branch-local rebuild when a PR's own Dockerfile change (like adding tarpaulin) has
      # not been published to ghcr.io yet.
      - name: Resolve build-tools image (with tarpaulin required)
        env:
          EXTRA_REQUIRED_TOOLS: "cargo-tarpaulin bc"
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          image="$(bash scripts/untracked/select-build-tools-image.sh)"
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      # Coverage output must land on a writable host path: the repo checkout
      # itself is bind-mounted read-only into the build-tools container below,
      # matching the dns_cargo_audit/ui_cargo_audit pattern.
      - name: Prepare writable coverage output directories
        run: |
          set -euo pipefail
          mkdir -p coverage-dns coverage-ui
      - name: Run coverage (dns/nats-subscriber)
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target-dns \
            -v "$PWD:/work" \
            -v "$PWD/coverage-dns:/coverage-dns" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 --signal=KILL 1800 \
            bash -c 'set -euo pipefail
              cargo tarpaulin \
                --engine llvm \
                --manifest-path services/dns/nats-subscriber/Cargo.toml \
                --locked \
                --timeout 300 \
                --out json \
                --output-dir /coverage-dns'
      - name: Run coverage (ui)
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target-ui \
            -v "$PWD:/work" \
            -v "$PWD/coverage-ui:/coverage-ui" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 --signal=KILL 1800 \
            bash -c 'set -euo pipefail
              cargo tarpaulin \
                --engine llvm \
                --manifest-path services/ui/Cargo.toml \
                --locked \
                --timeout 300 \
                --out json \
                --output-dir /coverage-ui'
      - name: Merge coverage reports and check threshold
        id: coverage
        run: |
          set -euo pipefail

          mkdir -p coverage-badge
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work:ro" \
            -v "$PWD/coverage-badge:/coverage-badge" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            timeout --kill-after=30 --signal=KILL 300 \
            bash -c 'set -euo pipefail

              # Extract coverage percentages from JSON reports inside the
              # selected build-tools image, not from incidental host binaries.
              dns_coverage=$(jq -r ".coverage" coverage-dns/tarpaulin-report.json 2>/dev/null || echo "0")
              ui_coverage=$(jq -r ".coverage" coverage-ui/tarpaulin-report.json 2>/dev/null || echo "0")

              echo "DNS coverage: ${dns_coverage}%"
              echo "UI coverage: ${ui_coverage}%"

              # What: per-crate thresholds (ui/dns), not a shared minimum.
              # Why: the nats-subscriber async loop is covered by
              # full-setup integration, not unit tests.
              # From: Issue #1095 | PR #1619
              ui_threshold=35
              dns_threshold=0

              echo "UI threshold: ${ui_threshold}%"
              echo "DNS threshold: ${dns_threshold}% (floor not raised since #504 closed; async loop covered by full-setup integration)"

              failed=0
              if (( $(echo "$ui_coverage < $ui_threshold" | bc -l) )); then
                echo "::error::UI coverage ${ui_coverage}% is below threshold of ${ui_threshold}%"
                failed=1
              fi
              if (( $(echo "$dns_coverage < $dns_threshold" | bc -l) )); then
                echo "::error::DNS coverage ${dns_coverage}% is below threshold of ${dns_threshold}%"
                failed=1
              fi

              if [[ "$failed" -eq 1 ]]; then
                exit 1
              fi

              # What: badge generation reuses this containerized jq.
              # Why: matches why coverage extraction above runs in here too.
              # From: Issue #1095 | PR #1619
              ui_coverage_display="$(printf "%.2f" "$ui_coverage")"
              dns_coverage_display="$(printf "%.2f" "$dns_coverage")"
              badge_message="ui ${ui_coverage_display}% / dns ${dns_coverage_display}%"
              badge_color=yellow
              if awk -v ui="$ui_coverage" -v dns="$dns_coverage" "BEGIN { exit !(ui >= 80 && dns >= 80) }"; then
                badge_color=brightgreen
              fi

              jq -n \
                --arg message "$badge_message" \
                --arg color "$badge_color" \
                "{schemaVersion: 1, label: \"rust coverage\", message: \$message, color: \$color}" \
                > /coverage-badge/rust.json

              {
                printf "ui=%s\n" "$ui_coverage_display"
                printf "dns=%s\n" "$dns_coverage_display"
                printf "message=%s\n" "$badge_message"
              } > /coverage-badge/output.env

              echo "Coverage check passed"'

          cat coverage-badge/output.env >> "$GITHUB_OUTPUT"
      - name: Upload coverage reports
        if: always()
        uses: &actions_upload_artifact_centraliced_versioning actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-reports
          path: |
            coverage-dns/tarpaulin-report.json
            coverage-ui/tarpaulin-report.json
          retention-days: 30
      # The badge JSON is handed off as an artifact rather than pushed from this
      # job directly: this job runs on every trigger including same-repo pull_request
      # runs that execute PR-controlled test code (cargo tarpaulin), and a job-level
      # `permissions: contents: write` would apply to that untrusted code too --
      # GitHub Actions has no step-level permissions to scope the write down to just
      # the publish step. publish_coverage_badge below is the only job with write
      # access, and it only ever runs on trusted push events.
      - name: Upload coverage badge data
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: *actions_upload_artifact_centraliced_versioning # v7.0.1
        with:
          name: rust-coverage-badge
          path: coverage-badge/rust.json
          retention-days: 1

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  publish_coverage_badge:
    # Split out of rust_coverage (see the comment on its "Upload coverage badge data"
    # step) so the contents:write token this job needs is never present during the
    # coverage measurement steps that execute PR-controlled code.
    #
    # `if:` must start with an explicit status-check function, not a bare
    # `needs.rust_coverage.result == ...` -- same trap documented on promote's `if:`
    # below. A bare condition gets an implicit `&& success()` appended by GitHub Actions,
    # and that success() walks the WHOLE transitive needs graph, not just this job's own
    # direct `needs: rust_coverage`. Confirmed live: this job skipped on the actual push
    # that merged it (run 29184177783) because of exactly this.
    name: publish rust coverage badge
    needs: rust_coverage
    if: "!cancelled() && needs.rust_coverage.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')"
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 10-12s. Same 15-minute floor as detect-changes above.
    timeout-minutes: 15
    # What: job-level concurrency, keyed per source ref.
    # Why: full queueing/racing reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    concurrency:
      group: ${{ github.workflow }}-badge-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1
      - name: Download coverage badge data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (v4.3.0 still declared deprecated Node 20 runtime, see #802)
        with:
          name: rust-coverage-badge
          path: coverage-badge
      - name: Publish Rust coverage badge endpoint
        # BADGE_FILE is scoped per source branch (not one shared coverage/rust.json)
        # so pushes to master and to the active vX.Y.Z integration branch don't
        # overwrite each other's badge data -- this job's own concurrency group
        # (above) is per-ref, so it only serializes writes for the SAME branch;
        # the retry loop below is what protects the shared `badges` branch
        # itself from two DIFFERENT branches' publishes racing each other.
        env:
          BADGE_BRANCH: badges
          BADGE_FILE: coverage/rust-${{ github.ref_name }}.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to publish the coverage badge endpoint}"
          : "${BADGE_BRANCH:?BADGE_BRANCH is required}"
          : "${BADGE_FILE:?BADGE_FILE is required}"

          # What: debounce -- skips as a no-op if a newer commit landed.
          # Why: a queued older run must not overwrite with stale coverage.
          # From: Issue #1095 | PR #1619
          current_tip="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [[ -z "$current_tip" ]]; then
            echo "::error::Could not resolve the current tip of ${GITHUB_REF} via git ls-remote; refusing to publish the coverage badge blind."
            exit 1
          fi
          if [[ "$current_tip" != "$GITHUB_SHA" ]]; then
            echo "::notice::${GITHUB_REF} has already moved to ${current_tip} since this run was triggered for ${GITHUB_SHA}; skipping badge publish so the run already targeting the current tip publishes instead."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cp coverage-badge/rust.json "$tmp_dir/rust.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry loop, not a single fetch/commit/push: the concurrency group above is per-ref,
          # so it only prevents two publishes for the SAME branch from racing each other -- it
          # does nothing for a DIFFERENT branch's publish landing on the shared `badges` branch
          # between this attempt's fetch and its own push (previously a single plain `git push`,
          # no retry/rebase, would just fail non-fast-forward in that case). Re-fetching and
          # rebuilding the commit on the fresh tip each attempt makes that self-healing instead
          # of a hard failure, without needing a single global group that would let unrelated
          # branches bump each other out of the queue.
          max_attempts=5
          attempt=1
          while :; do
            # Explicit destination refspec, not just "origin $BADGE_BRANCH": actions/checkout's
            # sparse fetch config only tracks the ref it originally checked out, so fetching a
            # different branch by name alone lands only in FETCH_HEAD, never in
            # refs/remotes/origin/$BADGE_BRANCH -- the show-ref check below would then always
            # report "not found" and take the orphan-branch path even when badges already exists,
            # and the final push would be rejected as non-fast-forward.
            git fetch origin "$BADGE_BRANCH:refs/remotes/origin/$BADGE_BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$BADGE_BRANCH"; then
              # -C (not --create): this is a self-hosted runner, so a local badges branch left
              # over from a previous job on the same workspace makes a plain --create fail with
              # "a branch named 'badges' already exists". -C resets it to origin's tip instead,
              # discarding any local commit left over from a previous failed attempt below.
              git switch -C "$BADGE_BRANCH" "origin/$BADGE_BRANCH"
            else
              git switch --orphan "$BADGE_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            fi

            mkdir -p "$(dirname "$BADGE_FILE")"
            cp "$tmp_dir/rust.json" "$BADGE_FILE"
            git add "$BADGE_FILE"

            if git diff --cached --quiet; then
              echo "::notice::Rust coverage badge endpoint already up to date."
              exit 0
            fi

            git commit -m "chore: update rust coverage badge"
            if git push origin "$BADGE_BRANCH"; then
              break
            fi

            if (( attempt >= max_attempts )); then
              echo "::error::Failed to push the coverage badge endpoint to ${BADGE_BRANCH} after ${max_attempts} attempts (non-fast-forward every time)."
              exit 1
            fi
            echo "::notice::Push to ${BADGE_BRANCH} was rejected, likely by a concurrent publish for another branch -- refetching and retrying (attempt $((attempt + 1))/${max_attempts})."
            attempt=$((attempt + 1))
          done

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  watchdog_test:
    # What: covers watchdog.sh's syntax gate plus a real cargo test.
    # Why: full reasoning (tier/tolerance change) on the linked issue.
    # From: Issue #1095 | PR #1532
    name: test (watchdog)
    needs: [validate-compose, watchdog_rust_quality, detect-changes]
    # What: path-scoped like dns_test/ui_test.
    # Why: full reasoning on the linked issue.
    # From: Issue #1095 | PR #1532
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.watchdog_rust_quality.result == 'success' || needs.watchdog_rust_quality.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.watchdog == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # What: 45-minute timeout, same value as dns_test/ui_test above.
    # Why: compiles via the same cargo-with-sccache-fallback path, sharing
    # their cold-compile risk.
    # From: Issue #1095 | PR #1532
    timeout-minutes: 45
    # What: job-level concurrency mirroring dns_test/ui_test's own group.
    # Why: real compile work on the scarce lancache-heavy pool now, so a
    # superseded run should be reclaimed like those two already are.
    # From: Issue #1095 | PR #1532
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-watchdog-test-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-watchdog-test-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: test (watchdog shell script)
        run: |
          bash -n services/watchdog/watchdog.sh
          test -x services/watchdog/watchdog.sh
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/watchdog'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/watchdog'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: *dtolnay_rust_toolchain_centraliced_versioning # stable
        with:
          toolchain: stable
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: test (watchdog Rust crate)
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo test --locked --manifest-path services/watchdog/Cargo.toml

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  watchdog_test-hosted:
    # What: GitHub-hosted fallback for the shell-script check only.
    # Why: full reasoning (no hosted Rust equivalent) on the linked issue.
    # From: Issue #1095 | PR #1532
    name: test (watchdog) (GitHub-hosted fallback)
    runs-on: ubuntu-latest
    # Real runs: 3-5s. Same 15-minute floor as detect-changes above.
    timeout-minutes: 15
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: GitHub-hosted fallback notice
        run: |
          echo "::notice::Running watchdog syntax check on GitHub-hosted runner as fallback for non-LAN-dependent linting."
