      - name: Remove fallback compose validation image
        if: always()
        run: |
          set -euo pipefail

          case "${BUILD_TOOLS_IMAGE:-}" in
            lancache-ng-build-tools-validation:*)
              docker rmi "$BUILD_TOOLS_IMAGE"
              ;;
          esac

  # A fixed validation subnet collided repeatedly across different, concurrent workflow
  # runs sharing one of the 3 physical self-hosted runner hosts (#623) -- `needs:` only
  # serializes jobs within one run. Deriving the subnet from this run's own id/attempt
  # gives every run its own subnet, so two runs on the same host (almost) never collide.
  #
  # Deliberately unconditional (no `needs`/`if` gating on detect-changes): detect-changes
  # itself only runs on pull_request, so on push it is skipped -- and a job that `needs`
  # a skipped job is itself skipped by default. full-setup-validate below uses
  # `always()` to tolerate its own skipped/failed `needs`, so gating this job the same
  # way would make it skip on every push while full-setup-validate still ran, silently
  # falling back to the old fixed subnet on every master merge -- exactly the bug this
  # fixes. Running unconditionally costs a few seconds on the rare PR that doesn't touch
  # deploy/ or the CI contract, far cheaper than that.
  compute-validation-network:
    name: derive per-run validation subnet
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 7-9s. Same 15-minute floor as detect-changes above.
    timeout-minutes: 15
    outputs:
      subnet: ${{ steps.derive.outputs.subnet }}
      gateway: ${{ steps.derive.outputs.gateway }}
      proxy_ip: ${{ steps.derive.outputs.proxy_ip }}
      proxy_ssl_ip: ${{ steps.derive.outputs.proxy_ssl_ip }}
      dns_standard_ip: ${{ steps.derive.outputs.dns_standard_ip }}
      dns_ssl_ip: ${{ steps.derive.outputs.dns_ssl_ip }}
      watchdog_ip: ${{ steps.derive.outputs.watchdog_ip }}
      netdata_ip: ${{ steps.derive.outputs.netdata_ip }}
      nats_ip: ${{ steps.derive.outputs.nats_ip }}
      ui_ip: ${{ steps.derive.outputs.ui_ip }}
      project_name: ${{ steps.derive.outputs.project_name }}
      ui_port: ${{ steps.derive.outputs.ui_port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive validation network
        id: derive
        uses: ./.github/actions/derive-validation-network

  full-setup-validate:
    name: validate full-setup image
    # On a pull_request event, `promote` never runs at all -- there is no channel image
    # for THIS PR to wait for. Instead this job waits directly for `merge-manifests`,
    # because (see #626) that job is where a same-repo PR's per-arch staging legs get
    # combined into the real pr-<N>-sha-<short> multi-platform tag this job actually
    # pulls. This job MUST NOT start before merge-manifests finishes: build/build-arm64
    # wait on several lighter jobs and then compile Rust, so they (and merge-manifests
    # after them) are much slower than the lightweight `detect-changes` job this used to
    # depend on alone -- depending on only detect-changes let this job race ahead, find no
    # staging tags yet, and silently fall back to stale base-channel content, reproducing
    # #626's exact bug. On push events, this job still waits for `promote` so it validates
    # the freshly-promoted channel state instead of racing ahead of it or checking a stale
    # channel tag.
    needs: [detect-changes, merge-manifests, compute-validation-network]
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'pull_request' && needs['merge-manifests'].result == 'success') ||
          (github.event_name != 'pull_request' && needs['merge-manifests'].result == 'success')
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.deploy == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 30-71s (pulls the just-published multi-platform image set,
    # brings the full stack up via docker compose, smoke-tests it, tears it
    # down). 30 minutes, not the 15-minute lint-job floor, because this job
    # depends on a real docker-compose stack startup (image pulls, container
    # health checks) whose cold-cache worst case is not represented by these
    # warm-cache samples.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # scripts/lib/staging-ancestor-fallback.sh's shared ancestor-fallback recovery path
      # (sourced by the "Ensure PR staging tags exist for full-setup services" step below)
      # reads build-push.yml's own past runs from
      # `/repos/{repo}/actions/workflows/build-push.yml/runs` -- via plain `curl` +
      # `GH_TOKEN`, never the `gh` CLI (AG-CI-001: `gh` must not be assumed present on a
      # bare `lancache-light` runner), but the REST endpoint requires this scope either way.
      actions: read
    # None of VALIDATION_SUBNET/GATEWAY/*_IP, COMPOSE_PROJECT_NAME, or VALIDATION_UI_PORT
    # are set here from compute-validation-network's outputs (unlike
    # LANCACHE_IMAGE_REGISTRY/PREFIX/TAG below, which stay per-step since they don't
    # participate in this at all). This job used to set all of them as fixed job-level
    # env, then run the same check-then-create pattern
    # full-setup-validate.yml itself had before issue #703's linked run confirmed for real:
    # two genuinely concurrent runs on the same self-hosted host can derive the identical
    # slot from compute-validation-network's hash-only derivation, both pass the old
    # `docker network ls`-based pre-flight check (which only catches a leftover network
    # from a PREVIOUS run, not another run mid-check), and then race the kernel to create
    # the bridge, with only one winning. This job hits this race under real concurrency
    # more often than full-setup-validate.yml (workflow_dispatch-only) does.
    #
    # This job now uses the exact same host-local flock reservation
    # (scripts/lib/reserve-validation-subnet.sh) and retry-on-collision loop
    # full-setup-validate.yml's own step uses -- see that step's comment for the full
    # mechanism. A job-level `env:` entry is re-applied on top of every step's
    # accumulated $GITHUB_ENV state, so a fixed entry here would always win in every later
    # step, silently overriding whatever a retry inside that step writes -- exactly why
    # none of these are set here.
    steps:
      # #808: fetch-depth: 0 (not the default shallow depth-1 clone) so the
      # "Ensure PR staging tags exist for full-setup services" step below can
      # prove real git ancestry (`git merge-base --is-ancestor`) between this
      # PR's base.sha and a base-channel image's build-commit label. Same
      # requirement, and same fix, as the `detect-changes` job's own
      # fetch-depth: 0 checkout (needed for its own merge-base-based diff).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `latest` is contractually a stable-release-only channel (see
      # docs/release-versioning.md) -- it is never moved by a v0.2.0 (or any other
      # pre-release integration branch) push, so it always reflects the last real release,
      # not this branch's current code. Validating a pre-release branch against `latest`
      # therefore checks the wrong image for the wrong reason. Mirror the same ref-to-channel
      # mapping the `promote` job uses so this job validates the channel this branch
      # actually publishes to.
      #
      # On a pull_request event this now resolves to the PR's OWN staging tag (see #626)
      # instead of the base-ref channel, so this job actually tests the PR's own commits --
      # UNLESS this is a Dependabot PR or a fork PR: those get a read-only GITHUB_TOKEN, so
      # build/build-arm64 never push anything for them and there is no PR staging tag to
      # validate against. pr-staging-available captures that so every later step can gate
      # off one flag instead of re-deriving it. base_channel_tag is always computed: it is
      # the resolved tag itself when staging isn't available, and the fallback source for any
      # full-setup service an eligible PR did not touch either way.
      - name: Determine validation image channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # github.sha, NOT github.event.pull_request.head.sha: for a pull_request event this
          # is the synthetic merge commit actually checked out and built, and -- critically --
          # it changes whenever that merge result changes even if the PR's own head commit does
          # not (e.g. a "reopened" event after the base branch moved while the PR was closed).
          # Keying the tag on the PR head SHA alone let two events for the identical head, merged
          # against two different base states, collide on one tag and let whichever push landed
          # last silently overwrite the other's image content.
          BUILD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Calls scripts/lib/validation-image-tag.sh's own functions instead of reimplementing
          # the same channel/pr-staging-available/tag decisions inline a second time (issue #822
          # pattern audit, 2026-07-17: that file's own header used to document this job as
          # "deliberately left untouched... keep the two in sync by hand", exactly the
          # no-guard-against-drift shape #822 exists to catch). This job already sources other
          # scripts/lib/*.sh files below (ghcr-retry.sh, staging-image-freshness.sh), so this is
          # not a new pattern for it.
          # shellcheck source=scripts/lib/validation-image-tag.sh
          source "$GITHUB_WORKSPACE/scripts/lib/validation-image-tag.sh"

          base_channel_tag="$(vit_base_channel_tag "$BASE_REF")"
          echo "base-channel-tag=$base_channel_tag" >> "$GITHUB_OUTPUT"

          pr_staging_available="$(vit_pr_staging_available "$EVENT_NAME" "$ACTOR" "$HEAD_REPO" "$REPOSITORY")"
          echo "pr-staging-available=$pr_staging_available" >> "$GITHUB_OUTPUT"

          # vit_resolve_tag's workflow_dispatch branch never applies here --
          # this job only ever runs from push/pull_request -- so the empty
          # dispatch_tag argument is never read.
          tag="$(vit_resolve_tag "$EVENT_NAME" "$BASE_REF" "$PR_NUMBER" "$BUILD_SHA" "$ACTOR" "$HEAD_REPO" "$REPOSITORY" "")"

          # CI 1.1: a trusted push validates the immutable commit candidate
          # before public promotion. PRs keep their unique staging tag and
          # immediately pin every service behind it to a digest below.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            tag="sha-${BUILD_SHA::7}"
            echo "Validating pre-promotion candidate set '$tag'."
          fi

          if [[ "$pr_staging_available" == "true" ]]; then
            # #1254/#1255: any untouched service is backfilled from this PR's
            # own base commit's per-commit sha-* image in the next step
            # ("Ensure PR staging tags exist for full-setup services"), not
            # from base_channel_tag -- that variable is computed above only
            # for the pr_staging_available == false branch's whole-suite
            # fallback below, and is otherwise unused by this step.
            echo "Validating against this PR's own staging tag '$tag' (built commit $BUILD_SHA, PR head $PR_HEAD_SHA; untouched services are backfilled from this PR's own base commit's per-commit image, see the next step)."
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "::notice::$ACTOR's pull_request runs get a read-only GITHUB_TOKEN (Dependabot, or a fork PR), so build/build-arm64 could not push a PR staging tag. Validating against the '$tag' base channel instead -- the same behavior this job always had before #626."
            fi
            echo "Validating against the '$tag' channel (base ref: $BASE_REF)."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # deploy/full-setup/docker-compose.yml uses one LANCACHE_IMAGE_TAG for every service,
      # and the "Run client simulation" step below pulls build-tools at that same tag --
      # but build/build-arm64 only push the PR staging tag for services detect-changes says
      # this PR actually touched (deliberate additional push cost -- see #626 -- not
      # "rebuild everything per PR for free"). Any untouched service has no image at the
      # staging tag yet, so back-fill it with a cheap registry-side copy from the base-ref
      # channel image (the correct thing to validate for an untouched service anyway). This
      # mirrors the `promote`/`merge-manifests` jobs' own `docker buildx imagetools create`
      # pattern for moving/combining tags without re-pulling image layers.
      #
      # Gated on pr-staging-available, not a bare `github.event_name == 'pull_request'`: a
      # Dependabot/fork PR has no PR staging tag for ANY service, so
      # steps.channel.outputs.tag already equals base_channel_tag above -- there is nothing
      # to back-fill, and attempting to log in/push here with that PR's read-only
      # GITHUB_TOKEN would just fail instead of skipping cleanly.

      - name: Set up Docker Buildx
        if: steps.channel.outputs.pr-staging-available == 'true'
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: steps.channel.outputs.pr-staging-available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A service detect-changes says THIS PR touched (or any service other than
      # build-tools, if the PR changed a workflow/CI-contract file -- mirrors build/
      # build-arm64's own should-build override) must already have a staging image by the
      # time this runs: full-setup-validate now waits for merge-manifests specifically so
      # that's true. If it's missing anyway -- build/build-arm64 actually failed to push it,
      # or imagetools inspect hit a transient registry error -- silently copying the PR base
      # commit's own per-commit image into that service's PR tag would make this job green
      # while testing exactly the stale image #626 exists to stop testing, just now hidden
      # behind a tag name that LOOKS PR-specific. Fail loudly instead; only a genuinely
      # untouched service gets the base-commit back-fill (#1254/#1255: sourced from the PR
      # base commit's own durable sha-<short> tag, not a mutable channel).
      - name: Ensure PR staging tags exist for full-setup services
        if: steps.channel.outputs.pr-staging-available == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          PR_TAG: ${{ steps.channel.outputs.tag }}
          # #808/#1254/#1255: this PR's own base commit. Needed both to prove the back-fill
          # source image was actually built from it (or later) before backfilling an untouched
          # service, AND (since #1254/#1255) to derive that source image's own tag directly
          # (sha-<short of this>) -- no separate BASE_CHANNEL_TAG input is used anymore. Always
          # present here: this step only runs when pr-staging-available is true, which requires
          # a pull_request event.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_CHANGED: ${{ needs['detect-changes'].outputs.workflow }}
          PROXY_TOUCHED: ${{ needs['detect-changes'].outputs.proxy }}
          DNS_TOUCHED: ${{ needs['detect-changes'].outputs.dns_image }}
          WATCHDOG_TOUCHED: ${{ needs['detect-changes'].outputs.watchdog }}
          UI_TOUCHED: ${{ needs['detect-changes'].outputs.ui }}
          BUILD_TOOLS_TOUCHED: ${{ needs['detect-changes'].outputs.build_tools }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # scripts/lib/staging-ancestor-fallback.sh's saf_base_commit_has_confirmed_run()
          # reads it straight from the environment (never as an argv parameter,
          # so it cannot leak into ghcr_retry's own diagnostics) to authenticate
          # its `curl` query against the Actions REST API. Not the `gh` CLI --
          # see that file's own saf_query_run_count() header for the AG-CI-001
          # reasoning behind talking to the API directly.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/staging-image-freshness.sh
          source "$GITHUB_WORKSPACE/scripts/lib/staging-image-freshness.sh"
          # shellcheck source=scripts/lib/staging-ancestor-fallback.sh
          source "$GITHUB_WORKSPACE/scripts/lib/staging-ancestor-fallback.sh"
          # shellcheck source=scripts/lib/validation-image-tag.sh
          source "$GITHUB_WORKSPACE/scripts/lib/validation-image-tag.sh"

          : "${BASE_SHA:?BASE_SHA (github.event.pull_request.base.sha) is required}"

          # Calls vit_service_should_have_staging_tag directly instead of
          # reimplementing the same "workflow/CI-contract change forces
          # every service except build-tools to be treated as touched"
          # override inline a second time (issue #822 pattern audit,
          # 2026-07-17) -- see this step's earlier "Determine validation
          # image channel"-sourced functions for the matching fix to the
          # other two decisions this job used to duplicate.
          service_should_have_staging_tag() {
            vit_service_should_have_staging_tag "$1" "$2" "$WORKFLOW_CHANGED"
          }

          declare -A touched_map=(
            [proxy]="$PROXY_TOUCHED"
            [dns]="$DNS_TOUCHED"
            [watchdog]="$WATCHDOG_TOUCHED"
            [ui]="$UI_TOUCHED"
            [build-tools]="$BUILD_TOOLS_TOUCHED"
          )

          # Maps this step's own matrix-service names to
          # scripts/classify-image-impact.sh's output keys, for
          # saf_resolve_untouched_backfill_source's service-scoped check
          # below -- see scripts/ensure-pr-staging-images.sh's own
          # classify_key_map for the full reasoning.
          declare -A classify_key_map=(
            [proxy]="proxy"
            [dns]="dns_image"
            [watchdog]="watchdog"
            [ui]="ui"
            [build-tools]="build_tools"
          )

          # The services deploy/full-setup/docker-compose.yml references, plus build-tools
          # (used by the client-simulation step further down, not by the compose file itself).
          # dhcp and dhcp-proxy are part of neither and are intentionally excluded.
          #
          # Decide touched-or-not FIRST, before looking at whether a pr_image already exists. A
          # prior run of this exact PR head (a manual re-run, or this job running twice for the
          # same commit) may already have back-filled an untouched service's tag from this PR's
          # base commit image. That source is pinned to one fixed commit (or its nearest built
          # ancestor -- see scripts/lib/staging-ancestor-fallback.sh) rather than a moving
          # channel, so re-pointing it every run is no longer about chasing a channel that
          # "moved since" -- it is still done unconditionally anyway, both for defense-in-depth
          # and because `imagetools create` is a cheap registry-side manifest write, not a
          # rebuild, so refreshing it costs nothing worth optimizing away.
          full_setup_services=(proxy dns watchdog ui build-tools)

          for service in "${full_setup_services[@]}"; do
            pr_image="ghcr.io/${REPOSITORY}/${service}:${PR_TAG}"
            should_exist="$(service_should_have_staging_tag "$service" "${touched_map[$service]}")"

            if [[ "$should_exist" == "true" ]]; then
              # Wrapped in ghcr_retry: unlike merge-manifests' per-arch
              # probes, a missing tag here is always a real error (this job
              # runs after merge-manifests, so a touched service's PR staging
              # tag is expected to already exist) -- retrying protects
              # against a transient 401 being misreported as "never pushed".
              if ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$pr_image" >/dev/null 2>&1; then
                echo "::notice::$service already has a staging image at $PR_TAG (this PR touched it)."
                continue
              fi
              echo "::error::$service's PR staging tag ($pr_image) is missing even though detect-changes says this PR touched it (or a workflow/CI-contract file changed). Refusing to fall back to the PR base commit's content for a touched service -- that would silently reintroduce #626's bug behind a tag name that looks PR-specific. Check whether build/build-arm64 actually pushed $service successfully for this commit."
              exit 1
            fi

            # #808: never back-fill without first proving the source image was actually built
            # from base.sha or later -- see scripts/lib/staging-image-freshness.sh for the
            # mechanism, and scripts/lib/staging-ancestor-fallback.sh for the full resolution
            # sequence (exact-BASE_SHA wait, then the ancestor fallback when that wait genuinely
            # cannot succeed) this step now shares with scripts/ensure-pr-staging-images.sh
            # instead of carrying an independent copy of the same logic. 900/1200 (BASE_SHA's own
            # wait), 300/600 (ancestor-candidate checks) and the "50" search depth intentionally
            # match that script's own BASE_FRESHNESS_POLL_*/ANCESTOR_FRESHNESS_POLL_*/
            # STAGING_ANCESTOR_SEARCH_DEPTH defaults exactly (1200s: maintainer-directed
            # reduction from the previous 5400s, 2026-08-02) -- see
            # saf_resolve_untouched_backfill_source's own header for why these are separate
            # budgets, not one shared pair, and keep them in sync by hand if those defaults ever
            # change, same as the rest of this step's touched-vs-untouched logic already must be.
            if ! resolved_source="$(saf_resolve_untouched_backfill_source "$REPOSITORY" "$service" "${classify_key_map[$service]}" "$BASE_SHA" \
              900 1200 \
              300 600 \
              0 0 15 50 "$GITHUB_WORKSPACE")"; then
              exit 1
            fi
            echo "::notice::(re)pointing $PR_TAG at $resolved_source."
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create --prefer-index=false -t "$pr_image" "$resolved_source"
          done

      # This is the last step in the job that uses the builder set up above --
      # "Build full-setup validation image" below is a plain `docker build`,
      # not buildx. Same `pr-staging-available` gate as the setup step itself,
      # since there is nothing to remove when that step never ran.

      - name: Pin full-setup service identities to immutable digests
        id: pin-full-setup-digests
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.channel.outputs.tag }}
          PROXY_DIGEST: ${{ needs['merge-manifests'].outputs.proxy_digest }}
          DNS_DIGEST: ${{ needs['merge-manifests'].outputs.dns_digest }}
          WATCHDOG_DIGEST: ${{ needs['merge-manifests'].outputs.watchdog_digest }}
          UI_DIGEST: ${{ needs['merge-manifests'].outputs.ui_digest }}
          BUILD_TOOLS_DIGEST: ${{ needs['merge-manifests'].outputs.build_tools_digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          override_file=".ci-exact-digests.yml"
          client_tools_ref="$(bash scripts/render-full-setup-digest-override.sh "deploy/full-setup/${override_file}")"
          printf 'FULL_SETUP_COMPOSE_OVERRIDE=%s\n' "$override_file" >> "$GITHUB_ENV"
          printf 'FULL_SETUP_CLIENT_TOOLS_IMAGE=%s\n' "$client_tools_ref" >> "$GITHUB_ENV"
      - name: Remove buildx builder
        if: ${{ always() && steps.channel.outputs.pr-staging-available == 'true' }}
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Build full-setup validation image
        env:
          IMAGE_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg LANCACHE_IMAGE_REGISTRY=ghcr.io \
            --build-arg LANCACHE_IMAGE_PREFIX=wiki-mod/lancache-ng \
            --build-arg LANCACHE_IMAGE_TAG="$IMAGE_TAG" \
            -t lancache-ng-full-setup:validation \
            deploy/full-setup

      - name: Validate compose configuration
        env:
          LANCACHE_IMAGE_REGISTRY: ghcr.io
          LANCACHE_IMAGE_PREFIX: wiki-mod/lancache-ng
          LANCACHE_IMAGE_TAG: ${{ steps.channel.outputs.tag }}
          FULL_SETUP_COMPOSE_OVERRIDE: ${{ env.FULL_SETUP_COMPOSE_OVERRIDE }}
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD/deploy/full-setup:/validation:ro" \
            -w /validation \
            --env LANCACHE_IMAGE_REGISTRY \
            --env LANCACHE_IMAGE_PREFIX \
            --env LANCACHE_IMAGE_TAG \
            docker:latest \
            docker compose -f docker-compose.yml -f "${FULL_SETUP_COMPOSE_OVERRIDE:?FULL_SETUP_COMPOSE_OVERRIDE is required}" config >/dev/null

      # VALIDATION_SUBNET (and the matching VALIDATION_*_IP/VALIDATION_GATEWAY vars) starts
      # from the candidate compute-validation-network derived per-run (#623), but that job's
      # hash derivation alone has an unlocked check-then-create race between two genuinely
      # concurrent workflow runs on the same self-hosted host (#703): two runs could derive
      # the same slot, both pass a `docker network ls`-based pre-flight check (only catches
      # a leftover network, not another run mid-check), and race the kernel to create the
      # bridge, with only one winning.
      #
      # This step closes that gap with the same host-local `flock` idiom this project
      # already uses for another shared-per-host resource (build-tools.yml's own Buildx
      # cache lock), via scripts/lib/reserve-validation-subnet.sh -- the exact same helper
      # and retry-on-collision loop full-setup-validate.yml's own step uses (see that step's
      # comment for the full mechanism, including why COMPOSE_PROJECT_NAME/
      # VALIDATION_UI_PORT are rederived here too, not just the subnet). Static config
      # validation above only checks YAML/Compose structure -- a successful `docker compose
      # up` here does not yet mean the stack is healthy (see "Wait for the stack to
      # stabilize" below: #450/#485, dnsmasq trying to bind an already-used port).

      - name: Reserve a validation subnet and start the stack (locked, retries on collision)
        uses: ./.github/actions/reserve-validation-subnet-stack
        with:
          image-tag: ${{ steps.channel.outputs.tag }}
          compose-override-file: ${{ env.FULL_SETUP_COMPOSE_OVERRIDE }}
          ghcr-retry-username: ${{ github.actor }}
          ghcr-retry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the stack to stabilize and check container health
        uses: ./.github/actions/wait-validation-stack-health

      # Unlike the failure-only log dump above, this always runs -- #626's
      # whole point is that a *green* run here must be verifiable as having
      # actually tested this commit's own code (not stale base-branch
      # content), and that's only checkable if the logs are visible
      # regardless of outcome.
      - name: Show full-setup service logs
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          echo "::group::Logs from all services"
          docker compose logs --no-color || true
          echo "::endgroup::"

      - name: Run client simulation against the full-setup stack
        run: |
          set -euo pipefail
          scripts/full-setup-client-simulation.sh

      - name: Tear down full-setup validation stack
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true

          # `down` above can lose Docker's own "has active endpoints" race (a container-removal
          # API call can return before its network endpoint is actually unwired -- confirmed for
          # real in CI, see validation_project_networks_teardown's own comment in
          # reserve-validation-subnet.sh) and silently leave this project's network(s) non-empty,
          # poisoning them for whichever run reserves this slot next. Wait for and force a real
          # removal instead of trusting `down`'s own exit code.
          # shellcheck source=scripts/lib/reserve-validation-subnet.sh
          source "$GITHUB_WORKSPACE/scripts/lib/reserve-validation-subnet.sh"
          # This step runs unconditionally (`if: always()`), including when
          # the "Reserve a validation subnet and start the stack" step above
          # failed before ever setting COMPOSE_PROJECT_NAME -- under
          # `set -u`, a bare "$COMPOSE_PROJECT_NAME" would abort this whole
          # step with "unbound variable" in exactly that case (confirmed in
          # CI). The safe-default form skips teardown when there is nothing
          # to tear down instead.
          if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
            validation_project_networks_teardown "$COMPOSE_PROJECT_NAME" || true
          fi

          # Release the host-local subnet lock the "Reserve a validation subnet and start the
          # stack" step above acquired, so the slot becomes available to the next run
          # immediately rather than waiting for this whole job's process tree to exit.
          # $VALIDATION_LOCK_HOLDER_PID is only set once that step actually reserved a lock -- if
          # it failed before reaching that point, there is nothing to release.
          if [[ -n "${VALIDATION_LOCK_HOLDER_PID:-}" ]]; then
            kill "$VALIDATION_LOCK_HOLDER_PID" 2>/dev/null || true
          fi

      - name: Clean up image
        if: always()
        run: |
          docker rmi lancache-ng-full-setup:validation || true
          rm -f deploy/full-setup/.ci-exact-digests.yml

  dns_rust_quality:
    # DNS Rust quality is scoped by detect-changes for PR speed, but workflow changes
    # still force it because the CI contract itself may have changed.
    #
    # Also skipped on a metadata-only pull_request event (labeled/unlabeled/milestoned/
    # demilestoned): those events carry no new commit, so re-running clippy/fmt/check
    # against the exact same tree a prior run already validated would just burn a scarce
    # lancache-heavy slot for a known-identical result. `github.event.action` is read
    # directly off the event context, so this check is safe even when detect-changes did
    # not run for this event.
    name: rust-quality (dns/nats-subscriber)
    needs: detect-changes
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real warm-cache runs: 31s-3.3min. But this job's own "cargo clippy"
    # step already carries a 35-minute timeout (a deliberately generous
    # bound for sccache/sccache-dist fallback to a full local compile) -- a
    # job-level timeout must exceed every step timeout it contains, or the
    # job would fail before that step's own allowance runs out. 45 minutes
    # covers the clippy step's 35-minute budget plus this job's other steps.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/dns-nats-subscriber'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/dns-nats-subscriber'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: cargo fmt --check (dns/nats-subscriber)
        run: cargo fmt --manifest-path services/dns/nats-subscriber/Cargo.toml -- --check
      - name: cargo check with warnings denied (dns/nats-subscriber)
        uses: ./.github/actions/cargo-with-sccache-fallback
        env:
          RUSTFLAGS: "-D warnings"
        with:
          command: cargo check --locked --all-targets --manifest-path services/dns/nats-subscriber/Cargo.toml
      - name: cargo clippy with warnings denied (dns/nats-subscriber)
        timeout-minutes: 35
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo clippy --locked --all-targets --manifest-path services/dns/nats-subscriber/Cargo.toml -- -D warnings

  ui_rust_quality:
    # UI Rust quality mirrors the DNS job but stays independent so both crates
    # can run in parallel on suitable runners.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's identical comment above for the full reasoning.
    name: rust-quality (ui)
    needs: detect-changes
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.ui == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Same reasoning as dns_rust_quality above: this job's own "cargo
    # clippy" step below already carries a 35-minute timeout, so the
    # job-level bound must exceed it. Real warm-cache runs: 50s-3.3min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/ui'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/ui'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: cargo fmt --check (ui)
        run: cargo fmt --manifest-path services/ui/Cargo.toml -- --check
      - name: cargo check with warnings denied (ui)
        uses: ./.github/actions/cargo-with-sccache-fallback
        env:
          RUSTFLAGS: "-D warnings"
        with:
          command: cargo check --locked --all-targets --manifest-path services/ui/Cargo.toml
      - name: cargo clippy with warnings denied (ui)
        timeout-minutes: 35
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo clippy --locked --all-targets --manifest-path services/ui/Cargo.toml -- -D warnings

  watchdog_rust_quality:
    # Watchdog Rust quality mirrors dns_rust_quality/ui_rust_quality exactly
    # (same toolchain-isolation/sccache/fmt/check/clippy shape), now that
    # services/watchdog/Cargo.toml exists (#1355) alongside the crate's
    # pre-existing shell runtime. This job covers only the Rust crate; the
    # shell-script syntax/executable-bit check stays in watchdog_test below,
    # unchanged, since it validates a different artifact (watchdog.sh, still
    # the production entrypoint -- the Rust crate is a scaffold not yet wired
    # into the Dockerfile ENTRYPOINT, see #1355's own Scope Boundaries).
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's identical comment above for the full reasoning.
    name: rust-quality (watchdog)
    needs: detect-changes
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.watchdog == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Same reasoning as dns_rust_quality/ui_rust_quality above: this job's own
    # "cargo clippy" step below already carries a 35-minute timeout, so the
    # job-level bound must exceed it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/watchdog'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/watchdog'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: cargo fmt --check (watchdog)
        run: cargo fmt --manifest-path services/watchdog/Cargo.toml -- --check
      - name: cargo check with warnings denied (watchdog)
        uses: ./.github/actions/cargo-with-sccache-fallback
        env:
          RUSTFLAGS: "-D warnings"
        with:
          command: cargo check --locked --all-targets --manifest-path services/watchdog/Cargo.toml
      - name: cargo clippy with warnings denied (watchdog)
        timeout-minutes: 35
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo clippy --locked --all-targets --manifest-path services/watchdog/Cargo.toml -- -D warnings

  dns_test:
    # DNS unit tests are separate from quality checks so failures identify
    # whether the regression is lint/format level or behavioral.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning (no new commit,
    # so no new behavior to test).
    name: test (dns/nats-subscriber)
    needs: [validate-compose, dns_rust_quality, detect-changes]
    # Path-scoped on BOTH pull_request and push (#1095). detect-changes now runs on push
    # too (diffing github.event.before..github.sha), so this consults its outputs
    # uniformly instead of the old always-run-on-push short-circuit: on a push that did
    # not touch the crate (nor the workflow), the PR that produced that push already ran
    # and passed this exact test (AG-WF-004), so skipping reuses that known-good result.
    # `detect-changes.result != 'success'` fails safe to running whenever the
    # classification is unavailable rather than silently skipping. ci_scope_policy
    # tolerates the resulting `skipped` on push and re-derives strict per-path
    # required-ness on pull_request.
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.dns_rust_quality.result == 'success' || needs.dns_rust_quality.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real warm-cache runs: 26-56s. Same class of risk as dns_rust_quality's
    # clippy step above (this job's own "test" step compiles the crate via
    # the same cargo-with-sccache-fallback path, so an sccache/sccache-dist
    # miss forces the same full local recompile) -- 45 minutes matches
    # dns_rust_quality/ui_rust_quality's bound for that reason, not derived
    # from the fast warm-cache samples alone.
    timeout-minutes: 45
    # Job-level concurrency (#891 follow-up, extending #888/#892/#915's proven pattern):
    # dns_test is on the scarce self-hosted lancache-heavy pool, so reclaiming a superseded
    # commit's run matters for real capacity. Safe to cancel mid-flight: it is one of
    # ci_scope_policy's `needs`, but that job's push-branch check on this job's result now
    # uses require_success_or_intentional_cancellation() (tolerates
    # success/skipped/cancelled) specifically because of this group. Its only other
    # consumer, rust_coverage, already gates with a skip-or-success check, which cleanly
    # skips coverage rather than erroring; a cancelled result makes that gate false the
    # same way a skipped one does.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-dns-test-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-dns-test-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/dns-nats-subscriber'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/dns-nats-subscriber'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: test (dns/nats-subscriber)
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo test --locked --manifest-path services/dns/nats-subscriber/Cargo.toml

  ui_test:
    # UI tests run only when the UI or workflow contract changes. This keeps
    # docs/setup-only PRs from paying for unrelated Rust test work.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning.
    name: test (ui)
    needs: [validate-compose, ui_rust_quality, detect-changes]
    # Path-scoped on BOTH pull_request and push (#1095) -- see dns_test's if:
    # comment above for the full reasoning (reuse of the PR-time known-good
    # result on an unchanged push, fail-safe run when classification is
    # unavailable, ci_scope_policy tolerance of the resulting push `skipped`).
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.ui_rust_quality.result == 'success' || needs.ui_rust_quality.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.ui == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Same reasoning and value as dns_test above (compiles via the same
    # cargo-with-sccache-fallback path, so shares its cold-compile risk).
    # Real warm-cache runs: 40-51s.
    timeout-minutes: 45
    # Job-level concurrency (#891 follow-up, mirroring dns_test's own group
    # above for the same reason): scarce lancache-heavy capacity, safe to
    # cancel mid-flight -- ci_scope_policy's push-branch check on this job's
    # result now uses require_success_or_intentional_cancellation(), and
    # rust_coverage's own `success`/`skipped` gate on ui_test already treats
    # a non-matching result as a clean skip.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-ui-test-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-ui-test-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/ui'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/ui'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: test (ui)
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo test --locked --manifest-path services/ui/Cargo.toml

  rust_coverage:
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning. This is a
    # required branch-protection check on master/v0.2.0 ("coverage (Rust)"),
    # but it already tolerates a clean `skipped` result today for any PR whose
    # path scoping below finds no relevant Rust change (e.g. a docs-only PR);
    # this adds one more, equally clean skip source, not a new failure mode.
    #
    # Scope note (2026-08 watchdog Rust CI wiring update): watchdog is
    # deliberately NOT added to this job's `needs:`/tarpaulin invocation even
    # though it now has its own dns/ui-shaped rust-quality/test/cargo-audit
    # jobs above. Coverage here uses a per-crate PASS/FAIL threshold model
    # (see the "Run coverage" step below) that would need a new threshold
    # number deliberately chosen for the watchdog crate, which is a separate
    # decision this CI-wiring change does not make on its own; the watchdog
    # crate's own 38 unit tests already run and gate merges via watchdog_test
    # above, just without a tracked coverage percentage yet. Revisit if/when a
    # maintainer wants a coverage threshold for this crate specifically.
    name: coverage (Rust)
    needs: [validate-compose, dns_test, ui_test, detect-changes]
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.dns_test.result == 'success' || needs.dns_test.result == 'skipped') &&
        (needs.ui_test.result == 'success' || needs.ui_test.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.ui == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real warm-cache runs: 1.3-6.6min. 60 minutes rather than a tighter
    # multiple of that: cargo-tarpaulin instruments and recompiles both
    # crates for coverage (its own build path, separate from the
    # sccache-fallback compiles elsewhere in this file), and this job can
    # also fall back to a branch-local build-tools image rebuild (see the
    # step comment below) when a PR's own Dockerfile change hasn't been
    # published yet -- neither cold path is represented by the samples above.
    timeout-minutes: 60
    # Job-level concurrency (#891, extending #888/#892's proven build/container-scan
    # pattern): rust_coverage is on the scarce self-hosted lancache-heavy pool, same as
    # build/container-scan, so reclaiming a superseded commit's coverage run matters for
    # real capacity, not just consistency. Safe to cancel mid-flight: it is NOT one of
    # ci_scope_policy's `needs` (unlike dns_test/ui_test/dns_cargo_audit/ui_cargo_audit,
    # deliberately excluded from this pattern), so nothing hard-asserts its result. Its
    # only consumer, publish_coverage_badge, gates with
    # `!cancelled() && needs.rust_coverage.result == 'success'` and only runs on push -- a
    # cancelled rust_coverage cleanly skips the badge publish instead of erroring.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-rust-coverage-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-rust-coverage-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job resolves its own build-tools image rather than reusing validate-compose's
      # exported build_tools_image output. That output is deliberately locked to the
      # published, digest-qualified image (never a branch-local fallback) because
      # dns_cargo_audit/ui_cargo_audit need a reproducible, previously-audited image.
      # Coverage measurement has no such reproducibility requirement, so it can accept a
      # branch-local rebuild when a PR's own Dockerfile change (like adding tarpaulin) has
      # not been published to ghcr.io yet.
      - name: Resolve build-tools image (with tarpaulin required)
        env:
          EXTRA_REQUIRED_TOOLS: "cargo-tarpaulin bc"
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          image="$(bash scripts/select-build-tools-image.sh)"
          printf 'BUILD_TOOLS_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      # Coverage output must land on a writable host path: the repo checkout
      # itself is bind-mounted read-only into the build-tools container below,
      # matching the dns_cargo_audit/ui_cargo_audit pattern.
      - name: Prepare writable coverage output directories
        run: |
          set -euo pipefail
          mkdir -p coverage-dns coverage-ui
      - name: Run coverage (dns/nats-subscriber)
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target-dns \
            -v "$PWD:/work" \
            -v "$PWD/coverage-dns:/coverage-dns" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -c 'set -euo pipefail
              cargo tarpaulin \
                --engine llvm \
                --manifest-path services/dns/nats-subscriber/Cargo.toml \
                --locked \
                --timeout 300 \
                --out json \
                --output-dir /coverage-dns'
      - name: Run coverage (ui)
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/target-ui \
            -v "$PWD:/work" \
            -v "$PWD/coverage-ui:/coverage-ui" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -c 'set -euo pipefail
              cargo tarpaulin \
                --engine llvm \
                --manifest-path services/ui/Cargo.toml \
                --locked \
                --timeout 300 \
                --out json \
                --output-dir /coverage-ui'
      - name: Merge coverage reports and check threshold
        id: coverage
        run: |
          set -euo pipefail

          mkdir -p coverage-badge
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work:ro" \
            -v "$PWD/coverage-badge:/coverage-badge" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -c 'set -euo pipefail

              # Extract coverage percentages from JSON reports inside the
              # selected build-tools image, not from incidental host binaries.
              dns_coverage=$(jq -r ".coverage" coverage-dns/tarpaulin-report.json 2>/dev/null || echo "0")
              ui_coverage=$(jq -r ".coverage" coverage-ui/tarpaulin-report.json 2>/dev/null || echo "0")

              echo "DNS coverage: ${dns_coverage}%"
              echo "UI coverage: ${ui_coverage}%"

              # Per-crate thresholds, not a shared minimum: the two crates real coverage differs by
              # an order of magnitude (measured on CI: ui about 38.6%, nats-subscriber about 0%).
              # nats-subscriber unit tests cover its pure conversion logic
              # (dns_record_to_zone_update); its async subscribe/forward loop needs a live
              # NATS/PowerDNS harness and is exercised by the full-setup integration jobs, not unit
              # coverage. A single shared minimum threshold would either block real ui coverage
              # from ever mattering (if set low enough for nats-subscriber to pass) or permanently
              # fail nats-subscriber (if set for ui level). Each crate threshold is raised
              # independently as that crate gains real unit tests. STATUS (2026-07-23):
              # dns_threshold stays 0 because the floor has not been raised since issue #504 (first
              # flagged this) was closed -- its pure-logic unit tests landed via PR #515 -- not
              # because an open gap is still tracked. Raise it once nats-subscriber gains
              # unit-testable coverage beyond the model.
              ui_threshold=35
              dns_threshold=0

              echo "UI threshold: ${ui_threshold}%"
              echo "DNS threshold: ${dns_threshold}% (floor not raised since #504 closed; async loop covered by full-setup integration)"

              failed=0
              if (( $(echo "$ui_coverage < $ui_threshold" | bc -l) )); then
                echo "::error::UI coverage ${ui_coverage}% is below threshold of ${ui_threshold}%"
                failed=1
              fi
              if (( $(echo "$dns_coverage < $dns_threshold" | bc -l) )); then
                echo "::error::DNS coverage ${dns_coverage}% is below threshold of ${dns_threshold}%"
                failed=1
              fi

              if [[ "$failed" -eq 1 ]]; then
                exit 1
              fi

              # Badge generation reuses this same containerized jq instead of
              # assuming a host-installed jq, matching why the coverage
              # extraction above already runs in here (issue #566).
              ui_coverage_display="$(printf "%.2f" "$ui_coverage")"
              dns_coverage_display="$(printf "%.2f" "$dns_coverage")"
              badge_message="ui ${ui_coverage_display}% / dns ${dns_coverage_display}%"
              badge_color=yellow
              if awk -v ui="$ui_coverage" -v dns="$dns_coverage" "BEGIN { exit !(ui >= 80 && dns >= 80) }"; then
                badge_color=brightgreen
              fi

              jq -n \
                --arg message "$badge_message" \
                --arg color "$badge_color" \
                "{schemaVersion: 1, label: \"rust coverage\", message: \$message, color: \$color}" \
                > /coverage-badge/rust.json

              {
                printf "ui=%s\n" "$ui_coverage_display"
                printf "dns=%s\n" "$dns_coverage_display"
                printf "message=%s\n" "$badge_message"
              } > /coverage-badge/output.env

              echo "Coverage check passed"'

          cat coverage-badge/output.env >> "$GITHUB_OUTPUT"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-reports
          path: |
            coverage-dns/tarpaulin-report.json
            coverage-ui/tarpaulin-report.json
          retention-days: 30
      # The badge JSON is handed off as an artifact rather than pushed from this
      # job directly: this job runs on every trigger including same-repo pull_request
      # runs that execute PR-controlled test code (cargo tarpaulin), and a job-level
      # `permissions: contents: write` would apply to that untrusted code too --
      # GitHub Actions has no step-level permissions to scope the write down to just
      # the publish step. publish_coverage_badge below is the only job with write
      # access, and it only ever runs on trusted push events.
      - name: Upload coverage badge data
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-badge
          path: coverage-badge/rust.json
          retention-days: 1

  publish_coverage_badge:
    # Split out of rust_coverage (see the comment on its "Upload coverage badge data"
    # step) so the contents:write token this job needs is never present during the
    # coverage measurement steps that execute PR-controlled code.
    #
    # `if:` must start with an explicit status-check function, not a bare
    # `needs.rust_coverage.result == ...` -- same trap documented on promote's `if:`
    # below. A bare condition gets an implicit `&& success()` appended by GitHub Actions,
    # and that success() walks the WHOLE transitive needs graph, not just this job's own
    # direct `needs: rust_coverage`. Confirmed live: this job skipped on the actual push
    # that merged it (run 29184177783) because of exactly this.
    name: publish rust coverage badge
    needs: rust_coverage
    if: "!cancelled() && needs.rust_coverage.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')"
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 10-12s. Same 15-minute floor as detect-changes above.
    timeout-minutes: 15
    # Job-level concurrency, keyed per source ref: the top-level group (see top of file)
    # is run_id-suffixed for push events and therefore never collides, so it no longer
    # serializes same-branch badge publishes the way its old, fully-global key used to.
    # cancel-in-progress stays false: this queues a second same-branch publish behind a
    # running one instead of racing it.
    #
    # Deliberately per-ref, NOT workflow-wide: a single shared group would let unrelated
    # branches queue behind each other, and GitHub's concurrency queue only ever holds one
    # pending job per group -- a burst of publishes for OTHER branches can bump a given
    # branch's already-queued publish entirely before it starts, silently skipping that
    # branch's badge update for this push. Per-ref scoping gives every branch its own
    # queue slot.
    #
    # What per-ref scoping does NOT do is stop two DIFFERENT branches' publishes from
    # running at the literal same time and racing the shared `badges` branch -- that race
    # is instead handled below, by retrying the fetch/commit/push instead of doing it
    # once. A badge push is cheap/fast enough that neither the per-branch queueing nor the
    # retry loop is a capacity concern the way cancellation is for build/container-scan.
    concurrency:
      group: ${{ github.workflow }}-badge-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage badge data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (v4.3.0 still declared deprecated Node 20 runtime, see #802)
        with:
          name: rust-coverage-badge
          path: coverage-badge
      - name: Publish Rust coverage badge endpoint
        # BADGE_FILE is scoped per source branch (not one shared coverage/rust.json)
        # so pushes to master and to the active vX.Y.Z integration branch don't
        # overwrite each other's badge data -- this job's own concurrency group
        # (above) is per-ref, so it only serializes writes for the SAME branch;
        # the retry loop below is what protects the shared `badges` branch
        # itself from two DIFFERENT branches' publishes racing each other.
        env:
          BADGE_BRANCH: badges
          BADGE_FILE: coverage/rust-${{ github.ref_name }}.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to publish the coverage badge endpoint}"
          : "${BADGE_BRANCH:?BADGE_BRANCH is required}"
          : "${BADGE_FILE:?BADGE_FILE is required}"

          # Debounce/coalesce, same reasoning and mechanism as promote's own branch-tip check
          # (#777, see that job's comment): the per-ref badge concurrency group above only
          # serializes the ORDER two same-branch publishes execute in, it does not guarantee the
          # newer commit's coverage wins. A slow, older run's rust_coverage can still finish and
          # reach this step after a faster, newer run for the same branch already published --
          # without this check it would silently fast-forward the badge file back to stale
          # coverage. Re-resolve the branch's current tip directly from the remote and skip as a
          # no-op if a newer commit has already landed.
          current_tip="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [[ -z "$current_tip" ]]; then
            echo "::error::Could not resolve the current tip of ${GITHUB_REF} via git ls-remote; refusing to publish the coverage badge blind."
            exit 1
          fi
          if [[ "$current_tip" != "$GITHUB_SHA" ]]; then
            echo "::notice::${GITHUB_REF} has already moved to ${current_tip} since this run was triggered for ${GITHUB_SHA}; skipping badge publish so the run already targeting the current tip publishes instead."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cp coverage-badge/rust.json "$tmp_dir/rust.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry loop, not a single fetch/commit/push: the concurrency group above is per-ref,
          # so it only prevents two publishes for the SAME branch from racing each other -- it
          # does nothing for a DIFFERENT branch's publish landing on the shared `badges` branch
          # between this attempt's fetch and its own push (previously a single plain `git push`,
          # no retry/rebase, would just fail non-fast-forward in that case). Re-fetching and
          # rebuilding the commit on the fresh tip each attempt makes that self-healing instead
          # of a hard failure, without needing a single global group that would let unrelated
          # branches bump each other out of the queue.
          max_attempts=5
          attempt=1
          while :; do
            # Explicit destination refspec, not just "origin $BADGE_BRANCH": actions/checkout's
            # sparse fetch config only tracks the ref it originally checked out, so fetching a
            # different branch by name alone lands only in FETCH_HEAD, never in
            # refs/remotes/origin/$BADGE_BRANCH -- the show-ref check below would then always
            # report "not found" and take the orphan-branch path even when badges already exists,
            # and the final push would be rejected as non-fast-forward.
            git fetch origin "$BADGE_BRANCH:refs/remotes/origin/$BADGE_BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$BADGE_BRANCH"; then
              # -C (not --create): this is a self-hosted runner, so a local badges branch left
              # over from a previous job on the same workspace makes a plain --create fail with
              # "a branch named 'badges' already exists". -C resets it to origin's tip instead,
              # discarding any local commit left over from a previous failed attempt below.
              git switch -C "$BADGE_BRANCH" "origin/$BADGE_BRANCH"
            else
              git switch --orphan "$BADGE_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            fi

            mkdir -p "$(dirname "$BADGE_FILE")"
            cp "$tmp_dir/rust.json" "$BADGE_FILE"
            git add "$BADGE_FILE"

            if git diff --cached --quiet; then
              echo "::notice::Rust coverage badge endpoint already up to date."
              exit 0
            fi

            git commit -m "chore: update rust coverage badge"
            if git push origin "$BADGE_BRANCH"; then
              break
            fi

            if (( attempt >= max_attempts )); then
              echo "::error::Failed to push the coverage badge endpoint to ${BADGE_BRANCH} after ${max_attempts} attempts (non-fast-forward every time)."
              exit 1
            fi
            echo "::notice::Push to ${BADGE_BRANCH} was rejected, likely by a concurrent publish for another branch -- refetching and retrying (attempt $((attempt + 1))/${max_attempts})."
            attempt=$((attempt + 1))
          done

  watchdog_test:
    # Watchdog test now covers two different artifacts under one job: the
    # shell-script syntax/executable-bit gate for watchdog.sh (still the
    # production entrypoint) below, PLUS (new, #1355 follow-up) a real
    # `cargo test` run for the Rust crate now living alongside it in the same
    # services/watchdog/ directory. This mirrors dns_test/ui_test's shape
    # (gated on its own rust_quality job's result, running on lancache-heavy
    # since it now compiles, same metadata-only-event and content-change
    # scoping) rather than staying on the cheap lancache-light tier the
    # shell-only version used before the Rust crate existed -- the compile
    # cost is now real, so this job needs the same tier and job-level
    # concurrency treatment its dns/ui counterparts already have. See
    # ci_scope_policy's own comment for the corresponding policy-side change
    # this requires (watchdog_test moves from require_success_or_intentional_
    # skip() to require_success_or_intentional_cancellation() on push, the
    # same tolerance dns_test/ui_test already needed once they gained their
    # own cancel-on-push groups).
    name: test (watchdog)
    needs: [validate-compose, watchdog_rust_quality, detect-changes]
    # Path-scoped like dns_test/ui_test (#1095's shape) -- see
    # dns_rust_quality's comment above for the full metadata-only-event
    # reasoning. This is a behavior change from this job's pre-Rust-crate
    # shape, which intentionally ran unconditionally at near-zero cost; now
    # that it does real compile work, reusing a prior run's known-good result
    # on an unchanged event is the same trade dns_test/ui_test already make.
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (needs.watchdog_rust_quality.result == 'success' || needs.watchdog_rust_quality.result == 'skipped') &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.watchdog == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Same reasoning and value as dns_test/ui_test above (compiles via the
    # same cargo-with-sccache-fallback path, so shares its cold-compile risk).
    timeout-minutes: 45
    # Job-level concurrency, mirroring dns_test/ui_test's own group (#891/#979
    # pattern): now that this job does real compile work on the scarce
    # lancache-heavy pool, a superseded commit's run should be reclaimed the
    # same way those two already are.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-watchdog-test-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-watchdog-test-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test (watchdog shell script)
        run: |
          bash -n services/watchdog/watchdog.sh
          test -x services/watchdog/watchdog.sh
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/watchdog'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/watchdog'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: test (watchdog Rust crate)
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo test --locked --manifest-path services/watchdog/Cargo.toml

  watchdog_test-hosted:
    # Unlike watchdog_test above, this fallback deliberately does not gate on
    # detect-changes/validate-compose (both self-hosted-only). Depending on
    # them here would reintroduce the same trap that ruled out a
    # ci_scope_policy-hosted job elsewhere in this file: if self-hosted
    # runners are genuinely unavailable (the scenario this fallback exists
    # for), a needs: dependency on a self-hosted-only job would just sit
    # queued forever. The check itself (bash -n plus an executable-bit test
    # on one small script) is cheap enough to run unconditionally every time,
    # same as file-headers-hosted/line-endings-hosted/shellcheck-hosted.
    #
    # This hosted fallback deliberately covers only the shell-script half of
    # watchdog_test above -- it does NOT run `cargo test` for the Rust crate
    # (2026-08 watchdog Rust CI wiring update), for the same reason dns/ui
    # never got a hosted fallback for their own rust-quality/test/cargo-audit
    # jobs: real Rust compilation depends on the shared build-tools image and
    # sccache/distcc acceleration, which have no safe hosted equivalent yet
    # (see docs/ci-github-hosted-fallback-decision.md). A green run here is
    # NOT proof the watchdog crate compiles or its tests pass.
    name: test (watchdog) (GitHub-hosted fallback)
    runs-on: ubuntu-latest
    # Real runs: 3-5s. Same 15-minute floor as detect-changes above.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GitHub-hosted fallback notice
        run: |
          echo "::notice::Running watchdog syntax check on GitHub-hosted runner as fallback for non-LAN-dependent linting."
      - name: test (watchdog)
        run: |
          bash -n services/watchdog/watchdog.sh
          test -x services/watchdog/watchdog.sh

  dns_cargo_audit:
    # Dependency audits remain crate-specific. They are skipped only when path
    # filtering proves the crate and workflow contract did not change.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning (Cargo.lock is
    # unchanged, so a prior run's audit result already stands).
    name: cargo-audit (dns/nats-subscriber)
    needs: [validate-compose, detect-changes]
    # Path-scoped on BOTH pull_request and push (#1095) -- see dns_test's if:
    # comment above for the full reasoning.
    if: >-
      ${{
        always() &&
        needs['validate-compose'].result == 'success' &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          needs['detect-changes'].result != 'success' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real runs: 10-14s. cargo-audit checks Cargo.lock against the advisory
    # database using a prebuilt binary (AG-KD-003) -- it does not compile
    # the crate, so it does not share dns_test's cold-compile risk. 20
    # minutes covers a slow advisory-database fetch with real headroom.
    timeout-minutes: 20
    # Job-level concurrency (#891 follow-up, same pattern/reasoning as
    # dns_test above): scarce lancache-heavy capacity, no other consumer
    # besides ci_scope_policy, whose push-branch check on this job's result
    # now uses require_success_or_intentional_cancellation().
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-dns-cargo-audit-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-dns-cargo-audit-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: true
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Rust dependencies (dns/nats-subscriber)
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo-home \
            -v "$PWD:/work:ro" \
            -w /work \
            "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}" \
            bash -c 'set -euo pipefail
              audit_log="$(mktemp)"
              trap '"'"'rm -f "$audit_log"'"'"' EXIT
              if ! cargo audit --deny warnings --file services/dns/nats-subscriber/Cargo.lock >"$audit_log" 2>&1; then
                cat "$audit_log"
                exit 1
              fi
              cat "$audit_log"
              if grep -Eiq '"'"'(^|[[:space:]])warning:'"'"' "$audit_log"; then
                echo "::error::cargo-audit emitted warnings."
                exit 1
              fi'

  ui_cargo_audit:
    # UI dependency audit mirrors the DNS audit and stays parallel to avoid
    # serializing independent Rust checks.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's comment above for the full reasoning.
    name: cargo-audit (ui)
    needs: [validate-compose, detect-changes]
