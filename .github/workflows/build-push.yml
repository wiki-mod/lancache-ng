      - name: Check setup.sh/simulation-script prompt drift (issue #1176)
        # What: scripts/tracked/check-setup-prompt-drift.sh fails closed whenever an unconditional wizard prompt in setup.sh's interactive install wizard is missing a matching expect_prompt answer in scripts/untracked/simulations/setup-cli-simulation.sh or scripts/untracked/simulations/syslog-forwarding-simulation.sh, or a simulation script's pattern no longer matches any real prompt.
        # Why: These two expect-driven simulation scripts hand-encode setup.sh's prompt sequence by convention with nothing checking they stay in sync; an unconditional prompt added without updating either script silently hangs both until timeout instead of failing with a clear cause.
        # From: Issue #1095 | PR #1532
        run: |
