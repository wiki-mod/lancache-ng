      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  # What: derives a per-run validation subnet candidate (unconditional job).
  # Why: full-setup validation also runs on push, not just pull_request.
  compute-validation-network:
    name: derive per-run validation subnet
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 7-9s. Same 15-minute floor as detect-changes above.
    timeout-minutes: 15
    outputs:
      subnet: ${{ steps.derive.outputs.subnet }}
      gateway: ${{ steps.derive.outputs.gateway }}
      proxy_ip: ${{ steps.derive.outputs.proxy_ip }}
      proxy_ssl_ip: ${{ steps.derive.outputs.proxy_ssl_ip }}
      dns_standard_ip: ${{ steps.derive.outputs.dns_standard_ip }}
      dns_ssl_ip: ${{ steps.derive.outputs.dns_ssl_ip }}
      watchdog_ip: ${{ steps.derive.outputs.watchdog_ip }}
      netdata_ip: ${{ steps.derive.outputs.netdata_ip }}
      nats_ip: ${{ steps.derive.outputs.nats_ip }}
      ui_ip: ${{ steps.derive.outputs.ui_ip }}
      project_name: ${{ steps.derive.outputs.project_name }}
      ui_port: ${{ steps.derive.outputs.ui_port }}
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Derive validation network
        id: derive
        uses: ./.github/actions/derive-validation-network

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  full-setup-validate:
    name: validate full-setup image
    # Wait for merge-manifests so PR validation consumes this PR staging manifest, not stale base-channel content.
    # Trusted non-PR validation likewise waits for the exact merged sha-* candidate before promotion.
    needs: [detect-changes, determine-build-admission, merge-manifests, compute-validation-network, validate-compose, push-supersession-check]
    # What: skips full-setup validation when build admission is closed.
    # Why: no fresh sha-* images exist, so the job would only emit noise.
    # From: Issue #1095 | PR #1642 | PR #1643
    if: >-
      ${{
        always() &&
        needs['determine-build-admission'].result == 'success' &&
        needs['determine-build-admission'].outputs.admitted == 'true' &&
        needs['merge-manifests'].result != 'cancelled' &&
        (
          github.event_name == 'pull_request' ||
          needs['push-supersession-check'].outputs.superseded != 'true'
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.deploy == 'true' ||
          needs['detect-changes'].outputs.workflow_reuse_scope == 'true' ||
          needs['detect-changes'].outputs.validation_infra == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 30-71s (pulls the just-published multi-platform image set,
    # brings the full stack up via docker compose, smoke-tests it, tears it
    # down). 30 minutes, not the 15-minute lint-job floor, because this job
    # depends on a real docker-compose stack startup (image pulls, container
    # health checks) whose cold-cache worst case is not represented by these
    # warm-cache samples.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # What: actions: read, for the ancestor-fallback recovery's REST call.
      # Why: staging-ancestor-fallback.sh uses plain curl, not gh CLI
      # (AG-CI-001), but the REST endpoint still needs this scope.
      # From: Issue #1095 | PR #1532
      actions: read
    # What: VALIDATION_SUBNET/etc. come from a flock reservation, not env:.
    # Why: full reasoning on the linked issue (concurrent-run race).
    # From: Issue #1095 | PR #1532
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      # What: fetch-depth: 0 instead of the default shallow clone.
      # Why: needed for a merge-base diff below; see the linked issue.
      # From: Issue #1095 | PR #1532
      - uses: *checkout_centraliced_versioning # v7.0.1
        with:
          fetch-depth: 0

      # What: resolves the image channel to validate against.
      # Why: full channel/fallback reasoning on the linked issue.
      # From: Issue #1095 | PR #1532
      - name: Determine validation image channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # github.sha, NOT github.event.pull_request.head.sha: for a pull_request event this
          # is the synthetic merge commit actually checked out and built, and -- critically --
          # it changes whenever that merge result changes even if the PR's own head commit does
          # not (e.g. a "reopened" event after the base branch moved while the PR was closed).
          # Keying the tag on the PR head SHA alone let two events for the identical head, merged
          # against two different base states, collide on one tag and let whichever push landed
          # last silently overwrite the other's image content.
          BUILD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # What: calls validation-image-tag.sh's channel/tag/available funcs.
          # Why: keeps exactly one implementation of this decision logic.
          # From: Issue #1095 | PR #1619
          # shellcheck source=scripts/lib/validation-image-tag.sh
          source "$GITHUB_WORKSPACE/scripts/lib/validation-image-tag.sh"

          base_channel_tag="$(vit_base_channel_tag "$BASE_REF")"
          echo "base-channel-tag=$base_channel_tag" >> "$GITHUB_OUTPUT"

          pr_staging_available="$(vit_pr_staging_available "$EVENT_NAME" "$ACTOR" "$HEAD_REPO" "$REPOSITORY")"
          echo "pr-staging-available=$pr_staging_available" >> "$GITHUB_OUTPUT"

          # vit_resolve_tag's workflow_dispatch branch never applies here --
          # this job only ever runs from push/pull_request -- so the empty
          # dispatch_tag argument is never read.
          tag="$(vit_resolve_tag "$EVENT_NAME" "$BASE_REF" "$PR_NUMBER" "$BUILD_SHA" "$ACTOR" "$HEAD_REPO" "$REPOSITORY" "")"

          # CI 1.1: a trusted push validates the immutable commit candidate
          # before public promotion. PRs keep their unique staging tag and
          # immediately pin every service behind it to a digest below.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            tag="sha-${BUILD_SHA}"
            echo "Validating pre-promotion candidate set '$tag'."
          fi

          if [[ "$pr_staging_available" == "true" ]]; then
            # What: an untouched service backfills from its base commit.
            # Why: base_channel_tag is only computed on the
            # pr_staging_available == false fallback branch.
            # From: Issue #1095 | PR #1619
            echo "Validating against this PR's own staging tag '$tag' (built commit $BUILD_SHA, PR head $PR_HEAD_SHA; untouched services are backfilled from this PR's own base commit's per-commit image, see the next step)."
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "::notice::$ACTOR's pull_request runs get a read-only GITHUB_TOKEN (Dependabot, or a fork PR), so build/build-arm64 could not push a PR staging tag. Validating against the '$tag' base channel instead -- the same behavior this job always had before #626."
            fi
            echo "Validating against the '$tag' channel (base ref: $BASE_REF)."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # What: backfills an untouched service from the base channel image.
      # Why: full reasoning on the linked issue (LANCACHE_IMAGE_TAG contract).
      # From: Issue #1095 | PR #1532

      - name: Clean up stale Buildx builder containers (self-hosted reuse hardening)
        run: bash scripts/tracked/cleanup-stale-buildx-builders.sh
      - name: Set up Docker Buildx
        if: steps.channel.outputs.pr-staging-available == 'true'
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        if: steps.channel.outputs.pr-staging-available == 'true'
        uses: &docker_login_centraliced_versioning ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Touched services must have a PR staging image after merge-manifests; never hide a missing candidate with base-content fallback.
      # Only genuinely untouched services may use the verified base-commit backfill path.
      - name: Ensure PR staging tags exist for full-setup services
        if: steps.channel.outputs.pr-staging-available == 'true'
        env:
          PR_TAG: ${{ steps.channel.outputs.tag }}
          # What: this PR's own base commit, for the back-fill source tag.
          # Why: only runs when pr-staging-available is true.
          # From: Issue #1095 | PR #1619
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PROXY_TOUCHED: ${{ needs['detect-changes'].outputs.proxy }}
          DNS_TOUCHED: ${{ needs['detect-changes'].outputs.dns_image }}
          WATCHDOG_TOUCHED: ${{ needs['detect-changes'].outputs.watchdog }}
          UI_TOUCHED: ${{ needs['detect-changes'].outputs.ui }}
          BUILD_TOOLS_TOUCHED: ${{ needs['detect-changes'].outputs.build_tools }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # scripts/lib/staging-ancestor-fallback.sh's saf_base_commit_has_confirmed_run()
          # reads it straight from the environment (never as an argv parameter,
          # so it cannot leak into ghcr_retry's own diagnostics) to authenticate
          # its `curl` query against the Actions REST API. Not the `gh` CLI --
          # see that file's own saf_query_run_count() header for the AG-CI-001
          # reasoning behind talking to the API directly.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/staging-image-freshness.sh
          source "$GITHUB_WORKSPACE/scripts/lib/staging-image-freshness.sh"
          # shellcheck source=scripts/lib/staging-ancestor-fallback.sh
          source "$GITHUB_WORKSPACE/scripts/lib/staging-ancestor-fallback.sh"
          # shellcheck source=scripts/lib/validation-image-tag.sh
          source "$GITHUB_WORKSPACE/scripts/lib/validation-image-tag.sh"

          : "${BASE_SHA:?BASE_SHA (github.event.pull_request.base.sha) is required}"

          # What: calls vit_service_should_have_staging_tag directly.
          # Why: keeps the staging decision tied to the per-service touch result.
          # From: Issue #1095 | PR #1619
          service_should_have_staging_tag() {
            vit_service_should_have_staging_tag "$1" "$2"
          }

          declare -A touched_map=(
            [proxy]="$PROXY_TOUCHED"
            [dns]="$DNS_TOUCHED"
            [watchdog]="$WATCHDOG_TOUCHED"
            [ui]="$UI_TOUCHED"
            [build-tools]="$BUILD_TOOLS_TOUCHED"
          )

          # Maps this step's own matrix-service names to
          # scripts/untracked/classify-image-impact.sh's output keys, for
          # saf_resolve_untouched_backfill_source's service-scoped check
          # below -- see scripts/untracked/ensure-pr-staging-images.sh's own
          # classify_key_map for the full reasoning.
          declare -A classify_key_map=(
            [proxy]="proxy"
            [dns]="dns_image"
            [watchdog]="watchdog"
            [ui]="ui"
            [build-tools]="build_tools"
          )

          # The services deploy/full-setup/docker-compose.yml references, plus build-tools
          # (used by the client-simulation step further down, not by the compose file itself).
          # dhcp and dhcp-proxy are part of neither and are intentionally excluded.
          #
          # Decide touched-or-not FIRST, before looking at whether a pr_image already exists. A
          # prior run of this exact PR head (a manual re-run, or this job running twice for the
          # same commit) may already have back-filled an untouched service's tag from this PR's
          # base commit image. That source is pinned to one fixed commit (or its nearest built
          # ancestor -- see scripts/lib/staging-ancestor-fallback.sh) rather than a moving
          # channel, so re-pointing it every run is no longer about chasing a channel that
          # "moved since" -- it is still done unconditionally anyway, both for defense-in-depth
          # and because `imagetools create` is a cheap registry-side manifest write, not a
          # rebuild, so refreshing it costs nothing worth optimizing away.
          full_setup_services=(proxy dns watchdog ui build-tools)

          for service in "${full_setup_services[@]}"; do
            pr_image="ghcr.io/${REPOSITORY}/${service}:${PR_TAG}"
            should_exist="$(service_should_have_staging_tag "$service" "${touched_map[$service]}")"

            if [[ "$should_exist" == "true" ]]; then
              # Wrapped in ghcr_retry: unlike merge-manifests' per-arch
              # probes, a missing tag here is always a real error (this job
              # runs after merge-manifests, so a touched service's PR staging
              # tag is expected to already exist) -- retrying protects
              # against a transient 401 being misreported as "never pushed".
              if ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$pr_image" >/dev/null 2>&1; then
                echo "::notice::$service already has a staging image at $PR_TAG (this PR touched it)."
                continue
              fi
              echo "::error::$service's PR staging tag ($pr_image) is missing even though detect-changes says this PR touched it (or a workflow/CI-contract file changed). Refusing to fall back to the PR base commit's content for a touched service -- that would silently reintroduce #626's bug behind a tag name that looks PR-specific. Check whether build/build-arm64 actually pushed $service successfully for this commit."
              exit 1
            fi

            # What: never back-fills without proving the source was built
            # from base.sha or later.
            # Why: shares this resolution sequence with
            # ensure-pr-staging-images.sh.
            # From: Issue #1095 | PR #1619
            if ! resolved_source="$(saf_resolve_untouched_backfill_source "$REPOSITORY" "$service" "${classify_key_map[$service]}" "$BASE_SHA" \
              900 1200 \
              300 600 \
              0 0 15 50 "$GITHUB_WORKSPACE" "$BASE_REF")"; then
              exit 1
            fi
            echo "::notice::(re)pointing $PR_TAG at $resolved_source."
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create --prefer-index=false -t "$pr_image" "$resolved_source"
          done

      # What: renders the full-setup compose override from OCI digests.
      # Why: consolidated from render-full-setup-digest-override.sh
      # (AG-CODE-013), this workflow's only caller.
      # From: PR #1523
      - name: Pin full-setup service identities to immutable digests
        id: pin-full-setup-digests
        env:
          IMAGE_TAG: ${{ steps.channel.outputs.tag }}
          PROXY_DIGEST: ${{ needs['merge-manifests'].outputs.proxy_digest }}
          DNS_DIGEST: ${{ needs['merge-manifests'].outputs.dns_digest }}
          WATCHDOG_DIGEST: ${{ needs['merge-manifests'].outputs.watchdog_digest }}
          UI_DIGEST: ${{ needs['merge-manifests'].outputs.ui_digest }}
          BUILD_TOOLS_DIGEST: ${{ needs['merge-manifests'].outputs.build_tools_digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: reads the single declared, lowercased GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          REPOSITORY="$(dmeta_ghcr_repo)"

          # What: collects every missing service before failing, instead of exit-1ing on the first.
          # Why: this IS the pipeline's VERIFY completeness check (maintainer
          #   decision) -- a single consolidated error naming every gap is the "clear error
          #   message" that check requires, not just the first one found.
          # From: Issue #1095 | PR #1642 | PR #1643
          declare -a missing_services=()
          resolve_digest() {
            local service=$1 supplied=$2 image digest
            if [[ "$supplied" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              printf '%s\n' "$supplied"
              return 0
            fi
            image="ghcr.io/${REPOSITORY}/${service}:${IMAGE_TAG}"
            echo "::notice::No producer digest was exported for $service; resolving $image once and pinning the result for this validation run." >&2
            # What: resolve_manifest_digest is already ghcr_retry-wrapped.
            # Why: by the time it fails, retries are exhausted, so this could be a genuinely
            #   missing image OR GHCR not answering -- do not assert "missing" as fact.
            # From: Issue #1095 | PR #1642 | PR #1643
            if ! digest="$(resolve_manifest_digest "$image" "${GHCR_RETRY_USERNAME:-}" "${GHCR_RETRY_PASSWORD:-}")"; then
              echo "::error::Could not resolve an immutable digest for $image after retries -- either $service is missing from this run's candidate set, or GHCR did not answer." >&2
              missing_services+=("$service")
              return 1
            fi
            printf '%s\n' "$digest"
          }

          proxy_digest="$(resolve_digest proxy "${PROXY_DIGEST:-}")" || true
          dns_digest="$(resolve_digest dns "${DNS_DIGEST:-}")" || true
          watchdog_digest="$(resolve_digest watchdog "${WATCHDOG_DIGEST:-}")" || true
          ui_digest="$(resolve_digest ui "${UI_DIGEST:-}")" || true
          build_tools_digest="$(resolve_digest build-tools "${BUILD_TOOLS_DIGEST:-}")" || true

          # What: fails VERIFY here, before rendering a compose override from partial digests.
          # Why: an incomplete candidate set must be a named, explicit VERIFY failure,
          #   not a cryptic downstream compose-pull error; the leftover per-service
          #   images this run DID publish are not specially deleted here -- they are ordinary
          #   sha-* history, already in scope of gc-pr-staging-images.yml's existing 3-hourly
          #   sweep (PR #1594), same as any other tag once it falls outside that policy's
          #   retention window.
          # From: Issue #1095 | PR #1642 | PR #1643
          if [ "${#missing_services[@]}" -gt 0 ]; then
            echo "::error::This run could not resolve a candidate image for ${#missing_services[@]} service(s) (${missing_services[*]}) -- see each service's own ::error:: above for whether that is a missing image or a GHCR read failure after retries. VERIFY cannot validate an incomplete stack. The images this run DID publish are not deleted by this step: they are ordinary sha-* history, already covered by gc-pr-staging-images.yml's existing 3-hourly retention sweep (no dedicated fast-path exists or was added here) -- push a new commit to retry the whole candidate set instead of waiting on that sweep."
            exit 1
          fi

          override_file=".ci-exact-digests.yml"
          mkdir -p "$(dirname "deploy/full-setup/${override_file}")"
          cat > "deploy/full-setup/${override_file}" <<YAML
          # Generated by build-push.yml's "Pin full-setup service identities to
          # immutable digests" step for one CI run.
          services:
            proxy:
              image: "ghcr.io/${REPOSITORY}/proxy@${proxy_digest}"
            dns-standard:
              image: "ghcr.io/${REPOSITORY}/dns@${dns_digest}"
            dns-ssl:
              image: "ghcr.io/${REPOSITORY}/dns@${dns_digest}"
            watchdog:
              image: "ghcr.io/${REPOSITORY}/watchdog@${watchdog_digest}"
            retention:
              image: "ghcr.io/${REPOSITORY}/watchdog@${watchdog_digest}"
            ui:
              image: "ghcr.io/${REPOSITORY}/ui@${ui_digest}"
          YAML

          client_tools_ref="ghcr.io/${REPOSITORY}/build-tools@${build_tools_digest}"
          printf 'FULL_SETUP_COMPOSE_OVERRIDE=%s\n' "$override_file" >> "$GITHUB_ENV"
          printf 'FULL_SETUP_CLIENT_TOOLS_IMAGE=%s\n' "$client_tools_ref" >> "$GITHUB_ENV"
      - name: Remove buildx builder
        if: ${{ always() && steps.channel.outputs.pr-staging-available == 'true' }}
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Validate compose configuration
        env:
          BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
          LANCACHE_IMAGE_REGISTRY: ghcr.io
          LANCACHE_IMAGE_PREFIX: wiki-mod/lancache-ng
          LANCACHE_IMAGE_TAG: ${{ steps.channel.outputs.tag }}
          FULL_SETUP_COMPOSE_OVERRIDE: ${{ env.FULL_SETUP_COMPOSE_OVERRIDE }}
        run: |
          set -euo pipefail
          : "${BUILD_TOOLS_IMAGE:?BUILD_TOOLS_IMAGE is required}"

          # Reuse validate-compose's already smoke-tested, digest-qualified CI toolchain.
          docker run --rm \
            -v "$PWD/deploy/full-setup:/validation:ro" \
            -w /validation \
            --env LANCACHE_IMAGE_REGISTRY \
            --env LANCACHE_IMAGE_PREFIX \
            --env LANCACHE_IMAGE_TAG \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30 --signal=KILL 300 \
            docker compose -f docker-compose.yml -f "${FULL_SETUP_COMPOSE_OVERRIDE:?FULL_SETUP_COMPOSE_OVERRIDE is required}" config >/dev/null

      # What: reserves the validation subnet via a host-local flock.
      # Why: closes a check-then-create race; see the linked issue.
      # From: Issue #1095 | PR #1532
      - name: Reserve a validation subnet and start the stack (locked, retries on collision)
        uses: ./.github/actions/reserve-validation-subnet-stack
        with:
          image-tag: ${{ steps.channel.outputs.tag }}
          compose-override-file: ${{ env.FULL_SETUP_COMPOSE_OVERRIDE }}
          ghcr-retry-username: ${{ github.actor }}
          ghcr-retry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the stack to stabilize and check container health
        uses: ./.github/actions/wait-validation-stack-health

      # What: always dumps logs, unlike the failure-only dump above.
      # Why: a green run must be verifiable as having tested this code.
      # From: Issue #1095 | PR #1619
      - name: Show full-setup service logs
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          echo "::group::Logs from all services"
          docker compose logs --no-color || true
          echo "::endgroup::"

      - name: Run client simulation against the full-setup stack
        env:
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/docker-metadata.sh
          source "$GITHUB_WORKSPACE/scripts/lib/docker-metadata.sh"

          # What: builds the image ref from the single declared GHCR owner/repo.
          # Why: github.repository may be mixed-case; GHCR needs lowercase.
          # From: Issue #1095 (G1) | PR #1503
          FULL_SETUP_CLIENT_TOOLS_IMAGE="ghcr.io/$(dmeta_ghcr_repo)/build-tools:${CHANNEL_TAG}"
          export FULL_SETUP_CLIENT_TOOLS_IMAGE
          scripts/untracked/simulations/full-setup-client-simulation.sh

      - name: Tear down full-setup validation stack
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true

          # `down` above can lose Docker's own "has active endpoints" race (a container-removal
          # API call can return before its network endpoint is actually unwired -- confirmed for
          # real in CI, see validation_project_networks_teardown's own comment in
          # reserve-validation-subnet.sh) and silently leave this project's network(s) non-empty,
          # poisoning them for whichever run reserves this slot next. Wait for and force a real
          # removal instead of trusting `down`'s own exit code.
          # shellcheck source=scripts/lib/reserve-validation-subnet.sh
          source "$GITHUB_WORKSPACE/scripts/lib/reserve-validation-subnet.sh"
          # This step runs unconditionally (`if: always()`), including when
          # the "Reserve a validation subnet and start the stack" step above
          # failed before ever setting COMPOSE_PROJECT_NAME -- under
          # `set -u`, a bare "$COMPOSE_PROJECT_NAME" would abort this whole
          # step with "unbound variable" in exactly that case (confirmed in
          # CI). The safe-default form skips teardown when there is nothing
          # to tear down instead.
          if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
            validation_project_networks_teardown "$COMPOSE_PROJECT_NAME" || true
          fi

          # Release the host-local subnet lock the "Reserve a validation subnet and start the
          # stack" step above acquired, so the slot becomes available to the next run
          # immediately rather than waiting for this whole job's process tree to exit.
          # $VALIDATION_LOCK_HOLDER_PID is only set once that step actually reserved a lock -- if
          # it failed before reaching that point, there is nothing to release.
          if [[ -n "${VALIDATION_LOCK_HOLDER_PID:-}" ]]; then
            kill "$VALIDATION_LOCK_HOLDER_PID" 2>/dev/null || true
          fi

      - name: Clean up exact-digest override
        if: always()
        run: rm -f deploy/full-setup/.ci-exact-digests.yml

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  dns_rust_quality:
    # DNS Rust quality is scoped by detect-changes for PR speed, but workflow changes
    # still force it because the CI contract itself may have changed.
    #
    # Also skipped on a metadata-only pull_request event (labeled/unlabeled/milestoned/
    # demilestoned): those events carry no new commit, so re-running clippy/fmt/check
    # against the exact same tree a prior run already validated would just burn a scarce
    # lancache-heavy slot for a known-identical result. `github.event.action` is read
    # directly off the event context, so this check is safe even when detect-changes did
    # not run for this event.
    name: rust-quality (dns/nats-subscriber)
    needs: detect-changes
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (
          github.event_name != 'pull_request' ||
          needs['detect-changes'].outputs.dns_rust == 'true' ||
          needs['detect-changes'].outputs.workflow == 'true'
        )
      }}
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real warm-cache runs: 31s-3.3min. But this job's own "cargo clippy"
    # step already carries a 35-minute timeout (a deliberately generous
    # bound for sccache/sccache-dist fallback to a full local compile) -- a
    # job-level timeout must exceed every step timeout it contains, or the
    # job would fail before that step's own allowance runs out. 45 minutes
    # covers the clippy step's 35-minute budget plus this job's other steps.
    timeout-minutes: 45
    steps:
      - uses: wiki-mod/lancache-ng/.github/actions/checkout-lock-and-resync@current_dev
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Isolate Rust toolchain paths
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/dns-nats-subscriber'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/dns-nats-subscriber'
          } >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: &dtolnay_rust_toolchain_centraliced_versioning dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure Redis-backed sccache
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-ci-${{ github.job }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: cargo fmt --check (dns/nats-subscriber)
        run: cargo fmt --manifest-path services/dns/nats-subscriber/Cargo.toml -- --check
      - name: cargo check with warnings denied (dns/nats-subscriber)
        uses: ./.github/actions/cargo-with-sccache-fallback
        env:
          RUSTFLAGS: "-D warnings"
        with:
          command: cargo check --locked --all-targets --manifest-path services/dns/nats-subscriber/Cargo.toml
      - name: cargo clippy with warnings denied (dns/nats-subscriber)
        timeout-minutes: 35
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo clippy --locked --all-targets --manifest-path services/dns/nats-subscriber/Cargo.toml -- -D warnings

      - uses: wiki-mod/lancache-ng/.github/actions/release-checkout-lock@current_dev
        if: always()
  ui_rust_quality:
    # UI Rust quality mirrors the DNS job but stays independent so both crates
    # can run in parallel on suitable runners.
    #
    # Also skipped on a metadata-only pull_request event -- see
    # dns_rust_quality's identical comment above for the full reasoning.
    name: rust-quality (ui)
    needs: detect-changes
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
