          grep -F "LANCACHE_IMAGE_TAG=\${LANCACHE_IMAGE_TAG:-latest}" deploy/prod/docker-compose.yml >/dev/null \
            || { echo "::error::Prod UI must receive LANCACHE_IMAGE_TAG."; exit 1; }
          grep -F 'LANCACHE_IMAGE_REGISTRY=${LANCACHE_IMAGE_REGISTRY}' setup.sh >/dev/null \
            || { echo "::error::setup.sh must write LANCACHE_IMAGE_REGISTRY."; exit 1; }
          grep -F 'LANCACHE_IMAGE_PREFIX=${LANCACHE_IMAGE_PREFIX}' setup.sh >/dev/null \
            || { echo "::error::setup.sh must write LANCACHE_IMAGE_PREFIX."; exit 1; }
          grep -F 'LANCACHE_IMAGE_CHANNEL=${lancache_image_channel}' setup.sh >/dev/null \
            || { echo "::error::setup.sh secondary must write LANCACHE_IMAGE_CHANNEL."; exit 1; }
          grep -F 'derive_release_archive_image_tag()' setup.sh >/dev/null \
            || { echo "::error::setup.sh must preserve release archive image tags before defaulting to latest."; exit 1; }
          grep -F 'channel="${channel:-latest}"' setup.sh >/dev/null \
            || { echo "::error::setup.sh must keep latest as the normal stable default; nightly must be explicit."; exit 1; }
          grep -F 'LANCACHE_IMAGE_CHANNEL=latest' README.md >/dev/null \
            || { echo "::error::README must document latest as the normal install default."; exit 1; }
          grep -F 'fresh installs use `LANCACHE_IMAGE_CHANNEL=nightly` by default pre-1.0' docs/release-versioning.md >/dev/null \
            || { echo "::error::Release docs must document nightly as the pre-1.0 default (see #1068 item 1 / #1120)."; exit 1; }
          grep -F 'docker build --pull -t "$fallback_image" "$build_tools_context" >&2' scripts/untracked/select-build-tools-image.sh >/dev/null \
            || { echo "::error::build-tools selector must keep Docker build output out of stdout."; exit 1; }
          bash scripts/untracked/validate-stack-images.sh
          VALIDATE_COMPOSE_IMAGE_CHANNEL_RESOLUTION

      # What: Deliberately its own step, not appended to "Validate compose files" above; do not merge back without re-confirming actionlint still completes.
      # Why: That step's embedded script is already large enough that actionlint's shellcheck integration deadlocks on it -- the exact same awk guards pass instantly in a small isolated script but reliably hang actionlint once embedded in the oversized one, and the unmodified pre-existing script does not hang, confirming a genuine size/threshold interaction in actionlint's own subprocess handling rather than a defect in this shell code.
      # From: Issue #1095 | PR #1532
      - name: Validate channel/branch-model mapping (#825/#1141)
        run: |
          set -euo pipefail

          # What: Checks the branch-model decision (master -> latest, archived vY.X.Z branches -> no live channel), scoped to each branch's own if/elif arm rather than a flat grep -F for the channel_tags line alone.
          # Why: A flat grep would pass even if a regression kept both literal strings in the file but tied them to the wrong branch; current_dev's own mapping is superseded by the guard below, which carries the current invariant.
          # From: Issue #1095 | PR #1532
          if ! awk '
            /if \[\[ "\$GITHUB_REF" = "refs\/heads\/master" \]\]; then/ { in_branch=1; next }
            in_branch && /^ *elif/ { in_branch=0 }
            in_branch && /channel_tags\+=\(latest\)/ { found=1 }
            END { exit found ? 0 : 1 }
          ' .github/workflows/build-push.yml; then
            echo "::error::Master promotion must publish the latest channel."
            exit 1
          fi
          # What: Fails if a current_dev push regresses back to auto-publishing the nightly channel -- the mirror image of the guard above, which instead fails if the mapping is missing.
          # Why: nightly is now a real once-daily scheduled/dispatch-only, green-gated channel (see the promote job's own "Branch-to-channel mapping" comment), so a plain current_dev push must not move it anymore.
          # From: Issue #1095 | PR #1532
          if awk '
            /elif \[\[ "\$GITHUB_REF" = "refs\/heads\/current_dev" \]\]; then/ { in_branch=1; next }
            in_branch && /^ *elif/ { in_branch=0 }
            in_branch && /channel_tags\+=\(nightly\)/ { found=1 }
            END { exit found ? 0 : 1 }
          ' .github/workflows/build-push.yml; then
            echo "::error::current_dev push must no longer auto-publish the nightly channel (#1254/#1255 -- nightly is promoted only via the scheduled/manual channel-input dispatch path, see nightly-refresh.yml)."
            exit 1
          fi
          # What: Checks that nightly-refresh.yml exists.
          # Why: Without it, removing the current_dev auto-publish above would leave nightly never refreshed at all -- a silent full outage of the pre-1.0 default channel, not merely slower staleness.
          # From: Issue #1095 | PR #1532
          if [[ ! -f .github/workflows/nightly-refresh.yml ]]; then
            echo "::error::nightly-refresh.yml is missing; nightly would never be promoted once current_dev pushes stop auto-publishing it (#1254/#1255)."
            exit 1
          fi
          # What: Explicit if/! instead of a chained `A && B && C || D`.
          # Why: shellcheck SC2015 flags that chained shape as not real if-then-else, since D can also run when an earlier `&&` term fails to execute for an unrelated reason, not just when the check's condition is false -- a real, if narrow, correctness footgun AG-VAL-001 ("warnings are errors") does not carve out an exception for.
          # From: Issue #1095 | PR #1532
          if ! { grep -F 'build-push.yml' .github/workflows/nightly-refresh.yml >/dev/null \
              && grep -F 'current_dev' .github/workflows/nightly-refresh.yml >/dev/null \
              && grep -F 'channel=nightly' .github/workflows/nightly-refresh.yml >/dev/null; }; then
            echo "::error::nightly-refresh.yml must dispatch build-push.yml against current_dev with channel=nightly (#1254/#1255)."
            exit 1
          fi
          # What: Scoped to the promote job's own channel_tags=() ... 0-tags-check block, not a flat file-wide grep -F.
          # Why: A flat search for this exact literal would also match this guard's own source line a few lines above, making the check tautologically fail on every run regardless of the real promote logic.
          # From: Issue #1095 | PR #1532
          if ! awk '
            /^ *channel_tags=\(\)$/ { in_scope=1; next }
            in_scope && /if \(\( \$\{#channel_tags\[@\]\} == 0 \)\)/ { in_scope=0 }
            in_scope && /elif \[\[ "\$GITHUB_REF" = refs\/heads\/v\[0-9\]\* \]\]; then/ { found=1 }
            END { exit found ? 1 : 0 }
          ' .github/workflows/build-push.yml; then
            echo "::error::Archived vY.X.Z release branches must not publish a live channel tag; the old 'dev' channel mapping was retired (#825/#1141)."
            exit 1
          fi

