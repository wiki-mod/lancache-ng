  ci_scope_policy:
    # Central policy reconciliation for PR path filtering. Individual jobs may skip for
    # speed, but this job verifies that every required check really ran for the files
    # touched by the PR. It has its own job-level cancel-in-progress group (below), same as
    # build/container-scan/build-arm64 (#891) -- nothing else hard-asserts its result via
    # `needs:`, only build/build-arm64's soft `if:` gate, which cleanly skips on cancelled.
    #
    # The hazard the push-event tolerance below addresses is PUSH-event parallelism, not
    # the PR-metadata storm: the top-level group fully serializes pull_request runs for the
    # same ref (cancel-in-progress: false, confirmed live on #915), so the PR-event branch
    # of the script stays strict and untouched. push/tag events use a run_id-suffixed
    # top-level key that never collides, so rapid pushes run fully in parallel with no
    # top-level throttle -- THAT is where #915/#891 gave rust_coverage/shellcheck/
    # file-headers/line-endings/ci_scope_policy/validate-compose/dns_test/ui_test/
    # dns_cargo_audit/ui_cargo_audit their own per-job cancel-in-progress groups, letting a
    # newer push cancel an older one's copy mid-flight. Those jobs are deliberately NOT on
    # the channel publish path, so #979 left their cancel-on-push groups in place
    # (reclaiming runners at no freshness cost) and this job tolerates the resulting
    # `cancelled`/`skipped` outcomes on push instead of hard-failing on them -- see the
    # per-job comments on each of those jobs for the concurrency-group side of this.
    #
    # (#979) validate-compose is now pull_request-only for cancellation (a hard
    # publish-path gate), so its old `skipped`-cascade onto dns_test/ui_test/
    # watchdog_test/dns_cargo_audit/ui_cargo_audit can no longer fire on push.
    # dns_test/ui_test/dns_cargo_audit/ui_cargo_audit still use
    # require_success_or_intentional_cancellation() (a direct `cancelled` from their own
    # groups is still possible); watchdog_test has no group of its own, so on push it now
    # only shows `success` -- its require_success_or_intentional_skip() helper stays as
    # pull_request-path tolerance only.
    #
    # The hazard this addresses is PUSH-event parallelism, not the PR-metadata
    # storm. This workflow's top-level concurrency group (top of file)
    # already fully serializes pull_request-triggered runs for the same ref
    # (`{workflow}-{ref}`, cancel-in-progress: false): a burst of opened +
    # labeled + milestoned events for one PR queues each run behind the
    # previous one rather than running them concurrently, so two PR runs for
    # the same ref can never have an in-progress job for the same job-level
    # group at the same time -- confirmed live on #915, and re-confirmed live
    # for this revision's five newly-scoped jobs the same way. That
    # serialization is why the PR-event branch of the script below is left
    # untouched and stays strict (see below).
    #
    # push/tag events are different: the top-level group's key for those is
    # `{workflow}-publish-{run_id}` (unique per run, deliberately never
    # collides -- see that group's own comment), so rapid pushes to
    # master/v0.2.0 genuinely run fully in parallel with no top-level
    # throttle at all. THAT is where a job-level cancel-in-progress group on
    # dns_test/ui_test/dns_cargo_audit/ui_cargo_audit lets a newer push cancel
    # an older, still in-progress push's copy of that job mid-flight. Those
    # four jobs are deliberately NOT on the channel publish path (nothing
    # in `build`'s `if:` needs them), so #979 left their cancel-on-push groups
    # in place: reclaiming a superseded push's copy saves scarce runners at no
    # freshness cost, and this job just has to tolerate the resulting
    # `cancelled` result.
    #
    # (#979 update) validate-compose used to be the sharpest case here --
    # cancelling IT forced dns_test/ui_test/watchdog_test/dns_cargo_audit/
    # ui_cargo_audit to `skipped` via their `needs['validate-compose'].result
    # == 'success'` guard. It is now pull_request-only for cancellation (it is
    # a hard publish-path gate; see its own comment), so on push it always
    # completes and that `skipped` cascade can no longer fire on push.
    #
    # Fix: on the push-event branch below, dns_test/ui_test/dns_cargo_audit/
    # ui_cargo_audit still use require_success_or_intentional_cancellation()
    # (success|skipped|cancelled) because they can still show a direct
    # `cancelled` from their own cancel-on-push groups. watchdog_test used to
    # not get its own group, tolerating only `success`/`skipped` on push via
    # require_success_or_intentional_skip() -- see the 2026-08 watchdog Rust
    # CI wiring update below for why that changed.
    #
    # (#1095 update) dns_test/ui_test/dns_cargo_audit/ui_cargo_audit now have a
    # SECOND legitimate `skipped` source on push, independent of the
    # concurrency-cancellation one above: detect-changes runs on push events too
    # (not just pull_request), and these four jobs' own `if:` gates skip on a
    # push that did not touch the relevant crate (nor the workflow) -- the PR
    # that produced that push already ran and passed them (AG-WF-004), so the
    # skip reuses that known-good result. require_success_or_intentional_cancellation()
    # already tolerates `skipped`, so it covers this new source with no change;
    # this note just records that on push a `skipped` here can now mean
    # "path-scoped out by detect-changes" as well as "superseded mid-flight".
    # rust_coverage stays unconditional for the badge (still runs the crates'
    # tests under tarpaulin regardless), so this change does not touch its
    # tolerance. watchdog_test WAS also NOT path-scoped on push at this point
    # in the file's history -- see the 2026-08 watchdog Rust CI wiring update
    # below for why that is no longer true.
    #
    # dns_rust_quality/ui_rust_quality were, at this point in the file's
    # history, deliberately left on strict require_success(): they were not in
    # #891's enumerated candidate list (PR #915 explicitly flagged them, and
    # watchdog_test, as out of scope so they would not be silently mistaken
    # for "already considered and rejected"), and neither depends on
    # validate-compose -- only on detect-changes, which never runs on push --
    # so nothing at that point gave them a legitimate way to show anything but
    # `success` on a push event. That reasoning about dns_rust_quality/
    # ui_rust_quality themselves is still accurate today; only the "clean,
    # separate, mechanically identical follow-up if ever wanted" framing is
    # superseded, since watchdog_rust_quality (added below) IS now exactly
    # that follow-up, applied to the new watchdog crate rather than to dns/ui.
    #
    # (2026-08 watchdog Rust CI wiring update) services/watchdog/Cargo.toml
    # was added (#1355), so watchdog gained the same three-job Rust shape
    # dns/ui already had: watchdog_rust_quality (fmt/check/clippy, strict
    # require_success() on push, exactly like dns_rust_quality/ui_rust_quality
    # above -- no group, does not depend on validate-compose), watchdog_test
    # (now ALSO compiles and runs `cargo test`, so it gained its own
    # cancel-on-push concurrency group and moved to
    # require_success_or_intentional_cancellation() on push, matching dns_test/
    # ui_test exactly instead of the require_success_or_intentional_skip()
    # tolerance described above, which was correct only for its old
    # shell-check-only shape), and watchdog_cargo_audit (prebuilt cargo-audit
    # binary, no compilation, same cancel-on-push group shape and
    # require_success_or_intentional_cancellation() tolerance as
    # dns_cargo_audit/ui_cargo_audit). watchdog_test is also now path-scoped on
    # push the same way dns_test/ui_test are (detect-changes' `watchdog`/
    # `workflow` outputs), which it was NOT before this update -- a plain push
    # that does not touch services/watchdog/ or the workflow contract now
    # reuses the PR's already-passing result instead of recompiling.
    #
    # detect-changes stays excluded from concurrency scoping for the same
    # reason #915 already found: it only runs
    # `if: github.event_name == 'pull_request'` (never on push, so the push
    # hazard above does not apply to it), and on pull_request it is already
    # serialization-protected by the top-level group. A group would be a
    # pure no-op there, so it is left out because it gains nothing, not
    # because it is unsafe. Its own require_success() check below (PR-branch
    # only) is therefore also left strict, unchanged.
    name: CI scope policy
    needs:
      - detect-changes
      - dns_rust_quality
      - ui_rust_quality
      - watchdog_rust_quality
      - dns_test
      - ui_test
      - watchdog_test
      - dns_cargo_audit
      - ui_cargo_audit
      - watchdog_cargo_audit
    if: always()
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs: 7-14s (this job only reads its upstream needs' results and
    # runs a policy script; no compilation or Docker work of its own). Same
    # 15-minute floor as detect-changes above.
    timeout-minutes: 15
    # cancel-in-progress is pull_request-only -- see `build`'s group comment for the
    # full #979 rationale. build/build-arm64 require
    # `needs.ci_scope_policy.result == 'success'` unconditionally, so on push this is a
    # hard gate on the channel publish path: cancelling it in a merge cascade makes the
    # build path skip and starves the channel. The push-branch tolerance logic below
    # already lets THIS job reach `success` despite its upstream test jobs being
    # superseded, so it stays a reliable gate as long as it is not itself cancelled --
    # exactly what cancel false on push guarantees. On a PR, build/build-arm64 cleanly
    # skip a cancelled ci_scope_policy, so cancelling a superseded run there is safe.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-ci-scope-policy-{1}-{2}', github.workflow, github.ref, github.run_id) ||
          format('{0}-ci-scope-policy-{1}', github.workflow, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # This job never checked out the repo itself (#901): its only file read (the grep
      # below) relied entirely on whatever another job on the same self-hosted runner
      # happened to leave in the shared `_work` workspace directory. Under real concurrent
      # load that workspace can hold a different, unrelated run's checkout -- or nothing at
      # all -- producing both a false "file not found" failure and, worse, a silent false
      # pass/fail against the wrong commit's content. Every other job in this workflow
      # already checks out its own commit; this was the one that didn't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce scoped CI gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DETECT_RESULT: ${{ needs['detect-changes'].result }}
          DNS_RUST_CHANGED: ${{ needs['detect-changes'].outputs.dns_rust }}
          UI_CHANGED: ${{ needs['detect-changes'].outputs.ui }}
          WATCHDOG_CHANGED: ${{ needs['detect-changes'].outputs.watchdog }}
          WORKFLOW_CHANGED: ${{ needs['detect-changes'].outputs.workflow }}
          DOCS_CHANGED: ${{ needs['detect-changes'].outputs.docs }}
          DOCS_ONLY: ${{ needs['detect-changes'].outputs.docs_only }}
          GOVERNANCE_CHANGED: ${{ needs['detect-changes'].outputs.governance }}
          SETUP_RUNTIME_CHANGED: ${{ needs['detect-changes'].outputs.setup_runtime }}
          DEPLOY_CHANGED: ${{ needs['detect-changes'].outputs.deploy }}
          RELEASE_CONTRACT_CHANGED: ${{ needs['detect-changes'].outputs.release_contract }}
          SCRIPTS_CHANGED: ${{ needs['detect-changes'].outputs.scripts }}
          DNS_RUST_QUALITY_RESULT: ${{ needs.dns_rust_quality.result }}
          UI_RUST_QUALITY_RESULT: ${{ needs.ui_rust_quality.result }}
          WATCHDOG_RUST_QUALITY_RESULT: ${{ needs.watchdog_rust_quality.result }}
          DNS_TEST_RESULT: ${{ needs.dns_test.result }}
          UI_TEST_RESULT: ${{ needs.ui_test.result }}
          WATCHDOG_TEST_RESULT: ${{ needs.watchdog_test.result }}
          DNS_CARGO_AUDIT_RESULT: ${{ needs.dns_cargo_audit.result }}
          UI_CARGO_AUDIT_RESULT: ${{ needs.ui_cargo_audit.result }}
          WATCHDOG_CARGO_AUDIT_RESULT: ${{ needs.watchdog_cargo_audit.result }}
        run: |
          set -euo pipefail

          # The "- name:" prefix and the [S] character class are both load-bearing:
          # this grep's own command text lives inside the very file it searches, so
          # a plain literal pattern always matches this line itself and the guard
          # could never fail, even with validate-compose's Buildx step removed or
          # renamed. [S] matches only a literal "S", while this line spells the
          # bracketed class, so the only possible hit is the real step definition.
          grep -n -- "- name: [S]et up Docker Buildx for manifest inspection" .github/workflows/build-push.yml >/dev/null || {
            echo "::error::validate-compose must set up Buildx before resolving digest-qualified build-tools images."
            exit 1
          }

          require_boolean() {
            local name="$1" value="$2"
            case "$value" in
              true|false)
                ;;
              *)
                echo "::error::detect-changes output '$name' must be true or false, got '${value:-<empty>}'."
                exit 1
                ;;
            esac
          }

          require_success() {
            local name="$1" value="$2"
            if [ "$value" != "success" ]; then
              echo "::error::$name must succeed for this change set, got '$value'."
              exit 1
            fi
          }

          require_success_or_intentional_skip() {
            local name="$1" value="$2"
            case "$value" in
              success|skipped)
                ;;
              *)
                echo "::error::$name may only be skipped by the PR path filter, got '$value'."
                exit 1
                ;;
            esac
          }

          # #891 follow-up: dns_test/ui_test/dns_cargo_audit/ui_cargo_audit
          # each now carry their own job-level cancel-in-progress group (see
          # their own job blocks), and validate-compose (a shared `needs:` of
          # all of them, plus watchdog_test) does too. On a push event this
          # means a newer push can legitimately leave an older, superseded
          # run showing either a direct `cancelled` (the job's own group lost
          # the race) or a `skipped` cascade (validate-compose was cancelled,
          # so this job's own `needs['validate-compose'].result == 'success'`
          # guard evaluated false). Both are a clean supersession outcome,
          # not a real failure, so this dedicated helper (mirroring the
          # existing require_success_or_intentional_skip() naming) tolerates
          # all three: success, skipped, or cancelled. It is intentionally
          # NOT used for dns_rust_quality/ui_rust_quality/watchdog_rust_quality
          # (no group, no validate-compose dependency -- see the job-level
          # comment above for why these three stay on strict
          # require_success()). watchdog_test and watchdog_cargo_audit (added
          # alongside watchdog_rust_quality, 2026-08 watchdog Rust CI wiring
          # update) DO use this helper now, on the same reasoning as their
          # dns/ui counterparts: both carry their own cancel-on-push
          # concurrency group and depend on validate-compose, so both can show
          # a direct `cancelled` or the validate-compose `skipped` cascade.
          # watchdog_test's shell-only predecessor could only ever show the
          # validate-compose skip cascade, never a direct `cancelled` (no
          # group of its own) -- that older, narrower case is what
          # require_success_or_intentional_skip() below remains the precise
          # tool for, on jobs that still have no group of their own.
          require_success_or_intentional_cancellation() {
            local name="$1" value="$2"
            case "$value" in
              success|skipped|cancelled)
                ;;
              *)
                echo "::error::$name must succeed for this change set, or show a clean supersession outcome (skipped/cancelled) from a newer push superseding it, got '$value'."
                exit 1
                ;;
            esac
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            require_success "rust-quality (dns/nats-subscriber)" "$DNS_RUST_QUALITY_RESULT"
            require_success "rust-quality (ui)" "$UI_RUST_QUALITY_RESULT"
            require_success "rust-quality (watchdog)" "$WATCHDOG_RUST_QUALITY_RESULT"
            require_success_or_intentional_cancellation "test (dns/nats-subscriber)" "$DNS_TEST_RESULT"
            require_success_or_intentional_cancellation "test (ui)" "$UI_TEST_RESULT"
            require_success_or_intentional_cancellation "test (watchdog)" "$WATCHDOG_TEST_RESULT"
            require_success_or_intentional_cancellation "cargo-audit (dns/nats-subscriber)" "$DNS_CARGO_AUDIT_RESULT"
            require_success_or_intentional_cancellation "cargo-audit (ui)" "$UI_CARGO_AUDIT_RESULT"
            require_success_or_intentional_cancellation "cargo-audit (watchdog)" "$WATCHDOG_CARGO_AUDIT_RESULT"
            exit 0
          fi

          require_success "detect changed paths" "$DETECT_RESULT"

          for output in \
            DNS_RUST_CHANGED \
            UI_CHANGED \
            WATCHDOG_CHANGED \
            WORKFLOW_CHANGED \
            DOCS_CHANGED \
            DOCS_ONLY \
            GOVERNANCE_CHANGED \
            SETUP_RUNTIME_CHANGED \
            DEPLOY_CHANGED \
            RELEASE_CONTRACT_CHANGED \
            SCRIPTS_CHANGED
          do
            require_boolean "$output" "${!output}"
          done

          # dns_rust_quality/dns_test/dns_cargo_audit (and the UI/watchdog
          # equivalents) are now additionally gated in their own job `if:` on
          # the PR event's `action`: labeled/unlabeled/milestoned/demilestoned
          # carry no new commit, so those jobs deliberately skip on such an
          # event even when the diff itself would otherwise mark the crate as
          # changed (that diff was already validated by the
          # opened/synchronize/reopened/ready_for_review run for this exact
          # commit). Fail-safe default of true (content event) mirrors the
          # rest of this file's posture of running the full pipeline whenever
          # a classification is uncertain, rather than silently skipping for
          # an event type not in this known metadata-only list.
          content_event=true
          case "$EVENT_ACTION" in
            labeled|unlabeled|milestoned|demilestoned)
              content_event=false
              ;;
          esac

          dns_rust_required=false
          ui_required=false
          watchdog_required=false
          if [ "$content_event" = "true" ]; then
            if [ "$WORKFLOW_CHANGED" = "true" ]; then
              dns_rust_required=true
              ui_required=true
              watchdog_required=true
            fi
            if [ "$DNS_RUST_CHANGED" = "true" ]; then
              dns_rust_required=true
            fi
            if [ "$UI_CHANGED" = "true" ]; then
              ui_required=true
            fi
            if [ "$WATCHDOG_CHANGED" = "true" ]; then
              watchdog_required=true
            fi
          fi
          # (2026-08 watchdog Rust CI wiring update) watchdog_required used to
          # be computed separately below, deliberately NOT gated on
          # content_event, because the old shell-only watchdog_test ran on
          # the lancache-light tier at a few seconds' cost -- cheap enough
          # that skipping it only on a metadata-only event bought nothing.
          # Now that watchdog_rust_quality/watchdog_test/watchdog_cargo_audit
          # compile the crate on the scarce lancache-heavy pool (the same
          # cost dns/ui already paid), watchdog_required is folded into the
          # content_event-gated block above so it follows the exact same
          # rule dns_rust_required/ui_required do, instead of the separate,
          # always-on check this file used to have here.

          if [ "$dns_rust_required" = "true" ]; then
            require_success "rust-quality (dns/nats-subscriber)" "$DNS_RUST_QUALITY_RESULT"
            require_success "test (dns/nats-subscriber)" "$DNS_TEST_RESULT"
            require_success "cargo-audit (dns/nats-subscriber)" "$DNS_CARGO_AUDIT_RESULT"
          else
            require_success_or_intentional_skip "rust-quality (dns/nats-subscriber)" "$DNS_RUST_QUALITY_RESULT"
            require_success_or_intentional_skip "test (dns/nats-subscriber)" "$DNS_TEST_RESULT"
            require_success_or_intentional_skip "cargo-audit (dns/nats-subscriber)" "$DNS_CARGO_AUDIT_RESULT"
          fi

          if [ "$ui_required" = "true" ]; then
            require_success "rust-quality (ui)" "$UI_RUST_QUALITY_RESULT"
            require_success "test (ui)" "$UI_TEST_RESULT"
            require_success "cargo-audit (ui)" "$UI_CARGO_AUDIT_RESULT"
          else
            require_success_or_intentional_skip "rust-quality (ui)" "$UI_RUST_QUALITY_RESULT"
            require_success_or_intentional_skip "test (ui)" "$UI_TEST_RESULT"
            require_success_or_intentional_skip "cargo-audit (ui)" "$UI_CARGO_AUDIT_RESULT"
          fi

          if [ "$watchdog_required" = "true" ]; then
            require_success "rust-quality (watchdog)" "$WATCHDOG_RUST_QUALITY_RESULT"
            require_success "test (watchdog)" "$WATCHDOG_TEST_RESULT"
            require_success "cargo-audit (watchdog)" "$WATCHDOG_CARGO_AUDIT_RESULT"
          else
            require_success_or_intentional_skip "rust-quality (watchdog)" "$WATCHDOG_RUST_QUALITY_RESULT"
            require_success_or_intentional_skip "test (watchdog)" "$WATCHDOG_TEST_RESULT"
            require_success_or_intentional_skip "cargo-audit (watchdog)" "$WATCHDOG_CARGO_AUDIT_RESULT"
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice::Docs-only PR: heavy Rust and Docker checks may be skipped, but unconditional policy checks still ran."
          fi
          if [ "$GOVERNANCE_CHANGED" = "true" ]; then
            echo "::notice::Governance files changed; keep review focused on project rules, not only generated artifacts."
          fi
          if [ "$SETUP_RUNTIME_CHANGED" = "true" ] || [ "$DEPLOY_CHANGED" = "true" ] || [ "$RELEASE_CONTRACT_CHANGED" = "true" ]; then
            echo "::notice::Runtime/deploy/release contract files changed; validate-compose remains the lightweight project-wide guard."
          fi

  container-scan:
    # Never runs on `pull_request` (see `if:` below) -- PRs exercise Dockerfiles via
    # `build` below with no vulnerability scan; that gap is separate and untouched here.
    #
    # UPDATED (issue #1095, closes finding G8 / originally #1348): used to unconditionally
    # `docker buildx build --load` its own throwaway, never-pushed image per changed
    # service, then scan THAT -- a second, independent build of the same commit that
    # `build`/`build-arm64` also build and push moments later. A fresh `docker buildx
    # build` stamps a new `created` timestamp every time, so the two never share a digest
    # even for byte-identical inputs: "kit 678/345/675 goes in, kit 654 comes out" --
    # this job's scan verdict was never about the artifact actually shipped. `build`/
    # `build-arm64`'s own "Scan pushed service digest with Trivy" step (Step 3, all 8
    # services) already scans the EXACT pushed digest, so the throwaway rebuild bought no
    # provenance, only redundant compute. That branch ("should-scan == true" below) is
    # removed: a changed service now only pays for the cheap reuse-eligibility check
    # above, and the pushed-digest scan in build/build-arm64 is the sole real gate.
    #
    # The OTHER branch ("should-scan == false", Step 4 / #1331 / #1339, G11 via #1467)
    # is untouched: when a service is proven unchanged there is no new build to scan, so
    # this job Trivy-scans the already-published channel image by digest instead.
    #
    # UPDATED (issue #1290): this used to be a bare `if:` relying on GitHub's implicit
    # `&& success()`, which was safe only while `validate-compose` and (since #1095 Part
    # 1) `push-supersession-check` stayed root jobs with no `if:`/`needs:` of their own.
    # Adding `determine-push-reuse-scope` to `needs:` below breaks that invariant: its own
    # `if:` only fires on `push` to a branch ref, so it legitimately shows `skipped` on
    # pull_request/schedule/workflow_dispatch/tag-push -- and implicit success() treats a
    # skipped need exactly like a failed one, which would have silently skipped
    # container-scan (and weakened the build gate) on every one of those events. Hardened
    # below to explicitly tolerate `determine-push-reuse-scope` showing either `success`
    # or `skipped`, matching the same fail-safe idiom used for the four Rust jobs'
    # detect-changes dependency elsewhere. `validate-compose` and
    # `push-supersession-check` both remain plain root jobs with no `if:`/`needs:`, so
    # neither can ever legitimately show `skipped` -- checked for plain `success` below,
    # not the success-or-skipped tolerance `determine-push-reuse-scope` needs. INVARIANT:
    # the plain `== 'success'` checks hold ONLY while both stay root jobs. If either ever
    # gains an `if:`/`needs:` that can skip, widen its own check here to match.
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs['validate-compose'].result == 'success' &&
        needs['push-supersession-check'].result == 'success' &&
        (needs['determine-push-reuse-scope'].result == 'success' || needs['determine-push-reuse-scope'].result == 'skipped')
      }}
    needs: [validate-compose, push-supersession-check, determine-push-reuse-scope]
    # Job-level concurrency (#888): keyed per matrix row (service + platform) and per
    # ref. cancel-in-progress is pull_request-only -- see `build`'s group comment for the
    # full #979 rationale. On push, `build`'s `if:` requires
    # `needs['container-scan'].result == 'success'`, so this scan is a hard gate on the
    # channel publish path: cancelling it in a merge cascade starves the channel. On a PR
    # it is safe to cancel a superseded scan -- it never builds locally (G8 fix) and at
    # most reads a remote image (never pushes), so `build` cleanly skips it via `needs`.
    #
    # `workflow_dispatch` runs and reruns (`github.run_attempt != '1'`) keep their own
    # run_id-suffixed key so a manual retrigger or rerun cannot be confused with a
    # genuinely superseded push; on push/tag the flag is false anyway.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-container-scan-{1}-{2}-{3}-{4}', github.workflow, matrix.service, matrix.platform_tag, github.ref, github.run_id) ||
          format('{0}-container-scan-{1}-{2}-{3}', github.workflow, matrix.service, matrix.platform_tag, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Runner selector kept aligned with build/build-arm64's own per-arch split even
    # though this job no longer builds anything (G8 fix): the surviving "should-scan ==
    # false" branch's registry pull + Trivy scan still benefits from the same split, and
    # one shared convention beats a second, independently-tuned selector.
    runs-on: ${{ fromJSON(matrix.runner) }}
    # Post-G8-fix timing: a changed service ("should-scan == true") only runs the cheap
    # reuse-eligibility check and finishes in seconds; an unchanged service ("should-scan
    # == false") pulls the channel image and Trivy-scans it, same cost as always. 60
    # minutes gives headroom for a cold layer cache or vuln-DB refresh on that branch,
    # neither of which
    # shows up in the warm-cache samples above; still far under build's own
    # 150-minute bound for the same class of work at full multi-arch scale.
    timeout-minutes: 60
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # G8 fix (issue #1095): this job no longer builds anything, so `context`,
          # `build_contexts`, `description`, and `platform` (only ever consumed by the
          # now-removed throwaway-build step) are dropped from this matrix entirely --
          # only `service`/`platform_tag`/`runner` are still read below. Runner tiers are
          # kept in sync manually with `build`'s own matrix (see that job's comment for
          # the full light/heavy measured-cost rationale, AG-CI-002): the surviving
          # "should-scan == false" branch's registry pull + Trivy scan still benefits
          # from the same split as the real build, even though this job itself no longer
          # builds anything to measure a compile cost for.
          - service: proxy
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dns
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: watchdog
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dhcp
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dhcp-proxy
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ntp
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: syslog
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ui
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: build-tools
            platform_tag: amd64
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: proxy
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: dns
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: watchdog
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: dhcp
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: dhcp-proxy
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: ntp
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: syslog
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: ui
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
          - service: build-tools
            platform_tag: arm64
            runner: '"ubuntu-24.04-arm"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine per-service publish scan reuse
        # Step 3 (issue #1095): generalizes what used to be build-tools-only
        # ("Enable build-tools publish scan", issue #1290) to every matrix.service. No
        # service unconditionally builds a local throwaway image just to scan it on every
        # trusted-ref push when determine-push-reuse-scope has already proven it is safe to
        # reuse the published channel image instead. This reads determine-push-reuse-scope's
        # `reuse_<service>` output -- the SAME already-verified three-part decision (channel
        # image revision label + real git ancestry + a real content diff via
        # scripts/classify-image-impact.sh) that build/build-arm64's own retag-vs-rebuild
        # decision trusts -- rather than a second, weaker, independently-computed check.
        # Consuming the SAME decision matters concretely: a narrower check could say
        # "unchanged" while the wider one correctly falls back to a real rebuild (channel
        # image stale/unverifiable, the #808 failure shape), and if that happened with two
        # independently-computed checks, a freshly rebuilt-and-published image could go
        # completely unscanned this run. Sharing one decision makes that disagreement
        # structurally impossible -- this is what closes the scan-coverage hole named in
        # issue #1095's own "Correction 1": since should-scan and should-build are both
        # derived from the identical output per service, neither can go to false while the
        # other stays true. Fails safe to a full scan whenever determine-push-reuse-scope did
        # not run or did not succeed, matching this job's own hardened `if:`.
        id: push-scan-changes
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          REUSE_JOB_RESULT: ${{ needs['determine-push-reuse-scope'].result }}
          REUSE_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_proxy }}
          REUSE_DNS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dns }}
          REUSE_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_watchdog }}
          REUSE_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp }}
          REUSE_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp_proxy }}
          REUSE_NTP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ntp }}
          REUSE_UI: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ui }}
          REUSE_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_build_tools }}
        run: |
          set -euo pipefail

          # Mirrors build/build-arm64's own "Determine whether this service
          # needs building" case mapping exactly -- single source for which
          # reuse_* output belongs to which matrix.service, not a second copy
          # that could drift out of sync with it.
          case "$MATRIX_SERVICE" in
            proxy) reuse="$REUSE_PROXY" ;;
            dns) reuse="$REUSE_DNS" ;;
            watchdog) reuse="$REUSE_WATCHDOG" ;;
            dhcp) reuse="$REUSE_DHCP" ;;
            dhcp-proxy) reuse="$REUSE_DHCP_PROXY" ;;
            ntp) reuse="$REUSE_NTP" ;;
            ui) reuse="$REUSE_UI" ;;
            build-tools) reuse="$REUSE_BUILD_TOOLS" ;;
            *) reuse="false" ;;
          esac

          if [ "$REUSE_JOB_RESULT" = "success" ] && [ "$reuse" = "true" ]; then
            should_scan=false
            echo "::notice::determine-push-reuse-scope confirmed $MATRIX_SERVICE is unchanged and safe to reuse this push; skipping the local rebuild and scanning the unchanged published channel image directly instead."
          else
            should_scan=true
            echo "::notice::determine-push-reuse-scope result was '$REUSE_JOB_RESULT' (reuse='$reuse' for $MATRIX_SERVICE); scan stays enabled, scanning a freshly built local image."
          fi
          echo "should-scan=$should_scan" >> "$GITHUB_OUTPUT"

      # A changed service ("should-scan == true") does nothing further in this job (G8
      # fix, issue #1095): no local build, no local scan. build/build-arm64's own "Scan
      # pushed service digest with Trivy" step is the sole scan for that case.

      - name: Self-heal Trivy's own default cache directory ownership
        # Real incident (2026-08-03): trivy-action's own default cache dir
        # (~/.cache/trivy) was found owned by root:root on a self-hosted
        # runner, causing "permission denied" opening trivy.db and failing
        # container-scan for that matrix row.
        # Host-level ownership/setgid was fixed directly on all runner hosts
        # (2026-08-03), but that alone does not survive the directory itself
        # being wiped and recreated from scratch by some future root-run
        # process, which would not inherit the setgid bit from a directory
        # that no longer exists. This step makes the job itself self-healing
        # regardless of host history: tolerant of the directory not existing
        # yet (first-ever run on a host), safe to run every time.
        run: |
          set -euo pipefail
          trivy_home_cache="${HOME}/.cache/trivy"
          if [ -d "$trivy_home_cache" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$trivy_home_cache"
            find "$trivy_home_cache" -type d -exec chmod g+s {} +
          fi

      # Companion to "Determine per-service publish scan reuse" above (originally issue
      # #1290, build-tools-only; generalized to every service by Step 3, issue #1095):
      # when a service is unchanged this run, no local image was built to scan, but the
      # point of scanning at all is to catch a newly disclosed CVE in the already-published
      # channel image -- skipping the scan entirely would defeat that, so this scans the
      # same digest build/build-arm64's own "Retag unchanged service image" steps retag
      # from. No registry write happens here -- this job never gained `packages:`
      # permissions and doesn't need them for a read-only scan.
      - name: Resolve channel image for unchanged-scan retag
        id: channel-image
        # push-supersession-check gate (issue #1095 Part 1): a push that is
        # already superseded before this job started has no reason to pay
        # for a Trivy scan either -- the newer push that supersedes it runs
        # this same step for real.
        if: steps.push-scan-changes.outputs.should-scan == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          # #1095 F-21: consume determine-push-reuse-scope's own already-pinned,
          # already-verified digest instead of independently re-resolving the mutable
          # channel tag a second time here -- the digest TOCTOU race two Codex review
          # threads on PR #1378 found (a channel refresh between that job's verification
          # and this job's own later, independent re-resolution could scan a different
          # image than what was proven safe/than build/build-arm64 end up retagging). No
          # registry call is needed here anymore: the digest is already immutable and
          # already verified.
          DIGEST_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_proxy }}
          DIGEST_DNS: ${{ needs['determine-push-reuse-scope'].outputs.digest_dns }}
          DIGEST_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_watchdog }}
          DIGEST_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp }}
          DIGEST_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp_proxy }}
          DIGEST_NTP: ${{ needs['determine-push-reuse-scope'].outputs.digest_ntp }}
          DIGEST_UI: ${{ needs['determine-push-reuse-scope'].outputs.digest_ui }}
          DIGEST_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.digest_build_tools }}
        run: |
          set -euo pipefail

          # Mirrors "Determine per-service publish scan reuse" above's own case mapping --
          # single source for which digest_* output belongs to which matrix.service.
          case "$MATRIX_SERVICE" in
            proxy) digest="$DIGEST_PROXY" ;;
            dns) digest="$DIGEST_DNS" ;;
            watchdog) digest="$DIGEST_WATCHDOG" ;;
            dhcp) digest="$DIGEST_DHCP" ;;
            dhcp-proxy) digest="$DIGEST_DHCP_PROXY" ;;
            ntp) digest="$DIGEST_NTP" ;;
            ui) digest="$DIGEST_UI" ;;
            build-tools) digest="$DIGEST_BUILD_TOOLS" ;;
            *) digest="" ;;
          esac

          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "::error::determine-push-reuse-scope reported reuse=true for $MATRIX_SERVICE but did not export a pinned digest -- refusing to scan an unverified reference." >&2
            exit 1
          fi
          image="ghcr.io/${{ github.repository }}/${MATRIX_SERVICE}@${digest}"
          echo "::notice::$MATRIX_SERVICE is unchanged on this push; scanning $image (the exact digest determine-push-reuse-scope already pinned and verified) instead of rebuilding it."
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # UTC-day bucket for the scan-result cache below (issue #1095, G11): bounds how
      # long an unchanged digest can skip a real Trivy re-scan, so a newly disclosed
      # CVE against it is still caught within a day instead of never. Computed once
      # here (not inside the composite action) so the freshness policy stays a plain,
      # reviewable line in this workflow rather than hidden inside a reusable action.
      - name: Compute scan-result cache freshness bucket
        if: steps.push-scan-changes.outputs.should-scan == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        id: scan-cache-bucket
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # A multi-platform image-ref: Trivy/Docker resolve it to the runner's own native
      # platform automatically. G11 fix: skips the scan below entirely when this exact
      # digest already scanned clean today (see .github/actions/trivy-scan-with-cache).
      - name: Scan channel image with Trivy (no rebuild)
        if: steps.push-scan-changes.outputs.should-scan == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        uses: ./.github/actions/trivy-scan-with-cache
        with:
          image-ref: ${{ steps.channel-image.outputs.image }}
          digest: ${{ steps.channel-image.outputs.digest }}
          cache-key-scope: ${{ matrix.service }}-${{ matrix.platform_tag }}
          freshness-bucket: ${{ steps.scan-cache-bucket.outputs.value }}
          # vuln-db-cache-dir intentionally omitted (G8 fix removed this job's own
          # managed cache dir): trivy-action falls back to its own default
          # (~/.cache/trivy), which "Self-heal Trivy's own default cache directory
          # ownership" above already keeps writable.

  determine-push-reuse-scope:
    # Step 4 (issue #1095): decides, once per push (not once per build/build-arm64/
    # per-arch matrix row), whether each allowlisted product service can safely retag its
    # already-published channel image instead of paying for a real rebuild+rescan this
    # run. This job exists as a SEPARATE job -- not inline in build/build-arm64's own
    # "Determine whether this service needs building" step -- for one load-bearing
    # reason: the verification this decision requires (sif_is_ancestor_or_equal, and a
    # real content diff via scripts/classify-image-impact.sh from the channel image's own
    # build commit) needs full git history, and build/build-arm64's own checkouts use the
    # default shallow clone. Running the decision here once, with the one job in this
    # push path that already has full history, means build and build-arm64 both just read
    # a plain true/false output -- provably agreeing with each other without either
    # needing its own deep checkout or duplicating the verification logic per arch.
    #
    # See scripts/lib/push-reuse.sh's own header comment for the full rationale of WHY a
    # channel image (not the immediately-preceding push's own predecessor commit) is the
    # reuse source, and why ancestry alone (without the content diff) is not sufficient
    # evidence of "safe to reuse" -- issue #1095's own "C-7" finding and issue #1290's
    # corrected implementation converge on this same three-part verification.
    name: determine push reuse scope (Step 4)
    needs: detect-changes
    # Branches only -- a release tag push has no meaningful "channel" to
    # reuse from (github.event.before is meaningless for the first push of a
    # new tag, and AG-CI-010 already requires release tags to always build
    # the tag-scoped build-tools image fresh; the same reasoning applies to
    # every other service here). Release tags always get a full, fresh
    # build/scan -- no reuse path at all.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real cost here is a handful of registry reads (docker buildx imagetools
    # inspect, twice per allowlisted service) plus one classify-image-impact.sh
    # invocation per service -- the same "cheap self-hosted script job" class
    # as detect-changes itself (6-17s real). 15 minutes matches that job's
    # own floor for the same reason: generous, round, and still turns any
    # future hang into a fast, bounded failure rather than genuinely needed
    # headroom.
    timeout-minutes: 15
    permissions:
      contents: read
      # Read-only: this job only inspects already-published images, it never
      # pushes or retags anything itself (build/build-arm64 do the actual
      # `imagetools create` retag, each for its own arch, once this job's
      # decision says it's safe to).
      packages: read
    outputs:
      reuse_proxy: ${{ steps.decide.outputs.reuse_proxy }}
      reuse_dns: ${{ steps.decide.outputs.reuse_dns }}
      reuse_ui: ${{ steps.decide.outputs.reuse_ui }}
      reuse_watchdog: ${{ steps.decide.outputs.reuse_watchdog }}
      reuse_dhcp: ${{ steps.decide.outputs.reuse_dhcp }}
      reuse_dhcp_proxy: ${{ steps.decide.outputs.reuse_dhcp_proxy }}
      reuse_ntp: ${{ steps.decide.outputs.reuse_ntp }}
      reuse_build_tools: ${{ steps.decide.outputs.reuse_build_tools }}
      # #1095 F-21: the exact immutable manifest-list digest this job pinned
      # AND verified reuse safety against, for every service that came back
      # reuse=true -- empty for a service that stayed reuse=false. Every
      # downstream consumer (container-scan, build, build-arm64) reads this
      # instead of independently re-resolving the mutable channel tag a
      # second (or third, fourth) time, which is the digest TOCTOU race two
      # Codex review threads on PR #1378 found: a channel refresh between
      # this job's own verification and a much-later downstream job's
      # independent re-resolution could scan/retag a different image than
      # the one just proven safe. Because the verification (sif_image_revision
      # + ancestry + content diff, all in scripts/lib/push-reuse.sh) now runs
      # against this exact pinned digest reference rather than the mutable
      # tag, the verified bytes and the exported bytes are provably
      # identical -- there is no gap for the channel to move in between.
      digest_proxy: ${{ steps.decide.outputs.digest_proxy }}
      digest_dns: ${{ steps.decide.outputs.digest_dns }}
      digest_ui: ${{ steps.decide.outputs.digest_ui }}
      digest_watchdog: ${{ steps.decide.outputs.digest_watchdog }}
      digest_dhcp: ${{ steps.decide.outputs.digest_dhcp }}
      digest_dhcp_proxy: ${{ steps.decide.outputs.digest_dhcp_proxy }}
      digest_ntp: ${{ steps.decide.outputs.digest_ntp }}
      digest_build_tools: ${{ steps.decide.outputs.digest_build_tools }}
    steps:
      # fetch-depth: 0 (not the default shallow depth-1 clone) so
      # sif_is_ancestor_or_equal below can prove real git ancestry between a
      # channel image's build commit (which may be many commits behind
      # github.sha -- nightly is only refreshed once daily/on-demand, see
      # scripts/lib/push-reuse.sh's header) and github.sha itself. Same
      # requirement, same fix, as detect-changes' own fetch-depth: 0
      # checkout a few jobs up in this same file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        # Without this, the registry reads below pull anonymously -- a much lower GHCR rate
        # limit that has already failed for real under concurrent CI load in this exact
        # workflow (see "Resolve compose validation image"'s own comment earlier in this
        # file for the confirmed incident: "denied: denied" under a real push burst). This
        # job exists specifically to help with burst/push-cost behavior, so skipping this
        # login would risk reintroducing the exact class of failure it's meant to reduce.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide per-service push reuse
        id: decide
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_CHANGED: ${{ needs['detect-changes'].outputs.workflow }}
          PROXY_CHANGED: ${{ needs['detect-changes'].outputs.proxy }}
          DNS_CHANGED: ${{ needs['detect-changes'].outputs.dns_image }}
          UI_CHANGED: ${{ needs['detect-changes'].outputs.ui }}
          WATCHDOG_CHANGED: ${{ needs['detect-changes'].outputs.watchdog }}
          DHCP_CHANGED: ${{ needs['detect-changes'].outputs.dhcp }}
          DHCP_PROXY_CHANGED: ${{ needs['detect-changes'].outputs.dhcp_proxy }}
          NTP_CHANGED: ${{ needs['detect-changes'].outputs.ntp }}
          BUILD_TOOLS_CHANGED: ${{ needs['detect-changes'].outputs.build_tools }}
          # #1095 F-21: needed both for push_reuse_decide's own sif_image_revision
          # call (now ghcr_retry-wrapped, see scripts/lib/staging-image-freshness.sh)
          # and for this step's own digest-pinning read below.
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # shellcheck source=scripts/lib/staging-image-freshness.sh
          source "$GITHUB_WORKSPACE/scripts/lib/staging-image-freshness.sh"
          # shellcheck source=scripts/lib/push-reuse.sh
          source "$GITHUB_WORKSPACE/scripts/lib/push-reuse.sh"
          # resolve_build_tools_channel is plain ref-to-channel-name mapping (master ->
          # latest, everything else -> nightly) with nothing build-tools-specific in its actual
          # logic despite this file's name -- reused as-is here rather than duplicating the
          # same mapping a second time (the "single-source CI logic, no silent second copy"
          # concern issue #1095 itself names as a risk for this refactor).
          # shellcheck source=scripts/lib/build-tools-channel.sh
          source "$GITHUB_WORKSPACE/scripts/lib/build-tools-channel.sh"

          channel="$(resolve_build_tools_channel "$REF_NAME")"
          echo "::notice::Resolved channel '$channel' for ref '$REF_NAME'."

          # Step 4 allowlist (issue #1095): all 8 first-party product/tooling
          # services go through the identical decide_one() call below, with
          # no per-service branching -- each gets the same three-part
          # verification (channel image revision label + real git ancestry +
          # a real content diff via scripts/classify-image-impact.sh) that
          # scripts/lib/push-reuse.sh's own header documents in full.
          # build-tools shares this same allowlist (rather than keeping the
          # separate, hand-rolled verification it originally had, built
          # independently and in parallel with this job before the
          # duplication between the two was noticed) so there is exactly one
          # implementation of this check in the codebase, not two drifting
          # copies. Real push-path verification status (which services have
          # actually been observed taking the positive reuse=true retag
          # branch on a live push, as opposed to only ever having been
          # exercised in tests) belongs in the PR/issue trail, not here --
          # see issue #1095's own comment history for current status.
          allowlist=(proxy dns ui watchdog dhcp dhcp-proxy ntp build-tools)

          is_allowlisted() {
            case " ${allowlist[*]} " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # decide_one <classify_key> <matrix_service> <before_sha_changed>
          #
          # <before_sha_changed> is detect-changes' own before..sha verdict for this service --
          # a cheap pre-check that lets a service known to have changed in THIS push skip the
          # registry round-trip entirely (it must rebuild regardless of channel state; see
          # push-reuse.sh's header for why "changed since revision" is a strict superset of
          # "changed since before" whenever revision precedes before, which the channel's own
          # once-daily refresh cadence guarantees in practice).
          #
          # Writes this service's own digest_<service>=<digest> line straight to
          # $GITHUB_OUTPUT (not returned via stdout alongside the true/false verdict) whenever
          # reuse is safe -- #1095 F-21's digest-pinning fix (see this job's own `outputs:`
          # comment above for the full TOCTOU-race rationale). Prints only "true"/"false" on
          # stdout, unchanged, so the existing `$(decide_one ...)` capture pattern below still
          # works exactly as before.
          decide_one() {
            local classify_key="$1" matrix_service="$2" before_sha_changed="$3"
            local output_key="${matrix_service//-/_}"

            if [ "$WORKFLOW_CHANGED" = "true" ]; then
              echo "::notice::$matrix_service: a build-affecting workflow file changed this push; not attempting reuse." >&2
              printf 'false\n'
              return
            fi
            if [ "$before_sha_changed" != "false" ]; then
              echo "::notice::$matrix_service: detect-changes reports this service changed since the immediately preceding push; not attempting reuse (a real rebuild is needed regardless of channel state)." >&2
              printf 'false\n'
              return
            fi
            if ! is_allowlisted "$matrix_service"; then
              echo "::notice::$matrix_service: not yet in the Step 4 allowlist; building normally." >&2
              printf 'false\n'
              return
            fi

            local channel_image="ghcr.io/${REPOSITORY}/${matrix_service}:${channel}"

            # Resolve the channel tag to its immutable manifest-list digest ONCE, right here,
            # before any verification -- not independently, later, by container-scan/build/
            # build-arm64 (the digest TOCTOU race; see this job's own `outputs:` comment
            # above). push_reuse_decide below then verifies safety (revision label + ancestry
            # + content diff) against this EXACT pinned reference instead of the mutable tag,
            # so the verified bytes and the exported bytes are provably identical.
            local digest
            digest="$(ghcr_retry ghcr.io "${GHCR_RETRY_USERNAME:-}" "${GHCR_RETRY_PASSWORD:-}" -- docker buildx imagetools inspect "$channel_image" --format '{{json .Manifest.Digest}}' 2>/dev/null)" || digest=""
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" == "null" ]]; then
              echo "::notice::$matrix_service: could not resolve a manifest digest for $channel_image; not attempting reuse (failing closed to a real rebuild)." >&2
              printf 'false\n'
              return
            fi

            local pinned_ref="ghcr.io/${REPOSITORY}/${matrix_service}@${digest}"
            local reuse
            reuse="$(push_reuse_decide "$classify_key" "$pinned_ref" "$COMMIT_SHA")"
            if [ "$reuse" = "true" ]; then
              printf 'digest_%s=%s\n' "$output_key" "$digest" >> "$GITHUB_OUTPUT"
            fi
            printf '%s\n' "$reuse"
          }

          {
            printf 'reuse_proxy=%s\n' "$(decide_one proxy proxy "$PROXY_CHANGED")"
            printf 'reuse_dns=%s\n' "$(decide_one dns_image dns "$DNS_CHANGED")"
            printf 'reuse_ui=%s\n' "$(decide_one ui ui "$UI_CHANGED")"
            printf 'reuse_watchdog=%s\n' "$(decide_one watchdog watchdog "$WATCHDOG_CHANGED")"
            printf 'reuse_dhcp=%s\n' "$(decide_one dhcp dhcp "$DHCP_CHANGED")"
            printf 'reuse_dhcp_proxy=%s\n' "$(decide_one dhcp_proxy dhcp-proxy "$DHCP_PROXY_CHANGED")"
            printf 'reuse_ntp=%s\n' "$(decide_one ntp ntp "$NTP_CHANGED")"
            printf 'reuse_build_tools=%s\n' "$(decide_one build_tools build-tools "$BUILD_TOOLS_CHANGED")"
          } >> "$GITHUB_OUTPUT"

  build:
    # Same-repository candidates keep their pushed digest through scan and downstream assembly.
    # Metadata-only PR events reuse the prior commit because they carry no new image content.
    needs:
      - shellcheck
      - validate-compose
      - container-scan
      - detect-changes
      - determine-push-reuse-scope
      - ci_scope_policy
      - file-headers
      - compose-healthchecks
      - pr-template-check
      - pr-tracking-metadata-check
      - pr-title-convention-check
      - line-endings
      - push-supersession-check
    if: >-
      ${{
        always() &&
        needs.shellcheck.result == 'success' &&
        needs['validate-compose'].result == 'success' &&
        needs.ci_scope_policy.result == 'success' &&
        needs['line-endings'].result == 'success' &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (github.event_name == 'pull_request' || needs['container-scan'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['file-headers'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['compose-healthchecks'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['pr-template-check'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['pr-tracking-metadata-check'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['pr-title-convention-check'].result == 'success')
      }}
    # Compile-heavy services use heavy capacity; lighter image assembly stays on light runners.
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 150
    # Obsolete PR builds may be cancelled to reclaim runners; push/tag candidates must survive for publication.
    # Dispatches and reruns include the run id so separate attempts cannot cancel each other.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-build-{1}-{2}-{3}', github.workflow, matrix.service, github.ref, github.run_id) ||
          format('{0}-build-{1}-{2}', github.workflow, matrix.service, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: &normal-build-services
          # Package/COPY-only images use light runners; compile-heavy services stay on heavy capacity.
          # Re-evaluate a service tier if its Dockerfile gains real compile or link work.
          - service: proxy
            context: services/proxy
            # Proxy needs DNS domain data that lives outside its own build context.
            build_contexts: dns-domains=services/dns
            description: &ci-description-proxy "nginx-based lancache-ng caching proxy for standard and TLS-interception cache traffic."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dns
            context: services/dns
            build_contexts: ""
            description: &ci-description-dns "PowerDNS recursor, authoritative DNS, and NATS subscriber service for lancache-ng cache routing."
            rust: true
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: watchdog
            context: services/watchdog
            build_contexts: ""
            description: &ci-description-watchdog "lancache-ng watchdog helper for runtime health checks and recovery hooks."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dhcp
            context: services/dhcp
            build_contexts: ""
            description: &ci-description-dhcp "Kea DHCP, control-agent, and DHCP-DDNS service for lancache-ng managed networks."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: dhcp-proxy
            context: services/dhcp-proxy
            build_contexts: ""
            description: &ci-description-dhcp-proxy "dnsmasq-based DHCP proxy and relay helper for lancache-ng deployments."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ntp
            context: services/ntp
            build_contexts: ""
            description: &ci-description-ntp "chrony-based NTP server for lancache-ng, disciplined against public NTP servers and serving LAN clients on UDP/123."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: syslog
            context: services/syslog
            build_contexts: ""
            description: &ci-description-syslog "Combined fluent-bit + syslog-ng first-party central logging service for lancache-ng (issue #1428)."
            runner: '["self-hosted", "linux", "lancache", "lancache-light"]'
          - service: ui
            context: services/ui
            build_contexts: ""
            description: &ci-description-ui "lancache-ng Admin UI and control-plane service for cache, DNS, DHCP, and secondary management."
            rust: true
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'
          - service: build-tools
            context: tools/build-tools
            build_contexts: ""
            description: &ci-description-build-tools "Prebuilt lancache-ng CI and developer validation toolchain image."
            runner: '["self-hosted", "linux", "lancache", "lancache-heavy"]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine whether this service needs building
        id: should-build
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          DETECT_CHANGES_RESULT: ${{ needs['detect-changes'].result }}
          SUPERSEDED: ${{ needs['push-supersession-check'].outputs.superseded }}
          # Step 4 (issue #1095): determine-push-reuse-scope's own `if:`
          # only fires on `push` to a branch ref (see that job), so its
          # `result` is legitimately 'skipped' on pull_request/schedule/
          # workflow_dispatch -- checked explicitly below (fail-safe to a
          # real build) rather than assumed success.
          REUSE_JOB_RESULT: ${{ needs['determine-push-reuse-scope'].result }}
          REUSE_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_proxy }}
          REUSE_DNS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dns }}
          REUSE_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_watchdog }}
          REUSE_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp }}
          REUSE_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp_proxy }}
          REUSE_NTP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ntp }}
          REUSE_UI: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ui }}
          REUSE_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_build_tools }}
        run: |
          set -euo pipefail

          should_build=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
              echo "::error::Pull request build scoping requires detect-changes to succeed, got '$DETECT_CHANGES_RESULT'."
              exit 1
            fi
            case "$MATRIX_SERVICE" in
              proxy) should_build="${{ needs['detect-changes'].outputs.proxy }}" ;;
              dns) should_build="${{ needs['detect-changes'].outputs.dns_image }}" ;;
              watchdog) should_build="${{ needs['detect-changes'].outputs.watchdog }}" ;;
              dhcp) should_build="${{ needs['detect-changes'].outputs.dhcp }}" ;;
              dhcp-proxy) should_build="${{ needs['detect-changes'].outputs.dhcp_proxy }}" ;;
              ntp) should_build="${{ needs['detect-changes'].outputs.ntp }}" ;;
              syslog) should_build="${{ needs['detect-changes'].outputs.syslog }}" ;;
              ui) should_build="${{ needs['detect-changes'].outputs.ui }}" ;;
              build-tools) should_build="${{ needs['detect-changes'].outputs.build_tools }}" ;;
              *)
                echo "::error::Unknown matrix service '$MATRIX_SERVICE' has no path-scoping mapping."
                exit 1
                ;;
            esac
            if [ "${{ needs['detect-changes'].outputs.workflow }}" = "true" ] && [ "$MATRIX_SERVICE" != "build-tools" ]; then
              should_build=true
            fi
          elif [ "$REUSE_JOB_RESULT" = "success" ]; then
            # Step 4 (issue #1095): determine-push-reuse-scope already did the real
            # verification (channel image revision label + git ancestry + a real content diff)
            # for whichever services are currently allowlisted. Every other service's reuse_*
            # output is unconditionally 'false' from that job, so this case is a plain
            # pass-through, not a second copy of that job's decision logic. build-tools (issue
            # #1290) is allowlisted here too -- it used to have its own dedicated `elif` branch
            # with a hand-rolled copy of this exact same three-part verification, built
            # independently and in parallel with this job before the duplication was noticed;
            # folding it into the shared allowlist removes that copy instead of keeping two
            # implementations of the same check in sync by hand. syslog (issue #1428) is NOT
            # allowlisted here -- widening Step 4's reuse allowlist is a separate, maintainer-
            # gated decision (see #1095); the `*) reuse="false"` fallback below already gives
            # syslog the same safe default every not-yet-allowlisted service gets: always a
            # real rebuild, never a silent retag.
            case "$MATRIX_SERVICE" in
              proxy) reuse="$REUSE_PROXY" ;;
              dns) reuse="$REUSE_DNS" ;;
              watchdog) reuse="$REUSE_WATCHDOG" ;;
              dhcp) reuse="$REUSE_DHCP" ;;
              dhcp-proxy) reuse="$REUSE_DHCP_PROXY" ;;
              ntp) reuse="$REUSE_NTP" ;;
              ui) reuse="$REUSE_UI" ;;
              build-tools) reuse="$REUSE_BUILD_TOOLS" ;;
              *) reuse="false" ;;
            esac
            if [ "$reuse" = "true" ]; then
              should_build=false
            fi
          fi

          # Issue #1095 Part 1 (Option B): on push, a newer commit may have already superseded
          # this one before this job even started (see push-supersession-check's own comment).
          # Applies uniformly to every service, including build-tools. Deliberately placed
          # AFTER both branches above (not folded into either) so it can override should_build
          # back to false regardless of which branch set it true, and deliberately does NOT
          # apply on pull_request (build/container-scan already get real per-commit
          # cancellation there via their own job-level concurrency groups, not this check).
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$SUPERSEDED" = "true" ]; then
            echo "::notice::A newer push to $GITHUB_REF has already superseded this run; skipping $MATRIX_SERVICE's build so only the run already targeting the current tip does the heavy work."
            should_build=false
          fi

          case "$should_build" in
            true|false)
              ;;
            *)
              echo "::error::Build scope for $MATRIX_SERVICE must resolve to true or false, got '${should_build:-<empty>}'."
              exit 1
              ;;
          esac

          if [ "$should_build" = "true" ]; then
            echo "::notice::$MATRIX_SERVICE inputs changed (or this is not a pull request); image build remains enabled."
          else
            echo "::notice::$MATRIX_SERVICE inputs did not change in this pull request; skipping routine image rebuild."
          fi
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"

      # Widened to also cover a Step 4 push-reuse-only path (should-build
      # == 'false' but matrix.service is a push-reusable service on a push
      # event, not a pull_request skip): "Retag unchanged service image for
      # this commit" below needs a real builder the same way an actual
      # build/push would, even though it never invokes `docker buildx
      # build`. Mirrors issue #1290's identical widening for build-tools's
      # own retag-only path.
      - name: Set up Docker Buildx
        if: >-
          ${{
            steps.should-build.outputs.should-build == 'true' ||
            (github.event_name == 'push' && steps.should-build.outputs.should-build == 'false')
          }}
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        # Pull requests now also log in: this same-repo-only project (no fork PRs, confirmed
        # in #626) pushes a PR-scoped staging tag below so "validate full-setup image" can
        # test the PR's own commits instead of stale base-branch state. The fork check is a
        # fail-safe in case that assumption ever stops holding -- a fork PR's GITHUB_TOKEN is
        # read-only anyway, so login would fail loudly rather than silently. Dependabot PRs
        # get the same read-only-token treatment as fork PRs (GitHub docs: Dependabot Actions
        # runs never get a write-scoped GITHUB_TOKEN) -- excluded explicitly so this step
        # (and the push below) is skipped cleanly instead of attempting a login/push GitHub
        # would reject with a 403. Also widened for a Step 4 push-reuse-only path, same
        # reasoning as "Set up Docker Buildx" immediately above.
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true' ||
              (github.event_name == 'push' && steps.should-build.outputs.should-build == 'false')
            ) &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4 (issue #1095): generalized to whichever service this matrix row is
      # currently building, including build-tools (issue #1290) -- determine-push-
      # reuse-scope already did the real verification, so this step only needs to resolve
      # the pinned digest's own linux/amd64 child digest and retag it. No rebuild, no
      # recompilation needed here. No separate Trivy scan needed here either: container-
      # scan's "Determine per-service publish scan reuse" step reads this exact same
      # determine-push-reuse-scope decision for every service, so whenever this step's own
      # should-build is false for a service, container-scan's "Scan channel image with
      # Trivy (no rebuild)" step already scanned that exact digest directly this run.
      # Because both steps read the identical output, the two decisions cannot disagree,
      # so no service is ever left without a real scan on this path.
      #
      # #1095 F-21: resolves the linux/amd64 child digest from determine-push-reuse-scope's
      # own already-pinned, already-verified manifest-list digest (DIGEST_*) instead of
      # independently re-resolving the mutable channel tag here -- the digest TOCTOU race
      # two Codex review threads on PR #1378 found. This registry read is now against an
      # IMMUTABLE digest reference, so no matter when it runs, it cannot observe different
      # content than what was verified -- unlike the old mutable-tag read, this closes the
      # race rather than merely shrinking its window.
      #
      # push-supersession-check gate (issue #1095 Part 1, added here by #1095 F-21):
      # "Determine whether this service needs building" above forces should-build to
      # 'false' for EVERY service on a superseded push, regardless of whether
      # determine-push-reuse-scope ever verified (and pinned a digest for) this specific
      # service -- unlike a genuine reuse=true case, a superseded push's DIGEST_* output
      # for this service can legitimately be empty. Without this guard, this step would
      # still run, find no pinned digest, and hard-fail via the empty-digest check below,
      # where the pre-#1095-F-21 code merely (silently, and separately not-quite-safely)
      # retagged from the mutable tag directly. Matches container-scan's own "Resolve
      # channel image for unchanged-scan retag" step, which already carries this same
      # condition for the identical reason.
      - name: Retag unchanged service image for this commit (linux/amd64, no rebuild)
        if: github.event_name == 'push' && steps.should-build.outputs.should-build == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          MATRIX_SERVICE: ${{ matrix.service }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_proxy }}
          DIGEST_DNS: ${{ needs['determine-push-reuse-scope'].outputs.digest_dns }}
          DIGEST_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_watchdog }}
          DIGEST_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp }}
          DIGEST_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp_proxy }}
          DIGEST_NTP: ${{ needs['determine-push-reuse-scope'].outputs.digest_ntp }}
          DIGEST_UI: ${{ needs['determine-push-reuse-scope'].outputs.digest_ui }}
          DIGEST_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.digest_build_tools }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required on this runner for the Step 4 retag-only path."
            exit 1
          }

          case "$MATRIX_SERVICE" in
            proxy) pinned_digest="$DIGEST_PROXY" ;;
            dns) pinned_digest="$DIGEST_DNS" ;;
            watchdog) pinned_digest="$DIGEST_WATCHDOG" ;;
            dhcp) pinned_digest="$DIGEST_DHCP" ;;
            dhcp-proxy) pinned_digest="$DIGEST_DHCP_PROXY" ;;
            ntp) pinned_digest="$DIGEST_NTP" ;;
            ui) pinned_digest="$DIGEST_UI" ;;
            build-tools) pinned_digest="$DIGEST_BUILD_TOOLS" ;;
            *) pinned_digest="" ;;
          esac
          if [ -z "$pinned_digest" ]; then
            echo "::error::determine-push-reuse-scope reported reuse=true for $MATRIX_SERVICE but did not export a pinned digest -- refusing to retag from an unverified reference."
            exit 1
          fi
          pinned_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${pinned_digest}"

          short_sha="${COMMIT_SHA::7}"
          target="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}:sha-${short_sha}-amd64"

          manifest_json="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$pinned_ref" --raw)"
          amd64_digest="$(printf '%s' "$manifest_json" | jq -r '[.manifests[]? | select(.platform.architecture == "amd64" and .platform.os == "linux")][0].digest // empty')"
          if [ -z "$amd64_digest" ]; then
            echo "::error::Could not find a linux/amd64 manifest for $pinned_ref; refusing to retag $MATRIX_SERVICE -- this would leave promote without a valid amd64 source image for this commit."
            exit 1
          fi

          source_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${amd64_digest}"
          echo "::notice::$MATRIX_SERVICE is unchanged on this push (Step 4, verified via scripts/lib/push-reuse.sh); retagging $source_ref (from the pinned digest $pinned_ref) as $target instead of rebuilding."
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create --tag "$target" "$source_ref"

      - name: Extract metadata
        # This job only ever publishes the linux/amd64 leg of each service
        # image, under a platform-suffixed tag. The merge-manifests job below
        # combines this tag with build-arm64's linux/arm64 tag into the real
        # sha-<commit> multi-platform tag that promote/release/setup.sh
        # actually consume -- see docs/self-hosted-actions-runner.md.
        if: steps.should-build.outputs.should-build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-amd64

      # Uses github.sha (the actual checked-out/built commit), NOT docker/metadata-action's
      # `type=sha` output above and NOT the PR branch's own head commit. For a
      # pull_request event, github.sha is the synthetic merge commit -- head merged into
      # the base branch's tip AT THE TIME OF THIS EVENT -- and that is exactly the property
      # needed here: it changes whenever the actual built content changes, even if the PR's
      # own head commit doesn't, and it stays the same across a re-run of the identical
      # event. Tagging by the PR head SHA alone let two different events for the same head,
      # merged against two different base states, collide on one tag -- and since this
      # workflow's concurrency group does not cancel in-progress PR runs, a slower/older run
      # could overwrite a newer run's tag with different image content after the fact. The
      # `pr-<N>-` prefix lets the GC workflow (gc-pr-staging-images.yml) find and reap this
      # once the PR closes. The `-amd64` suffix matches this job's own per-arch tag
      # convention; merge-manifests combines it with build-arm64's `-arm64` PR staging tag
      # into the real pr-<N>-sha-<short> multi-platform tag full-setup-validate consumes.
      - name: Compute PR staging tag
        id: pr-tag
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.should-build.outputs.should-build == 'true' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
          MATRIX_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          short_sha="${BUILD_SHA::7}"
          tag="pr-${PR_NUMBER}-sha-${short_sha}-amd64"
          echo "::notice::This PR's linux/amd64 staging tag for $MATRIX_SERVICE is $tag."
          {
            printf 'tag=%s\n' "$tag"
            printf 'image=ghcr.io/%s/%s:%s\n' "${{ github.repository }}" "$MATRIX_SERVICE" "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: matrix.service == 'build-tools' && steps.should-build.outputs.should-build == 'true'
        run: |
          set -euo pipefail

          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare local Buildx cache
        if: steps.should-build.outputs.should-build == 'true'
        id: buildx-cache
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_READ: ${{ runner.temp }}/lancache-ng-buildx-cache/${{ matrix.service }}-read
          BUILDX_CACHE_DEST: ${{ runner.temp }}/lancache-ng-buildx-cache/${{ matrix.service }}-new
        run: |
          set -euo pipefail

          if ! command -v flock >/dev/null 2>&1; then
            echo "::error::flock is required for safe local Buildx cache locking."
            exit 1
          fi

          cache_dir="$BUILDX_CACHE_ROOT/${{ matrix.service }}"
          lock_file="$BUILDX_CACHE_ROOT/${{ matrix.service }}.lock"

          mkdir -p "$BUILDX_CACHE_ROOT"
          rm -rf "$BUILDX_CACHE_READ" "$BUILDX_CACHE_DEST"
          mkdir -p "$BUILDX_CACHE_READ" "$(dirname "$BUILDX_CACHE_DEST")"

          (
            flock -x 9
            mkdir -p "$cache_dir"
            cp -a "$cache_dir/." "$BUILDX_CACHE_READ/"
          ) 9>"$lock_file"

          {
            echo "cache-from=$BUILDX_CACHE_READ"
            echo "cache-to=$BUILDX_CACHE_DEST"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Docker build parallelism
        if: steps.should-build.outputs.should-build == 'true'
        id: docker-build-jobs
        run: |
          set -euo pipefail

          if [ -n "${CARGO_BUILD_JOBS:-}" ]; then
            case "$CARGO_BUILD_JOBS" in
              ''|*[!0-9]*)
                echo "::error::CARGO_BUILD_JOBS must be a positive integer."
                exit 1
                ;;
            esac
            if [ "$CARGO_BUILD_JOBS" -le 0 ]; then
              echo "::error::CARGO_BUILD_JOBS must be greater than zero."
              exit 1
            fi
            jobs="$CARGO_BUILD_JOBS"
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from repository variable for Docker builds."
          else
            detected_cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
            jobs=$((detected_cores - 2))
            if [ "$jobs" -lt 4 ]; then
              jobs=4
            fi
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from $detected_cores detected cores for Docker builds."
          fi

          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      # Issue #1147: tools/build-tools/Dockerfile's apt-get-install/apt-get-upgrade RUN
      # step is fed from this job's persistent local Buildx cache with no wall-clock
      # expiry, so a Debian security fix published after that layer was first cached
      # (confirmed for real: bind9-libs/bind9-dnsutils/bind9-host stayed vulnerable for
      # weeks after the fix shipped to trixie-security) never gets picked up. A value that
      # changes once per ISO week, passed as build-tools's APT_CACHE_BUST build-arg below,
      # forces that one layer to re-run weekly without busting it on every push.
      - name: Compute apt cache-bust value
        if: steps.should-build.outputs.should-build == 'true'
        id: apt-cache-bust
        run: |
          set -euo pipefail
          echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Prepare Rust acceleration secret files
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true'
            ) &&
            matrix.rust == true &&
            github.actor != 'dependabot[bot]' &&
            github.event_name != 'pull_request'
          }}
        id: sccache-secret
        env:
          SCCACHE_REDIS_MODE: ${{ vars.SCCACHE_REDIS_MODE }}
          SCCACHE_REDIS_URL: ${{ secrets.SCCACHE_REDIS_URL }}
          SCCACHE_DIST_SCHEDULER_URL: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          SCCACHE_DIST_AUTH_TOKEN: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
          DISTCC_POTENTIAL_HOSTS: ${{ vars.DISTCC_POTENTIAL_HOSTS }}
        run: |
          set -euo pipefail

          mode="${SCCACHE_REDIS_MODE:-required}"
          secret_files=()

          toml_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          case "$mode" in
            required|optional|off)
              ;;
            *)
              echo "::error::SCCACHE_REDIS_MODE must be one of: required, optional, off."
              exit 1
              ;;
          esac

          sccache_enabled=1
          redis_enabled=1
          if [ "$mode" = "off" ]; then
            sccache_enabled=0
            redis_enabled=0
            echo "Redis-backed sccache is disabled by SCCACHE_REDIS_MODE=off."
          fi

          if [ "$sccache_enabled" = "1" ] && [ -n "$SCCACHE_DIST_SCHEDULER_URL" ] && [ -z "$SCCACHE_DIST_AUTH_TOKEN" ]; then
            echo "::error::SCCACHE_DIST_AUTH_TOKEN is required when SCCACHE_DIST_SCHEDULER_URL is set."
            exit 1
          fi

          if [ "$sccache_enabled" = "1" ] && [ -z "$SCCACHE_DIST_SCHEDULER_URL" ] && [ -n "$SCCACHE_DIST_AUTH_TOKEN" ]; then
            echo "::error::SCCACHE_DIST_SCHEDULER_URL is required when SCCACHE_DIST_AUTH_TOKEN is set."
            exit 1
          fi

          if [ "$sccache_enabled" = "1" ] && [ -z "$SCCACHE_REDIS_URL" ]; then
            if [ "$mode" = "optional" ]; then
              echo "Skipping Redis-backed sccache because SCCACHE_REDIS_URL is empty and SCCACHE_REDIS_MODE=optional."
              redis_enabled=0
            else
              echo "::error::SCCACHE_REDIS_URL repository secret is required for trusted Rust image builds so sccache can use Redis."
              exit 1
            fi
          fi

          umask 077
          if [ "$redis_enabled" = "1" ]; then
            redis_file="${{ runner.temp }}/sccache-redis-url"
            printf '%s' "$SCCACHE_REDIS_URL" > "$redis_file"
            secret_files+=("sccache_redis_url=$redis_file")
            echo "redis-file=$redis_file" >> "$GITHUB_OUTPUT"
          fi

          # This job only ever builds linux/amd64 (see build-arm64 for the
          # native arm64 leg), so dist/distcc acceleration -- LAN-only
          # infrastructure tied to the self-hosted amd64 runner pool -- is
          # unconditionally applicable here.
          if [ "$sccache_enabled" = "1" ] && [ -n "$SCCACHE_DIST_SCHEDULER_URL" ]; then
            dist_config_file="${{ runner.temp }}/sccache-dist-config"
            {
              printf '[dist]\n'
              printf 'scheduler_url = "%s"\n' "$(toml_escape "$SCCACHE_DIST_SCHEDULER_URL")"
              printf 'toolchains = []\n'
              printf 'toolchain_cache_size = 5368709120\n'
              printf '\n[dist.auth]\n'
              printf 'type = "token"\n'
              printf 'token = "%s"\n' "$(toml_escape "$SCCACHE_DIST_AUTH_TOKEN")"
            } > "$dist_config_file"
            secret_files+=("sccache_dist_config=$dist_config_file")
            echo "dist-config-file=$dist_config_file" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$DISTCC_POTENTIAL_HOSTS" ]; then
            if ! printf '%s\n' "$DISTCC_POTENTIAL_HOSTS" | grep -q ',cpp'; then
              echo "::error::DISTCC_POTENTIAL_HOSTS must include at least one pump-capable host with the ',cpp' option."
              exit 1
            fi

            distcc_hosts_file="${{ runner.temp }}/distcc-potential-hosts"
            printf '%s' "$DISTCC_POTENTIAL_HOSTS" > "$distcc_hosts_file"
            secret_files+=("distcc_potential_hosts=$distcc_hosts_file")
            echo "distcc-hosts-file=$distcc_hosts_file" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "secret-files<<SECRET_FILES"
            printf '%s\n' "${secret_files[@]}"
            echo "SECRET_FILES"
          } >> "$GITHUB_OUTPUT"

      - name: Select Rust acceleration network
        if: matrix.rust == true
        env:
          SECRET_FILES: ${{ steps.sccache-secret.outputs.secret-files }}
        run: |
          set -euo pipefail

          # Default to bridge so GitHub-hosted or otherwise non-accelerated paths stay valid.
          # Secret-backed jobs switch to host only when the acceleration inputs exist.
          rust_network=bridge
          buildx_network=default
          if [ -n "$SECRET_FILES" ]; then
            rust_network=host
            buildx_network=host
          fi
          printf 'RUST_ACCELERATION_NETWORK=%s\n' "$rust_network" >> "$GITHUB_ENV"
          printf 'RUST_BUILDX_NETWORK=%s\n' "$buildx_network" >> "$GITHUB_ENV"

      - name: Validate acceleration infrastructure outside BuildKit cache
        if: matrix.rust == true
        uses: ./.github/actions/rust-acceleration-preflight
        with:
          service: ${{ matrix.service }}
          redis-file: ${{ steps.sccache-secret.outputs.redis-file }}
          dist-config-file: ${{ steps.sccache-secret.outputs.dist-config-file }}
          distcc-hosts-file: ${{ steps.sccache-secret.outputs.distcc-hosts-file }}
          build-tools-image: ${{ env.BUILD_TOOLS_IMAGE }}
          build-network: ${{ env.RUST_ACCELERATION_NETWORK }}
          platform: linux/amd64

      - name: Build and push
        # #822 ("Pattern D"): ghcr.io push-token issuance intermittently fails with "403
        # Forbidden"/"denied: denied"/"401 Unauthorized" for the slowest (Rust) builds in
        # this matrix; a manual `gh run rerun` (fresh login, some time elapsed) has fixed
        # every occurrence so far. This composite action is the shared retry+re-login policy
        # every GHCR-writing step in the project now uses (see
        # .github/actions/ghcr-build-push-retry and scripts/lib/ghcr-retry.sh for why a
        # `uses:` step needs its own wrapper instead of sourcing the shared shell function
        # directly).
        id: build
        if: steps.should-build.outputs.should-build == 'true'
        timeout-minutes: 60
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts }}
          secret-files: ${{ steps.sccache-secret.outputs.secret-files }}
          build-args: |
            BUILD_TOOLS_IMAGE=${{ env.BUILD_TOOLS_IMAGE }}
            CARGO_BUILD_JOBS=${{ steps.docker-build-jobs.outputs.jobs }}
            APT_CACHE_BUST=${{ steps.apt-cache-bust.outputs.value }}
          network: ${{ env.RUST_BUILDX_NETWORK }}
          allow: ${{ env.RUST_BUILDX_NETWORK == 'host' && 'network.host' || '' }}
          push: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.pr-tag.outputs.image || steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=${{ matrix.description }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.rust.digest={0}', steps.build-tools-base-digests.outputs.rust) || '' }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.golang.digest={0}', steps.build-tools-base-digests.outputs.golang) || '' }}
          # No `annotations:` input here (issue #620). A genuinely single-platform push with
          # provenance disabled has no index for buildx to attach an index-level description
          # annotation to -- `docker buildx build --annotation index:...` on a real
          # single-platform push errors outright, confirmed live against this project's own
          # images. Forcing OCI mediatypes here is still required groundwork:
          # `docker buildx imagetools create` downstream (in merge-manifests) silently drops
          # --annotation with no error at all when combining Docker-format sources, since
          # Docker's manifest list schema has no annotations field -- also confirmed live.
          # merge-manifests is the first point where a genuine multi-platform index exists, so
          # that's where the description annotation is actually attached; channel/stack
          # promotions downstream carbon-copy that annotation forward untouched.
          outputs: type=image,oci-mediatypes=true
          platforms: linux/amd64
          provenance: false
          cache-from: type=local,src=${{ steps.buildx-cache.outputs.cache-from }}
          cache-to: type=local,dest=${{ steps.buildx-cache.outputs.cache-to }},mode=max

      # This job never `--load`s a local image (push-only), so unlike container-scan it
      # had no existing final cleanup step to piggyback on -- but "Set up Docker Buildx"
      # above still creates a real docker-container builder + state volume on this
      # persistent self-hosted runner pool that setup-buildx-action never removes on its
      # own. "Build and push" above is the only step in this job that uses it for a real
      # build; "Retag unchanged service image" above also uses it (for `imagetools create`,
      # on a Step 4 retag-only path) -- matches "Set up Docker Buildx"'s own widened
      # condition so a builder that step actually created always gets torn down. "Rotate
      # local Buildx cache" below only manipulates the local cache directory on disk, not
      # the builder itself.
      - name: Remove buildx builder
        if: >-
          ${{
            always() &&
            (
              steps.should-build.outputs.should-build == 'true' ||
              (github.event_name == 'push' && steps.should-build.outputs.should-build == 'false')
            )
          }}
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Rotate local Buildx cache
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true'
            ) &&
            always() &&
            steps.build.outcome == 'success'
          }}
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_DEST: ${{ steps.buildx-cache.outputs.cache-to }}
        run: |
          set -euo pipefail

          if [ ! -d "$BUILDX_CACHE_DEST" ]; then
            exit 0
          fi

          cache_dir="$BUILDX_CACHE_ROOT/${{ matrix.service }}"
          lock_file="$BUILDX_CACHE_ROOT/${{ matrix.service }}.lock"

          mkdir -p "$BUILDX_CACHE_ROOT"
          (
            flock -x 9
            rm -rf "$BUILDX_CACHE_ROOT/${{ matrix.service }}"
            mv "$BUILDX_CACHE_DEST" "$cache_dir"
          ) 9>"$lock_file"

      - name: Prepare pushed service Trivy cache
        # Same shared-cache-directory race as container-scan's own Trivy step above (#904):
        # this job's own concurrency group is keyed by service+ref[+run_id], so two different
        # trusted refs (or a dispatch/rerun overlapping a fresh push) building the SAME
        # service can now run this step concurrently, and a cache-dir key that omits
        # matrix.service would let two DIFFERENT services race on the same BoltDB cache file
        # whenever this job runs its full 8-way matrix concurrently (originally build-tools-
        # only, so a static prefix could not yet collide across services; Step 3, issue
        # #1095, generalized this step to every service, so the key must now include
        # matrix.service too). Mirrors container-scan's own concurrency-group key exactly --
        # see that job's equivalent step for the full invariant this has to satisfy -- and the
        # same ephemeral-dir classification and cleanup rationale (#912): dispatch/rerun and
        # tag-ref dirs are cold-by-design, never reused, and are deleted again by the "Remove
        # ephemeral pushed service Trivy cache" step below the scan.
        id: trivy-cache
        if: >-
          ${{
                      steps.build.outcome == 'success' &&
                      (
                        github.event_name != 'pull_request' ||
                        (
                          github.actor != 'dependabot[bot]' &&
                          github.event.pull_request.head.repo.id == github.event.repository.id
                        )
                      )
                    }}
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          sanitized_ref="$(printf '%s' "$GITHUB_REF" | tr '/:@' '---' | tr -cd 'A-Za-z0-9_.-')"
          if [ -z "$sanitized_ref" ]; then
            echo "::error::Could not derive a safe Trivy cache directory name from ref '$GITHUB_REF'."
            exit 1
          fi
          cache_dir="/var/tmp/lancache-ng-trivy-cache/${MATRIX_SERVICE}-pushed-${sanitized_ref}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_RUN_ATTEMPT" != "1" ] \
            || [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            cache_dir="${cache_dir}-${GITHUB_RUN_ID}"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          else
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$cache_dir"
          echo "dir=$cache_dir" >> "$GITHUB_OUTPUT"

      - name: Enforce pushed service Trivy cache generation retention
        # Same rationale, sentinel-file mechanism, and #927 build-tools.yml
        # deferral as container-scan's "Enforce Trivy cache generation
        # retention" step above -- see that step's comment for the full
        # reasoning. This is the `<service>-pushed-<ref>` persistent dir's
        # equivalent: reused on every non-PR push/schedule run, never
        # touched by the ephemeral cleanup step below or by host-level
        # tmpfiles aging (#928).
        if: ${{ steps.trivy-cache.outputs.ephemeral == 'false' }}
        env:
          TRIVY_CACHE_DIR: ${{ steps.trivy-cache.outputs.dir }}
          TRIVY_CACHE_MAX_AGE_DAYS: "14"
        run: |
          set -euo pipefail
          case "$TRIVY_CACHE_DIR" in
            /var/tmp/lancache-ng-trivy-cache/?*) ;;
            *)
              echo "::error::Refusing to touch unexpected Trivy cache path '$TRIVY_CACHE_DIR'."
              exit 1
              ;;
          esac
          stamp="$TRIVY_CACHE_DIR/.generation-stamp"
          if [ -f "$stamp" ] && [ -z "$(find "$stamp" -mtime "+${TRIVY_CACHE_MAX_AGE_DAYS}" -print -quit)" ]; then
            echo "Trivy cache generation for $TRIVY_CACHE_DIR is within ${TRIVY_CACHE_MAX_AGE_DAYS}d, keeping it."
            exit 0
          fi
          echo "Resetting Trivy cache generation for $TRIVY_CACHE_DIR (stamp missing or older than ${TRIVY_CACHE_MAX_AGE_DAYS}d)."
          rm -rf -- "$TRIVY_CACHE_DIR"
          mkdir -p -- "$TRIVY_CACHE_DIR"
          touch -- "$stamp"

      - name: Scan pushed service digest with Trivy
        # CI 1.1: this scan consumes the immutable digest emitted by the one
        # candidate build. Same-repo PR candidates are scanned too; fork and
        # Dependabot PRs remain read-only and therefore have no pushed digest.
        if: >-
          ${{
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        timeout-minutes: 20
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}
          cleanup-cache: ${{ steps.trivy-cache.outputs.ephemeral == 'true' && 'true' || 'false' }}


      - name: Smoke-test exact build-tools candidate
        if: >-
          ${{
            matrix.service == 'build-tools' &&
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/build-tools@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          run-fixtures: "true"
      - name: Remove ephemeral pushed service Trivy cache
        # Same rationale and fail-closed path guard as container-scan's
        # "Remove ephemeral Trivy cache" step above: ephemeral dirs
        # (dispatch/rerun/tag) are never read by any later run, so they are
        # deleted at job end instead of leaking ~1-2.5 GB per run onto the
        # runner host (#912). `always()` covers a failed/cancelled scan; a
        # skipped prepare step leaves the output empty, skipping this too.
        if: ${{ always() && steps.trivy-cache.outputs.ephemeral == 'true' }}
        env:
          TRIVY_CACHE_DIR: ${{ steps.trivy-cache.outputs.dir }}
        run: |
          set -euo pipefail
          case "$TRIVY_CACHE_DIR" in
            /var/tmp/lancache-ng-trivy-cache/?*)
              rm -rf -- "$TRIVY_CACHE_DIR"
              ;;
            *)
              echo "::error::Refusing to delete unexpected Trivy cache path '$TRIVY_CACHE_DIR'."
              exit 1
              ;;
          esac

      # No separate "Log in to GHCR for provenance attestation" step: the
      # ghcr-attest-retry composite action re-authenticates itself before
      # each retry (see that action), and its first attempt reuses the
      # session docker/login-action already created earlier in this job for
      # the "Build and push" step above.
      - name: Attest image build provenance
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            (
              steps.should-build.outputs.should-build == 'true'
            )
          }}
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}

  build-arm64:
    # Native arm64 candidates mirror the amd64 artifact contract before manifest assembly.
    # Metadata-only PR events reuse the prior commit because they carry no new image content.
    needs:
      - shellcheck
      - validate-compose
      - container-scan
      - detect-changes
      - determine-push-reuse-scope
      - ci_scope_policy
      - file-headers
      - compose-healthchecks
      - pr-template-check
      - pr-tracking-metadata-check
      - pr-title-convention-check
      - line-endings
      - push-supersession-check
    if: >-
      ${{
        always() &&
        needs.shellcheck.result == 'success' &&
        needs['validate-compose'].result == 'success' &&
        needs.ci_scope_policy.result == 'success' &&
        needs['line-endings'].result == 'success' &&
        (
          github.event_name != 'pull_request' ||
          !contains(fromJSON('["labeled", "unlabeled", "milestoned", "demilestoned"]'), github.event.action)
        ) &&
        (github.event_name == 'pull_request' || needs['container-scan'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['file-headers'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['compose-healthchecks'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['pr-template-check'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['pr-tracking-metadata-check'].result == 'success') &&
        (github.event_name != 'pull_request' || needs['pr-title-convention-check'].result == 'success')
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    # Obsolete PR arm64 work may be cancelled; push/tag candidates must survive for manifest assembly.
    # Dispatches and reruns use isolated concurrency keys.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') &&
          format('{0}-build-arm64-{1}-{2}-{3}', github.workflow, matrix.service, github.ref, github.run_id) ||
          format('{0}-build-arm64-{1}-{2}', github.workflow, matrix.service, github.ref)
        }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BUILD_TOOLS_IMAGE: ${{ needs['validate-compose'].outputs.build_tools_image }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: *normal-build-services

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine whether this service needs building
        id: should-build
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          DETECT_CHANGES_RESULT: ${{ needs['detect-changes'].result }}
          SUPERSEDED: ${{ needs['push-supersession-check'].outputs.superseded }}
          REUSE_JOB_RESULT: ${{ needs['determine-push-reuse-scope'].result }}
          REUSE_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_proxy }}
          REUSE_DNS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dns }}
          REUSE_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.reuse_watchdog }}
          REUSE_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp }}
          REUSE_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.reuse_dhcp_proxy }}
          REUSE_NTP: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ntp }}
          REUSE_UI: ${{ needs['determine-push-reuse-scope'].outputs.reuse_ui }}
          REUSE_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.reuse_build_tools }}
        run: |
          set -euo pipefail

          should_build=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
              echo "::error::Pull request build scoping requires detect-changes to succeed, got '$DETECT_CHANGES_RESULT'."
              exit 1
            fi
            case "$MATRIX_SERVICE" in
              proxy) should_build="${{ needs['detect-changes'].outputs.proxy }}" ;;
              dns) should_build="${{ needs['detect-changes'].outputs.dns_image }}" ;;
              watchdog) should_build="${{ needs['detect-changes'].outputs.watchdog }}" ;;
              dhcp) should_build="${{ needs['detect-changes'].outputs.dhcp }}" ;;
              dhcp-proxy) should_build="${{ needs['detect-changes'].outputs.dhcp_proxy }}" ;;
              ntp) should_build="${{ needs['detect-changes'].outputs.ntp }}" ;;
              syslog) should_build="${{ needs['detect-changes'].outputs.syslog }}" ;;
              ui) should_build="${{ needs['detect-changes'].outputs.ui }}" ;;
              build-tools) should_build="${{ needs['detect-changes'].outputs.build_tools }}" ;;
              *)
                echo "::error::Unknown matrix service '$MATRIX_SERVICE' has no path-scoping mapping."
                exit 1
                ;;
            esac
            if [ "${{ needs['detect-changes'].outputs.workflow }}" = "true" ] && [ "$MATRIX_SERVICE" != "build-tools" ]; then
              should_build=true
            fi
          elif [ "$REUSE_JOB_RESULT" = "success" ]; then
            # Mirrors build's own (the amd64 leg) identical branch here -- see that job's comment
            # for the full Step 4/#1095 rationale, including why build-tools (issue #1290) is
            # folded into this same allowlisted case statement instead of keeping its own
            # separate hand-rolled copy of the same verification (and why syslog, issue #1428,
            # is deliberately NOT added to this allowlist -- same reasoning as build's own copy).
            # Both legs must agree on
            # should-build for the same commit: build-arm64's own "Retag unchanged service
            # image" step below only produces the linux/arm64 leg when this resolves to false,
            # exactly mirroring what build produces for linux/amd64 -- both read the SAME
            # determine-push-reuse-scope outputs, so they provably cannot disagree.
            case "$MATRIX_SERVICE" in
              proxy) reuse="$REUSE_PROXY" ;;
              dns) reuse="$REUSE_DNS" ;;
              watchdog) reuse="$REUSE_WATCHDOG" ;;
              dhcp) reuse="$REUSE_DHCP" ;;
              dhcp-proxy) reuse="$REUSE_DHCP_PROXY" ;;
              ntp) reuse="$REUSE_NTP" ;;
              ui) reuse="$REUSE_UI" ;;
              build-tools) reuse="$REUSE_BUILD_TOOLS" ;;
              *) reuse="false" ;;
            esac
            if [ "$reuse" = "true" ]; then
              should_build=false
            fi
          fi

          # Issue #1095 Part 1 (Option B): mirrors build's own copy of this
          # check exactly -- see that job's comment for the full reasoning.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$SUPERSEDED" = "true" ]; then
            echo "::notice::A newer push to $GITHUB_REF has already superseded this run; skipping $MATRIX_SERVICE's build so only the run already targeting the current tip does the heavy work."
            should_build=false
          fi

          case "$should_build" in
            true|false)
              ;;
            *)
              echo "::error::Build scope for $MATRIX_SERVICE must resolve to true or false, got '${should_build:-<empty>}'."
              exit 1
              ;;
          esac

          if [ "$should_build" = "true" ]; then
            echo "::notice::$MATRIX_SERVICE inputs changed (or this is not a pull request); image build remains enabled."
          else
            echo "::notice::$MATRIX_SERVICE inputs did not change in this pull request; skipping routine image rebuild."
          fi
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"

      # Widened to also cover a Step 4 push-reuse-only path -- same
      # reasoning as build's own (the amd64 leg) identical widening.
      - name: Set up Docker Buildx
        # Issue #930: retried via .github/actions/buildx-setup-retry -- this GitHub-hosted
        # arm64 runner is a fresh VM every run and has hit Docker Hub's anonymous-pull rate
        # limit (surfacing as "unauthorized: authentication required") while bootstrapping
        # moby/buildkit:buildx-stable-1. Confirmed transient: a rerun with zero code changes
        # succeeded. The self-hosted amd64 `build` job's equivalent step keeps the plain,
        # unretried action -- it persists its local Buildx cache/image pulls across runs and
        # has never shown this symptom.
        if: >-
          ${{
            steps.should-build.outputs.should-build == 'true' ||
            (github.event_name == 'push' && steps.should-build.outputs.should-build == 'false')
          }}
        id: buildx
        uses: ./.github/actions/buildx-setup-retry

      - name: Log in to GHCR
        # Same fork-safety and Dependabot-safety reasoning as build's own
        # "Log in to GHCR" step. Also widened for a Step 4
        # push-reuse-only path, same reasoning as "Set up Docker Buildx"
        # immediately above.
        if: >-
          ${{
            (
              steps.should-build.outputs.should-build == 'true' ||
              (github.event_name == 'push' && steps.should-build.outputs.should-build == 'false')
            ) &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.full_name == github.repository
              )
            )
          }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirrors build's own "Retag unchanged service image" step exactly,
      # just for the linux/arm64 leg -- see that step's comment for the full
      # Step 4/#1095 rationale, including the #1095 F-21 digest-pinning fix
      # and the push-supersession-check guard's own reasoning. Both legs run
      # independently in parallel jobs but resolve the SAME pinned digest
      # determine-push-reuse-scope exported, so they always agree on which
      # source content to retag.
      - name: Retag unchanged service image for this commit (linux/arm64, no rebuild)
        if: github.event_name == 'push' && steps.should-build.outputs.should-build == 'false' && needs['push-supersession-check'].outputs.superseded != 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          MATRIX_SERVICE: ${{ matrix.service }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_proxy }}
          DIGEST_DNS: ${{ needs['determine-push-reuse-scope'].outputs.digest_dns }}
          DIGEST_WATCHDOG: ${{ needs['determine-push-reuse-scope'].outputs.digest_watchdog }}
          DIGEST_DHCP: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp }}
          DIGEST_DHCP_PROXY: ${{ needs['determine-push-reuse-scope'].outputs.digest_dhcp_proxy }}
          DIGEST_NTP: ${{ needs['determine-push-reuse-scope'].outputs.digest_ntp }}
          DIGEST_UI: ${{ needs['determine-push-reuse-scope'].outputs.digest_ui }}
          DIGEST_BUILD_TOOLS: ${{ needs['determine-push-reuse-scope'].outputs.digest_build_tools }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required on this runner for the Step 4 retag-only path."
            exit 1
          }

          case "$MATRIX_SERVICE" in
            proxy) pinned_digest="$DIGEST_PROXY" ;;
            dns) pinned_digest="$DIGEST_DNS" ;;
            watchdog) pinned_digest="$DIGEST_WATCHDOG" ;;
            dhcp) pinned_digest="$DIGEST_DHCP" ;;
            dhcp-proxy) pinned_digest="$DIGEST_DHCP_PROXY" ;;
            ntp) pinned_digest="$DIGEST_NTP" ;;
            ui) pinned_digest="$DIGEST_UI" ;;
            build-tools) pinned_digest="$DIGEST_BUILD_TOOLS" ;;
            *) pinned_digest="" ;;
          esac
          if [ -z "$pinned_digest" ]; then
            echo "::error::determine-push-reuse-scope reported reuse=true for $MATRIX_SERVICE but did not export a pinned digest -- refusing to retag from an unverified reference."
            exit 1
          fi
          pinned_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${pinned_digest}"

          short_sha="${COMMIT_SHA::7}"
          target="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}:sha-${short_sha}-arm64"

          manifest_json="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$pinned_ref" --raw)"
          arm64_digest="$(printf '%s' "$manifest_json" | jq -r '[.manifests[]? | select(.platform.architecture == "arm64" and .platform.os == "linux")][0].digest // empty')"
          if [ -z "$arm64_digest" ]; then
            echo "::error::Could not find a linux/arm64 manifest for $pinned_ref; refusing to retag $MATRIX_SERVICE -- this would leave promote without a valid arm64 source image for this commit."
            exit 1
          fi

          source_ref="ghcr.io/${REPOSITORY}/${MATRIX_SERVICE}@${arm64_digest}"
          echo "::notice::$MATRIX_SERVICE is unchanged on this push (Step 4, verified via scripts/lib/push-reuse.sh); retagging $source_ref (from the pinned digest $pinned_ref) as $target instead of rebuilding."
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create --tag "$target" "$source_ref"

      - name: Extract metadata
        # Suffixed the same way as build's linux/amd64 tag, just for the
        # arm64 leg -- see the comment on build's own "Extract metadata" step.
        if: steps.should-build.outputs.should-build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short,suffix=-arm64

      # Mirrors build's own "Compute PR staging tag" step, just for the
      # arm64 leg -- see that step's comment for the full rationale.
      - name: Compute PR staging tag
        id: pr-tag
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            steps.should-build.outputs.should-build == 'true' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
          MATRIX_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          short_sha="${BUILD_SHA::7}"
          tag="pr-${PR_NUMBER}-sha-${short_sha}-arm64"
          echo "::notice::This PR's linux/arm64 staging tag for $MATRIX_SERVICE is $tag."
          {
            printf 'tag=%s\n' "$tag"
            printf 'image=ghcr.io/%s/%s:%s\n' "${{ github.repository }}" "$MATRIX_SERVICE" "$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: matrix.service == 'build-tools' && steps.should-build.outputs.should-build == 'true'
        run: |
          set -euo pipefail

          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Docker build parallelism
        if: steps.should-build.outputs.should-build == 'true'
        id: docker-build-jobs
        run: |
          set -euo pipefail

          if [ -n "${CARGO_BUILD_JOBS:-}" ]; then
            case "$CARGO_BUILD_JOBS" in
              ''|*[!0-9]*)
                echo "::error::CARGO_BUILD_JOBS must be a positive integer."
                exit 1
                ;;
            esac
            if [ "$CARGO_BUILD_JOBS" -le 0 ]; then
              echo "::error::CARGO_BUILD_JOBS must be greater than zero."
              exit 1
            fi
            jobs="$CARGO_BUILD_JOBS"
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from repository variable for Docker builds."
          else
            detected_cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN || echo 2)"
            jobs=$((detected_cores - 2))
            if [ "$jobs" -lt 4 ]; then
              jobs=4
            fi
            echo "::notice::Using CARGO_BUILD_JOBS=$jobs from $detected_cores detected cores for Docker builds."
          fi

          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      # Issue #1147: same reasoning as build's own identically-named step -- this job's
      # `type=gha` cache also has no wall-clock expiry, so this arm64 leg needs the same
      # periodic bust as the amd64 leg. Computed independently here since the two jobs run
      # on separate runners with no shared state; both derive the same ISO-week string from
      # wall-clock time alone, so amd64 and arm64 bust in lockstep without passing a value
      # between jobs.
      - name: Compute apt cache-bust value
        if: steps.should-build.outputs.should-build == 'true'
        id: apt-cache-bust
        run: |
          set -euo pipefail
          echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        # No secret-files/network/allow here: this runner cannot reach the LAN-only
        # Redis/sccache-dist/distcc acceleration infrastructure, so this always builds as a
        # plain, uncached (but native) cargo build. Uses the GitHub Actions cache backend
        # (type=gha) instead of the self-hosted local Buildx cache, since this runner is
        # ephemeral and has no persistent /var/tmp to reuse across runs.
        #
        # #822: same shared GHCR retry+re-login policy as build's own equivalent step -- see
        # .github/actions/ghcr-build-push-retry.
        id: build
        if: steps.should-build.outputs.should-build == 'true'
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: |
            BUILD_TOOLS_IMAGE=${{ env.BUILD_TOOLS_IMAGE }}
            CARGO_BUILD_JOBS=${{ steps.docker-build-jobs.outputs.jobs }}
            APT_CACHE_BUST=${{ steps.apt-cache-bust.outputs.value }}
          push: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.pr-tag.outputs.image || steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=${{ matrix.description }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.rust.digest={0}', steps.build-tools-base-digests.outputs.rust) || '' }}
            ${{ matrix.service == 'build-tools' && format('org.opencontainers.image.base.golang.digest={0}', steps.build-tools-base-digests.outputs.golang) || '' }}
          # See build's equivalent step for why there is no `annotations:`
          # input here and why `outputs: type=image,oci-mediatypes=true` is
          # still required groundwork for issue #620.
          outputs: type=image,oci-mediatypes=true
          platforms: linux/arm64
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,scope=${{ matrix.service }}-arm64,mode=max

      # Same leak as build's own equivalent step: this job never `--load`s a local image
      # (push-only), so it had no existing local-image cleanup step -- but "Set up Docker
      # Buildx" above still creates a real docker-container builder that
      # setup-buildx-action/buildx-setup-retry never remove on their own. This runner is
      # GitHub-hosted (ephemeral), so unlike build's self-hosted equivalent this is a
      # defensive no-op today rather than an active leak, but kept for consistency and in
      # case this job is ever moved to a persistent runner. Widened the same way as build's
      # own equivalent step to also cover a Step 4 retag-only path.
      - name: Remove buildx builder
        if: >-
          ${{
            always() &&
            (
              steps.should-build.outputs.should-build == 'true' ||
              (github.event_name == 'push' && steps.should-build.outputs.should-build == 'false')
            )
          }}
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Scan pushed service digest with Trivy
        # CI 1.1: this scan consumes the immutable digest emitted by the one
        # candidate build. Same-repo PR candidates are scanned too; fork and
        # Dependabot PRs remain read-only and therefore have no pushed digest.
        if: >-
          ${{
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        timeout-minutes: 20
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ runner.temp }}/trivy-${{ matrix.service }}-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          cleanup-cache: "true"


      - name: Smoke-test exact build-tools candidate
        if: >-
          ${{
            matrix.service == 'build-tools' &&
            steps.build.outcome == 'success' &&
            (
              github.event_name != 'pull_request' ||
              (
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.head.repo.id == github.event.repository.id
              )
            )
          }}
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ghcr.io/${{ github.repository }}/build-tools@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          run-fixtures: "false"
      - name: Attest image build provenance
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            (
              steps.should-build.outputs.should-build == 'true'
            )
          }}
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}

  merge-manifests:
    # Combines build's linux/amd64 per-service tag with build-arm64's linux/arm64
    # per-service tag into the real sha-<commit> multi-platform tag that
    # promote/release/setup.sh consume. Uses imagetools create -- the same tool promote
    # already uses to move channel tags -- so no image is rebuilt here, only a manifest
    # list assembled from two already-pushed digests.
    #
    # Also runs on pull_request events now (see #626): a same-repo PR pushes its own
    # pr-<N>-sha-<short>-{amd64,arm64} legs in build/build-arm64, and this job merges
    # those into the real pr-<N>-sha-<short> tag that full-setup-validate consumes to
    # test the PR's own commits. The existing sha-<short> merge below stays gated to
    # non-PR events only -- that tag's inputs are never pushed on a PR, so running it on a
    # PR would just loop through seven harmless "no linux/amd64 image" skips for no
    # reason.
    name: merge multi-platform manifests
    needs: [build, build-arm64]
    if: "!cancelled() && needs.build.result == 'success' && needs['build-arm64'].result == 'success'"
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real runs: 17s-4.1min (per this job's own comment, it only assembles a
    # manifest list from two already-pushed digests -- no image rebuild).
    # 30 minutes covers the ghcr_retry backoff windows on its GHCR calls
    # (max ~2 minutes total) plus real headroom for registry slowness.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # The manifest lists created below (both the trusted sha-<commit> tag
      # and the PR staging tag) are the actual multi-platform references that
      # promote/release/setup.sh/full-setup-validate resolve and pull -- not
      # the platform-suffixed -amd64/-arm64 legs build/build-arm64 already
      # attest. Those per-arch attestations say nothing about the merged
      # digest itself, so this job needs the same attestation permissions
      # build/build-arm64/promote already carry.
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      proxy_digest: ${{ steps.create-trusted-manifests.outputs.proxy_digest || steps.create-pr-staging-manifests.outputs.proxy_digest }}
      dns_digest: ${{ steps.create-trusted-manifests.outputs.dns_digest || steps.create-pr-staging-manifests.outputs.dns_digest }}
      watchdog_digest: ${{ steps.create-trusted-manifests.outputs.watchdog_digest || steps.create-pr-staging-manifests.outputs.watchdog_digest }}
      dhcp_digest: ${{ steps.create-trusted-manifests.outputs.dhcp_digest || steps.create-pr-staging-manifests.outputs.dhcp_digest }}
      dhcp_proxy_digest: ${{ steps.create-trusted-manifests.outputs.dhcp_proxy_digest || steps.create-pr-staging-manifests.outputs.dhcp_proxy_digest }}
      ntp_digest: ${{ steps.create-trusted-manifests.outputs.ntp_digest || steps.create-pr-staging-manifests.outputs.ntp_digest }}
      syslog_digest: ${{ steps.create-trusted-manifests.outputs.syslog_digest || steps.create-pr-staging-manifests.outputs.syslog_digest }}
      ui_digest: ${{ steps.create-trusted-manifests.outputs.ui_digest || steps.create-pr-staging-manifests.outputs.ui_digest }}
      build_tools_digest: ${{ steps.create-trusted-manifests.outputs.build_tools_digest || steps.create-pr-staging-manifests.outputs.build_tools_digest }}
      stack_digest: ${{ steps.create-trusted-manifests.outputs.stack_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifests
        id: create-trusted-manifests
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DESCRIPTION_PROXY: *ci-description-proxy
          DESCRIPTION_DNS: *ci-description-dns
          DESCRIPTION_WATCHDOG: *ci-description-watchdog
          DESCRIPTION_DHCP: *ci-description-dhcp
          DESCRIPTION_DHCP_PROXY: *ci-description-dhcp-proxy
          DESCRIPTION_NTP: *ci-description-ntp
          DESCRIPTION_SYSLOG: *ci-description-syslog
          DESCRIPTION_UI: *ci-description-ui
          DESCRIPTION_BUILD_TOOLS: *ci-description-build-tools
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          short_sha="${COMMIT_SHA::7}"
          source_tag="sha-${short_sha}"
          declare -A merged_digests=()

          # These aliases come from the canonical build-matrix description scalars above.
          declare -A service_descriptions=(
            [proxy]="$DESCRIPTION_PROXY"
            [dns]="$DESCRIPTION_DNS"
            [watchdog]="$DESCRIPTION_WATCHDOG"
            [dhcp]="$DESCRIPTION_DHCP"
            [dhcp-proxy]="$DESCRIPTION_DHCP_PROXY"
            [ntp]="$DESCRIPTION_NTP"
            [syslog]="$DESCRIPTION_SYSLOG"
            [ui]="$DESCRIPTION_UI"
            [build-tools]="$DESCRIPTION_BUILD_TOOLS"
          )

          # Duplicated rather than factored into a shared script/action: GitHub Actions
          # workflow YAML has no import mechanism for shell functions across job steps, and
          # this file's own convention (see build/build-tools-base-digests and promote's copies
          # of this same helper) is a local copy per job over introducing a new composite
          # action just for one function. Same quote-stripping as those.
          #
          # Wrapped in ghcr_retry (#822): this reads the digest of a manifest this same step
          # just created a few lines below, so a transient GHCR 401/read failure here is a real
          # retry candidate, not an "expected absent" probe -- unlike the amd64/arm64 existence
          # checks further down, which intentionally stay unwrapped (see their own comment).
          digest_for_image() {
            local image=$1
            local digest

            if ! digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
              return 1
            fi
            digest="${digest%\"}"
            digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]]
            printf '%s\n' "$digest"
          }

          for service in "${services[@]}"; do
            amd64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-amd64"
            arm64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-arm64"
            target_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"

            # Deliberately NOT wrapped in ghcr_retry: an absent per-arch staging tag here almost
            # always means "this service's build was legitimately skipped" (unchanged on a PR, or
            # a fork/Dependabot PR with no push permission), not a transient registry error.
            # Retrying 3x with a 30s backoff would turn every expected skip into a ~90s stall per
            # service, and worse, could misclassify a genuine transient 401 as "not built" and
            # silently skip merging a service that actually was pushed -- the retry policy exists
            # to protect real registry-write operations below, not this expected-failure control
            # flow.
            if ! docker buildx imagetools inspect "$amd64_image" >/dev/null 2>&1; then
              echo "::notice::Skipping $service: no linux/amd64 image was published for this commit (likely unchanged on a pull request)."
              continue
            fi
            if ! docker buildx imagetools inspect "$arm64_image" >/dev/null 2>&1; then
              echo "::error::$service has a linux/amd64 image but no linux/arm64 image ($arm64_image); refusing to publish a single-platform tag under the multi-platform contract."
              exit 1
            fi

            amd64_digest="$(digest_for_image "$amd64_image")"
            arm64_digest="$(digest_for_image "$arm64_image")"
            [[ "$amd64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest for $service: $amd64_digest"; exit 1; }
            [[ "$arm64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest for $service: $arm64_digest"; exit 1; }
            amd64_ref="ghcr.io/${REPOSITORY}/${service}@${amd64_digest}"
            arm64_ref="ghcr.io/${REPOSITORY}/${service}@${arm64_digest}"

            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create -t "$target_image" "$amd64_ref" "$arm64_ref" \
              --annotation "index:org.opencontainers.image.description=${service_descriptions[$service]}"
            GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
              bash scripts/require-image-platforms.sh "$target_image" "$REQUIRED_PLATFORMS"

            # Output key uses underscores (dhcp-proxy/build-tools contain
            # hyphens, which the expression syntax in the attest steps below
            # would otherwise parse as subtraction) so those steps can
            # reference steps.create-trusted-manifests.outputs.<service>_digest.
            merged_digest="$(digest_for_image "$target_image")"
            [[ "$merged_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid merged digest for $service: $merged_digest"; exit 1; }
            merged_digests["$service"]="$merged_digest"
            printf '%s_digest=%s\n' "${service//-/_}" "$merged_digest" >> "$GITHUB_OUTPUT"
          done


          # Build the immutable stack pointer before any public channel is moved.
          # All service digests must already be present so the pointer can only
          # represent one complete, validated candidate set.
          for service in "${services[@]}"; do
            digest="${merged_digests[$service]:-}"
            [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
              echo "::error::Cannot create stack pointer: missing exact digest for $service."
              exit 1
            }
          done

          pointer_context="$(mktemp -d)"
          cleanup_pointer_context() { rm -rf "$pointer_context"; }
          trap cleanup_pointer_context EXIT

          {
            printf 'LANCACHE_IMAGE_TAG=%s\n' "$source_tag"
            printf 'LANCACHE_IMAGE_COMMIT=%s\n' "$COMMIT_SHA"
            printf 'LANCACHE_IMAGE_SERVICES=%s\n' "${services[*]}"
          } > "$pointer_context/stack.env"

          stack_pointer_description="Resolves a mutable lancache-ng stack channel to one immutable sha-* service image set."
          cat > "$pointer_context/Dockerfile" <<DOCKERFILE
          FROM busybox:stable-musl@sha256:3c6ae8008e2c2eedd141725c30b20d9c36b026eb796688f88205845ef17aa213
          LABEL org.opencontainers.image.title="lancache-ng stack channel pointer"
          LABEL org.opencontainers.image.description="${stack_pointer_description}"
          COPY stack.env /stack.env
          CMD ["true"]
          DOCKERFILE

          stack_pointer_image="ghcr.io/${REPOSITORY}/stack:${source_tag}"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx build \
            --platform "$REQUIRED_PLATFORMS" \
            --push \
            -t "$stack_pointer_image" \
            --annotation "index:org.opencontainers.image.description=${stack_pointer_description}" \
            "$pointer_context"
          GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
            bash scripts/require-image-platforms.sh "$stack_pointer_image" "$REQUIRED_PLATFORMS"
          stack_digest="$(digest_for_image "$stack_pointer_image")"
          [[ "$stack_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid stack pointer digest: $stack_digest"; exit 1; }
          printf 'stack_digest=%s\n' "$stack_digest" >> "$GITHUB_OUTPUT"
          cleanup_pointer_context
          trap - EXIT

      # Same merge, for the PR-scoped staging tag instead of the trusted-ref sha-<short>
      # tag. Only same-repo PRs ever push the two per-arch inputs (build/build-arm64's own
      # fork check), so this naturally no-ops for a fork PR: neither leg exists, every
      # service is skipped, nothing is published. A service this PR did not touch also has
      # no inputs here (detect-changes scoped build/build-arm64 to skip it) -- that is
      # expected and not an error; full-setup-validate's own backfill step fills the gap.

      - name: Create PR staging multi-platform manifest
        id: create-pr-staging-manifests
        if: github.event_name == 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Must match build/build-arm64's "Compute PR staging tag" exactly
          # -- see that step's comment for why this is github.sha (the
          # actual built merge commit), not the PR head SHA.
          BUILD_SHA: ${{ github.sha }}
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          short_sha="${BUILD_SHA::7}"
          source_tag="pr-${PR_NUMBER}-sha-${short_sha}"

          # Same helper as the trusted-ref step above (and promote's own
          # copy) -- kept duplicated per step/job rather than shared, which
          # is the existing convention in this file. Same ghcr_retry
          # reasoning as that step's copy: this reads a manifest just
          # created below, not an expected-absence probe.
          digest_for_image() {
            local image=$1
            local digest

            if ! digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
              return 1
            fi
            digest="${digest%\"}"
            digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]]
            printf '%s\n' "$digest"
          }

          for service in "${services[@]}"; do
            amd64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-amd64"
            arm64_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}-arm64"
            target_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"

            # Same "do not retry an expected-absence probe" reasoning as the
            # trusted-ref step above.
            if ! docker buildx imagetools inspect "$amd64_image" >/dev/null 2>&1; then
              echo "::notice::Skipping $service: no linux/amd64 PR staging image (not touched by this PR, or a fork PR)."
              continue
            fi
            if ! docker buildx imagetools inspect "$arm64_image" >/dev/null 2>&1; then
              echo "::error::$service has a linux/amd64 PR staging image but no linux/arm64 one ($arm64_image); build and build-arm64 disagreed on whether this service needed building."
              exit 1
            fi

            amd64_digest="$(digest_for_image "$amd64_image")"
            arm64_digest="$(digest_for_image "$arm64_image")"
            [[ "$amd64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest for $service: $amd64_digest"; exit 1; }
            [[ "$arm64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest for $service: $arm64_digest"; exit 1; }
            amd64_ref="ghcr.io/${REPOSITORY}/${service}@${amd64_digest}"
            arm64_ref="ghcr.io/${REPOSITORY}/${service}@${arm64_digest}"

            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create -t "$target_image" "$amd64_ref" "$arm64_ref"
            GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
              bash scripts/require-image-platforms.sh "$target_image" "$REQUIRED_PLATFORMS"

            # Same underscore-key reasoning as the trusted-ref step above.
            # This PR staging manifest is the exact tag full-setup-validate
            # pulls and runs for this PR's commits, not a throwaway build
            # artifact, so it gets the same provenance attestation.
            merged_digest="$(digest_for_image "$target_image")"
            printf '%s_digest=%s\n' "${service//-/_}" "$merged_digest" >> "$GITHUB_OUTPUT"
          done

      # "Set up Docker Buildx" above runs unconditionally (unlike the two
      # mutually-exclusive "Create ..." steps that consume it), so this
      # teardown is unconditional too -- exactly one of those two steps ever
      # uses the builder per run, but it was created either way.

      - name: Attest immutable stack pointer provenance
        if: steps.create-trusted-manifests.outputs.stack_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/stack
          subject-digest: ${{ steps.create-trusted-manifests.outputs.stack_digest }}

      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      # actions/attest is a standalone action step, so it cannot run inside the bash loops
      # above -- one explicit step per service is required, same as promote's single
      # "Attest stack pointer provenance" step just repeated for each merged multi-platform
      # manifest. Each step is gated only on its own digest output being non-empty: the
      # "Create ..." step above already skips (via `continue`, not a step failure) any
      # service with no per-arch inputs for this event, which leaves that service's
      # *_digest output unset here -- nothing else needs checking.
      #
      # Routed through ghcr-attest-with-cache (issue #1095, attestation-caching finding),
      # not ghcr-attest-retry directly: "Create multi-platform manifests" above runs
      # unconditionally every push for every service with valid per-arch inputs, and
      # `docker buildx imagetools create` is deterministic for identical inputs, so an
      # unchanged service gets the exact same merged digest recreated and re-attested on
      # every single push -- the same waste shape as G11, but for provenance attestations,
      # firing far more often. Also fixes a real, separate gap found in the same pass:
      # `syslog` (wired in by issue #1428/#1433) had no attest step here at all until now.
      - name: Attest proxy merged manifest provenance
        if: steps.create-trusted-manifests.outputs.proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/proxy
          subject-digest: ${{ steps.create-trusted-manifests.outputs.proxy_digest }}

      - name: Attest dns merged manifest provenance
        if: steps.create-trusted-manifests.outputs.dns_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dns
          subject-digest: ${{ steps.create-trusted-manifests.outputs.dns_digest }}

      - name: Attest watchdog merged manifest provenance
        if: steps.create-trusted-manifests.outputs.watchdog_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/watchdog
          subject-digest: ${{ steps.create-trusted-manifests.outputs.watchdog_digest }}

      - name: Attest dhcp merged manifest provenance
        if: steps.create-trusted-manifests.outputs.dhcp_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp
          subject-digest: ${{ steps.create-trusted-manifests.outputs.dhcp_digest }}

      - name: Attest dhcp-proxy merged manifest provenance
        if: steps.create-trusted-manifests.outputs.dhcp_proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp-proxy
          subject-digest: ${{ steps.create-trusted-manifests.outputs.dhcp_proxy_digest }}

      - name: Attest ntp merged manifest provenance
        if: steps.create-trusted-manifests.outputs.ntp_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ntp
          subject-digest: ${{ steps.create-trusted-manifests.outputs.ntp_digest }}

      - name: Attest ui merged manifest provenance
        if: steps.create-trusted-manifests.outputs.ui_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ui
          subject-digest: ${{ steps.create-trusted-manifests.outputs.ui_digest }}

      - name: Attest build-tools merged manifest provenance
        if: steps.create-trusted-manifests.outputs.build_tools_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/build-tools
          subject-digest: ${{ steps.create-trusted-manifests.outputs.build_tools_digest }}

      - name: Attest syslog merged manifest provenance
        if: steps.create-trusted-manifests.outputs.syslog_digest != ''
        uses: ./.github/actions/ghcr-attest-with-cache
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/syslog
          subject-digest: ${{ steps.create-trusted-manifests.outputs.syslog_digest }}

      # Fork PRs self-skip here without any extra guard needed: build/build-arm64
      # never push a fork PR's per-arch legs, so create-pr-staging-manifests'
      # own loop above never emits these *_digest outputs for a fork PR, and
      # every one of these seven steps is gated off by its own `if:` as a result.
      - name: Attest proxy PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/proxy
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.proxy_digest }}

      - name: Attest dns PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.dns_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dns
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.dns_digest }}

      - name: Attest watchdog PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.watchdog_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/watchdog
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.watchdog_digest }}

      - name: Attest dhcp PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.dhcp_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.dhcp_digest }}

      - name: Attest dhcp-proxy PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.dhcp_proxy_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/dhcp-proxy
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.dhcp_proxy_digest }}

      - name: Attest ntp PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.ntp_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ntp
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.ntp_digest }}

      - name: Attest ui PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.ui_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/ui
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.ui_digest }}

      - name: Attest build-tools PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.build_tools_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/build-tools
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.build_tools_digest }}

      # Same gap as the trusted-ref block above: syslog was missing here too.
      - name: Attest syslog PR staging manifest provenance
        if: steps.create-pr-staging-manifests.outputs.syslog_digest != ''
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ghcr.io/${{ github.repository }}/syslog
          subject-digest: ${{ steps.create-pr-staging-manifests.outputs.syslog_digest }}

  promote:
    # Promotion is intentionally separate from image build. It moves coherent channel
    # tags only after all sha-* source images for the same commit exist.
    #
    # The `if:` below must stay in an explicit `<status-fn>() && needs.X.result ==
    # 'success'` form, not a bare `github.event_name != 'pull_request'`. A bare condition
    # gets an implicit `&& success()` appended by GitHub Actions, and `success()` walks
    # the WHOLE transitive needs graph (promote -> merge-manifests -> build, build-arm64
    # -> detect-changes, file-headers, pr-template-check, ...), not just this job's own
    # direct `needs: merge-manifests`. detect-changes/file-headers/pr-template-check are
    # intentionally `if: github.event_name == 'pull_request'` (they skip on every push),
    # but `success()` treats a skipped job the same as a failed one -- so on every real
    # push to master or a vX.Y.Z branch, the implicit success() check silently evaluated
    # false and this job never ran, even though `build` itself completed successfully
    # (confirmed directly: run 28958519247 on v0.2.0, all 7 build matrix legs succeeded,
    # promote still skipped). This is why dev/nightly were never actually promoted
    # despite the channel-resolution logic in this job being correct (see issue #532).
    #
    # Use `!cancelled()`, not `always()`, as the status function: `always()` would also
    # make this job proceed to move public tags even if a maintainer cancels the run
    # after build succeeds -- `!cancelled()` suppresses the same implicit-success()-
    # over-skipped-deps problem while still correctly stopping the job on a real
    # cancellation.
    name: promote stack image channels
    needs: [merge-manifests, full-setup-validate]
    if: "!cancelled() && needs['merge-manifests'].result == 'success' && needs['full-setup-validate'].result == 'success' && github.event_name != 'pull_request'"
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # Real runs: 17s-3.6min for this job's own promotion work, but
    # scripts/lib/promote-lock.sh's promote_lock_acquire_with_retry is called with
    # (max_attempts=40, backoff_seconds=15), a legitimate non-hang wait of up to ~10
    # minutes for the shared cross-run lock under real contention (concurrent promotions
    # from a merge cascade), before this job's own work even starts. 45 minutes covers
    # that real lock-wait ceiling plus this job's own work with headroom, so normal lock
    # contention can never be mistaken for a hang.
    timeout-minutes: 45
    # Promote only repoints already-built, already-pushed sha-* images at mutable
    # channel tags -- it is idempotent and fast, unlike the rest of this workflow, where
    # cancelling stale in-flight work for a superseded commit is desirable. Originally
    # added (#793) because promote used to share the top-level publish concurrency group
    # with the slow build/test/scan pipeline: a rapid burst of pushes could drop
    # promote's entire run while it was still queued, before it ever started (#777).
    # Giving promote its own group here stopped it from competing for that same single
    # pending slot.
    #
    # CORRECTION (#888): this job-level group does NOT, by itself, protect promote from
    # being killed mid-execution if the top-level group's own cancel-in-progress were
    # ever true and cancelled the whole run out from under it -- a job-level group only
    # serializes THIS job against OTHER users of this exact same group name (currently
    # just backfill-stack-latest.yml); it is not a shield against the enclosing run's own
    # cancellation. Confirmed against GitHub's docs: workflow-level
    # cancel-in-progress:true tears down the entire previous run, including jobs already
    # in progress, regardless of any job-level group they belong to. This is why the
    # top-level group (see top of file) uses a run_id-suffixed key for push/tag events
    # instead of being flipped to cancel-in-progress:true -- that keeps promote safe by
    # construction, not by this group's own cancel-in-progress setting (which stays false
    # here purely for the backfill-serialization reason above).
    #
    # REMOVED (#897): this job-level `concurrency:` group is exactly what let a newer
    # pending `promote` run silently CANCEL an older one that was still queued, before
    # the older run's very first step had executed -- GitHub's concurrency-group
    # primitive holds at most one PENDING request per group, and a merely-queued job is
    # not protected by anything its own steps could do. #892 (narrowing cancellation to
    # build/container-scan instead of the whole run) made this practically reachable:
    # multiple tag pushes/dispatches can now build in parallel and reach this point at
    # nearly the same time. Real mutual exclusion (still GLOBAL, not per-ref --
    # re-scoping per-ref would reintroduce #777, a promotion racing
    # backfill-stack-latest.yml's own tag move for a different ref) now comes from
    # scripts/lib/promote-lock.sh's "Acquire the cross-workflow promote lock" step
    # below instead: every promote/backfill-latest run is now admitted immediately and
    # self-serializes via a git-ref-backed lock that is atomic on GitHub's remote
    # regardless of which self-hosted host picks up the job (checked for real: lancache-
    # heavy spans several distinct physical hosts, so a host-local flock would not have
    # provided real exclusion here). backfill-stack-latest.yml was updated to use the
    # exact same lock so the #777 property still holds.
    permissions:
      # Widened from `contents: read` (#897): the promote-lock mechanism
      # above needs to push/delete a dedicated, non-branch/non-tag ref
      # (refs/promote-lock/global) on this repo to implement its
      # compare-and-swap acquire/release. This does not grant any ability to
      # write to master/v0.2.0/tags -- branch protection rulesets only match
      # refs/heads/* ref-name conditions, and this lock ref lives outside
      # both refs/heads/* and refs/tags/* entirely.
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # fetch-depth: 0 is required by the version-bump step below: `git
      # describe --tags` and the classify-image-impact.sh merge-base diff both
      # need full tag/commit history, which a default shallow checkout does
      # not have.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Real, cross-host mutual exclusion for the tag-moving work below (issue #897 -- see
      # this job's own `permissions:`/removed `concurrency:` comments for the full
      # reasoning). Runs immediately after checkout, before any image work starts, so a run
      # that cannot get the lock never touches GHCR at all. Fails closed: if every attempt
      # is exhausted, promote_lock_acquire_with_retry prints ::error:: and returns 1, which
      # -- under `set -euo pipefail` -- stops this step (and the job) before any tag moves.
      - name: Acquire the cross-workflow promote lock
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/promote-lock.sh
          source "$GITHUB_WORKSPACE/scripts/lib/promote-lock.sh"

          holder_note="$(promote_lock_holder_note "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME")"
          echo "Acquiring $PROMOTE_LOCK_REF as: $holder_note"

          # Budget: up to 40 attempts, 15s backoff on a held-but-not-stale lock (~10 minutes
          # total) -- generous relative to promote's own typical runtime, so a realistic queue
          # of a few waiting promotions drains well within budget. stale_after=900s (15
          # minutes) is comfortably longer than any legitimate promote/backfill run, so a
          # crashed or killed holder's abandoned lock is recovered promptly without risking a
          # takeover of a run still legitimately working.
          promote_lock_acquire_with_retry origin "$holder_note" 40 15 900

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote coherent stack tags
        id: promote-stack
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PROXY_DIGEST: ${{ needs['merge-manifests'].outputs.proxy_digest }}
          DNS_DIGEST: ${{ needs['merge-manifests'].outputs.dns_digest }}
          WATCHDOG_DIGEST: ${{ needs['merge-manifests'].outputs.watchdog_digest }}
          DHCP_DIGEST: ${{ needs['merge-manifests'].outputs.dhcp_digest }}
          DHCP_PROXY_DIGEST: ${{ needs['merge-manifests'].outputs.dhcp_proxy_digest }}
          NTP_DIGEST: ${{ needs['merge-manifests'].outputs.ntp_digest }}
          SYSLOG_DIGEST: ${{ needs['merge-manifests'].outputs.syslog_digest }}
          UI_DIGEST: ${{ needs['merge-manifests'].outputs.ui_digest }}
          BUILD_TOOLS_DIGEST: ${{ needs['merge-manifests'].outputs.build_tools_digest }}
          STACK_DIGEST: ${{ needs['merge-manifests'].outputs.stack_digest }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          short_sha="${COMMIT_SHA::7}"
          source_tag="sha-${short_sha}"
          stack_pointer_image="ghcr.io/${REPOSITORY}/stack@${STACK_DIGEST}"
          channel_tags=()
          declare -A candidate_digests=(
            [proxy]="$PROXY_DIGEST"
            [dns]="$DNS_DIGEST"
            [watchdog]="$WATCHDOG_DIGEST"
            [dhcp]="$DHCP_DIGEST"
            [dhcp-proxy]="$DHCP_PROXY_DIGEST"
            [ntp]="$NTP_DIGEST"
            [syslog]="$SYSLOG_DIGEST"
            [ui]="$UI_DIGEST"
            [build-tools]="$BUILD_TOOLS_DIGEST"
          )
          declare -A previous_refs=()
          promoted_targets=()

          # Wrapped in ghcr_retry (#822): unlike merge-manifests' amd64/arm64 existence probes,
          # absence is never the expected outcome for any caller of this helper in this job --
          # the "previous digest before overwrite" callers below already tolerate absence via
          # `|| true` regardless of whether that absence is real (first-ever promotion) or a
          # transient read failure, and a retry only improves the odds of capturing the real
          # previous digest that rollback_promotions needs.
          digest_for_image() {
            local image=$1
            local digest

            if ! digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
              return 1
            fi
            digest="${digest%\"}"
            digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]]
            printf '%s\n' "$digest"
          }

          rollback_promotions() {
            local status=$?
            local target_image previous_digest

            if [[ "$status" = "0" || "${#promoted_targets[@]}" = "0" ]]; then
              exit "$status"
            fi

            echo "::error::Promotion failed after public tags were moved; attempting best-effort rollback."
            for target_image in "${promoted_targets[@]}"; do
              previous_digest="${previous_refs[$target_image]:-}"
              if [[ -n "$previous_digest" ]]; then
                ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                  docker buildx imagetools create --prefer-index=false -t "$target_image" "${target_image%:*}@${previous_digest}" \
                  || echo "::error::Could not restore previous digest for $target_image."
              else
                echo "::error::No previous digest existed for $target_image; manual GHCR inspection is required."
              fi
            done
            exit "$status"
          }
          trap rollback_promotions EXIT

          # Debounce/coalesce (#777): mutable channel tags (latest/nightly) are branch-driven,
          # and giving promote its own concurrency group above only stops it competing for the
          # SAME slot as the rest of this workflow -- it does not stop several of these runs
          # from queuing up back-to-back across a burst of merges, each pointing at a
          # moment-in-time commit a later one will immediately supersede. Before actually
          # moving any tag, re-resolve the ref's current tip directly from the remote and bail
          # out as a no-op if a newer commit already landed: that later commit's own promote
          # run will move the tag correctly, so this run briefly setting dev/nightly to an
          # already-stale commit would only add churn. This only applies to branch refs -- a
          # release/rc tag push targets one fixed, immutable ref, so vX.Y.Z/latest promotion is
          # never skipped by this check.
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            current_tip="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
            if [[ -z "$current_tip" ]]; then
              echo "::error::Could not resolve the current tip of ${GITHUB_REF} via git ls-remote; refusing to promote blind."
              exit 1
            fi
            if [[ "$current_tip" != "$COMMIT_SHA" ]]; then
              echo "::notice::${GITHUB_REF} has already moved to ${current_tip} since this run was triggered for ${COMMIT_SHA}; skipping channel promotion so the run already targeting the current tip can supersede it."
              exit 0
            fi
          fi

          # Branch-to-channel mapping. Original #825/#1141 decision (2026-07-23): master =
          # stable, current_dev = nightly, vY.X.Z = archived release -- master publishes the
          # stable `latest` channel; current_dev published `nightly` continuously from its own
          # tip.
          #
          # SUPERSEDED for current_dev by the #1254/#1255 "real once-daily nightly" decision
          # (2026-07-25): a plain current_dev PUSH no longer moves the mutable `nightly`
          # pointer at all. Every push still builds, scans, and publishes that commit's
          # durable per-service sha-<commit> tags completely unchanged (that happens in
          # build/build-arm64/merge-manifests above, not here, and does not depend on
          # channel_tags) -- the ONLY change is that this job no longer also repoints
          # `nightly` at every commit unconditionally. `nightly` is instead refreshed exactly
          # once a day (01:00 UTC) plus on-demand, by nightly-refresh.yml dispatching this same
          # workflow against current_dev's tip with `channel: nightly` -- landing in the
          # workflow_dispatch REQUESTED_CHANNEL path a few lines below, the same path a human
          # operator already had for an ad-hoc spot-check promotion. Because promote only runs
          # after build/test/scan succeed, this keeps nightly green-gated and fail-closed: a
          # broken current_dev tip simply never reaches this job, so nightly holds its last
          # good state instead of being force-moved onto a red commit. See #1254's feasibility
          # comment for why #808's untouched-service backfill does not depend on nightly
          # staying continuously fresh either -- it now backfills from the PR base commit's own
          # durable sha-<commit> tag instead.
          #
          # A version-numbered integration branch (v0.2.0, v0.3.0, ...) is an archived release
          # freeze: it still takes deliberate backports, but deliberately gets NO channel_tags
          # entry at all -- there is no live channel fed from it anymore (see setup.sh's
          # matching hard cut of LANCACHE_IMAGE_CHANNEL=dev for the operator-facing side of this
          # same retirement).
          if [[ "$GITHUB_REF" = "refs/heads/master" ]]; then
            channel_tags+=(latest)
          elif [[ "$GITHUB_REF" = "refs/heads/current_dev" ]]; then
            : # #1254/#1255: deliberately no automatic channel tag on a plain
              # push anymore -- see the comment above this if/elif chain.
          elif [[ "$GITHUB_REF" = refs/tags/v* ]]; then
            channel_tags+=("$GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              :
            elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              bash scripts/check-stable-external-images.sh
              channel_tags+=(latest)
            else
              echo "::error::Unsupported release tag '${GITHUB_REF_NAME}'. Use vX.Y.Z or vX.Y.Z-rc.N."
              exit 1
            fi
          fi

          # workflow_dispatch can additionally request one channel move from
          # whatever ref it's dispatched against, independent of the
          # automatic branch/tag rule above -- e.g. spot-check a feature
          # branch as "dev" without merging it into v0.2.0 first. "none"
          # (the default) adds nothing.
          if [[ -n "$REQUESTED_CHANNEL" && "$REQUESTED_CHANNEL" != "none" ]]; then
            already_requested=false
            for existing_channel in "${channel_tags[@]}"; do
              [[ "$existing_channel" = "$REQUESTED_CHANNEL" ]] && already_requested=true
            done
            if [[ "$already_requested" = false ]]; then
              channel_tags+=("$REQUESTED_CHANNEL")
            fi
          fi

          if (( ${#channel_tags[@]} == 0 )); then
            echo "::notice::No public channel tags are configured for $GITHUB_REF."
            exit 0
          fi

          # Validate the exact candidate identities handed off by merge-manifests.
          # The sha-* names are checked only as immutable-record pointers; promotion
          # itself consumes repository@sha256 references from the job outputs.
          for service in "${services[@]}"; do
            expected_digest="${candidate_digests[$service]:-}"
            [[ "$expected_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || {
              echo "::error::Missing or malformed candidate digest for $service: '$expected_digest'."
              exit 1
            }
            source_tag_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"
            source_tag_digest="$(digest_for_image "$source_tag_image")"
            [[ "$source_tag_digest" = "$expected_digest" ]] || {
              echo "::error::$source_tag_image moved away from the merge-manifests digest; refusing promotion."
              exit 1
            }
            GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
              bash scripts/require-image-platforms.sh "ghcr.io/${REPOSITORY}/${service}@${expected_digest}" "$REQUIRED_PLATFORMS"
          done

          [[ "$STACK_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Missing or malformed stack pointer digest '$STACK_DIGEST'."; exit 1; }
          stack_tag_image="ghcr.io/${REPOSITORY}/stack:${source_tag}"
          [[ "$(digest_for_image "$stack_tag_image")" = "$STACK_DIGEST" ]] || {
            echo "::error::$stack_tag_image moved away from the merge-manifests stack pointer digest; refusing promotion."
            exit 1
          }
          GHCR_RETRY_USERNAME="$GHCR_RETRY_USERNAME" GHCR_RETRY_PASSWORD="$GHCR_RETRY_PASSWORD" \
            bash scripts/require-image-platforms.sh "$stack_pointer_image" "$REQUIRED_PLATFORMS"

          # Neither loop below passes --annotation. $source_image already carries the
          # org.opencontainers.image.description index annotation from merge-manifests above
          # (and $stack_pointer_image from its own build a few lines up), and a plain
          # --prefer-index=false carbon copy of an already-annotated OCI index preserves that
          # annotation AND produces a byte-identical digest to the source -- confirmed live
          # while fixing issue #620. Adding --annotation again here would only risk
          # re-serializing the manifest with a different digest, which would break the release
          # job's invariant that a channel/release tag resolves to the exact same digest as its
          # source sha-* tag.
          for service in "${services[@]}"; do
            source_image="ghcr.io/${REPOSITORY}/${service}@${candidate_digests[$service]}"
            for channel_tag in "${channel_tags[@]}"; do
              target_image="ghcr.io/${REPOSITORY}/${service}:${channel_tag}"
              previous_refs["$target_image"]="$(digest_for_image "$target_image" || true)"
              ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                docker buildx imagetools create --prefer-index=false -t "$target_image" "$source_image"
              promoted_targets+=("$target_image")
            done
          done

          for channel_tag in "${channel_tags[@]}"; do
            target_image="ghcr.io/${REPOSITORY}/stack:${channel_tag}"
            previous_refs["$target_image"]="$(digest_for_image "$target_image" || true)"
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools create --prefer-index=false -t "$target_image" "$stack_pointer_image"
            promoted_targets+=("$target_image")
          done

          for service in "${services[@]}"; do
            for channel_tag in "${channel_tags[@]}"; do
              ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
                docker buildx imagetools inspect "ghcr.io/${REPOSITORY}/${service}:${channel_tag}" >/dev/null
            done
          done

          for channel_tag in "${channel_tags[@]}"; do
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
              docker buildx imagetools inspect "ghcr.io/${REPOSITORY}/stack:${channel_tag}" >/dev/null
          done

      # "Promote coherent stack tags" above is the only step in this job
      # that uses the builder set up above -- neither "Cut an automated
      # patch release tag" nor anything after it touches buildx. Torn down
      # here rather than left running until this job's own much-later
      # "Release the cross-workflow promote lock" cleanup.

      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      # Automated SemVer patch (Z) tagging (#819). Gated to the release-bearing branch
      # (master) only -- on any other ref this step is a deliberate no-op until master
      # itself starts receiving pushes, the still-undesigned "v0.2.0 -> master" promotion
      # event tracked in #825. Minor/major bumps stay a manual maintainer tag push; only Z
      # is ever computed here (see scripts/compute-next-release-tag.sh).
      #
      # `if:` is written as `success() && ...`, not a bare `github.ref == ...` condition,
      # for the same reason the job-level `if:` above carries its own long comment: a
      # step's own `if:` REPLACES (does not extend) the implicit `success()` GitHub Actions
      # would otherwise apply, so leaving `success()` out would let this step run even
      # after the "Promote coherent stack tags" step above it failed.
      - name: Cut an automated patch release tag for image-affecting master changes
        if: ${{ success() && github.ref == 'refs/heads/master' }}
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: |
          set -euo pipefail

          # This is core release machinery on the release-bearing branch, not
          # optional convenience automation, so a missing PAT fails closed
          # rather than silently skipping the release (AGENTS.md: do not hide
          # required-command failures).
          : "${PROJECT_AUTOMATION_PAT:?PROJECT_AUTOMATION_PAT is required to push an automated release tag (GITHUB_TOKEN-authored tag pushes do not re-trigger this workflow, a documented GitHub anti-recursion behavior, so the tag-triggered release job would never run).}"

          # A missing bootstrap tag is an expected, one-time prerequisite gap (see #819 Point
          # 4), not a broken-release-machinery state -- the channel-tag promotion in the step
          # above this one has already succeeded by the time this runs. Failing the whole job
          # here would misreport "bootstrap not done yet" as "promotion is broken," so this is
          # a skip (::notice:: + exit 0), not a hard failure. Once the maintainer cuts the
          # first vX.Y.Z tag, this same push (or the next one) picks it up automatically.
          base_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [[ -z "$base_tag" ]]; then
            echo "::notice::No vX.Y.Z release tag exists yet on this history; skipping automated patch tagging until the first release tag is bootstrapped (see #819 Point 4)."
            exit 0
          fi
          base_commit="$(git rev-list -n1 "$base_tag")"

          # Reuse the SAME classifier detect-changes and the earlier channel
          # promotion above both rely on (#819 Point 1: do not invent a
          # parallel classifier). Diffing from the last release's own commit
          # (not just "the previous push") means a burst of N merges landing
          # on master between two promote runs still yields exactly ONE
          # bump reflecting the whole burst, not N.
          image_impact="$(bash scripts/classify-image-impact.sh "$base_commit" "$COMMIT_SHA" | grep -x 'IMAGE_IMPACT=true' || true)"
          if [[ -z "$image_impact" ]]; then
            echo "::notice::No image-affecting change between ${base_tag} (${base_commit}) and ${COMMIT_SHA}; no patch release cut."
            exit 0
          fi

          next_tag="$(bash scripts/compute-next-release-tag.sh "$base_tag")"

          # Cheap end-of-run re-check, independent of and in addition to the debounce check
          # the "Promote coherent stack tags" step already performed earlier in this same job:
          # re-resolve master's tip again immediately before pushing the version tag itself.
          # Two releases landing back-to-back within the few seconds between that earlier check
          # and this one is a low-probability window, but it is a single, near-free
          # git ls-remote call, so there is no reason not to close it.
          current_tip="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ -z "$current_tip" ]]; then
            echo "::error::Could not resolve the current tip of refs/heads/master via git ls-remote; refusing to cut a release tag blind."
            exit 1
          fi
          if [[ "$current_tip" != "$COMMIT_SHA" ]]; then
            echo "::notice::refs/heads/master has already moved to ${current_tip} since this run was triggered for ${COMMIT_SHA}; skipping the version-tag cut so the run already targeting the current tip can supersede it."
            exit 0
          fi

          # Idempotency: if this exact tag somehow already exists remotely
          # (a re-run, or a previous attempt that pushed the tag but failed a
          # later step), do not fail or push a duplicate -- another run
          # already covered this commit's release.
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${next_tag}" 2>/dev/null)" ]]; then
            echo "::notice::${next_tag} already exists on origin; nothing to do."
            exit 0
          fi

          git tag -a "$next_tag" "$COMMIT_SHA" -m "Automated patch release ${next_tag}"
          # PROJECT_AUTOMATION_PAT (not secrets.GITHUB_TOKEN) authors this push so the tag push
          # actually re-triggers build-push.yml on refs/tags/v* -- GITHUB_TOKEN-authored pushes
          # are deliberately not re-triggered by GitHub (anti-recursion), which would otherwise
          # leave this tag published but its own release job never run.
          #
          # The token is passed as an HTTP Basic-Auth header, not embedded in the remote URL:
          # an embedded URL is a plain-argv secret (visible via `ps` for its lifetime) and,
          # worse, git itself echoes the full URL -- credentials included -- into its own
          # error/verbose output on a failed push, which would leak the PAT straight into this
          # step's own log.
          #
          # The header value is set via GIT_CONFIG_COUNT/KEY_n/VALUE_n (Git 2.31+), not
          # `-c http.extraheader=...`: a `-c` value is still a plain-argv secret for this
          # invocation's lifetime, it just avoids the URL-embedding/log-echo problems above. An
          # environment variable is not readable via `ps` at all (only via
          # `/proc/<pid>/environ`, restricted to the same user or root), closing that remaining
          # exposure. The real PAT header (index 1 below) is scoped to this exact push URL
          # (`http.<url>.extraheader`, not a bare `http.extraheader`) so it cannot leak into
          # unrelated git operations in this same shell -- index 0 is a separate, unrelated key
          # (see below) that resets checkout's own persisted header, not a secret. This whole
          # GIT_CONFIG_COUNT list is set only for this one command's environment, never written
          # to `.git/config`.
          push_url="https://github.com/${REPOSITORY}.git"
          # actions/checkout (persist-credentials: true, the default throughout this workflow)
          # does NOT write its GITHUB_TOKEN Authorization extraheader directly into this job's
          # local .git/config. It writes it into a separate temp file
          # (_work/_temp/git-credentials-<uuid>.config) and wires it in via an
          # `includeIf.gitdir:<workdir>.path <that file>` entry in .git/config -- confirmed from
          # a real failed run's log (run 30328171211, 2026-07-28). That included file's entry
          # and the PROJECT_AUTOMATION_PAT-scoped one set below both match this push's URL, and
          # git's http backend sends every matching extraheader as its own Authorization header
          # on the same request -- GitHub's HTTP endpoint rejects a request carrying two
          # Authorization headers with a 400. This is a real, confirmed regression (every real
          # run 2026-07-19 through 2026-07-28 hit it, distinct from the two bugs #1054 already
          # fixed; see #819's verification comments for the affected run IDs).
          #
          # PR #1230 (2026-07-24) tried to fix this with the `git config --local --unset-all
          # ...` line below, on the theory that checkout's header lived directly in
          # .git/config's own [http ...] section. It does not: `--local` only ever reads/writes
          # to .git/config itself, never a file merely includeIf-referenced from it, so that
          # command always exits 5 ("no such section") and the `2>/dev/null || true` silently
          # swallowed that as if it had succeeded -- the includeIf-sourced header was never
          # actually removed, and the very next real run hit the identical "Duplicate header:
          # Authorization" / 400 failure this was supposed to fix. Kept below anyway as a free,
          # harmless defense-in-depth line in case some future checkout version really does
          # write this key straight into .git/config -- but it must never be trusted as the
          # actual fix on its own again.
          #
          # The real fix: git's `http.extraHeader` (and its per-URL form) documents that
          # setting an entry to the empty string resets the accumulated list for that exact key
          # (git's own http.adoc docs: an empty value resets the extra headers to the empty
          # list). git-config(1)'s ENVIRONMENT section documents the precedence that makes this
          # usable here: these environment variables override values in configuration files,
          # but are overridden by any explicit options passed via `git -c` -- i.e. file-based
          # config (includeIf-included files included) < env-based GIT_CONFIG_COUNT < `-c`. So
          # an empty-value reset for checkout's OWN key (the bare host key, not scoped to this
          # repo's specific path), supplied via GIT_CONFIG_COUNT, clears the file-based value
          # for this one `git push` invocation only, without touching any on-disk file. This
          # does NOT collapse into a single reset+set pair on one key: checkout's bare-host key
          # and the PROJECT_AUTOMATION_PAT's repo-path-scoped key below are two DIFFERENT
          # config keys that both matched this same push URL simultaneously -- exactly why both
          # headers were being sent in the first place -- so both must be listed here; resetting
          # one has no effect on the other.
          #
          # Deliberately NOT done via `-c http.https://github.com/.extraheader=` instead of a
          # GIT_CONFIG_COUNT entry, even though it is the same empty-reset trick: `-c` is
          # documented as HIGHER precedence than GIT_CONFIG_COUNT, so a `-c`-based reset is
          # applied after, and therefore also wipes out, the real PAT header set via
          # GIT_CONFIG_COUNT below -- verified for real: doing the reset via `-c` while keeping
          # the real header on GIT_CONFIG_COUNT silently dropped the Authorization header
          # entirely (the push request went out unauthenticated). Keeping both the reset and
          # the real header on the same GIT_CONFIG_COUNT list (index 0 then index 1) avoids
          # this, since entries within one source apply in index order.
          #
          # Verified for real (2026-07-30, self-hosted runner): reproduced the identical
          # "Duplicate header: Authorization" / 400 failure via a real, harmless
          # `git ls-remote` against this same repo, using checkout's actual persisted-credential
          # shape and this step's own exact shell lines, with only `git push` swapped for
          # `git ls-remote`; confirmed `--local --unset-all` alone left it reproducing every
          # time, then confirmed adding this empty-value reset entry eliminates it -- exactly
          # one Authorization header sent. Nothing later in this job needs the original
          # GITHUB_TOKEN git credential -- the next step authenticates its own registry call
          # explicitly via secrets.GITHUB_TOKEN, not via this ambient git config.
          git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="" \
          GIT_CONFIG_KEY_1="http.${push_url}.extraheader" \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $(printf '%s' "x-access-token:${PROJECT_AUTOMATION_PAT}" | base64 -w0)" \
            git push "$push_url" "refs/tags/${next_tag}"
          echo "::notice::Cut ${next_tag} from ${COMMIT_SHA}. The tag-triggered run of this workflow will move 'latest' and publish the GitHub release."

      # Same digest-bound cache as merge-manifests' per-service attest steps (issue #1095
      # attestation-caching finding): a push where every service was unchanged reproduces
      # the identical stack-pointer digest, which would otherwise be re-attested for no
      # reason every time.
      - name: Release the cross-workflow promote lock
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/promote-lock.sh
          source "$GITHUB_WORKSPACE/scripts/lib/promote-lock.sh"

          holder_note="$(promote_lock_holder_note "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME")"
          # `|| true` here is the documented, narrow exception AG-VAL-004 allows:
          # promote_lock_release already prints its own ::warning:: for every non-fatal outcome
          # (already released, no longer ours, or a failed delete push), and this whole
          # design's stale_after takeover exists specifically so a genuinely failed/skipped
          # release here is recovered by the next waiter rather than wedging the lock forever --
          # release is best-effort cleanup, not a correctness-critical step.
          promote_lock_release origin "$holder_note" || true

  release:
    # Release source archives must match the same commit that produced the images. This
    # keeps source, image tags, and attestations traceable together.
    #
    # Same reasoning as promote's `if:` above: use an explicit needs.promote.result check
    # under a status function rather than a bare condition, so this job isn't silently
    # skipped by the implicit success() walking back through promote's own
    # transitively-skipped dependencies. `!cancelled()`, not `always()`, so a maintainer
    # cancelling the run can still stop this from publishing a release source archive.
    name: publish release source
    needs: promote
    if: "!cancelled() && needs.promote.result == 'success' && startsWith(github.ref, 'refs/tags/v')"
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # NO REAL RUN DATA: this job only runs on an actual `refs/tags/v*` push, and no such
    # run of this workflow has completed in the recorded history checked for this rollout
    # (2026-07, ~3800 total workflow runs) -- tags v0.1.0/v0.2.0/v0.3.0/v0.3.1 exist as
    # GitHub releases, but none was created by a tag push that triggered this exact job.
    # This value is therefore an estimate, not a measurement: 30 minutes, anchored to
    # promote's/merge-manifests' class of work (no compilation), not scaled from any
    # observed duration. Flagged explicitly rather than guessed silently -- revisit once a
    # real tag-push run of this job exists to measure.
    timeout-minutes: 30
    # Job-level concurrency, keyed per tag ref: this job's GET-then-create-or-PATCH logic
    # against the GitHub Releases API is only safe if at most one instance runs per tag
    # at a time (two concurrent instances could both GET "no release yet" and race two
    # separate POSTs, or one could PATCH over the other's body-preservation read). Before
    # this workflow's top-level group became run_id-suffixed for tag pushes, that
    # whole-run serialization made two `release` runs for the same tag effectively
    # impossible; it no longer does, so this job needs its own guarantee. Scoped by ref
    # (not global like `promote`'s group) because release publishing for different tags
    # is genuinely independent. cancel-in-progress stays false: queue a second attempt for
    # the same tag rather than cancel the first mid-write.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release image platform coverage
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          # syslog (issue #1428) added here explicitly: this SERVICES scalar is a
          # plain space-separated env value, not a services=(...) bash array, so
          # scripts/check-workflow-service-lists.sh's regex-based guard cannot see
          # or enforce it -- missing it here would silently drop syslog from this
          # release job's platform-coverage verification with no CI signal at all.
          SERVICES: proxy dns watchdog dhcp dhcp-proxy ntp syslog ui build-tools stack
          REQUIRED_PLATFORMS: ${{ env.RELEASE_PLATFORMS }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          read -r -a services <<< "$SERVICES"
          for service in "${services[@]}"; do
            image="ghcr.io/${REPOSITORY}/${service}:${TAG_NAME}"
            bash scripts/require-image-platforms.sh "$image" "$REQUIRED_PLATFORMS"
          done

      # Patches (rather than overwrites) an existing release body: the image_notes_start/end
      # HTML-comment markers bound exactly the auto-generated section, so any text a
      # maintainer added by hand outside those markers survives a re-run of this job (e.g. a
      # manual re-promotion of the same tag, or a rerun after a transient failure). A
      # brand-new release has no existing body to preserve, so its notes are just the
      # auto-generated section verbatim. The prerelease-state check further down exists
      # because GitHub's PATCH endpoint would otherwise happily flip a release's prerelease
      # flag to match whatever this run computes -- silently promoting/demoting a release a
      # maintainer may have already published deliberately.
      - name: Create or update GitHub release for built images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          read -ra services <<< "$CI_BUILD_SERVICES"
          short_sha="${COMMIT_SHA::7}"
          source_tag="sha-${short_sha}"
          expected_prerelease=false
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            expected_prerelease=true
            echo "::notice::Tag $TAG_NAME is a release candidate and will be published as a prerelease."
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            expected_prerelease=false
          else
            echo "::error::Unsupported release tag '$TAG_NAME'. Use vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi

          digest_for_image() {
            local image=$1
            local digest

            digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"
            digest="${digest#\"}"
            if [[ -z "$digest" || "$digest" = "null" ]]; then
              echo "::error::Could not read digest for $image."
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          build_tools_image="ghcr.io/${REPOSITORY}/build-tools:${TAG_NAME}"
          stack_pointer_image="ghcr.io/${REPOSITORY}/stack:${TAG_NAME}"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$build_tools_image" >/dev/null
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$stack_pointer_image" >/dev/null
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker pull "$build_tools_image" >/dev/null
          rust_base_digest="$(docker image inspect "$build_tools_image" --format '{{ index .Config.Labels "org.opencontainers.image.base.rust.digest" }}')"
          golang_base_digest="$(docker image inspect "$build_tools_image" --format '{{ index .Config.Labels "org.opencontainers.image.base.golang.digest" }}')"
          if [[ ! "$rust_base_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$golang_base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-tools image is missing build-time base digest labels."
            exit 1
          fi

          image_notes_start='<!-- lancache-ng-image-tags:start -->'
          image_notes_end='<!-- lancache-ng-image-tags:end -->'
          notes_file="$(mktemp)"
          {
            printf '%s\n' "$image_notes_start"
            printf 'This release source is the exact commit used by CI to build and publish the service images for %s.\n\n' "$TAG_NAME"
            printf 'Commit: %s\n\n' "$COMMIT_SHA"
            printf 'Published image tags and digests:\n\n'
            for service in "${services[@]}"; do
              tag_image="ghcr.io/${REPOSITORY}/${service}:${TAG_NAME}"
              sha_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"
              tag_digest="$(digest_for_image "$tag_image")"
              sha_digest="$(digest_for_image "$sha_image")"
              if [[ "$tag_digest" != "$sha_digest" ]]; then
                echo "::error::Release tag digest for $tag_image does not match $sha_image."
                exit 1
              fi
              printf -- '- %s -> %s\n' "$tag_image" "$tag_digest"
            done
            printf '\nMatching immutable SHA image tags:\n\n'
            for service in "${services[@]}"; do
              sha_image="ghcr.io/${REPOSITORY}/${service}:${source_tag}"
              sha_digest="$(digest_for_image "$sha_image")"
              printf -- '- %s -> %s\n' "$sha_image" "$sha_digest"
            done
            printf '\nStack channel pointer:\n\n'
            printf -- '- %s -> %s\n' "$stack_pointer_image" "$(digest_for_image "$stack_pointer_image")"
            printf -- '- ghcr.io/%s/stack:%s -> %s\n' "$REPOSITORY" "$source_tag" "$(digest_for_image "ghcr.io/${REPOSITORY}/stack:${source_tag}")"
            printf '\nResolved build-tools base image digests:\n\n'
            printf -- '- rust:latest -> %s\n' "$rust_base_digest"
            printf -- '- golang:latest -> %s\n' "$golang_base_digest"
            printf '\nProvenance and SBOM status:\n\n'
            printf -- '- Provenance attestations are pushed to GHCR for every first-party service image digest and the stack channel-pointer digest.\n'
            printf -- '- CycloneDX SBOMs are generated per released first-party image digest (via Trivy) and attached to this GitHub release as <service>.cdx.json assets by the release-sbom job.\n'
            printf -- '- An OpenVEX document generated from .trivyignore.yaml is attached to this release as vex.openvex.json.\n'
            printf '%s\n' "$image_notes_end"
          } > "$notes_file"

          docker run --rm \
            -e GITHUB_TOKEN \
            -e REPOSITORY \
            -e TAG_NAME \
            -e COMMIT_SHA \
            -e EXPECTED_PRERELEASE="$expected_prerelease" \
            -v "$notes_file:/tmp/lancache-release-notes.md:ro" \
            "$build_tools_image" \
            bash -s <<'UPDATE_RELEASE'
          set -euo pipefail

          api_url="https://api.github.com/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"
          image_notes_start='<!-- lancache-ng-image-tags:start -->'
          image_notes_end='<!-- lancache-ng-image-tags:end -->'
          expected_prerelease="$EXPECTED_PRERELEASE"

          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "$auth_header" \
            -H "$accept_header" \
            -H "$version_header" \
            "$api_url/releases/tags/$TAG_NAME")"

          if [ "$status" = "200" ]; then
            release_id="$(jq -r '.id' "$response_file")"
            existing_prerelease="$(jq -r '.prerelease' "$response_file")"
            if [ "$existing_prerelease" != "$expected_prerelease" ]; then
              echo "Existing GitHub release prerelease state does not match tag policy for $TAG_NAME." >&2
              echo "Expected prerelease=$expected_prerelease, found prerelease=$existing_prerelease." >&2
              exit 1
            fi
            existing_body="$(jq -r '.body // ""' "$response_file")"
            # shellcheck disable=SC2016
            updated_body="$(jq -nr \
              --arg body "$existing_body" \
              --arg notes "$(cat /tmp/lancache-release-notes.md)" \
              --arg start "$image_notes_start" \
              --arg end "$image_notes_end" \
              '
              if ($body | contains($start)) and ($body | contains($end)) then
                ($body | split($start)[0]) as $prefix
                | ($body | split($end)[1:] | join($end)) as $suffix
                | $prefix + $notes + $suffix
              elif ($body | length) > 0 then
                $body + "\n\n" + $notes
              else
                $notes
              end
              ')"
            # draft:false and target_commitish are forced here, not just body:
            # a pre-existing release object for this tag (e.g. one release-drafter
            # auto-created as a draft before this job ever ran, potentially
            # target_commitish-ing a dev branch tip rather than this tag's own
            # commit) must still end up published and pointed at the right
            # commit once this job confirms the tag's images are good -- unlike
            # prerelease above, there is no legitimate "maintainer deliberately
            # left it draft/mistargeted" case to protect against here.
            jq -n \
              --arg body "$updated_body" \
              --arg target_commitish "$COMMIT_SHA" \
              '{body:$body, draft:false, target_commitish:$target_commitish}' \
              > "$response_file.patch"
            curl -fsS -X PATCH \
              -H "$auth_header" \
              -H "$accept_header" \
              -H "$version_header" \
              -d @"$response_file.patch" \
              "$api_url/releases/$release_id" >/dev/null
          elif [ "$status" = "404" ]; then
            # shellcheck disable=SC2016
            jq -n \
              --arg tag_name "$TAG_NAME" \
              --arg target_commitish "$COMMIT_SHA" \
              --arg name "$TAG_NAME" \
              --arg body "$(cat /tmp/lancache-release-notes.md)" \
              --argjson prerelease "$expected_prerelease" \
              '{tag_name:$tag_name, target_commitish:$target_commitish, name:$name, body:$body, draft:false, prerelease:$prerelease}' \
              > "$response_file.create"
            curl -fsS -X POST \
              -H "$auth_header" \
              -H "$accept_header" \
              -H "$version_header" \
              -d @"$response_file.create" \
              "$api_url/releases" >/dev/null
          else
            cat "$response_file"
            echo "Failed to inspect GitHub release for $TAG_NAME; HTTP status $status" >&2
            exit 1
          fi
          UPDATE_RELEASE

      # "Create or update GitHub release for built images" above is the last
      # step in this job that uses the builder set up above -- "Attach
      # OpenVEX document to the release" below only touches a release asset
      # via curl, no buildx.
      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Attach OpenVEX document to the release
        # OSPS-VM-04.02: publish the portable OpenVEX document (vex.openvex.json, kept in
        # sync with .trivyignore.yaml by the validate-compose drift guard) as a release
        # asset, so downstream consumers get this project's accepted-vulnerability
        # dispositions in a standard, tool-parseable format alongside the release. Idempotent:
        # an existing same-named asset is deleted before re-upload. curl/jq run in the
        # tag-scoped build-tools image (guaranteed built for a release tag per AG-CI-010),
        # same as the release-notes step above, rather than assuming host tooling
        # (AG-CI-001).
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ ! -s vex.openvex.json ]; then
            echo "::error::vex.openvex.json is missing from the checkout." >&2
            exit 1
          fi

          build_tools_image="ghcr.io/${REPOSITORY}/build-tools:${TAG_NAME}"
          docker run --rm \
            -e GITHUB_TOKEN \
            -e REPOSITORY \
            -e TAG_NAME \
            -v "$PWD/vex.openvex.json:/tmp/vex.openvex.json:ro" \
            "$build_tools_image" \
            bash -s <<'UPLOAD_VEX'
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          uploads="https://uploads.github.com/repos/${REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"
          asset_name="vex.openvex.json"

          release_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/tags/$TAG_NAME" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Could not resolve release id for $TAG_NAME." >&2
            exit 1
          fi

          existing_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/$release_id/assets" | jq -r --arg n "$asset_name" '.[] | select(.name == $n) | .id')"
          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            curl -fsS -X DELETE -H "$auth" -H "$accept" -H "$version" "$api/releases/assets/$existing_id" >/dev/null
          fi

          curl -fsS -X POST \
            -H "$auth" -H "$accept" -H "$version" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vex.openvex.json \
            "$uploads/releases/$release_id/assets?name=$asset_name" >/dev/null
          echo "Uploaded $asset_name to release $TAG_NAME."
          UPLOAD_VEX

  release-sbom:
    # OSPS-QA-02.02: every released first-party image must ship with an SBOM. Scoped to
    # release tags (the same gate as `release`) because the requirement is about
    # *released* assets; generating SBOMs on every push would only redo the per-digest
    # work container-scan already does, with no release-evidence gain. Reuses Trivy
    # (already this project's pinned, vetted image scanner, AG-KD-003) to emit a
    # CycloneDX SBOM per released image digest, then attaches each as a <service>.cdx.json
    # GitHub release asset. That delivery path mirrors how provenance evidence rides
    # alongside the release and needs only contents:write. A GHCR OCI-referrer SBOM
    # attestation (actions/attest-sbom) is a possible future complement, deliberately not
    # added here to keep a single, fully release-asset-based publication path.
    name: publish SBOM for ${{ matrix.service }}
    needs: release
    if: "!cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v')"
    # Container image scanning is memory-heavy, so it takes the heavy tier the
    # same way container-scan does (AG-CI-002).
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    # NO REAL RUN DATA: same gap as `release` above -- this job only runs on a tag push,
    # and none has completed in recorded history. Anchored instead to container-scan's
    # per-service class of real data (24s-7min per service for a full image build + Trivy
    # scan; this job only pulls an already-built digest and re-runs Trivy for the
    # CycloneDX SBOM output, so it is never slower than that per-service work). 45 minutes
    # gives real headroom over container-scan's own per-service worst case. Flagged
    # explicitly as an estimate, not a measurement.
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # The Trivy-scanned first-party image set (container-scan's matrix).
        # `stack` is intentionally excluded: it is a busybox channel-pointer
        # image, not a compiled software asset, and is not vuln-scanned either.
        service: [proxy, dns, watchdog, dhcp, dhcp-proxy, ntp, syslog, ui, build-tools]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released image digest
        id: digest
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
          TAG_NAME: ${{ github.ref_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"

          image="ghcr.io/${REPOSITORY}/${SERVICE}:${TAG_NAME}"
          # Scan by the immutable digest, never the mutable vX.Y.Z tag
          # (AG-VAL-026): resolve tag -> digest right before the scan consumes
          # it so the SBOM is bound to the exact released image content.
          digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
          digest="${digest%\"}"
          digest="${digest#\"}"
          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "::error::Could not resolve digest for $image." >&2
            exit 1
          fi
          echo "image-ref=ghcr.io/${REPOSITORY}/${SERVICE}@${digest}" >> "$GITHUB_OUTPUT"

      # "Resolve released image digest" above is the only step in this job
      # that uses the builder set up above -- the Trivy scan and release
      # upload steps below don't touch buildx.
      - name: Remove buildx builder
        if: always()
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true

      - name: Generate CycloneDX SBOM with Trivy
        # Same pinned trivy-action the scan jobs use, in SBOM mode. Scans the
        # digest-qualified reference resolved above (mirrors build-arm64's
        # "Scan pushed service digest with Trivy" step, which likewise
        # scans a ghcr.io/...@sha256:... reference after the GHCR login).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.digest.outputs.image-ref }}
          format: cyclonedx
          output: ${{ matrix.service }}.cdx.json
          hide-progress: true
          cache: "false"
          timeout: 10m

      - name: Attach SBOM to the release
        # Idempotent same-named-asset replace, curl/jq in the tag-scoped
        # build-tools image -- same delivery mechanism as the release job's
        # OpenVEX upload above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          asset="${SERVICE}.cdx.json"
          if [ ! -s "$asset" ]; then
            echo "::error::Trivy did not produce $asset." >&2
            exit 1
          fi

          build_tools_image="ghcr.io/${REPOSITORY}/build-tools:${TAG_NAME}"
          docker run --rm \
            -e GITHUB_TOKEN \
            -e REPOSITORY \
            -e TAG_NAME \
            -e ASSET_NAME="$asset" \
            -v "$PWD/$asset:/tmp/$asset:ro" \
            "$build_tools_image" \
            bash -s <<'UPLOAD_SBOM'
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          uploads="https://uploads.github.com/repos/${REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"

          release_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/tags/$TAG_NAME" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Could not resolve release id for $TAG_NAME." >&2
            exit 1
          fi

          existing_id="$(curl -fsS -H "$auth" -H "$accept" -H "$version" "$api/releases/$release_id/assets" | jq -r --arg n "$ASSET_NAME" '.[] | select(.name == $n) | .id')"
          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            curl -fsS -X DELETE -H "$auth" -H "$accept" -H "$version" "$api/releases/assets/$existing_id" >/dev/null
          fi

          curl -fsS -X POST \
            -H "$auth" -H "$accept" -H "$version" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/$ASSET_NAME" \
            "$uploads/releases/$release_id/assets?name=$ASSET_NAME" >/dev/null
          echo "Uploaded $ASSET_NAME to release $TAG_NAME."
          UPLOAD_SBOM
