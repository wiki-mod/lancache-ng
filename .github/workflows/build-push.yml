        # What: Checks that every repo file a tests/bats/*.bats suite sources/reads is also listed in build-tools.yml's on.push.paths/on.pull_request.paths; runs in the build-tools container for the same real bash/grep/awk/sed semantics the other check-*.sh guards above require.
        # Why: Without this, a PR adding or extending a bats suite to depend on a new file, without adding that path to the trigger filters, leaves regression coverage that exists on paper but silently never runs for the exact changes most likely to need it.
        # From: Issue #1095 | PR #1532
        run: |
