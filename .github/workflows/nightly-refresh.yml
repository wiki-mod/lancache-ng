
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Scheduled/manual refresh for the `nightly` channel (#1254/#1255, 2026-07-25
# maintainer decision: nightly becomes a real once-daily build, like Firefox
# Nightly, instead of being republished on every current_dev push).
#
# This workflow does NOT build, scan, or promote anything itself -- it is a
# thin dispatcher that triggers other workflows' own real pipelines against
# current_dev's current tip via workflow_dispatch, exactly the ad-hoc
# "spot-check a branch as nightly" path a human operator already had
# available manually. Two independent dispatch targets, each on its own
# cadence (see `on.schedule` below), both distinguished at the job level by
# `github.event.schedule` (the specific cron expression that fired) so one
# workflow file can serve two different refresh cadences without a second,
# near-duplicate file (AG-CODE-013):
#
# - build-push.yml (daily, `channel: nightly` input): the main stack images.
#   `promote` only runs `needs: merge-manifests` and after
#   `!cancelled() && needs['merge-manifests'].result == 'success'`, so this
#   is green-gated and fail-closed by construction -- a red current_dev tip
#   leaves `nightly` pointing at its last good state instead of being
#   force-moved onto a broken commit. See build-push.yml's own
#   "Branch-to-channel mapping" comment in the `promote` job for the other
#   half of this decision (current_dev push no longer auto-adds `nightly`
#   to channel_tags).
#
# - build-tools.yml (weekly, no input needed): the separate CI/dev toolchain
#   image. Its own `schedule:` trigger (`cron: "23 3 * * 0"`) always
#   resolves `github.ref_name` to the default branch (AG-CI-018), so its
#   `:nightly` tag promotion branch (`elif REF_NAME = current_dev`, see that
#   file's "Promote mutable tags from the attested digest" step) was
#   structurally unreachable except by a manual, current_dev-targeted
#   dispatch -- confirmed dead code, not merely untested, before this
#   addition. A real `workflow_dispatch` against `--ref current_dev` sets
#   `github.ref_name` to `current_dev` correctly for that run, reaching the
#   same already-fail-closed digest/attest/promote chain build-tools.yml
#   already runs for its master-side weekly build. Kept on the SAME weekly
#   cadence as build-tools.yml's own schedule (not the daily one) because
#   that image is this project's heaviest, most capacity-sensitive CI job
#   (AG-CI-002); a daily dispatch here would silently change that already
#   deliberate cost tradeoff.
#
# TWO THINGS TO KNOW ABOUT THIS SCHEDULE, BOTH DELIBERATELY ACCEPTED:
#
# (a) DST: 01:00 UTC == 02:00 CET (the intended local refresh time) only
#     during CET (winter). GitHub Actions cron has no timezone concept and
#     always fires in UTC, so during CEST (European summer DST, UTC+2) this
#     lands at 03:00 local instead. That one-hour seasonal drift is
#     deliberately accepted rather than worked around -- there is no
#     DST-aware cron here to match, and an off-by-one-hour refresh has no
#     correctness impact (matches build-push.yml's own `latest` daily
#     schedule, which accepts the identical drift for the same reason).
#
# (b) DEFAULT-BRANCH-ONLY FIRING: GitHub Actions `schedule:` triggers only
#     ever run from a workflow file as it exists on the repository's default
#     branch (currently master), regardless of which branch the workflow
#     file itself lives on or what this workflow's own job logic targets.
#     Concretely: this cron does not actually start firing until this file
#     has been merged to master, not merely merged to current_dev where it
#     was authored. Until then (and, per the same rule, if this file is ever
#     edited only on current_dev afterward without a follow-up merge to
#     master), nightly refreshes ONLY via the manual workflow_dispatch path
#     below -- and since master itself lags current_dev by however long it
#     takes for changes to get promoted there, the operator-facing `nightly`
#     channel can sit frozen at whatever it last resolved to for that whole
#     window. This is a real, bounded gap (identical in shape to the
#     "KNOWN GAP" build-push.yml's own daily `latest` schedule already
#     documents for the same underlying GitHub limitation), and per
#     AG-CI-019 (AGENTS.md) it is not treated as a long-term accepted
#     tradeoff: this file must reach master via its own dedicated sync PR
#     in reasonably short order, not sit unsynced indefinitely.
#     Separately from that sync obligation: #808's untouched-service PR
#     backfill no longer depends on
#     nightly staying continuously fresh (it now reads the PR base commit's
#     own durable sha-<commit> tag instead, see build-push.yml's "Ensure PR
#     staging tags exist for full-setup services" step), so a temporarily
#     stale nightly channel is an operator-visible staleness question, not a
#     CI-correctness one.

name: Nightly Refresh

on:
  schedule:
    - cron: "0 1 * * *"
    # Weekly, matching build-tools.yml's own schedule day (Sunday) -- offset
    # 7 minutes later so the two don't contend for the same runner slot at
    # the exact same instant.
    - cron: "30 3 * * 0"
  # Manual escape hatch: an operator or maintainer can force an immediate
  # nightly refresh (e.g. to unblock the default-branch-only gap in (b)
  # above, or just to pick up a current_dev fix sooner) without waiting for
  # the next scheduled tick. Dispatches both targets regardless of the
  # weekly/daily split above -- a manual run is a deliberate, one-off
  # action, not the recurring cost that split exists to bound.
  workflow_dispatch: {}

# Only needs to call the Actions API to dispatch a different workflow file in
# this same repository -- no checkout, no package/content writes. Scoped down
# from the repository default rather than left implicit.
permissions:
  actions: write

concurrency:
  # A scheduled tick firing while a previous manual dispatch (or a slow prior
  # tick) is still in flight would just queue a second, redundant
  # build-push.yml dispatch for what is very likely the same current_dev tip
  # -- cancel-in-progress: false so a manual dispatch is never silently
  # dropped by an unlucky same-minute scheduled tick, it simply waits its
  # turn (this job's own runtime is seconds, not minutes, so the wait is
  # negligible).
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh-nightly:
    name: dispatch nightly channel refresh
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # This job only makes one `gh workflow run` API call and exits -- it does
    # not wait for build-push.yml's own (much longer) pipeline to finish.
    # Generous headroom over that trivial expected runtime still bounds a
    # genuinely hung API call rather than relying on GitHub's 360-minute
    # default (AG-CI-016).
    timeout-minutes: 10
    steps:
      # What: skips on the weekly tick; that one is build-tools-only.
      # Why: keeps build-push's nightly refresh strictly daily.
      # From: Issue #1095
      - name: Dispatch build-push.yml against current_dev with channel=nightly
        if: github.event_name != 'schedule' || github.event.schedule == '0 1 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh workflow run build-push.yml \
            --repo "${{ github.repository }}" \
            --ref current_dev \
            -f channel=nightly

      # What: skips on the daily tick; that one is build-push-only.
      # Why: matches build-tools.yml's own weekly cadence (AG-CI-002).
      # From: Issue #1095
      - name: Dispatch build-tools.yml against current_dev (weekly)
        if: github.event_name != 'schedule' || github.event.schedule == '30 3 * * 0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh workflow run build-tools.yml \
            --repo "${{ github.repository }}" \
            --ref current_dev
