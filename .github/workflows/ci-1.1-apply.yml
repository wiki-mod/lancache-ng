# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary one-shot helper used only on ci/1.1-single-artifact-consolidation.
name: CI 1.1 guarded patch application

on:
  push:
    branches:
      - ci/1.1-single-artifact-consolidation

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/ci/1.1-single-artifact-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Harden patcher match for manifest child references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci-1.1-apply.py')
          text = path.read_text()
          start_marker = '        old = """            ghcr_retry ghcr.io'
          end_marker = '        if trusted:\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('hotfix: old exact manifest matcher not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('hotfix: exact_children trusted branch marker not found')

          replacement = r'''        pattern = (
              r'(?m)^            ghcr_retry ghcr\\.io .*?-- \\\\s*$\\n'
              r'^              docker buildx imagetools create -t "\\$target_image" "\\$amd64_image" "\\$arm64_image" \\\\s*$\\n'
          )
          new = """            amd64_digest="$(digest_for_image "$amd64_image")"
              arm64_digest="$(digest_for_image "$arm64_image")"
              [[ "$amd64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest for $service: $amd64_digest"; exit 1; }
              [[ "$arm64_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest for $service: $arm64_digest"; exit 1; }
              amd64_ref="ghcr.io/${REPOSITORY}/${service}@${amd64_digest}"
              arm64_ref="ghcr.io/${REPOSITORY}/${service}@${arm64_digest}"

              ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \\
                docker buildx imagetools create -t "$target_image" "$amd64_ref" "$arm64_ref" \\
          """
          step = replace_regex(step, pattern, new, label="merge exact child digests")
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Apply guarded refactor patch
        run: python3 scripts/ci-1.1-apply.py

      - name: Verify patch shape
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git status --short
          test -n "$(git status --porcelain)" || { echo "::error::Guarded patch produced no changes."; exit 1; }

      - name: Commit guarded refactor patch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-push.yml \
                  .github/workflows/build-tools.yml \
                  .github/actions/reserve-validation-subnet-stack/action.yml \
                  scripts/validate-stack-images.sh \
                  scripts/render-full-setup-digest-override.sh
          git commit -m 'refactor(ci): carry exact candidate digests through promotion'
          git push origin "HEAD:${BRANCH_NAME}"
