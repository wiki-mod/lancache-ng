# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary one-shot helper used only on ci/1.1-single-artifact-consolidation.
name: CI 1.1 guarded patch application

on:
  push:
    branches:
      - ci/1.1-single-artifact-consolidation

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/ci/1.1-single-artifact-consolidation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Harden one-shot patcher source match
        run: python3 scripts/ci-1.1-hotfix.py

      - name: Apply guarded refactor patch
        run: python3 scripts/ci-1.1-apply.py

      - name: Verify patch shape
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git status --short
          test -n "$(git status --porcelain)" || { echo "::error::Guarded patch produced no changes."; exit 1; }

      - name: Stage transformed blobs for the GitHub connector
        run: |
          set -euo pipefail
          root=.ci-1.1-output
          rm -rf "$root"
          mkdir -p "$root/github/workflows" \
                   "$root/github/actions/reserve-validation-subnet-stack" \
                   "$root/scripts"
          cp .github/workflows/build-push.yml "$root/github/workflows/build-push.yml"
          cp .github/workflows/build-tools.yml "$root/github/workflows/build-tools.yml"
          cp .github/actions/reserve-validation-subnet-stack/action.yml "$root/github/actions/reserve-validation-subnet-stack/action.yml"
          cp scripts/validate-stack-images.sh "$root/scripts/validate-stack-images.sh"
          cp scripts/render-full-setup-digest-override.sh "$root/scripts/render-full-setup-digest-override.sh"
          chmod +x "$root/scripts/render-full-setup-digest-override.sh"

      - name: Publish transformed blobs without touching workflow paths
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-1.1-output
          git commit -m 'chore(ci): stage guarded 1.1 refactor blobs'
          git push origin "HEAD:${BRANCH_NAME}"
