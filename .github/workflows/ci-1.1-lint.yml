# Temporary validation helper for PR #1523; removed before review-ready state.
name: CI 1.1 actionlint

on:
  push:
    branches:
      - ci/1.1-single-artifact-consolidation

permissions:
  contents: write

jobs:
  actionlint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Repair guarded generator escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-push.yml')
          text = path.read_text()
          old = "          printf 'FULL_SETUP_COMPOSE_OVERRIDE=%s\n' \"$override_file\" >> \"$GITHUB_ENV\"\n          printf 'FULL_SETUP_CLIENT_TOOLS_IMAGE=%s\n' \"$client_tools_ref\" >> \"$GITHUB_ENV\"\n"
          new = "          printf 'FULL_SETUP_COMPOSE_OVERRIDE=%s\\n' \"$override_file\" >> \"$GITHUB_ENV\"\n          printf 'FULL_SETUP_CLIENT_TOOLS_IMAGE=%s\\n' \"$client_tools_ref\" >> \"$GITHUB_ENV\"\n"
          if text.count(old) != 1:
              raise SystemExit(f'escape repair expected exactly one source block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Run repository-pinned actionlint toolchain
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository }}/build-tools:nightly
          docker pull "$image"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            "$image" \
            actionlint -oneline

      - name: Stage clean workflow blob for connector commit
        run: |
          set -euo pipefail
          rm -rf .ci-1.1-output
          mkdir -p .ci-1.1-output
          cp .github/workflows/build-push.yml .ci-1.1-output/build-push.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-1.1-output/build-push.yml
          git commit -m 'chore(ci): stage actionlint-clean 1.1 workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"
