# Temporary validation helper for PR #1523; removed after staging its result.
name: CI 1.1 guard migration

on:
  push:
    branches:
      - ci/1.1-single-artifact-consolidation

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact-digest guard migration
        run: python3 scripts/ci-1.1-fix-guards.py

      - name: Run stack image contract guard
        run: bash scripts/validate-stack-images.sh

      - name: Stage validated guard for connector commit
        run: |
          set -euo pipefail
          rm -rf .ci-1.1-output
          mkdir -p .ci-1.1-output
          cp scripts/validate-stack-images.sh .ci-1.1-output/validate-stack-images.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-1.1-output/validate-stack-images.sh
          git commit -m 'chore(ci): stage exact-digest stack guard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
