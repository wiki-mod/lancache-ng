
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# This temporary workflow calculates the real current-base F-16 integration
# on a clean hosted runner without publishing the result. The job deliberately
# removes this file from its prospective tree before inspecting the result.
name: Scripts Layout Fresh-Base Diagnostic

on:
  push:
    branches:
      - ci/1095-f16-scripts-restructure
    paths:
      - ".github/workflows/scripts-layout-fresh-base-diagnostic.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  resolve-fresh-base:
    name: trial current-first F-16 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CURRENT_DEV_SHA: e5c803cbccf926dc5db23f97d12b6dc428b344b4
    steps:
      - name: Checkout the triggering PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate and validate the prospective integrated tree
        run: |
          set -euo pipefail

          git --version
          trigger_head="$(git rev-parse HEAD)"
          if [[ "$trigger_head" != "$GITHUB_SHA" ]]; then
            echo "::error::Checkout resolved to $trigger_head instead of triggering head $GITHUB_SHA."
            exit 1
          fi
          git cat-file -e "${CURRENT_DEV_SHA}^{commit}"

          if git \
            -c user.name='LanCache-NG CI Diagnostic' \
            -c user.email='ci-diagnostic@users.noreply.github.com' \
            merge --no-commit --no-ff "$CURRENT_DEV_SHA"; then
            merge_status=0
          else
            merge_status=$?
          fi

          mapfile -t actual_conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected_conflicts=(
            .github/actions/file-headers-check/action.yml
            .github/actions/shellcheck-and-standing-guards/action.yml
            .github/workflows/build-tools-smoke.yml
            AGENTS.md
            CONTRIBUTING.md
            docs/capability-inventory/SoT-proxy.md
            docs/release-validation-plan.md
            scripts/tracked/check-file-headers.sh
            scripts/tracked/test-governance-guards.sh
            scripts/untracked/simulations/syslog-forwarding-simulation.sh
            setup.sh
          )
          mapfile -t expected_conflicts < <(printf '%s\n' "${expected_conflicts[@]}" | sort)

          printf 'merge_status=%s\n' "$merge_status"
          printf '%s\n' '--- actual conflicts ---'
          printf '%s\n' "${actual_conflicts[@]}"
          if ((merge_status == 0)); then
            echo "::error::Expected the known fresh-base conflict set, but the merge was unexpectedly clean."
            exit 1
          fi
          if [[ "$(printf '%s\n' "${actual_conflicts[@]}")" != "$(printf '%s\n' "${expected_conflicts[@]}")" ]]; then
            echo "::error::Conflict set changed; refusing to apply a stale resolution recipe."
            exit 1
          fi

          current_first_paths=(
            .github/actions/file-headers-check/action.yml
            .github/actions/shellcheck-and-standing-guards/action.yml
            .github/workflows/build-tools-smoke.yml
            AGENTS.md
            CONTRIBUTING.md
            docs/capability-inventory/SoT-proxy.md
            docs/release-validation-plan.md
            setup.sh
          )
          for path in "${current_first_paths[@]}"; do
            git show "${CURRENT_DEV_SHA}:${path}" > "$path"
            git add -- "$path"
          done

          # These conflicts are rename destinations. Recreate them from the
          # current source blobs, not from the historical PR copies, so newer
          # fixes survive before applying the directory-depth adjustments.
          git show "${CURRENT_DEV_SHA}:scripts/check-file-headers.sh" > scripts/tracked/check-file-headers.sh
          git show "${CURRENT_DEV_SHA}:scripts/test-governance-guards.sh" > scripts/tracked/test-governance-guards.sh
          git show "${CURRENT_DEV_SHA}:scripts/syslog-forwarding-simulation.sh" > scripts/untracked/simulations/syslog-forwarding-simulation.sh
          git add -- \
            scripts/tracked/check-file-headers.sh \
            scripts/tracked/test-governance-guards.sh \
            scripts/untracked/simulations/syslog-forwarding-simulation.sh
          git rm -f --ignore-unmatch -- \
            scripts/check-file-headers.sh \
            scripts/test-governance-guards.sh \
            scripts/syslog-forwarding-simulation.sh

          # Four guards arrived on current_dev after the historical F-16
          # contribution. They were independently classified as CI-only and
          # therefore join tracked/ rather than falling into untracked/.
          for name in \
            check-dependabot-docker-base-consistency.sh \
            check-pipefail-scope-coverage.sh \
            check-pr-diff-file-headers.sh \
            resolve-remote-ref-with-retry.sh; do
            if [[ ! -f "scripts/$name" || -e "scripts/tracked/$name" ]]; then
              echo "::error::Unexpected source/destination state while moving newer tracked guard $name."
              exit 1
            fi
            git mv -- "scripts/$name" "scripts/tracked/$name"
          done

          # A move changes the distance from these scripts to scripts/lib or
          # the repository root. Apply only those proven depth changes here.
          OLD='repo_root=$(cd "$script_dir/.." && pwd)' NEW='repo_root=$(cd "$script_dir/../.." && pwd)' \
            perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' \
            scripts/tracked/check-file-headers.sh \
            scripts/tracked/check-dependabot-docker-base-consistency.sh \
            scripts/tracked/check-pipefail-scope-coverage.sh
          OLD='ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"' NEW='ROOT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"' \
            perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' scripts/tracked/test-governance-guards.sh
          OLD='repo_root=$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)' NEW='repo_root=$(cd "$(dirname "${BASH_SOURCE[0]}")/../../.." && pwd)' \
            perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' scripts/untracked/simulations/syslog-forwarding-simulation.sh
          OLD='source "$script_dir/lib/git-fetch-retry.sh"' NEW='source "$script_dir/../lib/git-fetch-retry.sh"' \
            perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' scripts/tracked/check-pr-diff-file-headers.sh

          # Only current-first conflict files and the four newly moved guards
          # missed some or all of the historical rename edits. Auto-merged
          # files are intentionally left untouched here.
          reference_fix_files=(
            "${current_first_paths[@]}"
            scripts/tracked/check-file-headers.sh
            scripts/tracked/test-governance-guards.sh
            scripts/untracked/simulations/syslog-forwarding-simulation.sh
            scripts/tracked/check-dependabot-docker-base-consistency.sh
            scripts/tracked/check-pipefail-scope-coverage.sh
            scripts/tracked/check-pr-diff-file-headers.sh
            scripts/tracked/resolve-remote-ref-with-retry.sh
          )

          replace_in_current_first_files() {
            local old="$1" new="$2" path
            for path in "${reference_fix_files[@]}"; do
              [[ -f "$path" ]] || continue
              if grep -Fq -- "$old" "$path"; then
                OLD="$old" NEW="$new" perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/g' "$path"
              fi
            done
          }

          while read -r class name; do
            [[ -n "$class" && -n "$name" ]] || continue
            old="scripts/$name"
            case "$class" in
              tracked) new="scripts/tracked/$name" ;;
              simulation) new="scripts/untracked/simulations/$name" ;;
              untracked) new="scripts/untracked/$name" ;;
              *) echo "::error::Unknown layout class $class for $name."; exit 1 ;;
            esac
            if [[ ! -f "$new" ]]; then
              echo "::error::Expected moved script is missing: $new"
              exit 1
            fi
            replace_in_current_first_files "$old" "$new"
          done <<'LAYOUT'
          tracked check-action-node-versions.sh
          tracked check-bats-path-filter-coverage.sh
          tracked check-build-tools-smoke-coverage.sh
          tracked check-changelog-direct-edit.sh
          tracked check-compose-healthchecks.sh
          tracked check-dependabot-docker-base-consistency.sh
          tracked check-executable-bits.sh
          tracked check-file-headers.sh
          tracked check-governance-guards.sh
          tracked check-idempotence-test-coverage.sh
          tracked check-language-policy.sh
          tracked check-line-endings.sh
          tracked check-logging-matrix.sh
          tracked check-mutable-refs.sh
          tracked check-naming-consistency.sh
          tracked check-orphaned-branches.sh
          tracked check-pipefail-scope-coverage.sh
          tracked check-pr-diff-file-headers.sh
          tracked check-pr-title-convention.sh
          tracked check-pr-tracking-metadata.sh
          tracked check-setup-prompt-drift.sh
          tracked check-stable-external-images.sh
          tracked check-validation-subnet-wrapper-coverage.sh
          tracked check-vex-drift.sh
          tracked check-workflow-service-lists.sh
          tracked resolve-remote-ref-with-retry.sh
          tracked test-governance-guards.sh
          tracked validate-pr-template.sh
          simulation dhcp-kea-ctrl-agent-mutation-simulation.sh
          simulation dhcp-kea-lease-flow-simulation.sh
          simulation dhcp-kea-ui-rollback-simulation.sh
          simulation dhcp-proxy-pxe-simulation.sh
          simulation dhcp-relay-flow-simulation.sh
          simulation dns-zone-rollback-simulation.sh
          simulation full-setup-client-simulation.sh
          simulation nats-secondary-auth-callout-simulation.sh
          simulation ntp-cap-sys-time-simulation.sh
          simulation proxy-deep-wildcard-tls-simulation.sh
          simulation proxy-ssl-mode-two-relay-dispatch-simulation.sh
          simulation proxy-standard-mode-sni-routing-simulation.sh
          simulation setup-cli-simulation.sh
          simulation setup-reset-dns-config-simulation.sh
          simulation setup-reset-kea-config-simulation.sh
          simulation ssl-mitm-cache-simulation.sh
          simulation syslog-forwarding-simulation.sh
          simulation ui-nats-dns-integration-simulation.sh
          simulation ui-reachability-crash-loop-simulation.sh
          untracked check-netdata-curl-pin.sh
          untracked check-pipefail-early-exit-grep.sh
          untracked check-proxy-cache-env-doc-drift.sh
          untracked check-review-chronology-comments.sh
          untracked check-workflow-line-limit.sh
          untracked classify-image-impact.sh
          untracked collect-changelog-entries.sh
          untracked compute-next-release-tag.sh
          untracked detect-full-setup-changes.sh
          untracked docker-socket-proxy.sh
          untracked ensure-pr-staging-images.sh
          untracked gc-pr-staging-images.sh
          untracked generate-vex.sh
          untracked install-ca-cert.ps1
          untracked install-ca-cert.sh
          untracked plan-deep-validation.sh
          untracked require-image-platforms.sh
          untracked select-build-tools-image.sh
          untracked ui-rust-checks.sh
          untracked validate-stack-images.sh
          LAYOUT

          cat > scripts/tracked/README.md <<'README'
          # scripts/tracked/

          CI-tooling-only scripts. A script lives here once it has been individually
          verified to have no service/product-code dependency at all, specifically
          verified to be invoked only from CI/tooling paths and never sourced,
          invoked, or copied by the deep/full-setup product validation paths or the
          simulation scripts they exercise.

          Any path under this directory is automatically recognized as CI-tooling-only
          by `scripts/untracked/detect-full-setup-changes.sh` through its directory
          prefix rule. A script placed here therefore needs no duplicate filename
          allowlist entry.

          The original 24 scripts moved here preserve the individual CI-only
          classification that preceded the directory split. Four later CI guards were
          independently checked against the same contract and bring the current set to
          28 tracked scripts. New scripts must satisfy the same no-product/deep-
          validation dependency contract before being placed here.
          README

          git add -- "${reference_fix_files[@]}" scripts/tracked/README.md
          git rm -- .github/workflows/scripts-layout-fresh-base-diagnostic.yml

          remaining_conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining_conflicts" ]]; then
            printf '::error::Unresolved paths remain:\n%s\n' "$remaining_conflicts"
            exit 1
          fi

          tracked_count="$(find scripts/tracked -maxdepth 1 -type f -name '*.sh' | wc -l)"
          simulation_count="$(find scripts/untracked/simulations -maxdepth 1 -type f -name '*-simulation.sh' | wc -l)"
          direct_untracked_count="$(find scripts/untracked -maxdepth 1 -type f \( -name '*.sh' -o -name '*.ps1' \) | wc -l)"
          top_level_count="$(find scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.ps1' \) | wc -l)"
          printf 'tracked=%s simulations=%s direct_untracked=%s top_level=%s\n' \
            "$tracked_count" "$simulation_count" "$direct_untracked_count" "$top_level_count"
          [[ "$tracked_count" == 28 ]]
          [[ "$simulation_count" == 19 ]]
          [[ "$direct_untracked_count" == 20 ]]
          [[ "$top_level_count" == 0 ]]

          stale_found=0
          while read -r class name; do
            [[ -n "$class" && -n "$name" ]] || continue
            old="scripts/$name"
            grep_status=0
            matches="$(git grep -n -F -- "$old" -- .)" || grep_status=$?
            if ((grep_status == 0)); then
              printf '::error::Stale pre-layout reference remains for %s:\n%s\n' "$old" "$matches"
              stale_found=1
            elif ((grep_status != 1)); then
              printf '::error::git grep failed while checking %s (exit %s).\n' "$old" "$grep_status"
              exit 1
            fi
          done <<'LAYOUT'
          tracked check-action-node-versions.sh
          tracked check-bats-path-filter-coverage.sh
          tracked check-build-tools-smoke-coverage.sh
          tracked check-changelog-direct-edit.sh
          tracked check-compose-healthchecks.sh
          tracked check-dependabot-docker-base-consistency.sh
          tracked check-executable-bits.sh
          tracked check-file-headers.sh
          tracked check-governance-guards.sh
          tracked check-idempotence-test-coverage.sh
          tracked check-language-policy.sh
          tracked check-line-endings.sh
          tracked check-logging-matrix.sh
          tracked check-mutable-refs.sh
          tracked check-naming-consistency.sh
          tracked check-orphaned-branches.sh
          tracked check-pipefail-scope-coverage.sh
          tracked check-pr-diff-file-headers.sh
          tracked check-pr-title-convention.sh
          tracked check-pr-tracking-metadata.sh
          tracked check-setup-prompt-drift.sh
          tracked check-stable-external-images.sh
          tracked check-validation-subnet-wrapper-coverage.sh
          tracked check-vex-drift.sh
          tracked check-workflow-service-lists.sh
          tracked resolve-remote-ref-with-retry.sh
          tracked test-governance-guards.sh
          tracked validate-pr-template.sh
          simulation dhcp-kea-ctrl-agent-mutation-simulation.sh
          simulation dhcp-kea-lease-flow-simulation.sh
          simulation dhcp-kea-ui-rollback-simulation.sh
          simulation dhcp-proxy-pxe-simulation.sh
          simulation dhcp-relay-flow-simulation.sh
          simulation dns-zone-rollback-simulation.sh
          simulation full-setup-client-simulation.sh
          simulation nats-secondary-auth-callout-simulation.sh
          simulation ntp-cap-sys-time-simulation.sh
          simulation proxy-deep-wildcard-tls-simulation.sh
          simulation proxy-ssl-mode-two-relay-dispatch-simulation.sh
          simulation proxy-standard-mode-sni-routing-simulation.sh
          simulation setup-cli-simulation.sh
          simulation setup-reset-dns-config-simulation.sh
          simulation setup-reset-kea-config-simulation.sh
          simulation ssl-mitm-cache-simulation.sh
          simulation syslog-forwarding-simulation.sh
          simulation ui-nats-dns-integration-simulation.sh
          simulation ui-reachability-crash-loop-simulation.sh
          untracked check-netdata-curl-pin.sh
          untracked check-pipefail-early-exit-grep.sh
          untracked check-proxy-cache-env-doc-drift.sh
          untracked check-review-chronology-comments.sh
          untracked check-workflow-line-limit.sh
          untracked classify-image-impact.sh
          untracked collect-changelog-entries.sh
          untracked compute-next-release-tag.sh
          untracked detect-full-setup-changes.sh
          untracked docker-socket-proxy.sh
          untracked ensure-pr-staging-images.sh
          untracked gc-pr-staging-images.sh
          untracked generate-vex.sh
          untracked install-ca-cert.ps1
          untracked install-ca-cert.sh
          untracked plan-deep-validation.sh
          untracked require-image-platforms.sh
          untracked select-build-tools-image.sh
          untracked ui-rust-checks.sh
          untracked validate-stack-images.sh
          LAYOUT
          ((stale_found == 0))

          git diff --check
          printf '%s\n' '--- prospective integration status ---'
          git status --short
          printf '%s\n' '--- prospective integration diff stat ---'
          git diff --stat "$CURRENT_DEV_SHA"
