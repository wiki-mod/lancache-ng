
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: promote the accepted current_dev stack to the nightly channel.
# Why: current_dev is the default branch; nightly reuses, never rebuilds (§54).
# From: Issue #1683
name: CI 2.0 Nightly
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  issues: write
concurrency:
  group: ci-2.0-nightly
  cancel-in-progress: false
defaults:
  run:
    shell: bash
# What: GHCR credentials ci.sh reads; no login action, no pin.
# Why: auth is ci.sh policy; the workflow only supplies the env.
# From: Issue #1683
env:
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # What: LAN proxy inputs; ci.sh applies them self-hosted only.
  # Why: AG-CI-009; ci.sh is the one proxy policy owner.
  # From: Issue #1683 | PR #1858
  PROJECT_SELFHOSTED_PROXY_HTTP: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
  PROJECT_SELFHOSTED_PROXY_HTTPS: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
  PROJECT_SELFHOSTED_PROXY_EXCLUSION: ${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
  PROJECT_SELFHOSTED_PROXY_CA: ${{ secrets.PROJECT_SELFHOSTED_PROXY_CA }}
jobs:
  # What: resolve the published build-tools channel to a digest.
  # Why: the nightly job runs in build-tools, never on the runner.
  # From: Issue #1683 | PR #1858
  platform:
    name: platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    # What: one mutable entry, the current_dev channel (nightly).
    # Why: ci.sh (SOT) cannot run before any container exists.
    # From: Issue #1683 | PR #1858
    container:
      image: ghcr.io/${{ github.repository }}/build-tools:nightly
      credentials: &ghcr_credentials
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # What: native fail-closed checkout, shallow; persistent ci.sh auth.
      # Why: no SHA pin outside the SOT; git comes from build-tools.
      # From: Issue #1683
      - &bootstrap
        name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GHCR_TOKEN}" | base64 -w0)"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Resolve the build-tools image
        id: resolve
        run: echo "image=$(bash .github/scripts/ci.sh build-tools resolve-image)" >> "$GITHUB_OUTPUT"

  # What: validate, then promote the accepted current_dev stack; report always.
  # Why: one job, one checkout; nightly reuses ci.sh, never rebuilds (§54).
  # From: Issue #1683
  nightly:
    name: nightly
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      # What: full-setup validation of the accepted candidate (§49/§54).
      # Why: nightly promotes only a green, already-accepted stack.
      # From: Issue #1683
      - name: Validate the accepted stack candidate
        id: validate
        run: bash .github/scripts/ci.sh validate
      # What: move the nightly channel to the validated stack (§54).
      # Why: skipped automatically if validate failed; promotion moves refs (§51).
      # From: Issue #1683
      - name: Promote the nightly channel
        id: promote
        env:
          CI_STACK_VALIDATED: SUCCESS
        run: bash .github/scripts/ci.sh promote nightly
      # What: file/close the standing nightly tracking issue on the outcome.
      # Why: nightly must be reported reliably (#1801), self-closing.
      # From: Issue #1683
      - name: Report the nightly outcome
        if: always()
        env:
          OUTCOME: ${{ (steps.validate.outcome == 'success' && steps.promote.outcome == 'success') && 'success' || 'failure' }}
        run: bash .github/scripts/ci.sh nightly-status "${OUTCOME}" "nightly channel promote (current_dev)"
