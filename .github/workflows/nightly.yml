
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later

# What: promote accepted current_dev to nightly
# Why: nightly reuses; never rebuilds current_dev
# From: Issue #1683
name: CI 2.0 Nightly
on:
  schedule:
    - cron: "23 3 * * *"
  # What: manual start; the inputs narrow it to a check.
  # Why: a channel check alone must not rebuild nightly.
  # From: Issue #1683 | PR #1858
  workflow_dispatch:
    inputs:
      channel:
        description: "one mutable channel to check; empty checks all"
        type: string
        default: ""
      only-channel-check:
        description: "run only the channel check, no nightly build or promote"
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
  issues: write
concurrency:
  group: ci-2.0-nightly
  cancel-in-progress: false
defaults:
  run:
    shell: bash
# What: supply GHCR token to ci.sh
# Why: ci.sh owns auth; workflow only wires the env
# From: Issue #1683
env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # What: optional Docker Hub login for ci.sh pulls.
  # Why: anonymous docker.io pulls hit the shared-IP limit.
  # From: Issue #1095 | PR #1858
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  # What: LAN proxy CA secret; ci.sh uses it self-hosted.
  # Why: secrets are not in CI_VARIABLES; vars are.
  # From: Issue #1683 | PR #1858
  PROJECT_SELFHOSTED_PROXY_CA: ${{ secrets.PROJECT_SELFHOSTED_PROXY_CA }}
  # What: all repo/org variables once, as json, for ci.sh.
  # Why: ci.sh reads vars by name; YAML lists none of them.
  # From: Issue #1683 | PR #1858
  CI_VARIABLES: ${{ toJSON(vars) }}
jobs:
  # What: resolve build-tools digest for nightly job
  # Why: nightly runs in build-tools, never on the runner.
  # From: Issue #1683 | PR #1858
  platform:
    name: platform
    # What: the one literal runner/timeout; emits the rest.
    # Why: ci.sh can only pick a runner once one runs it.
    # From: Issue #1683 | PR #1858
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      image: ${{ steps.resolve.outputs.image }}
      runner: ${{ steps.jobs.outputs.runner }}
      timeouts: ${{ steps.jobs.outputs.timeouts }}
      validate-dir: ${{ steps.jobs.outputs.validate-dir }}
      check-channels: ${{ steps.channels.outputs.channels }}
      check-runner: ${{ steps.channels.outputs.runner }}
    # What: one mutable entry: the current_dev channel.
    # Why: ci.sh needs a container before steps run
    # From: Issue #1683 | PR #1858
    container:
      image: ghcr.io/${{ github.repository }}/build-tools:nightly
      credentials: &ghcr_credentials
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # What: shallow x64 checkout of the nightly branch.
      # Why: schedule starts on master; master has no ci.sh.
      # From: Issue #1683 | PR #1858
      - &bootstrap
        name: Check out the nightly branch
        if: runner.arch != 'ARM64'
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.PROJECT_NIGHTLY_REF }}
          fetch-depth: 1
      # What: switch to the nightly source ref from the SOT
      # Why: the repo variable must equal the SOT source_ref
      # From: Issue #1683 | PR #1858
      - &nightly_source
        name: Check out the nightly source ref
        id: source
        env:
          CI_BOOTSTRAP_REF_VARIABLE: PROJECT_NIGHTLY_REF
        run: bash .github/scripts/ci.sh channel-checkout nightly
      - name: Resolve the build-tools image
        id: resolve
        run: bash .github/scripts/ci.sh build-tools resolve-image
      - name: Resolve the job settings
        id: jobs
        run: bash .github/scripts/ci.sh job-settings
      # What: channels and hosted runner of the check.
      # Why: ci.sh reads the SOT; YAML names no channel.
      # From: Issue #1683 | PR #1858
      - name: Resolve the channel check matrix
        id: channels
        env:
          CHECK_CHANNEL: ${{ inputs.channel }}
        run: bash .github/scripts/ci.sh channel-matrix

  # What: one planner: the pair ids and the build matrix.
  # Why: §72, §82: nightly holds no second admission path.
  # From: Issue #1683 | PR #1912
  plan:
    name: plan
    needs: platform
    # What: a check-only dispatch skips the nightly chain.
    # Why: build, validate and promote all need the plan.
    # From: Issue #1683 | PR #1858
    if: ${{ !inputs.only-channel-check }}
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['plan'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
      # What: the build-tools ref this job runs in.
      # Why: ids and Rust builds read the platform resolve.
      # From: Issue #1683 | PR #1912
      env:
        CI_BUILD_TOOLS_IMAGE: ${{ needs.platform.outputs.image }}
    outputs:
      identities: ${{ steps.plan.outputs.identities }}
      matrix: ${{ steps.plan.outputs.matrix }}
      any-build: ${{ steps.plan.outputs.any-build }}
    steps:
      - *bootstrap
      # What: check out the commit the platform job resolved
      # Why: plan, validate and promote must see one tree
      # From: Issue #1683 | PR #1912
      - &channel_pin
        name: Check out the resolved nightly commit
        env:
          SOURCE_COMMIT: ${{ needs.platform.outputs.commit }}
        run: bash .github/scripts/ci.sh channel-checkout nightly "${SOURCE_COMMIT}"
      # What: collect the changed-file list via ci.sh.
      # Why: one owner; a run with no base lists them all.
      # From: Issue #1683 | PR #1912
      - name: Collect changed files
        id: changed
        run: bash .github/scripts/ci.sh changed-files
      # What: the same planner command ci.yml calls.
      # Why: §6.2: nightly produces only what is missing.
      # From: Issue #1683 | PR #1912
      - name: Plan the build matrix and record the ids
        id: plan
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci.sh plan-matrix

  # What: build only what the plan admitted, then ship it.
  # Why: §6.2: nightly produces the missing results.
  # From: Issue #1683 | PR #1912
  build:
    name: build ${{ matrix.service }} ${{ matrix.arch }}
    needs: [platform, plan]
    if: needs.plan.outputs.any-build == 'true'
    # What: each target and platform builds to its end.
    # Why: one red build must not cancel the other targets.
    # From: Issue #1683 | PR #1912
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['build'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
      # What: the build-tools ref this job runs in.
      # Why: ids and Rust builds read the platform resolve.
      # From: Issue #1683 | PR #1912
      env:
        CI_BUILD_TOOLS_IMAGE: ${{ needs.platform.outputs.image }}
    # What: cache secrets the build's set-runtime needs.
    # Why: secrets never reach ci.sh through CI_VARIABLES.
    # From: Issue #1683 | PR #1912
    env:
      SCCACHE_REDIS_URL: ${{ secrets.SCCACHE_REDIS_URL }}
      SCCACHE_DIST_AUTH_TOKEN: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
    steps:
      - *bootstrap
      # What: arm64 checkout of the nightly branch by git.
      # Why: no actions/checkout; push auth is CI_GIT_TOKEN.
      # From: Issue #1683 | PR #1858
      - name: Check out the nightly branch on arm64
        if: runner.arch == 'ARM64'
        uses: docker://mirror.gcr.io/alpine/git:latest
        with:
          args: -c safe.directory=/github/workspace clone --quiet --depth 1 --branch=${{ vars.PROJECT_NIGHTLY_REF }} ${{ github.server_url }}/${{ github.repository }} /github/workspace
      - *channel_pin
      # What: export args for the GHA cache runtime step.
      # Why: ci.sh owns the kill timeout and the var list.
      # From: Issue #1683 | PR #1912
      - name: Prepare the GHA cache runtime export
        id: gha-runtime
        run: bash .github/scripts/ci.sh gha-runtime-args
      # What: hand the GHA cache runtime to later steps.
      # Why: only action steps get ACTIONS_RUNTIME_TOKEN.
      # From: Issue #1683 | PR #1912
      - name: Export the GHA cache runtime
        uses: docker://mirror.gcr.io/library/alpine:latest
        with:
          entrypoint: timeout
          args: ${{ steps.gha-runtime.outputs.args }}
      # What: build, then publish and verify the result.
      # Why: publish is not build; readback proves it.
      # From: Issue #1683 | PR #1912
      - name: Build, publish and verify the platform image
        env:
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # What: jobs that read ids use the plan's record.
          # Why: one run, one id; ci.sh fails on a gap.
          # From: Issue #1683 | PR #1912
          CI_RUN_IDENTITIES: &run_ids ${{ needs.plan.outputs.identities }}
          # What: job token for the build lock ref pushes.
          # Why: the arm64 checkout leaves no git auth.
          # From: Issue #1683 | PR #1858
          CI_GIT_TOKEN: &git_token ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci.sh ship "${SERVICE}" "${PLATFORM}"
      # What: frees this run's build lock after a cancel.
      # Why: a cancel stops the step; bash gets no signal.
      # From: Issue #1683 | PR #1912
      - name: Release the build lock after a cancel
        if: cancelled()
        env:
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.platform }}
          CI_RUN_IDENTITIES: *run_ids
          CI_GIT_TOKEN: *git_token
        run: bash .github/scripts/ci.sh ship-release "${SERVICE}" "${PLATFORM}"

  # What: aggregate this run's acceptance into the ledger.
  # Why: one aggregator, one CAS commit, after the scan.
  # From: Issue #1683 | PR #1912
  aggregate:
    name: aggregate
    needs: [platform, plan, build, scan]
    if: >-
      !cancelled() && needs.scan.outputs.passed != '' &&
      needs.plan.outputs.any-build == 'true'
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['aggregate'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      - *channel_pin
      - name: Aggregate acceptance into the ledger
        env:
          CI_BUILD_MATRIX: ${{ needs.scan.outputs.passed }}
          CI_RUN_IDENTITIES: *run_ids
        run: bash .github/scripts/ci.sh aggregate-stack

  # What: merge the platform digests into one index.
  # Why: each accepted product needs an exact index.
  # From: Issue #1683 | PR #1858
  assemble:
    name: assemble
    needs: [platform, plan, build, scan, aggregate]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.scan.result == 'success' &&
      (needs.plan.outputs.any-build == 'false' ||
      needs.aggregate.result == 'success')
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['assemble'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    # What: token for the platform-mismatch issues.
    # Why: DoMe: a platform left out opens an issue.
    # From: Issue #1683 | PR #1858
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - *bootstrap
      - *channel_pin
      - name: Assemble multi-arch indexes
        env:
          CI_BUILD_MATRIX: ${{ needs.scan.outputs.passed }}
          CI_RUN_IDENTITIES: *run_ids
        run: bash .github/scripts/ci.sh assemble-stack --with-products

  # What: validate full stack of accepted candidate
  # Why: AG-VAL-016; the shared dir keeps host paths.
  # From: Issue #1683 | PR #1912
  validate:
    name: validate
    needs: [platform, plan, build, scan, aggregate, assemble]
    # What: validate only after assembly succeeds.
    # Why: every accepted product needs an index.
    # From: Issue #1683 | PR #1858
    if: >-
      !cancelled() && needs.assemble.result == 'success'
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['validate'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
      volumes:
        - ${{ needs.platform.outputs.validate-dir }}:${{ needs.platform.outputs.validate-dir }}
    steps:
      - *bootstrap
      - *channel_pin
      - name: Validate the accepted stack candidate
        env:
          # What: the plan job's pair ids for this run.
          # Why: a live re-read can differ; a gap fails.
          # From: Issue #1683 | PR #1912
          CI_RUN_IDENTITIES: *run_ids
        run: bash .github/scripts/ci.sh validate

  # What: audit the generated lock for new advisories
  # Why: advisory data moves daily; PRs audit candidates
  # From: Issue #1683 | PR #1858
  cargo-audit:
    name: cargo-audit
    needs: platform
    if: ${{ !inputs.only-channel-check }}
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['cargo-audit'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      - *channel_pin
      - name: Audit rust dependencies
        run: bash .github/scripts/ci.sh check cargo-audit
      # What: warn when an action has a newer major tag.
      # Why: maintainer 24.10.: once a night, only warns.
      # From: Issue #1683 | PR #1858
      - name: Warn on newer action major tags
        if: ${{ !cancelled() }}
        run: bash .github/scripts/ci.sh check action-majors

  # What: promote validated current_dev
  # Why: nightly reuses; never rebuilds
  # From: Issue #1683
  nightly:
    name: nightly
    needs: [platform, plan, validate]
    if: ${{ !cancelled() && needs.platform.result == 'success' }}
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['nightly'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      - *channel_pin
      # What: promote nightly channel to validated stack
      # Why: only after validate passed; moves refs only
      # From: Issue #1683
      - name: Promote the nightly channel
        if: needs.validate.result == 'success'
        env:
          CI_STACK_VALIDATED: SUCCESS
          CI_RUN_IDENTITIES: *run_ids
        run: bash .github/scripts/ci.sh promote nightly

  # What: pull each channel by its tag and start it.
  # Why: a lost image must fail here, not at a user's pull.
  # From: Issue #1683 | PR #1858
  channel-check:
    name: channel-check ${{ matrix.channel }}
    # What: after promote, so nightly is today's channel.
    # Why: a check-only dispatch has a skipped promote.
    # From: Issue #1683 | PR #1858
    needs: [platform, nightly]
    if: ${{ !cancelled() && needs.platform.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.platform.outputs.check-channels) }}
    runs-on: ${{ needs.platform.outputs.check-runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['channel-check'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
      volumes:
        - ${{ needs.platform.outputs.validate-dir }}:${{ needs.platform.outputs.validate-dir }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - *bootstrap
      # What: the tree the channel's images were built from.
      # Why: compose and checks must match those images.
      # From: Issue #1683 | PR #1858
      - name: Check out the channel source ref
        env:
          CHANNEL: ${{ matrix.channel }}
        run: bash .github/scripts/ci.sh channel-checkout "${CHANNEL}"
      - name: Pull the channel by its tag and start the stack
        id: check
        env:
          CHANNEL: ${{ matrix.channel }}
        run: bash .github/scripts/ci.sh channel-check "${CHANNEL}"
      # What: back to the nightly tree, then file the issue.
      # Why: the latest tree is master; its ci.sh differs.
      # From: Issue #1683 | PR #1858
      - name: Check out the resolved nightly commit
        if: ${{ !cancelled() }}
        env:
          SOURCE_COMMIT: ${{ needs.platform.outputs.commit }}
        run: bash .github/scripts/ci.sh channel-checkout nightly "${SOURCE_COMMIT}"
      - name: File or close the channel issue
        if: ${{ !cancelled() }}
        env:
          CHANNEL: ${{ matrix.channel }}
          OUTCOME: ${{ steps.check.outcome }}
        run: bash .github/scripts/ci.sh channel-report "${CHANNEL}" "${OUTCOME}"

  # What: scan what this run built and every channel image.
  # Why: §31 a new CVE; §96 acceptance needs a scan.
  # From: Issue #1683 | PR #1912
  scan:
    name: scan
    needs: [platform, plan, build]
    # What: the CVE scan runs whatever the build did.
    # Why: §31: a new CVE hits an image no build scans.
    # From: Issue #1683 | PR #1912
    if: >-
      !cancelled() && needs.plan.result == 'success'
    runs-on: ${{ needs.platform.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.platform.outputs.timeouts)['scan'] }}
    container:
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      passed: ${{ steps.scan.outputs.passed }}
    steps:
      - *bootstrap
      - *channel_pin
      # What: scan the images this run built, by digest.
      # Why: §96: READBACK, SCAN, then acceptance.
      # From: Issue #1683 | PR #1912
      - name: Scan the built images by digest
        id: scan
        if: needs.plan.outputs.any-build == 'true'
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
          CI_RUN_IDENTITIES: *run_ids
        run: bash .github/scripts/ci.sh scan-stack
      # What: the channel scan runs after the stack scan.
      # Why: §31: a new CVE hits an image no build scans.
      # From: Issue #1683 | PR #1912
      - name: Scan every channel image
        if: ${{ !cancelled() }}
        env:
          CI_RUN_IDENTITIES: *run_ids
        run: bash .github/scripts/ci.sh scan-channel

  # What: report the nightly outcome to the tracking issues
  # Why: own job; it runs when platform or a job failed
  # From: Issue #1683 | PR #1912
  report:
    name: report
    needs: [platform, plan, build, scan, aggregate, assemble, validate, cargo-audit, nightly]
    if: ${{ !cancelled() }}
    # What: platform's runner and image, else the pair.
    # Why: the report must run when platform failed.
    # From: Issue #1683 | PR #1912
    runs-on: ${{ needs.platform.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    container:
      image: ${{ needs.platform.outputs.image || format('ghcr.io/{0}/build-tools:nightly', github.repository) }}
      credentials: *ghcr_credentials
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - *bootstrap
      - *nightly_source
      - name: Report the nightly outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci.sh nightly-report
