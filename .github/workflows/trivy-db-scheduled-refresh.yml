
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Refreshes the shared, NFS-mounted Trivy vulnerability-DB cache
# (/mnt/trivy-db by default, resolved via trivy-cache-dir) on its own
# fixed cron, as the sole regular writer to that shared path. Replaces
# the previous design where trivy-db-ensure-fresh unconditionally took
# a cross-job mkdir-lock on every build/scan job before even checking
# whether a refresh was needed (Issue #1095 | PR #1747) -- serializing
# every concurrent matrix.service job on a push behind one lock even
# though `trivy image --download-db-only` itself already no-ops once
# metadata.json's NextUpdate has not yet passed. With this workflow as
# the sole writer, every regular scan job now reads the shared DB with
# --skip-db-update unconditionally (via trivy-db-ensure-fresh's reduced,
# stat-only common path) -- no lock, no per-job freshness check. See
# trivy-db-ensure-fresh/action.yml for the narrow bootstrap-only
# exception that remains lock-guarded (a genuine cold cache).
#
# CADENCE (6 hours, cron "0 */6 * * *"): matches
# aquasecurity/trivy-db's own publish cadence (that repo's
# .github/workflows/cron.yml runs "0 */6 * * *", confirmed via the
# GitHub API against the real upstream repo). trivy-db's own DB build
# sets metadata.json's NextUpdate 24h out (`trivy-db build
# --update-interval 24h`, confirmed in that repo's Makefile), so a
# client only strictly needs to re-check once a day to honor that
# window -- but running on the SAME 6h cadence upstream actually
# publishes on keeps this shared DB close to the freshest available
# build rather than the up-to-24h-stale worst case a slower cron would
# risk, at the cost of extra runs that are cheap no-ops most of the
# time (trivy's own --download-db-only skips the real download whenever
# the locally cached NextUpdate has not passed yet).
#
# WHY A SEPARATE WORKFLOW FILE, NOT A JOB IN build-push.yml/
# build-tools.yml: this is a new, independent responsibility (its own
# schedule trigger, its own single-writer concurrency group, no shared
# job dependencies with either build workflow) -- exactly the case for
# a new file per AG-CODE-013's decision tree, not an addition to an
# existing one; mirrors vex-regenerate.yml's identical reasoning for
# the same rule. AG-CODE-011/013 search: no existing workflow or
# composite action owns "refresh the shared Trivy DB on a timer"
# (nightly-refresh.yml only dispatches build-push.yml's own pipeline
# for an unrelated channel-promotion purpose); the maintainer directed
# this exact design (a dedicated scheduled-refresh workflow as the
# shared DB's sole writer) before implementation began, which is this
# new file's maintainer ACK.
#
# AG-CI-018/019 note: a `schedule:` trigger only ever fires from this
# file's copy on the repository's DEFAULT branch (master), never from
# current_dev, regardless of which branch authored/merged it -- same
# gap nightly-refresh.yml and vex-regenerate.yml already document for
# themselves. This workflow will not actually run on its own cron until
# promoted to master at the next release cut; workflow_dispatch below
# is a manual escape hatch for that gap, not proof the schedule itself
# fires (AG-CI-012).
#
# PERMISSION DIAGNOSTICS: added after a maintainer-reported live
# failure on the real shared mount ("mkdir /mnt/trivy-db/db: permission
# denied") surfaced while this issue was being scoped. Every regular
# CI job that already writes here today runs as the self-hosted
# runner's own "codex" uid and succeeds (confirmed: trivy-cache-dir's
# own write-probe already exercises mkdir+write+delete against this
# exact mount on every job, and the prior lock-based design's own
# `mkdir "$lock_dir"` succeeded routinely) -- so a uid other than the
# CI runner's own (e.g. a manual/root shell session on the runner host)
# most likely left a differently-owned entry under the shared path.
# This job cannot chown a path it does not already own, so instead of
# failing with trivy's own opaque FATAL error, "Diagnose Trivy DB
# directory permissions before download" below fails loudly with the
# actual uid/ownership state attached, and this workflow never
# swallows that failure (AG-INT-002) -- see this change's own PR body
# for the operator-side remediation this cannot perform from CI.
name: Trivy DB Scheduled Refresh

on:
  schedule:
    - cron: "0 */6 * * *"
  # Manual escape hatch, same rationale as nightly-refresh.yml's own
  # workflow_dispatch: exercises the refresh logic without waiting for
  # the next tick, and without itself proving the cron trigger fires
  # (AG-CI-012, AG-CI-018 note above).
  workflow_dispatch: {}

# Scoped to exactly what this job needs: read the repo for its composite
# actions/scripts, log in to GHCR/Docker Hub for the DB pull. No
# package-write, issue, or PR permissions.
permissions:
  contents: read

concurrency:
  # What: single group, never cancelled mid-run.
  # Why: sole writer; two writers must never overlap.
  # From: Issue #1780
  group: trivy-db-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh-trivy-db:
    name: refresh shared Trivy vulnerability DB
    # What: network/IO-bound DB pull, not CPU/memory heavy.
    # Why: AG-CI-002 routes light jobs to a light runner.
    # From: Issue #1780
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # A real ~1.3 GB DB download over a home-lab link plus retries can
    # legitimately take several minutes (trivy-db-ensure-fresh's own
    # stale-lock-seconds default documents the same real-world figure);
    # generous headroom over that rather than GitHub's 360-minute
    # default (AG-CI-016).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve shared Trivy DB cache directory
        id: trivy-cache
        uses: ./.github/actions/trivy-cache-dir

      - name: Install trivy CLI
        uses: ./.github/actions/aquasecurity-setup-trivy-centralized-version

      # What: logs in for authenticated, rate-limited pulls.
      # Why: a cron pull every 6h risks a rate limit.
      # From: Issue #1780 | Issue #1535
      - name: Log in to GHCR for authenticated Trivy DB pull
        continue-on-error: true
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: unconditional, like the GHCR login step above.
      # Why: secrets is invalid in a step's if: condition.
      # From: Issue #1780
      - name: Log in to Docker Hub for the third DB-source tier
        continue-on-error: true
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # What: fails loudly with real uid/ownership shown.
      # Why: names the permission cause, never hides it.
      # From: Issue #1780
      - name: Diagnose Trivy DB directory permissions before download
        env:
          CACHE_DIR: ${{ steps.trivy-cache.outputs.dir }}
        run: |
          set -euo pipefail
          : "${CACHE_DIR:?cache-dir is required}"
          echo "::group::Trivy DB permission diagnostics"
          echo "Running as: $(id)"
          ls -la "$CACHE_DIR" || true
          [ -d "$CACHE_DIR/db" ] && ls -ld "$CACHE_DIR/db"
          echo "::endgroup::"

          db_dir="$CACHE_DIR/db"
          if ! mkdir -p "$db_dir" 2>/tmp/trivy-db-mkdir-err.txt; then
            echo "::error::Cannot create/use '$db_dir' as $(id -un) ($(id -u):$(id -g)): $(cat /tmp/trivy-db-mkdir-err.txt). This job is the shared Trivy DB's sole writer; every regular CI job already succeeds writing here as this same runner uid (trivy-cache-dir's own write-probe proves it), so a mismatched owner/mode on this exact path is almost certainly left over from a manual/root session on the runner host, not something a workflow step can chown -- needs an operator fix on the runner host (see this change's PR body)." >&2
            exit 1
          fi
          probe="$db_dir/.trivy-db-scheduled-refresh-write-probe.$$"
          if ! { printf 'probe' > "$probe" && rm -f "$probe"; }; then
            echo "::error::'$db_dir' exists but is not writable as $(id -un) ($(id -u):$(id -g)) -- same operator-side ownership/permission fix needed as above." >&2
            exit 1
          fi

      # What: retries a flaky pull, GHCR-first mirror order.
      # Why: AG-CI-013 -- reuse the shared retry wrapper.
      # From: Issue #1780 | Issue #1535
      - name: Refresh the shared Trivy DB
        env:
          CACHE_DIR: ${{ steps.trivy-cache.outputs.dir }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${CACHE_DIR:?cache-dir is required}"
          # shellcheck source=scripts/lib/ghcr-retry.sh
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            trivy image --download-db-only --cache-dir "$CACHE_DIR" \
              --config .github/actions/trivy-scan-retry/trivy-config.yaml

      # What: fails the job when no DB exists after refresh.
      # Why: an empty shared DB must never read as success.
      # From: Issue #1780
      - name: Require a real Trivy DB file after refresh
        env:
          CACHE_DIR: ${{ steps.trivy-cache.outputs.dir }}
        run: |
          set -euo pipefail
          : "${CACHE_DIR:?cache-dir is required}"
          if [ ! -s "$CACHE_DIR/db/trivy.db" ]; then
            echo "::error::No trivy.db present in '$CACHE_DIR/db' after a reported-successful refresh -- every downstream scan job's --skip-db-update assumption depends on this file existing, so this must fail loudly rather than report success." >&2
            exit 1
          fi
          echo "::notice::Shared Trivy DB refreshed and present at '$CACHE_DIR/db/trivy.db'."
