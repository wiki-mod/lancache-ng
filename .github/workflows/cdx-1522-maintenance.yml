
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary same-repository patch executor for the active CI 1.1 Draft.
# It exists only because the connector can replace files but cannot apply a
# small patch safely to build-push.yml without retransmitting the whole file.

name: CDX CI 1.1 patch executor

on:
  pull_request:
    branches: [current_dev]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.number == 1523 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply the staged patch and push it to the Draft branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          mapfile -t patch_files < <(find .github -maxdepth 1 -type f -name 'cdx-1522-point*.patch' -print | sort)
          if [[ "${#patch_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one staged CI 1.1 patch, found ${#patch_files[@]}."
            exit 1
          fi

          patch_file="${patch_files[0]}"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git rm -- "$patch_file"
          git diff --cached --check
          git add -A
          git diff --cached --check

          marker="CDX-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$marker ci: apply CI 1.1 implementation step"
          git push origin "HEAD:${HEAD_REF}"
