
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# One-shot transport wrapper for the maintainer-approved Rust header rollout.
# It reuses the already-executed transformation body from the sibling helper,
# then pushes only non-workflow state. Exact workflow blobs are carried under a
# non-workflow path so the GitHub connector can assemble and verify the final tree.
name: One-shot Rust header split transport

on:
  push:
    branches:
      - agent/1517-spdx-header-backfill
    paths:
      - .github/workflows/_rust-header-rollout-split-once.yml

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the draft branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/1517-spdx-header-backfill
          fetch-depth: 0

      - name: Reuse validated transform and stage connector carriers
        shell: bash
        run: |
          set -euo pipefail

          source_helper='.github/workflows/_rust-header-rollout-once.yml'
          branch='agent/1517-spdx-header-backfill'
          old_integrated_base='cb2ceb1c1c1032591b2544eb0dabbdbe5ccc7506'
          expected_base='5ffef2c5489d5ae5b68336ae43ee89ffc667e468'
          export PRE_SPLIT_HEAD="$(git rev-parse HEAD)"

          # The connector already verified that these are the only workflow
          # files added/changed by current_dev since the branch's last merged
          # base. Refuse to proceed if that assumption is no longer exact.
          git fetch origin current_dev
          actual_base="$(git rev-parse origin/current_dev)"
          if [ "$actual_base" != "$expected_base" ]; then
            echo "::error::current_dev moved after connector verification: expected $expected_base, got $actual_base" >&2
            exit 1
          fi
          workflow_delta="$(git diff --name-only "$old_integrated_base".."$expected_base" -- .github/workflows)"
          expected_workflow_delta=$'.github/workflows/build-push.yml\n.github/workflows/build-tools-smoke.yml'
          if [ "$workflow_delta" != "$expected_workflow_delta" ]; then
            printf '::error::Workflow delta differs from the connector-verified pair.\nExpected:\n%s\nActual:\n%s\n' "$expected_workflow_delta" "$workflow_delta" >&2
            exit 1
          fi

          # Extract the transformation/validation body from the sibling helper
          # and stop immediately before its rejected workflow-changing commit.
          awk '
            $0 == "        run: |" { in_script = 1; next }
            in_script {
              if ($0 == "          git add -A") exit
              sub(/^          /, "")
              print
            }
          ' "$source_helper" > /tmp/header-transform.sh
          test -s /tmp/header-transform.sh

          cat >> /tmp/header-transform.sh <<'SPLIT'

          # At this point the full merged worktree has passed the whole-repo
          # header guard, Rust first-three-line assertions, bash -n, and
          # git diff --check in the reused transformation body.
          rm -f .github/workflows/_rust-header-rollout-once.yml
          rm -f .github/workflows/_rust-header-rollout-split-once.yml
          git add -A
          git diff --cached --check
          expected_final_tree="$(git write-tree)"

          cp .github/workflows/build-push.yml /tmp/header-rollout-build-push.yml
          cp .github/workflows/build-tools-smoke.yml /tmp/header-rollout-build-tools-smoke.yml
          build_push_blob="$(git hash-object /tmp/header-rollout-build-push.yml)"
          build_tools_smoke_blob="$(git hash-object /tmp/header-rollout-build-tools-smoke.yml)"

          # Clear the in-progress merge while preserving its validated working
          # tree. Restore workflow paths to the current Draft head so the bot
          # push itself contains zero .github/workflows changes.
          git reset --mixed "$PRE_SPLIT_HEAD"
          git restore --source="$PRE_SPLIT_HEAD" --staged --worktree -- .github/workflows

          mkdir -p .header-rollout-carrier
          cp /tmp/header-rollout-build-push.yml .header-rollout-carrier/build-push.yml
          cp /tmp/header-rollout-build-tools-smoke.yml .header-rollout-carrier/build-tools-smoke.yml

          [ "$(git hash-object .header-rollout-carrier/build-push.yml)" = "$build_push_blob" ]
          [ "$(git hash-object .header-rollout-carrier/build-tools-smoke.yml)" = "$build_tools_smoke_blob" ]

          git add -A
          staged_workflows="$(git diff --cached --name-only -- .github/workflows)"
          if [ -n "$staged_workflows" ]; then
            printf '::error::Split transport unexpectedly stages workflow paths:\n%s\n' "$staged_workflows" >&2
            exit 1
          fi
          git diff --cached --check

          marker="GPT-$(date +%s)"
          git commit -m "$marker" -m 'chore(governance): stage Rust header contract outside workflows'
          git push origin "HEAD:$branch"

          printf 'EXPECTED_BASE=%s\n' "$expected_base"
          printf 'EXPECTED_FINAL_TREE=%s\n' "$expected_final_tree"
          printf 'BUILD_PUSH_BLOB=%s\n' "$build_push_blob"
          printf 'BUILD_TOOLS_SMOKE_BLOB=%s\n' "$build_tools_smoke_blob"
          printf 'NONWORKFLOW_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'RUST_TOTAL=%s\n' "$rust_total"
          printf 'RUST_REWRITTEN=%s\n' "$rust_rewritten"
          SPLIT

          bash /tmp/header-transform.sh
