
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: welcome comment on an author's first issue or PR
# Why: ci.sh owns the logic; the job runs base code only
# From: Issue #1683 | PR #1858
name: First Interaction

# What: opened issues and target PRs; a manual run skips.
# Why: a fork PR comment needs the base write token.
# From: Issue #1683 | PR #1858
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
defaults:
  run:
    shell: bash
env:
  # What: the repo variables ci.sh reads, one by name.
  # Why: Fund 94: the all-vars json put LAN IPs in logs.
  # From: Issue #1683 | PR #1858
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS }}
  PROJECT_CARGO_LTO: ${{ vars.PROJECT_CARGO_LTO }}
  PROJECT_CARGO_CODEGENUNIT: ${{ vars.PROJECT_CARGO_CODEGENUNIT }}
  PROJECT_NIGHTLY_REF: ${{ vars.PROJECT_NIGHTLY_REF }}
  PROJECT_SELFHOSTED_RUNNER_USAGE_CI: ${{ vars.PROJECT_SELFHOSTED_RUNNER_USAGE_CI }}
  SCCACHE_REDIS_MODE: ${{ vars.SCCACHE_REDIS_MODE }}
  CI_RUST_VALIDATION: ${{ vars.CI_RUST_VALIDATION }}
  PR_TITLE_LINT_MODE: ${{ vars.PR_TITLE_LINT_MODE }}
  # What: LAN values only when self-hosted runners run.
  # Why: a GitHub-hosted log must show no LAN address.
  # From: Issue #1683 | PR #1858
  PROJECT_SELFHOSTED_PROXY_HTTP: ${{ vars.PROJECT_SELFHOSTED_RUNNER_USAGE_CI == 'true' && vars.PROJECT_SELFHOSTED_PROXY_HTTP || '' }}
  PROJECT_SELFHOSTED_PROXY_HTTPS: ${{ vars.PROJECT_SELFHOSTED_RUNNER_USAGE_CI == 'true' && vars.PROJECT_SELFHOSTED_PROXY_HTTPS || '' }}
  PROJECT_SELFHOSTED_PROXY_EXCLUSION: ${{ vars.PROJECT_SELFHOSTED_RUNNER_USAGE_CI == 'true' && vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION || '' }}
  SCCACHE_DIST_SCHEDULER_URL: ${{ vars.PROJECT_SELFHOSTED_RUNNER_USAGE_CI == 'true' && vars.SCCACHE_DIST_SCHEDULER_URL || '' }}
  DISTCC_POTENTIAL_HOSTS: ${{ vars.PROJECT_SELFHOSTED_RUNNER_USAGE_CI == 'true' && vars.DISTCC_POTENTIAL_HOSTS || '' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  welcome:
    # What: literal runner and timeout of a root job.
    # Why: SOT ci_job_timeouts: pre-platform jobs keep these
    # From: Issue #1683 | PR #1858
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What: fetch GITHUB_SHA only: the default branch tip
      # Why: pull_request_target must never run PR code.
      # From: Issue #1683 | PR #1858
      - name: Check out the base tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Welcome a first issue or pull request
        run: bash .github/scripts/ci.sh welcome
