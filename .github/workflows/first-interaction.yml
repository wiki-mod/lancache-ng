
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: welcome comment on an author's first issue or PR
# Why: ci.sh owns the logic; the job runs base code only
# From: Issue #1683 | PR #1858
name: First Interaction

# What: issues and target PR events, opened only.
# Why: a fork PR comment needs the base write token.
# From: Issue #1683 | PR #1858
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: read
defaults:
  run:
    shell: bash
env:
  CI_VARIABLES: ${{ toJSON(vars) }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  welcome:
    # What: runner and timeout equal the SOT root-job values
    # Why: a root job cannot read job-settings outputs
    # From: Issue #1683 | PR #1858
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What: fetch GITHUB_REF only (the base for a PR).
      # Why: pull_request_target must never run PR code.
      # From: Issue #1683 | PR #1858
      - name: Bootstrap the base tree
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Welcome a first issue or pull request
        run: bash .github/scripts/ci.sh welcome
