
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: welcome comment on an author's first issue or PR
# Why: ci.sh owns the logic; the job runs base code only
# From: Issue #1683 | PR #1858
name: First Interaction

# What: issues and target PR events, opened only.
# Why: a fork PR comment needs the base write token.
# From: Issue #1683 | PR #1858
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: read
defaults:
  run:
    shell: bash
env:
  CI_VARIABLES: ${{ toJSON(vars) }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  welcome:
    # What: runner and timeout equal the SOT root-job values
    # Why: a root job cannot read job-settings outputs
    # From: Issue #1683 | PR #1858
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What: fetch GITHUB_SHA only: the default branch tip
      # Why: pull_request_target must never run PR code.
      # From: Issue #1683 | PR #1858
      - name: Check out the base tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Welcome a first issue or pull request
        run: bash .github/scripts/ci.sh welcome
