
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# CI workflow that runs CodeQL static analysis (GitHub Actions and Rust languages)
# on pushes, pull requests, and a daily schedule, uploading SARIF results as security alerts.
name: CodeQL

on:
  push:
    # current_dev is the active development branch today (v0.2.0 is frozen);
    # without it, CodeQL silently stopped scanning the branch real work
    # actually lands on (#709).
    branches: [master, current_dev, v0.2.0]
    paths-ignore:
      - "**/*.md"
  pull_request:
    # current_dev is the active development branch today (v0.2.0 is frozen);
    # without it, CodeQL silently stopped scanning the branch real work
    # actually lands on (#709).
    branches: [master, current_dev, v0.2.0]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "24 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS }}

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    # Gates the memory-heavy "rust" matrix entry below on whether the diff
    # actually touches the Rust build CodeQL analyzes, the same efficiency
    # class of fix as #1253 (narrowing build-tools.yml's image-rebuild
    # trigger): before this job existed, EVERY push/PR re-ran the full Rust
    # CodeQL extraction+analysis on the unchanged services/dns/ui crates --
    # e.g. a docs/CI-only PR like #1247 -- burning lancache-heavy runner time
    # for zero new signal. The "actions" matrix entry (which scans the
    # workflow files themselves) is untouched by this job and keeps running
    # on every trigger; only "rust" is scoped.
    #
    # "Analyze (rust)"/"Analyze (actions)" are NOT in current_dev's required
    # status checks (verified via `gh api repos/wiki-mod/lancache-ng/branches/
    # current_dev/protection` on 2026-07-25: the required contexts list is
    # shellcheck, validate-compose, CI scope policy, line endings, file
    # purpose headers, PR template validation, PR tracking metadata
    # (labels/milestone/project), coverage (Rust), validate full-setup image
    # -- CodeQL is absent from that list), so skipping the rust matrix entry
    # outright (rather than the self-skip-internally pattern a *required*
    # check would need, per Rule-Ref: AG-CI-012's "paths-ignore permanently
    # blocks a required check" trap) cannot strand a PR in a perpetually-pending state.
    name: detect changed paths (CodeQL rust relevance)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: [self-hosted, linux, lancache, lancache-light]
    # Real runs are one git diff plus the shared path classifier, comparable
    # to build-push.yml's own detect-changes job. Keep the same generous floor.
    timeout-minutes: 15
    outputs:
      rust_relevant: ${{ steps.filter.outputs.rust_relevant }}
      superseded: ${{ steps.supersession.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A live remote-head check keeps already-stale runs out of the serialized
      # analyze jobs below without relying on concurrency admission order.
      #
      # PR-only: not applied to push. Every push already runs its analyze
      # job independently, so scoping this to pull_request trades away
      # reclaiming a genuinely-superseded push's analyze compute in exchange for
      # never mis-skipping a push whose only "replacement" was excluded by
      # paths-ignore. That trade only matters for push, because this
      # workflow's push trigger has `paths-ignore: ["**/*.md"]`: a follow-up
      # Markdown-only push moves the branch head without producing any
      # replacement CodeQL run, and ls-remote can't distinguish that from a
      # real replacement -- including push here would wrongly mark the still-
      # current code-change push as superseded and leave it permanently
      # unscanned until another eligible push or the daily cron.
      # schedule/workflow_dispatch have no "newer trigger" concept either.
      #
      # Deliberately compares against refs/pull/<N>/head, not
      # refs/pull/<N>/merge -- GitHub regenerates the merge ref on every
      # base-branch change too, not just on a push to the PR's own head,
      # which would report "superseded" for reasons unrelated to staleness.
      - name: Check whether this run is already superseded
        id: supersession
        env:
          CHECK_EVENT_NAME: ${{ github.event_name }}
          CHECK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          superseded=false
          current_head=""

          if [ "$CHECK_EVENT_NAME" = "pull_request" ]; then
            : "${CHECK_PR_NUMBER:?pull_request event must carry a PR number}"
            # github.sha identifies the synthetic merge commit for PR events,
            # while refs/pull/<N>/head identifies the contributor's head. Use
            # like-for-like SHAs so a current PR is not rejected as stale.
            : "${CHECK_PR_HEAD_SHA:?pull_request event must carry a head SHA}"
            if ! current_head="$(bash scripts/tracked/resolve-remote-ref-with-retry.sh \
              origin "refs/pull/${CHECK_PR_NUMBER}/head")"; then
              current_head=""
            fi

            if [ -z "$current_head" ]; then
              # Deliberately fails OPEN (superseded=false), same
              # asymmetric-risk reasoning as build-push.yml's own copy of
              # this check: an unresolvable ls-remote must never cause a
              # real commit's analysis to be wrongly skipped, only ever an
              # already-superseded one.
              echo "::warning::Could not resolve the current remote head for this pull request; failing open (treating this run as NOT superseded)."
            elif [ "$current_head" != "$CHECK_PR_HEAD_SHA" ]; then
              echo "::notice::This PR has already moved to ${current_head} since this run was triggered for ${CHECK_PR_HEAD_SHA}; a newer run already supersedes this one."
              superseded=true
            fi
          fi
          # push/schedule/workflow_dispatch: no live self-skip here (see the
          # comment above this step) -- superseded stays false.

          echo "superseded=$superseded" >> "$GITHUB_OUTPUT"

      - name: Determine whether this diff touches the Rust build CodeQL analyzes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          : "${GITHUB_SHA:?GitHub checkout SHA is required}"

          # Same base/before resolution build-push.yml's detect-changes job
          # uses (#536's merge-base fix so an unrelated already-merged base
          # change isn't misattributed to this branch; #1095's push
          # before-SHA fallback for an all-zeros/force-pushed/unreachable
          # base) -- mirrored inline rather than imported, since GitHub
          # Actions has no cross-workflow step/job reuse for plain
          # (non-reusable) workflows.
          changed_files="$(mktemp)"
          force_all=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            : "${BASE_SHA:?pull request base SHA is required}"
            merge_base="$(git merge-base "$BASE_SHA" "$GITHUB_SHA")"
            git diff --name-only "$merge_base" "$GITHUB_SHA" > "$changed_files"
          else
            if [ -z "$BEFORE_SHA" ] \
              || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::notice::No usable push diff base (before='${BEFORE_SHA:-<empty>}'); treating this push as rust-relevant."
              force_all=true
            else
              git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files"
            fi
          fi

          # Reuse the same per-path rules build-push.yml's detect-changes job
          # depends on, instead of re-deriving a second, potentially-drifting
          # copy of "does this touch Rust?": dns_rust is scoped to
          # services/dns/nats-subscriber/ (the only Rust crate under
          # services/dns -- the rest of that directory is PowerDNS
          # config/entrypoint/lua, not analyzed by the rust matrix entry at
          # all); ui is services/ui/ (a Rust crate at its root); watchdog is
          # services/watchdog/ (added 2026-08 alongside
          # services/watchdog/Cargo.toml, #1355 -- also a whole-directory
          # filter like ui, not split into a Rust-only sub-filter like dns,
          # since the shell runtime and the Rust crate share one directory);
          # workflow covers build-push.yml/build-tools.yml/.github/actions/*,
          # which includes the two composite actions this workflow's rust
          # matrix entry consumes (cargo-with-sccache-fallback,
          # configure-rust-sccache).
          rust_via_shared_classifier=false
          if [ "$force_all" = "true" ]; then
            rust_via_shared_classifier=true
          else
            classifier_output="$(CHANGED_FILES="$changed_files" bash scripts/untracked/classify-image-impact.sh)"
            # here-string, not `printf ... | grep -q` (AG-VAL-032): grep -q
            # can exit on its first match while printf is still writing the
            # classifier's remaining `key=value` lines, and under pipefail
            # that can surface as printf's own SIGPIPE (141) instead of
            # grep's successful match, silently skipping the Rust CodeQL
            # matrix entry even when a Rust-relevant service changed.
            if grep -qE '^(dns_rust|ui|watchdog|workflow)=true$' <<<"$classifier_output"; then
              rust_via_shared_classifier=true
            fi
          fi

          # Additive to the shared classifier: a change to this workflow file
          # itself or its CodeQL config, since either can change how the rust
          # matrix entry is built/analyzed even when no Rust source moved
          # (e.g. a new crate added to the "Build ... Rust crate for CodeQL"
          # steps, or a query-suite change in codeql-config.yml).
          codeql_self=false
          if [ "$force_all" = "true" ]; then
            codeql_self=true
          elif grep -qE '^\.github/(workflows/codeql\.yml|codeql/)' "$changed_files"; then
            codeql_self=true
          fi

          rm -f "$changed_files"

          if [ "$rust_via_shared_classifier" = "true" ] || [ "$codeql_self" = "true" ]; then
            echo "rust_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    # Run advanced CodeQL on repository-owned runners to avoid GitHub-hosted minutes.
    # CodeQL can compile Rust and is memory-heavy enough to avoid the light runner tier.
    # Repository default setup must be disabled in GitHub Security settings before SARIF upload.
    runs-on: [self-hosted, linux, lancache, codeql, lancache-heavy]
    timeout-minutes: 120
    needs: detect-changes
    # Do not add a shared GitHub concurrency group here. GitHub retains only
    # one pending member per group and does not guarantee admission order, so
    # an older detect-changes completion could evict the latest pending SHA.
    # Independent jobs plus the live head checks below guarantee that the
    # current PR head still reaches analysis; stale jobs self-skip instead.
    #
    # Accepted residual risk: a PR pushed to repeatedly at intervals shorter
    # than the ~2h analyze runtime but longer than detect-changes' own
    # ~10-17s (so each push's own run genuinely is current when it starts)
    # can have more than one of its own analyze runs occupy lancache-heavy
    # simultaneously -- the live head checks only run once, near the start
    # of each run, not continuously, so a run already past that check keeps
    # running to completion even after a later push makes it stale. A
    # source-level cap (counting this PR's other in-progress runs via the
    # GitHub API) was considered and rejected for now: that API call needs
    # curl, which per AG-VAL-016 must run inside the build-tools container,
    # and detect-changes currently has no container step at all -- adding
    # one would cost real seconds on every PR push for a scenario that is
    # rare in practice. This is an accepted-for-now tradeoff, not a closed
    # decision: revisit if it stops being rare, or once this workflow's CI
    # scheduling gets reworked more broadly (at which point building this
    # cap alongside that rework is cheaper than bolting it on separately).
    # `always()` is required here: GitHub implicitly ANDs any custom job
    # `if:` with `success()` of every `needs` job UNLESS the expression
    # itself calls one of the status-check functions -- without it, a
    # `skipped` detect-changes (schedule/workflow_dispatch, which its own
    # `if:` above doesn't cover) would silently skip THIS job too, including
    # the 'actions' matrix entry, which must run on every trigger regardless.
    # Mirrors the identical `always() && (...)` shape build-push.yml's
    # dns_test/ui_test/rust_coverage jobs already use for the same reason.
    #   - matrix.language == 'actions': always runs. This scans the workflow
    #     files themselves and must not be skipped by Rust-path scoping.
    #   - schedule/workflow_dispatch: detect-changes reports `skipped` here,
    #     caught by the `result != 'success'` fail-safe, same as an
    #     undeterminable push diff -- both the daily cron and a manual
    #     dispatch run the full Rust analysis unconditionally.
    #   - pull_request/push with a determinable diff: gated on
    #     detect-changes' rust_relevant output.
    # `always()` runs this job on every trigger (incl. schedule/dispatch, where
    # detect-changes is skipped). The Rust-relevance gating below is applied at
    # STEP level, NOT here: GitHub Actions does not expose the `matrix` context
    # in a job-level `if:` (matrix only exists after expansion, in steps), so a
    # job-level condition cannot tell the 'actions' matrix leg from 'rust'. The
    # 'actions' leg therefore always runs its analysis; the 'rust' leg spins up
    # but skips its (expensive) extraction steps unless Rust is actually
    # relevant (see the shared `if:` on the Rust setup/build/init/analyze steps).
    #
    # The `superseded` check keeps a PR run that is already stale from
    # consuming an analysis runner: `needs.detect-changes.outputs.superseded` is only ever
    # the literal string "true" when detect-changes
    # actually ran and found a newer PR head already landed; a skipped
    # detect-changes (schedule/dispatch) leaves this output empty, which
    # correctly does not match 'true' and never blocks those triggers.
    if: ${{ always() && needs.detect-changes.outputs.superseded != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # CodeQL Rust extraction can silently degrade while the job still reports success.
          # Observed historical example (PR #357, run 28596839186): the Rust extractor reported
          # "12 files extracted with errors" vs "2 without error" (partial `macro expansion failed`
          # for ordinary macros like format!, vec!, json!, tracing::*, assert!) yet the job
          # concluded `success`. This is a known upstream limitation of CodeQL's Rust extractor,
          # not a defect in this repository, and it is not tunable here: Rust supports only
          # `build-mode: none` (manual/autobuild modes do not exist for Rust). Tracked upstream in
          # github/codeql #19966, #19982, #20643, #20659, and locally in issue #394.
          #
          # CodeQL's own authoritative quality gate is the `rust/diagnostic/database-quality`
          # ("Low Rust analysis quality") diagnostic query. On the observed degraded run it did NOT
          # fire (the extractor's macro-expansion errors are classified as normal), so CodeQL does
          # not treat this state as low quality. The raw per-file counts are metric-query output
          # printed only to the analysis log summary; they are not exposed as a supported,
          # machine-readable workflow output (github/codeql-action #1742, open since 2023) and the
          # database is cleaned after `analyze`. The "Report CodeQL Rust extraction-quality signal"
          # step below therefore surfaces CodeQL's own determination and a standing caveat instead
          # of a hand-rolled count threshold. A green CodeQL Rust job must NOT be read as full
          # security-scan coverage of the Rust codebase.
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A run can become stale after detect-changes but before a runner admits
      # this job. Recheck on the runner so stale work stops before CodeQL or a
      # Rust build, without putting the latest SHA in a lossy concurrency queue.
      - name: Recheck PR head after runner admission
        id: admission
        if: github.event_name == 'pull_request'
        env:
          CHECK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          : "${CHECK_PR_HEAD_SHA:?pull_request event must carry a head SHA}"
          : "${CHECK_PR_NUMBER:?pull_request event must carry a PR number}"
          current_head=""
          if ! current_head="$(bash scripts/tracked/resolve-remote-ref-with-retry.sh \
            origin "refs/pull/${CHECK_PR_NUMBER}/head")"; then
            echo "::warning::Could not resolve the current remote head after retry; failing open."
          fi

          superseded=false
          if [ -n "$current_head" ] && [ "$current_head" != "$CHECK_PR_HEAD_SHA" ]; then
            superseded=true
            echo "::notice::Skipping CodeQL because this queued run targets ${CHECK_PR_HEAD_SHA}, while the PR head is ${current_head}."
          fi
          echo "superseded=$superseded" >> "$GITHUB_OUTPUT"

      - name: Isolate Rust toolchain paths
        if: steps.admission.outputs.superseded != 'true' && matrix.language == 'rust' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        run: |
          {
            echo 'CARGO_HOME=${{ runner.temp }}/cargo-home/codeql-${{ matrix.language }}'
            echo 'RUSTUP_HOME=${{ runner.temp }}/rustup-home/codeql-${{ matrix.language }}'
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: steps.admission.outputs.superseded != 'true' && matrix.language == 'rust' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Optional acceleration only: CodeQL must still run if Redis-backed sccache is unavailable.
      - name: Configure Redis-backed sccache
        if: >-
          ${{ steps.admission.outputs.superseded != 'true' &&
            matrix.language == 'rust' &&
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: ./.github/actions/configure-rust-sccache
        with:
          mode: ${{ vars.SCCACHE_REDIS_MODE }}
          redis-url: ${{ secrets.SCCACHE_REDIS_URL }}
          key-prefix: lancache-codeql-${{ matrix.language }}
          dist-scheduler-url: ${{ vars.SCCACHE_DIST_SCHEDULER_URL }}
          dist-auth-token: ${{ secrets.SCCACHE_DIST_AUTH_TOKEN }}
      - name: Initialize CodeQL
        # What: caps CodeQL at 2500 MB RAM / 3 threads; also applies to "Perform CodeQL Analysis" below.
        # Why: unset, CodeQL defaults to most of the host's memory; the
        #   smallest lancache-heavy host has ~3.6 GiB, no swap, and its Java
        #   extractor was confirmed OOM-killed under that default (dmesg).
        # From: Issue #1095
        #
        # 'actions' always analyzes; 'rust' only when Rust is actually relevant
        # (or on schedule/dispatch where detect-changes is skipped).
        if: steps.admission.outputs.superseded != 'true' && (matrix.language != 'rust' || needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          ram: "2500"
          threads: "3"

      - name: Build DNS Rust crate for CodeQL
        if: steps.admission.outputs.superseded != 'true' && matrix.language == 'rust' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo build --locked --manifest-path services/dns/nats-subscriber/Cargo.toml

      - name: Build UI Rust crate for CodeQL
        if: steps.admission.outputs.superseded != 'true' && matrix.language == 'rust' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo build --locked --manifest-path services/ui/Cargo.toml

      - name: Build watchdog Rust crate for CodeQL
        if: steps.admission.outputs.superseded != 'true' && matrix.language == 'rust' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        uses: ./.github/actions/cargo-with-sccache-fallback
        with:
          command: cargo build --locked --manifest-path services/watchdog/Cargo.toml

      - name: Perform CodeQL Analysis
        # Same gate as Initialize CodeQL above: skip the 'rust' analysis when
        # Rust is not relevant, so init and analyze stay paired.
        if: steps.admission.outputs.superseded != 'true' && (matrix.language != 'rust' || needs.detect-changes.result != 'success' || needs.detect-changes.outputs.rust_relevant == 'true')
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
          # Persist the interpreted SARIF locally so the extraction-quality step can read
          # CodeQL's own diagnostic notifications. Results are still uploaded as usual.
          output: ${{ runner.temp }}/codeql-sarif

      # Make CodeQL's Rust extraction-quality determination visible on every run so a green
      # CodeQL Rust job is not silently misread as full extraction coverage (issue #394).
      # This keys on CodeQL's own `rust/diagnostic/database-quality` signal rather than a
      # hand-rolled count threshold, so it never turns red on the known, upstream, permanent
      # macro-expansion limitation. It is warn-only and can never fail the job or manufacture
      # false confidence: it always prints the standing caveat, and warns (not fails) only when
      # CodeQL itself flags low quality or when the signal cannot be read.
      - name: Report CodeQL Rust extraction-quality signal
        if: always() && steps.admission.outputs.superseded != 'true' && matrix.language == 'rust'
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: |
          set -uo pipefail
          {
            printf '%s\n' '### CodeQL Rust extraction-quality signal'
            printf '\n'
            printf '%s\n' 'A green CodeQL Rust job does NOT by itself confirm full extraction coverage.'
            printf '%s\n' "CodeQL's Rust extractor (build-mode: none is the only supported Rust mode)"
            printf '%s\n' 'reports partial "macro expansion failed" errors for ordinary macros as a known'
            printf '%s\n' 'upstream limitation (github/codeql #19966, #19982, #20643, #20659; local #394).'
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"

          sarif_file="$(find "$SARIF_DIR" -maxdepth 1 -name '*.sarif' -print -quit 2>/dev/null || true)"
          if [ -z "$sarif_file" ] || ! command -v jq >/dev/null 2>&1; then
            echo "::warning::Could not read the CodeQL Rust extraction-quality signal (SARIF or jq unavailable). Do not treat a green CodeQL Rust job as full Rust security-scan coverage (issue #394)."
            echo '- Extraction-quality signal unavailable this run (SARIF or jq missing).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `rust/diagnostic/database-quality` ("Low Rust analysis quality") appears as a SARIF
          # notification only when CodeQL itself judges extraction degraded beyond the tolerated
          # macro-expansion errors. Count matches across both possible notification id fields.
          quality_hits="$(jq '[.runs[]?.invocations[]?.toolExecutionNotifications[]?
            | select((.descriptor.id? // .associatedRule.id? // "") == "rust/diagnostic/database-quality")]
            | length' "$sarif_file" 2>/dev/null || echo 0)"
          quality_hits="${quality_hits:-0}"

          if [ "$quality_hits" -gt 0 ]; then
            echo "::warning::CodeQL flagged Low Rust analysis quality (rust/diagnostic/database-quality). Rust extraction is degraded beyond the known macro-expansion limitation this run; investigate (issue #394)."
            echo "- CodeQL flagged Low Rust analysis quality this run (${quality_hits} notification(s)). See issue #394." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- CodeQL did not flag Low Rust analysis quality this run. That gate tolerates partial macro-expansion extraction, so it is not proof of full semantic coverage (issue #394).' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
