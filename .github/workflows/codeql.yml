
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: CodeQL security analysis; scope owned by SOT
# Why: own workflow (§73); ci.sh admits, YAML only calls.
# From: Issue #1683
name: CI 2.0 CodeQL
on:
  pull_request:
  push:
    branches: [current_dev, master]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-2.0-codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
# What: GHCR credentials for ci.sh; no login action.
# Why: auth is ci.sh policy; the workflow only sets env.
# From: Issue #1683
env:
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # What: Diff refs for ci.sh steps, set once
  # Why: Step without them has no base reference
  # From: Issue #1683 | PR #1858
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BEFORE_SHA: ${{ github.event.before }}
  # What: LAN proxy inputs; ci.sh applies them self-hosted.
  # Why: AG-CI-009; ci.sh is the one proxy policy owner.
  # From: Issue #1683 | PR #1858
  PROJECT_SELFHOSTED_PROXY_HTTP: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
  PROJECT_SELFHOSTED_PROXY_HTTPS: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
  PROJECT_SELFHOSTED_PROXY_EXCLUSION: ${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
  PROJECT_SELFHOSTED_PROXY_CA: ${{ secrets.PROJECT_SELFHOSTED_PROXY_CA }}
jobs:
  # What: Emit CodeQL language matrix from ci.sh
  # Why: Book runners only for real analysis (§70)
  # From: Issue #1683
  impact:
    name: codeql-impact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What: Admission runs in build-tools nightly channel
    # Why: Nothing runs on runner; ci.sh needs its tools
    # From: Issue #1683 | PR #1858
    container:
      image: ghcr.io/${{ github.repository }}/build-tools:nightly
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      matrix: ${{ steps.impact.outputs.codeql-matrix }}
      image: ${{ steps.impact.outputs.codeql-image }}
    steps:
      # What: Native fail-closed checkout with diff history
      # Why: No SHA pin outside SOT; ci.sh reads the diff
      # From: Issue #1683
      - &bootstrap
        name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GHCR_TOKEN}" | base64 -w0)"
          git fetch -q --no-tags origin "${GITHUB_REF}" ${BASE_SHA:+"${BASE_SHA}"}
          git checkout -q FETCH_HEAD
      - name: Collect changed files
        id: changed
        run: echo "file=$(bash .github/scripts/ci.sh changed-files)" >> "$GITHUB_OUTPUT"
      - name: Admit CodeQL analysis
        id: impact
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh codeql-impact >> "$GITHUB_OUTPUT"

  # What: Analyze each admitted language in SOT image
  # Why: CodeQL needs glibc; pin lives in SOT only
  # From: Issue #1683 | PR #1858
  analyze:
    name: CodeQL ${{ matrix.language }}
    needs: impact
    if: ${{ fromJSON(needs.impact.outputs.matrix).include[0] != null }}
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.impact.outputs.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.matrix) }}
    steps:
      - *bootstrap
      - name: Analyze and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGUAGE: ${{ matrix.language }}
        run: bash .github/scripts/ci.sh codeql-analyze "${LANGUAGE}"
