
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: thin CI 2.0 orchestrator; all logic lives in ci.sh.
# Why: §5 -- YAML answers when/where, never what.
# From: Issue #1683
name: CI 2.0

on:
  workflow_dispatch:
  pull_request:
    branches: [master, current_dev]
  push:
    branches: [current_dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools:nightly

defaults:
  run:
    shell: bash

jobs:
  # What: cheap first stage answering "is any work required?".
  # Why: §70 -- no heavy runner starts before this.
  # From: Issue #1683
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      global-state: ${{ steps.plan.outputs.global-state }}
      test-required: ${{ steps.plan.outputs.test-required }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      has-builds: ${{ steps.plan.outputs.has-builds }}
    steps:
      - name: Checkout
        uses: &checkout_centraliced_versioning actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve base and head refs
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/ci.sh resolve-refs

      - name: Run the planner
        id: plan
        env:
          BASE_REF: ${{ steps.refs.outputs.base-ref }}
          HEAD_REF: ${{ steps.refs.outputs.head-ref }}
        run: bash scripts/ci/ci.sh plan-outputs

      # What: a matrix needs a non-empty JSON array or GH errors.
      # Why: an empty build_matrix must skip the job, not fail it.
      # From: Issue #1683
      - name: Decide whether any build leg exists
        id: hasbuilds
        run: |
          count="$(printf '%s' '${{ steps.plan.outputs.build-matrix }}' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "has-builds=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # What: engine test suite, runs in build-tools container.
  # Why: must validate in container; host tools untrusted.
  # From: Issue #1683
  engine-tests:
    name: engine tests
    needs: plan
    if: needs.plan.outputs.test-required == 'true' || needs.plan.outputs.has-builds == 'true'
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning

      - name: Run ci.bats inside the pinned build-tools image
        run: |
          docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "$BUILD_TOOLS_IMAGE" \
            bash scripts/ci/ci.sh test

  # What: one real build+publish+readback leg per matrix entry.
  # Why: §19-24 -- admission decides, a real build follows an ACK.
  # From: Issue #1683
  build:
    name: build ${{ matrix.service }} (${{ matrix.platform }})
    needs: [plan, engine-tests]
    if: needs.plan.outputs.has-builds == 'true' && needs.engine-tests.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.build-matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Admit, build, publish, verify one service/platform
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CI_IMAGE_REPO: ${{ github.repository }}
        run: |
          mkdir -p ci2-results
          bash scripts/ci/ci.sh build-one "${{ matrix.service }}" "${{ matrix.platform }}" ci2-results

      - name: Upload the result record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci2-result-${{ matrix.service }}-${{ strategy.job-index }}
          path: ci2-results/*.json
          if-no-files-found: warn
          retention-days: 1

  # What: merges every build's result into the acceptance ledger.
  # Why: §26.1 -- one aggregator write, not one per matrix job.
  # From: Issue #1683
  aggregate:
    name: aggregate
    needs: [plan, build]
    if: always() && needs.plan.outputs.has-builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning

      - name: Download every result record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci2-result-*
          path: ci2-results
          merge-multiple: true

      - name: Merge results into the acceptance ledger
        run: bash scripts/ci/ci.sh aggregate ci2-results

  # What: single required check, reported even on a NOOP run.
  # Why: §62 -- a required check must never silently not appear.
  # From: Issue #1683
  result:
    name: result
    needs: [plan, engine-tests, build, aggregate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning

      - name: Report the aggregate verdict
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TESTS_RESULT: ${{ needs.engine-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          GLOBAL_STATE: ${{ needs.plan.outputs.global-state }}
        run: bash scripts/ci/ci.sh report-result
