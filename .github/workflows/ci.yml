
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: CI 2.0 Base-CI: plan, build, accept, promote the product stack.
# Why: thin orchestration of ci.sh; one SOT build-manifest.yml.
# From: Issue #1683
name: CI 2.0
on:
  pull_request:
  push:
    branches: [current_dev, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
# What: GHCR credentials ci.sh reads; no login action, no pin.
# Why: auth is ci.sh policy; the workflow only supplies the env.
# From: Issue #1683
env:
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # What: emit the identity-filtered product build matrix.
  # Why: path picks candidates; ci.sh resolve decides the build.
  # From: Issue #1683
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      any-build: ${{ steps.plan.outputs.any-build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      test-services: ${{ steps.plan.outputs.test-services }}
      docs-only: ${{ steps.plan.outputs.docs-only }}
    steps:
      # What: native fail-closed checkout with full history for the diff.
      # Why: no SHA pin outside the SOT; persistent auth for ci.sh git ops.
      # From: Issue #1683
      - &bootstrap_diff
        name: Bootstrap the working tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: bearer ${GHCR_TOKEN}"
          git fetch -q --no-tags origin "${GITHUB_REF}" ${BASE_SHA:+"${BASE_SHA}"}
          git checkout -q FETCH_HEAD
      # What: ci.sh writes the changed-path list; the workflow only wires it.
      # Why: one git-walk owner; plan/lint/checks share it (AG-CODE-011).
      # From: Issue #1683
      - &collect_changed
        name: Collect changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: echo "file=$(bash .github/scripts/ci.sh changed-files)" >> "$GITHUB_OUTPUT"
      - name: Plan the product build matrix
        id: plan
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh plan-matrix

  # What: build+publish+verify one product service per platform.
  # Why: ci.sh owns build identity, publish and readback.
  # From: Issue #1683
  build:
    name: build ${{ matrix.service }} ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.any-build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # What: native fail-closed checkout, shallow; persistent ci.sh auth.
      # Why: no SHA pin outside the SOT; git is a runner tool (AG-CI-006).
      # From: Issue #1683
      - &bootstrap
        name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: bearer ${GHCR_TOKEN}"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      # What: publish the immutable per-identity ref, then read it back.
      # Why: BUILD != PUBLISH; readback confirms the exact digest (§22/§23).
      # From: Issue #1683
      - name: Build, publish and verify the platform image
        run: |
          set -euo pipefail
          bash .github/scripts/ci.sh build "${{ matrix.service }}" "${{ matrix.platform }}"
          out="$(bash .github/scripts/ci.sh publish "${{ matrix.service }}" "${{ matrix.platform }}")"
          printf '%s\n' "${out}"
          digest="$(printf '%s' "${out}" | sed -n 's/.*published=\([^ ]*\).*/\1/p')"
          [ -n "${digest}" ] || { echo "no digest from publish" >&2; exit 1; }
          bash .github/scripts/ci.sh verify "${{ matrix.service }}" "${digest}" "${{ matrix.platform }}"

  # What: run rust fmt/check/clippy/test for changed rust services.
  # Why: ci.sh owns cargo; tests run on source change, reuse or not (§60).
  # From: Issue #1683
  test:
    name: test
    needs: plan
    if: needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *bootstrap
      - name: Test the changed rust services
        env:
          TEST_SERVICES: ${{ needs.plan.outputs.test-services }}
        run: bash .github/scripts/ci.sh test-stack

  # What: pin the published build-tools image by digest for container jobs.
  # Why: toolchain jobs run in the SOT-verified image, digest-immutable.
  # From: Issue #1683
  resolve-build-tools:
    name: resolve build-tools
    needs: plan
    if: needs.plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - *bootstrap
      - name: Resolve the build-tools image
        id: resolve
        run: |
          set -euo pipefail
          image="$(bash .github/scripts/ci.sh build-tools resolve-image)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # What: audit rust dependencies inside the pinned build-tools image.
  # Why: cargo-audit lives in the toolchain image, not on the runner.
  # From: Issue #1683
  cargo-audit:
    name: cargo-audit
    needs: [plan, resolve-build-tools]
    if: needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    container: &bt_container
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - *bootstrap
      - name: Audit rust dependencies
        run: bash .github/scripts/ci.sh check cargo-audit

  # What: shellcheck + actionlint in the pinned build-tools image.
  # Why: SOT-pinned linter versions, not runner drift (AG-VAL-016).
  # From: Issue #1683
  lint:
    name: lint
    needs: [plan, resolve-build-tools]
    if: needs.plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    container: *bt_container
    steps:
      - *bootstrap_diff
      - *collect_changed
      - name: shellcheck changed shell scripts
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh check shellcheck
      - name: actionlint workflows
        run: bash .github/scripts/ci.sh check actionlint

  # What: rust coverage (tarpaulin) in the pinned build-tools image.
  # Why: floor enforced by ci.sh; the SOT owns crate + floor.
  # From: Issue #1683
  coverage:
    name: coverage
    needs: [plan, resolve-build-tools]
    if: needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: *bt_container
    steps:
      - *bootstrap
      - name: Cover the changed rust services
        env:
          TEST_SERVICES: ${{ needs.plan.outputs.test-services }}
        run: bash .github/scripts/ci.sh coverage-stack

  # What: trivy-scan every built image by digest before ACCEPT (§7).
  # Why: SCAN gates ACCEPT; the scanner lives in the build-tools image.
  # From: Issue #1683
  scan:
    name: scan
    needs: [plan, build, resolve-build-tools]
    if: needs.plan.outputs.any-build == 'true'
    runs-on: ubuntu-latest
    container: *bt_container
    steps:
      - *bootstrap
      - name: Scan the built images by digest
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/ci.sh scan-stack

  # What: one acceptance result.json per built pair; one ledger write (§26.1).
  # Why: single aggregator, exactly one CAS commit; push only, never a PR.
  # From: Issue #1683
  aggregate:
    name: aggregate
    needs: [plan, build, scan]
    if: needs.plan.outputs.any-build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - *bootstrap
      - name: Aggregate acceptance into the ledger
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/ci.sh aggregate-stack

  # What: merge each service's platform digests into a multi-arch index.
  # Why: ci.sh owns the accepted-digest merge; §45 both-or-none.
  # From: Issue #1683
  assemble:
    name: assemble
    needs: [plan, aggregate]
    if: needs.plan.outputs.any-build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - *bootstrap
      - name: Assemble multi-arch indexes
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/ci.sh assemble-stack

  # What: full-setup stack validation on the exact accepted candidate (§49).
  # Why: STACK ACCEPTED only after health + integration + client sim.
  # From: Issue #1683
  validate:
    name: validate
    needs: [plan, aggregate, assemble]
    if: needs.plan.outputs.any-build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - *bootstrap
      - name: Validate the accepted stack candidate
        run: bash .github/scripts/ci.sh validate

  # What: move the channels the ref maps to onto the validated stack (§55).
  # Why: one ref-driven promote owner; promotion only moves refs (§51).
  # From: Issue #1683
  promote:
    name: promote
    needs: [plan, validate]
    if: needs.plan.outputs.any-build == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CI_STACK_VALIDATED: SUCCESS
    steps:
      - *bootstrap
      - name: Promote the channels the ref maps to
        run: bash .github/scripts/ci.sh promote-ref
      - name: Cut the next patch tag on an image-affecting master push
        if: github.ref == 'refs/heads/master'
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: bash .github/scripts/ci.sh cut-release-tag

  # What: run the diff-scoped + repo-wide guard set (§98).
  # Why: static guards, own failure domain, no build needed.
  # From: Issue #1683
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BODY: ${{ github.event.pull_request.body }}
      REPO: ${{ github.repository }}
    steps:
      - *bootstrap_diff
      - *collect_changed
      - name: Run the PR/push check set
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh check all

  # What: the always-present required check for branch protection.
  # Why: a required check MUST always appear, even on a NOOP (§62).
  # From: Issue #1683
  result:
    name: result
    needs: [plan, build, test, resolve-build-tools, cargo-audit, lint, coverage, scan, aggregate, assemble, validate, promote, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the pipeline result
        run: |
          set -euo pipefail
          plan='${{ needs.plan.result }}'
          build='${{ needs.build.result }}'
          test='${{ needs.test.result }}'
          resolve_bt='${{ needs.resolve-build-tools.result }}'
          cargo_audit='${{ needs.cargo-audit.result }}'
          lint='${{ needs.lint.result }}'
          coverage='${{ needs.coverage.result }}'
          scan='${{ needs.scan.result }}'
          aggregate='${{ needs.aggregate.result }}'
          assemble='${{ needs.assemble.result }}'
          validate='${{ needs.validate.result }}'
          promote='${{ needs.promote.result }}'
          checks='${{ needs.checks.result }}'
          # every non-plan/checks phase skips on a NOOP or a PR -- skipped is success.
          if [ "${plan}" != success ]; then
            echo "[CI-ERROR-CORE-0100] phase=plan result=${plan}" >&2; exit 1
          fi
          for phase in build:"${build}" test:"${test}" resolve-build-tools:"${resolve_bt}" cargo-audit:"${cargo_audit}" lint:"${lint}" coverage:"${coverage}" scan:"${scan}" aggregate:"${aggregate}" assemble:"${assemble}" validate:"${validate}" promote:"${promote}"; do
            case "${phase#*:}" in
              success|skipped) ;;
              *) echo "[CI-ERROR-CORE-0100] phase=${phase%%:*} result=${phase#*:}" >&2; exit 1 ;;
            esac
          done
          # checks always runs (static guards); it must pass.
          if [ "${checks}" != success ]; then
            echo "[CI-ERROR-CORE-0100] phase=checks result=${checks}" >&2; exit 1
          fi
          echo "CI 2.0 result: plan=${plan} build=${build} aggregate=${aggregate} assemble=${assemble} validate=${validate} promote=${promote} checks=${checks} -> SUCCESS"
