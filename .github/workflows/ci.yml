
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: CI 2.0 Base-CI: plan, build, accept, promote the product stack.
# Why: thin orchestration of ci.sh; one SOT build-manifest.yml.
# From: Issue #1683
name: CI 2.0
on:
  # What: also rerun on PR metadata and draft-state edits.
  # Why: AG-GH-008 must re-check label/milestone changes.
  # From: Issue #1683 | PR #1858
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled, milestoned, demilestoned]
  push:
    branches: [current_dev, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
# What: GHCR credentials ci.sh reads; no login action, no pin.
# Why: auth is ci.sh policy; the workflow only supplies the env.
# From: Issue #1683
env:
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # What: diff refs for every ci.sh step, set once.
  # Why: a step without them saw no base (impact UNKNOWN).
  # From: Issue #1683 | PR #1858
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BEFORE_SHA: ${{ github.event.before }}
  # What: LAN proxy inputs; ci.sh applies them self-hosted only.
  # Why: AG-CI-009; ci.sh is the one proxy policy owner.
  # From: Issue #1683 | PR #1858
  PROJECT_SELFHOSTED_PROXY_HTTP: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
  PROJECT_SELFHOSTED_PROXY_HTTPS: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
  PROJECT_SELFHOSTED_PROXY_EXCLUSION: ${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
  PROJECT_SELFHOSTED_PROXY_CA: ${{ secrets.PROJECT_SELFHOSTED_PROXY_CA }}
jobs:
  # What: resolve the published build-tools channel to a digest.
  # Why: every later job runs in build-tools, never on the runner.
  # From: Issue #1683 | PR #1858
  platform:
    name: platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    # What: one mutable entry, the current_dev channel (nightly).
    # Why: ci.sh (SOT) cannot run before any container exists.
    # From: Issue #1683 | PR #1858
    container:
      image: ghcr.io/${{ github.repository }}/build-tools:nightly
      credentials: &ghcr_credentials
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # What: native fail-closed checkout, shallow; persistent ci.sh auth.
      # Why: no SHA pin outside the SOT; git comes from build-tools.
      # From: Issue #1683
      - &bootstrap
        name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GHCR_TOKEN}" | base64 -w0)"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - &resolve_build_tools
        name: Resolve the build-tools image
        id: resolve
        run: echo "image=$(bash .github/scripts/ci.sh build-tools resolve-image)" >> "$GITHUB_OUTPUT"

  # What: emit the identity-filtered build matrices.
  # Why: path picks candidates; ci.sh resolve decides the build.
  # From: Issue #1683
  plan:
    name: plan
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: &bt_platform
      image: ${{ needs.platform.outputs.image }}
      credentials: *ghcr_credentials
    outputs:
      any-build: ${{ steps.plan.outputs.any-build }}
      any-toolchain: ${{ steps.plan.outputs.any-toolchain }}
      any-product: ${{ steps.plan.outputs.any-product }}
      matrix: ${{ steps.plan.outputs.matrix }}
      toolchain-matrix: ${{ steps.plan.outputs.toolchain-matrix }}
      product-matrix: ${{ steps.plan.outputs.product-matrix }}
      toolchain-impact: ${{ steps.plan.outputs.toolchain-impact }}
      test-services: ${{ steps.plan.outputs.test-services }}
      docs-only: ${{ steps.plan.outputs.docs-only }}
    steps:
      # What: native fail-closed checkout with full history for the diff.
      # Why: no SHA pin outside the SOT; persistent auth for ci.sh git ops.
      # From: Issue #1683
      - &bootstrap_diff
        name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GHCR_TOKEN}" | base64 -w0)"
          git fetch -q --no-tags origin "${GITHUB_REF}" ${BASE_SHA:+"${BASE_SHA}"}
          git checkout -q FETCH_HEAD
      # What: ci.sh writes the changed-path list; the workflow only wires it.
      # Why: one git-walk owner; plan/lint/checks share it (AG-CODE-011).
      # From: Issue #1683
      - &collect_changed
        name: Collect changed files
        id: changed
        run: echo "file=$(bash .github/scripts/ci.sh changed-files)" >> "$GITHUB_OUTPUT"
      - name: Plan the build matrices
        id: plan
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh plan-matrix

  # What: build the build-tools candidate on a proven change only.
  # Why: AG-CI-010; consumers of this run need it first.
  # From: Issue #1683 | PR #1858
  build-toolchain:
    name: build ${{ matrix.service }} ${{ matrix.arch }}
    needs: [platform, plan]
    if: needs.plan.outputs.any-toolchain == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.toolchain-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: *bt_platform
    steps:
      # What: checkout with the base; build proves impact vs base.
      # Why: semantic impact needs the base ref (arch §11).
      # From: Issue #1683 | PR #1858
      - *bootstrap_diff
      # What: publish the immutable per-identity ref, then read it back.
      # Why: BUILD != PUBLISH; readback confirms the exact digest (§22/§23).
      # From: Issue #1683
      - &build_publish_verify
        name: Build, publish and verify the platform image
        run: |
          set -euo pipefail
          bash .github/scripts/ci.sh build "${{ matrix.service }}" "${{ matrix.platform }}"
          out="$(bash .github/scripts/ci.sh publish "${{ matrix.service }}" "${{ matrix.platform }}")"
          printf '%s\n' "${out}"
          digest="$(printf '%s' "${out}" | sed -n 's/.*published=\([^ ]*\).*/\1/p')"
          [ -n "${digest}" ] || { echo "no digest from publish" >&2; exit 1; }
          bash .github/scripts/ci.sh verify "${{ matrix.service }}" "${digest}" "${{ matrix.platform }}"

  # What: the toolchain image the verification jobs run in.
  # Why: channel digest, or this identity's candidate on change.
  # From: Issue #1683 | PR #1858
  resolve-build-tools:
    name: resolve build-tools
    needs: [platform, plan, build-toolchain]
    if: >-
      !cancelled() && needs.plan.outputs.docs-only != 'true' &&
      needs.plan.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.build-toolchain.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: *bt_platform
    env: &toolchain_impact
      CI_TOOLCHAIN_IMPACT: ${{ needs.plan.outputs.toolchain-impact }}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - *bootstrap
      - *resolve_build_tools

  # What: build+publish+verify one product service per platform.
  # Why: ci.sh owns build identity, publish and readback.
  # From: Issue #1683
  build:
    name: build ${{ matrix.service }} ${{ matrix.arch }}
    needs: [platform, plan, build-toolchain]
    if: >-
      !cancelled() && needs.plan.outputs.any-product == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.build-toolchain.result)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.product-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: *bt_platform
    env: *toolchain_impact
    steps:
      - *bootstrap_diff
      - *build_publish_verify

  # What: audit rust dependencies inside the pinned build-tools image.
  # Why: cargo-audit lives in the toolchain image, not on the runner.
  # From: Issue #1683
  cargo-audit:
    name: cargo-audit
    needs: [plan, resolve-build-tools]
    if: &after_resolve_tests >-
      !cancelled() && needs.resolve-build-tools.result == 'success' &&
      needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: &bt_container
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      - name: Audit rust dependencies
        run: bash .github/scripts/ci.sh check cargo-audit

  # What: run rust fmt/check/clippy/test for changed rust services.
  # Why: cargo lives in build-tools, never on the runner.
  # From: Issue #1683 | PR #1858
  test:
    name: test
    needs: [plan, resolve-build-tools]
    if: *after_resolve_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: *bt_container
    steps:
      - *bootstrap
      - name: Test the changed rust services
        env:
          TEST_SERVICES: ${{ needs.plan.outputs.test-services }}
        run: bash .github/scripts/ci.sh test-stack

  # What: shellcheck + actionlint in the pinned build-tools image.
  # Why: SOT-pinned linter versions, not runner drift (AG-VAL-016).
  # From: Issue #1683
  lint:
    name: lint
    needs: [plan, resolve-build-tools]
    if: >-
      !cancelled() && needs.resolve-build-tools.result == 'success' &&
      needs.plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *bt_container
    steps:
      - *bootstrap_diff
      - *collect_changed
      - name: shellcheck changed shell scripts
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh check shellcheck
      - name: actionlint workflows
        run: bash .github/scripts/ci.sh check actionlint

  # What: trivy-scan every built image by digest before ACCEPT (§7).
  # Why: SCAN gates ACCEPT; the scanner lives in the build-tools image.
  # From: Issue #1683
  scan:
    name: scan
    needs: [plan, build-toolchain, build, resolve-build-tools]
    if: >-
      !cancelled() && needs.plan.outputs.any-build == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.build-toolchain.result) &&
      contains(fromJSON('["success","skipped"]'), needs.build.result) &&
      needs.resolve-build-tools.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      - name: Scan the built images by digest
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/ci.sh scan-stack

  # What: one acceptance result.json per built pair; one ledger write (§26.1).
  # Why: single aggregator, exactly one CAS commit; push only, never a PR.
  # From: Issue #1683
  aggregate:
    name: aggregate
    needs: [platform, plan, scan]
    if: >-
      !cancelled() && needs.scan.result == 'success' &&
      needs.plan.outputs.any-build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *bt_platform
    permissions:
      contents: write
      packages: read
    steps:
      - *bootstrap
      - name: Aggregate acceptance into the ledger
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/ci.sh aggregate-stack

  # What: merge each service's platform digests into a multi-arch index.
  # Why: ci.sh owns the accepted-digest merge; §45 both-or-none.
  # From: Issue #1683
  assemble:
    name: assemble
    needs: [platform, plan, aggregate]
    if: >-
      !cancelled() && needs.aggregate.result == 'success' &&
      needs.plan.outputs.any-build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *bt_platform
    steps:
      - *bootstrap
      - name: Assemble multi-arch indexes
        env:
          CI_BUILD_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: bash .github/scripts/ci.sh assemble-stack

  # What: full-setup stack validation on the exact candidate (§49).
  # Why: STACK health+integration; push=accepted, PR=built images.
  # From: Issue #1683
  validate:
    name: validate
    needs: [platform, plan, build, aggregate, assemble]
    if: >-
      !cancelled() && needs.plan.outputs.any-build == 'true' &&
      contains(fromJSON('["success","skipped"]'), needs.build.result) &&
      (github.event_name == 'pull_request' || needs.assemble.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: *bt_platform
    permissions:
      contents: read
      packages: read
    steps:
      - *bootstrap
      - name: Validate the accepted stack candidate
        run: bash .github/scripts/ci.sh validate

  # What: move the channels the ref maps to onto the validated stack (§55).
  # Why: one ref-driven promote owner; promotion only moves refs (§51).
  # From: Issue #1683
  promote:
    name: promote
    needs: [platform, plan, validate]
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      needs.plan.outputs.any-build == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *bt_platform
    permissions:
      contents: write
      packages: write
    env:
      CI_STACK_VALIDATED: SUCCESS
    steps:
      - *bootstrap
      - name: Promote the channels the ref maps to
        run: bash .github/scripts/ci.sh promote-ref
      - name: Cut the next patch tag on an image-affecting master push
        if: github.ref == 'refs/heads/master'
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: bash .github/scripts/ci.sh cut-release-tag

  # What: run the diff-scoped + repo-wide guard set (§98).
  # Why: static guards, own failure domain, no build needed.
  # From: Issue #1683
  checks:
    name: checks
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *bt_platform
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      PR_MILESTONE_TITLE: ${{ github.event.pull_request.milestone.title }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
      PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - *bootstrap_diff
      - *collect_changed
      - name: Run the PR/push check set
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh check all

  # What: the always-present required check for branch protection.
  # Why: a required check MUST always appear, even on a NOOP (§62).
  # From: Issue #1683
  result:
    name: result
    needs: [platform, plan, build-toolchain, build, test, resolve-build-tools, cargo-audit, lint, scan, aggregate, assemble, validate, promote, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.platform.outputs.image || format('ghcr.io/{0}/build-tools:nightly', github.repository) }}
      credentials: *ghcr_credentials
    steps:
      - *bootstrap
      # What: hand phase results to the ci.sh result gate.
      # Why: pass/fail classification is ci.sh policy (§5).
      # From: Issue #1683
      - name: Aggregate the pipeline result
        env:
          CI_PHASE_RESULTS: >-
            platform:${{ needs.platform.result }}
            plan:${{ needs.plan.result }}
            build-toolchain:${{ needs.build-toolchain.result }}
            build:${{ needs.build.result }}
            test:${{ needs.test.result }}
            resolve-build-tools:${{ needs.resolve-build-tools.result }}
            cargo-audit:${{ needs.cargo-audit.result }}
            lint:${{ needs.lint.result }}
            scan:${{ needs.scan.result }}
            aggregate:${{ needs.aggregate.result }}
            assemble:${{ needs.assemble.result }}
            validate:${{ needs.validate.result }}
            promote:${{ needs.promote.result }}
            checks:${{ needs.checks.result }}
        run: bash .github/scripts/ci.sh result-gate
