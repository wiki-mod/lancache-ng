
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: CI 2.0 Base-CI: plan the product build, then result.
# Why: thin orchestration of ci.sh; one SOT build-manifest.yml.
# From: Issue #1683
name: CI 2.0
on:
  pull_request:
  push:
    branches: [current_dev, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
# What: GHCR credentials ci.sh reads; no login action, no pin.
# Why: auth is ci.sh policy; the workflow only supplies the env.
# From: Issue #1683
env:
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # What: emit the identity-filtered product build matrix.
  # Why: path picks candidates; ci.sh resolve decides the build.
  # From: Issue #1683
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      any-build: ${{ steps.plan.outputs.any-build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      test-services: ${{ steps.plan.outputs.test-services }}
      docs-only: ${{ steps.plan.outputs.docs-only }}
    steps:
      # What: native fail-closed checkout; no pinned action (AG-CI-006).
      # Why: no SHA pin may live outside the SOT; git is a runner tool.
      # From: Issue #1683
      - name: Bootstrap the working tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags origin "${GITHUB_REF}" ${BASE_SHA:+"${BASE_SHA}"}
          git checkout -q FETCH_HEAD
      # What: compute the changed-path list for this event.
      # Why: ci.sh reads CHANGED_FILES and never walks git itself.
      # From: Issue #1683
      - name: Collect changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/changed-files.txt"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git diff --name-only "${BASE_SHA}...FETCH_HEAD" > "${out}"
          elif [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > "${out}"
          else
            git ls-files > "${out}"
          fi
          echo "file=${out}" >> "$GITHUB_OUTPUT"
      - name: Plan the product build matrix
        id: plan
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh plan-matrix

  # What: build+publish+verify one product service per platform.
  # Why: ci.sh owns build identity, publish and readback.
  # From: Issue #1683
  build:
    name: build ${{ matrix.service }} ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.any-build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      # What: publish the immutable per-identity ref, then read it back.
      # Why: BUILD != PUBLISH; readback confirms the exact digest (§22/§23).
      # From: Issue #1683
      - name: Build, publish and verify the platform image
        run: |
          set -euo pipefail
          bash .github/scripts/ci.sh build "${{ matrix.service }}" "${{ matrix.platform }}"
          out="$(bash .github/scripts/ci.sh publish "${{ matrix.service }}" "${{ matrix.platform }}")"
          printf '%s\n' "${out}"
          digest="$(printf '%s' "${out}" | sed -n 's/.*published=\([^ ]*\).*/\1/p')"
          [ -n "${digest}" ] || { echo "no digest from publish" >&2; exit 1; }
          bash .github/scripts/ci.sh verify "${{ matrix.service }}" "${digest}" "${{ matrix.platform }}"

  # What: run rust fmt/check/clippy/test for changed rust services.
  # Why: ci.sh owns cargo; tests run on source change, reuse or not (§60).
  # From: Issue #1683
  test:
    name: test
    needs: plan
    if: needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Test the changed rust services
        env:
          TEST_SERVICES: ${{ needs.plan.outputs.test-services }}
        run: |
          set -euo pipefail
          for service in ${TEST_SERVICES}; do
            bash .github/scripts/ci.sh test "${service}"
          done

  # What: pin the published build-tools image by digest for container jobs.
  # Why: toolchain jobs run in the SOT-verified image, digest-immutable.
  # From: Issue #1683
  resolve-build-tools:
    name: resolve build-tools
    needs: plan
    if: needs.plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Resolve the build-tools image
        id: resolve
        run: |
          set -euo pipefail
          image="$(bash .github/scripts/ci.sh build-tools resolve-image)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # What: audit rust dependencies inside the pinned build-tools image.
  # Why: cargo-audit lives in the toolchain image, not on the runner.
  # From: Issue #1683
  cargo-audit:
    name: cargo-audit
    needs: [plan, resolve-build-tools]
    if: needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Audit rust dependencies
        run: bash .github/scripts/ci.sh check cargo-audit

  # What: shellcheck + actionlint in the pinned build-tools image.
  # Why: SOT-pinned linter versions, not runner drift (AG-VAL-016).
  # From: Issue #1683
  lint:
    name: lint
    needs: [plan, resolve-build-tools]
    if: needs.plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the working tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags origin "${GITHUB_REF}" ${BASE_SHA:+"${BASE_SHA}"}
          git checkout -q FETCH_HEAD
      - name: Collect changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/changed-files.txt"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git diff --name-only "${BASE_SHA}...FETCH_HEAD" > "${out}"
          elif [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > "${out}"
          else
            git ls-files > "${out}"
          fi
          echo "file=${out}" >> "$GITHUB_OUTPUT"
      - name: shellcheck changed shell scripts
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh check shellcheck
      - name: actionlint workflows
        run: bash .github/scripts/ci.sh check actionlint

  # What: rust coverage (tarpaulin) in the pinned build-tools image.
  # Why: floor enforced by ci.sh; the SOT owns crate + floor.
  # From: Issue #1683
  coverage:
    name: coverage
    needs: [plan, resolve-build-tools]
    if: needs.plan.outputs.test-services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.resolve-build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Cover the changed rust services
        env:
          TEST_SERVICES: ${{ needs.plan.outputs.test-services }}
        run: |
          set -euo pipefail
          for service in ${TEST_SERVICES}; do
            bash .github/scripts/ci.sh coverage "${service}"
          done

  # What: merge each service's platform digests into a multi-arch index.
  # Why: ci.sh owns the accepted-digest merge; §45 both-or-none.
  # From: Issue #1683
  assemble:
    name: assemble
    needs: [plan, build]
    if: needs.plan.outputs.any-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      # What: assemble each product service the build matrix produced.
      # Why: one index per service; ci.sh enforces both-platform (§45).
      # From: Issue #1683
      - name: Assemble multi-arch indexes
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          for service in $(jq -r '[.include[].service] | unique | .[]' <<< "${MATRIX}"); do
            bash .github/scripts/ci.sh assemble "${service}"
          done

  # What: run the diff-scoped + repo-wide guard set (§98).
  # Why: static guards, own failure domain, no build needed.
  # From: Issue #1683
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_BODY: ${{ github.event.pull_request.body }}
      REPO: ${{ github.repository }}
    steps:
      - name: Bootstrap the working tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GHCR_TOKEN}" \
            fetch -q --no-tags origin "${GITHUB_REF}" ${BASE_SHA:+"${BASE_SHA}"}
          git checkout -q FETCH_HEAD
      - name: Collect changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/changed-files.txt"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            git diff --name-only "${BASE_SHA}...FETCH_HEAD" > "${out}"
          elif [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > "${out}"
          else
            git ls-files > "${out}"
          fi
          echo "file=${out}" >> "$GITHUB_OUTPUT"
      - name: Run the PR/push check set
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.file }}
        run: bash .github/scripts/ci.sh check all

  # What: the always-present required check for branch protection.
  # Why: a required check MUST always appear, even on a NOOP (§62).
  # From: Issue #1683
  result:
    name: result
    needs: [plan, build, test, resolve-build-tools, cargo-audit, lint, coverage, assemble, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the pipeline result
        run: |
          set -euo pipefail
          plan='${{ needs.plan.result }}'
          build='${{ needs.build.result }}'
          test='${{ needs.test.result }}'
          resolve_bt='${{ needs.resolve-build-tools.result }}'
          cargo_audit='${{ needs.cargo-audit.result }}'
          lint='${{ needs.lint.result }}'
          coverage='${{ needs.coverage.result }}'
          assemble='${{ needs.assemble.result }}'
          checks='${{ needs.checks.result }}'
          # build/test/audit/lint/coverage/assemble skip on a NOOP -- success.
          if [ "${plan}" != success ]; then
            echo "[CI-ERROR-CORE-0100] phase=plan result=${plan}" >&2; exit 1
          fi
          for phase in build:"${build}" test:"${test}" resolve-build-tools:"${resolve_bt}" cargo-audit:"${cargo_audit}" lint:"${lint}" coverage:"${coverage}" assemble:"${assemble}"; do
            case "${phase#*:}" in
              success|skipped) ;;
              *) echo "[CI-ERROR-CORE-0100] phase=${phase%%:*} result=${phase#*:}" >&2; exit 1 ;;
            esac
          done
          # checks always runs (static guards); it must pass.
          if [ "${checks}" != success ]; then
            echo "[CI-ERROR-CORE-0100] phase=checks result=${checks}" >&2; exit 1
          fi
          echo "CI 2.0 result: plan=${plan} build=${build} test=${test} assemble=${assemble} checks=${checks} -> SUCCESS"
