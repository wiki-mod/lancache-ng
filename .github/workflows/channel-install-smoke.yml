
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Scheduled published-channel installation smoke check (issue #785). This is
# deliberately separate from per-PR validation: a broken mutable channel is a
# channel problem, not a reason to blame an unrelated PR. The workflow runs
# setup.sh's real channel -> stack pointer -> immutable sha-* resolution, then
# brings up the full stack and checks health. Heavy client simulations remain
# in the full-setup validation workflows.
name: Channel Install Smoke

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published channel/tag to install and smoke-test (for example nightly, latest, sha-* or vX.Y.Z).
        required: false
        default: nightly

permissions:
  contents: read

jobs:
  channel-install-smoke:
    name: install-smoke (published channel)
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    env:
      LANCACHE_IMAGE_REGISTRY: ghcr.io
      LANCACHE_IMAGE_PREFIX: wiki-mod/lancache-ng
      LANCACHE_IMAGE_TAG: ${{ inputs.image_tag || 'nightly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build full-setup validation image (against published channel)
        run: |
          set -euo pipefail
          echo "Smoke-testing published channel/tag: ${LANCACHE_IMAGE_TAG}"
          docker build \
            --build-arg LANCACHE_IMAGE_REGISTRY="${LANCACHE_IMAGE_REGISTRY}" \
            --build-arg LANCACHE_IMAGE_PREFIX="${LANCACHE_IMAGE_PREFIX}" \
            --build-arg LANCACHE_IMAGE_TAG="${LANCACHE_IMAGE_TAG}" \
            -t lancache-ng-full-setup:channel-smoke \
            deploy/full-setup

      - name: Validate compose configuration
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/deploy/full-setup:/validation:ro" \
            -w /validation \
            --env LANCACHE_IMAGE_REGISTRY \
            --env LANCACHE_IMAGE_PREFIX \
            --env LANCACHE_IMAGE_TAG \
            docker:latest \
            docker compose -f docker-compose.yml config >/dev/null

      # Single source shared with the regular/deep/full pipeline validation
      # paths. The action owns subnet locking, collision retries and the
      # complete per-attempt VALIDATION_* environment derivation.
      - name: Reserve validation subnet and start stack
        uses: ./.github/actions/reserve-validation-subnet-stack
        with:
          image-tag: ${{ env.LANCACHE_IMAGE_TAG }}
          image-registry: ${{ env.LANCACHE_IMAGE_REGISTRY }}
          image-prefix: ${{ env.LANCACHE_IMAGE_PREFIX }}
          working-directory: deploy/full-setup

      - name: Wait for stack health
        uses: ./.github/actions/wait-validation-stack-health
        with:
          working-directory: deploy/full-setup

      - name: Confirm published channel installation
        run: echo "Published channel '${LANCACHE_IMAGE_TAG}' installs cleanly."

      - name: Tear down validation stack
        if: always()
        working-directory: deploy/full-setup
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true

          # shellcheck source=scripts/lib/reserve-validation-subnet.sh
          source "$GITHUB_WORKSPACE/scripts/lib/reserve-validation-subnet.sh"
          if [[ -n "${COMPOSE_PROJECT_NAME:-}" ]]; then
            validation_project_networks_teardown "$COMPOSE_PROJECT_NAME" || true
          fi
          if [[ -n "${VALIDATION_LOCK_HOLDER_PID:-}" ]]; then
            kill "$VALIDATION_LOCK_HOLDER_PID" 2>/dev/null || true
          fi

      - name: Clean up image
        if: always()
        run: docker rmi lancache-ng-full-setup:channel-smoke || true
