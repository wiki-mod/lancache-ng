# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# Temporary same-repository executor for the active CI 1.1 Draft.

name: CDX CI 1.1 immutable compose toolchain

on:
  pull_request:
    branches: [current_dev]
    types: [synchronize]

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.number == 1523 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/1.1-single-artifact-consolidation
          fetch-depth: 0

      - name: Transform and validate immutable Compose toolchain
        run: |
          set -euo pipefail

          python3 .github/cdx-1522-compose-toolchain.py
          git rm -- .github/cdx-1522-compose-toolchain.py .github/workflows/cdx-1522-compose-toolchain.yml

          if grep -nE '^[[:space:]]+docker:latest[[:space:]\\]*$' \
            .github/workflows/build-push.yml \
            .github/workflows/full-setup-sims.yml; then
            echo "::error::Mutable docker:latest Compose helper remains in a Full-Setup validation path."
            exit 1
          fi

          grep -F "needs: [detect-changes, merge-manifests, compute-validation-network, validate-compose]" \
            .github/workflows/build-push.yml >/dev/null
          grep -F "BUILD_TOOLS_IMAGE: \${{ needs['validate-compose'].outputs.build_tools_image }}" \
            .github/workflows/build-push.yml >/dev/null
          grep -F "BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/select-build-tools-image.sh" \
            .github/workflows/full-setup-sims.yml >/dev/null
          grep -F 'Expected digest-qualified build-tools image' \
            .github/workflows/full-setup-sims.yml >/dev/null

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/build-push.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/full-setup-sims.yml

          git add -A
          git diff --cached --check
          wc -l -c .github/workflows/build-push.yml .github/workflows/full-setup-sims.yml

          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/cdx-1522-compose-toolchain.py \
            .github/workflows/build-push.yml \
            .github/workflows/cdx-1522-compose-toolchain.yml \
            .github/workflows/full-setup-sims.yml | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Unexpected target file set."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$changed"
            exit 1
          fi

          marker="CDX-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$marker ci: use immutable toolchain for compose validation"

          printf 'CDX_COMMIT_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'CDX_TREE_SHA=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'CDX_BUILD_PUSH_BLOB_SHA=%s\n' "$(git rev-parse 'HEAD:.github/workflows/build-push.yml')"
          printf 'CDX_FULL_SETUP_SIMS_BLOB_SHA=%s\n' "$(git rev-parse 'HEAD:.github/workflows/full-setup-sims.yml')"

          # Upload objects; the connected GitHub App advances the workflow-editing ref.
          git push origin HEAD:refs/heads/ci/1.1-single-artifact-consolidation
