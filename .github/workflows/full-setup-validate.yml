# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
#
# Standalone, manually-triggered end-to-end check for the full-setup
# validation stack (deploy/full-setup/docker-compose.yml). Actually starts
# the stack with real published images and fails if any service is
# unhealthy or crash-looping. Deliberately separate from Build & Push: it
# has no build/push/promote/release jobs, so it can be re-run on demand
# without any risk of touching production images.

name: Full-Setup Validate

on:
  workflow_dispatch:
    inputs:
      image_tag:
        # latest is intentionally not the default: this project has not cut
        # a stable release yet, so every first-party service's :latest tag
        # is an untouched leftover from before the promote/versioning
        # contract existed (confirmed directly: ui/proxy/dns/watchdog/dhcp/
        # dhcp-proxy:latest are all 1-2 weeks stale, and stack:latest --
        # the coherent multi-service pointer -- does not exist at all). nightly
        # is the channel actually promoted daily from master.
        description: Stack image tag to validate against.
        required: false
        default: nightly

permissions:
  contents: read

env:
  # Host temp files go to disk: /tmp is a small tmpfs on some runners and
  # trivy alone writes 5 to 8 GB of image export there (run 39765669925).
  TMPDIR: /var/tmp

jobs:

  # The simulation/validation jobs this suite shares with the per-PR
  # full-setup-deep-validate.yml live in one reusable workflow (issue #1014);
  # this manual suite invokes them in dispatch mode -- a published channel
  # tag, no PR staging.
  full-setup-sims:
    uses: ./.github/workflows/full-setup-sims.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      # should_run / pr_staging_available / build_tools_touched are intentionally
      # omitted: the reusable workflow's own string defaults (true / false /
      # false) already express this dispatch-mode intent (run the suite against a
      # published channel tag, no PR staging). Passing the literal booleans here
      # is rejected by actionlint against those string-typed inputs, and the
      # defaults are byte-identical in effect.
    secrets: inherit
