
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: E2E workflow validates full-setup stack health.
# Why: Separate from Build & Push; no risk to prod images.

name: Full-Setup Validate

on:
  workflow_dispatch:
    inputs:
      image_tag:
        # What: Defaults to nightly, not latest.
        # Why: :latest stale; nightly promoted daily.
        # From: Issue #1056
        description: Stack image tag to validate against.
        required: false
        default: nightly

permissions:
  contents: read

jobs:

  # What: Invokes shared reusable workflow.
  # Why: Single source for all validation jobs.
  # From: Issue #1014
  full-setup-sims:
    uses: ./.github/workflows/full-setup-sims.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      # What: Omits optional reusable inputs.
      # Why: Defaults already match dispatch intent.
      # From: Issue #1014
    secrets: inherit

  dhcp-proxy-pxe-simulation:
    # What: Tests DHCP proxy PXE mode.
    # Why: Not covered by other checks; out of scope.
    # From: Issue #705
    name: DHCP proxy PXE simulation
    needs: full-setup-sims
    if: always()
    # What: Heavy runner; builds and runs containers.
    # Why: Requires dedicated self-hosted resources.
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: &checkout_centraliced_versioning actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build-tools image
        # What: Does not require published image.
        # Why: Dockerfile differs; needs fresh build.
        # From: Issue #705
        id: build-tools-image
        run: |
          set -euo pipefail
          image="$(bash scripts/untracked/select-build-tools-image.sh)"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run DHCP proxy PXE simulation
        env:
          DHCP_PXE_SIMULATION_CLIENT_IMAGE: ${{ steps.build-tools-image.outputs.image }}
          # What: Builds the pxe-client-probe.
          # Why: Matches repo's cargo build settings.
          # From: Issue #1095
          PROJECT_CARGO_LTO: ${{ vars.PROJECT_CARGO_LTO }}
          PROJECT_CARGO_CODEGENUNIT: ${{ vars.PROJECT_CARGO_CODEGENUNIT }}
        run: |
          set -euo pipefail
          bash scripts/untracked/simulations/dhcp-proxy-pxe-simulation.sh

  dhcp-relay-flow-simulation:
    # What: Tests dnsmasq-relay two-segment topology.
    # Why: Validates relay forwards across segments.
    # From: Issue #844
    name: DHCP relay flow simulation
    needs: dhcp-proxy-pxe-simulation
    if: always()
    # What: Heavy runner; builds relay/client containers.
    # Why: Requires dedicated self-hosted resources.
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1
      - name: Run DHCP relay flow simulation
        run: |
          set -euo pipefail
          # What: Runs sim in collision-free subnet.
          # Why: Avoids hardcoded subnet conflicts.
          # From: Issue #822
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/dhcp-relay-flow-simulation.sh

  dhcp-kea-ctrl-agent-mutation-simulation:
    # What: proves Kea mutation via real Admin UI call.
    # Why: avoids subnet collision on concurrent runs.
    # From: Issue #820
    name: DHCP Kea Control Agent mutation simulation
    needs: [full-setup-sims, dhcp-relay-flow-simulation]
    if: always()
    # What: Heavy runner; starts multiple containers.
    # Why: Requires dedicated self-hosted resources.
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 45
    steps:
      - uses: *checkout_centraliced_versioning # v7.0.1

      # What: Authenticates pulls from both registries.
      # Why: pulls nats/docker-socket-proxy from docker.io.
      # From: Issue #1095
      - name: Log in to registries (GHCR + optional Docker Hub)
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build-tools image
        # What: Does not require published image.
        # Why: Needs dhclient; not in published image yet.
        id: build-tools-image
        env:
          # What: requires dhclient in the smoke-test check.
          # Why: opt-in only; this job's own sim needs it.
          # From: Issue #1095
          EXTRA_REQUIRED_TOOLS: dhclient
        run: |
          set -euo pipefail
          image="$(bash scripts/untracked/select-build-tools-image.sh)"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run DHCP Kea Control Agent mutation simulation
        env:
          DHCP_CTRL_AGENT_CLIENT_IMAGE: ${{ steps.build-tools-image.outputs.image }}
          LANCACHE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          bash scripts/lib/run-in-validation-subnet.sh bash scripts/untracked/simulations/dhcp-kea-ctrl-agent-mutation-simulation.sh
