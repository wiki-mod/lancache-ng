
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: builds, scans, and publishes the multi-arch build-tools image.
# Why: fork PRs build one local candidate per architecture for the same
#   smoke/vulnerability policy; same-repo PRs are built once by build-push.yml
#   instead, so this workflow never duplicates that candidate.
# From: PR #1523
name: Build Tools Image

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"
  pull_request:
    branches: [master, current_dev, v0.2.0]
    paths:
      - "tools/build-tools/**"
      - ".github/workflows/build-tools.yml"
      - ".github/actions/build-tools-candidate-smoke/**"
      - ".github/actions/trivy-scan-exact-digest/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-publish', github.workflow) }}
  cancel-in-progress: false

env:
  BUILD_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools
  # What: local scan-image tags are suffixed by run_id-run_attempt.
  # Why: the self-hosted amd64 runner is reused across overlapping/retried
  #   runs; a fixed tag could let one run's cleanup delete or overwrite an
  #   image a concurrent run on the same host is still scanning.
  # From: PR #1523
  BUILD_TOOLS_SCAN_IMAGE_AMD64: lancache-ng-build-tools-scan:${{ github.run_id }}-${{ github.run_attempt }}-amd64
  BUILD_TOOLS_SCAN_IMAGE_ARM64: lancache-ng-build-tools-scan:${{ github.run_id }}-${{ github.run_attempt }}-arm64

defaults:
  run:
    shell: bash

jobs:
  determine-publish-scope:
    name: admit standalone build-tools route
    # What: shared admission gate for both architecture jobs below.
    # Why: same-repo PRs are built once by build-push.yml instead; expressing
    #   the fork-only exception here avoids copying it into every job.
    # From: PR #1523
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.id != github.event.repository.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.should-publish.outputs.should-publish }}
      utilities-image: ${{ steps['resolve-utilities-image'].outputs['utilities-image'] }}
    steps:
      - name: Confirm standalone route
        run: |
          set -euo pipefail
          echo "Standalone build-tools route admitted for event '$GITHUB_EVENT_NAME'."

      - name: Checkout
        uses: &checkout_centraliced_versioning actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: resolves utilities:latest, falls back to :nightly.
      # Why: this workflow's own Dockerfile build has no UTILITIES_IMAGE
      #   build-arg override, so it needs a real resolved reference.
      # From: Issue #1095 | PR #1706
      - name: Resolve utilities image digest
        id: resolve-utilities-image
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/ghcr-retry.sh
          source scripts/lib/ghcr-retry.sh

          utilities_digest="$(resolve_manifest_digest ghcr.io/wiki-mod/lancache-ng/utilities:latest "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD")" \
            || utilities_digest="$(resolve_manifest_digest ghcr.io/wiki-mod/lancache-ng/utilities:nightly "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD")" \
            || utilities_digest=""
          if [[ -z "$utilities_digest" ]]; then
            echo "::error::Could not resolve digest for ghcr.io/wiki-mod/lancache-ng/utilities:latest or :nightly." >&2
            exit 1
          fi

          printf 'utilities-image=ghcr.io/wiki-mod/lancache-ng/utilities@%s\n' "$utilities_digest" >> "$GITHUB_OUTPUT"

      # What: computes should-publish once, shared by build-tools/build-tools-arm64 (AG-CI-010).
      # Why: skips a redundant rebuild/republish when neither tools/build-tools/** nor this
      # workflow file actually changed in the push's commit range; workflow_dispatch/schedule
      # always publish, and every no-usable-diff-base case fails safe by publishing.
      # From: Issue #1253 | PR #1255
      - name: Determine whether build-tools inputs actually changed
        id: should-publish
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "$before_sha" 2>/dev/null || true
          fi

          if ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            echo "::notice::Could not fetch base commit $before_sha to diff against; publishing to be safe."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # What: captures the diff into a variable before testing it, instead
          #   of piping git diff directly into `grep -q .`.
          # Why: under this workflow's default -eo pipefail, a live producer
          #   piped into an early-exiting grep -q can surface the producer's
          #   own SIGPIPE (141) instead of grep's match.
          # From: PR #1500
          changed_build_tools_files="$(git diff --name-only "$before_sha" "${{ github.sha }}" -- tools/build-tools .github/workflows/build-tools.yml)" || changed_build_tools_files=""
          if [ -n "$changed_build_tools_files" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No tools/build-tools/** or workflow-file change found in this push's commit range; skipping build-tools image rebuild/publish."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

  build-tools:
    name: build amd64 build-tools image
    needs: determine-publish-scope
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 150
    concurrency:
      group: build-tools-amd64-image-build
      cancel-in-progress: false
    env:
      UTILITIES_IMAGE: ${{ needs['determine-publish-scope'].outputs['utilities-image'] }}
    # What: adds issues:write; other scopes below stay unchanged.
    # Why: job-level permissions: replaces, not merges, the
    #   workflow-level block -- issues:write is for the self-closing
    #   Trivy report below, not the amd64 attest step further down.
    # From: Issue #1095
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    outputs:
      candidate-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: &docker_setup_buildx_centraliced_versioning docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Prepare local Buildx cache
        id: buildx-cache
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_READ: ${{ runner.temp }}/lancache-ng-build-tools-cache/read
          BUILDX_CACHE_DEST: ${{ runner.temp }}/lancache-ng-build-tools-cache/new
        run: |
          set -euo pipefail
          command -v flock >/dev/null 2>&1 || { echo "::error::flock is required."; exit 1; }
          cache_dir="$BUILDX_CACHE_ROOT/build-tools-amd64"
          lock_file="$BUILDX_CACHE_ROOT/build-tools-amd64.lock"
          mkdir -p "$BUILDX_CACHE_ROOT"
          rm -rf "$BUILDX_CACHE_READ" "$BUILDX_CACHE_DEST"
          mkdir -p "$BUILDX_CACHE_READ" "$(dirname "$BUILDX_CACHE_DEST")"
          (
            flock -x 9
            mkdir -p "$cache_dir"
            cp -a "$cache_dir/." "$BUILDX_CACHE_READ/"
          ) 9>"$lock_file"
          {
            echo "cache-from=$BUILDX_CACHE_READ"
            echo "cache-to=$BUILDX_CACHE_DEST"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: &docker_login_centraliced_versioning docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: &docker_metadata_centraliced_versioning docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-amd64

      - name: Compute immutable pushed source tag
        id: source-tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-amd64\n' "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"; digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]] || { echo "::error::Could not read digest for $image."; exit 1; }
            printf '%s\n' "$digest"
          }
          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      # What: writes ccache_redis_url + distcc_potential_hosts secret files for
      #   the Dockerfile's curl/git build to mount as BuildKit secrets.
      # Why: pull_request runs never get this (no LAN access assumed for that
      #   trigger); the git build still succeeds without it, just uncached.
      # From: Issue #1304 | Issue #1556 | PR #1661
      - name: Prepare ccache/distcc secrets for git build
        if: github.event_name != 'pull_request'
        id: ccache-distcc-secret
        env:
          SCCACHE_REDIS_MODE: ${{ vars.SCCACHE_REDIS_MODE }}
          SCCACHE_REDIS_URL: ${{ secrets.SCCACHE_REDIS_URL }}
          DISTCC_POTENTIAL_HOSTS: ${{ vars.DISTCC_POTENTIAL_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${SCCACHE_REDIS_MODE:-required}" != "off" ] && [ -n "$SCCACHE_REDIS_URL" ]; then
            redis_file="${{ runner.temp }}/build-tools-ccache-redis-url"
            printf '%s' "$SCCACHE_REDIS_URL" > "$redis_file"
            echo "ccache-redis-file=$redis_file" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ccache Redis secret prepared for the git build (mode=off or secret unset)."
          fi
          if [ -n "$DISTCC_POTENTIAL_HOSTS" ]; then
            if ! grep -q ',cpp' <<<"$DISTCC_POTENTIAL_HOSTS"; then
              echo "::error::DISTCC_POTENTIAL_HOSTS must include at least one pump-capable host with the ',cpp' option."
              exit 1
            fi
            distcc_hosts_file="${{ runner.temp }}/build-tools-distcc-potential-hosts"
            printf '%s' "$DISTCC_POTENTIAL_HOSTS" > "$distcc_hosts_file"
            echo "distcc-hosts-file=$distcc_hosts_file" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No distcc hosts secret prepared for the git build (DISTCC_POTENTIAL_HOSTS unset)."
          fi

      # What: computes RUST_ACCELERATION_NETWORK/RUST_BUILDX_NETWORK -- host
      #   only when the ccache/distcc secrets above were prepared, bridge otherwise.
      # Why: an unreachable host-only endpoint would otherwise leave the build
      #   on the default network, silently falling back to an uncached compile.
      # From: Issue #1304 | PR #1661
      - name: Select acceleration network for the standalone build
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          rust_network=bridge
          buildx_network=default
          if [ -n "${{ steps.ccache-distcc-secret.outputs.ccache-redis-file }}" ] || \
             [ -n "${{ steps.ccache-distcc-secret.outputs.distcc-hosts-file }}" ]; then
            rust_network=host
            buildx_network=host
          fi
          printf 'RUST_ACCELERATION_NETWORK=%s\n' "$rust_network" >> "$GITHUB_ENV"
          printf 'RUST_BUILDX_NETWORK=%s\n' "$buildx_network" >> "$GITHUB_ENV"

      # What: resolves an immutable, already-published build-tools image for
      #   the preflight below -- deliberately not this job's own in-progress
      #   output, since that doesn't exist yet at this point in the job.
      # Why: the preflight action's own default (:latest) is a mutable tag,
      #   which the repository's immutable-image-selection contract forbids.
      # From: Issue #1304 | PR #1661
      - name: Select immutable build-tools image for preflight
        if: github.event_name != 'pull_request'
        id: preflight-image
        run: |
          set -euo pipefail
          build_tools_image="$(BUILD_TOOLS_REQUIRE_PUBLISHED=true bash scripts/untracked/select-build-tools-image.sh)"
          printf 'image=%s\n' "$build_tools_image" >> "$GITHUB_OUTPUT"

      # What: also runs for this standalone schedule/workflow_dispatch
      #   route, not just build-push.yml's matrix -- see that file's own
      #   identical step for the full rationale.
      # Why: without this, a broken Redis/distcc endpoint on this route
      #   hides behind the Dockerfile's own local-compile fallback instead
      #   of being surfaced as a real infrastructure finding.
      # From: Issue #1304 | PR #1661
      - name: Validate acceleration infrastructure outside BuildKit cache
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/rust-acceleration-preflight
        with:
          service: build-tools
          distcc-hosts-file: ${{ steps.ccache-distcc-secret.outputs.distcc-hosts-file }}
          ccache-redis-file: ${{ steps.ccache-distcc-secret.outputs.ccache-redis-file }}
          build-tools-image: ${{ steps.preflight-image.outputs.image }}
          build-network: ${{ env.RUST_ACCELERATION_NETWORK }}
          platform: linux/amd64

      # What: builds one local amd64 candidate for fork PRs.
      # Why: fork PRs cannot publish repository packages, but still need a
      #   candidate to run the same smoke/vulnerability policy against.
      # From: PR #1523
      - name: Build local amd64 scan image
        id: local-build-amd64
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        env:
          APT_CACHE_BUST: ${{ vars.APT_CACHE_BUST }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          BUILDX_CACHE_FROM_DIR: ${{ steps.buildx-cache.outputs.cache-from }}
          BUILDX_CACHE_TO_DIR: ${{ steps.buildx-cache.outputs.cache-to }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/build-retry.sh"
          build_retry -- docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --load \
            --pull \
            --tag "$BUILD_TOOLS_SCAN_IMAGE_AMD64" \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "APT_CACHE_BUST=$APT_CACHE_BUST" \
            --build-arg "UTILITIES_IMAGE=$UTILITIES_IMAGE" \
            --cache-from "type=local,src=$BUILDX_CACHE_FROM_DIR" \
            --cache-to "type=local,dest=$BUILDX_CACHE_TO_DIR,mode=max" \
            tools/build-tools

      # What: the one real amd64 build on a publish-capable run.
      # Why: its digest is consumed by smoke, Trivy, provenance, and the
      #   later manifest merge; there is no throwaway local precursor here.
      # From: PR #1523
      - name: Build and push amd64 build-tools image
        id: build
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.rust.digest=${{ steps.build-tools-base-digests.outputs.rust }}
            org.opencontainers.image.base.golang.digest=${{ steps.build-tools-base-digests.outputs.golang }}
          build-args: |
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
            UTILITIES_IMAGE=${{ env.UTILITIES_IMAGE }}
          secret-files: |
            ${{ steps.ccache-distcc-secret.outputs.ccache-redis-file != '' && format('ccache_redis_url={0}', steps.ccache-distcc-secret.outputs.ccache-redis-file) || '' }}
            ${{ steps.ccache-distcc-secret.outputs.distcc-hosts-file != '' && format('distcc_potential_hosts={0}', steps.ccache-distcc-secret.outputs.distcc-hosts-file) || '' }}
          # What: wires the network the preflight above already validated
          #   into the real build too.
          # Why: without this, the build stays on Buildx's default network
          #   even when the preflight confirmed host networking is needed,
          #   and silently falls back to a local, uncached compile.
          # From: Issue #1304 | PR #1661
          network: ${{ env.RUST_BUILDX_NETWORK }}
          allow: ${{ env.RUST_BUILDX_NETWORK == 'host' && 'network.host' || '' }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/amd64
          provenance: false
          pull: true
          cache-from: type=local,src=${{ steps.buildx-cache.outputs.cache-from }}
          cache-to: type=local,dest=${{ steps.buildx-cache.outputs.cache-to }},mode=max

      - name: Smoke-test local amd64 candidate
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_AMD64 }}
          platform: linux/amd64
          run-fixtures: "true"

      - name: Smoke-test exact pushed amd64 candidate digest
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          run-fixtures: "true"

      # What: keys the Trivy cache dir by sanitized ref, ephemeral for
      #   pull_request/workflow_dispatch/rerun events, persistent otherwise.
      # Why: a fixed shared directory let concurrent runs race on Trivy's
      #   single-writer BoltDB backend.
      # From: Issue #912 | PR #927
      - name: Prepare candidate Trivy cache
        id: trivy-cache
        run: |
          set -euo pipefail
          sanitized_ref="$(printf '%s' "$GITHUB_REF" | tr '/:@' '---' | tr -cd 'A-Za-z0-9_.-')"
          [[ -n "$sanitized_ref" ]] || { echo "::error::Could not derive safe cache key."; exit 1; }
          cache_dir="/var/tmp/lancache-ng-trivy-cache/build-tools-${sanitized_ref}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            cache_dir="${cache_dir}-${GITHUB_RUN_ID}"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          else
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$cache_dir"
          echo "dir=$cache_dir" >> "$GITHUB_OUTPUT"

      # What: scans via trivy-scan-retry for its retry/GHCR-mirror/auth.
      # Why: this exact step previously hit a DB-download failure with no
      #   retry anywhere.
      # From: PR #1542, Issue #1535
      #
      # What: continue-on-error -- a finding reports via the step below.
      # Why: PR-context only; release/push scans stay hard-failing
      #   (maintainer decision, AG-INT-002 -- still tracked, not hidden).
      # From: Issue #1095
      - name: Scan local build-tools amd64 image with Trivy
        id: trivy-scan
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # What: allows 50 minutes for this scan step.
        # Why: trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # What: empty (not the real secret) on pull_request.
          # Why: this step runs on every same-repo PR, which also executes
          #   its own trivy-scan-retry copy -- the long-lived Docker Hub
          #   credential has no automatic per-run scope.
          # From: PR #1543, Issue #1535
          dockerhub-username: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-password: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_AMD64 }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-dirs: /usr/local/rustup/toolchains
          hide-progress: true
          cache: "false"
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}
          timeout: 10m
          exit-code: "1"

      # What: fails the job when db-status came back neither value.
      # Why: an unknown status must never be read as a clean scan.
      # From: Issue #1095
      - name: Require a determined Trivy DB status (amd64)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status != 'unavailable' &&
          steps.trivy-scan.outputs.db-status != 'available'
        run: |
          echo "::error::Trivy db-status for build-tools (amd64) is '${{ steps.trivy-scan.outputs.db-status }}' -- the scan never reached its own determination step (timeout, cancellation, or output-propagation failure). Treating this as NOT-RUN: no status report is filed, because nothing was established either way." >&2
          exit 1

      # What: shortens the label under GitHub's 50-char cap.
      # Why: buildtoolswf pushed the old label to 51 chars.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy DB-unavailable status (amd64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          (steps.trivy-scan.outputs.db-status == 'unavailable' ||
           steps.trivy-scan.outputs.db-status == 'available')
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outputs.db-status == 'unavailable' && 'failure' || 'success' }}
          label: trivy-db-unavailable-local-build-tools-amd64
          scope: >-
            Trivy vulnerability DB never downloaded for
            tools/build-tools (amd64) across all retry attempts
          fork-check-step-name: Scan local build-tools amd64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports a pre-report scan error, not a finding.
      # Why: no report exists to evaluate as a finding here.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy scan-error status (amd64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available' &&
          steps.trivy-scan.outputs.scan-error == 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: failure
          label: trivy-scan-error-local-build-tools-amd64
          scope: >-
            Trivy scan of tools/build-tools (amd64) failed before
            producing a report while its DB was present (pull/auth/
            config/scanner error, not a DB outage and not a finding)
          fork-check-step-name: Scan local build-tools amd64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports the scan outcome as a self-closing issue.
      # Why: runs only for an available DB with an actual report.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy PR-scan status (non-blocking, self-closing issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available' &&
          steps.trivy-scan.outputs.scan-error != 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outcome == 'failure' && 'failure' || 'success' }}
          label: trivy-finding-build-tools-amd64
          scope: >-
            Trivy HIGH/CRITICAL finding in tools/build-tools (amd64),
            not covered by .trivyignore.yaml
          fork-check-step-name: Scan local build-tools amd64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      - name: Scan pushed amd64 build-tools digest with Trivy
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        # What: allows 50 minutes for this scan step.
        # Why: the wrapped trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}

      - name: Remove ephemeral Trivy cache
        if: ${{ always() && steps.trivy-cache.outputs.ephemeral == 'true' }}
        env:
          TRIVY_CACHE_DIR: ${{ steps.trivy-cache.outputs.dir }}
        run: |
          set -euo pipefail
          case "$TRIVY_CACHE_DIR" in
            /var/tmp/lancache-ng-trivy-cache/?*) rm -rf -- "$TRIVY_CACHE_DIR" ;;
            *) echo "::error::Refusing unexpected cache path '$TRIVY_CACHE_DIR'."; exit 1 ;;
          esac

      - name: Attest amd64 build-tools image provenance
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Rotate local Buildx cache
        if: >-
          ${{
            always() &&
            (steps.local-build-amd64.outcome == 'success' || steps.build.outcome == 'success')
          }}
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_DEST: ${{ steps.buildx-cache.outputs.cache-to }}
        run: |
          set -euo pipefail
          [ -d "$BUILDX_CACHE_DEST" ] || exit 0
          cache_dir="$BUILDX_CACHE_ROOT/build-tools-amd64"
          lock_file="$BUILDX_CACHE_ROOT/build-tools-amd64.lock"
          mkdir -p "$BUILDX_CACHE_ROOT"
          (
            flock -x 9
            rm -rf "$cache_dir"
            mv "$BUILDX_CACHE_DEST" "$cache_dir"
          ) 9>"$lock_file"

      - name: Remove local scan image
        if: always()
        run: docker rmi "$BUILD_TOOLS_SCAN_IMAGE_AMD64" || true

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  build-tools-arm64:
    name: build arm64 build-tools image (native)
    needs: determine-publish-scope
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      UTILITIES_IMAGE: ${{ needs['determine-publish-scope'].outputs['utilities-image'] }}
    # What: adds issues:write; other scopes below stay unchanged.
    # Why: same addition as the amd64 build-tools job above.
    # From: Issue #1095
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    outputs:
      candidate-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: ./.github/actions/buildx-setup-retry

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: *docker_login_centraliced_versioning # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: *docker_metadata_centraliced_versioning # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-arm64

      - name: Compute immutable pushed source tag
        id: source-tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-arm64\n' "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"; digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]] || { echo "::error::Could not read digest for $image."; exit 1; }
            printf '%s\n' "$digest"
          }
          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
            printf 'golang=%s\n' "$(digest_for_image golang:latest)"
          } >> "$GITHUB_OUTPUT"

      # What: builds one local arm64 candidate for fork PRs.
      # Why: manual/scheduled runs take the pushed exact-digest path instead
      #   of building a second image.
      # From: PR #1523
      - name: Build local arm64 scan image
        id: local-build-arm64
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          load: true
          pull: true
          tags: ${{ env.BUILD_TOOLS_SCAN_IMAGE_ARM64 }}
          platforms: linux/arm64
          build-args: |
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
            UTILITIES_IMAGE=${{ env.UTILITIES_IMAGE }}
          provenance: false
          cache-from: type=gha,scope=build-tools-arm64
          cache-to: type=gha,scope=build-tools-arm64,mode=max

      - name: Build and push arm64 build-tools image
        id: build
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.rust.digest=${{ steps.build-tools-base-digests.outputs.rust }}
            org.opencontainers.image.base.golang.digest=${{ steps.build-tools-base-digests.outputs.golang }}
          build-args: |
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
            UTILITIES_IMAGE=${{ env.UTILITIES_IMAGE }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/arm64
          provenance: false
          pull: true
          cache-from: type=gha,scope=build-tools-arm64
          cache-to: type=gha,scope=build-tools-arm64,mode=max

      - name: Smoke-test local arm64 candidate
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_ARM64 }}
          platform: linux/arm64

      - name: Smoke-test exact pushed arm64 candidate digest
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/arm64

      # What: scans via trivy-scan-retry for its retry/GHCR-mirror/auth.
      # Why: same DB-download exposure as the amd64 leg's identical step.
      # From: Issue #1535
      #
      # What: continue-on-error -- same non-blocking decision as amd64.
      # Why: PR-context only; see the amd64 leg's identical step.
      # From: Issue #1095
      - name: Scan local build-tools arm64 image with Trivy
        id: trivy-scan
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # What: allows 50 minutes for this scan step.
        # Why: trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # What: empty (not the real secret) on pull_request.
          # Why: same PR-branch credential-exfiltration gate as the amd64
          #   leg's identical dockerhub-username/password pair.
          # From: Issue #1535
          dockerhub-username: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-password: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_ARM64 }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-dirs: /usr/local/rustup/toolchains
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      # What: fails the job when db-status came back neither value.
      # Why: an unknown status must never be read as a clean scan.
      # From: Issue #1095
      - name: Require a determined Trivy DB status (arm64)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status != 'unavailable' &&
          steps.trivy-scan.outputs.db-status != 'available'
        run: |
          echo "::error::Trivy db-status for build-tools (arm64) is '${{ steps.trivy-scan.outputs.db-status }}' -- the scan never reached its own determination step (timeout, cancellation, or output-propagation failure). Treating this as NOT-RUN: no status report is filed, because nothing was established either way." >&2
          exit 1

      # What: shortens the label under GitHub's 50-char cap.
      # Why: buildtoolswf pushed the old label to 51 chars.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy DB-unavailable status (arm64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          (steps.trivy-scan.outputs.db-status == 'unavailable' ||
           steps.trivy-scan.outputs.db-status == 'available')
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outputs.db-status == 'unavailable' && 'failure' || 'success' }}
          label: trivy-db-unavailable-local-build-tools-arm64
          scope: >-
            Trivy vulnerability DB never downloaded for
            tools/build-tools (arm64) across all retry attempts
          fork-check-step-name: Scan local build-tools arm64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports a pre-report scan error, not a finding.
      # Why: no report exists to evaluate as a finding here.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy scan-error status (arm64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available' &&
          steps.trivy-scan.outputs.scan-error == 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: failure
          label: trivy-scan-error-local-build-tools-arm64
          scope: >-
            Trivy scan of tools/build-tools (arm64) failed before
            producing a report while its DB was present (pull/auth/
            config/scanner error, not a DB outage and not a finding)
          fork-check-step-name: Scan local build-tools arm64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports the scan outcome as a self-closing issue.
      # Why: runs only for an available DB with an actual report.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy PR-scan status (non-blocking, self-closing issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available' &&
          steps.trivy-scan.outputs.scan-error != 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outcome == 'failure' && 'failure' || 'success' }}
          label: trivy-finding-build-tools-arm64
          scope: >-
            Trivy HIGH/CRITICAL finding in tools/build-tools (arm64),
            not covered by .trivyignore.yaml
          fork-check-step-name: Scan local build-tools arm64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      - name: Scan pushed arm64 build-tools digest with Trivy
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        # What: allows 50 minutes for this scan step.
        # Why: the wrapped trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ runner.temp }}/trivy-build-tools-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          cleanup-cache: "true"

      - name: Attest arm64 build-tools image provenance
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Remove local scan image
        if: always()
        run: docker rmi "$BUILD_TOOLS_SCAN_IMAGE_ARM64" || true

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  merge-build-tools-manifests:
    name: merge build-tools multi-platform manifest
    # What: merges the amd64 + arm64 tags into the real sha-<commit> tag.
    # Why: no image is rebuilt here, only a manifest list assembled from
    #   two already-pushed digests -- same pattern as build-push.yml's
    #   merge-manifests job.
    # From: PR #1523
    needs: [determine-publish-scope, build-tools, build-tools-arm64]
    if: >-
      ${{
        !cancelled() &&
        needs['build-tools'].result == 'success' &&
        needs['build-tools-arm64'].result == 'success' &&
        github.event_name != 'pull_request'
      }}
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        uses: *docker_login_centraliced_versioning # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest from checked child digests
        id: merge
        env:
          AMD64_DIGEST: ${{ needs.build-tools.outputs.candidate-digest }}
          ARM64_DIGEST: ${{ needs.build-tools-arm64.outputs.candidate-digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # What: merges the exact child job digests, not a re-resolved tag.
          # Why: a mutable :sha-<commit>-standalone-{amd64,arm64} tag could
          #   move between the child jobs finishing and this step running.
          # From: Issue #1522 | PR #1523
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest '$AMD64_DIGEST'."; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest '$ARM64_DIGEST'."; exit 1; }

          source_tag="${BUILD_TOOLS_IMAGE}:sha-${GITHUB_SHA}"
          amd64_ref="${BUILD_TOOLS_IMAGE}@${AMD64_DIGEST}"
          arm64_ref="${BUILD_TOOLS_IMAGE}@${ARM64_DIGEST}"

          # What: sets the index-level image description at merge time.
          # Why: kept in sync by hand with build-push.yml's own build-tools
          #   matrix.description entry, not sourced from one shared place;
          #   the per-platform build/arm64 jobs stay unannotated on purpose.
          # From: Issue #620
          build_tools_description="Prebuilt lancache-ng CI and developer validation toolchain image."

          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create -t "$source_tag" "$amd64_ref" "$arm64_ref" \
            --annotation "index:org.opencontainers.image.description=${build_tools_description}"
          printf 'source-tag=%s\n' "$source_tag" >> "$GITHUB_OUTPUT"

      # What: verifies the merged manifest exposes both platforms.
      # Why: a manual imagetools create can still produce a tag missing a
      #   platform if a staging tag silently resolved to the wrong arch.
      # From: PR #1523
      - name: Verify merged manifest exposes both platforms
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/untracked/require-image-platforms.sh "${{ steps.merge.outputs.source-tag }}" linux/amd64,linux/arm64

      - name: Resolve merged manifest digest
        id: merged-digest
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "${{ steps.merge.outputs.source-tag }}" --format '{{json .Manifest.Digest}}')"
          digest="${digest%\"}"; digest="${digest#\"}"
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid merged digest '$digest'."; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest merged build-tools manifest provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.merged-digest.outputs.digest }}

      - name: Promote mutable tags from the attested digest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          MERGED_DIGEST: ${{ steps.merged-digest.outputs.digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          sanitized_ref="$(printf '%s' "$REF_NAME" | tr '/:@' '---' | tr -cd 'A-Za-z0-9_.-')"
          [[ -n "$sanitized_ref" ]] || { echo "::error::Could not derive branch tag."; exit 1; }
          branch_tag="${sanitized_ref}-tc"
          source_ref="${BUILD_TOOLS_IMAGE}@${MERGED_DIGEST}"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools create --prefer-index=false -t "${BUILD_TOOLS_IMAGE}:${branch_tag}" "$source_ref"
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools create --prefer-index=false -t "${BUILD_TOOLS_IMAGE}:latest" "$source_ref"
          elif [ "$REF_NAME" = "current_dev" ]; then
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools create --prefer-index=false -t "${BUILD_TOOLS_IMAGE}:nightly" "$source_ref"
          fi

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true
