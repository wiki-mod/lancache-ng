
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: builds, scans, and publishes multi-arch build-tools image.
# Why: fork PRs: parallel arch builds; same-repo: build-push.yml
# From: PR #1523
name: Build Tools Image

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"
  pull_request:
    branches: [master, current_dev, v0.2.0]
    paths:
      - "tools/build-tools/**"
      - ".github/workflows/build-tools.yml"
      - ".github/actions/build-tools-candidate-smoke/**"
      - ".github/actions/trivy-scan-exact-digest/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-publish', github.workflow) }}
  cancel-in-progress: false

env:
  BUILD_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools
  # What: local scan-image tags are suffixed by run_id-run_attempt.
  # Why: isolate images per run to prevent deletion race.
  # From: PR #1523
  BUILD_TOOLS_SCAN_IMAGE_AMD64: lancache-ng-build-tools-scan:${{ github.run_id }}-${{ github.run_attempt }}-amd64
  BUILD_TOOLS_SCAN_IMAGE_ARM64: lancache-ng-build-tools-scan:${{ github.run_id }}-${{ github.run_attempt }}-arm64

defaults:
  run:
    shell: bash

jobs:
  determine-publish-scope:
    name: admit standalone build-tools route
    # What: shared admission gate for both architecture jobs below.
    # Why: centralize fork-only exception, not per-job repeats.
    # From: PR #1523
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.id != github.event.repository.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.should-publish.outputs.should-publish }}
    steps:
      - name: Confirm standalone route
        run: |
          set -euo pipefail
          echo "Standalone build-tools route admitted for event '$GITHUB_EVENT_NAME'."

      - name: Checkout
        uses: &checkout_centraliced_versioning actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: compute should-publish once for both architecture jobs.
      # Why: skip rebuild on unchanged inputs; manual triggers override.
      # From: Issue #1253
      - name: Determine whether build-tools inputs actually changed
        id: should-publish
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "$before_sha" 2>/dev/null || true
          fi

          if ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            echo "::notice::Could not fetch base commit $before_sha to diff against; publishing to be safe."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # What: buffer diff output to variable, not piped to grep.
          # Why: prevents SIGPIPE from early-exit grep -q under -eo pipefail.
          # From: PR #1500
          changed_build_tools_files="$(git diff --name-only "$before_sha" "${{ github.sha }}" -- tools/build-tools .github/workflows/build-tools.yml)" || changed_build_tools_files=""
          if [ -n "$changed_build_tools_files" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No tools/build-tools/** or workflow-file change found in this push's commit range; skipping build-tools image rebuild/publish."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

  build-tools:
    name: build amd64 build-tools image
    needs: determine-publish-scope
    runs-on: [self-hosted, linux, lancache, lancache-heavy]
    timeout-minutes: 150
    concurrency:
      group: build-tools-amd64-image-build
      cancel-in-progress: false
    # What: add issues:write to job permissions; others unchanged.
    # Why: job perms replace workflow level; issues:write for Trivy.
    # From: Issue #1095
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    outputs:
      candidate-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: &docker_setup_buildx_centraliced_versioning docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Prepare local Buildx cache
        id: buildx-cache
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_READ: ${{ runner.temp }}/lancache-ng-build-tools-cache/read
          BUILDX_CACHE_DEST: ${{ runner.temp }}/lancache-ng-build-tools-cache/new
        run: |
          set -euo pipefail
          command -v flock >/dev/null 2>&1 || { echo "::error::flock is required."; exit 1; }
          cache_dir="$BUILDX_CACHE_ROOT/build-tools-amd64"
          lock_file="$BUILDX_CACHE_ROOT/build-tools-amd64.lock"
          mkdir -p "$BUILDX_CACHE_ROOT"
          rm -rf "$BUILDX_CACHE_READ" "$BUILDX_CACHE_DEST"
          mkdir -p "$BUILDX_CACHE_READ" "$(dirname "$BUILDX_CACHE_DEST")"
          (
            flock -x 9
            mkdir -p "$cache_dir"
            cp -a "$cache_dir/." "$BUILDX_CACHE_READ/"
          ) 9>"$lock_file"
          {
            echo "cache-from=$BUILDX_CACHE_READ"
            echo "cache-to=$BUILDX_CACHE_DEST"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: &docker_login_centraliced_versioning ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: &docker_metadata_centraliced_versioning docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-amd64

      - name: Compute immutable pushed source tag
        id: source-tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-amd64\n' "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"; digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]] || { echo "::error::Could not read digest for $image."; exit 1; }
            printf '%s\n' "$digest"
          }
          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
          } >> "$GITHUB_OUTPUT"

      # What: acceleration network, always bridge/default now
      # Why: no C compile here ever needed Redis/distcc
      # From: Issue #1781 | PR #1783

      # What: writes the LAN proxy CA to a secret file.
      # Why: PR and push builds both need https via Squid.
      # From: Issue #1095
      - name: Prepare LAN proxy CA secret for git/cargo build
        id: lan-proxy-ca
        env:
          PROJECT_SELFHOSTED_PROXY_CA: ${{ secrets.PROJECT_SELFHOSTED_PROXY_CA }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$PROJECT_SELFHOSTED_PROXY_CA" ]; then
            ca_file="${{ runner.temp }}/build-tools-proxy-ca.crt"
            printf '%s' "$PROJECT_SELFHOSTED_PROXY_CA" > "$ca_file"
            echo "ca-file=$ca_file" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No LAN proxy CA secret prepared (PROJECT_SELFHOSTED_PROXY_CA unset)."
          fi
      - name: Select acceleration network for the standalone build
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf 'RUST_ACCELERATION_NETWORK=%s\n' "bridge" >> "$GITHUB_ENV"
          printf 'RUST_BUILDX_NETWORK=%s\n' "default" >> "$GITHUB_ENV"

      # What: build local amd64 candidate for fork PRs.
      # Why: fork PRs can't publish; still need candidate for smoke/vuln.
      # From: PR #1523
      - name: Build local amd64 scan image
        id: local-build-amd64
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        env:
          APT_CACHE_BUST: ${{ vars.APT_CACHE_BUST }}
          # What: LAN proxy vars; self-hosted runner has a route.
          # Why: https trusted via the Squid re-signing CA secret.
          # From: Issue #1095
          LAN_PROXY_HTTP: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
          LAN_PROXY_HTTPS: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
          LAN_PROXY_NO_PROXY: ${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
          LAN_PROXY_CA_FILE: ${{ steps.lan-proxy-ca.outputs.ca-file }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          BUILDX_CACHE_FROM_DIR: ${{ steps.buildx-cache.outputs.cache-from }}
          BUILDX_CACHE_TO_DIR: ${{ steps.buildx-cache.outputs.cache-to }}
          HTTP_PROXY: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
          HTTPS_PROXY: ${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
          NO_PROXY: ${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/build-retry.sh"
          secret_args=()
          if [ -n "$LAN_PROXY_CA_FILE" ]; then
            secret_args+=(--secret "id=project_selfhosted_proxy_ca,src=$LAN_PROXY_CA_FILE")
          fi
          build_retry -- docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --load \
            --pull \
            --tag "$BUILD_TOOLS_SCAN_IMAGE_AMD64" \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "APT_CACHE_BUST=$APT_CACHE_BUST" \
            --build-arg "HTTP_PROXY=$HTTP_PROXY" \
            --build-arg "HTTPS_PROXY=$HTTPS_PROXY" \
            --build-arg "NO_PROXY=$NO_PROXY" \
            --build-arg "http_proxy=$HTTP_PROXY" \
            --build-arg "https_proxy=$HTTPS_PROXY" \
            --build-arg "no_proxy=$NO_PROXY" \
            --build-arg "PROJECT_SELFHOSTED_GOMODCACHE=${{ vars.PROJECT_SELFHOSTED_GOMODCACHE }}" \
            --build-arg "PROJECT_SELFHOSTED_GOCACHE=${{ vars.PROJECT_SELFHOSTED_GOCACHE }}" \
            --build-arg "PROJECT_SELFHOSTED_GOPROXY=${{ vars.PROJECT_SELFHOSTED_GOPROXY }}" \
            "${secret_args[@]}" \
            --cache-from "type=local,src=$BUILDX_CACHE_FROM_DIR" \
            --cache-to "type=local,dest=$BUILDX_CACHE_TO_DIR,mode=max" \
            tools/build-tools

      # What: the one real amd64 build on publish-capable run.
      # Why: digest consumed by smoke, Trivy, provenance, manifest merge.
      # From: PR #1523
      - name: Build and push amd64 build-tools image
        id: build
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.rust.digest=${{ steps.build-tools-base-digests.outputs.rust }}
          # What: https_proxy trusted via the proxy CA secret file.
          # Why: Squid re-signs https; the CA makes it verifiable.
          # From: Issue #1095
          build-args: |
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
            HTTP_PROXY=${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
            HTTPS_PROXY=${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
            NO_PROXY=${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
            http_proxy=${{ vars.PROJECT_SELFHOSTED_PROXY_HTTP }}
            https_proxy=${{ vars.PROJECT_SELFHOSTED_PROXY_HTTPS }}
            no_proxy=${{ vars.PROJECT_SELFHOSTED_PROXY_EXCLUSION }}
            PROJECT_SELFHOSTED_GOMODCACHE=${{ vars.PROJECT_SELFHOSTED_GOMODCACHE }}
            PROJECT_SELFHOSTED_GOCACHE=${{ vars.PROJECT_SELFHOSTED_GOCACHE }}
            PROJECT_SELFHOSTED_GOPROXY=${{ vars.PROJECT_SELFHOSTED_GOPROXY }}
          # What: supplies the CA the Dockerfile's install-ca-cert.sh needs.
          # Why: no distcc/ccache secret is prepared on this branch.
          # From: Issue #1095
          secret-files: |
            ${{ steps['lan-proxy-ca'].outputs['ca-file'] != '' && format('project_selfhosted_proxy_ca={0}', steps['lan-proxy-ca'].outputs['ca-file']) || '' }}
          # What: network wire, set by the step above
          # Why: keeps a real accelerator easy to reintroduce later
          # From: Issue #1781 | PR #1783
          network: ${{ env.RUST_BUILDX_NETWORK }}
          allow: ${{ env.RUST_BUILDX_NETWORK == 'host' && 'network.host' || '' }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/amd64
          provenance: false
          pull: true
          cache-from: type=local,src=${{ steps.buildx-cache.outputs.cache-from }}
          cache-to: type=local,dest=${{ steps.buildx-cache.outputs.cache-to }},mode=max

      - name: Smoke-test local amd64 candidate
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_AMD64 }}
          platform: linux/amd64
          run-fixtures: "true"

      - name: Smoke-test exact pushed amd64 candidate digest
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          run-fixtures: "true"

      # What: resolves shared, NFS-backed Trivy DB cache directory.
      # Why: replaces a dir wiped every run, forcing full DB re-download.
      # From: Issue #1095 | PR #1747
      - name: Resolve shared Trivy DB cache directory
        id: trivy-cache
        uses: ./.github/actions/trivy-cache-dir

      - name: Ensure shared Trivy DB is current
        id: trivy-db-fresh
        uses: ./.github/actions/trivy-db-ensure-fresh
        with:
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}

      # What: scan via trivy-scan-retry for retry/GHCR-mirror/auth.
      # Why: earlier step hit DB-download failure with no retry.
      # From: Issue #1535 | PR #1542
      #
      # What: continue-on-error; finding reported by step below.
      # Why: PR-context only; release/push scans fail hard (maintainer).
      # From: Issue #1095
      - name: Scan local build-tools amd64 image with Trivy
        id: trivy-scan
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # What: allow 50 minutes for scan with retry.
        # Why: trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # What: empty (not real secret) on pull_request.
          # Why: avoid Docker Hub credential exfiltration via same-repo PR.
          # From: Issue #1535 | PR #1543
          dockerhub-username: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-password: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_AMD64 }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-dirs: /usr/local/rustup/toolchains
          hide-progress: true
          cache: "false"
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}
          skip-db-update: ${{ steps.trivy-db-fresh.outputs.db-present == 'true' }}
          timeout: 10m
          exit-code: "1"

      # What: fails the job when db-status came back neither value.
      # Why: an unknown status must never be read as a clean scan.
      # From: Issue #1095
      - name: Require a determined Trivy DB status (amd64)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status != 'unavailable' &&
          steps.trivy-scan.outputs.db-status != 'available'
        run: |
          echo "::error::Trivy db-status for build-tools (amd64) is '${{ steps.trivy-scan.outputs.db-status }}' -- the scan never reached its own determination step (timeout, cancellation, or output-propagation failure). Treating this as NOT-RUN: no status report is filed, because nothing was established either way." >&2
          exit 1

      # What: shortens the label under GitHub's 50-char cap.
      # Why: buildtoolswf pushed the old label to 51 chars.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy DB-unavailable status (amd64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          (steps.trivy-scan.outputs.db-status == 'unavailable' ||
           steps.trivy-scan.outputs.db-status == 'available')
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outputs.db-status == 'unavailable' && 'failure' || 'success' }}
          label: trivy-db-unavailable-local-build-tools-amd64
          scope: >-
            Trivy vulnerability DB never downloaded for
            tools/build-tools (amd64) across all retry attempts
          fork-check-step-name: Scan local build-tools amd64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports a pre-report scan error, not a finding.
      # Why: no report exists to evaluate as a finding here.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy scan-error status (amd64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outputs.scan-error == 'true' && 'failure' || 'success' }}
          label: trivy-scan-error-local-build-tools-amd64
          scope: >-
            Trivy scan of tools/build-tools (amd64) failed before
            producing a report while its DB was present (pull/auth/
            config/scanner error, not a DB outage and not a finding)
          fork-check-step-name: Scan local build-tools amd64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports the scan outcome as a self-closing issue.
      # Why: runs only for an available DB with an actual report.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy PR-scan status (non-blocking, self-closing issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available' &&
          steps.trivy-scan.outputs.scan-error != 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outcome == 'failure' && 'failure' || 'success' }}
          label: trivy-finding-build-tools-amd64
          scope: >-
            Trivy HIGH/CRITICAL finding in tools/build-tools (amd64),
            not covered by .trivyignore.yaml
          fork-check-step-name: Scan local build-tools amd64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      - name: Scan pushed amd64 build-tools digest with Trivy
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        # What: allow 50 minutes for scan with retry.
        # Why: wrapped trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          cache-dir: ${{ steps.trivy-cache.outputs.dir }}
          skip-db-update: ${{ steps.trivy-db-fresh.outputs.db-present == 'true' }}

      - name: Attest amd64 build-tools image provenance
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Rotate local Buildx cache
        if: >-
          ${{
            always() &&
            (steps.local-build-amd64.outcome == 'success' || steps.build.outcome == 'success')
          }}
        env:
          BUILDX_CACHE_ROOT: /var/tmp/lancache-ng-buildx-cache
          BUILDX_CACHE_DEST: ${{ steps.buildx-cache.outputs.cache-to }}
        run: |
          set -euo pipefail
          [ -d "$BUILDX_CACHE_DEST" ] || exit 0
          cache_dir="$BUILDX_CACHE_ROOT/build-tools-amd64"
          lock_file="$BUILDX_CACHE_ROOT/build-tools-amd64.lock"
          mkdir -p "$BUILDX_CACHE_ROOT"
          (
            flock -x 9
            rm -rf "$cache_dir"
            mv "$BUILDX_CACHE_DEST" "$cache_dir"
          ) 9>"$lock_file"

      - name: Remove local scan image
        if: always()
        run: docker rmi "$BUILD_TOOLS_SCAN_IMAGE_AMD64" || true

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  build-tools-arm64:
    name: build arm64 build-tools image (native)
    needs: determine-publish-scope
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    # What: add issues:write; others unchanged (same as amd64 job).
    # Why: needed for self-closing Trivy report in this job.
    # From: Issue #1095
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      issues: write
    outputs:
      candidate-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: ./.github/actions/buildx-setup-retry

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: *docker_metadata_centraliced_versioning # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-arm64

      - name: Compute immutable pushed source tag
        id: source-tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-arm64\n' "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve build-tools base image digests
        id: build-tools-base-digests
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          digest_for_image() {
            local image=$1 digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}')"
            digest="${digest%\"}"; digest="${digest#\"}"
            [[ -n "$digest" && "$digest" != "null" ]] || { echo "::error::Could not read digest for $image."; exit 1; }
            printf '%s\n' "$digest"
          }
          {
            printf 'rust=%s\n' "$(digest_for_image rust:latest)"
          } >> "$GITHUB_OUTPUT"

      # What: build local arm64 candidate for fork PRs.
      # Why: manual/scheduled runs use pushed exact-digest path instead.
      # From: PR #1523
      - name: Build local arm64 scan image
        id: local-build-arm64
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          load: true
          pull: true
          tags: ${{ env.BUILD_TOOLS_SCAN_IMAGE_ARM64 }}
          platforms: linux/arm64
          # What: omits the LAN-proxy build-arg on this arm64 job.
          # Why: no route to the self-hosted-only proxy; static split.
          # From: Issue #1095
          build-args: |
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
          provenance: false
          cache-from: type=gha,scope=build-tools-arm64
          cache-to: type=gha,scope=build-tools-arm64,mode=max

      - name: Build and push arm64 build-tools image
        id: build
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.rust.digest=${{ steps.build-tools-base-digests.outputs.rust }}
          # What: omits the LAN-proxy build-arg on this arm64 job.
          # Why: no route to the self-hosted-only proxy; static split.
          # From: Issue #1095
          build-args: |
            APT_CACHE_BUST=${{ vars.APT_CACHE_BUST }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/arm64
          provenance: false
          pull: true
          cache-from: type=gha,scope=build-tools-arm64
          cache-to: type=gha,scope=build-tools-arm64,mode=max

      - name: Smoke-test local arm64 candidate
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_ARM64 }}
          platform: linux/arm64

      - name: Smoke-test exact pushed arm64 candidate digest
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/arm64

      # What: scan via trivy-scan-retry for retry/GHCR-mirror/auth.
      # Why: same DB-download exposure as amd64 leg (identical step).
      # From: Issue #1535
      #
      # What: continue-on-error; same non-blocking as amd64 leg.
      # Why: PR-context only; see amd64 leg for full rationale.
      # From: Issue #1095
      - name: Scan local build-tools arm64 image with Trivy
        id: trivy-scan
        if: github.event_name == 'pull_request'
        continue-on-error: true
        # What: allow 50 minutes for scan with retry.
        # Why: trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # What: empty (not real secret) on pull_request.
          # Why: same credential-exfiltration gate as amd64 leg.
          # From: Issue #1535
          dockerhub-username: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME || '' }}
          dockerhub-password: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
          image-ref: ${{ env.BUILD_TOOLS_SCAN_IMAGE_ARM64 }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-dirs: /usr/local/rustup/toolchains
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      # What: fails the job when db-status came back neither value.
      # Why: an unknown status must never be read as a clean scan.
      # From: Issue #1095
      - name: Require a determined Trivy DB status (arm64)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status != 'unavailable' &&
          steps.trivy-scan.outputs.db-status != 'available'
        run: |
          echo "::error::Trivy db-status for build-tools (arm64) is '${{ steps.trivy-scan.outputs.db-status }}' -- the scan never reached its own determination step (timeout, cancellation, or output-propagation failure). Treating this as NOT-RUN: no status report is filed, because nothing was established either way." >&2
          exit 1

      # What: shortens the label under GitHub's 50-char cap.
      # Why: buildtoolswf pushed the old label to 51 chars.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy DB-unavailable status (arm64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          (steps.trivy-scan.outputs.db-status == 'unavailable' ||
           steps.trivy-scan.outputs.db-status == 'available')
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outputs.db-status == 'unavailable' && 'failure' || 'success' }}
          label: trivy-db-unavailable-local-build-tools-arm64
          scope: >-
            Trivy vulnerability DB never downloaded for
            tools/build-tools (arm64) across all retry attempts
          fork-check-step-name: Scan local build-tools arm64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports a pre-report scan error, not a finding.
      # Why: no report exists to evaluate as a finding here.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy scan-error status (arm64, separate issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outputs.scan-error == 'true' && 'failure' || 'success' }}
          label: trivy-scan-error-local-build-tools-arm64
          scope: >-
            Trivy scan of tools/build-tools (arm64) failed before
            producing a report while its DB was present (pull/auth/
            config/scanner error, not a DB outage and not a finding)
          fork-check-step-name: Scan local build-tools arm64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      # What: reports the scan outcome as a self-closing issue.
      # Why: runs only for an available DB with an actual report.
      # From: Issue #1095 | PR #1735
      - name: Report Trivy PR-scan status (non-blocking, self-closing issue)
        if: >-
          github.event_name == 'pull_request' &&
          steps.trivy-scan.outputs.db-status == 'available' &&
          steps.trivy-scan.outputs.scan-error != 'true'
        uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ steps.trivy-scan.outcome == 'failure' && 'failure' || 'success' }}
          label: trivy-finding-build-tools-arm64
          scope: >-
            Trivy HIGH/CRITICAL finding in tools/build-tools (arm64),
            not covered by .trivyignore.yaml
          fork-check-step-name: Scan local build-tools arm64 image with Trivy
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

      - name: Scan pushed arm64 build-tools digest with Trivy
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        # What: allow 50 minutes for scan with retry.
        # Why: wrapped trivy-scan-retry can run up to 4 attempts.
        # From: Issue #1535
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-exact-digest
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          # What: unchanged from before -- runner.temp path, cleaned every run
          # Why: GitHub-hosted arm64 runner has no access to the NFS DB mount
          # From: Issue #1095 | PR #1747
          cache-dir: ${{ runner.temp }}/trivy-build-tools-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          cleanup-cache: "true"

      - name: Attest arm64 build-tools image provenance
        if: github.event_name != 'pull_request' && needs['determine-publish-scope'].outputs.should-publish == 'true'
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Remove local scan image
        if: always()
        run: docker rmi "$BUILD_TOOLS_SCAN_IMAGE_ARM64" || true

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true

  merge-build-tools-manifests:
    name: merge build-tools multi-platform manifest
    # What: merges amd64+arm64 tags into sha-<commit> multi-arch tag.
    # Why: assembles manifest list from already-pushed digests.
    # From: PR #1523
    needs: [determine-publish-scope, build-tools, build-tools-arm64]
    if: >-
      ${{
        !cancelled() &&
        needs['build-tools'].result == 'success' &&
        needs['build-tools-arm64'].result == 'success' &&
        github.event_name != 'pull_request'
      }}
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: *checkout_centraliced_versioning # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: *docker_setup_buildx_centraliced_versioning # v4.3.0

      - name: Log in to GHCR
        uses: *docker_login_centraliced_versioning
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest from checked child digests
        id: merge
        env:
          AMD64_DIGEST: ${{ needs.build-tools.outputs.candidate-digest }}
          ARM64_DIGEST: ${{ needs.build-tools-arm64.outputs.candidate-digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          # What: merge exact child job digests, not re-resolved tag.
          # Why: prevent mutable tag from shifting between job end and merge.
          # From: Issue #1522 | PR #1523
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid amd64 digest '$AMD64_DIGEST'."; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid arm64 digest '$ARM64_DIGEST'."; exit 1; }

          source_tag="${BUILD_TOOLS_IMAGE}:sha-${GITHUB_SHA}"
          amd64_ref="${BUILD_TOOLS_IMAGE}@${AMD64_DIGEST}"
          arm64_ref="${BUILD_TOOLS_IMAGE}@${ARM64_DIGEST}"

          # What: set index-level image description at merge time.
          # Why: manual sync with build-push.yml; per-platform unannotated.
          # From: Issue #620
          build_tools_description="Prebuilt lancache-ng CI and developer validation toolchain image."

          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- \
            docker buildx imagetools create -t "$source_tag" "$amd64_ref" "$arm64_ref" \
            --annotation "index:org.opencontainers.image.description=${build_tools_description}"
          printf 'source-tag=%s\n' "$source_tag" >> "$GITHUB_OUTPUT"

      # What: verify merged manifest exposes both platforms.
      # Why: prevent silent single-arch manifest from wrong staging tag.
      # From: PR #1523
      - name: Verify merged manifest exposes both platforms
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/untracked/require-image-platforms.sh "${{ steps.merge.outputs.source-tag }}" linux/amd64,linux/arm64

      - name: Resolve merged manifest digest
        id: merged-digest
        env:
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          digest="$(ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools inspect "${{ steps.merge.outputs.source-tag }}" --format '{{json .Manifest.Digest}}')"
          digest="${digest%\"}"; digest="${digest#\"}"
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid merged digest '$digest'."; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest merged build-tools manifest provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.merged-digest.outputs.digest }}

      # What: :nightly only reachable via a real current_dev-ref run.
      # Why: schedule always resolves REF_NAME to the default branch.
      # From: Issue #1095
      - name: Promote mutable tags from the attested digest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          MERGED_DIGEST: ${{ steps.merged-digest.outputs.digest }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/lib/ghcr-retry.sh"
          sanitized_ref="$(printf '%s' "$REF_NAME" | tr '/:@' '---' | tr -cd 'A-Za-z0-9_.-')"
          [[ -n "$sanitized_ref" ]] || { echo "::error::Could not derive branch tag."; exit 1; }
          branch_tag="${sanitized_ref}-tc"
          source_ref="${BUILD_TOOLS_IMAGE}@${MERGED_DIGEST}"
          ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools create --prefer-index=false -t "${BUILD_TOOLS_IMAGE}:${branch_tag}" "$source_ref"
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools create --prefer-index=false -t "${BUILD_TOOLS_IMAGE}:latest" "$source_ref"
          elif [ "$REF_NAME" = "current_dev" ]; then
            ghcr_retry ghcr.io "$GHCR_RETRY_USERNAME" "$GHCR_RETRY_PASSWORD" -- docker buildx imagetools create --prefer-index=false -t "${BUILD_TOOLS_IMAGE}:nightly" "$source_ref"
          fi

      - name: Remove buildx builder
        if: always()
        run: docker buildx rm "${{ steps.buildx.outputs.name }}" || true
