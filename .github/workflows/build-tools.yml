
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: Build, smoke, scan, publish the build-tools image.
# Why: Weekly input-change gate; NOOP when unchanged.
# From: Issue #1683
name: Build Tools Image

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      arch:
        description: Which architectures to act on.
        type: choice
        options: [both, amd64, arm64]
        default: both
      mode:
        description: check runs the input gate; build forces a rebuild.
        type: choice
        options: [check, build]
        default: check

permissions:
  contents: read
  packages: write

concurrency:
  group: build-tools-image
  cancel-in-progress: false

env:
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  determine-build-need:
    name: input-change gate
    runs-on: ubuntu-latest
    outputs:
      build-amd64: ${{ steps.plan.outputs.build-amd64 }}
      build-arm64: ${{ steps.plan.outputs.build-arm64 }}
      matrix: ${{ steps.plan.outputs.matrix }}
      signature: ${{ steps.plan.outputs.signature }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      # What: native fail-closed checkout; persistent ci.sh git auth.
      # Why: no SHA pin outside the SOT; git is a runner tool.
      # From: Issue #1683
      - &bootstrap
        name: Bootstrap the working tree
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: bearer ${GHCR_TOKEN}"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Plan the build-tools refresh
        id: plan
        env:
          BT_ARCH: ${{ github.event.inputs.arch || 'both' }}
          BT_MODE: ${{ github.event.inputs.mode || 'check' }}
        run: bash .github/scripts/ci.sh build-tools plan

  build:
    name: build ${{ matrix.arch }} build-tools image (native)
    needs: determine-build-need
    if: needs.determine-build-need.outputs.build-amd64 == 'true' || needs.determine-build-need.outputs.build-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-build-need.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - *bootstrap
      # What: Docker Hub auth for the buildkit bootstrap pull.
      # Why: setup-buildx pulls moby/buildkit from Docker Hub.
      # From: Issue #1683 | Issue #930
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # What: ci.sh builds+pushes, then smokes and scans the digest.
      # Why: ci.sh owns tag, labels, readback, smoke and scan policy.
      # From: Issue #1683
      - name: Build, smoke and scan the platform image
        env:
          BT_PLATFORM: ${{ matrix.platform }}
          BT_SIGNATURE: ${{ needs.determine-build-need.outputs.signature }}
          IMAGE: ${{ needs.determine-build-need.outputs.image }}
          CI_BUILD_CACHE_FROM: type=gha,scope=build-tools-${{ matrix.arch }}
          CI_BUILD_CACHE_TO: type=gha,scope=build-tools-${{ matrix.arch }},mode=max
        run: |
          set -euo pipefail
          digest="$(bash .github/scripts/ci.sh build-tools build "${BT_PLATFORM}" "${BT_SIGNATURE}")"
          [ -n "${digest}" ] || { echo "no digest from build" >&2; exit 1; }
          CI_TOOLCHAIN_IMAGE="${IMAGE}@${digest}" bash .github/scripts/ci.sh test build-tools
          # What: scan in the just-built image; it ships trivy (SOT).
          # Why: the runner has no trivy; the toolchain image does.
          # From: Issue #1683 | Issue #1535
          docker run --rm -e GHCR_USERNAME -e GHCR_TOKEN -e CI_TMPDIR=/var/tmp \
            -v "${PWD}:/w" -w /w "${IMAGE}@${digest}" \
            bash .github/scripts/ci.sh scan build-tools "${digest}"

  merge-manifests:
    name: assemble multi-arch build-tools manifest
    needs: [determine-build-need, build]
    if: needs.determine-build-need.outputs.build-amd64 == 'true' && needs.determine-build-need.outputs.build-arm64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *bootstrap
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Assemble the multi-arch manifest
        run: bash .github/scripts/ci.sh build-tools merge
