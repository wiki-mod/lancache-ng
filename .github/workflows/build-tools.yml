
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: build, scan, publish the Alpine build-tools image.
# Why: weekly rebuild only on a changed input; NOOP else.
# From: Issue #1683
name: Build Tools Image

# What: weekly input-change check + manual dispatch.
# Why: build-tools is a factory, rebuilt on input change.
# From: Issue #1683
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      arch:
        description: Which architectures to act on.
        type: choice
        options: [both, amd64, arm64]
        default: both
      mode:
        description: check runs the input gate; build forces a rebuild.
        type: choice
        options: [check, build]
        default: check

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-tools-image
  cancel-in-progress: false

jobs:
  determine-build-need:
    name: input-change gate
    runs-on: ubuntu-latest
    outputs:
      build-amd64: ${{ steps.plan.outputs.build-amd64 }}
      build-arm64: ${{ steps.plan.outputs.build-arm64 }}
      matrix: ${{ steps.plan.outputs.matrix }}
      signature: ${{ steps.plan.outputs.signature }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: resolve, decide, emit all outputs.
      # Why: the gate lives in ci.sh; YAML only calls it.
      # From: Issue #1683
      - name: Plan the build-tools refresh
        id: plan
        env:
          BT_ARCH: ${{ github.event.inputs.arch || 'both' }}
          BT_MODE: ${{ github.event.inputs.mode || 'check' }}
        run: bash .github/scripts/ci.sh build-tools plan

  # What: one platform-parameterized build job, not a twin.
  # Why: platform is a matrix parameter; logic exists once.
  # From: Issue #1683
  build:
    name: build ${{ matrix.arch }} build-tools image (native)
    needs: determine-build-need
    if: needs.determine-build-need.outputs.build-amd64 == 'true' || needs.determine-build-need.outputs.build-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-build-need.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: log in to GHCR + Docker Hub before the buildx bootstrap.
      # Why: setup-buildx pulls moby/buildkit from Docker Hub (#930).
      # From: Issue #1683 | Issue #930
      - name: Log in to GHCR, then Docker Hub for the buildkit bootstrap pull
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # What: build+push the per-arch image, emit its digest.
      # Why: ci.sh owns the tag, labels, retry and readback.
      # From: Issue #1683
      - name: Build and push build-tools image
        id: build
        timeout-minutes: 90
        env:
          BT_PLATFORM: ${{ matrix.platform }}
          BT_SIGNATURE: ${{ needs.determine-build-need.outputs.signature }}
          CI_BUILD_CACHE_FROM: type=gha,scope=build-tools-${{ matrix.arch }}
          CI_BUILD_CACHE_TO: type=gha,scope=build-tools-${{ matrix.arch }},mode=max
        run: |
          digest="$(bash .github/scripts/ci.sh build-tools build "${BT_PLATFORM}" "${BT_SIGNATURE}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test pushed digest
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ needs.determine-build-need.outputs.image }}@${{ steps.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          run-fixtures: "true"

      # What: retry-wrapped Trivy scan of the pushed image.
      # Why: HIGH/CRITICAL must fail a real publish.
      # From: Issue #1535
      - name: Scan pushed image with Trivy
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ needs.determine-build-need.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      - name: Attest build-tools image provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ needs.determine-build-need.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}

  merge-manifests:
    name: assemble multi-arch build-tools manifest
    needs: [determine-build-need, build]
    if: needs.determine-build-need.outputs.build-amd64 == 'true' && needs.determine-build-need.outputs.build-arm64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What: log in to GHCR + Docker Hub before the buildx bootstrap.
      # Why: setup-buildx pulls moby/buildkit from Docker Hub (#930).
      # From: Issue #1683 | Issue #930
      - name: Log in to GHCR, then Docker Hub for the buildkit bootstrap pull
        uses: ./.github/actions/ghcr-then-dockerhub-login
        with:
          ghcr-username: ${{ github.actor }}
          ghcr-password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # What: assemble the multi-arch image via ci.sh.
      # Why: registry assembly logic lives in ci.sh.
      # From: Issue #1683
      - name: Assemble the multi-arch manifest
        run: bash .github/scripts/ci.sh build-tools merge
