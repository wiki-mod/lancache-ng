
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: build, scan, publish the Alpine build-tools image.
# Why: weekly rebuild only on a changed input; NOOP else.
# From: Issue #1683
name: Build Tools Image

# What: weekly input-change check + manual dispatch.
# Why: build-tools is a factory, rebuilt on input change.
# From: Issue #1683
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      arch:
        description: Which architectures to act on.
        type: choice
        options: [both, amd64, arm64]
        default: both
      mode:
        description: check runs the input gate; build forces a rebuild.
        type: choice
        options: [check, build]
        default: check

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-tools-image
  cancel-in-progress: false

env:
  BUILD_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools

jobs:
  determine-build-need:
    name: input-change gate
    runs-on: ubuntu-latest
    outputs:
      build-amd64: ${{ steps.plan.outputs.build-amd64 }}
      build-arm64: ${{ steps.plan.outputs.build-arm64 }}
      matrix: ${{ steps.plan.outputs.matrix }}
      signature: ${{ steps.plan.outputs.signature }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: resolve, decide, emit all outputs.
      # Why: the gate lives in ci.sh; YAML only calls it.
      # From: Issue #1683
      - name: Plan the build-tools refresh
        id: plan
        env:
          BT_ARCH: ${{ github.event.inputs.arch || 'both' }}
          BT_MODE: ${{ github.event.inputs.mode || 'check' }}
        run: bash .github/scripts/ci.sh build-tools plan

  # What: one platform-parameterized build job, not a twin.
  # Why: platform is a matrix parameter; logic exists once.
  # From: Issue #1683
  build:
    name: build ${{ matrix.arch }} build-tools image (native)
    needs: determine-build-need
    if: needs.determine-build-need.outputs.build-amd64 == 'true' || needs.determine-build-need.outputs.build-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-build-need.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          # What: per-arch child tag sha-<full>-<arch>.
          # Why: AG-REL-015 bans the -standalone- form.
          # From: Issue #1683
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-${{ matrix.arch }}

      # What: resolve this platform's build-args via ci.sh.
      # Why: ci.sh owns arch/dhclient resolution, not YAML.
      # From: Issue #1683
      - name: Resolve platform build-args
        id: bargs
        run: bash .github/scripts/ci.sh build-tools build-args-out ${{ matrix.platform }}

      # What: build+push, stamping the signature.
      # Why: the gate reads this label next time.
      # From: Issue #1683
      - name: Build and push build-tools image
        id: build
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.lancache-ng.build-tools.signature=${{ needs.determine-build-need.outputs.signature }}
          build-args: |
            ${{ steps.bargs.outputs.build-args-bare }}
          outputs: type=image,oci-mediatypes=true
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          cache-from: type=gha,scope=build-tools-${{ matrix.arch }}
          cache-to: type=gha,scope=build-tools-${{ matrix.arch }},mode=max

      - name: Smoke-test pushed digest
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          run-fixtures: "true"

      # What: retry-wrapped Trivy scan of the pushed image.
      # Why: HIGH/CRITICAL must fail a real publish.
      # From: Issue #1535
      - name: Scan pushed image with Trivy
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      - name: Attest build-tools image provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

  merge-manifests:
    name: assemble multi-arch build-tools manifest
    needs: [determine-build-need, build]
    if: needs.determine-build-need.outputs.build-amd64 == 'true' && needs.determine-build-need.outputs.build-arm64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: assemble the multi-arch image via ci.sh.
      # Why: registry assembly logic lives in ci.sh.
      # From: Issue #1683
      - name: Assemble the multi-arch manifest
        run: bash .github/scripts/ci.sh build-tools merge
