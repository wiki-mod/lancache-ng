
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: build, scan, publish the Alpine build-tools image.
# Why: weekly rebuild only on a changed input; NOOP else.
# From: Issue #1683
name: Build Tools Image

# What: weekly input-change check + manual dispatch.
# Why: build-tools is a factory, rebuilt on input change.
# From: Issue #1683
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      arch:
        description: Which architectures to act on.
        type: choice
        options: [both, amd64, arm64]
        default: both
      mode:
        description: check runs the input gate; build forces a rebuild.
        type: choice
        options: [check, build]
        default: check

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-tools-image
  cancel-in-progress: false

env:
  BUILD_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools

jobs:
  determine-build-need:
    name: input-change gate
    runs-on: ubuntu-latest
    outputs:
      build-amd64: ${{ steps.decide.outputs.build-amd64 }}
      build-arm64: ${{ steps.decide.outputs.build-arm64 }}
      signature: ${{ steps.current.outputs.signature }}
      build-args-bare: ${{ steps.sot.outputs.bare }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: resolve SOT build-args for the jobs.
      # Why: one owner feeds every consumer; no re-pin.
      # From: Issue #1683
      - name: Resolve build-tools build-args from the version SOT
        id: sot
        run: |
          set -euo pipefail
          {
            echo 'bare<<SOT_ARGS_EOF'
            bash .github/scripts/ci.sh build-args build-tools --bare
            echo 'SOT_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      # What: sign the effective build inputs from ci.sh.
      # Why: rebuilds only when the signature moves.
      # From: Issue #1683
      - name: Compute current build-tools input signature
        id: current
        run: |
          set -euo pipefail
          base="$(bash .github/scripts/ci.sh build-args build-tools --bare \
            | sed -n 's/^ALPINE_IMAGE=//p')"
          [ -n "$base" ] || { echo "::error::No ALPINE_IMAGE from the SOT."; exit 1; }
          packages="$(bash .github/scripts/ci.sh build-tools packages | tr '\n' ' ')"
          versions="$(docker run --rm "$base" sh -c \
            "apk add --no-cache --simulate ${packages} 2>&1 \
              | sed -n 's/^.*Installing \\([^ ]*\\) (\\([^)]*\\)).*/\\1-\\2/p' \
              | LC_ALL=C sort | tr '\\n' ' '")"
          signature="$(bash .github/scripts/ci.sh build-tools signature "$versions")"
          echo "signature=${signature}" >> "$GITHUB_OUTPUT"

      # What: read the published signature label.
      # Why: an unchanged signature means a NOOP rebuild.
      # From: Issue #1683
      - name: Read the published build-tools signature
        id: published
        run: |
          set -euo pipefail
          published=""
          if docker buildx imagetools inspect "${BUILD_TOOLS_IMAGE}:latest" \
              --format '{{json .Image}}' > /tmp/img.json 2>/dev/null; then
            published="$(jq -r '
              [.. | objects | .config?.Labels? // empty
               | ."org.lancache-ng.build-tools.signature" // empty]
              | map(select(. != "")) | first // ""' /tmp/img.json)"
          fi
          echo "signature=${published}" >> "$GITHUB_OUTPUT"

      # What: decide arches from arch + signature.
      # Why: build forces; a changed signature does too.
      # From: Issue #1683
      - name: Decide build need
        id: decide
        env:
          ARCH: ${{ github.event.inputs.arch || 'both' }}
          MODE: ${{ github.event.inputs.mode || 'check' }}
          CURRENT: ${{ steps.current.outputs.signature }}
          PUBLISHED: ${{ steps.published.outputs.signature }}
        run: |
          set -euo pipefail
          [ -n "$CURRENT" ] || { echo "::error::Empty current signature."; exit 1; }
          need=false
          if [ "$MODE" = "build" ] || [ "$CURRENT" != "$PUBLISHED" ]; then
            need=true
          fi
          amd=false
          arm=false
          if [ "$need" = "true" ]; then
            case "$ARCH" in
              amd64) amd=true ;;
              arm64) arm=true ;;
              both)  amd=true; arm=true ;;
              *) echo "::error::Unknown arch '$ARCH'."; exit 1 ;;
            esac
          fi
          echo "build-amd64=${amd}" >> "$GITHUB_OUTPUT"
          echo "build-arm64=${arm}" >> "$GITHUB_OUTPUT"
          printf '::notice::build-tools gate arch=%s mode=%s need=%s amd64=%s arm64=%s\n' \
            "$ARCH" "$MODE" "$need" "$amd" "$arm"

  build-amd64:
    name: build amd64 build-tools image (native)
    needs: determine-build-need
    if: needs.determine-build-need.outputs.build-amd64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-amd64

      - name: Compute immutable pushed source tag
        id: source-tag
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-amd64\n' \
            "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # What: build+push, stamping the signature.
      # Why: the gate reads this label next time.
      # From: Issue #1683
      - name: Build and push amd64 build-tools image
        id: build
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.lancache-ng.build-tools.signature=${{ needs.determine-build-need.outputs.signature }}
          build-args: |
            ${{ needs.determine-build-need.outputs.build-args-bare }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/amd64
          provenance: false
          pull: true
          cache-from: type=gha,scope=build-tools-amd64
          cache-to: type=gha,scope=build-tools-amd64,mode=max

      - name: Smoke-test pushed amd64 digest
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          run-fixtures: "true"

      # What: retry-wrapped Trivy scan of the pushed image.
      # Why: HIGH/CRITICAL must fail a real publish.
      # From: Issue #1535
      - name: Scan pushed amd64 image with Trivy
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      - name: Attest amd64 build-tools image provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

  build-arm64:
    name: build arm64 build-tools image (native)
    needs: determine-build-need
    if: needs.determine-build-need.outputs.build-arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-arm64

      - name: Compute immutable pushed source tag
        id: source-tag
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-arm64\n' \
            "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # What: build+push, stamping the signature.
      # Why: the gate reads this label next time.
      # From: Issue #1683
      - name: Build and push arm64 build-tools image
        id: build
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.lancache-ng.build-tools.signature=${{ needs.determine-build-need.outputs.signature }}
          build-args: |
            ${{ needs.determine-build-need.outputs.build-args-bare }}
          outputs: type=image,oci-mediatypes=true
          platforms: linux/arm64
          provenance: false
          pull: true
          cache-from: type=gha,scope=build-tools-arm64
          cache-to: type=gha,scope=build-tools-arm64,mode=max

      - name: Smoke-test pushed arm64 digest
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          run-fixtures: "true"

      - name: Scan pushed arm64 image with Trivy
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      - name: Attest arm64 build-tools image provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

  merge-manifests:
    name: assemble multi-arch build-tools manifest
    needs: [determine-build-need, build-amd64, build-arm64]
    if: needs.determine-build-need.outputs.build-amd64 == 'true' && needs.determine-build-need.outputs.build-arm64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: merge the two arch digests into one tag.
      # Why: consumers pull one multi-arch image.
      # From: Issue #1683
      - name: Create the multi-arch manifest
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$AMD64_DIGEST" ] && [ -n "$ARM64_DIGEST" ] || {
            echo "::error::A per-arch digest is missing; not merging."
            exit 1
          }
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker buildx imagetools create \
              --tag "${BUILD_TOOLS_IMAGE}:${tag}" \
              "${BUILD_TOOLS_IMAGE}@${AMD64_DIGEST}" \
              "${BUILD_TOOLS_IMAGE}@${ARM64_DIGEST}"
          done
