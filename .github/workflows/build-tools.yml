
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: build, scan, publish the Alpine build-tools image.
# Why: weekly rebuild only on a changed input; NOOP else.
# From: Issue #1683
name: Build Tools Image

# What: weekly input-change check + manual dispatch.
# Why: build-tools is a factory, rebuilt on input change.
# From: Issue #1683
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      arch:
        description: Which architectures to act on.
        type: choice
        options: [both, amd64, arm64]
        default: both
      mode:
        description: check runs the input gate; build forces a rebuild.
        type: choice
        options: [check, build]
        default: check

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-tools-image
  cancel-in-progress: false

env:
  BUILD_TOOLS_IMAGE: ghcr.io/${{ github.repository }}/build-tools

jobs:
  determine-build-need:
    name: input-change gate
    runs-on: ubuntu-latest
    outputs:
      build-amd64: ${{ steps.decide.outputs.build-amd64 }}
      build-arm64: ${{ steps.decide.outputs.build-arm64 }}
      matrix: ${{ steps.decide.outputs.matrix }}
      signature: ${{ steps.current.outputs.signature }}
      build-args-bare: ${{ steps.sot.outputs.bare }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: resolve SOT build-args for the jobs.
      # Why: one owner feeds every consumer; no re-pin.
      # From: Issue #1683
      - name: Resolve build-tools build-args from the version SOT
        id: sot
        run: |
          set -euo pipefail
          {
            echo 'bare<<SOT_ARGS_EOF'
            bash .github/scripts/ci.sh build-args build-tools --bare
            echo 'SOT_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      # What: sign every arch's apk state + the build-args.
      # Why: an arm64-only change must move the signature.
      # From: Issue #1683
      - name: Compute current build-tools input signature
        id: current
        run: |
          set -euo pipefail
          base="$(bash .github/scripts/ci.sh build-args build-tools --bare \
            | sed -n 's/^ALPINE_IMAGE=//p')"
          [ -n "$base" ] || { echo "::error::No ALPINE_IMAGE from the SOT."; exit 1; }
          packages="$(bash .github/scripts/ci.sh build-tools packages | tr '\n' ' ')"
          arches="$(bash .github/scripts/ci.sh build-tools arches)"
          versions=""
          for arch in $arches; do
            av="$(docker run --rm "$base" sh -c "
              sed -i 's|^https://|http://|' /etc/apk/repositories
              apk --arch '$arch' update >/dev/null 2>&1
              apk --arch '$arch' add --no-cache --simulate $packages 2>&1 \
                | sed -n 's/^.*Installing \([^ ]*\) (\([^)]*\)).*/\1-\2/p' \
                | LC_ALL=C sort | tr '\n' ' '")"
            [ -n "$av" ] || { echo "::error::No apk versions resolved for $arch."; exit 1; }
            versions="${versions}${arch}:${av} "
          done
          signature="$(bash .github/scripts/ci.sh build-tools signature "$versions")"
          echo "signature=${signature}" >> "$GITHUB_OUTPUT"

      # What: read the published signature label.
      # Why: an unchanged signature means a NOOP rebuild.
      # From: Issue #1683
      - name: Read the published build-tools signature
        id: published
        run: |
          set -euo pipefail
          published=""
          if docker buildx imagetools inspect "${BUILD_TOOLS_IMAGE}:latest" \
              --format '{{json .Image}}' > /tmp/img.json 2>/dev/null; then
            published="$(jq -r '
              [.. | objects | .config?.Labels? // empty
               | ."org.lancache-ng.build-tools.signature" // empty]
              | map(select(. != "")) | first // ""' /tmp/img.json)"
          fi
          echo "signature=${published}" >> "$GITHUB_OUTPUT"

      # What: decide arches, emit a matrix of only those.
      # Why: build forces; a changed signature does too.
      # From: Issue #1683
      - name: Decide build need
        id: decide
        env:
          ARCH: ${{ github.event.inputs.arch || 'both' }}
          MODE: ${{ github.event.inputs.mode || 'check' }}
          CURRENT: ${{ steps.current.outputs.signature }}
          PUBLISHED: ${{ steps.published.outputs.signature }}
        run: |
          set -euo pipefail
          [ -n "$CURRENT" ] || { echo "::error::Empty current signature."; exit 1; }
          need=false
          if [ "$MODE" = "build" ] || [ "$CURRENT" != "$PUBLISHED" ]; then
            need=true
          fi
          amd=false
          arm=false
          if [ "$need" = "true" ]; then
            case "$ARCH" in
              amd64) amd=true ;;
              arm64) arm=true ;;
              both)  amd=true; arm=true ;;
              *) echo "::error::Unknown arch '$ARCH'."; exit 1 ;;
            esac
          fi
          include='[]'
          if [ "$amd" = "true" ]; then
            include="$(echo "$include" | jq -c '. + [{"arch":"amd64","runner":"ubuntu-latest","platform":"linux/amd64"}]')"
          fi
          if [ "$arm" = "true" ]; then
            include="$(echo "$include" | jq -c '. + [{"arch":"arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]')"
          fi
          {
            echo "build-amd64=${amd}"
            echo "build-arm64=${arm}"
            echo "matrix={\"include\":${include}}"
          } >> "$GITHUB_OUTPUT"
          printf '::notice::gate arch=%s mode=%s need=%s amd64=%s arm64=%s\n' \
            "$ARCH" "$MODE" "$need" "$amd" "$arm"

  # What: one platform-parameterized build job, not a twin.
  # Why: platform is a matrix parameter; logic exists once.
  # From: Issue #1683
  build:
    name: build ${{ matrix.arch }} build-tools image (native)
    needs: determine-build-need
    if: needs.determine-build-need.outputs.build-amd64 == 'true' || needs.determine-build-need.outputs.build-arm64 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-build-need.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BUILD_TOOLS_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long,suffix=-standalone-${{ matrix.arch }}

      - name: Compute immutable pushed source tag
        id: source-tag
        run: |
          set -euo pipefail
          printf 'image=%s:sha-%s-standalone-%s\n' \
            "$BUILD_TOOLS_IMAGE" "$GITHUB_SHA" "${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # What: build+push, stamping the signature.
      # Why: the gate reads this label next time.
      # From: Issue #1683
      - name: Build and push build-tools image
        id: build
        timeout-minutes: 90
        uses: ./.github/actions/ghcr-build-push-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          builder: ${{ steps.buildx.outputs.name }}
          context: tools/build-tools
          push: true
          tags: ${{ steps.source-tag.outputs.image }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.lancache-ng.build-tools.signature=${{ needs.determine-build-need.outputs.signature }}
          build-args: |
            ${{ needs.determine-build-need.outputs.build-args-bare }}
          outputs: type=image,oci-mediatypes=true
          platforms: ${{ matrix.platform }}
          provenance: false
          pull: true
          cache-from: type=gha,scope=build-tools-${{ matrix.arch }}
          cache-to: type=gha,scope=build-tools-${{ matrix.arch }},mode=max

      - name: Smoke-test pushed digest
        uses: ./.github/actions/build-tools-candidate-smoke
        with:
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          run-fixtures: "true"

      # What: retry-wrapped Trivy scan of the pushed image.
      # Why: HIGH/CRITICAL must fail a real publish.
      # From: Issue #1535
      - name: Scan pushed image with Trivy
        timeout-minutes: 50
        uses: ./.github/actions/trivy-scan-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image-ref: ${{ env.BUILD_TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          hide-progress: true
          cache: "false"
          timeout: 10m
          exit-code: "1"

      - name: Attest build-tools image provenance
        uses: ./.github/actions/ghcr-attest-retry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          subject-name: ${{ env.BUILD_TOOLS_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

  merge-manifests:
    name: assemble multi-arch build-tools manifest
    needs: [determine-build-need, build]
    if: needs.determine-build-need.outputs.build-amd64 == 'true' && needs.determine-build-need.outputs.build-arm64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-action-centralized-version
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What: merge the per-arch tags into one image.
      # Why: consumers pull one multi-arch image.
      # From: Issue #1683
      - name: Create the multi-arch manifest
        run: |
          set -euo pipefail
          amd64="${BUILD_TOOLS_IMAGE}:sha-${GITHUB_SHA}-standalone-amd64"
          arm64="${BUILD_TOOLS_IMAGE}:sha-${GITHUB_SHA}-standalone-arm64"
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker buildx imagetools create \
              --tag "${BUILD_TOOLS_IMAGE}:${tag}" \
              "$amd64" "$arm64"
          done
