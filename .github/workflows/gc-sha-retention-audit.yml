
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: read-only GHCR audit for the ordinary sha-* retention policy.
# Why: a dedicated checkout directory and read-only permissions keep PR code
# from ever inheriting the destructive credentials used by the operational
# PR/orphan reaper.
# From: Issue #1095 | PR #1501.
name: SHA Retention Audit

on:
  pull_request:
    branches:
      - current_dev
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/gc-sha-retention-audit.yml
      - release/stack-images.yml
      - docs/release-versioning.md
      - scripts/untracked/select-build-tools-image.sh
      - scripts/untracked/gc-sha-retention-audit.sh
      - scripts/lib/github-api-retry.sh
      - scripts/lib/sha-retention-audit.sh
      - scripts/untracked/validate-stack-images.sh
      - tests/bats/sha_retention_audit.bats
  workflow_dispatch:

permissions: {}

concurrency:
  group: sha-retention-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # What: skips this job for a fork PR instead of running a weaker mode.
    # Why: a fork PR cannot hold repository package-read permissions, so a
    # weaker fallback would look equivalent in the check list while proving
    # nothing.
    # From: Issue #1095 | PR #1501.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, lancache, lancache-light]
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      AUDIT_CHECKOUT: ${{ github.workspace }}/f17-sha-retention-audit

    steps:
      # What: guards then removes the dedicated audit checkout path.
      # Why: the hardcoded expected-path check keeps this rm -rf from ever
      # running against an unexpected value if AUDIT_CHECKOUT is misconfigured.
      # From: Issue #1095 | PR #1501.
      - name: Prepare dedicated audit checkout directory
        run: |
          set -euo pipefail
          expected="${GITHUB_WORKSPACE}/f17-sha-retention-audit"
          if [[ "$AUDIT_CHECKOUT" != "$expected" ]]; then
            echo "::error::Refusing to clean unexpected audit checkout path: $AUDIT_CHECKOUT"
            exit 1
          fi
          rm -rf -- "$AUDIT_CHECKOUT"

      # What: full-history, credential-less checkout into a dedicated subpath.
      # Why: sra_resolve_commit_prefix needs the whole Git history to rank
      # sha-<commit> tags by ancestry; persist-credentials:false keeps this
      # read-only job's checkout free of any push-capable token.
      # From: Issue #1095 | PR #1501.
      - name: Checkout full repository history for read-only audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: f17-sha-retention-audit

      # What: confirms checkout identity, current_dev availability, required
      # files, and no stale skip-worktree entries.
      # Why: a self-hosted runner can reuse a stale/incomplete working
      # directory; this catches that before classification trusts it.
      # From: Issue #1095 | PR #1501.
      - name: Verify isolated checkout identity and completeness
        working-directory: f17-sha-retention-audit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Audit checkout mismatch: expected $EXPECTED_SHA, got $actual_sha"
            exit 1
          fi
          git rev-parse --verify --quiet 'origin/current_dev^{commit}' >/dev/null
          for required in \
            release/stack-images.yml \
            scripts/untracked/select-build-tools-image.sh \
            scripts/untracked/gc-sha-retention-audit.sh \
            scripts/lib/github-api-retry.sh \
            scripts/lib/sha-retention-audit.sh \
            tests/bats/sha_retention_audit.bats; do
            if [[ ! -f "$required" ]]; then
              echo "::error::Required audit file is missing after checkout: $required"
              exit 1
            fi
          done
          index_state="$(git ls-files -v)"
          if grep -q '^S ' <<<"$index_state"; then
            echo "::error::Dedicated audit checkout unexpectedly contains skip-worktree entries."
            exit 1
          fi

      # What: resolves the pinned build-tools image via the shared selector.
      # Why: GHCR_RETRY_USERNAME/PASSWORD authenticate the pull against
      # GHCR's much lower anonymous rate limit under concurrent CI load.
      # From: Issue #1095 | PR #1501.
      - name: Select immutable build-tools image
        id: build_tools
        working-directory: f17-sha-retention-audit
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GHCR_RETRY_USERNAME: ${{ github.actor }}
          GHCR_RETRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(bash scripts/untracked/select-build-tools-image.sh)"
          if [[ -z "$image" ]]; then
            echo "::error::Build-tools selector returned an empty image reference."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # What: runs syntax/lint/unit checks for the audit scripts inside the
      # pinned build-tools container, never on the runner host directly.
      # Why: AG-VAL-016 requires verification through build-tools since host
      # tools are not guaranteed present or current.
      # From: Issue #1095 | PR #1501.
      - name: Validate audit implementation in build-tools
        working-directory: f17-sha-retention-audit
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build_tools.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work:ro" \
            -w /work \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30s 15m bash -lc '
              set -euo pipefail
              bash -n scripts/untracked/gc-sha-retention-audit.sh scripts/lib/github-api-retry.sh scripts/lib/sha-retention-audit.sh scripts/untracked/validate-stack-images.sh
              shellcheck --severity=warning scripts/untracked/gc-sha-retention-audit.sh scripts/lib/github-api-retry.sh scripts/lib/sha-retention-audit.sh scripts/untracked/validate-stack-images.sh tests/bats/sha_retention_audit.bats
              actionlint .github/workflows/gc-sha-retention-audit.yml
              bats tests/bats/sha_retention_audit.bats
              bash scripts/untracked/validate-stack-images.sh
              bash scripts/untracked/check-workflow-line-limit.sh
            '

      # What: exports the runner.temp cache dir via GITHUB_ENV for later steps.
      # Why: runner.temp is valid only in step context, not a job-level env: block.
      # From: Issue #1095 | PR #1501.
      - name: Prepare rate-limit-aware API response cache directory
        env:
          AUDIT_API_CACHE_DIR: ${{ runner.temp }}/f17-sha-retention-api-cache
        run: |
          set -euo pipefail
          mkdir -p -- "$AUDIT_API_CACHE_DIR"
          echo "AUDIT_API_CACHE_DIR=$AUDIT_API_CACHE_DIR" >> "$GITHUB_ENV"

      # What: restores the GHCR API cache via a run-scoped key with prefix fallback.
      # Why: lets a nearby re-run reuse recent pages instead of spending fresh
      # rate-limit budget; the script's own TTL check still gates freshness.
      # From: Issue #1095 | PR #1501.
      - name: Restore GHCR API response cache
        uses: &actions_cache_restore_centraliced_versioning actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AUDIT_API_CACHE_DIR }}
          key: sha-retention-api-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sha-retention-api-cache-

      # What: exports the runner.temp classification-cache dir via GITHUB_ENV.
      # Why: v1.2 point 4 -- same reasoning as the API response
      # cache dir above (runner.temp is step-scoped only).
      # From: Issue #1585.
      - name: Prepare incremental classification cache directory
        env:
          AUDIT_CLASSIFICATION_CACHE_DIR: ${{ runner.temp }}/f17-sha-retention-classification-cache
        run: |
          set -euo pipefail
          mkdir -p -- "$AUDIT_CLASSIFICATION_CACHE_DIR"
          echo "AUDIT_CLASSIFICATION_CACHE_DIR=$AUDIT_CLASSIFICATION_CACHE_DIR" >> "$GITHUB_ENV"

      # What: restores the SQLite classification cache via a run-scoped key
      # with prefix fallback, same rotating-key pattern as the API cache
      # above (cache entries are immutable per key once saved).
      # Why: a cache miss (first run, or no prior save reachable via the
      # prefix) must fall through to a fresh full scan, not fail --
      # sra_cache_init's idempotent CREATE TABLE IF NOT EXISTS is exactly
      # that clean fallback once the audit script runs against an empty dir.
      # From: Issue #1585.
      - name: Restore SHA retention classification cache
        uses: *actions_cache_restore_centraliced_versioning # v6.1.0
        with:
          path: ${{ env.AUDIT_CLASSIFICATION_CACHE_DIR }}
          key: sha-retention-classification-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sha-retention-classification-cache-

      # What: runs the real audit script against live GHCR data, read-only
      # bind mount, with the API response cache and classification cache
      # both mounted read-write.
      # Why: only a live run against real package data (not bats fixtures)
      # proves the classifier's ancestry/tag logic against the real registry.
      # From: Issue #1095 | PR #1501 | Issue #1585.
      - name: Run live protect-only GHCR audit
        working-directory: f17-sha-retention-audit
        env:
          BUILD_TOOLS_IMAGE: ${{ steps.build_tools.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e SRA_HISTORY_REF=origin/current_dev \
            -e GITHUB_API_CACHE_DIR=/cache \
            -e SRA_CACHE_DB=/classification-cache/sha-retention-audit.db \
            -v "$PWD:/work:ro" \
            -v "${AUDIT_API_CACHE_DIR}:/cache:rw" \
            -v "${AUDIT_CLASSIFICATION_CACHE_DIR}:/classification-cache:rw" \
            -w /work \
            "$BUILD_TOOLS_IMAGE" \
            timeout --kill-after=30s 25m bash scripts/untracked/gc-sha-retention-audit.sh

      # What: saves the cache with if: always(), not only on success.
      # Why: a failed/timed-out audit run should still keep whatever pages
      # it fetched before failing, not discard that rate-limit-relevant
      # progress.
      # From: Issue #1095 | PR #1501.
      - name: Save GHCR API response cache
        if: always()
        uses: &actions_cache_save_centraliced_versioning actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AUDIT_API_CACHE_DIR }}
          key: sha-retention-api-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # What: saves the classification cache with if: always(), matching the
      # API cache save's own reasoning above.
      # Why: v1.2 point 4 -- a partial run still resolved a
      # real prefix of this package's versions, worth keeping for next time.
      # From: Issue #1585.
      - name: Save SHA retention classification cache
        if: always()
        uses: *actions_cache_save_centraliced_versioning # v6.1.0
        with:
          path: ${{ env.AUDIT_CLASSIFICATION_CACHE_DIR }}
          key: sha-retention-classification-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # What: removes the dedicated checkout path and verifies it is gone.
      # Why: if: always() so a failed run still frees the runner's disk
      # instead of accumulating stale checkouts across repeated failures.
      # From: Issue #1095 | PR #1501.
      - name: Remove dedicated audit checkout directory
        if: always()
        run: |
          set -euo pipefail
          expected="${GITHUB_WORKSPACE}/f17-sha-retention-audit"
          if [[ "$AUDIT_CHECKOUT" != "$expected" ]]; then
            echo "::error::Refusing to clean unexpected audit checkout path: $AUDIT_CHECKOUT"
            exit 1
          fi
          rm -rf -- "$AUDIT_CHECKOUT"
          if [[ -e "$AUDIT_CHECKOUT" ]]; then
            echo "::error::Dedicated audit checkout directory still exists after cleanup."
            exit 1
          fi
