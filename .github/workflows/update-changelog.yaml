
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: Writes published release notes into CHANGELOG.md
# Why: Completes release automation from release-drafter
name: Update Changelog

on:
  release:
    types: [released]

permissions:
  # What: Grant contents:write to push CHANGELOG commit
  # Why: Workflow floor; job can only narrow, not widen
  contents: write

jobs:
  update:
    name: write release notes into CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      # What: Grant write for push and checkout actions
      # Why: Both actions need write for CHANGELOG commit
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Check out release target branch only
          # Why: Ensure commit lands on correct branch
          ref: ${{ github.event.release.target_commitish }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.event.release.target_commitish }}
          commit_message: "docs: update CHANGELOG.md for ${{ github.event.release.tag_name }}"
          file_pattern: CHANGELOG.md
