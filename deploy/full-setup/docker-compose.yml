
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: deterministic validation harness, no external deps.
# Why: testing harness only; see release-versioning.md for prod.
# From: Issue #498

name: lancache-ng-validation

services:

  # Minimal proxy image for validation
  proxy:
    image: "${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/proxy:${LANCACHE_IMAGE_TAG:-latest}"
    environment:
      - IP_STANDARD=${VALIDATION_PROXY_IP:-172.30.99.2}
      # What: IP_SSL is logical only, never reachable here.
      # Why: prod binds IP_SSL to a real NIC; harness has no equivalent.
      # From: Issue #668 | PR #747
      - IP_SSL=${VALIDATION_PROXY_SSL_IP:-172.30.99.4}
      - SSL_ENABLED=1
      - CACHE_MEM_MB=64
      - CACHE_MAX_SIZE=1g
      - CACHE_INACTIVE=7d
      - CACHE_SLICE_SIZE=8m
      - CACHE_VALID_HIT=365d
      - CACHE_VALID_ANY=1m
    volumes:
      - proxy-cache:/var/cache/nginx/lancache
    networks:
      validation:
        ipv4_address: ${VALIDATION_PROXY_IP:-172.30.99.2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

  # What: socat shim for IP_STANDARD:443 -> proxy:8443 forward.
  # Why: harness lacks per-host-IP publish; DNSs resolved equally.
  # From: Issue #668 | PR #795
  #
  # What: gated to ssl-mitm-proof profile, explicit-service startup.
  # Why: default IP allocation must stay within reserved subnet.
  # From: Issue #668 | PR #795
  standard-passthrough-shim:
    profiles: [ssl-mitm-proof]
    image: mirror.gcr.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command: >-
      sh -c "apk add --no-cache socat >/dev/null && exec socat
      TCP-LISTEN:443,fork,reuseaddr TCP:proxy:8443"
    networks:
      validation:
        ipv4_address: ${VALIDATION_STANDARD_SHIM_IP:-172.30.99.10}
    depends_on:
      - proxy
    # What: restart must be explicit `"no"`, not bare no (parses false).
    # Why: unless-stopped masks age; reboot resets .State.StartedAt.
    # From: PR #1426
    restart: "no"
    healthcheck:
      # What: `nc -z` proves real listener is up (TCP conn).
      # Why: matches nats' healthcheck style; both have busybox nc.
      # From: Issue #668 | PR #795
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # DNS services for validation (both standard and SSL modes)
  dns-standard:
    image: "${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}"
    environment:
      # What: points at standard-passthrough-shim, not proxy directly.
      # Why: makes dns-standard distinct from dns-ssl (were identical).
      # From: Issue #668 | PR #795
      - PROXY_IP=${VALIDATION_STANDARD_SHIM_IP:-172.30.99.10}
      - PDNS_API_KEY=validation-pdns-key
      - DDNS_TSIG_KEY=wENivVTXDsAGvRO2x3p5btaI39VMcyfkxqZmy1MH0LU=
      - NATS_URL=nats://nats:4222
      - NATS_USER=validation-dns-writer
      - NATS_PASSWORD=validation-nats-password
      - NATS_CONSUMER=dns-standard
      - NATS_RECONCILER=1
      - DNS_REPLICATION_ROLE=primary
      - DNS_XFR_NOTIFY_TARGETS=dns-ssl:5300
    volumes:
      # What: shared-secrets volume for PDNS_API_KEY/DDNS_TSIG_KEY.
      # Why: inert here; stack hardcodes consistent PDNS_API_KEY.
      # From: Issue #858 | PR #886
      - shared-secrets:/var/lib/lancache-secrets
      - pdns-data-standard:/var/lib/powerdns
    networks:
      validation:
        ipv4_address: ${VALIDATION_DNS_STANDARD_IP:-172.30.99.3}
    depends_on:
      - nats
    restart: unless-stopped
    healthcheck:
      # What: real query/response probe matching quickstart's check.
      # Why: prior rec_control ping was decoration, forced exit 0 always.
      # From: Issue #869 | PR #876
      test: ["CMD-SHELL", "dig @127.0.0.1 content1.steampowered.com A +short +time=2 +tries=1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

  dns-ssl:
    image: "${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}"
    environment:
      - PROXY_IP=${VALIDATION_PROXY_IP:-172.30.99.2}
      - PDNS_API_KEY=validation-pdns-key
      - DDNS_TSIG_KEY=wENivVTXDsAGvRO2x3p5btaI39VMcyfkxqZmy1MH0LU=
      - NATS_URL=nats://nats:4222
      - NATS_USER=validation-dns-replica
      - NATS_PASSWORD=validation-nats-password
      - NATS_CONSUMER=dns-ssl
      - NATS_RECORD_WRITES=0
      - DNS_REPLICATION_ROLE=secondary
      - DNS_XFR_PRIMARY=dns-standard:5300
    volumes:
      # What: shared-secrets volume for PDNS_API_KEY/DDNS_TSIG_KEY.
      # Why: inert here; stack hardcodes consistent PDNS_API_KEY.
      # From: Issue #858 | PR #886
      - shared-secrets:/var/lib/lancache-secrets
      - pdns-data-ssl:/var/lib/powerdns
    networks:
      validation:
        ipv4_address: ${VALIDATION_DNS_SSL_IP:-172.30.99.5}
    depends_on:
      - nats
    restart: unless-stopped
    healthcheck:
      # What: real query/response probe matching quickstart's check.
      # Why: prior rec_control ping was decoration, forced exit 0 always.
      # From: Issue #869 | PR #876
      test: ["CMD-SHELL", "dig @127.0.0.1 content1.steampowered.com A +short +time=2 +tries=1 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

  # Socket proxy for watchdog health monitoring
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      POST: "1"
      EXEC: "1"
    networks:
      - validation-api
    restart: unless-stopped
    healthcheck:
      # What: HTTP probe against Docker API /_ping via wget.
      # Why: proves proxy forwards to real socket; Alpine lacks curl.
      # From: Issue #1169 | PR #1249
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Watchdog for health monitoring
  watchdog:
    image: "${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/watchdog:${LANCACHE_IMAGE_TAG:-latest}"
    volumes:
      # What: cache mount is read-only (purge moved to retention).
      # Why: watchdog only reads; see deploy/prod's identical mount.
      # From: Issue #842 | PR #1360
      - proxy-cache:/var/cache/lancache:ro
      # What: shared with `ui` below (read-only).
      # Why: shares status.json hand-off used by dev/prod/quickstart.
      # From: Issue #870 | PR #1165
      - watchdog-status:/var/run/watchdog
    # What: `service_started`, not `service_healthy`.
    # Why: watchdog monitoring must survive degraded/slow Docker API.
    # From: PR #1489
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks:
      validation:
        ipv4_address: ${VALIDATION_WATCHDOG_IP:-172.30.99.6}
      validation-api:
    restart: unless-stopped
    healthcheck:
      # What: freshness-based (mtime) check, not just file existence.
      # Why: stalled loop leaves stale status.json appearing healthy.
      # From: PR #885
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 15s

  # What: file-retention daemon with fail-closed prune logic.
  # Why: no syslog-ng/fluent-bit here; prune functions no-op safely.
  # From: Issue #842 | PR #1360
  retention:
    image: "${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/watchdog:${LANCACHE_IMAGE_TAG:-latest}"
    entrypoint: ["/retention-entrypoint.sh"]
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - proxy-cache:/var/cache/lancache
      - retention-state:/var/lib/lancache-retention-state
    restart: unless-stopped

  # What: NATS with no container_name; credentials are baked literals.
  # Why: isolated -p CI instances share runner; fixed name collides.
  # From: Issue #583 | PR #621
  #
  # What: prebakes nats.conf and auth_callout.conf pair.
  # Why: UI restart-to-apply no-ops; entrypoint must be fully ready.
  # From: Issue #811 | PR #817
  nats:
    image: nats:2-alpine@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/nats
        cat > /etc/nats/nats.conf <<'EOF'
        jetstream {
          store_dir: /data
        }
        # What: HTTP monitor endpoint for nats-server.
        # Why: without this, nats-server lacks HTTP monitor entirely.
        # From: PR #828
        http_port: 8222
        authorization {
          users = [
            {
              user: validation-ui
              password: validation-ui-password
              permissions = {
                publish = ["lancache.dns.record", "lancache.dns.flush"]
              }
            }
            {
              user: validation-dns-writer
              password: validation-nats-password
              permissions = {
                subscribe = ["lancache.dns.>", "_INBOX.>"]
              }
            }
            {
              user: validation-dns-replica
              password: validation-nats-password
              permissions = {
                subscribe = ["lancache.dns.>", "_INBOX.>"]
              }
            }
            {
              user: validation-nats-callout
              password: validation-nats-callout-password
            }
          ]
          # What: loads the auth_callout {} stanza from a separate fragment.
          # Why: missing include is a fatal boot error; mirrors dev/prod.
          # From: Issue #811 | PR #817
          include "auth_callout.conf"
        }
        # What: minimal system account, additive alongside `authorization`.
        # Why: nats_kick.rs needs $$SYS.REQ.SERVER.* to force-disconnect.
        # From: Issue #681 | PR #1172
        accounts {
          SYS: {
            users: [
              { user: validation-nats-sys, password: validation-nats-sys-password }
            ]
          }
        }
        system_account: SYS
        EOF
        cat > /etc/nats/auth_callout.conf <<'EOF'
        auth_callout {
          # What: public half of ui's fixed NATS_ISSUER_SEED.
          # Why: UI restart-to-apply no-ops; prebaked serves simulation.
          # From: Issue #583 | PR #621
          issuer: "AAMEAN73N2SJ4YIEL5PJW3JLQHXNWEFTNOI2THICSHILKYUGVAQJMAA6"
          # What: public half of ui's fixed NATS_XKEY_SEED.
          # Why: same restart-no-op as issuer; xkey path untested without.
          # From: Issue #682 | PR #1168
          xkey: "XD2QB5UPSAVJTWTFAHROYX2PBK2JKJKJDZARP3SRYKHGU2R46FUV2BTY"
          # What: all static nats.conf users are listed here.
          # Why: auth_callout server-wide; omitting user causes fallthrough.
          # From: Issue #681 | PR #1172
          auth_users: ["validation-ui", "validation-dns-writer", "validation-dns-replica", "validation-nats-callout", "validation-nats-sys"]
        }
        EOF
        exec nats-server -c /etc/nats/nats.conf
    volumes:
      - nats-data:/data
      - nats-conf:/etc/nats
    networks:
      validation:
        ipv4_address: ${VALIDATION_NATS_IP:-172.30.99.8}
    restart: unless-stopped
    healthcheck:
      # What: HTTP probe to monitor endpoint via wget (not bare TCP).
      # Why: proves HTTP monitor answering; Alpine has wget/nc, no curl.
      # From: PR #828
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

  # Admin UI for stack control and status
  ui:
    image: "${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}"
    volumes:
      # What: UI entrypoint resolves PDNS_API_KEY from this volume.
      # Why: inert here; stack hardcodes consistent PDNS_API_KEY.
      # From: Issue #858 | PR #886
      - shared-secrets:/var/lib/lancache-secrets
      - nats-conf:/etc/nats
      # What: read-only reader for watchdog's status.json.
      # Why: renders dashboard health card; see watchdog/dev/prod mount.
      # From: Issue #870 | PR #1165
      - watchdog-status:/var/run/watchdog:ro
    ports:
      - "127.0.0.1:${VALIDATION_UI_PORT:-9090}:8080"
    environment:
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      - DNS_STANDARD_SERVICE=dns-standard
      - DNS_SSL_SERVICE=dns-ssl
      - PROXY_SERVICE=proxy
      - SSL_ENABLED=1
      - PROXY_STANDARD_URL=http://proxy
      - PROXY_SSL_URL=http://proxy
      - PROXY_SSL_SERVICE=proxy
      - STANDARD_LOG=/var/log/nginx/access.log
      - SSL_LOG=/var/log/nginx/access.log
      - CACHE_DIR=/var/cache/proxy
      - CACHE_MAX_GB=1
      - STANDARD_IP=${VALIDATION_PROXY_IP:-172.30.99.2}
      - SSL_IP=${VALIDATION_PROXY_SSL_IP:-172.30.99.4}
      - LANCACHE_IMAGE_REGISTRY=${LANCACHE_IMAGE_REGISTRY:-ghcr.io}
      - LANCACHE_IMAGE_PREFIX=${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}
      - LANCACHE_IMAGE_CHANNEL=${LANCACHE_IMAGE_CHANNEL:-}
      - LANCACHE_IMAGE_TAG=${LANCACHE_IMAGE_TAG:-latest}
      - UI_AUTH_USER=
      - UI_AUTH_PASSWORD=
      - ALLOW_INSECURE_UI=true
      - DHCP_MODE=disabled
      - PDNS_AUTH_URL=http://dns-standard:8081
      - PDNS_REC_URL=http://dns-standard:8082
      - PDNS_API_KEY=validation-pdns-key
      # What: must match the netdata service's own NETDATA_ALARM_TOKEN.
      # Why: see routes/netdata_alarms.rs for what this token gates.
      # From: Issue #849 | PR #1444
      - NETDATA_ALARM_TOKEN=validation-netdata-alarm-token
      - NATS_URL=nats://nats:4222
      # What: sets NATS_ADVERTISE_URL instead of bare-NATS_URL fallback.
      # Why: register_secondary needs NATS_BIND_IP or this (else 503).
      # From: Issue #866 | PR #881
      - NATS_ADVERTISE_URL=nats://nats:4222
      - NATS_UI_USER=validation-ui
      - NATS_UI_PASSWORD=validation-ui-password
      - NATS_DNS_WRITER_USER=validation-dns-writer
      - NATS_DNS_WRITER_PASSWORD=validation-nats-password
      - NATS_DNS_REPLICA_USER=validation-dns-replica
      - NATS_DNS_REPLICA_PASSWORD=validation-nats-password
      - NATS_CALLOUT_USER=validation-nats-callout
      - NATS_CALLOUT_PASSWORD=validation-nats-callout-password
      # What: must match the nats service's prebaked SYS account user.
      # Why: lets nats_kick.rs (CONNZ/KICK) find a rotated secondary.
      # From: Issue #681 | PR #1172
      - NATS_SYS_USER=validation-nats-sys
      - NATS_SYS_PASSWORD=validation-nats-sys-password
      # What: seed baked so public half preloads into nats' bootstrap.
      # Why: no persistent /data volume; no fixed name to restart-by.
      # From: Issue #583 | PR #621
      - NATS_ISSUER_SEED=SAAIHYJ2XBQO3QSKX3V5MS4JH25WGTXEFOOXEZ5EXSGDGWOGCMCVWHWTYY
      # What: same fixed-seed pattern as above, for xkey encryption pair.
      # Why: no persistent /data volume; xkey would differ every run.
      # From: Issue #682 | PR #1168
      - NATS_XKEY_SEED=SXADCNQXCKZPJEX3EBNKYHKTD2WGVLHBN6YZYP42MCR6IKRRMYS56WQILQ
      - SECONDARY_REGISTRATION_TOKEN=validation-secondary-registration-token
    networks:
      validation:
        ipv4_address: ${VALIDATION_UI_IP:-172.30.99.9}
      validation-api:
    # What: `service_started` not `service_healthy` (all three deps).
    # Why: dashboard must start when proxy is unhealthy.
    # From: PR #1489
    depends_on:
      docker-socket-proxy:
        condition: service_started
      proxy:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

  # System metrics backend
  netdata:
    image: netdata/netdata@sha256:a130dbbf3d6e6a5472efdebaa123797190a5822627e908106d34edae02bc8a74
    hostname: lancache-netdata-validation
    # What: `pid: host`, matching deploy/prod and deploy/quickstart.
    # Why: netdata requires it for apps.plugin to read container /proc.
    # From: PR #1125
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    # What: Netdata alarm -> UI forwarding wired into this profile.
    # Why: hardcodes token; no dynamic-secret path like prod uses.
    # From: Issue #849 | PR #1444
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        set -e
        printf '%s' "$$NETDATA_ALARM_TOKEN" > /etc/netdata/.netdata-alarm-token
        chmod 0600 /etc/netdata/.netdata-alarm-token
        # What: chowns the token file to netdata:netdata.
        # Why: netdata runs uid 201; without this, alarms auth fails.
        # From: PR #1444
        chown netdata:netdata /etc/netdata/.netdata-alarm-token
        cat > /etc/netdata/health_alarm_notify.conf <<'ALARMCONF'
        # shellcheck disable=SC2154
        # What: name/chart/host/etc. below are unassigned in this fragment.
        # Why: populated by Netdata before sourcing; see prod's heredoc.
        # From: PR #1444
        # shellcheck disable=SC2034
        # What: SEND_CUSTOM/DEFAULT_RECIPIENT_CUSTOM appear unused here.
        # Why: read by Netdata's alarm-notify.sh AFTER sourcing this file.
        # From: PR #1444
        SEND_CUSTOM="YES"
        DEFAULT_RECIPIENT_CUSTOM="lancache-ui"
        _lancache_json_escape() {
          printf '%s' "$$1" | tr -d '\n' | sed 's/\\/\\\\/g; s/"/\\"/g'
        }
        custom_sender() {
          local token
          token="$$(cat /etc/netdata/.netdata-alarm-token 2>/dev/null)"
          docurl -s --max-time 15 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Netdata-Alarm-Token: $${token}" \
            -d "{\"unique_id\":$${unique_id},\"alarm_id\":$${alarm_id},\"event_id\":$${event_id},\"when\":$${when},\"name\":\"$$(_lancache_json_escape "$${name}")\",\"chart\":\"$$(_lancache_json_escape "$${chart}")\",\"host\":\"$$(_lancache_json_escape "$${host}")\",\"status\":\"$$(_lancache_json_escape "$${status}")\",\"old_status\":\"$$(_lancache_json_escape "$${old_status}")\",\"value_string\":\"$$(_lancache_json_escape "$${value_string}")\",\"units\":\"$$(_lancache_json_escape "$${units}")\",\"info\":\"$$(_lancache_json_escape "$${info}")\",\"duration\":$${duration}}" \
            "http://ui:8080/api/netdata-alarms" >/dev/null 2>&1
        }
        ALARMCONF
        exec /usr/sbin/run.sh
    environment:
      # What: fixed literal like all harness credentials.
      # Why: profile hardcodes; prod/quickstart use shared-secrets.
      # From: Issue #849 | PR #1444
      - NETDATA_ALARM_TOKEN=validation-netdata-alarm-token
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      validation:
        ipv4_address: ${VALIDATION_NETDATA_IP:-172.30.99.7}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19999/api/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

networks:
  validation:
    driver: bridge
    ipam:
      driver: default
      config:
        # What: fallback keeps same IPs, CIDR /24 -> /27.
        # Why: other defaults unchanged; uses reserve-validation-subnet.sh.
        # From: Issue #832 | PR #884
        - subnet: ${VALIDATION_SUBNET:-172.30.99.0/27}
          gateway: ${VALIDATION_GATEWAY:-172.30.99.1}
  validation-api:
    internal: true

volumes:
  # What: shared handshake secrets mounted for secret agreement.
  # Why: inert (hardcoded); for parity with dev/prod/quickstart.
  # From: Issue #858 | PR #886
  shared-secrets:
  proxy-cache:
  pdns-data-standard:
  pdns-data-ssl:
  nats-data:
  nats-conf:
  netdataconfig:
  netdatalib:
  netdatacache:
  # What: shared by watchdog (writer) and ui (reader) for same mount.
  # Why: previously watchdog wrote to own unshared filesystem.
  # From: Issue #870 | PR #1165
  watchdog-status:
  # What: retention.sh's own PURGE_STAMP/SYSLOG_PRUNE_STAMP volume.
  # Why: separate from watchdog-status; see retention: comment.
  # From: Issue #842 | PR #1360
  retention-state:
