
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# What: remote secondary DNS node; setup.sh secondary owns it.
# Why: --rotate rewrites this file; local edits are lost.
# From: Issue #1683

services:
  # What: the primary's dns image as a read-only replica.
  # Why: zones come by AXFR; NATS only flushes the cache.
  # From: Issue #1683
  dns:
    container_name: LanCache-NG-dns
    image: ${LANCACHE_IMAGE_REF_DNS:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}}
    environment:
      - PROXY_IP=${PROXY_IP:?PROXY_IP is required}
      - PDNS_API_KEY=${PDNS_API_KEY}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - DDNS_ALLOW_FROM=127.0.0.1
      - DNS_REPLICATION_ROLE=secondary
      - DNS_XFR_PRIMARY=${DNS_XFR_PRIMARY:?DNS_XFR_PRIMARY is required}
      - NATS_URL=${NATS_URL:?NATS_URL is required}
      - NATS_USER=${NATS_USER:?NATS_USER is required}
      - NATS_PASSWORD=${NATS_PASSWORD}
      - NATS_CONSUMER=${NATS_CONSUMER:?NATS_CONSUMER is required}
      - NATS_RECORD_WRITES=0
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
    volumes:
      - pdns-data:/var/lib/powerdns
      - pdns-filter-state:/var/lib/powerdns-state
      - dns-config-snapshots:/var/lib/lancache-dns
    # What: dns-http only; a secondary has one LAN IP.
    # Why: LISTEN_IP is the address setup.sh registered.
    # From: Issue #1683
    ports:
      - "${LISTEN_IP:?LISTEN_IP is required}:53:53/udp"
      - "${LISTEN_IP:?LISTEN_IP is required}:53:53/tcp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    # What: Docker's local driver; it rotates by itself.
    # Why: no services container, so no syslog-ng here.
    # From: Issue #1683
    logging:
      driver: local

volumes:
  pdns-data:
  pdns-filter-state:
  dns-config-snapshots:
