
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: secondary DNS node; setup.sh secondary writes it.
# Why: --rotate rewrites this file; local edits are lost.
# From: Issue #1683 | PR #1912

services:
  # What: the primary's dns image as a read-only replica.
  # Why: zones come by AXFR; NATS only flushes the cache.
  # From: Issue #1683
  dns:
    container_name: ${SOT_CONTAINER_NAME_DNS}
    image: ${LANCACHE_IMAGE_REF_DNS:?LANCACHE_IMAGE_REF_DNS is required}
    init: true
    environment:
      - IP_HTTP=${IP_HTTP:?IP_HTTP is required}
      - IP_HTTPS=${IP_HTTPS:-}
      - PDNS_API_KEY=${PDNS_API_KEY}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - DNS_REPLICATION_ROLE=${SOT_DNS_REPLICATION_ROLE_SECONDARY}
      - DNS_XFR_PRIMARY=${DNS_XFR_PRIMARY:?DNS_XFR_PRIMARY is required}
      # What: a replica keeps its secrets in its own volume.
      # Why: no shared-secrets volume, no ui; runs as root.
      # From: Issue #1683 | PR #1912
      - LANCACHE_SHARED_SECRET_DIR=${SOT_DNS_SNAPSHOT_MOUNT}/${SOT_SECONDARY_SECRETS_SUBDIR}
      - LANCACHE_RUNTIME_GID=${SOT_SECONDARY_RUNTIME_GID}
      - NATS_URL=${NATS_URL:?NATS_URL is required}
      - NATS_USER=${NATS_USER:?NATS_USER is required}
      - NATS_PASSWORD=${NATS_PASSWORD}
      - NATS_CONSUMER=${NATS_CONSUMER:?NATS_CONSUMER is required}
      - NATS_RECORD_WRITES=0
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-}
    volumes:
      - pdns-data:${SOT_PDNS_DATA_DIR}
      - pdns-filter-state:${SOT_DNS_STATE_DIR}
      - dns-config-snapshots:${SOT_DNS_SNAPSHOT_MOUNT}
    tmpfs:
      - ${SOT_SUPERVISE_RUN_DIR}
    # What: dns-https binds its own IP and host port.
    # Why: setup.sh writes both; compose derives none.
    # From: Issue #1683 | PR #1912
    ports:
      - "${LISTEN_IP:?LISTEN_IP is required}:${SOT_DNS_PORT}:${SOT_DNS_PORT}/udp"
      - "${LISTEN_IP:?LISTEN_IP is required}:${SOT_DNS_PORT}:${SOT_DNS_PORT}/tcp"
      - "${LISTEN_IP_HTTPS:?LISTEN_IP_HTTPS is required}:${DNS_HTTPS_HOST_PORT}:${SOT_DNS_HTTPS_PORT}/udp"
      - "${LISTEN_IP_HTTPS:?LISTEN_IP_HTTPS is required}:${DNS_HTTPS_HOST_PORT}:${SOT_DNS_HTTPS_PORT}/tcp"
    healthcheck:
      test: ["CMD", "lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    # What: Docker's local driver; it rotates by itself.
    # Why: no services container, so no syslog-ng here.
    # From: Issue #1683
    logging:
      driver: local

volumes:
  pdns-data:
  pdns-filter-state:
  dns-config-snapshots:
