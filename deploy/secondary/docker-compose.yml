
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
# What: secondary DNS node; setup.sh secondary writes it.
# Why: --rotate rewrites this file; local edits are lost.
# From: Issue #1683 | PR #1912

services:
  # What: the primary's dns image as a read-only replica.
  # Why: zones come by NOTIFY and AXFR from the primary.
  # From: Issue #1683
  dns:
    # What: /run as tmpfs for OpenRC.
    # Why: OpenRC mounts /run itself; Docker denies it.
    # From: Issue #1683 | PR #1980
    tmpfs:
      - ${SOT_RUN_DIR}
    container_name: ${SOT_CONTAINER_NAME_DNS}
    image: ${LANCACHE_IMAGE_REF_DNS:?LANCACHE_IMAGE_REF_DNS is required}
    environment: &dns-env
      - IP_HTTP=${IP_HTTP:?IP_HTTP is required}
      - IP_HTTPS=${IP_HTTPS:-}
      - PDNS_API_KEY=${PDNS_API_KEY}
      # What: the primary's TSIG key; no generated fallback.
      # Why: a generated key fails AXFR from the primary
      # From: Issue #1683 | PR #1858
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY:?DDNS_TSIG_KEY is required}
      - DNS_REPLICATION_ROLE=${SOT_DNS_REPLICATION_ROLE_SECONDARY}
      - DNS_XFR_PRIMARY=${DNS_XFR_PRIMARY:?DNS_XFR_PRIMARY is required}
      # What: a replica keeps its secrets in its own volume.
      # Why: no shared-secrets volume, no ui; runs as root.
      # From: Issue #1683 | PR #1912
      - LANCACHE_SHARED_SECRET_DIR=${SOT_SECONDARY_SHARED_SECRET_DIR}
      - LANCACHE_RUNTIME_GID=${SOT_SECONDARY_RUNTIME_GID}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-}
      # What: optional upstream resolver; empty = SOT.
      # Why: the own listen IPs feed the loop check.
      # From: Issue #1918 | PR #1858
      - DNS_UPSTREAM_SERVERS=${DNS_UPSTREAM_SERVERS:-}
      - DNS_UPSTREAM_ZONES=${DNS_UPSTREAM_ZONES:-}
      - DNS_UPSTREAM_UNSIGNED_ZONES=${DNS_UPSTREAM_UNSIGNED_ZONES:-}
      # What: the reverse zone switch; same as the primary.
      # Why: the replica takes the primary's zones.
      # From: Issue #1918 | PR #1858
      - DNS_LOCAL_REVERSE_ZONES=${DNS_LOCAL_REVERSE_ZONES:-}
      - LISTEN_IP=${LISTEN_IP:?LISTEN_IP is required}
      - LISTEN_IP_HTTPS=${LISTEN_IP_HTTPS:?LISTEN_IP_HTTPS is required}
    volumes:
      - pdns-data:${SOT_PDNS_DATA_DIR}
      - pdns-filter-state:${SOT_DNS_STATE_DIR}
      - dns-config-snapshots:${SOT_DNS_SNAPSHOT_MOUNT}
      - ./cdn-domains.txt:${SOT_CDN_DOMAINS_FILE}
      # What: the recursor Lua script setup.sh copies here.
      # Why: a runtime file, not in the image.
      # From: Issue #1683 | PR #1858
      - ./filter-aaaa.lua:${SOT_PDNS_LUA_DNS_SCRIPT}:ro
      # What: dns configs the render step wrote.
      # Why: one owner writes; the dns only reads.
      # From: Issue #1683 | PR #1980
      - lancache-config:${SOT_CONFIG_DIR}:ro
    # What: dns-https binds its own IP and host port.
    # Why: setup.sh writes both; compose derives none.
    # From: Issue #1683 | PR #1912
    ports:
      - "${LISTEN_IP:?LISTEN_IP is required}:${SOT_DNS_PORT}:${SOT_DNS_PORT}/udp"
      - "${LISTEN_IP:?LISTEN_IP is required}:${SOT_DNS_PORT}:${SOT_DNS_PORT}/tcp"
      - "${LISTEN_IP_HTTPS:?LISTEN_IP_HTTPS is required}:${DNS_HTTPS_HOST_PORT}:${SOT_DNS_HTTPS_PORT}/udp"
      - "${LISTEN_IP_HTTPS:?LISTEN_IP_HTTPS is required}:${DNS_HTTPS_HOST_PORT}:${SOT_DNS_HTTPS_PORT}/tcp"
    # What: a real DNS query; any reply counts.
    # Why: a dead upstream must not restart the dns.
    # From: Issue #1683 | PR #1980
    healthcheck:
      test: ["CMD-SHELL", "dig +time=2 +tries=1 -p ${SOT_DNS_PORT} @${SOT_LOOPBACK_BIND_IP} ${SOT_SETUP_DNS_PROBE_NAME} >/dev/null"]
      interval: ${SOT_HEALTHCHECK_INTERVAL:?SOT_HEALTHCHECK_INTERVAL is required}
      timeout: ${SOT_HEALTHCHECK_TIMEOUT:?SOT_HEALTHCHECK_TIMEOUT is required}
      retries: ${SOT_HEALTHCHECK_RETRIES:?SOT_HEALTHCHECK_RETRIES is required}
      start_period: ${SOT_HEALTHCHECK_START_PERIOD:?SOT_HEALTHCHECK_START_PERIOD is required}
    restart: always
    # What: start only after the configs are written.
    # Why: the dns programs read them at start.
    # From: Issue #1683 | PR #1980
    depends_on:
      render:
        condition: service_completed_successfully
    # What: Docker's local driver; it rotates by itself.
    # Why: no services container, so no syslog-ng here.
    # From: Issue #1683
    logging:
      driver: local

  # What: one-shot ui run that writes the dns configs.
  # Why: a secondary has no ui server; same renderer.
  # From: Issue #1683 | PR #1980
  render:
    image: ${LANCACHE_IMAGE_REF_UI:?LANCACHE_IMAGE_REF_UI is required}
    command: ["render-dns"]
    environment: *dns-env
    volumes:
      - lancache-config:${SOT_CONFIG_DIR}
      - ./cdn-domains.txt:${SOT_CDN_DOMAINS_FILE}:ro
    restart: "no"
    # What: no probe; the run ends after one write.
    # Why: dns waits for its exit code instead.
    # From: Issue #1683 | PR #1980
    healthcheck:
      disable: true
    logging:
      driver: local

volumes:
  lancache-config:
  pdns-data:
  pdns-filter-state:
  dns-config-snapshots:
