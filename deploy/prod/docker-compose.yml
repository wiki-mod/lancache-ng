
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
name: lancache-ng

# What: Docker syslog driver into syslog-ng in services.
# Why: UDP never blocks a container start without receiver.
# From: Issue #1683
x-logging: &logging
  driver: syslog
  options:
    syslog-address: "udp://127.0.0.1:${LANCACHE_LOG_PORT:?LANCACHE_LOG_PORT is required}"
    syslog-format: rfc5424
    tag: "{{.Name}}"

services:
  # What: watchdog, syslog-ng, chronyd, netdata, retention.
  # Why: one container for every stack-wide support task.
  # From: Issue #1683
  services:
    container_name: LanCache-NG-services
    image: ${LANCACHE_IMAGE_REF_SERVICES:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/services:${LANCACHE_IMAGE_TAG:-latest}}
    # What: tini as PID 1 reaps the supervisor's children.
    # Why: lancache-watchdog supervise is no init process.
    # From: Issue #1683
    init: true
    environment:
      # What: operator values from the one .env file.
      # Why: no config/prod defaults; .env is the one owner.
      # From: Issue #1683
      - LANCACHE_LOG_PORT=${LANCACHE_LOG_PORT:?LANCACHE_LOG_PORT is required}
      - NTP_ENABLED=${NTP_ENABLED:-0}
      - NTP_UPSTREAM_SERVERS=${NTP_UPSTREAM_SERVERS:?NTP_UPSTREAM_SERVERS is required}
      - NTP_ALLOWED_CLIENT_CIDRS=${NTP_ALLOWED_CLIENT_CIDRS:-}
      - SYSLOG_MAX_GB=${SYSLOG_MAX_GB:?SYSLOG_MAX_GB is required}
      - SYSLOG_RETENTION_DAYS=${SYSLOG_RETENTION_DAYS:?SYSLOG_RETENTION_DAYS is required}
      - SYSLOG_PRUNE_RETRY_COOLDOWN=${SYSLOG_PRUNE_RETRY_COOLDOWN:?SYSLOG_PRUNE_RETRY_COOLDOWN is required}
      - CACHE_VALID_DAYS=${CACHE_VALID_DAYS:?CACHE_VALID_DAYS is required}
      - CHECK_INTERVAL=${CHECK_INTERVAL:?CHECK_INTERVAL is required}
      - RESTART_AFTER=${RESTART_AFTER:?RESTART_AFTER is required}
      - DISK_WARN_PCT=${DISK_WARN_PCT:?DISK_WARN_PCT is required}
      - DISK_ALARM_PCT=${DISK_ALARM_PCT:?DISK_ALARM_PCT is required}
      - DOCKER_API_TIMEOUT=${DOCKER_API_TIMEOUT:?DOCKER_API_TIMEOUT is required}
      - DOCKER_RESTART_TIMEOUT=${DOCKER_RESTART_TIMEOUT:?DOCKER_RESTART_TIMEOUT is required}
      - NETDATA_ALARM_TOKEN=${NETDATA_ALARM_TOKEN}
      - CACHEHAMSTER_CREDENTIAL_PERSISTENCE=${CACHEHAMSTER_CREDENTIAL_PERSISTENCE:-}
      - CACHEHAMSTER_STEAM_CREDENTIAL=${CACHEHAMSTER_STEAM_CREDENTIAL:-}
      - CACHEHAMSTER_URLS=${CACHEHAMSTER_URLS:-}
      - CACHEHAMSTER_CONCURRENCY=${CACHEHAMSTER_CONCURRENCY:?CACHEHAMSTER_CONCURRENCY is required}
      # What: paths inside the mounts listed below.
      # Why: the mount and its path have one owner here.
      # From: Issue #1683
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SUPERVISE_RUN_DIR=/run/lancache
      - STATUS_FILE=/var/run/watchdog/status.json
      - DESIRED_STATE_FILE=/data/desired-state.json
      - UI_SETTINGS_FILE=/data/lancache-ui-settings.env
      - CACHE_DIR=/var/cache/lancache
      - CACHE_DIR_ALLOWED_PREFIX=/var/cache
      - SYSLOG_LOG_ROOT=/var/log/lancache-syslog-ng
      - SYSLOG_LOG_ROOT_ALLOWED_PREFIX=/var/log
      - PURGE_STAMP=/var/lib/lancache-retention-state/purge.stamp
      - SYSLOG_PRUNE_STAMP=/var/lib/lancache-retention-state/syslog-prune.stamp
      - NTP_DRIFT_FILE=/var/lib/chrony/drift
      - CACHEHAMSTER_DATA_DIR=/var/lib/lancache-cachehamster
      - LANCACHE_SHARED_SECRET_DIR=/var/lib/lancache-secrets
      - LANCACHE_SHARED_SECRET_GID=10001
      - NETDATA_CONFIG_DIR=/etc/netdata
      - NETDATA_WEB_LOG=/var/log/nginx/access.log
      - NETDATA_ALARM_UI_URL=http://ui:8080
    # What: rendered syslog-ng, chrony and status files.
    # Why: each start renders fresh; nothing survives.
    # From: Issue #1683
    tmpfs:
      - /run/lancache
    # What: the log input on loopback; NTP for the LAN.
    # Why: only the local Docker daemon may send log lines.
    # From: Issue #1683
    ports:
      - "127.0.0.1:${LANCACHE_LOG_PORT}:${LANCACHE_LOG_PORT}/udp"
      - "123:123/udp"
    volumes:
      # What: the Docker API for the watchdog process only.
      # Why: no socket proxy; the supervisor drops the rest.
      # From: Issue #1683
      - /var/run/docker.sock:/var/run/docker.sock
      - shared-secrets:/var/lib/lancache-secrets
      - ui-data:/data:ro
      - watchdog-status:/var/run/watchdog
      - proxy-cache:/var/cache/lancache
      - proxy-logs:/var/log/nginx
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:/var/log/lancache-syslog-ng
      - retention-state:/var/lib/lancache-retention-state
      - ${NTP_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/ntp}:/var/lib/chrony
      - ${CACHEHAMSTER_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/cachehamster}:/var/lib/lancache-cachehamster
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    cap_drop:
      - ALL
    # What: capabilities the supervised processes need.
    # Why: each child runs under its own uid with less.
    # From: Issue #1683
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_BIND_SERVICE
      - SYS_TIME
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: nginx cache; standard and SSL mode in one.
  # Why: :8443 passes SNI through, :443 intercepts TLS.
  proxy:
    container_name: LanCache-NG-proxy
    image: ${LANCACHE_IMAGE_REF_PROXY:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/proxy:${LANCACHE_IMAGE_TAG:-latest}}
    init: true
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:?KEEP_KNOWN_GOOD_CONFIGS is required}
      - SUPERVISE_RUN_DIR=/run/lancache
      - CDN_DOMAINS_FILE=/etc/nginx/cdn-domains.txt
      - PROXY_CONFIG_SNAPSHOT_DIR=/var/lib/lancache-proxy/config-snapshots
      - PROXY_LOG_DIR=/var/log/nginx
      - PROXY_LOG_GID=10001
      - IP_STANDARD=${IP_STANDARD}
      - IP_SSL=${IP_SSL}
      - SSL_ENABLED=${SSL_ENABLED:-1}
      # What: per-install values from the operator .env
      # Why: one owner; no config/prod defaults any more
      # From: Issue #1683
      - CACHE_MIN_FREE=${CACHE_MIN_FREE:?CACHE_MIN_FREE is required}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:?CACHE_MAX_SIZE is required}
      - CACHE_MEM_MB=${CACHE_MEM_MB:?CACHE_MEM_MB is required}
      - CACHE_SLICE_SIZE=${CACHE_SLICE_SIZE:?CACHE_SLICE_SIZE is required}
      - CACHE_VALID_HIT=${CACHE_VALID_HIT:?CACHE_VALID_HIT is required}
      - CACHE_VALID_ANY=${CACHE_VALID_ANY:?CACHE_VALID_ANY is required}
      - CACHE_INACTIVE=${CACHE_INACTIVE:?CACHE_INACTIVE is required}
      - NGINX_UPSTREAM_RESOLVER=${NGINX_UPSTREAM_RESOLVER:?NGINX_UPSTREAM_RESOLVER is required}
      - PROXY_SECURITY_MODE=${PROXY_SECURITY_MODE:?PROXY_SECURITY_MODE is required}
      - PROXY_ALLOWED_CLIENT_CIDRS=${PROXY_ALLOWED_CLIENT_CIDRS:-}
    volumes:
      - ../../certs:/etc/nginx/ssl/ca
      - ../../services/dns/cdn-domains.txt:/etc/nginx/cdn-domains.txt
      - proxy-cache:/var/cache/nginx/lancache
      - proxy-logs:/var/log/nginx
      - proxy-certs:/etc/nginx/ssl/certs
      - proxy-config-snapshots:/var/lib/lancache-proxy
    tmpfs:
      - /run/lancache
    ports:
      - "${IP_STANDARD}:80:80"
      - "${IP_STANDARD}:443:8443"
      - "${IP_SSL}:80:80"
      - "${IP_SSL}:443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthz >/dev/null && { [ \"$${SSL_ENABLED:-0}\" != \"1\" ] || curl -ksf https://127.0.0.1:8445/healthz >/dev/null; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: PowerDNS auth, dns-http, dns-https, NATS.
  # Why: one container answers on IP_STANDARD and IP_SSL.
  # From: Issue #1683
  dns:
    container_name: LanCache-NG-dns
    image: ${LANCACHE_IMAGE_REF_DNS:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}}
    init: true
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:?KEEP_KNOWN_GOOD_CONFIGS is required}
      - LOG_QUERIES=${LOG_QUERIES:?LOG_QUERIES is required}
      - ROOT_ZONE_MIRROR=${ROOT_ZONE_MIRROR:?ROOT_ZONE_MIRROR is required}
      - PDNS_SOA_REFRESH=${PDNS_SOA_REFRESH:?PDNS_SOA_REFRESH is required}
      - PDNS_SOA_RETRY=${PDNS_SOA_RETRY:?PDNS_SOA_RETRY is required}
      - PDNS_SOA_RESYNC_INTERVAL=${PDNS_SOA_RESYNC_INTERVAL:?PDNS_SOA_RESYNC_INTERVAL is required}
      - PROXY_IP=${IP_STANDARD:?IP_STANDARD is required}
      - PROXY_HTTPS_IP=${IP_SSL:?IP_SSL is required}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - PDNS_API_KEY=${PDNS_API_KEY}
      - DDNS_ALLOW_FROM=${IP_STANDARD},${IP_SSL}
      - DNS_REPLICATION_ROLE=primary
      - SUPERVISE_RUN_DIR=/run/lancache
      - LANCACHE_SHARED_SECRET_DIR=/var/lib/lancache-secrets
      - LANCACHE_SHARED_SECRET_GID=10001
      - PDNS_DATA_DIR=/var/lib/powerdns
      - DNS_STATE_DIR=/var/lib/powerdns-state
      - DNS_CONFIG_SNAPSHOT_DIR=/var/lib/lancache-dns/config-snapshots
      - NATS_CONF_PATH=/etc/nats/nats.conf
      - NATS_AUTH_CALLOUT_PATH=/etc/nats/auth_callout.conf
      - NATS_STORE_DIR=/var/lib/nats
      - NATS_MONITOR_PORT=8222
      - NATS_URL=nats://127.0.0.1:4222
      - NATS_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_PASSWORD_SHARED_SECRET=nats-dns-writer-password
      - NATS_CONSUMER=dns
      - NATS_RECONCILER=1
      - NATS_UI_USER=${NATS_UI_USER:?NATS_UI_USER is required}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_DNS_REPLICA_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_DNS_REPLICA_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      - NATS_CALLOUT_USER=${NATS_CALLOUT_USER:?NATS_CALLOUT_USER is required}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      - NATS_SYS_USER=${NATS_SYS_USER:?NATS_SYS_USER is required}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ../../services/dns/cdn-domains.txt:/etc/pdns/cdn-domains.txt
      - ${PDNS_STANDARD_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-standard}:/var/lib/powerdns
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:/var/lib/powerdns-state
      - ${NATS_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats}:/var/lib/nats
      - ${NATS_CONF_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats-conf}:/etc/nats
      - dns-config-snapshots:/var/lib/lancache-dns
    tmpfs:
      - /run/lancache
    # What: dns-http on IP_STANDARD, dns-https on IP_SSL.
    # Why: one container port each keeps the caches apart.
    # From: Issue #1683
    ports:
      - "${IP_STANDARD}:53:53/udp"
      - "${IP_STANDARD}:53:53/tcp"
      - "${IP_SSL}:53:1053/udp"
      - "${IP_SSL}:53:1053/tcp"
      - "${IP_STANDARD}:5300:5300/udp"
      - "${IP_STANDARD}:5300:5300/tcp"
      # What: NATS for remote secondaries; loopback unless set.
      # Why: NATS_BIND_IP opts in; no second compose file.
      # From: Issue #1683
      - "${NATS_BIND_IP:-127.0.0.1}:4222:4222"
    expose:
      - "8081"
      - "8082"
      - "8083"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: Kea or dnsmasq proxy/relay, one mode at a time.
  # Why: DHCP needs the host network for broadcasts.
  # From: Issue #1683
  dhcp:
    container_name: LanCache-NG-dhcp
    image: ${LANCACHE_IMAGE_REF_DHCP:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dhcp:${LANCACHE_IMAGE_TAG:-latest}}
    init: true
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:?KEEP_KNOWN_GOOD_CONFIGS is required}
      - DHCP_DOMAIN=${DHCP_DOMAIN:?DHCP_DOMAIN is required}
      - DHCP_LEASE_TIME=${DHCP_LEASE_TIME:?DHCP_LEASE_TIME is required}
      - DHCP_NTP_SERVERS=${DHCP_NTP_SERVERS:-}
      - DHCP_DDNS_ENABLED=${DHCP_DDNS_ENABLED:?DHCP_DDNS_ENABLED is required}
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - SUPERVISE_RUN_DIR=/run/lancache
      - UI_SETTINGS_FILE=/data/lancache-ui-settings.env
      - DESIRED_STATE_FILE=/data/desired-state.json
      - LANCACHE_SHARED_SECRET_DIR=/var/lib/lancache-secrets
      - LANCACHE_SHARED_SECRET_GID=10001
      - KEA_DATA_DIR=/var/lib/kea
      - DHCP_CONFIG_SNAPSHOT_DIR=/var/lib/lancache-dhcp/config-snapshots
      - DHCP_PROBE_REQUEST_FILE=/data/dhcp-probe-request
      - DHCP_PROBE_RESULT_FILE=/var/lib/kea/dhcp-probe-result.json
      - DHCP_DNS_SERVER_IP=${IP_STANDARD}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - KEA_CTRL_TOKEN=${KEA_CTRL_TOKEN}
      - KEA_CTRL_USER=${KEA_CTRL_USER:?KEA_CTRL_USER is required}
      - KEA_CTRL_PORT=${KEA_CTRL_PORT:?KEA_CTRL_PORT is required}
      - KEA_CONFIG_SNAPSHOT_DIR=${KEA_CONFIG_SNAPSHOT_DIR:?KEA_CONFIG_SNAPSHOT_DIR is required}
      - DHCP_SUBNET=${DHCP_SUBNET:-}
      - DHCP_RANGE_START=${DHCP_RANGE_START:-}
      - DHCP_RANGE_END=${DHCP_RANGE_END:-}
      - DHCP_GATEWAY=${DHCP_GATEWAY:-}
      - DHCP_SUBNET_START=${DHCP_SUBNET_START:-}
      - DHCP_DNS_PRIMARY=${DHCP_DNS_PRIMARY:-${IP_STANDARD}}
      - DHCP_DNS_SECONDARY=${DHCP_DNS_SECONDARY:-${IP_SSL}}
      - UPSTREAM_DHCP_IP=${UPSTREAM_DHCP_IP:-}
      - DHCP_RELAY_LOCAL_ADDR=${DHCP_RELAY_LOCAL_ADDR:-}
      - DHCP_PROXY_INTERFACE=${DHCP_PROXY_INTERFACE:-}
      - DHCP_PROXY_ROUTER=${DHCP_PROXY_ROUTER:-}
      - DHCP_PROXY_DOMAIN=${DHCP_PROXY_DOMAIN:-}
      - DHCP_PROXY_BOOT_FILENAME=${DHCP_PROXY_BOOT_FILENAME:-}
      - DHCP_PROXY_BOOT_SERVER=${DHCP_PROXY_BOOT_SERVER:-}
      - DHCP_PROXY_CUSTOM_OPTIONS=${DHCP_PROXY_CUSTOM_OPTIONS:-}
      - DHCP_PROXY_PXE_BOOT_SERVER=${DHCP_PROXY_PXE_BOOT_SERVER:-}
      - DHCP_PROXY_PXE_BOOT_FILENAME_BIOS=${DHCP_PROXY_PXE_BOOT_FILENAME_BIOS:-}
      - DHCP_PROXY_PXE_BOOT_FILENAME_UEFI=${DHCP_PROXY_PXE_BOOT_FILENAME_UEFI:-}
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ui-data:/data:ro
      - ${KEA_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/kea}:/var/lib/kea
      - dhcp-config-snapshots:/var/lib/lancache-dhcp
    tmpfs:
      - /run/lancache
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: Admin UI; sets desired state, never containers.
  # Why: the watchdog is the one control owner.
  # From: Issue #1683
  ui:
    container_name: LanCache-NG-ui
    image: ${LANCACHE_IMAGE_REF_UI:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}}
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:?KEEP_KNOWN_GOOD_CONFIGS is required}
      - NTP_UPSTREAM_SERVERS=${NTP_UPSTREAM_SERVERS:?NTP_UPSTREAM_SERVERS is required}
      - NTP_ALLOWED_CLIENT_CIDRS=${NTP_ALLOWED_CLIENT_CIDRS:-}
      - LANCACHE_SHARED_SECRET_DIR=/var/lib/lancache-secrets
      - WATCHDOG_STATUS_FILE=/var/run/watchdog/status.json
      - DESIRED_STATE_FILE=/data/desired-state.json
      - NATS_AUTH_CALLOUT_PATH=/etc/nats/auth_callout.conf
      - UI_SESSION_SECRET_FILE=/data/lancache-ui-session.secret
      - SECONDARY_REGISTRATION_TOKEN_FILE=/data/lancache-secondary-registration.token
      - KEA_CONFIG_SNAPSHOT_DIR=${KEA_CONFIG_SNAPSHOT_DIR:?KEA_CONFIG_SNAPSHOT_DIR is required}
      - DHCP_PROBE_REQUEST_FILE=/data/dhcp-probe-request
      - DHCP_PROBE_RESULT_FILE=/var/lib/kea/dhcp-probe-result.json
      - SSL_ENABLED=${SSL_ENABLED:-1}
      - PROXY_STANDARD_URL=http://proxy
      - PROXY_SSL_URL=http://proxy
      - STANDARD_LOG=/var/log/nginx/access.log
      - SSL_LOG=/var/log/nginx/access.log
      - CACHE_DIR=/var/cache/proxy
      - NETDATA_URL=http://services:19999
      - NETDATA_ALARM_TOKEN=${NETDATA_ALARM_TOKEN}
      - CACHE_MAX_GB=${CACHE_MAX_GB:-${STANDARD_CACHE_MAX_GB:-${SSL_CACHE_MAX_GB:-}}}
      - STANDARD_IP=${IP_STANDARD}
      - SSL_IP=${IP_SSL}
      - DNS_STATE_DIR=/var/lib/powerdns-state
      - LANCACHE_IMAGE_REGISTRY=${LANCACHE_IMAGE_REGISTRY:-ghcr.io}
      - LANCACHE_IMAGE_PREFIX=${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}
      - LANCACHE_IMAGE_CHANNEL=${LANCACHE_IMAGE_CHANNEL:-}
      - LANCACHE_IMAGE_TAG=${LANCACHE_IMAGE_TAG:-latest}
      - UI_AUTH_USER=${UI_AUTH_USER:-}
      - UI_AUTH_PASSWORD=${UI_AUTH_PASSWORD:-}
      - ALLOW_INSECURE_UI=${ALLOW_INSECURE_UI:-false}
      - UI_SESSION_TTL_SECONDS=${UI_SESSION_TTL_SECONDS:-86400}
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - DHCP_NTP_SERVERS=${DHCP_NTP_SERVERS:-}
      - DHCP_SUBNET_START=${DHCP_SUBNET_START:-}
      - DHCP_DNS_PRIMARY=${DHCP_DNS_PRIMARY:-${IP_STANDARD}}
      - DHCP_DNS_SECONDARY=${DHCP_DNS_SECONDARY:-${IP_SSL}}
      - UPSTREAM_DHCP_IP=${UPSTREAM_DHCP_IP:-}
      - DHCP_RELAY_LOCAL_ADDR=${DHCP_RELAY_LOCAL_ADDR:-}
      - DHCP_PROXY_INTERFACE=${DHCP_PROXY_INTERFACE:-}
      - DHCP_PROXY_ROUTER=${DHCP_PROXY_ROUTER:-}
      - DHCP_PROXY_DOMAIN=${DHCP_PROXY_DOMAIN:-}
      - DHCP_PROXY_BOOT_FILENAME=${DHCP_PROXY_BOOT_FILENAME:-}
      - DHCP_PROXY_BOOT_SERVER=${DHCP_PROXY_BOOT_SERVER:-}
      - DHCP_PROXY_CUSTOM_OPTIONS=${DHCP_PROXY_CUSTOM_OPTIONS:-}
      - DHCP_API_URL=http://host.docker.internal:${KEA_CTRL_PORT:?KEA_CTRL_PORT is required}
      - DHCP_API_USER=${KEA_CTRL_USER:?KEA_CTRL_USER is required}
      - DHCP_API_TOKEN=${KEA_CTRL_TOKEN}
      - UI_LOGS_MAX_ENTRIES=200
      - PDNS_AUTH_URL=http://dns:8081
      - PDNS_REC_URL=http://dns:8082
      - DNS_ROLLBACK_URL=http://dns:8083
      - PDNS_API_KEY=${PDNS_API_KEY}
      - NATS_URL=nats://dns:4222
      - NATS_BIND_IP=${NATS_BIND_IP:-}
      - NATS_ADVERTISE_URL=${NATS_ADVERTISE_URL:-}
      - NATS_UI_USER=${NATS_UI_USER:?NATS_UI_USER is required}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_DNS_REPLICA_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_DNS_REPLICA_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      - NATS_CALLOUT_USER=${NATS_CALLOUT_USER:?NATS_CALLOUT_USER is required}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      - NATS_SYS_USER=${NATS_SYS_USER:?NATS_SYS_USER is required}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
      - SECONDARY_REGISTRATION_TOKEN=${SECONDARY_REGISTRATION_TOKEN}
      - SYSLOG_LOG_ROOT=/var/log/lancache-syslog-ng
      - SYSLOG_MAX_GB=${SYSLOG_MAX_GB:?SYSLOG_MAX_GB is required}
      - SYSLOG_RETENTION_DAYS=${SYSLOG_RETENTION_DAYS:?SYSLOG_RETENTION_DAYS is required}
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ui-data:/data
      - ../../services/dns/cdn-domains.txt:/data/cdn-domains.txt
      - proxy-logs:/var/log/nginx:ro
      - proxy-cache:/var/cache/proxy:ro
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:/var/lib/powerdns-state
      - ${NATS_CONF_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats-conf}:/etc/nats
      - ${KEA_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/kea}:/var/lib/kea
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:/var/log/lancache-syslog-ng:ro
      - watchdog-status:/var/run/watchdog:ro
    ports:
      - "${UI_BIND_IP:-${IP_STANDARD}}:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

volumes:
  shared-secrets:
  proxy-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CACHE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/cache}
  proxy-logs:
  proxy-certs:
  proxy-config-snapshots:
  dns-config-snapshots:
  dhcp-config-snapshots:
  watchdog-status:
  retention-state:
  netdataconfig:
  netdatalib:
  netdatacache:
  ui-data:
