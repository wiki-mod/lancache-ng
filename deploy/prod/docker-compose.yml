
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
name: lancache-ng

# What: Docker syslog driver into syslog-ng in services.
# Why: UDP never blocks a container start without receiver.
# From: Issue #1683
x-logging: &logging
  driver: syslog
  options:
    syslog-address: "udp://127.0.0.1:${SOT_LANCACHE_LOG_PORT:?SOT_LANCACHE_LOG_PORT is required}"
    syslog-format: rfc5424
    tag: "{{.Name}}"

services:
  # What: watchdog, syslog-ng, chronyd, netdata, retention.
  # Why: one container for every stack-wide support task.
  # From: Issue #1683
  services:
    container_name: LanCache-NG-services
    image: ${LANCACHE_IMAGE_REF_SERVICES:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/services:${LANCACHE_IMAGE_TAG:-latest}}
    # What: tini as PID 1 reaps the supervisor's children.
    # Why: lancache-watchdog supervise is no init process.
    # From: Issue #1683
    init: true
    environment:
      # What: operator values; the defaults are baked in.
      # Why: the SOT owns each default; no value copy here.
      # From: Issue #1683
      - NTP_ENABLED=${NTP_ENABLED:-}
      - NTP_ALLOWED_CLIENT_CIDRS=${NTP_ALLOWED_CLIENT_CIDRS:-}
      - NETDATA_ALARM_TOKEN=${NETDATA_ALARM_TOKEN}
      - CACHEHAMSTER_URLS=${CACHEHAMSTER_URLS:-}
    # What: rendered syslog-ng, chrony and status files.
    # Why: each start renders fresh; nothing survives.
    # From: Issue #1683
    tmpfs:
      - ${SOT_SUPERVISE_RUN_DIR}
    # What: the log input on loopback; NTP for the LAN.
    # Why: only the local Docker daemon may send log lines.
    # From: Issue #1683
    ports:
      - "127.0.0.1:${SOT_LANCACHE_LOG_PORT}:${SOT_LANCACHE_LOG_PORT}/udp"
      - "123:123/udp"
    volumes:
      # What: the Docker API for the watchdog process only.
      # Why: no socket proxy; the supervisor drops the rest.
      # From: Issue #1683
      - ${SOT_DOCKER_SOCKET}:${SOT_DOCKER_SOCKET}
      - shared-secrets:${SOT_LANCACHE_SHARED_SECRET_DIR}
      - ui-data:${SOT_UI_DATA_DIR}:ro
      - watchdog-status:${SOT_STATUS_DIR}
      - proxy-cache:${SOT_CACHE_DIR}
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:${SOT_SYSLOG_LOG_ROOT}
      - retention-state:${SOT_RETENTION_STATE_DIR}
      - ${NTP_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/ntp}:${SOT_NTP_STATE_DIR}
      - ${CACHEHAMSTER_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/cachehamster}:${SOT_CACHEHAMSTER_DATA_DIR}
      - netdataconfig:${SOT_NETDATA_CONFIG_DIR}
      - netdatalib:${SOT_NETDATA_LIB_DIR}
      - netdatacache:${SOT_NETDATA_CACHE_DIR}
    cap_drop:
      - ALL
    # What: capabilities the supervised processes need.
    # Why: each child runs under its own uid with less.
    # From: Issue #1683
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_BIND_SERVICE
      - SYS_TIME
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: nginx cache; the http and https side in one.
  # Why: :8443 passes SNI through, :443 intercepts TLS.
  proxy:
    container_name: LanCache-NG-proxy
    image: ${LANCACHE_IMAGE_REF_PROXY:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/proxy:${LANCACHE_IMAGE_TAG:-latest}}
    init: true
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-}
      - IP_HTTP=${IP_HTTP}
      - IP_HTTPS=${IP_HTTPS}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-}
      # What: per-install values from the operator .env
      # Why: .env is the one owner of operator values.
      # From: Issue #1683
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:?CACHE_MAX_SIZE is required}
      - CACHE_MEM_MB=${CACHE_MEM_MB:?CACHE_MEM_MB is required}
      - NGINX_UPSTREAM_RESOLVER=${NGINX_UPSTREAM_RESOLVER:-}
      - PROXY_SECURITY_MODE=${PROXY_SECURITY_MODE:-}
      - PROXY_ALLOWED_CLIENT_CIDRS=${PROXY_ALLOWED_CLIENT_CIDRS:-}
    volumes:
      - ../../certs:/etc/nginx/ssl/ca
      - ../../services/dns/cdn-domains.txt:${SOT_CDN_DOMAINS_FILE}
      - proxy-cache:/var/cache/nginx/lancache
      - proxy-certs:/etc/nginx/ssl/certs
      - proxy-config-snapshots:${SOT_PROXY_SNAPSHOT_MOUNT}
    tmpfs:
      - ${SOT_SUPERVISE_RUN_DIR}
    ports:
      - "${IP_HTTP}:80:80"
      - "${IP_HTTP}:443:8443"
      - "${IP_HTTPS}:80:80"
      - "${IP_HTTPS}:443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthz >/dev/null && { [ \"$${HTTPS_ENABLED:-0}\" != \"1\" ] || curl -ksf https://127.0.0.1:8445/healthz >/dev/null; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: PowerDNS auth, dns-http, dns-https, NATS.
  # Why: one container answers on IP_HTTP and IP_HTTPS.
  # From: Issue #1683
  dns:
    container_name: LanCache-NG-dns
    image: ${LANCACHE_IMAGE_REF_DNS:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}}
    init: true
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-}
      - IP_HTTP=${IP_HTTP:?IP_HTTP is required}
      - IP_HTTPS=${IP_HTTPS:?IP_HTTPS is required}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - PDNS_API_KEY=${PDNS_API_KEY}
      - NATS_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
    volumes:
      - shared-secrets:${SOT_LANCACHE_SHARED_SECRET_DIR}
      - ../../services/dns/cdn-domains.txt:${SOT_CDN_DOMAINS_FILE}
      - ${PDNS_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns}:${SOT_PDNS_DATA_DIR}
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:${SOT_DNS_STATE_DIR}
      - ${NATS_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats}:${SOT_NATS_STORE_DIR}
      - ${NATS_CONF_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats-conf}:${SOT_NATS_CONF_MOUNT}
      - dns-config-snapshots:${SOT_DNS_SNAPSHOT_MOUNT}
    tmpfs:
      - ${SOT_SUPERVISE_RUN_DIR}
    # What: dns-http on IP_HTTP, dns-https on IP_HTTPS.
    # Why: one container port each keeps the caches apart.
    # From: Issue #1683
    ports:
      - "${IP_HTTP}:53:53/udp"
      - "${IP_HTTP}:53:53/tcp"
      - "${IP_HTTPS}:53:1053/udp"
      - "${IP_HTTPS}:53:1053/tcp"
      # What: PowerDNS AXFR listener on IP_HTTP, UDP+TCP.
      # Why: secondaries pull zones from this port.
      # From: Issue #1683 | PR #1912
      - "${IP_HTTP}:5300:5300/udp"
      - "${IP_HTTP}:5300:5300/tcp"
      # What: NATS for secondaries; loopback by default.
      # Why: NATS_BIND_IP opts in; no second compose file.
      # From: Issue #1683 | PR #1912
      - "${NATS_BIND_IP:-127.0.0.1}:${SOT_NATS_PORT}:${SOT_NATS_PORT}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: Kea or dnsmasq proxy/relay, one mode at a time.
  # Why: DHCP needs the host network for broadcasts.
  # From: Issue #1683
  dhcp:
    container_name: LanCache-NG-dhcp
    image: ${LANCACHE_IMAGE_REF_DHCP:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dhcp:${LANCACHE_IMAGE_TAG:-latest}}
    init: true
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-}
      - DHCP_NTP_SERVERS=${DHCP_NTP_SERVERS:-}
      - DHCP_MODE=${DHCP_MODE:-}
      - IP_HTTP=${IP_HTTP}
      - IP_HTTPS=${IP_HTTPS}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - KEA_CTRL_TOKEN=${KEA_CTRL_TOKEN}
      - DHCP_SUBNET=${DHCP_SUBNET:-}
      - DHCP_RANGE_START=${DHCP_RANGE_START:-}
      - DHCP_RANGE_END=${DHCP_RANGE_END:-}
      - DHCP_GATEWAY=${DHCP_GATEWAY:-}
      - DHCP_SUBNET_START=${DHCP_SUBNET_START:-}
      - DHCP_DNS_PRIMARY=${DHCP_DNS_PRIMARY:-}
      - DHCP_DNS_SECONDARY=${DHCP_DNS_SECONDARY:-}
      - UPSTREAM_DHCP_IP=${UPSTREAM_DHCP_IP:-}
      - DHCP_RELAY_LOCAL_ADDR=${DHCP_RELAY_LOCAL_ADDR:-}
      - DHCP_PROXY_INTERFACE=${DHCP_PROXY_INTERFACE:-}
      - DHCP_PROXY_ROUTER=${DHCP_PROXY_ROUTER:-}
      - DHCP_PROXY_DOMAIN=${DHCP_PROXY_DOMAIN:-}
      - DHCP_PROXY_BOOT_FILENAME=${DHCP_PROXY_BOOT_FILENAME:-}
      - DHCP_PROXY_BOOT_SERVER=${DHCP_PROXY_BOOT_SERVER:-}
      - DHCP_PROXY_CUSTOM_OPTIONS=${DHCP_PROXY_CUSTOM_OPTIONS:-}
      - DHCP_PROXY_PXE_BOOT_SERVER=${DHCP_PROXY_PXE_BOOT_SERVER:-}
      - DHCP_PROXY_PXE_BOOT_FILENAME_BIOS=${DHCP_PROXY_PXE_BOOT_FILENAME_BIOS:-}
      - DHCP_PROXY_PXE_BOOT_FILENAME_UEFI=${DHCP_PROXY_PXE_BOOT_FILENAME_UEFI:-}
    volumes:
      - shared-secrets:${SOT_LANCACHE_SHARED_SECRET_DIR}
      - ui-data:${SOT_UI_DATA_DIR}:ro
      - ${KEA_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/kea}:${SOT_KEA_DATA_DIR}
      - dhcp-config-snapshots:${SOT_DHCP_SNAPSHOT_MOUNT}
    tmpfs:
      - ${SOT_SUPERVISE_RUN_DIR}
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "/usr/local/bin/lancache-watchdog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # What: Admin UI; sets desired state, never containers.
  # Why: the watchdog is the one control owner.
  # From: Issue #1683
  ui:
    container_name: LanCache-NG-ui
    image: ${LANCACHE_IMAGE_REF_UI:-${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}}
    environment:
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-}
      - NTP_ALLOWED_CLIENT_CIDRS=${NTP_ALLOWED_CLIENT_CIDRS:-}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-}
      - NETDATA_ALARM_TOKEN=${NETDATA_ALARM_TOKEN}
      - CACHE_MAX_GB=${CACHE_MAX_GB:-}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:?CACHE_MAX_SIZE is required}
      - IP_HTTP=${IP_HTTP}
      - IP_HTTPS=${IP_HTTPS}
      - LANCACHE_IMAGE_REGISTRY=${LANCACHE_IMAGE_REGISTRY:-ghcr.io}
      - LANCACHE_IMAGE_PREFIX=${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}
      - LANCACHE_IMAGE_CHANNEL=${LANCACHE_IMAGE_CHANNEL:-}
      - LANCACHE_IMAGE_TAG=${LANCACHE_IMAGE_TAG:-latest}
      - UI_AUTH_USER=${UI_AUTH_USER:-}
      - UI_AUTH_PASSWORD_HASH=${UI_AUTH_PASSWORD_HASH:-}
      - ALLOW_INSECURE_UI=${ALLOW_INSECURE_UI:-}
      - UI_SESSION_TTL_SECONDS=${UI_SESSION_TTL_SECONDS:-}
      - DHCP_MODE=${DHCP_MODE:-}
      - DHCP_NTP_SERVERS=${DHCP_NTP_SERVERS:-}
      - DHCP_SUBNET_START=${DHCP_SUBNET_START:-}
      - DHCP_DNS_PRIMARY=${DHCP_DNS_PRIMARY:-}
      - DHCP_DNS_SECONDARY=${DHCP_DNS_SECONDARY:-}
      - UPSTREAM_DHCP_IP=${UPSTREAM_DHCP_IP:-}
      - DHCP_RELAY_LOCAL_ADDR=${DHCP_RELAY_LOCAL_ADDR:-}
      - DHCP_PROXY_INTERFACE=${DHCP_PROXY_INTERFACE:-}
      - DHCP_PROXY_ROUTER=${DHCP_PROXY_ROUTER:-}
      - DHCP_PROXY_DOMAIN=${DHCP_PROXY_DOMAIN:-}
      - DHCP_PROXY_BOOT_FILENAME=${DHCP_PROXY_BOOT_FILENAME:-}
      - DHCP_PROXY_BOOT_SERVER=${DHCP_PROXY_BOOT_SERVER:-}
      - DHCP_PROXY_CUSTOM_OPTIONS=${DHCP_PROXY_CUSTOM_OPTIONS:-}
      - DHCP_API_TOKEN=${KEA_CTRL_TOKEN}
      - PDNS_API_KEY=${PDNS_API_KEY}
      - NATS_BIND_IP=${NATS_BIND_IP:-}
      - NATS_ADVERTISE_URL=${NATS_ADVERTISE_URL:-}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
      - SECONDARY_REGISTRATION_TOKEN=${SECONDARY_REGISTRATION_TOKEN}
    volumes:
      - shared-secrets:${SOT_LANCACHE_SHARED_SECRET_DIR}
      - ui-data:${SOT_UI_DATA_DIR}
      - ../../services/dns/cdn-domains.txt:${SOT_CDN_DOMAINS_FILE}
      - proxy-cache:${SOT_CACHE_DIR}:ro
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:${SOT_DNS_STATE_DIR}
      - ${NATS_CONF_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats-conf}:${SOT_NATS_CONF_MOUNT}
      - ${KEA_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/kea}:${SOT_KEA_DATA_DIR}
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:${SOT_SYSLOG_LOG_ROOT}:ro
      - watchdog-status:${SOT_STATUS_DIR}:ro
    # What: Admin UI on UI_BIND_IP, default IP_HTTP.
    # Why: UI_BIND_IP narrows the LAN exposure of the UI.
    # From: Issue #1683 | PR #1912
    ports:
      - "${UI_BIND_IP:-${IP_HTTP}}:${SOT_UI_LISTEN_PORT}:${SOT_UI_LISTEN_PORT}"
    # What: host.docker.internal maps to the Docker host.
    # Why: the ui reaches Kea on the host network.
    # From: Issue #1683 | PR #1912
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

volumes:
  shared-secrets:
  proxy-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CACHE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/cache}
  proxy-certs:
  proxy-config-snapshots:
  dns-config-snapshots:
  dhcp-config-snapshots:
  watchdog-status:
  retention-state:
  netdataconfig:
  netdatalib:
  netdatacache:
  ui-data:
