
# LanCache-NG (https://github.com/wiki-mod/lancache-ng)
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Production stack: proxy, DNS, DHCP, Admin UI, and supporting services
# (NATS, docker-socket-proxy) wired up with production-sized defaults
# (large host-mounted cache volume, standard DNS ports, query logging off).
# This is the only *production* deployment profile -- see AGENTS.md's AG-KD-008
# for why there is no parallel deploy/dev stack (corrected 2026-08-05, issue #1391
# doc-sweep audit: this used to cite CLAUDE.md's "No Separate Dev Environment"
# section, which moved to AGENTS.md on 2026-07-31; deploy/quickstart/ and
# deploy/full-setup/ are the other two real profiles that exist today, for
# quickstart and CI-validation use respectively).

name: lancache-ng

# The Docker socket proxy's HAProxy allowlist lives in exactly one place,
# scripts/docker-socket-proxy.sh (mounted read-only below), which is the
# canonical source per docs/naming-conventions.md. This file used to also
# carry an unreferenced x-docker-socket-proxy-command YAML anchor with a
# near-duplicate copy of that same config -- it was never aliased anywhere
# (dead weight that could silently drift from the real script with no
# functional effect) and has been removed.

services:

  # ── Unified proxy (standard + SSL mode in one container) ─────────────────
  # Port 80: HTTP caching (shared cache for both modes)
  # Port 8443 (standard): SNI passthrough to real CDN (no client cert needed)
  # Port 443 (SSL): HTTPS caching via TLS interception (CA cert required)
  proxy:
    container_name: lancache-proxy
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/proxy:${LANCACHE_IMAGE_TAG:-latest}
    env_file:
      - ../../config/prod/proxy.env
    environment:
      - IP_STANDARD=${IP_STANDARD}
      - IP_SSL=${IP_SSL}
      - SSL_ENABLED=${SSL_ENABLED:-1}
    volumes:
      - ../../certs:/etc/nginx/ssl/ca
      - ../../services/dns/cdn-domains.txt:/etc/nginx/cdn-domains.txt
      # Named volume resolves to the single host CACHE_DIR device below.
      # Both standard and SSL proxy paths write into this same cache tree.
      - proxy-cache:/var/cache/nginx/lancache
      - proxy-logs:/var/log/nginx
      # Per-domain SSL/MITM wildcard certs (entrypoint.sh's CERT_DIR),
      # distinct from the CA bind-mount above (../../certs, the persistent
      # CA key/cert itself). The Dockerfile's own VOLUME declaration for
      # this path (/etc/nginx/ssl/certs) is anonymous, so without this named
      # volume, any flow that removes the container (e.g. `docker compose
      # down && up`, as opposed to `--force-recreate`, which reuses
      # anonymous volumes) silently loses every generated wildcard cert and
      # re-signs the full domain list from scratch on next boot --
      # self-healing (all certs are deterministically re-derived from the
      # same persisted CA) but a real, avoidable regeneration cost for a
      # deployment with a large cdn-domains.txt.
      - proxy-certs:/etc/nginx/ssl/certs
      # Known-good nginx config snapshots (#415): must be a persistent,
      # service-owned volume, not the ephemeral container layer, so
      # rollback survives container restarts/recreates.
      - proxy-config-snapshots:/var/lib/lancache-proxy
    ports:
      - "${IP_STANDARD}:80:80"
      - "${IP_STANDARD}:443:8443"
      - "${IP_SSL}:80:80"
      - "${IP_SSL}:443:443"
    healthcheck:
      # Since #1276/#1322: IP_SSL:443 (container port 443) now reaches the
      # stream-level SNI dispatch listener (entrypoint.sh's "2a."), which has
      # no SNI to route on for an IP-literal curl target and would forward
      # into the passthrough branch instead of the actual HTTPS/MITM server --
      # retargeted directly at conf.d/https.conf's dedicated, non-PROXY-
      # protocol healthcheck port (8445) instead, which bypasses the dispatch
      # listener entirely but still proves the same nginx worker and cert
      # config are alive.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthz >/dev/null && { [ \"$${SSL_ENABLED:-0}\" != \"1\" ] || curl -ksf https://127.0.0.1:8445/healthz >/dev/null; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dns-standard:
    container_name: lancache-dns-standard
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}
    env_file:
      - ../../config/prod/dns-standard.env
    environment:
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - PDNS_API_KEY=${PDNS_API_KEY}
      # issue #706: overrides config/prod/dns-standard.env's empty
      # DDNS_ALLOW_FROM= (env_file values can't be ${VAR}-interpolated by
      # Compose, this `environment:` block can). Verified empirically that a
      # DDNS update from the `dhcp` container (network_mode: host) always
      # arrives with source = the host's primary LAN IP, i.e. IP_STANDARD in
      # this project's documented setup flow -- IP_SSL is included too as a
      # low-cost hedge; TSIG is the real auth control either way.
      - DDNS_ALLOW_FROM=${IP_STANDARD},${IP_SSL}
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      # Shared-secret bootstrap (#858): resolve NATS_PASSWORD against this role's
      # shared file so it matches the value the nats server generates.
      - NATS_PASSWORD_SHARED_SECRET=nats-dns-writer-password
      - NATS_CONSUMER=dns-standard
      - NATS_RECONCILER=1
    volumes:
      # Shared-secret bootstrap (#858): first-writer-wins PDNS_API_KEY/DDNS_TSIG_KEY.
      - shared-secrets:/var/lib/lancache-secrets
      - ../../services/dns/cdn-domains.txt:/etc/pdns/cdn-domains.txt
      # Normal production keeps these overrides unset so one LANCACHE_STATE_DIR
      # move retargets DNS and NATS together. setup.sh writes explicit keys only
      # when it has to preserve a real legacy/custom path during update.
      - ${PDNS_STANDARD_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-standard}:/var/lib/powerdns
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:/var/lib/powerdns-state
      # Known-good pdns.conf/recursor.conf snapshots (#615): deliberately a
      # plain Docker-managed volume, not part of the LANCACHE_STATE_DIR
      # bind-mount/backup contract -- see docs/known-good-config-snapshots.md.
      - pdns-config-snapshots-standard:/var/lib/lancache-dns
      # Central logging pipeline (#633): PowerDNS has no native file-log
      # directive (see services/dns/entrypoint.sh's run_auth/run_recursor,
      # which `tee` each daemon's stdout here instead).
      - dns-logs-standard:/var/log/lancache-dns
    ports:
      - "${IP_STANDARD}:53:53/udp"
      - "${IP_STANDARD}:53:53/tcp"
      # 5300/udp only (issue #706): pdns_server's actual DNS-protocol port
      # (now bound to this container's real address as well as 127.0.0.1,
      # see services/dns/pdns.conf.template), published so the separate
      # `dhcp` container's D2 daemon can send it real DNS UPDATE packets --
      # those never arrive over UDP-only 53 to the recursor. TCP is
      # deliberately not published: DNS UPDATE always fits comfortably in a
      # single UDP datagram, and TSIG-signed AXFR/zone-transfer-sized
      # traffic over TCP/5300 is not something this port needs to expose
      # beyond the container network. allow-dnsupdate-from (TSIG-gated,
      # DDNS_ALLOW_FROM above) is the actual access control either way.
      - "${IP_STANDARD}:5300:5300/udp"
    expose:
      - "8081"
      - "8082"
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 content1.steampowered.com A +short +time=2 +tries=1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - nats
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  dns-ssl:
    container_name: lancache-dns-ssl
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}
    env_file:
      - ../../config/prod/dns-ssl.env
    environment:
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - PDNS_API_KEY=${PDNS_API_KEY}
      - DDNS_ALLOW_FROM=${IP_STANDARD},${IP_SSL}
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      - NATS_PASSWORD_SHARED_SECRET=nats-dns-replica-password
      - NATS_CONSUMER=dns-ssl
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ../../services/dns/cdn-domains.txt:/etc/pdns/cdn-domains.txt
      - ${PDNS_SSL_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-ssl}:/var/lib/powerdns
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:/var/lib/powerdns-state
      - pdns-config-snapshots-ssl:/var/lib/lancache-dns
      - dns-logs-ssl:/var/log/lancache-dns
    ports:
      - "${IP_SSL}:53:53/udp"
      - "${IP_SSL}:53:53/tcp"
      - "${IP_SSL}:5300:5300/udp"
    expose:
      - "8081"
      - "8082"
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 content1.steampowered.com A +short +time=2 +tries=1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - nats
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  docker-socket-proxy:
    container_name: lancache-docker-socket-proxy
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    entrypoint: ["/usr/local/bin/lancache-docker-socket-proxy.sh"]
    command: []
    stdin_open: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../scripts/docker-socket-proxy.sh:/usr/local/bin/lancache-docker-socket-proxy.sh:ro
    networks:
      - docker-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  watchdog:
    container_name: lancache-watchdog
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/watchdog:${LANCACHE_IMAGE_TAG:-latest}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/log/lancache-watchdog
        exec /watchdog.sh > >(tee -a /var/log/lancache-watchdog/watchdog.log) 2>&1
    env_file:
      - ../../config/prod/watchdog.env
    environment:
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
      - LOGGING_ENABLED=${LOGGING_ENABLED:-0}
      - NTP_ENABLED=${NTP_ENABLED:-0}
    volumes:
      - proxy-cache:/var/cache/lancache:ro
      - watchdog-status:/var/run/watchdog
      - watchdog-logs:/var/log/lancache-watchdog
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 15s
    # Health reads and restart calls cannot work until the narrowed Docker API
    # proxy is genuinely accepting requests, so watchdog waits for its real
    # HTTP healthcheck rather than only for container creation.
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - default
      - docker-api
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  retention:
    container_name: lancache-retention
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/watchdog:${LANCACHE_IMAGE_TAG:-latest}
    entrypoint: ["/retention-entrypoint.sh"]
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ../../config/prod/watchdog.env
    environment:
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
      - SYSLOG_MAX_GB=${SYSLOG_MAX_GB:-10}
      - SYSLOG_RETENTION_DAYS=${SYSLOG_RETENTION_DAYS:-30}
      - SYSLOG_PRUNE_RETRY_COOLDOWN=${SYSLOG_PRUNE_RETRY_COOLDOWN:-3600}
      - FLUENT_BIT_SELFLOG_MAX_MB=${FLUENT_BIT_SELFLOG_MAX_MB:-20}
      - FLUENT_BIT_SELFLOG_MAX_ROTATIONS=${FLUENT_BIT_SELFLOG_MAX_ROTATIONS:-5}
    volumes:
      - proxy-cache:/var/cache/lancache
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:/var/log/lancache-syslog-ng
      - syslog-data:/var/lib/lancache-syslog-data
      - watchdog-logs:/var/log/lancache-watchdog
      - retention-state:/var/lib/lancache-retention-state
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  dhcp:
    container_name: lancache-dhcp
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dhcp:${LANCACHE_IMAGE_TAG:-latest}
    profiles:
      - dhcp-kea
    env_file:
      - ../../config/prod/dhcp.env
    environment:
      - DHCP_DNS_PRIMARY=${IP_STANDARD}
      - DHCP_DNS_SECONDARY=${IP_SSL}
      - DHCP_DNS_SERVER_IP=${IP_STANDARD}
      - DHCP_DNS_SERVER_IP_SSL=${IP_SSL}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY}
      - KEA_CTRL_TOKEN=${KEA_CTRL_TOKEN}
      - DHCP_MODE=${DHCP_MODE:-disabled}
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ${KEA_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/kea}:/var/lib/kea
      - dhcp-logs:/var/log/kea
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          host="$${KEA_CTRL_HOST:-127.0.0.1}";
          [ "$$host" = "0.0.0.0" ] && host=127.0.0.1;
          token="$${KEA_CTRL_TOKEN:-}";
          norm="$$(printf '%s' "$$token" | tr '[:upper:]' '[:lower:]' | tr '-' '_')";
          case "$$norm" in ""|change_me*|changeme*|your_*|*_here) token="" ;; esac;
          case "$$token" in lancache-dhcp-secret|lancache-dhcp-dev-secret|lancache-dhcp-prod-secret) token="" ;; esac;
          [ -n "$$token" ] || token="$$(cat /var/lib/lancache-secrets/kea-ctrl-token 2>/dev/null)";
          curl -sf -u admin:$$token -H 'Content-Type: application/json' -d '{"command":"config-get","service":["dhcp4"]}' "http://$$host:8000/" | jq -e '.[0].result == 0' >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  dhcp-proxy:
    container_name: lancache-dhcp-proxy
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dhcp-proxy:${LANCACHE_IMAGE_TAG:-latest}
    env_file:
      - ../../config/prod/dhcp-proxy.env
    volumes:
      - ui-data:/data:ro
      - dhcp-proxy-config-snapshots:/var/lib/lancache-dhcp-proxy
      - dhcp-proxy-logs:/var/log/lancache-dhcp-proxy
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    profiles:
      - dhcp-proxy
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm 2>/dev/null)\" = dnsmasq ] && dnsmasq --test -C /etc/dnsmasq.conf >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  ntp:
    container_name: lancache-ntp
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ntp:${LANCACHE_IMAGE_TAG:-latest}
    profiles:
      - ntp
    env_file:
      - ../../config/prod/ntp.env
    volumes:
      - ui-data:/data:ro
      - ${NTP_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/ntp}:/var/lib/chrony
      - ntp-logs:/var/log/chrony
    ports:
      - "123:123/udp"
    cap_drop:
      - ALL
    cap_add:
      - SYS_TIME
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    healthcheck:
      test: ["CMD-SHELL", "chronyc tracking | grep -q 'Reference ID' || exit 1; if [ -f /run/ntp-cap-sys-time-degraded ]; then printf 'DEGRADED: %s\n' \"$(cat /run/ntp-cap-sys-time-degraded)\"; fi"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  dhcp-probe:
    container_name: lancache-dhcp-probe
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}
    entrypoint: ["/usr/local/bin/lancache-ui", "--dhcp-probe"]
    network_mode: host
    restart: "no"

  nats:
    container_name: lancache-nats
    image: nats:2-alpine@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        . /usr/local/lib/shared-secret-bootstrap.sh
        if secret_is_placeholder "$$NATS_UI_PASSWORD"; then NATS_UI_PASSWORD=""; fi
        if ! NATS_UI_PASSWORD="$$(resolve_shared_secret nats-ui-password "$$NATS_UI_PASSWORD" lancache_gen_hex32)"; then exit 1; fi
        if secret_is_placeholder "$$NATS_DNS_WRITER_PASSWORD"; then NATS_DNS_WRITER_PASSWORD=""; fi
        if ! NATS_DNS_WRITER_PASSWORD="$$(resolve_shared_secret nats-dns-writer-password "$$NATS_DNS_WRITER_PASSWORD" lancache_gen_hex32)"; then exit 1; fi
        if secret_is_placeholder "$$NATS_DNS_REPLICA_PASSWORD"; then NATS_DNS_REPLICA_PASSWORD=""; fi
        if ! NATS_DNS_REPLICA_PASSWORD="$$(resolve_shared_secret nats-dns-replica-password "$$NATS_DNS_REPLICA_PASSWORD" lancache_gen_hex32)"; then exit 1; fi
        if secret_is_placeholder "$$NATS_CALLOUT_PASSWORD"; then NATS_CALLOUT_PASSWORD=""; fi
        if ! NATS_CALLOUT_PASSWORD="$$(resolve_shared_secret nats-callout-password "$$NATS_CALLOUT_PASSWORD" lancache_gen_hex32)"; then exit 1; fi
        if secret_is_placeholder "$$NATS_SYS_PASSWORD"; then NATS_SYS_PASSWORD=""; fi
        if ! NATS_SYS_PASSWORD="$$(resolve_shared_secret nats-sys-password "$$NATS_SYS_PASSWORD" lancache_gen_hex32)"; then exit 1; fi
        mkdir -p /etc/nats /var/log/lancache-nats
        escape_sed() { printf '%s' "$$1" | sed 's/[\/&|]/\\&/g'; }
        tmp_nats_conf="$$(mktemp /etc/nats/.nats.conf.XXXXXX)"
        trap 'rm -f "$$tmp_nats_conf"' EXIT
        cat > /tmp/nats.conf.template <<'EOF'
        jetstream { store_dir: /data }
        http_port: 8222
        log_file: /var/log/lancache-nats/nats.log
        authorization {
          users = [
            { user: "__NATS_UI_USER__", password: "__NATS_UI_PASSWORD__", permissions = { publish = ["lancache.dns.record", "lancache.dns.flush"] } },
            { user: "__NATS_DNS_WRITER_USER__", password: "__NATS_DNS_WRITER_PASSWORD__", permissions = { publish = ["lancache.dns.record", "lancache.dns.flush", "$$JS.API.STREAM.INFO.LANCACHE_DNS", "$$JS.API.STREAM.CREATE.LANCACHE_DNS", "$$JS.API.CONSUMER.INFO.LANCACHE_DNS.>", "$$JS.API.CONSUMER.CREATE.LANCACHE_DNS.>", "$$JS.API.CONSUMER.DURABLE.CREATE.LANCACHE_DNS.>", "$$JS.API.CONSUMER.MSG.NEXT.LANCACHE_DNS.>", "$$JS.ACK.LANCACHE_DNS.>"], subscribe = ["lancache.dns.>", "_INBOX.>"] } },
            { user: "__NATS_DNS_REPLICA_USER__", password: "__NATS_DNS_REPLICA_PASSWORD__", permissions = { publish = ["lancache.dns.flush", "lancache.dns.record", "$$JS.API.STREAM.INFO.LANCACHE_DNS", "$$JS.API.STREAM.CREATE.LANCACHE_DNS", "$$JS.API.CONSUMER.INFO.LANCACHE_DNS.>", "$$JS.API.CONSUMER.CREATE.LANCACHE_DNS.>", "$$JS.API.CONSUMER.DURABLE.CREATE.LANCACHE_DNS.>", "$$JS.API.CONSUMER.MSG.NEXT.LANCACHE_DNS.>", "$$JS.ACK.LANCACHE_DNS.>"], subscribe = ["lancache.dns.>", "_INBOX.>"] } },
            { user: "__NATS_CALLOUT_USER__", password: "__NATS_CALLOUT_PASSWORD__" }
          ]
          include "auth_callout.conf"
        }
        accounts { SYS: { users: [ { user: "__NATS_SYS_USER__", password: "__NATS_SYS_PASSWORD__" } ] } }
        system_account: SYS
        EOF
        sed -e "s|__NATS_UI_USER__|$$(escape_sed "$$NATS_UI_USER")|g" -e "s|__NATS_UI_PASSWORD__|$$(escape_sed "$$NATS_UI_PASSWORD")|g" -e "s|__NATS_DNS_WRITER_USER__|$$(escape_sed "$$NATS_DNS_WRITER_USER")|g" -e "s|__NATS_DNS_WRITER_PASSWORD__|$$(escape_sed "$$NATS_DNS_WRITER_PASSWORD")|g" -e "s|__NATS_DNS_REPLICA_USER__|$$(escape_sed "$$NATS_DNS_REPLICA_USER")|g" -e "s|__NATS_DNS_REPLICA_PASSWORD__|$$(escape_sed "$$NATS_DNS_REPLICA_PASSWORD")|g" -e "s|__NATS_CALLOUT_USER__|$$(escape_sed "$$NATS_CALLOUT_USER")|g" -e "s|__NATS_CALLOUT_PASSWORD__|$$(escape_sed "$$NATS_CALLOUT_PASSWORD")|g" -e "s|__NATS_SYS_USER__|$$(escape_sed "$$NATS_SYS_USER")|g" -e "s|__NATS_SYS_PASSWORD__|$$(escape_sed "$$NATS_SYS_PASSWORD")|g" /tmp/nats.conf.template > "$$tmp_nats_conf"
        chown 10001:10001 "$$tmp_nats_conf"
        mv "$$tmp_nats_conf" /etc/nats/nats.conf
        trap - EXIT
        if [ ! -e /etc/nats/auth_callout.conf ]; then : > /etc/nats/auth_callout.conf; chown 10001:10001 /etc/nats/auth_callout.conf; fi
        exec nats-server -c /etc/nats/nats.conf
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ../../scripts/lib/shared-secret-bootstrap.sh:/usr/local/lib/shared-secret-bootstrap.sh:ro
      - ${NATS_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats}:/data
      - ${NATS_CONF_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats-conf}:/etc/nats
      - nats-logs:/var/log/lancache-nats
    environment:
      - NATS_UI_USER=${NATS_UI_USER:?NATS_UI_USER is required}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_DNS_REPLICA_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_DNS_REPLICA_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      - NATS_CALLOUT_USER=${NATS_CALLOUT_USER:?NATS_CALLOUT_USER is required}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      - NATS_SYS_USER=${NATS_SYS_USER:?NATS_SYS_USER is required}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
    expose:
      - "4222"
      - "8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  syslog:
    container_name: lancache-syslog
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/syslog:${LANCACHE_IMAGE_TAG:-latest}
    profiles: [logging]
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    environment:
      - SYSLOG_MAX_FILE_MB=${SYSLOG_MAX_FILE_MB:-100}
      - SYSLOG_COMPRESSION_LEVEL=${SYSLOG_COMPRESSION_LEVEL:-19}
      - SYSLOG_NG_ROTATE_INTERVAL_SECONDS=${SYSLOG_NG_ROTATE_INTERVAL_SECONDS:-300}
      - DATA_LOSS_CHECK_INTERVAL_SECONDS=${DATA_LOSS_CHECK_INTERVAL_SECONDS:-60}
    volumes:
      - proxy-logs:/var/log/nginx:ro
      - logs:/var/log/lancache
      - syslog-data:/data
      - dns-logs-standard:/var/log/lancache-dns-standard:ro
      - dns-logs-ssl:/var/log/lancache-dns-ssl:ro
      - dhcp-logs:/var/log/kea:ro
      - dhcp-proxy-logs:/var/log/lancache-dhcp-proxy:ro
      - ui-logs:/var/log/lancache-ui:ro
      - watchdog-logs:/var/log/lancache-watchdog:ro
      - nats-logs:/var/log/lancache-nats:ro
      - netdata-logs:/var/log/lancache-netdata:ro
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:/var/log/lancache-syslog-ng
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  ui:
    container_name: lancache-ui
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ui-data:/data
      - ../../services/dns/cdn-domains.txt:/data/cdn-domains.txt
      - proxy-logs:/var/log/nginx:ro
      - proxy-cache:/var/cache/proxy:ro
      - ${PDNS_FILTER_STATE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/pdns-filter-state}:/var/lib/powerdns-state
      - ${NATS_CONF_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/nats-conf}:/etc/nats
      - ${KEA_DATA_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/kea}:/var/lib/kea
      - ui-logs:/var/log/lancache-ui
      - ${SYSLOG_NG_LOG_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/syslog-ng}:/var/log/lancache-syslog-ng:ro
      - watchdog-status:/var/run/watchdog:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      - DNS_STANDARD_SERVICE=dns-standard
      - DNS_SSL_SERVICE=dns-ssl
      - PROXY_SERVICE=proxy
      - SSL_ENABLED=${SSL_ENABLED:-1}
      - PROXY_STANDARD_URL=http://proxy
      - PROXY_SSL_URL=http://proxy
      - PROXY_SSL_SERVICE=proxy
      - STANDARD_LOG=/var/log/nginx/access.log
      - SSL_LOG=/var/log/nginx/access.log
      - CACHE_DIR=/var/cache/proxy
      - NETDATA_URL=http://netdata:19999
      - NETDATA_ALARM_TOKEN=${NETDATA_ALARM_TOKEN}
      - CACHE_MAX_GB=${CACHE_MAX_GB:-${STANDARD_CACHE_MAX_GB:-${SSL_CACHE_MAX_GB:-}}}
      - STANDARD_IP=${IP_STANDARD}
      - SSL_IP=${IP_SSL}
      - DNS_STANDARD_STATE_DIR=/var/lib/powerdns-state
      - DNS_SSL_STATE_DIR=/var/lib/powerdns-state
      - LANCACHE_IMAGE_REGISTRY=${LANCACHE_IMAGE_REGISTRY:-ghcr.io}
      - LANCACHE_IMAGE_PREFIX=${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}
      - LANCACHE_IMAGE_CHANNEL=${LANCACHE_IMAGE_CHANNEL:-}
      - LANCACHE_IMAGE_TAG=${LANCACHE_IMAGE_TAG:-latest}
      - UI_AUTH_USER=${UI_AUTH_USER:-}
      - UI_AUTH_PASSWORD=${UI_AUTH_PASSWORD:-}
      - ALLOW_INSECURE_UI=${ALLOW_INSECURE_UI:-false}
      - UI_SESSION_TTL_SECONDS=${UI_SESSION_TTL_SECONDS:-86400}
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - DHCP_API_URL=http://host.docker.internal:8000
      - DHCP_API_TOKEN=${KEA_CTRL_TOKEN}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
      - PDNS_AUTH_URL=http://dns-standard:8081
      - PDNS_REC_URL=http://dns-standard:8082
      - DNS_ROLLBACK_URL=http://dns-standard:8083
      - PDNS_API_KEY=${PDNS_API_KEY}
      - NATS_URL=nats://nats:4222
      - NATS_BIND_IP=${NATS_BIND_IP:-}
      - NATS_ADVERTISE_URL=${NATS_ADVERTISE_URL:-}
      - NATS_UI_USER=${NATS_UI_USER:?NATS_UI_USER is required}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_DNS_REPLICA_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_DNS_REPLICA_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      - NATS_CALLOUT_USER=${NATS_CALLOUT_USER:?NATS_CALLOUT_USER is required}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      - NATS_SYS_USER=${NATS_SYS_USER:?NATS_SYS_USER is required}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
      - SECONDARY_REGISTRATION_TOKEN=${SECONDARY_REGISTRATION_TOKEN}
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
      - SYSLOG_LOG_ROOT=/var/log/lancache-syslog-ng
      - SYSLOG_MAX_GB=${SYSLOG_MAX_GB:-10}
      - SYSLOG_RETENTION_DAYS=${SYSLOG_RETENTION_DAYS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - docker-api
      - netdata-net
    # The Admin UI is an operator recovery surface. Its Docker client already
    # handles an unavailable proxy, so creation must not be blocked on proxy
    # health when the dashboard itself may be needed to diagnose recovery.
    depends_on:
      docker-socket-proxy:
        condition: service_started
      proxy:
        condition: service_started
      netdata:
        condition: service_started
      nats:
        condition: service_started
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  netdata:
    container_name: lancache-netdata
    image: netdata/netdata@sha256:a130dbbf3d6e6a5472efdebaa123797190a5822627e908106d34edae02bc8a74
    hostname: lancache-netdata
    pid: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        set -e
        cat > /etc/netdata/netdata.conf <<'CONF'
        [logs]
        daemon = /var/log/netdata/daemon.file.log
        health = /var/log/netdata/health.file.log
        CONF
        # Keep the health.d custom sender bound to the same shared token the
        # Admin UI validates, so alarm delivery remains authenticated after
        # Netdata is moved onto its dedicated network.
        . /usr/local/lib/shared-secret-bootstrap.sh
        if secret_is_placeholder "$${NETDATA_ALARM_TOKEN:-}"; then
          NETDATA_ALARM_TOKEN=""
        fi
        if ! NETDATA_ALARM_TOKEN="$$(resolve_shared_secret netdata-alarm-token "$${NETDATA_ALARM_TOKEN:-}" lancache_gen_hex32)"; then
          echo "[lancache-netdata] FATAL: NETDATA_ALARM_TOKEN is unset/placeholder and the shared-secrets volume is not writable." >&2
          exit 1
        fi
        umask 077
        printf '%s\n' "$$NETDATA_ALARM_TOKEN" > /etc/netdata/.netdata-alarm-token
        chmod 0600 /etc/netdata/.netdata-alarm-token
        chown netdata:netdata /etc/netdata/.netdata-alarm-token
        cat > /etc/netdata/health_alarm_notify.conf <<'CONF'
        SEND_CUSTOM="YES"
        DEFAULT_RECIPIENT_CUSTOM="lancache-ui"
        custom_sender() {
          local token payload
          token="$$(cat /etc/netdata/.netdata-alarm-token)"
          payload="$$(printf '{"alarm_id":"%s","name":"%s","status":"%s","value":"%s","old_value":"%s","info":"%s"}' "$$alarm_id" "$$name" "$$status" "$$value" "$$old_value" "$$info")"
          curl -fsS --max-time 5 -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' -d "$$payload" http://ui:8080/api/netdata-alarms >/dev/null
        }
        CONF
        exec /usr/sbin/run.sh
    environment:
      - NETDATA_ALARM_TOKEN=${NETDATA_ALARM_TOKEN:-}
    volumes:
      - shared-secrets:/var/lib/lancache-secrets
      - ../../scripts/lib/shared-secret-bootstrap.sh:/usr/local/lib/shared-secret-bootstrap.sh:ro
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdata-logs:/var/log/netdata
      - logs:/var/log/lancache:ro
      - ../../services/syslog/netdata-web_log.conf:/etc/netdata/go.d/web_log.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19999/api/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - netdata-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  docker-api:
    internal: true
  netdata-net: {}

volumes:
  shared-secrets:
  proxy-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CACHE_DIR:-${LANCACHE_STATE_DIR:-/opt/lancache-ng}/cache}
  proxy-logs:
  proxy-certs:
  proxy-config-snapshots:
  dhcp-proxy-config-snapshots:
  pdns-config-snapshots-standard:
  pdns-config-snapshots-ssl:
  watchdog-status:
  retention-state:
  netdataconfig:
  netdatalib:
  netdatacache:
  ui-data:
  logs:
  syslog-data:
  dns-logs-standard:
  dns-logs-ssl:
  dhcp-logs:
  dhcp-proxy-logs:
  ui-logs:
  watchdog-logs:
  nats-logs:
  netdata-logs:
  ntp-logs:
