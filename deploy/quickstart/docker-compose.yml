# lancache-ng (https://github.com/wiki-mod/lancache-ng)
#
# LanCache-NG — Quickstart (no repo clone needed)
#
# Prerequisites:
#   1. Run setup.sh — configures .env and starts everything automatically
#      Or manually:
#   2. Edit .env: adjust IPs and the shared cache path
#   3. Create the cache directory:
#        mkdir -p /opt/lancache-ng/cache
#   4. (optional) Add second LAN IP:
#        ip addr add 192.168.234.11/24 dev eth0
#   5. Start:
#        docker compose pull && docker compose up -d
#   6. Get CA certificate for SSL mode (after first start):
#        ./certs/ca.crt → install on clients (docs: github.com/wiki-mod/lancache-ng)
#
# Customize domain lists: via Admin UI (port 8080) or
# mount custom files (see deploy/prod/docker-compose.yml in repo).

name: lancache-ng

# The Docker socket proxy's HAProxy allowlist lives in exactly one place,
# scripts/docker-socket-proxy.sh (mounted read-only below), which is the
# canonical source per docs/naming-conventions.md. This file used to also
# carry an unreferenced x-docker-socket-proxy-command YAML anchor with a
# near-duplicate copy of that same config -- it was never aliased anywhere
# (dead weight that could silently drift from the real script with no
# functional effect) and has been removed.
#
# LANCACHE_CONTAINER_SUFFIX (issue #1415): every container_name: below is
# `lancache-<service>${LANCACHE_CONTAINER_SUFFIX:-}`. Left unset (the
# default, and the only supported value for a real single-host install --
# see docs/naming-conventions.md and issue #849 finding #5 for why these 14
# names are otherwise fixed by design), every name resolves to the plain
# `lancache-<service>` literal, so scripts/docker-socket-proxy.sh's HAProxy allowlist,
# services/watchdog/watchdog.sh's CONTAINER_* FATAL guard, and
# services/ui/src/docker_client.rs's hardcoded match arms all keep working
# unchanged. This variable exists ONLY so CI can run more than one
# concurrent quickstart-compose stack on the same physical runner host
# (several runner instances can share one Docker daemon -- see #1415):
# COMPOSE_PROJECT_NAME already gives each CI run its own unique value, but
# an explicit container_name: overrides Compose's own project-name-based
# isolation entirely, which is exactly what let two concurrent CI runs
# collide on the identical fixed name despite already having distinct
# project names. Setting this suffix to something derived from that same
# per-run uniqueness (see scripts/setup-cli-simulation.sh's
# sim_compose_project_name()) restores real per-run isolation without
# touching the fixed-name contract real installs depend on. The
# docker-socket-proxy and watchdog services below also receive this same
# variable so their own name-matching logic (an HAProxy allowlist regex,
# and a fail-loud CONTAINER_* comparison) can generalize their otherwise-
# hardcoded expectations to the exact suffixed name actually in use for
# that run, without depending on the general Compose CI-name pattern.

services:

  # ── Unified proxy (standard + SSL mode in one container) ─────────────────
  proxy:
    container_name: lancache-proxy${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/proxy:${LANCACHE_IMAGE_TAG:-latest}
    environment:
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE}
      - CACHE_MEM_MB=${CACHE_MEM_MB}
      - CACHE_INACTIVE=${CACHE_INACTIVE}
      - CACHE_SLICE_SIZE=${CACHE_SLICE_SIZE}
      - CACHE_VALID_HIT=${CACHE_VALID_HIT}
      - CACHE_VALID_ANY=${CACHE_VALID_ANY}
      - IP_STANDARD=${IP_STANDARD}
      - IP_SSL=${IP_SSL}
      - SSL_ENABLED=${SSL_ENABLED:-0}
      - NGINX_UPSTREAM_RESOLVER=${NGINX_UPSTREAM_RESOLVER}
      - PROXY_SECURITY_MODE=${PROXY_SECURITY_MODE:-lazy}
      - PROXY_ALLOWED_CLIENT_CIDRS=${PROXY_ALLOWED_CLIENT_CIDRS:-}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
    volumes:
      - ./certs:/etc/nginx/ssl/ca
      # One host cache directory is mounted into the unified proxy. Older
      # standard/ssl split-cache installs must be migrated before using this stack.
      - ${CACHE_DIR:?CACHE_DIR is required}:/var/cache/nginx/lancache
      - proxy-logs:/var/log/nginx
      # Known-good nginx config snapshots (#415): persistent, service-owned
      # volume so rollback survives container restarts/recreates.
      - proxy-config-snapshots:/var/lib/lancache-proxy
    ports:
      - "${IP_STANDARD}:80:80"
      - "${IP_STANDARD}:443:8443"
      - "${IP_SSL:-127.0.0.1}:80:80"
      - "${IP_SSL:-127.0.0.1}:443:443"
    healthcheck:
      # Since #1276/#1322: see deploy/prod/docker-compose.yml's matching
      # comment -- container port 443 is now the stream-level SNI dispatch
      # listener, which has no SNI to route on for an IP-literal curl target.
      # Retargeted at conf.d/https.conf's dedicated, non-PROXY-protocol
      # healthcheck port (8445) instead.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/healthz >/dev/null && { [ \"$${SSL_ENABLED:-0}\" != \"1\" ] || curl -ksf https://127.0.0.1:8445/healthz >/dev/null; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  nats:
    container_name: lancache-nats${LANCACHE_CONTAINER_SUFFIX:-}
    image: nats:2-alpine@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
    # Boot-time job (idempotent, safely re-run on every start/restart):
    # regenerate ONLY this container's own static half of the config --
    # nats.conf with jetstream, log_file, and the four static roles (UI,
    # DNS-writer, DNS-replica, and the Admin UI's auth-callout responder user)
    # -- from the NATS_* env below, chown it back to the Admin UI user, then
    # exec nats-server. The auth_callout {} stanza is deliberately NOT written
    # here: it needs the Admin UI's runtime-generated issuer public key this
    # container cannot know. Instead nats.conf `include`s a separate
    # auth_callout.conf fragment that ONLY the Admin UI writes
    # (services/ui/src/routes/secondaries.rs::update_nats_conf; see
    # services/ui/src/nats_auth_callout.rs for the full flow, issue #583).
    #
    # This split is the whole point of issue #811's fix: regenerating the
    # static subset on every restart is now safe because it never touches the
    # UI's fragment -- exactly the convergence discipline pdns/kea/nginx/
    # dhcp-proxy already follow. Previously this entrypoint wrote the WHOLE
    # config unconditionally, so the Admin UI's restart -- which is REQUIRED to
    # apply auth_callout, since nats-server explicitly refuses to hot-reload it
    # ("config reload not supported for AuthCallout", verified against
    # nats-server 2.14.3) -- re-ran this script and clobbered the UI's
    # auth_callout every single time, permanently breaking the callout. Keeping
    # the static subset here also keeps full recreates with rotated .env
    # credentials convergent even before the UI's first write.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Shared-secret bootstrap (#858): resolve the four NATS_*_PASSWORD
        # handshake secrets from the shared-secrets volume so nats-server and its
        # clients (Admin UI, dns writer/replica) agree even when .env left them
        # empty/placeholder. Sources the same tested helper the dns/dhcp/ui
        # entrypoints embed (mounted read-only below).
        . /usr/local/lib/shared-secret-bootstrap.sh
        # Fail closed (Codex review, PR #886): resolve_shared_secret only returns
        # non-zero when the shared-secrets volume itself is unwritable -- silently
        # keeping the empty/placeholder value here would let nats-server boot with
        # empty static-user passwords instead of refusing to start. Matches the
        # same guard added to deploy/prod/docker-compose.yml.
        if secret_is_placeholder "$$NATS_UI_PASSWORD"; then NATS_UI_PASSWORD=""; fi
        if ! NATS_UI_PASSWORD="$$(resolve_shared_secret nats-ui-password "$$NATS_UI_PASSWORD" lancache_gen_hex32)"; then
          echo "[lancache-nats] FATAL: NATS_UI_PASSWORD is unset/placeholder and the shared-secrets volume is not writable, so no shared password could be generated." >&2
          echo "[lancache-nats] Mount the shared-secrets volume, or set NATS_UI_PASSWORD to a real value (openssl rand -hex 32)." >&2
          exit 1
        fi
        if secret_is_placeholder "$$NATS_DNS_WRITER_PASSWORD"; then NATS_DNS_WRITER_PASSWORD=""; fi
        if ! NATS_DNS_WRITER_PASSWORD="$$(resolve_shared_secret nats-dns-writer-password "$$NATS_DNS_WRITER_PASSWORD" lancache_gen_hex32)"; then
          echo "[lancache-nats] FATAL: NATS_DNS_WRITER_PASSWORD is unset/placeholder and the shared-secrets volume is not writable, so no shared password could be generated." >&2
          echo "[lancache-nats] Mount the shared-secrets volume, or set NATS_DNS_WRITER_PASSWORD to a real value (openssl rand -hex 32)." >&2
          exit 1
        fi
        if secret_is_placeholder "$$NATS_DNS_REPLICA_PASSWORD"; then NATS_DNS_REPLICA_PASSWORD=""; fi
        if ! NATS_DNS_REPLICA_PASSWORD="$$(resolve_shared_secret nats-dns-replica-password "$$NATS_DNS_REPLICA_PASSWORD" lancache_gen_hex32)"; then
          echo "[lancache-nats] FATAL: NATS_DNS_REPLICA_PASSWORD is unset/placeholder and the shared-secrets volume is not writable, so no shared password could be generated." >&2
          echo "[lancache-nats] Mount the shared-secrets volume, or set NATS_DNS_REPLICA_PASSWORD to a real value (openssl rand -hex 32)." >&2
          exit 1
        fi
        if secret_is_placeholder "$$NATS_CALLOUT_PASSWORD"; then NATS_CALLOUT_PASSWORD=""; fi
        if ! NATS_CALLOUT_PASSWORD="$$(resolve_shared_secret nats-callout-password "$$NATS_CALLOUT_PASSWORD" lancache_gen_hex32)"; then
          echo "[lancache-nats] FATAL: NATS_CALLOUT_PASSWORD is unset/placeholder and the shared-secrets volume is not writable, so no shared password could be generated." >&2
          echo "[lancache-nats] Mount the shared-secrets volume, or set NATS_CALLOUT_PASSWORD to a real value (openssl rand -hex 32)." >&2
          exit 1
        fi
        # Issue #681: the Admin UI's system-account identity, used ONLY to look
        # up (CONNZ) and force-disconnect ($$SYS.REQ.SERVER.<id>.KICK) a removed/
        # rotated secondary's live connection. Every other static role above
        # lives in the implicit default account ($$G); this one is deliberately
        # the sole member of a new `SYS` account (see the `accounts {}` block
        # below), because nats-server only exposes the $$SYS.REQ.SERVER.*
        # system-services API to system-account clients -- confirmed against a
        # real nats-server 2.14.3 (see nats_kick.rs's module docs).
        if secret_is_placeholder "$$NATS_SYS_PASSWORD"; then NATS_SYS_PASSWORD=""; fi
        if ! NATS_SYS_PASSWORD="$$(resolve_shared_secret nats-sys-password "$$NATS_SYS_PASSWORD" lancache_gen_hex32)"; then
          echo "[lancache-nats] FATAL: NATS_SYS_PASSWORD is unset/placeholder and the shared-secrets volume is not writable, so no shared password could be generated." >&2
          echo "[lancache-nats] Mount the shared-secrets volume, or set NATS_SYS_PASSWORD to a real value (openssl rand -hex 32)." >&2
          exit 1
        fi
        mkdir -p /etc/nats
        mkdir -p /var/log/lancache-nats
        escape_sed() {
          printf '%s' "$$1" | sed 's/[\/&|]/\\&/g'
        }
        # Keep the shared config writable by the Admin UI user (UID/GID 10001) after NATS restarts.
        tmp_nats_conf="$(mktemp /etc/nats/.nats.conf.XXXXXX)"
        trap 'rm -f "$$tmp_nats_conf"' EXIT
        cat > /tmp/nats.conf.template <<'EOF'
        jetstream {
          store_dir: /data
        }
        # Monitor endpoint: nats-server shipped with no HTTP monitor
        # listening (no http_port set), so the Docker healthcheck below and
        # Netdata's go.d NATS collector both saw a hard connection refused
        # against :8222 on every attempt -- not a timing issue, the port
        # simply never opened. Verified live against this pinned image
        # (nats-server 2.14.3): once set, /healthz and /varz answer
        # immediately after "Server is ready". Only reachable from other
        # containers on this compose network -- not published to the host --
        # and carries no secrets of its own (nats-server's monitor endpoint
        # has no built-in auth).
        http_port: 8222
        # Central logging pipeline (#633): nats-server logs to exactly one
        # destination -- setting this disables stdout for the process
        # lifetime (no dual-output mode exists, unlike Kea's
        # "output-options" array), so `docker logs` on this container goes
        # quiet while the `logging` compose profile is active; fluent-bit
        # tails this file instead. Since issue #811 this entrypoint's nats.conf
        # is the SOLE governor of log_file: the Admin UI now writes only the
        # auth_callout.conf fragment (which carries no log_file directive), so
        # this literal value -- the same path config.rs's NATS_LOG_FILE
        # defaults to -- is authoritative for the process lifetime.
        log_file: /var/log/lancache-nats/nats.log
        authorization {
          users = [
            {
              user: "__NATS_UI_USER__"
              password: "__NATS_UI_PASSWORD__"
              permissions = {
                publish = ["lancache.dns.record", "lancache.dns.flush"]
              }
            }
            {
              user: "__NATS_DNS_WRITER_USER__"
              password: "__NATS_DNS_WRITER_PASSWORD__"
              permissions = {
                publish = [
                  "lancache.dns.record",
                  # The zone-rollback listener (rollback_listener.rs,
                  # dns-standard's own identity) publishes a post-rollback
                  # cache-flush on this subject. Without it here, the
                  # publish was silently denied by nats-server and the
                  # recursor never actually flushed the stale
                  # rolled-back-away answer -- see that file's
                  # rollback_handler doc comment.
                  "lancache.dns.flush",
                  "$$JS.API.STREAM.INFO.LANCACHE_DNS",
                  "$$JS.API.STREAM.CREATE.LANCACHE_DNS",
                  "$$JS.API.CONSUMER.INFO.LANCACHE_DNS.>",
                  "$$JS.API.CONSUMER.CREATE.LANCACHE_DNS.>",
                  "$$JS.API.CONSUMER.DURABLE.CREATE.LANCACHE_DNS.>",
                  "$$JS.API.CONSUMER.MSG.NEXT.LANCACHE_DNS.>",
                  "$$JS.ACK.LANCACHE_DNS.>"
                ]
                subscribe = ["lancache.dns.>", "_INBOX.>"]
              }
            }
            {
              user: "__NATS_DNS_REPLICA_USER__"
              password: "__NATS_DNS_REPLICA_PASSWORD__"
              permissions = {
                publish = [
                  # Same reasoning as the writer identity above --
                  # dns-ssl's own nats-subscriber runs the same rollback
                  # listener and needs to publish the post-rollback
                  # cache-flush too.
                  "lancache.dns.flush",
                  # publish_rollback_records (rollback_listener.rs, called
                  # for zone == "lan.") republishes restored records on
                  # this subject under whichever identity runs the rollback
                  # listener -- the writer identity above already had this;
                  # dns-ssl's replica identity did not. Not reachable today
                  # (DNS_ROLLBACK_URL always defaults to dns-standard:8083),
                  # but if it were ever pointed at dns-ssl, the republish
                  # would be silently denied and secondaries would not
                  # converge after a lan. rollback. Deliberate tradeoff,
                  # accepted by the maintainer: widens what a compromised
                  # dns-ssl credential could do (forge/replicate DNS records
                  # via this subject, not just signal a cache-flush) rather
                  # than adding a fail-closed guard in the listener itself.
                  "lancache.dns.record",
                  # Finding D (docs/bug-hunt/nats.md): nats-subscriber's
                  # main() calls js.get_stream("LANCACHE_DNS") at startup and,
                  # on failure, js.create_stream(...), exiting via
                  # std::process::exit(1) if that create is denied too. The
                  # writer identity above already carries STREAM.CREATE for
                  # exactly this reason; the replica needs it too so that if
                  # it is ever the first identity to connect (before the
                  # stream exists), its own create_stream call is not
                  # silently denied and does not crash-loop the container.
                  "$$JS.API.STREAM.INFO.LANCACHE_DNS",
                  "$$JS.API.STREAM.CREATE.LANCACHE_DNS",
                  "$$JS.API.CONSUMER.INFO.LANCACHE_DNS.>",
                  "$$JS.API.CONSUMER.CREATE.LANCACHE_DNS.>",
                  "$$JS.API.CONSUMER.DURABLE.CREATE.LANCACHE_DNS.>",
                  "$$JS.API.CONSUMER.MSG.NEXT.LANCACHE_DNS.>",
                  "$$JS.ACK.LANCACHE_DNS.>"
                ]
                subscribe = ["lancache.dns.>", "_INBOX.>"]
              }
            }
            {
              # The Admin UI's own auth-callout responder connection identity
              # (services/ui/src/nats_auth_callout.rs). It carries no subject
              # permissions -- it only answers auth-callout requests. It is a
              # STATIC user (not routed through the callout) because the UI's
              # fragment lists it in auth_users, so nats-server checks its
              # password against this list. Must stay in lockstep with the ui
              # service's NATS_CALLOUT_USER/PASSWORD (the same compose vars feed
              # both services below) -- if they ever diverge the responder can't
              # connect and the callout silently fails.
              user: "__NATS_CALLOUT_USER__"
              password: "__NATS_CALLOUT_PASSWORD__"
            }
          ]
          # The auth_callout {} stanza lives in a SEPARATE file that only the
          # Admin UI writes (routes/secondaries.rs::update_nats_conf), because
          # it needs the UI's runtime-generated issuer public key this container
          # can't know. Including it -- rather than embedding it -- is what lets
          # this entrypoint keep regenerating its own static subset above on
          # every restart without ever clobbering the UI's fragment (issue
          # #811). nats-server resolves this path relative to nats.conf's own
          # directory (/etc/nats). The placeholder-creation step below
          # guarantees the target always exists before nats-server starts: a
          # missing include file is a FATAL boot error (verified against
          # nats-server 2.14.3), while an empty one is valid (no callout active
          # yet). `include` inside authorization {} is supported and the
          # included auth_callout goes fully live -- also verified against 2.14.3.
          include "auth_callout.conf"
        }
        # Issue #681: a minimal system account, additive alongside the flat
        # `authorization {}` block above -- confirmed against a real
        # nats-server 2.14.3 that the two coexist with no effect on where the
        # four static roles/callout-authenticated secondaries live (still the
        # implicit default account, $$G) or on JetStream's LANCACHE_DNS stream
        # (still owned by $$G, unaffected). This is the ONLY account this
        # process is a member of, and it carries no application subject
        # permissions of its own -- it exists solely so the Admin UI can reach
        # the $$SYS.REQ.SERVER.* system-services API (CONNZ to look up a
        # secondary's live connection ID, KICK to force-disconnect it), which
        # nats-server does not expose to $$G clients at all.
        accounts {
          SYS: {
            users: [
              { user: "__NATS_SYS_USER__", password: "__NATS_SYS_PASSWORD__" }
            ]
          }
        }
        system_account: SYS
        EOF
        sed \
          -e "s|__NATS_UI_USER__|$$(escape_sed "$$NATS_UI_USER")|g" \
          -e "s|__NATS_UI_PASSWORD__|$$(escape_sed "$$NATS_UI_PASSWORD")|g" \
          -e "s|__NATS_DNS_WRITER_USER__|$$(escape_sed "$$NATS_DNS_WRITER_USER")|g" \
          -e "s|__NATS_DNS_WRITER_PASSWORD__|$$(escape_sed "$$NATS_DNS_WRITER_PASSWORD")|g" \
          -e "s|__NATS_DNS_REPLICA_USER__|$$(escape_sed "$$NATS_DNS_REPLICA_USER")|g" \
          -e "s|__NATS_DNS_REPLICA_PASSWORD__|$$(escape_sed "$$NATS_DNS_REPLICA_PASSWORD")|g" \
          -e "s|__NATS_CALLOUT_USER__|$$(escape_sed "$$NATS_CALLOUT_USER")|g" \
          -e "s|__NATS_CALLOUT_PASSWORD__|$$(escape_sed "$$NATS_CALLOUT_PASSWORD")|g" \
          -e "s|__NATS_SYS_USER__|$$(escape_sed "$$NATS_SYS_USER")|g" \
          -e "s|__NATS_SYS_PASSWORD__|$$(escape_sed "$$NATS_SYS_PASSWORD")|g" \
          /tmp/nats.conf.template > "$$tmp_nats_conf"
        chown 10001:10001 "$$tmp_nats_conf"
        mv "$$tmp_nats_conf" /etc/nats/nats.conf
        trap - EXIT
        # Guarantee the UI-owned auth_callout fragment exists before starting
        # nats-server: a missing `include` target is a FATAL boot error, and on
        # a fresh volume the Admin UI has not written it yet. Create an EMPTY
        # placeholder ONLY when absent (an empty include is valid = no callout
        # yet) so nats-server can boot and the UI can connect as its static user
        # to write the real fragment. NEVER overwrite an existing one: once the
        # UI has written the real auth_callout {} block, every subsequent
        # restart re-runs this script and must leave that fragment untouched, or
        # we reintroduce issue #811's clobber.
        if [ ! -e /etc/nats/auth_callout.conf ]; then
          : > /etc/nats/auth_callout.conf
          chown 10001:10001 /etc/nats/auth_callout.conf
        fi
        exec nats-server -c /etc/nats/nats.conf
    environment:
      - NATS_UI_USER=${NATS_UI_USER:?NATS_UI_USER is required}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_DNS_REPLICA_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_DNS_REPLICA_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      # The auth-callout responder's static bypass identity. MUST match the ui
      # service's NATS_CALLOUT_USER/PASSWORD (same compose vars): the ui process
      # connects the responder with these creds and nats-server authenticates it
      # against the static user this entrypoint writes above (issue #811 / #583).
      - NATS_CALLOUT_USER=${NATS_CALLOUT_USER:?NATS_CALLOUT_USER is required}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      # Issue #681: system-account identity (see the entrypoint's `accounts {}`
      # comment above). MUST match the ui service's NATS_SYS_USER/PASSWORD.
      - NATS_SYS_USER=${NATS_SYS_USER:?NATS_SYS_USER is required}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
    volumes:
      # Shared-secret bootstrap (#858): first-writer-wins NATS_*_PASSWORD, plus the
      # canonical helper (installed into ./scripts by setup.sh) sourced above.
      - shared-secrets:/var/lib/lancache-secrets
      - ./scripts/shared-secret-bootstrap.sh:/usr/local/lib/shared-secret-bootstrap.sh:ro
      - nats-data:/data
      - nats-conf:/etc/nats
      # Central logging pipeline (#633): this entrypoint's nats.conf sets
      # `log_file: /var/log/lancache-nats/nats.log` (the UI's auth_callout.conf
      # fragment carries no log_file since issue #811); fluent-bit tails it.
      - nats-logs:/var/log/lancache-nats
    healthcheck:
      # Real HTTP probe against the monitor endpoint (http_port: 8222 in the
      # entrypoint above), not just a bare TCP connect -- proves nats-server's
      # HTTP monitor is actually answering, not merely that something is
      # listening on the port. Uses wget (BusyBox), not curl: verified
      # empirically that nats:2-alpine ships BusyBox's wget/nc but no curl.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Central logging: syslog + fluent-bit combined container (issue #453/#633
  # baseline superseded here; see this PR for the full rationale) ───────────
  # Replaces the previous two separate services (`syslog` = fluent-bit
  # collector/forwarder, `syslog-ng` = central receiver) with ONE container
  # running both -- a deliberate maintainer decision to accept crash-coupling
  # and a single Docker HEALTHCHECK slot (mitigated below by a real
  # dual-process check + structured status file) in exchange for one image
  # to build/scan/patch instead of two. See services/syslog/Dockerfile's own
  # header for the full real-vs-POC comparison this PR ran on a self-hosted
  # runner: the exact pinned fluent-bit binary bundled with its glibc closure
  # into a stable (non-edge) Alpine base, the two privileged-port/capability
  # findings that contradicted the original POC's assumptions, and the
  # `set -eu`/`wait -n` errexit bug this PR's own verification caught and
  # fixed. `profiles: [logging]` is unchanged from before (issue #1343:
  # on by default for setup.sh-managed installs, still off by default for a
  # from-scratch manual deploy/quickstart install, matching ntp/dhcp-kea/
  # dhcp-proxy's sibling profile-gating convention).
  #
  # `logs-syslog-ng` below is a NAMED volume (unlike prod's bind-mounted
  # SYSLOG_NG_LOG_DIR): a fresh named volume inherits its mount point's
  # in-image ownership when Docker first populates it (confirmed Docker
  # behavior for a destination path that already exists with content in the
  # image), and this image's Dockerfile already chowns
  # /var/log/lancache-syslog-ng to uid 10001 at build time -- so quickstart
  # does not depend on setup.sh's separate bind-mount pre-chown step the way
  # prod does. The data-loss detector below still applies regardless (e.g.
  # a volume created by an older image version, or reused across an
  # upgrade Docker does not re-populate).
  syslog:
    container_name: lancache-syslog${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/syslog:${LANCACHE_IMAGE_TAG:-latest}
    profiles: [logging]
    # Least-privilege posture, empirically determined (see Dockerfile's own
    # extensive comment for the full methodology and the two dead-end
    # designs -- a runtime su-exec privilege drop, and plain
    # `cap_add: DAC_READ_SEARCH` alone -- this PR tried and disproved before
    # arriving here): the whole container runs as fixed non-root uid 10001
    # (Dockerfile USER), with exactly ONE added capability so fluent-bit can
    # read today's root:root 0640 producer logs it doesn't own.
    # DAC_READ_SEARCH (read-only bypass) is narrower than the POC's own
    # proposed CAP_DAC_OVERRIDE (read+write bypass) -- verified live that the
    # narrower capability is sufficient for fluent-bit's actual access
    # pattern. HARD INVARIANT (verified live): the fluent-bit interpreter
    # binary carries a matching `setcap` file capability baked into the
    # image, so running this exact image WITHOUT `cap_add: [DAC_READ_SEARCH]`
    # fails closed at exec (not a silent capability downgrade) -- never
    # remove one side of this pair without the other.
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    environment:
      - SYSLOG_MAX_FILE_MB=${SYSLOG_MAX_FILE_MB:-100}
      - SYSLOG_COMPRESSION_LEVEL=${SYSLOG_COMPRESSION_LEVEL:-19}
      - SYSLOG_NG_ROTATE_INTERVAL_SECONDS=${SYSLOG_NG_ROTATE_INTERVAL_SECONDS:-300}
      # Mandatory silent-data-loss hardening (this PR's task requirement,
      # not optional): entrypoint.sh's detector loop compares syslog-ng's own
      # "processed" stats counter against real bytes landing under
      # SYSLOG_NG_LOG_DIR every this-many seconds -- see
      # services/syslog/data-loss-detector.sh's header for the real,
      # reproduced bug this guards against and the live verification that it
      # both fires on the broken case and stays silent on the healthy one.
      - DATA_LOSS_CHECK_INTERVAL_SECONDS=${DATA_LOSS_CHECK_INTERVAL_SECONDS:-60}
    volumes:
      - proxy-logs:/var/log/nginx:ro
      - logs:/var/log/lancache
      - syslog-data:/data
      - dns-logs-standard:/var/log/lancache-dns-standard:ro
      - dns-logs-ssl:/var/log/lancache-dns-ssl:ro
      - dhcp-logs:/var/log/kea:ro
      - dhcp-proxy-logs:/var/log/lancache-dhcp-proxy:ro
      - ui-logs:/var/log/lancache-ui:ro
      - watchdog-logs:/var/log/lancache-watchdog:ro
      - nats-logs:/var/log/lancache-nats:ro
      - netdata-logs:/var/log/lancache-netdata:ro
      # Central log receiver destination (previously the separate
      # `syslog-ng` service's own mount, and briefly ALSO a second,
      # independent mount on a different balabit/syslog-ng container in
      # current_dev's #1420, merged concurrently with this PR -- that whole
      # second service is superseded by this one combined container, not
      # merged alongside it). This is a named volume (not a bind mount, see
      # deploy/prod/docker-compose.yml's own comment for why prod differs
      # here) -- Docker's own image-content inheritance for a fresh named
      # volume already gives it this Dockerfile's build-time chown to uid
      # 10001, so quickstart never hits the root:root ownership problem
      # prod's bind mount needs setup.sh/the data-loss detector to guard
      # against.
      - logs-syslog-ng:/var/log/lancache-syslog-ng
    # Real dual-process check (services/syslog/healthcheck.sh): verifies
    # fluent-bit AND syslog-ng independently and only reports healthy when
    # both are, writing a structured per-process status file (including
    # data_loss_alert_active) for a future Admin UI/watchdog integration --
    # the granularity fix for the POC's own documented "one Docker
    # HEALTHCHECK slot for two processes" gap. Already declared as this
    # image's own Dockerfile HEALTHCHECK; redeclared here explicitly to
    # match this compose file's existing per-service convention.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  dns-standard:
    container_name: lancache-dns-standard${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}
    environment:
      - PROXY_IP=${IP_STANDARD}
      - LOG_QUERIES=0
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      # Shared-secret bootstrap (#858): resolve NATS_PASSWORD against this role's
      # shared file so it matches the value the nats server generates.
      - NATS_PASSWORD_SHARED_SECRET=nats-dns-writer-password
      - NATS_CONSUMER=dns-standard
      - NATS_RECONCILER=1
      - PDNS_API_KEY=${PDNS_API_KEY:-}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY:-}
      # issue #706: without this, DDNS_ALLOW_FROM defaults to 127.0.0.1
      # (services/dns/entrypoint.sh), silently rejecting every DDNS update
      # from the dhcp container. Verified empirically that a DDNS update
      # from the dhcp container (network_mode: host) always arrives with
      # source = the host's primary LAN IP, i.e. IP_STANDARD in this
      # project's documented setup flow; IP_SSL is included as a low-cost
      # hedge -- TSIG (DDNS_TSIG_KEY above) is the real auth control either way.
      - DDNS_ALLOW_FROM=${IP_STANDARD},${IP_SSL:-}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
    volumes:
      # Shared-secret bootstrap (#858): first-writer-wins PDNS_API_KEY/DDNS_TSIG_KEY.
      - shared-secrets:/var/lib/lancache-secrets
      - pdns-data-standard:/var/lib/powerdns
      - pdns-filter-state:/var/lib/powerdns-state
      - pdns-config-snapshots-standard:/var/lib/lancache-dns
      # Central logging pipeline (#633): PowerDNS has no native file-log
      # directive (see services/dns/entrypoint.sh's run_auth/run_recursor,
      # which `tee` each daemon's stdout here instead).
      - dns-logs-standard:/var/log/lancache-dns
    depends_on:
      - nats
    ports:
      - "${IP_STANDARD}:53:53/udp"
      - "${IP_STANDARD}:53:53/tcp"
      # 5300/udp only (issue #706): see deploy/prod/docker-compose.yml's
      # identical publish on dns-standard for the full reasoning.
      - "${IP_STANDARD}:5300:5300/udp"
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 content1.steampowered.com A +short +time=2 +tries=1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  dns-ssl:
    profiles: [ssl]
    container_name: lancache-dns-ssl${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dns:${LANCACHE_IMAGE_TAG:-latest}
    environment:
      - PROXY_IP=${IP_SSL}
      - LOG_QUERIES=0
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      # Shared-secret bootstrap (#858): resolve NATS_PASSWORD against this role's
      # shared file so it matches the value the nats server generates.
      - NATS_PASSWORD_SHARED_SECRET=nats-dns-replica-password
      - NATS_CONSUMER=dns-ssl
      - PDNS_API_KEY=${PDNS_API_KEY:-}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY:-}
      # issue #706: see the identical DDNS_ALLOW_FROM override on
      # dns-standard above for the full reasoning -- this service needs the
      # same value (IP_STANDARD, not IP_SSL) because the empirically-
      # observed DDNS update source is always the host's primary LAN IP,
      # regardless of which of the two DNS servers Kea's D2 daemon targets.
      - DDNS_ALLOW_FROM=${IP_STANDARD},${IP_SSL:-}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
    volumes:
      # Shared-secret bootstrap (#858): first-writer-wins PDNS_API_KEY/DDNS_TSIG_KEY.
      - shared-secrets:/var/lib/lancache-secrets
      - pdns-data-ssl:/var/lib/powerdns
      - pdns-filter-state:/var/lib/powerdns-state
      - pdns-config-snapshots-ssl:/var/lib/lancache-dns
      # Central logging pipeline (#633): PowerDNS has no native file-log
      # directive (see services/dns/entrypoint.sh's run_auth/run_recursor,
      # which `tee` each daemon's stdout here instead).
      - dns-logs-ssl:/var/log/lancache-dns
    depends_on:
      - nats
    ports:
      - "${IP_SSL}:53:53/udp"
      - "${IP_SSL}:53:53/tcp"
      # 5300/udp only (issue #706): see deploy/prod/docker-compose.yml's
      # identical publish on dns-standard for the full reasoning.
      - "${IP_SSL}:5300:5300/udp"
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 content1.steampowered.com A +short +time=2 +tries=1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Watchdog (health monitoring, auto-restart, purge cron) ──────────────────
  # socket-proxy provides scoped Docker API access for UI and watchdog only.
  # A custom HAProxy allowlist replaces Tecnativa's broad CONTAINERS/POST
  # toggles with a deny-by-default allowlist for named lancache-ng containers.
  # It is isolated on docker-api so other services cannot reach the proxy API.
  docker-socket-proxy:
    container_name: lancache-docker-socket-proxy${LANCACHE_CONTAINER_SUFFIX:-}
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    entrypoint: ["/usr/local/bin/lancache-docker-socket-proxy.sh"]
    command: []
    stdin_open: true
    environment:
      # Issue #1415: lets the entrypoint narrow its own generated HAProxy
      # allowlist to the exact suffixed container names actually running
      # for this compose project, instead of only the fixed defaults. See
      # this file's own top-of-file LANCACHE_CONTAINER_SUFFIX comment.
      - LANCACHE_CONTAINER_SUFFIX=${LANCACHE_CONTAINER_SUFFIX:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/docker-socket-proxy.sh:/usr/local/bin/lancache-docker-socket-proxy.sh:ro
    networks:
      - docker-api
    healthcheck:
      # Real HTTP probe against the Docker API's own /_ping endpoint (#1169),
      # not just a bare TCP connect -- proves the HAProxy frontend generated
      # by lancache-docker-socket-proxy.sh is actually forwarding to the real
      # Docker socket backend, not just that something is listening on 2375.
      # /_ping is explicitly allowlisted by that script's own `safe_ping` ACL
      # (see scripts/docker-socket-proxy.sh), so this exercises the same path
      # watchdog itself depends on. Uses wget (BusyBox): verified empirically
      # against this exact pinned image (tecnativa/docker-socket-proxy, Alpine
      # base) that wget is present but curl is not -- same reasoning as nats'
      # healthcheck below.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  watchdog:
    container_name: lancache-watchdog${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/watchdog:${LANCACHE_IMAGE_TAG:-latest}
    # Central logging pipeline (#633): watchdog.sh writes only to stdout
    # (its log() function, see services/watchdog/watchdog.sh) and is never
    # itself changed -- this entrypoint override tees that stdout into a
    # file in addition to the container's normal stdout, so `docker logs`
    # keeps working unchanged while fluent-bit also gets a file to tail.
    # Process substitution (`> >(...)`) requires bash, not the image's
    # default entrypoint form; `exec` still replaces this shell with
    # /watchdog.sh directly, which becomes PID 1, so signal handling
    # (restart/stop) is unaffected.
    #
    # Calls /watchdog.sh directly again (#842 Teil 2, 2026-08-01): retention.sh
    # now runs as its own dedicated `retention` compose service below, with
    # its own cap_drop/read_only/non-root lockdown -- see that service's own
    # comment block for the full container-hardening rationale, and
    # deploy/prod/docker-compose.yml's identical watchdog comment for why this
    # container no longer needs to launch a second process at all.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/log/lancache-watchdog
        exec /watchdog.sh > >(tee -a /var/log/lancache-watchdog/watchdog.log) 2>&1
    environment:
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      - CHECK_INTERVAL=30
      - RESTART_AFTER=3
      - DISK_WARN_PCT=85
      - DISK_ALARM_PCT=95
      - CACHE_DIR=/var/cache/lancache
      # Issue #1415: these four (and the bare LANCACHE_CONTAINER_SUFFIX
      # below) let watchdog's own FATAL guard (see watchdog.sh's
      # C_PROXY/C_DNS_STD/C_DNS_SSL/C_NATS checks) recompute the container
      # names it expects using the SAME suffix this project actually
      # started its containers with, instead of only ever accepting the
      # bare literal default. Left unset (real installs), every value here
      # is byte-identical to the literal default watchdog.sh already falls
      # back to on its own, so this is a no-op for the documented
      # single-stack-per-host design (#849 finding #5).
      - CONTAINER_PROXY=lancache-proxy${LANCACHE_CONTAINER_SUFFIX:-}
      - CONTAINER_DNS_STANDARD=lancache-dns-standard${LANCACHE_CONTAINER_SUFFIX:-}
      - CONTAINER_DNS_SSL=lancache-dns-ssl${LANCACHE_CONTAINER_SUFFIX:-}
      - CONTAINER_NATS=lancache-nats${LANCACHE_CONTAINER_SUFFIX:-}
      - LANCACHE_CONTAINER_SUFFIX=${LANCACHE_CONTAINER_SUFFIX:-}
      - SSL_ENABLED=${SSL_ENABLED:-0}
      # DHCP_MODE/SYSLOG_ENABLED (issue #842/#849): matches
      # deploy/prod/docker-compose.yml's identical addition -- currently
      # unused by watchdog.sh (the bash entrypoint this ENTRYPOINT still
      # runs), read only by the Rust crate's resolve_alert_only_targets()
      # once that becomes this service's actual ENTRYPOINT.
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
    volumes:
      # Read-only (#842 Teil 2): watchdog.sh only ever reads this tree now
      # (disk_info()'s `df -P` for the dashboard's disk-usage card) -- see
      # deploy/prod/docker-compose.yml's identical comment for the full
      # reasoning. The destructive purge that used to need read-write access
      # here moved to the `retention` service below.
      - ${CACHE_DIR:?CACHE_DIR is required}:/var/cache/lancache:ro
      - watchdog-status:/var/run/watchdog
      - watchdog-logs:/var/log/lancache-watchdog
    healthcheck:
      # Freshness-based (mtime), not just existence -- see
      # services/watchdog/healthcheck.sh's own comment for why a stalled
      # main loop would otherwise leave a stale-but-present status.json
      # reading as healthy forever.
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 15s
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-api
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Retention (file-retention daemon, #842 Teil 2) ────────────────────────
  # See deploy/prod/docker-compose.yml's identical `retention:` service block
  # for the full cap_drop/DAC_OVERRIDE/read_only/network_mode rationale --
  # not repeated verbatim here to avoid this comment drifting out of sync in
  # one profile but not the other; the mechanism and the evidence behind it
  # are identical across every deployment profile.
  retention:
    container_name: lancache-retention${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/watchdog:${LANCACHE_IMAGE_TAG:-latest}
    entrypoint: ["/retention-entrypoint.sh"]
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - CACHE_VALID_DAYS=365
      - CACHE_DIR=/var/cache/lancache
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
      - SYSLOG_MAX_GB=${SYSLOG_MAX_GB:-10}
      - SYSLOG_RETENTION_DAYS=${SYSLOG_RETENTION_DAYS:-30}
      - FLUENT_BIT_SELFLOG_MAX_MB=${FLUENT_BIT_SELFLOG_MAX_MB:-20}
      - FLUENT_BIT_SELFLOG_MAX_ROTATIONS=${FLUENT_BIT_SELFLOG_MAX_ROTATIONS:-5}
    volumes:
      - ${CACHE_DIR:?CACHE_DIR is required}:/var/cache/lancache
      - logs-syslog-ng:/var/log/lancache-syslog-ng
      - syslog-data:/var/lib/lancache-syslog-data
      - watchdog-logs:/var/log/lancache-watchdog
      - retention-state:/var/lib/lancache-retention-state
    # No healthcheck -- deliberate, see deploy/prod/docker-compose.yml's
    # identical comment. restart: always recovers a crashed container the
    # same way every other unmonitored service here already relies on.
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── DHCP Server (Kea) ─────────────────────────────────────────────────────
  # Full DHCP mode with Control Agent API. Active only with COMPOSE_PROFILES=dhcp-kea.
  dhcp:
    profiles: [dhcp-kea]
    container_name: lancache-dhcp${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dhcp:${LANCACHE_IMAGE_TAG:-latest}
    environment:
      - DHCP_DNS_PRIMARY=${IP_STANDARD}
      - DHCP_DNS_SECONDARY=${IP_SSL:-${IP_STANDARD}}
      - DHCP_DNS_SERVER_IP=${IP_STANDARD}
      - DHCP_DNS_SERVER_IP_SSL=${IP_SSL:-${IP_STANDARD}}
      - DDNS_TSIG_KEY=${DDNS_TSIG_KEY:-}
      - KEA_CTRL_TOKEN=${KEA_CTRL_TOKEN:-}
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - DHCP_SUBNET=${DHCP_SUBNET:-}
      - DHCP_GATEWAY=${DHCP_GATEWAY:-}
      - DHCP_RANGE_START=${DHCP_RANGE_START:-}
      - DHCP_RANGE_END=${DHCP_RANGE_END:-}
    volumes:
      # Shared-secret bootstrap (#858): first-writer-wins KEA_CTRL_TOKEN/DDNS_TSIG_KEY.
      - shared-secrets:/var/lib/lancache-secrets
      - ${KEA_DATA_DIR:-./kea}:/var/lib/kea
      # Central logging pipeline (#633): Kea's loggers dual-write here (see
      # kea-dhcp4.conf.template's "output-options") in addition to stdout.
      - dhcp-logs:/var/log/kea
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
    # Shared-secret bootstrap (#858): this healthcheck runs as a separate
    # `docker exec`-style CMD-SHELL invocation, which only sees the container's
    # compose-defined environment, NOT anything the entrypoint later exports
    # after resolving/generating KEA_CTRL_TOKEN. Without the fallback below, a
    # self-healed (originally empty/placeholder) token would leave Kea's Control
    # Agent running correctly with the generated token while this check keeps
    # authenticating with the empty compose value -- permanently `unhealthy`
    # despite the daemon being fine (live-verified: exactly this failure mode).
    # Mirrors the entrypoint's own placeholder list so both sides agree on which
    # value is authoritative.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          host="$${KEA_CTRL_HOST:-127.0.0.1}";
          [ "$$host" = "0.0.0.0" ] && host=127.0.0.1;
          token="$${KEA_CTRL_TOKEN:-}";
          norm="$$(printf '%s' "$$token" | tr '[:upper:]' '[:lower:]' | tr '-' '_')";
          case "$$norm" in ""|change_me*|changeme*|your_*|*_here) token="" ;; esac;
          case "$$token" in lancache-dhcp-secret|lancache-dhcp-dev-secret|lancache-dhcp-prod-secret) token="" ;; esac;
          [ -n "$$token" ] || token="$$(cat /var/lib/lancache-secrets/kea-ctrl-token 2>/dev/null)";
          curl -sf -u admin:$$token
          -H 'Content-Type: application/json'
          -d '{"command":"config-get","service":["dhcp4"]}'
          "http://$$host:8000/" | jq -e '.[0].result == 0' >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── DHCP Proxy (dnsmasq) ──────────────────────────────────────────────────
  # Proxy mode keeps an existing router DHCP server and serves proxy-DHCP/PXE clients.
  dhcp-proxy:
    profiles: [dhcp-proxy]
    container_name: lancache-dhcp-proxy${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/dhcp-proxy:${LANCACHE_IMAGE_TAG:-latest}
    volumes:
      - ui-data:/data:ro
      # Known-good dnsmasq config snapshots (#415): persistent, service-owned
      # volume so rollback survives container restarts/recreates.
      - dhcp-proxy-config-snapshots:/var/lib/lancache-dhcp-proxy
      # Central logging pipeline (#633): dnsmasq's own `log-facility=`
      # directive (see dnsmasq.conf.template) writes here.
      - dhcp-proxy-logs:/var/log/lancache-dhcp-proxy
    environment:
      - DHCP_SUBNET_START=${DHCP_SUBNET_START:-}
      - DHCP_DNS_PRIMARY=${DHCP_DNS_PRIMARY:-}
      - DHCP_DNS_SECONDARY=${DHCP_DNS_SECONDARY:-}
      - UPSTREAM_DHCP_IP=${UPSTREAM_DHCP_IP:-}
      # Issue #450: additional optional dnsmasq relay/proxy options.
      - DHCP_PROXY_INTERFACE=${DHCP_PROXY_INTERFACE:-}
      - DHCP_PROXY_ROUTER=${DHCP_PROXY_ROUTER:-}
      - DHCP_NTP_SERVERS=${DHCP_NTP_SERVERS:-}
      - DHCP_PROXY_DOMAIN=${DHCP_PROXY_DOMAIN:-}
      - DHCP_PROXY_BOOT_FILENAME=${DHCP_PROXY_BOOT_FILENAME:-}
      - DHCP_PROXY_BOOT_SERVER=${DHCP_PROXY_BOOT_SERVER:-}
      - DHCP_PROXY_CUSTOM_OPTIONS=${DHCP_PROXY_CUSTOM_OPTIONS:-}
      # Issue #705: PXE boot-pointer opt-in. Without these three passed
      # through, the container never sees them even if set in .env, so the
      # feature stays silently disabled for every quickstart install
      # regardless of what the operator configures (found in PR #765 review).
      - DHCP_PROXY_PXE_BOOT_SERVER=${DHCP_PROXY_PXE_BOOT_SERVER:-}
      - DHCP_PROXY_PXE_BOOT_FILENAME_BIOS=${DHCP_PROXY_PXE_BOOT_FILENAME_BIOS:-}
      - DHCP_PROXY_PXE_BOOT_FILENAME_UEFI=${DHCP_PROXY_PXE_BOOT_FILENAME_UEFI:-}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
      # dnsmasq's ProxyDHCP/PXE reply path needs a raw broadcast socket;
      # without NET_ADMIN, dnsmasq passes its own config self-test but then
      # fails to actually start ("process is missing required capability
      # NET_ADMIN"), confirmed live with a real dnsmasq build against the
      # pre-issue-#450 four-variable config alone -- this was already
      # broken before this issue's new options existed. Matches the dhcp
      # (Kea) service's cap_add, which needs it for the same reason.
      - NET_ADMIN
    healthcheck:
      # dnsmasq has no REST/control-socket API the way Kea does, and this
      # config disables DNS entirely (port=0 in dnsmasq.conf.template), so a
      # dig-based query/response probe (like dns-standard/dns-ssl) is not
      # possible here -- and actively synthesizing a real DHCPDISCOVER every
      # interval would inject genuine broadcast traffic onto the LAN, which a
      # healthcheck must not do as a side effect. This is therefore liveness
      # + config-integrity, not a functional DHCP probe (same class of honest
      # limitation as fluent-bit's `-V` check): the entrypoint execs dnsmasq
      # directly (no wrapper shell), so PID 1 being "dnsmasq" proves the real
      # daemon is still running rather than having crashed out from under a
      # lingering shell, and re-running `dnsmasq --test` against the exact
      # on-disk config proves it has not been corrupted since the daemon last
      # (successfully) loaded it. Verified live: `dnsmasq --test` only parses
      # the file, it does not bind sockets, so it never conflicts with the
      # already-running daemon.
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm 2>/dev/null)\" = dnsmasq ] && dnsmasq --test -C /etc/dnsmasq.conf >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── LanCache-NG-NTP (chrony) ──────────────────────────────────────────────
  # Disciplines its own clock against public NTP servers and serves LAN
  # clients on UDP/123. Opt-in like dhcp/dhcp-proxy above.
  ntp:
    profiles: [ntp]
    container_name: lancache-ntp${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ntp:${LANCACHE_IMAGE_TAG:-latest}
    volumes:
      - ui-data:/data:ro
      - ${NTP_DATA_DIR:-./ntp}:/var/lib/chrony
      # Central logging pipeline (#633): chronyd's `log` directive (see
      # chrony.conf) writes here in addition to the process's own stdout.
      - ntp-logs:/var/log/chrony
    environment:
      - NTP_UPSTREAM_SERVERS=${NTP_UPSTREAM_SERVERS:-0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org time.cloudflare.com}
      - NTP_ALLOWED_CLIENT_CIDRS=${NTP_ALLOWED_CLIENT_CIDRS:-}
    ports:
      # No dedicated LAN IP: NTP is plain unicast UDP, not a broadcast
      # protocol like DHCP, so Docker's normal port-publish DNAT already
      # preserves real client source IPs without network_mode: host.
      - "123:123/udp"
    # Least-privilege hardening (issue #1358): `cap_drop: [ALL]` then a
    # narrow `cap_add`, empirically determined via live `strace` against the
    # real chronyd binary, not guessed -- see deploy/prod/docker-compose.yml's
    # `ntp` service for the full per-capability rationale (bind-before-drop,
    # transient privilege-drop syscalls, entrypoint.sh's own chown step).
    cap_drop:
      - ALL
    cap_add:
      # chronyd needs to step/slew the container HOST's real system clock to
      # genuinely discipline time -- see services/ntp/Dockerfile's comment.
      - SYS_TIME
      # Binds UDP/123 (and its cmdmon socket) before dropping to `chrony`.
      - NET_BIND_SERVICE
      # Transient-only: chronyd's own internal setgroups/setgid/setuid/
      # capset() privilege-drop sequence needs these to run as root, but the
      # long-running post-drop process retains none of them. Deliberately
      # does NOT include SETPCAP -- confirmed live it changes nothing (see
      # deploy/prod/docker-compose.yml's fuller comment for why).
      - SETUID
      - SETGID
      # entrypoint.sh's own chown of /var/log/chrony and /var/lib/chrony to
      # chrony:chrony needs this once root no longer has it implicitly.
      - CHOWN
    healthcheck:
      # Real query/response probe (#1169, matching AG-VAL-018's spirit for
      # DNS): `chronyc tracking` is a genuine round-trip over chronyd's own
      # command socket, not a bare port-listen check, so a hung/crashed
      # daemon (socket refuses/times out) is distinguished from a live one.
      # Deliberately does NOT require "Leap status: Normal"/a synced stratum
      # -- a daemon that is alive but has not yet reached (or has
      # temporarily lost) its upstream servers is a legitimate, non-crashed
      # state during start_period or a transient network blip, and must not
      # flap this healthcheck unhealthy for that reason alone. Verified live:
      # a freshly started, not-yet-synchronised chronyd still returns a
      # "Reference ID" line immediately.
      test: ["CMD-SHELL", "chronyc tracking | grep -q 'Reference ID' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── DHCP conflict probe ────────────────────────────────────────────────────
  # Predeclared start/stop/wait helper for the Admin UI's "check for other
  # DHCP servers" feature. Reuses the UI image, running the same lancache-ui
  # binary in an alternate CLI mode (`--dhcp-probe`, see
  # services/ui/src/dhcp_probe_native.rs) instead of the former separate
  # dhcp-probe.sh script -- issue #1288 replaced that script's nmap/dhclient
  # dependency (both EOL, dropped from current Alpine) with a native DHCPv4
  # client speaking the wire protocol directly, so this image no longer
  # installs either tool and no longer needs a bind-mounted probe script.
  # The Admin UI stops then starts this container on demand and reads its
  # output — it never creates or removes it — so the narrowed
  # docker-socket-proxy only needs to permit start/restart, the same
  # capability class already used for the NATS and proxy-ssl reload flows,
  # not generic container creation.
  dhcp-probe:
    container_name: lancache-dhcp-probe${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}
    entrypoint: ["/usr/local/bin/lancache-ui", "--dhcp-probe"]
    network_mode: host
    restart: "no"

  # ── Admin UI ───────────────────────────────────────────────────────────────
  # UI is LAN-reachable by default for the quickstart workflow. Password protection
  # remains optional, but is recommended on shared or untrusted networks. Set
  # UI_BIND_IP=127.0.0.1 to restrict access to the host. Direct Docker socket mount
  # removed; Docker operations are proxied through the isolated docker-api network.
  ui:
    container_name: lancache-ui${LANCACHE_CONTAINER_SUFFIX:-}
    image: ${LANCACHE_IMAGE_REGISTRY:-ghcr.io}/${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}/ui:${LANCACHE_IMAGE_TAG:-latest}
    volumes:
      # Shared-secret bootstrap (#858): the UI entrypoint (running as root before
      # the privilege drop) resolves PDNS_API_KEY/KEA_CTRL_TOKEN from here so its
      # PowerDNS/Kea API clients use the same value the server side generated.
      - shared-secrets:/var/lib/lancache-secrets
      - ui-data:/data
      - proxy-logs:/var/log/nginx:ro
      # Read-only cache mount is for size reporting only. Mutations stay in the proxy/watchdog.
      - ${CACHE_DIR:?CACHE_DIR is required}:/var/cache/proxy:ro
      - pdns-filter-state:/var/lib/powerdns-state
      - nats-conf:/etc/nats
      # Shared with the dhcp (Kea) service: UI writes known-good Kea config
      # snapshots into config-snapshots/ here (#614), never touching Kea's
      # own kea-dhcp4.conf/kea-leases4.csv/etc. in the same directory.
      - ${KEA_DATA_DIR:-./kea}:/var/lib/kea
      # Central logging pipeline (#633): main.rs's init_tracing() writes
      # UI_LOG_FILE (default matches this path) alongside stdout.
      - ui-logs:/var/log/lancache-ui
      # Central syslog store reader (#633 PR4): read-only, since watchdog
      # (not the UI) owns pruning of this volume. A missing mount here would
      # make syslog_client's SYSLOG_LOG_ROOT reads silently return empty
      # results, not fail, so this is required for SYSLOG_ENABLED=true to
      # actually show anything on /logs or the dashboard.
      - logs-syslog-ng:/var/log/lancache-syslog-ng:ro
      # Issue #870: read-only reader for watchdog's status.json (per-service
      # health + cache-disk usage color, rendered as the dashboard's
      # "Service health" card). watchdog is the sole writer of this volume
      # (see its own service block below); a missing mount here would make
      # watchdog_status::read_status() see the file as simply absent, not
      # fail, so this is required for the health card to show real data
      # instead of its "unavailable" fallback state.
      - watchdog-status:/var/run/watchdog:ro
    ports:
      - "${UI_BIND_IP:-${IP_STANDARD}}:8080:8080"
    environment:
      - DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      - DNS_STANDARD_SERVICE=dns-standard
      - DNS_SSL_SERVICE=dns-ssl
      - PROXY_SERVICE=proxy
      - SSL_ENABLED=${SSL_ENABLED:-0}
      - PROXY_STANDARD_URL=http://proxy
      - PROXY_SSL_URL=http://proxy
      - PROXY_SSL_SERVICE=proxy
      - STANDARD_LOG=/var/log/nginx/access.log
      - SSL_LOG=/var/log/nginx/access.log
      - CACHE_DIR=/var/cache/proxy
      - NETDATA_URL=http://netdata:19999
      - STANDARD_IP=${IP_STANDARD}
      - SSL_IP=${IP_SSL}
      - LANCACHE_IMAGE_REGISTRY=${LANCACHE_IMAGE_REGISTRY:-ghcr.io}
      - LANCACHE_IMAGE_PREFIX=${LANCACHE_IMAGE_PREFIX:-wiki-mod/lancache-ng}
      - LANCACHE_IMAGE_CHANNEL=${LANCACHE_IMAGE_CHANNEL:-}
      - LANCACHE_IMAGE_TAG=${LANCACHE_IMAGE_TAG:-latest}
      - CACHE_MAX_GB=${CACHE_MAX_GB:-50}
      - UI_AUTH_USER=${UI_AUTH_USER:-}
      - UI_AUTH_PASSWORD=${UI_AUTH_PASSWORD:-}
      - ALLOW_INSECURE_UI=${ALLOW_INSECURE_UI:-false}
      - UI_SESSION_TTL_SECONDS=${UI_SESSION_TTL_SECONDS:-86400}
      - DHCP_MODE=${DHCP_MODE:-disabled}
      - DNS_STANDARD_STATE_DIR=/var/lib/powerdns-state
      - DNS_SSL_STATE_DIR=/var/lib/powerdns-state
      - NATS_URL=nats://nats:4222
      - NATS_UI_USER=${NATS_UI_USER:?NATS_UI_USER is required}
      - NATS_UI_PASSWORD=${NATS_UI_PASSWORD:-}
      - NATS_DNS_WRITER_USER=${NATS_DNS_WRITER_USER:?NATS_DNS_WRITER_USER is required}
      - NATS_DNS_WRITER_PASSWORD=${NATS_DNS_WRITER_PASSWORD:-}
      - NATS_DNS_REPLICA_USER=${NATS_DNS_REPLICA_USER:?NATS_DNS_REPLICA_USER is required}
      - NATS_DNS_REPLICA_PASSWORD=${NATS_DNS_REPLICA_PASSWORD:-}
      - NATS_CALLOUT_USER=${NATS_CALLOUT_USER:?NATS_CALLOUT_USER is required}
      - NATS_CALLOUT_PASSWORD=${NATS_CALLOUT_PASSWORD:-}
      # Issue #681: lets nats_kick.rs connect as the NATS system account to look
      # up (CONNZ) and force-disconnect (KICK) a removed/rotated secondary's
      # live connection. MUST match the nats service's NATS_SYS_USER/PASSWORD.
      - NATS_SYS_USER=${NATS_SYS_USER:?NATS_SYS_USER is required}
      - NATS_SYS_PASSWORD=${NATS_SYS_PASSWORD:-}
      - SECONDARY_REGISTRATION_TOKEN=${SECONDARY_REGISTRATION_TOKEN:-}
      - PDNS_AUTH_URL=http://dns-standard:8081
      - PDNS_REC_URL=http://dns-standard:8082
      # Zone/record known-good snapshot rollback listener (#628), scoped to
      # dns-standard only for now -- same single-primary convention
      # PDNS_AUTH_URL/PDNS_REC_URL already use (see services/ui/src/routes/
      # dns_snapshots.rs's module doc comment for why dns-ssl isn't wired up
      # here yet).
      - DNS_ROLLBACK_URL=http://dns-standard:8083
      - PDNS_API_KEY=${PDNS_API_KEY:-}
      - DHCP_API_URL=http://host.docker.internal:8000
      - DHCP_API_TOKEN=${DHCP_API_TOKEN:-${KEA_CTRL_TOKEN:-}}
      - KEEP_KNOWN_GOOD_CONFIGS=${KEEP_KNOWN_GOOD_CONFIGS:-3}
      # Central syslog store reader (#633 PR4): same 4 vars/defaults as the
      # watchdog retention engine (PR3/#757), so the UI's "enabled" toggle
      # and its actual budget display always agree with what watchdog is
      # enforcing.
      - SYSLOG_ENABLED=${SYSLOG_ENABLED:-false}
      - SYSLOG_LOG_ROOT=/var/log/lancache-syslog-ng
      - SYSLOG_MAX_GB=${SYSLOG_MAX_GB:-10}
      - SYSLOG_RETENTION_DAYS=${SYSLOG_RETENTION_DAYS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Shallow liveness probe against services/ui/src/main.rs's own /health
      # route (its comment there documents it as existing specifically for
      # container healthchecks) -- proves the HTTP server is accepting
      # connections, not that NATS/Docker/DNS are reachable. curl is present
      # in this image's apt-get install list (services/ui/Dockerfile).
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - docker-socket-proxy
      - proxy
      - netdata
      - nats
    networks:
      - default
      - docker-api
    restart: always
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Netdata (system metrics) ───────────────────────────────────────────────
  netdata:
    container_name: lancache-netdata${LANCACHE_CONTAINER_SUFFIX:-}
    image: netdata/netdata@sha256:a130dbbf3d6e6a5472efdebaa123797190a5822627e908106d34edae02bc8a74
    hostname: lancache-netdata
    # pid: host: required by netdata's own official Docker documentation for
    # apps.plugin to read other containers' /proc/<pid> entries (e.g.
    # .../io). Without it, netdata's own PID namespace is a sibling of, not
    # an ancestor of, the host's -- so even with cap_add: SYS_PTRACE below,
    # the kernel's ptrace_may_access check for a process outside netdata's
    # own container still fails with Permission denied, which is exactly the
    # "collector: apps.plugin permission-denied spam per host process" this
    # file already called out below as noise to keep out of the shared log
    # view, without this being the actual fix for it.
    pid: host
    cap_add: [SYS_PTRACE]
    security_opt: [apparmor:unconfined]
    # Central logging pipeline (#633, #847): this netdata build's own log
    # paths under /var/log/netdata (access/collector/daemon/health/...) are
    # symlinks to /dev/stdout|stderr, not real files -- nothing for
    # fluent-bit to tail. Same "no local repo checkout to bind-mount a
    # config file from" constraint the syslog/syslog-ng services already
    # solve by generating their config inline (quickstart's install_dir has
    # no services/ directory -- see setup.sh's install_quickstart_compose_
    # assets()), so this entrypoint override writes a netdata.conf that
    # redirects daemon/health to real files under
    # /var/log/netdata/*.file.log, then execs the image's own entrypoint.
    # netdata-logs shares that path with fluent-bit, which tails those real
    # files read-only. collector/access/debug stay on their stdout defaults
    # and are NOT collected: collector is extremely high-rate internal
    # diagnostics (temperature-sensor flapping, and previously apps.plugin
    # permission-denied spam per host process before `pid: host` above fixed
    # the underlying cause) that would flood the shared bounded /logs view
    # and hide every other source; access is high-rate API chatter; debug is
    # empty unless enabled.
    entrypoint: ["/usr/bin/bash", "-c"]
    command:
      - |
        set -e
        cat > /etc/netdata/netdata.conf <<'CONF'
        [logs]
        daemon = /var/log/netdata/daemon.file.log
        health = /var/log/netdata/health.file.log
        CONF
        # web_log collector (go.d.plugin) wiring: reads the proxy's
        # plain-text access-log copy (fluent-bit's `file=nginx-proxy.log`
        # output into the `logs` volume, already mounted read-only below)
        # to expose live per-request nginx analytics (per-status-code
        # counters, response time, etc.). quickstart's install_dir has no
        # services/ directory to bind-mount services/syslog/netdata-web_log.conf
        # from (same constraint as netdata.conf itself, above), so the job
        # config is generated inline instead. Keep this content byte-identical
        # to services/syslog/netdata-web_log.conf if that file ever changes.
        mkdir -p /etc/netdata/go.d
        cat > /etc/netdata/go.d/web_log.conf <<'CONF'
        jobs:
          - name: nginx_proxy
            path: /var/log/lancache/nginx-proxy.log
            log_type: nginx
        CONF
        exec /usr/sbin/run.sh
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netdata-logs:/var/log/netdata
      - logs:/var/log/lancache:ro
    healthcheck:
      # Real HTTP probe against netdata's own REST API (#1169), matching the
      # check deploy/full-setup/docker-compose.yml's validation stack already
      # uses for the same pinned image -- proves the daemon is actually
      # serving its API, not just that the process exists or a port is open.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19999/api/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  docker-api:
    internal: true

volumes:
  # Shared handshake secrets (#858). A persistent volume mounted into every
  # container that must agree on a generated secret value (PDNS_API_KEY,
  # KEA_CTRL_TOKEN, DDNS_TSIG_KEY). Each consumer's entrypoint resolves the
  # secret through a file here: an operator/setup.sh value in .env always wins,
  # but if a value is left empty/placeholder the first container to boot
  # generates it atomically (first-writer-wins) and the rest read the same
  # value, so a blanked secret self-heals instead of crash-looping. Persistent
  # so the generated value never rotates across restarts.
  shared-secrets:
  proxy-logs:
  # Known-good config snapshots (#415, #615), one persistent volume per
  # adapter. dns-standard and dns-ssl are separate containers with
  # independently-generated config, so each gets its own snapshot history.
  proxy-config-snapshots:
  dhcp-proxy-config-snapshots:
  pdns-config-snapshots-standard:
  pdns-config-snapshots-ssl:
  watchdog-status:
  # #842 Teil 2: retention.sh's own PURGE_STAMP/SYSLOG_PRUNE_STAMP, deliberately
  # separate from watchdog-status above -- see the `retention:` service's own
  # comment for the architecture decision behind this split.
  retention-state:
  nats-data:
  nats-conf:
  netdataconfig:
  netdatalib:
  netdatacache:
  logs:
  syslog-data:
  # Per-service source logs (#633): each service writes here (dual-output
  # alongside stdout where the underlying daemon supports it, single-
  # destination where it doesn't -- see docs/architecture-ng.md's logging
  # matrix for which), and the `syslog` (fluent-bit) service tails these
  # read-only and forwards to syslog-ng. Same "rotated log output, not
  # operational state" classification as `logs`/`syslog-data` above.
  dns-logs-standard:
  dns-logs-ssl:
  dhcp-logs:
  dhcp-proxy-logs:
  ui-logs:
  watchdog-logs:
  nats-logs:
  netdata-logs:
  # LanCache-NG-NTP (chrony) log output. Not yet wired into the `syslog`
  # (fluent-bit) central logging pipeline (#633) -- a known, deliberately
  # deferred follow-up (see docs/architecture-ng.md's logging matrix).
  ntp-logs:
  logs-syslog-ng:
  pdns-data-standard:
  pdns-data-ssl:
  pdns-filter-state:
  ui-data:
