      despite `services/ui` never invoking `gzip` at all). This is the
      HIGH-severity finding issue #815 Part C's original baseline already
      tracked: a global buffer overflow in gzip's own LZH decompression
      path (`.lzh`/SCO-compress-format support, a legacy, rarely-used gzip
      decompression mode). `tools/build-tools`'s own gzip usage (unpacking
      pinned, checksum-verified plain `.tar.gz` release tarballs) never
      exercises the LZH code path at all -- gzip only invokes LZH decoding
      for input explicitly identified as LZH-formatted, which a plain gzip
      tarball is not. Re-review by 2026-08-20 alongside CVE-2026-41991.
    expired_at: 2026-08-20
