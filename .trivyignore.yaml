  - id: CVE-2026-41991
    statement: >-
      What: Accepts CVE-2026-41991 (an arbitrary-file-overwrite via
      insecure temporary-file handling in the `gzexe` utility, gzip
      1.13-1) as tracked risk for `tools/build-tools` only -- not a
      non-exploitability disposition there, genuinely narrow but real
      reachability; `services/ui` is not affected at all. Anchor entry for
      the 2-ID gzip group (this and CVE-2026-41992 below); the only ID in
      this file's 30-ID full-severity-scan batch (see CVE-2011-4116) where
      the two images' exploitability genuinely differs, so it is not
      grouped under that batch's blanket `not_affected` disposition.

      Why: `services/ui/docker-entrypoint.sh` never invokes `gzip`,
      `gunzip`, or `gzexe` at all (confirmed via grep), so this ID's
      disposition for that image alone would be `not_affected`. Trivy's
      finding applies per-CVE-ID repo-wide, though -- no per-image
      `paths:` scoping works for Debian os-pkgs findings (confirmed by
      this file's existing curl-group entries) -- so the disposition for
      this ID must reflect the more exploitable of the two images, hence
      `accepted` rather than `not_affected`. `tools/build-tools/Dockerfile`
      installs `gzip` explicitly and its build process invokes `gzip`/
      `tar` transitively to unpack pinned, checksum-verified upstream
      release tarballs when fetching prebuilt tool binaries (see
      AG-KD-003's own build-tools tooling history) -- never `gzexe`
      specifically, and never on attacker-supplied input (every archive
      fetched is a pinned URL/version, checksum-verified before use, not
      user- or CI-caller-controlled). This is a narrow, indirect,
      checksum-gated reachability path for `gzexe`'s own finding, which
      this image's actual usage does not even reach since `gzexe` itself
      is never invoked -- flagged as accepted risk purely for the
      repo-wide-per-CVE-ID scoping reason above, not because a real
      exploitation path was found.

      Verified: 2026-08-06, real full-severity Trivy scan against both
      images' `sha-cc5a272` builds.

