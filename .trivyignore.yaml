  - id: CVE-2026-12064
    statement: >-
      What: Accepts CVE-2026-12064 (an SSH host-verification bypass via
      schemeless SFTP/SCP URLs) as tracked risk for `tools/build-tools`'s
      `curl`/`libcurl4t64`/`libcurl3t64-gnutls` package. Anchor entry for
      this file's curl group (CVE-2026-8286/8927/8932/9079/9080/9545
      below share this background).

      Why: Not a non-exploitability disposition -- Trivy reports `Status:
      affected`, `FixedVersion: None` against the installed package.
      Whether that reflects a genuinely unfixed condition or a
      Debian-tracker/Trivy-DB mapping gap against curl's own stated
      fixed-at-8.21.0 version is unresolved (open question raised in a
      2026-07-31 comment on the tracked issue). No `paths:` scoping is
      given: Trivy's `os-pkgs`/`debian` finding class (apt/dpkg-installed
      packages) carries no `PkgPath`, unlike this file's Go-binary entries
      above (`docker-compose`/`docker-buildx`, Trivy's `gobinary`
      analyzer, which does report a path) -- confirmed empirically on a
      real proxy-image build: an entry for this CVE ID with a populated
      but bogus `paths:` value (`usr/bin/curl`) did not suppress the
      finding, while an otherwise identical entry with no `paths:` field
      did suppress it cleanly.

      `tools/build-tools`'s own `curl` usage (grep-confirmed,
      `tools/build-tools/Dockerfile`) is exclusively `curl -fsSL
      "https://github.com/.../releases/download/..."` against a fixed set
      of pinned GitHub-release URLs (`cargo-audit`, `cargo-tarpaulin`,
      `shellspec`) -- no schemeless SFTP/SCP URL.

      Verified: 2026-08-14 (documented as the 2026-08-15 checkpoint
      re-review), real execution on self-hosted runner lancache-240 (not
      tracker websites alone). All 5 runtime First-Party
      images (`services/proxy`, `services/dns`, `services/watchdog`,
      `services/ui`, `services/ntp`) share the byte-identical Alpine base
      digest
      `alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b`
      (grep-confirmed across all 5 Dockerfiles) and install `curl` via the
      same `apk add curl` mechanism. Built `services/proxy` from
      `current_dev` (`docker buildx build --build-arg
      BUILD_TOOLS_IMAGE=... --build-context dns-domains=services/dns
      services/proxy`): `curl --version` inside the image confirms `curl
      8.21.0`; a real `aquasec/trivy:latest` (v0.73.0) scan (`trivy image
      --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --scanners vuln`, no
      `.trivyignore.yaml` applied) found 0 findings of any severity for
      this image, this CVE ID and the rest of this group entirely absent.
      Cross-checked against a second, independently-published image
      (`ghcr.io/wiki-mod/lancache-ng/dns:nightly`, pulled fresh): also
      resolves to `curl 8.21.0`, identical 0-finding result.
      `services/watchdog`/`services/ui`/`services/ntp` were not separately
      rebuilt this pass; generalizing to them rests on the shared
      base-image digest and identical `apk` install mechanism verified at
      `curl 8.21.0` on 2 of the 5 images.

      `tools/build-tools`'s own image (built via
      `scripts/select-build-tools-image.sh` from `current_dev`, tag
      `lancache-ng-build-tools-validation:local-local-1`) is Debian-based
      (`rust:latest`) and installs `curl`/`libcurl4t64`/
      `libcurl3t64-gnutls` from `trixie-backports` at `8.21.0-2~bpo13+1`
      (confirmed via `dpkg -l` inside the image). Real Trivy scans at both
      `--severity HIGH,CRITICAL` and the full
      `UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL` range (same date, same runner)
      found this CVE ID: `Status: affected`, `FixedVersion: None`. Prior
      versions of this entry covered only the 5 runtime service images and
      never named `tools/build-tools`, even though the no-`paths:`-scoping
      design always covered it once that image also carried an affected
      `curl` package; this entry's real, live scope is now
      `tools/build-tools` only -- the 5 runtime images no longer need it.

      Time-boxed acceptance, not indefinite: re-review on or before
      2026-08-28 -- rebuild and re-scan `tools/build-tools` at full
      severity range (a HIGH-only scan previously missed 4 sibling IDs in
      this group later reclassified to MEDIUM, see CVE-2026-8932 below).
      Drop this entry if trixie/backports/sid has shipped a fix by then;
      otherwise extend or investigate a narrower `curl` footprint for
      `tools/build-tools`.

