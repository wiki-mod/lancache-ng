  - id: CVE-2026-41567
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-41567 (a Docker daemon `docker cp`/archive-
      upload host code execution finding) for the docker-compose and
      docker-buildx CLI plugin binaries only.

      Why: Not exploitable in these artifacts (vulnerable code not present).
      Same github.com/docker/docker v28.5.2+incompatible finding as
      CVE-2026-34040 above (see that entry for the full "client-library-only,
      cannot be bumped" background) -- this is a newly-disclosed CVE against
      the same pinned module version, not a regression from any change in
      this repo. CVE-2026-41567 is a Docker daemon vulnerability in the
      `PUT /containers/{id}/archive` request handler (and the `docker cp`
      upload path that hits the same handler): the daemon resolves
      decompression binaries (e.g. xz/unpigz) from the CONTAINER's filesystem
      instead of the host's due to an operation-ordering bug, letting a
      malicious image trojan those binaries for host-level code execution
      when an operator uploads a compressed archive into it. This is
      server-side request-handling code, not something a client merely
      importing github.com/docker/docker as an API client library would ever
      compile in. Verified directly (not just by the same reasoning as
      CVE-2026-34040): docker/buildx v0.35.0's own committed
      vendor/modules.txt lists exactly ONE package vendored from the entire
      github.com/docker/docker module -- github.com/docker/docker/pkg/
      namesgenerator (a trivial random-container-name generator, unrelated to
      archive/cp handling) -- confirming the actual vulnerable daemon
      code is not present in this binary at all.

      DISACK follow-up, live re-verified 2026-08-14: same re-check as
      CVE-2026-34040 above (see that entry for the full methodology) at the
      exact pinned tag this project builds (docker/buildx v0.35.0) -- its
      real, current vendor/modules.txt still vendors only
      github.com/docker/docker/pkg/namesgenerator from this module, so the
      daemon-side archive/cp handler this CVE actually needs remains absent.
      Not a rebuild-and-Trivy-scan re-check, a live source-tree inspection.

