# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# Trivy security scanner ignore list for accepted vulnerabilities with expiry dates
vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      Not exploitable in these artifacts (vulnerable code not present).
      CVE-2026-34040 is a Docker daemon authorization-plugin bypass: the
      vulnerable code lives entirely in github.com/docker/docker's
      pkg/authorization middleware, and the upstream fix (moby/moby commit
      e89edb19ad7de0407a5d31e3111cb01aa10b5a38, released v29.3.1) changes only
      pkg/authorization/authz.go. docker-compose and docker-buildx embed
      github.com/docker/docker solely as an API client library; they neither
      contain nor execute the daemon-side AuthZ middleware, so the vulnerable
      code path is absent from these CLI plugin binaries and the scanner is
      matching the embedded module version string, not reachable code. A
      version bump does not remove the finding either, verified against upstream
      on 2026-07-25: from v29 the fix lives in newly split, separately versioned
      modules (github.com/moby/moby/client, github.com/moby/moby/api), and there
      is NO v29.x at the old github.com/docker/docker path to pin to (a
      pseudo-version has nothing to point at). docker/buildx master still
      requires github.com/docker/docker v28.5.2+incompatible DIRECTLY, and
      docker/compose main still pulls it in INDIRECTLY, both alongside the new
      moby/moby/client v0.5.0 + moby/moby/api v1.55.0 modules -- upstream's
      migration off the old path is incomplete, so building buildx/compose even
      from their latest main would still embed docker/docker v28.5.2 and trip the
      same scanner match; completing that import migration ourselves would mean
      forking their dependency trees (not viable). This is unlike the grpc
      v1.81.1->v1.82.1 and containerd/containerd/v2 v2.2.4->v2.2.5 minor/patch
      pins those builds already apply (see #787), where a fixed version existed
      at the same module path. Verified against the upstream fix commit's file
      scope AND the current upstream go.mod files. Re-review when upstream
      buildx/compose finish dropping github.com/docker/docker; this is a
      non-exploitability disposition, not a wait for a fix at the old path,
      hence the `status: not_affected` below (generate-vex.sh emits this as
      an OpenVEX not_affected/vulnerable_code_not_present statement, not the
      affected/action_statement shape used for entries genuinely awaiting an
      upstream fix).
    status: not_affected
    expired_at: 2026-11-15
  - id: CVE-2026-41567
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      Not exploitable in these artifacts (vulnerable code not present). Same
      github.com/docker/docker v28.5.2+incompatible finding as CVE-2026-34040
      above (see that entry for the full "client-library-only, cannot be
      bumped" background) -- this is a newly-disclosed CVE against the same
      pinned module version, not a regression from any change in this repo.
      CVE-2026-41567 is a Docker daemon vulnerability in the
      `PUT /containers/{id}/archive` request handler (and the `docker cp`
      upload path that hits the same handler): the daemon resolves
      decompression binaries (e.g. xz/unpigz) from the CONTAINER's filesystem
      instead of the host's due to an operation-ordering bug, letting a
      malicious image trojan those binaries for host-level code execution
      when an operator uploads a compressed archive into it. This is
      server-side request-handling code, not something a client merely
      importing github.com/docker/docker as an API client library would ever
      compile in. Verified directly (not just by the same reasoning as
      CVE-2026-34040): docker/buildx v0.35.0's own committed
      vendor/modules.txt lists exactly ONE package vendored from the entire
      github.com/docker/docker module -- github.com/docker/docker/pkg/
      namesgenerator (a trivial random-container-name generator, unrelated to
      archive/cp handling) -- confirming the actual vulnerable daemon
      code is not present in this binary at all.
    status: not_affected
    expired_at: 2026-11-15
  - id: CVE-2026-42306
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      Not exploitable in these artifacts (vulnerable code not present). Same
      github.com/docker/docker v28.5.2+incompatible finding as CVE-2026-34040
      and CVE-2026-41567 above -- see those entries for the shared
      "client-library-only, cannot be bumped" background. CVE-2026-42306
      (GHSA-rg2x-37c3-w2rh) is a race condition in the Docker daemon's own
      `docker cp` implementation that can redirect a copy through a bind
      mount to write outside the intended container filesystem onto the
      host. Like CVE-2026-41567, this is daemon-side request-handling code,
      confirmed absent from these binaries by the same direct vendor/
      modules.txt check (only github.com/docker/docker/pkg/namesgenerator is
      actually vendored from this module in docker/buildx v0.35.0; neither
      binary implements or executes the daemon's cp handler).
    status: not_affected
    expired_at: 2026-11-15
