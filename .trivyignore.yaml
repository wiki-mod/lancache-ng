# Per-entry `statement:` convention: What: (one line, what is suppressed
# and for which artifact) / Why: (verified non-exploitability or
# accepted-risk reasoning) / Verified: (optional, most recent re-check:
# date, method, result) / From: (Issue/PR reference).
# `status: not_affected` marks vulnerable code confirmed absent or
# unreachable; an omitted `status` marks an accepted, tracked risk.
# `expired_at` is this entry's next mandatory re-review date.
vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-34040 (a Docker daemon authorization-plugin
      bypass) for the docker-compose and docker-buildx CLI plugin binaries.

      Why: Vulnerable code not present. The fix lives entirely in
      github.com/docker/docker's pkg/authorization middleware (upstream
      fix moby/moby commit e89edb19ad7de0407a5d31e3111cb01aa10b5a38,
      v29.3.1, touching only pkg/authorization/authz.go); docker-compose
      and docker-buildx embed github.com/docker/docker only as an API
      client library and never contain or execute that daemon-side
      middleware. A version bump cannot remove the finding: from v29, the
      fix lives in newly split modules (github.com/moby/moby/client,
      github.com/moby/moby/api), with no v29.x release at the old
      github.com/docker/docker path to pin to. Upstream's own migration off
      the old path is incomplete -- docker/buildx main still requires
      github.com/docker/docker v28.5.2+incompatible directly and
      docker/compose main still pulls it in indirectly, alongside the new
      moby/moby/client v0.5.0 + moby/moby/api v1.55.0 modules -- so
      building from either project's latest main would still embed
      docker/docker v28.5.2 and trip the same scanner match; forking their
      dependency trees to complete that migration ourselves is not viable.
      Unlike the grpc v1.81.1->v1.82.1 and containerd/containerd/v2
      v2.2.4->v2.2.5 pins this file already applies (#787), no fixed
      version exists at the same module path here. `status: not_affected`
      reflects this non-exploitability disposition (generate-vex.sh emits
      it as an OpenVEX vulnerable_code_not_present statement, not an
      action_statement awaiting an upstream fix).

      Verified: 2026-07-25, against the upstream fix commit's file scope
      and current upstream go.mod files (master/main branch tips).
      Re-verified 2026-08-14 (expired_at corrected from an earlier
      2026-11-15 to this file's 14-day convention, per maintainer
      decision) at the exact pinned tags this project builds
      (docker/buildx v0.35.0, docker/compose v5.2.0, per
      tools/build-tools/Dockerfile's DOCKER_BUILDX_VERSION/
      DOCKER_COMPOSE_VERSION build args): both tags' real go.mod and
      vendor/modules.txt still pin github.com/docker/docker at
      v28.5.2+incompatible, buildx's vendor/modules.txt still vendors only
      github.com/docker/docker/pkg/namesgenerator from that module, and
      moby/moby's tag list still has no v29.x release at the old path
      (newest tag remains v28.5.2). Source-tree inspection (go.mod/
      vendor/modules.txt/tag list), not a rebuild-and-Trivy-scan.

      From: Issue #1304, PR #1548
    status: not_affected
