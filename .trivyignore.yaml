  - id: CVE-2026-42306
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-42306 (GHSA-rg2x-37c3-w2rh, a Docker daemon
      `docker cp` bind-mount race condition) for the docker-compose and
      docker-buildx CLI plugin binaries.

      Why: Vulnerable code not present -- same github.com/docker/docker
      v28.5.2+incompatible finding as CVE-2026-34040 and CVE-2026-41567
      above (see those entries for the shared background). CVE-2026-42306
      is a race condition in the Docker daemon's own `docker cp`
      implementation that can redirect a copy through a bind mount to
      write outside the intended container filesystem onto the host --
      daemon-side request-handling code, confirmed absent from these
      binaries by the same vendor/modules.txt check (only
      pkg/namesgenerator is vendored from this module in docker/buildx
      v0.35.0; neither binary implements or executes the daemon's cp
      handler).

      Verified: 2026-08-14, at the exact pinned tag this project builds
      (docker/buildx v0.35.0): current vendor/modules.txt still vendors
      only pkg/namesgenerator from this module, so the daemon-side `docker
      cp` handler this CVE needs remains absent. Live source-tree
      inspection, not a rebuild-and-Trivy-scan.

