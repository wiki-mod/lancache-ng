      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-42306 (a Docker daemon `docker cp` bind-mount
      race condition) for the docker-compose and docker-buildx CLI plugin
      binaries only.

      Why: Not exploitable in these artifacts (vulnerable code not present).
      Same github.com/docker/docker v28.5.2+incompatible finding as
      CVE-2026-34040 and CVE-2026-41567 above -- see those entries for the
      shared "client-library-only, cannot be bumped" background.
      CVE-2026-42306 (GHSA-rg2x-37c3-w2rh) is a race condition in the Docker
      daemon's own `docker cp` implementation that can redirect a copy
      through a bind mount to write outside the intended container
      filesystem onto the host. Like CVE-2026-41567, this is daemon-side
