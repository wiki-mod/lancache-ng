vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-34040 (a Docker daemon authorization-plugin
      bypass) for docker-compose/docker-buildx; anchor entry for the
      docker/docker client-library-only group (CVE-2026-41567/42306 below
      share this background).

      Why: Vulnerable code not present -- the fix is daemon-side
      pkg/authorization middleware; these binaries embed
      github.com/docker/docker only as an API client library and never
      compile it. No fixed release exists at the pinned
      v28.5.2+incompatible module path (verified 2026-08-14 against both
      projects' vendored modules).

      From: Issue #1304, PR #1548
    status: not_affected
    expired_at: 2026-08-28
  - id: CVE-2026-41567
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-41567 (a Docker daemon `docker cp`/archive-
      upload host code execution finding) for docker-compose/docker-buildx.

      Why: Same docker/docker client-library-only disposition as
      CVE-2026-34040 above. This is server-side request-handling code in
      the daemon's archive handler; docker/buildx's vendor/modules.txt
      vendors only pkg/namesgenerator, confirming the handler is absent
      (verified 2026-08-14).

      From: Issue #1304, PR #1548
    status: not_affected
    expired_at: 2026-08-28
