      checksum-verified release tarballs via `gzip`, never invoking
      `gzexe` itself or on attacker-supplied input. No `trixie`/
      `trixie-backports` fix exists yet (Debian security-tracker: only
      `sid` has 1.14-1; re-verified 2026-08-19).

