  - id: CVE-2011-4116
    statement: >-
      What: Marks CVE-2011-4116 (`perl-base`'s `File::Temp` module
      creating temporary files predictably/insecurely under certain
      conditions) as not exploitable in `services/ui` and
      `tools/build-tools`. Anchor entry for a 30-ID group (this and the 29
      entries below) spanning the Debian `perl-base`, util-linux
      (`bsdutils`/`libblkid1`/`libmount1`/`liblastlog2-2`/`libsmartcols1`/
      `libuuid1`/`login`/`mount`/`util-linux`), ncurses (`libncursesw6`/
      `libtinfo6`/`ncurses-base`/`ncurses-bin`), `gzip`, and `libacl1`
      package groups.

      Why: All 30 are `Priority: required`/`Essential: yes` Debian
      packages or their hard link-time dependents (per #815 Part C's own
      package-index audit), so none can be purged the way `gnupg`/`curl`
      were for other findings -- "not exploitable" is the only available
      disposition short of migrating the image off Debian entirely (issue
      #815's own broader migration direction; `services/dns`/
      `services/ntp`/`services/dhcp`/`services/dhcp-proxy`/
      `services/watchdog` already moved to `alpine:3.24` for exactly this
      class of reason, among others, and carry zero findings in this group
      on the same full-severity scan). `perl-base` itself is present only
      as a `Priority: required` base-Debian dependency, never installed or
      invoked by this project's own Dockerfiles or scripts; a grep of
      every script this project controls in both images
      (`services/ui/docker-entrypoint.sh`; every `RUN`/`COPY`d script in
      `tools/build-tools/Dockerfile`) for literal `perl` invocation found
      zero hits in either image, so `File::Temp`'s insecure-tempfile
      behavior can never trigger regardless of what upstream tooling
      (cargo, git, docker CLI, etc.) does internally, none of which are
      Perl-based.

      Verified: 2026-08-06, real full-severity (not just HIGH/CRITICAL)
      Trivy scan against both images' `sha-cc5a272` builds, surfacing this
      and the 29 other entries below across the same 5 package groups
      issues #1298/#815 Part C already tracked at HIGH/CRITICAL severity,
      now confirmed to also carry LOW/MEDIUM/UNKNOWN-severity findings.

