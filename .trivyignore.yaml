      same direct vendor/modules.txt check (only
      github.com/docker/docker/pkg/namesgenerator is actually vendored from
      this module in docker/buildx v0.35.0; neither binary implements or
      executes the daemon's cp handler).

      DISACK follow-up, live re-verified 2026-08-14: same re-check as
      CVE-2026-34040 above (see that entry for the full methodology) at the
      exact pinned tag this project builds (docker/buildx v0.35.0) -- its
      real, current vendor/modules.txt still vendors only
      github.com/docker/docker/pkg/namesgenerator from this module, so the
      daemon-side `docker cp` handler this CVE actually needs remains
      absent. Not a rebuild-and-Trivy-scan re-check, a live source-tree
      inspection.

