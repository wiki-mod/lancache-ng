  - id: CVE-2026-12064
    statement: >-
      What: Accepts CVE-2026-12064 (an SSH host-verification bypass via
      schemeless SFTP/SCP URLs) as tracked risk for `libcurl4t64` in
      `tools/build-tools`. Anchor entry for this file's curl group
      (CVE-2026-8286/8458/8927/8932/9079/9080/9545/10536 below).

      Why: Trivy reports `Status: affected`, `FixedVersion: None`; no
      `paths:` scoping applies since Trivy's Debian os-pkgs finding class
      carries no `PkgPath`. This file's from-source curl/git build purges
      Debian's `curl`/`libcurl3t64-gnutls` entirely; `libcurl4t64`
      remains solely as `cmake`'s package dependency
      (`apt-get autoremove` strips cmake once it's purged) and drives only
      already-vendored C/C++ builds (e.g. aws-lc-sys/BoringSSL for
      services/ui), never a network fetch. Verified via a real Trivy scan
      of the current image (2026-08-24, lancache-229): every finding in
      this group attributes solely to `libcurl4t64`; `curl`/
      `libcurl3t64-gnutls` no longer appear at all.

      From: Issue #1304, PR #1661
    expired_at: 2026-09-07
