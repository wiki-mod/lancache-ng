  - id: CVE-2026-12064
    statement: >-
      What: Accepts CVE-2026-12064 (an SSH host-verification bypass via
      schemeless SFTP/SCP URLs) as tracked risk for `tools/build-tools`'s
      `curl`/`libcurl4t64`/`libcurl3t64-gnutls` package.

      Why: Not a non-exploitability disposition. This
      entry's own disposition for this CVE ID is stated precisely as what
      was actually measured, not overstated: Trivy reports it
      `Status: affected`, `FixedVersion: None` against the currently
      installed package (see below); whether that reflects a genuinely
      unfixed condition or a Debian-tracker/Trivy-DB mapping gap on a
      package that is nominally at curl's own stated fixed version is NOT
      resolved by this review -- a 2026-07-31 comment on this same tracked
      issue already raised exactly this question ("could be Trivy's vulnerability
      DB... not yet having the fixed-at-8.21.0 mapping recorded") and it
      remains open. CVE-2026-12064 itself is an SSH host-verification
      bypass triggered by schemeless URLs used with SFTP/SCP.

      2026-08-15 checkpoint re-review (performed 2026-08-14, via real
      execution on self-hosted runner lancache-240, not from tracker
      websites alone -- see this entry's own prior history for why that
      distinction matters): all 5 originally-named First-Party images
      (`services/proxy`, `services/dns`, `services/watchdog`, `services/ui`,
      `services/ntp`) share the byte-identical Alpine base image digest
      `alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b`
      (grep-confirmed across all 5 Dockerfiles' `FROM` lines) and each
      installs `curl` via the same `apk add curl` mechanism from the same
      package repositories. Built `services/proxy` for real from
      `current_dev` (`docker buildx build --build-arg
      BUILD_TOOLS_IMAGE=... --build-context dns-domains=services/dns
      services/proxy`), confirmed `curl 8.21.0` installed via `curl
      --version` inside the built image, then ran a real
      `aquasec/trivy:latest` (v0.73.0) scan --
      `trivy image --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --scanners vuln`,
      no `.trivyignore.yaml` applied: 0 total findings of any severity,
      this CVE ID and the rest of this group entirely absent. Cross-checked
      against a second, independently-published image
      (`ghcr.io/wiki-mod/lancache-ng/dns:nightly`, pulled fresh): also
      resolves to `curl 8.21.0` and produces the identical real-scan result
      (0 findings). `services/watchdog`/`services/ui`/`services/ntp` were
      not separately rebuilt this pass -- the load-bearing fact for
      generalizing to them is the shared base-image digest plus the
      identical `apk` install mechanism verified at `curl 8.21.0` on 2 of
      the 5 images, not any property of Trivy's finding class itself.
      **Real, separate finding, not previously documented anywhere in this
      entry**: `tools/build-tools`'s own image (built via
      `scripts/select-build-tools-image.sh` from `current_dev`, tag
      `lancache-ng-build-tools-validation:local-local-1`) is Debian-based
      (`rust:latest`) and installs `curl`/`libcurl4t64`/`libcurl3t64-gnutls`
      from `trixie-backports` at `8.21.0-2~bpo13+1` -- confirmed via
      `dpkg -l` inside the built image. Real Trivy scans against this image
      at both `--severity HIGH,CRITICAL` and the full
      `UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL` range (same date, same runner)
      found this CVE ID reported: `Status: affected`, `FixedVersion: None`.
      This is a real gap in every prior version of this entry, which only
      ever discussed the 5 runtime service images and never mentioned
      `tools/build-tools` as needing this suppression, even though the
      no-`paths:`-scoping design (re-confirmed below) means it always
      covered `tools/build-tools` too the moment that image also carried an
      affected `curl` package. `tools/build-tools`'s actual `curl` usage
      (grep-confirmed 2026-08-14, `tools/build-tools/Dockerfile`): every
      invocation is `curl -fsSL "https://github.com/.../releases/download/..."`
      against a small, fixed set of pinned GitHub-release URLs
      (`cargo-audit`, `cargo-tarpaulin`, `shellspec`) -- no schemeless
      SFTP/SCP URL, matching the same non-triggering usage shape already
      established for the 5 runtime images' healthcheck/monitoring-loop
      calls. This entry therefore now names `tools/build-tools` as its real,
      live scope; the 5 originally-named runtime images no longer need it
      (their own Alpine-migration accuracy notes above stay as historical
      background, unedited, per this file's convention of not rewriting
      prior findings). No `paths:` scoping is given for this entry: Trivy's
      `os-pkgs`/`debian` finding class -- how curl/libcurl4t64 are detected
      here, being installed via `apt`/`dpkg` rather than a
      language-specific analyzer -- carries no `PkgPath` at all, unlike
      this file's existing Go-binary entries above (`docker-compose`/
      `docker-buildx`, scanned by Trivy's `gobinary` analyzer, which
      genuinely does report a file path). Confirmed empirically on a real
      build of the proxy image (prior finding, still valid): an ignore
      entry for this same CVE ID with a populated but bogus `paths:` value
      (`usr/bin/curl`) did NOT suppress the finding, while an otherwise
      identical entry with no `paths:` field at all DID suppress it
      cleanly. This is a time-boxed acceptance, not an indefinite one:
      re-review on or before 2026-08-28 -- rebuild and re-scan
      `tools/build-tools` at that time, at full severity range (a HIGH-only
      scan alone previously missed 4 sibling IDs in this same group that had
      been reclassified to MEDIUM, see CVE-2026-8932 below); if
      trixie/backports/sid has shipped a fix for this CVE ID by then, drop
      this entry; if not, revisit (extend, or investigate a narrower `curl`
      footprint for `tools/build-tools`). See this entry's linked issue (From:
      below) for the complete historical Trivy evidence per image and the maintainer's original
      recorded decision, and this checkpoint's own real-execution findings
      above.

