# lancache-ng (https://github.com/wiki-mod/lancache-ng)
# Trivy security scanner ignore list for accepted vulnerabilities with expiry dates
vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      Not exploitable in these artifacts (vulnerable code not present).
      CVE-2026-34040 is a Docker daemon authorization-plugin bypass: the
      vulnerable code lives entirely in github.com/docker/docker's
      pkg/authorization middleware, and the upstream fix (moby/moby commit
      e89edb19ad7de0407a5d31e3111cb01aa10b5a38, released v29.3.1) changes only
      pkg/authorization/authz.go. docker-compose and docker-buildx embed
      github.com/docker/docker solely as an API client library; they neither
      contain nor execute the daemon-side AuthZ middleware, so the vulnerable
      code path is absent from these CLI plugin binaries and the scanner is
      matching the embedded module version string, not reachable code. A
      version bump does not remove the finding either, verified against upstream
      on 2026-07-25: from v29 the fix lives in newly split, separately versioned
      modules (github.com/moby/moby/client, github.com/moby/moby/api), and there
      is NO v29.x at the old github.com/docker/docker path to pin to (a
      pseudo-version has nothing to point at). docker/buildx master still
      requires github.com/docker/docker v28.5.2+incompatible DIRECTLY, and
      docker/compose main still pulls it in INDIRECTLY, both alongside the new
      moby/moby/client v0.5.0 + moby/moby/api v1.55.0 modules -- upstream's
      migration off the old path is incomplete, so building buildx/compose even
      from their latest main would still embed docker/docker v28.5.2 and trip the
      same scanner match; completing that import migration ourselves would mean
      forking their dependency trees (not viable). This is unlike the grpc
      v1.81.1->v1.82.1 and containerd/containerd/v2 v2.2.4->v2.2.5 minor/patch
      pins those builds already apply (see #787), where a fixed version existed
      at the same module path. Verified against the upstream fix commit's file
      scope AND the current upstream go.mod files. Re-review when upstream
      buildx/compose finish dropping github.com/docker/docker; this is a
      non-exploitability disposition, not a wait for a fix at the old path,
      hence the `status: not_affected` below (generate-vex.sh emits this as
      an OpenVEX not_affected/vulnerable_code_not_present statement, not the
      affected/action_statement shape used for entries genuinely awaiting an
      upstream fix).
    status: not_affected

  - id: CVE-2026-41567
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      Not exploitable in these artifacts (vulnerable code not present). Same
      github.com/docker/docker v28.5.2+incompatible finding as CVE-2026-34040
      above (see that entry for the full "client-library-only, cannot be
      bumped" background) -- this is a newly-disclosed CVE against the same
      pinned module version, not a regression from any change in this repo.
      CVE-2026-41567 is a Docker daemon vulnerability in the
      `PUT /containers/{id}/archive` request handler (and the `docker cp`
      upload path that hits the same handler): the daemon resolves
      decompression binaries (e.g. xz/unpigz) from the CONTAINER's filesystem
      instead of the host's due to an operation-ordering bug, letting a
      malicious image trojan those binaries for host-level code execution
      when an operator uploads a compressed archive into it. This is
      server-side request-handling code, not something a client merely
      importing github.com/docker/docker as an API client library would ever
      compile in. Verified directly (not just by the same reasoning as
      CVE-2026-34040): docker/buildx v0.35.0's own committed
      vendor/modules.txt lists exactly ONE package vendored from the entire
      github.com/docker/docker module -- github.com/docker/docker/pkg/
      namesgenerator (a trivial random-container-name generator, unrelated to
      archive/cp handling) -- confirming the actual vulnerable daemon
      code is not present in this binary at all.
    status: not_affected

  - id: CVE-2026-42306
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      Not exploitable in these artifacts (vulnerable code not present). Same
      github.com/docker/docker v28.5.2+incompatible finding as CVE-2026-34040
      and CVE-2026-41567 above -- see those entries for the shared
      "client-library-only, cannot be bumped" background. CVE-2026-42306
      (GHSA-rg2x-37c3-w2rh) is a race condition in the Docker daemon's own
      `docker cp` implementation that can redirect a copy through a bind
      mount to write outside the intended container filesystem onto the
      host. Like CVE-2026-41567, this is daemon-side request-handling code,
      confirmed absent from these binaries by the same direct vendor/
      modules.txt check (only github.com/docker/docker/pkg/namesgenerator is
      actually vendored from this module in docker/buildx v0.35.0; neither
      binary implements or executes the daemon's cp handler).
    status: not_affected

  - id: CVE-2026-12064
    statement: >-
      Accepted, tracked risk -- not a non-exploitability disposition; curl's
      vulnerable code genuinely is present here. CVE-2026-12064 is an SSH
      host-verification bypass triggered by schemeless URLs used with
      SFTP/SCP. Affects `curl`/`libcurl4t64` identically at both
      8.14.1-2+deb13u4 (plain Debian trixie) and 8.21.0-2~bpo13+1
      (trixie-backports) across every first-party image that installs curl
      at all: `services/proxy`, `services/dns`, `services/watchdog`,
      `services/ui`, and `services/ntp` -- confirmed by a real, controlled
      before/after Trivy scan run separately against each of those 5 images
      (see issue #1304 for the full investigation and the
      maintainer's recorded acceptance decision). No fix exists anywhere as
      of 2026-07-30 (`FixedVersion: None` in Trivy's DB for trixie,
      backports, and sid alike) -- disclosed 2026-07-03, after curl 8.21.0
      itself shipped, so the backports move that fixed an earlier, different
      CVE set for this same package does not touch this one. Accepted for
      now because curl's actual usage across these 5 images is narrow and,
      case by case, does not reach any of these CVEs' trigger conditions --
      not one single shared usage pattern, so stated precisely per image
      rather than generalized: `services/proxy` and `services/ui` invoke
      curl only for a Compose healthcheck's plain loopback GET (`curl -sf
      http://127.0.0.1/...` / `curl -ksf https://127.0.0.1/...`, see each
      Dockerfile's own comment block and the matching `healthcheck:` block in
      `deploy/prod`, `deploy/quickstart`, and `deploy/full-setup`); no
      SFTP/SCP schemeless URL, no proxy configuration, no mTLS client
      certificates, no custom libcurl callback API usage, and no long-lived
      process reusing a cached TLS session (each healthcheck run is a
      fresh, short-lived curl process). `services/dns` invokes curl only
      for `nats-subscriber`'s internal rollback-listener probe, run via
      `docker compose exec` -- a comparable narrow, internal, loopback-only
      invocation, but not a Compose `healthcheck:` block itself (see
      `services/dns/Dockerfile`'s own comment for the exact usage).
      `services/watchdog` invokes curl repeatedly from `watchdog.sh`'s own
      monitoring loop (`get_health()`/`restart_container()`) against
      `DOCKER_PROXY_URL` (`http://docker-socket-proxy:2375` by default) --
      periodic plain-HTTP GET/POST calls to an internal, non-TLS
      Docker-network service (`docker-socket-proxy`), not a loopback
      Compose healthcheck and not TLS at all, so no SFTP/SCP schemeless
      URL, no mTLS, and no TLS session reuse either; each call is bounded
      by an explicit `--max-time`. Accuracy update (2026-07-31): `services/watchdog`
      migrated off `debian:13-slim` to `alpine:3.24` (issue #815's watchdog
      carve-out) after this entry was written, so it no longer carries the
      `curl`/`libcurl4t64` package versions named above -- it now ships
      Alpine's own `curl` 8.21.0-r0 build. A real Trivy scan of the rebuilt
      image (with and without `--ignore-unfixed`, same flags this project's
      CI uses) shows none of this CVE-2026-12064 finding group present at
      all for that image, so this entry's own watchdog-specific
      risk-acceptance narrative above is now historical background for that
      one image, not a live disposition it still needs -- the entry stays in
      force for the other Debian-based images it still names
      (`services/proxy`, `services/dns`, `services/ui`; `services/ntp`'s own
      status is tracked separately and not asserted here). `services/ntp` is the
      exception to all of the above: curl is installed but genuinely never
      invoked at all -- confirmed by PR #1311 (`services/ntp/entrypoint.sh`
      renders `chrony.conf` with plain shell, not `curl`, and its Compose
      healthcheck uses `chronyc tracking`, not curl) -- an even stronger
      argument for acceptance here than a narrow-but-real invocation, since
      no code path in this image executes curl at all today. No
      `paths:` scoping is given for this entry: Trivy's `os-pkgs`/`debian`
      finding class -- how curl/libcurl4t64 are detected here, being
      installed via `apt`/`dpkg` rather than a language-specific analyzer --
      carries no `PkgPath` at all, unlike this file's existing Go-binary
      entries above (`docker-compose`/`docker-buildx`, scanned by Trivy's
      `gobinary` analyzer, which genuinely does report a file path).
      Confirmed empirically on a real build of the proxy image: an ignore
      entry for this same CVE ID with a populated but bogus `paths:` value
      (`usr/bin/curl`) did NOT suppress the finding, while an otherwise
      identical entry with no `paths:` field at all DID suppress it cleanly
      -- for exactly this CVE ID, on both `curl` and `libcurl4t64`, and
      nothing else (diffed the full before/after finding list, not just
      exit code). A `paths:` list on this entry would therefore silently
      never match and the finding would remain unsuppressed; scoping is
      instead inherent to the CVE ID itself, since every ID in this group of
      7 is curl/libcurl-specific in Trivy's own vulnerability database and
      cannot match any other package. This is a time-boxed acceptance, not
      an indefinite one: re-review on or before 2026-08-15 -- if trixie,
      backports, or sid has shipped a fix for any of these 7 CVE IDs by
      then, drop the corresponding entries and rebuild; if not, this
      decision needs to be revisited (extend the acceptance, or migrate the
      affected images off curl entirely). See issue #1304 for the
      complete before/after Trivy evidence per image and the maintainer's
      recorded decision.

