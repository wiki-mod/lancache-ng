  - id: CVE-2026-41991
    statement: >-
      Accepted, tracked risk for `tools/build-tools` only -- not a
      non-exploitability disposition there; genuinely narrow but real
      exploitability. Not affected at all for `services/ui` (see below).
      Real, full-severity Trivy scan (issue #815 Part C, 2026-08-06) found
      this and CVE-2026-41992 below against `gzip` 1.13-1 on both images'
      `sha-cc5a272` builds; this is the only one of the 30 findings in this
      batch where the two images' exploitability genuinely differs, so it is
      NOT grouped under the blanket "not_affected" disposition the other 28
      IDs in this batch use (see CVE-2011-4116 for that group's shared
      background). CVE-2026-41991 is an arbitrary-file-overwrite via insecure
      temporary-file handling in the `gzexe` utility specifically (not plain
      `gzip`/`gunzip` decompression) -- confirmed via a real grep of both
      images' own scripts: `services/ui/docker-entrypoint.sh` never invokes
      `gzip`, `gunzip`, or `gzexe` at all, so this CVE ID's own non-`gzexe`
      disposition would also be `not_affected` there taken alone, but since
      Trivy's finding applies per-CVE-ID repo-wide (no per-image `paths:`
      scoping works for Debian os-pkgs findings, confirmed by this file's own
      existing curl-group entries), the disposition for this ID must reflect
      the MORE exploitable of the two images, hence "accepted" rather than
      "not_affected" for this specific ID. `tools/build-tools/Dockerfile`
      installs `gzip` explicitly (its own package list) and its build
      process invokes `gzip`/`tar` transitively to unpack pinned,
      checksum-verified upstream release tarballs when fetching
      prebuilt tool binaries (see AG-KD-003's own build-tools tooling
      history) -- never `gzexe` specifically, and never on attacker-supplied
      input (every archive fetched is a specific pinned URL/version, verified
      by checksum before use, not user- or CI-caller-controlled). This is a
      narrow, indirect, checksum-gated reachability path for `gzexe`'s own
      finding specifically (which this image's actual usage does not even
      reach, since `gzexe` itself is never invoked) -- flagged as accepted
      risk rather than not_affected purely for the repo-wide-per-CVE-ID
      scoping reason above, not because a real exploitation path was found.
    expired_at: 2026-08-20
  - id: CVE-2026-41992
    statement: >-
      Same gzip finding group as CVE-2026-41991 above (see that entry for the
      full background: why this ID is "accepted" rather than "not_affected"
      despite `services/ui` never invoking `gzip` at all). This is the
      HIGH-severity finding issue #815 Part C's original baseline already
      tracked: a global buffer overflow in gzip's own LZH decompression
      path (`.lzh`/SCO-compress-format support, a legacy, rarely-used gzip
      decompression mode). `tools/build-tools`'s own gzip usage (unpacking
      pinned, checksum-verified plain `.tar.gz` release tarballs) never
      exercises the LZH code path at all -- gzip only invokes LZH decoding
      for input explicitly identified as LZH-formatted, which a plain gzip
      tarball is not. Re-review by 2026-08-20 alongside CVE-2026-41991.
    expired_at: 2026-08-20
