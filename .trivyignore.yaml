  - id: CVE-2011-4116
    statement: >-
      Not exploitable in `services/ui` or `tools/build-tools` (vulnerable code
      not present in any reachable path). Real, full-severity (not just
      HIGH/CRITICAL) Trivy scan against both images' `sha-cc5a272` builds
      (issue #815 Part C, 2026-08-06) surfaced this and the 29 other entries
      below across the Debian `perl-base`, util-linux (`bsdutils`/
      `libblkid1`/`libmount1`/`liblastlog2-2`/`libsmartcols1`/`libuuid1`/
      `login`/`mount`/`util-linux`), ncurses (`libncursesw6`/`libtinfo6`/
      `ncurses-base`/`ncurses-bin`), `gzip`, and `libacl1` package groups --
      the same 5 groups issue #1298/#815 Part C already tracked at
      HIGH/CRITICAL severity, now confirmed to carry additional LOW/MEDIUM/
      UNKNOWN-severity findings too once scanned at full severity. All 30 are
      `Priority: required`/`Essential: yes` Debian packages or their hard
      link-time dependents (per #815 Part C's own package-index audit),
      so none can be purged the way `gnupg`/`curl` were for other findings --
      "not exploitable" is the only available disposition short of migrating
      the image off Debian entirely (issue #815's own broader migration
      direction; `services/dns`/`services/ntp`/`services/dhcp`/
      `services/dhcp-proxy`/`services/watchdog` already moved to `alpine:3.24`
      for exactly this class of reason, among others, and no longer carry any
      finding in this group at all -- confirmed by the same full-severity scan
      finding zero hits on either image). This specific entry: `perl-base`'s
      `File::Temp` module creates temporary files predictably/insecurely
      under certain conditions. Confirmed via a real grep of every script this
      project actually controls and runs inside these two images
      (`services/ui/docker-entrypoint.sh`; every `RUN`/`COPY`d script in
      `tools/build-tools/Dockerfile`) for literal `perl` invocation: zero
      hits in `services/ui`, and zero hits in `tools/build-tools` either --
      neither image's own code ever invokes the Perl interpreter at all, so
      `File::Temp`'s insecure-tempfile behavior can never trigger regardless
      of what upstream tooling (cargo, git, docker CLI, etc.) might do
      internally, none of which are Perl-based. `perl-base` is present only
      as a `Priority: required` base-Debian dependency, never installed or
      invoked by this project's own Dockerfiles or scripts.
    status: not_affected
    expired_at: 2026-08-20
