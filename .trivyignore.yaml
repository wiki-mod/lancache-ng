  - id: CVE-2026-41567
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
      - usr/local/lib/docker/cli-plugins/docker-buildx
    statement: >-
      What: Suppresses CVE-2026-41567 (a Docker daemon `docker cp`/archive-
      upload host code execution finding) for the docker-compose and
      docker-buildx CLI plugin binaries.

      Why: Vulnerable code not present -- same github.com/docker/docker
      v28.5.2+incompatible module as CVE-2026-34040 above (see that entry
      for the "client-library-only, cannot be bumped" background); this is
      a newly-disclosed CVE against the same pinned version, not a
      regression from any change in this repo. CVE-2026-41567 is a Docker
      daemon vulnerability in the `PUT /containers/{id}/archive` handler
      (and the `docker cp` upload path that hits it): the daemon resolves
      decompression binaries (e.g. xz/unpigz) from the CONTAINER's
      filesystem instead of the host's due to an operation-ordering bug,
      letting a malicious image trojan those binaries for host-level code
      execution. This is server-side request-handling code a client
      importing github.com/docker/docker only as an API client library
      never compiles in. docker/buildx v0.35.0's own committed
      vendor/modules.txt lists exactly one package vendored from the
      github.com/docker/docker module -- pkg/namesgenerator, a trivial
      random-container-name generator unrelated to archive/cp handling --
      confirming the actual vulnerable daemon code is absent from this
      binary.

      Verified: 2026-08-14, at the exact pinned tag this project builds
      (docker/buildx v0.35.0): current vendor/modules.txt still vendors
      only pkg/namesgenerator from this module, so the daemon-side
      archive/cp handler this CVE needs remains absent. Live source-tree
      inspection, not a rebuild-and-Trivy-scan.

